<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Студия · Между уроками</title>
  <meta name="description" content="Соберите тренажёр для учеников из своих материалов">
  <meta name="theme-color" content="#5B3DF5">
  <link rel="icon" href="../icons/favicon-48.png" sizes="48x48">
  <link rel="icon" href="../icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../app.css">
  <link rel="modulepreload" href="../lib.js">
  <link rel="modulepreload" href="../account.js">
  <script src="../config.js"></script>
  <script>
    // QR-код ссылки (vendor/qrcode.js, 57 КБ) нужен только на вкладке «Ссылка» — грузим по требованию:
    // await window.loadQR() перед рисованием QR. Не падает: без сети просто не будет window.qrcode
    window.loadQR = () => window.qrcode ? Promise.resolve(window.qrcode) : window.__qr || (window.__qr = new Promise(ok => {
      const s = document.createElement('script');
      s.src = '../vendor/qrcode.js';
      s.onload = () => ok(window.qrcode);
      s.onerror = () => { window.__qr = null; s.remove(); ok(undefined); };
      document.head.append(s);
    }));
    // Офлайн и быстрые переходы (sw.js) — и для тех, кто открывает сразу студию, минуя главную
    if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
  </script>
</head>
<body>
  <main id="app" class="wrap wide"><p class="loading">Загружаю…</p></main>
  <script type="module" src="studio.js"></script>
</body>
</html>
