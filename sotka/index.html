у"},{"id":"б","t":"контрыгру"}],"c":"а","e":"Контр- — иноязычная приставка, после неё пишется и (не ы). Ответ: контригру."},{"id":"x-rus-t10-g33","k":"mc","les":"RU030","task":10,"q":"Дан ответ: в слове пишется Ы. В каком слове это верно?","o":[{"id":"а","t":"под_тожить результаты"},{"id":"б","t":"сверх_зысканный"},{"id":"в","t":"дез_нформация"},{"id":"г","t":"пан_сламизм"}],"c":"а","e":"Ы пишется после русской приставки на согласную: под- + итог → подытожить. Остальные — и: сверхизысканный (искл. сверх-), дезинформация и панисламизм (иноязычные приставки). Ответ: подытожить."},{"id":"x-rus-t10-g34","k":"mc","les":"RU030","task":10,"q":"В каком слове после приставки пишется И?","o":[{"id":"а","t":"раз_скать"},{"id":"б","t":"из_скать"},{"id":"в","t":"от_грать"},{"id":"г","t":"супер_гра"}],"c":"г","e":"И сохраняется после иноязычной приставки супер-: суперигра. Остальные — русские приставки на согласную, там и→ы: разыскать, изыскать, отыграть. Ответ: суперигра."},{"id":"x-rus-t11-g01","k":"mc","les":"RU032","task":11,"q":"На двери висит тяжёлый замоч_к. Какую букву писать?","o":[{"id":"а","t":"-ек- (замочек)"},{"id":"б","t":"-ик- (замочик)"}],"c":"а","e":"Склоняем: замочек — замоЧКа. Гласная суффикса выпала (беглая), значит пишем -ек-: замочек."},{"id":"x-rus-t11-g02","k":"mc","les":"RU032","task":11,"q":"Бабушка подарила пуховый платоч_к. Какую букву писать?","o":[{"id":"а","t":"-ек- (платочек)"},{"id":"б","t":"-ик- (платочик)"}],"c":"а","e":"Ставим в родительный падеж: платочек — платоЧКа. Гласная выпадает, поэтому суффикс -ек-."},{"id":"x-rus-t11-g03","k":"mc","les":"RU032","task":11,"q":"Мальчик бросил резиновый мяч_к. Какую букву писать?","o":[{"id":"а","t":"-ек- (мячек)"},{"id":"б","t":"-ик- (мячик)"}],"c":"б","e":"Склоняем: мячик — мячИка. Гласная сохраняется, значит пишем -ик-: мячик."},{"id":"x-rus-t11-g04","k":"mc","les":"RU032","task":11,"q":"Он уколол маленький пальч_к. Какую букву писать?","o":[{"id":"а","t":"-ек- (пальчек)"},{"id":"б","t":"-ик- (пальчик)"}],"c":"б","e":"Ставим в родительный падеж: пальчик — пальчИка. Гласная не выпадает — пишем -ик-."},{"id":"x-rus-t11-g05","k":"mc","les":"RU032","task":11,"q":"В стручке спрятался зелёный горош_к. Какую букву писать?","o":[{"id":"а","t":"-ек- (горошек)"},{"id":"б","t":"-ик- (горошик)"}],"c":"а","e":"Склоняем: горошек — гороШКа. Гласная выпадает, поэтому суффикс -ек-."},{"id":"x-rus-t11-g06","k":"mc","les":"RU032","task":11,"q":"Найди ВЕРНЫЙ вариант — слово, где пишется -ик-.","o":[{"id":"а","t":"ключик"},{"id":"б","t":"замочек"},{"id":"в","t":"звоночек"},{"id":"г","t":"горошек"}],"c":"а","e":"Проверяем родительным падежом. Ключик — ключИка: гласная сохраняется → -ик-. У остальных гласная выпадает (замоЧКа, звоНОЧКа→звоночка, гороШКа) → там -ек-."},{"id":"x-rus-t11-g07","k":"mc","les":"RU032","task":11,"q":"Дано: в слове «орешек» пишется -ек-. Выбери верное объяснение.","o":[{"id":"а","t":"При склонении гласная выпадает: орешек — ореШКа"},{"id":"б","t":"Гласная сохраняется: орешек — орешика"},{"id":"в","t":"Слово мужского рода, поэтому -ек-"},{"id":"г","t":"Суффикс стоит под ударением"}],"c":"а","e":"Правило -ек/-ик проверяется склонением: орешек — ореШКа, гласная беглая (выпадает), значит -ек-. Род и ударение здесь ни при чём."},{"id":"x-rus-t11-g08","k":"mc","les":"RU032","task":11,"q":"Опытный перевод_ик знал три языка. Какую букву писать?","o":[{"id":"а","t":"-чик- (переводчик)"},{"id":"б","t":"-щик- (переводщик)"}],"c":"а","e":"Перед суффиксом стоит согласная д. После д–т–з–с–ж пишется -чик-, поэтому переводчик."},{"id":"x-rus-t11-g09","k":"mc","les":"RU032","task":11,"q":"На вокзале работал груз_ик. Какую букву писать?","o":[{"id":"а","t":"-чик- (грузчик)"},{"id":"б","t":"-щик- (грузщик)"}],"c":"а","e":"Перед суффиксом согласная з. Она входит в ряд д–т–з–с–ж, значит пишем -чик-: грузчик."},{"id":"x-rus-t11-g10","k":"mc","les":"RU032","task":11,"q":"Дом строил умелый камен_ик. Какую букву писать?","o":[{"id":"а","t":"-чик- (каменчик)"},{"id":"б","t":"-щик- (каменщик)"}],"c":"б","e":"Перед суффиксом согласная н. Её нет в ряду д–т–з–с–ж, поэтому пишем -щик-: каменщик."},{"id":"x-rus-t11-g11","k":"mc","les":"RU032","task":11,"q":"Фонари зажигал старый фонар_ик. Какую букву писать?","o":[{"id":"а","t":"-чик- (фонарчик)"},{"id":"б","t":"-щик- (фонарщик)"}],"c":"б","e":"Перед суффиксом согласная р, её нет в ряду д–т–з–с–ж, значит пишем -щик-: фонарщик."},{"id":"x-rus-t11-g12","k":"mc","les":"RU032","task":11,"q":"Самолётом управлял опытный лёт_ик. Какую букву писать?","o":[{"id":"а","t":"-чик- (лётчик)"},{"id":"б","t":"-щик- (лётщик)"}],"c":"а","e":"Перед суффиксом согласная т — она из ряда д–т–з–с–ж, поэтому -чик-: лётчик."},{"id":"x-rus-t11-g13","k":"mc","les":"RU032","task":11,"q":"Найди ВЕРНЫЙ вариант — слово, где пишется -щик-.","o":[{"id":"а","t":"развед_ик"},{"id":"б","t":"смаз_ик"},{"id":"в","t":"бетон_ик"},{"id":"г","t":"лёт_ик"}],"c":"в","e":"Смотрим на согласную перед суффиксом. Бетонщик — перед суффиксом н (нет в ряду д–т–з–с–ж) → -щик-. Остальные: развеДчик (д), смаЗчик (з), лёТчик (т) → -чик-."},{"id":"x-rus-t11-g14","k":"mc","les":"RU032","task":11,"q":"Дано: «разносчик» пишется через -чик-. Выбери верное объяснение.","o":[{"id":"а","t":"Основа оканчивается на с — буква из ряда д, т, з, с, ж"},{"id":"б","t":"Основа оканчивается на р"},{"id":"в","t":"Слово женского рода"},{"id":"г","t":"Суффикс стоит под ударением"}],"c":"а","e":"-чик- пишется после д, т, з, с, ж. В слове разноСчик перед суффиксом стоит с, поэтому -чик-."},{"id":"x-rus-t11-g15","k":"mc","les":null,"task":11,"q":"Мой стар_ий брат_ц уехал в город. Какую букву писать в суффиксе?","o":[{"id":"а","t":"-ец- (братец)"},{"id":"б","t":"-иц- (братиц)"}],"c":"а","e":"Слово «братец» мужского рода. В существительных мужского рода пишется суффикс -ец-: братец."},{"id":"x-rus-t11-g16","k":"mc","les":null,"task":11,"q":"За окном кружилась снежная метел_ца. Какую букву писать?","o":[{"id":"а","t":"-ец- (метелеца)"},{"id":"б","t":"-иц- (метелица)"}],"c":"б","e":"Слово «метелица» женского рода. В существительных женского рода пишется -иц-: метелица."},{"id":"x-rus-t11-g17","k":"mc","les":null,"task":11,"q":"Дедушка надел тёплое пальт_цо. Какую букву писать?","o":[{"id":"а","t":"-ец- (пальтецо)"},{"id":"б","t":"-иц- (пальтицо)"}],"c":"а","e":"Слово среднего рода. Ставим ударение: пальтецО — оно падает на окончание, значит пишется -ец-: пальтецо."},{"id":"x-rus-t11-g18","k":"mc","les":null,"task":11,"q":"В углу стояло мягкое кресл_це. Какую букву писать?","o":[{"id":"а","t":"-ец- (креслецо)"},{"id":"б","t":"-иц- (креслице)"}],"c":"б","e":"Слово среднего рода. Ударение: крЕслице — падает перед суффиксом, значит пишется -иц-: креслице."},{"id":"x-rus-t11-g19","k":"mc","les":null,"task":11,"q":"Утром ударил лёгкий мороз_ц. Какую букву писать?","o":[{"id":"а","t":"-ец- (морозец)"},{"id":"б","t":"-иц- (морозиц)"}],"c":"а","e":"Слово «морозец» мужского рода, а в мужском роде пишется -ец-: морозец."},{"id":"x-rus-t11-g20","k":"mc","les":null,"task":11,"q":"Найди ВЕРНЫЙ вариант — слово, где пишется -иц-.","o":[{"id":"а","t":"брат_ц"},{"id":"б","t":"мороз_ц"},{"id":"в","t":"лестн_ца"},{"id":"г","t":"владел_ц"}],"c":"в","e":"Лестница — женский род, значит -иц-. Остальные — мужской род (братец, морозец, владелец) → там -ец-."},{"id":"x-rus-t11-g21","k":"mc","les":null,"task":11,"q":"Дано: «письмецо» пишется с -ец-. Выбери верное объяснение.","o":[{"id":"а","t":"Средний род, ударение падает на окончание (письмецО)"},{"id":"б","t":"Средний род, ударение перед суффиксом"},{"id":"в","t":"Мужской род"},{"id":"г","t":"Женский род"}],"c":"а","e":"В среднем роде выбор зависит от ударения: письмецО — ударение на окончании, поэтому -ец-. Если бы ударение стояло перед суффиксом, писали бы -иц- (как в креслице)."},{"id":"x-rus-t11-g22","k":"mc","les":"RU033","task":11,"q":"На стене висел очень краси_ый пейзаж. Какую букву писать?","o":[{"id":"а","t":"-ев- (красевый)"},{"id":"б","t":"-ив- (красивый)"}],"c":"б","e":"Ставим ударение: красИвый — суффикс под ударением, значит пишется -ив-."},{"id":"x-rus-t11-g23","k":"mc","les":"RU033","task":11,"q":"В музее хранился старинный бо_вой меч. Какую букву писать?","o":[{"id":"а","t":"-ев- (боевой)"},{"id":"б","t":"-ив- (боивой)"}],"c":"а","e":"Ставим ударение: боевОй — суффикс без ударения, значит пишется -ев-: боевой."},{"id":"x-rus-t11-g24","k":"mc","les":"RU033","task":11,"q":"Он оказался честным и правди_ым человеком. Какую букву писать?","o":[{"id":"а","t":"-ев- (правдевый)"},{"id":"б","t":"-ив- (правдивый)"}],"c":"б","e":"Ударение: правдИвый — суффикс под ударением, поэтому -ив-."},{"id":"x-rus-t11-g25","k":"mc","les":"RU033","task":11,"q":"На столе стоял сирен_вый букет. Какую букву писать?","o":[{"id":"а","t":"-ев- (сиреневый)"},{"id":"б","t":"-ив- (сиренивый)"}],"c":"а","e":"Ударение: сирЕневый — падает не на суффикс, суффикс безударный, значит -ев-."},{"id":"x-rus-t11-g26","k":"mc","les":"RU033","task":11,"q":"Это был добрый и милост_вый правитель. Какую букву писать?","o":[{"id":"а","t":"-ев- (милостевый)"},{"id":"б","t":"-ив- (милостивый)"}],"c":"б","e":"Суффикс безударный (мИлостивый), но это слово-исключение: милостивый и юродивый пишутся с -ив-. Запоминаем."},{"id":"x-rus-t11-g27","k":"mc","les":"RU033","task":11,"q":"Найди ВЕРНЫЙ вариант — слово, где пишется -ив-.","o":[{"id":"а","t":"плюш_вый"},{"id":"б","t":"ситц_вый"},{"id":"в","t":"лен_вый"},{"id":"г","t":"дожд_вой"}],"c":"в","e":"Ленивый — ударение падает на суффикс (ленИвый), значит -ив-. У остальных суффикс безударный (плЮшевый, сИтцевый, дождевОй) → -ев-."},{"id":"x-rus-t11-g28","k":"mc","les":"RU033","task":11,"q":"Дано: «юродивый» пишется с -ив-, хотя суффикс без ударения. Почему?","o":[{"id":"а","t":"Это слово-исключение (наряду с «милостивый»)"},{"id":"б","t":"Суффикс стоит под ударением"},{"id":"в","t":"Здесь на самом деле суффикс -ев-"},{"id":"г","t":"У прилагательного есть краткая форма"}],"c":"а","e":"По общему правилу без ударения писался бы -ев-, но юрОдивый и мИлостивый — исключения, их пишут с -ив-. Их нужно запомнить."},{"id":"x-rus-t11-g29","k":"mc","les":"RU033","task":11,"q":"Она была очень заботл_вой мамой. Какую букву писать?","o":[{"id":"а","t":"-лев- (заботлевой)"},{"id":"б","t":"-лив- (заботливой)"}],"c":"б","e":"Суффикса -лев- в языке не существует, всегда пишется -лив-: заботливый."},{"id":"x-rus-t11-g30","k":"mc","les":"RU033","task":11,"q":"Ученик был усидч_вым и внимательным. Какую букву писать?","o":[{"id":"а","t":"-чев- (усидчевым)"},{"id":"б","t":"-чив- (усидчивым)"}],"c":"б","e":"Суффикса -чев- нет, пишется только -чив-: усидчивый."},{"id":"x-rus-t11-g31","k":"mc","les":"RU033","task":11,"q":"Он бросил насмешл_вый взгляд. Какую букву писать?","o":[{"id":"а","t":"-лев- (насмешлевый)"},{"id":"б","t":"-лив- (насмешливый)"}],"c":"б","e":"Всегда пишется -лив- (варианта -лев- не бывает): насмешливый."},{"id":"x-rus-t11-g32","k":"mc","les":"RU033","task":11,"q":"Малыш рос отзывч_вым и добрым. Какую букву писать?","o":[{"id":"а","t":"-чев- (отзывчевым)"},{"id":"б","t":"-чив- (отзывчивым)"}],"c":"б","e":"Суффикс всегда -чив-, никогда -чев-: отзывчивый."},{"id":"x-rus-t11-g33","k":"mc","les":"RU033","task":11,"q":"Он был удачл_вым игроком. Какую букву писать?","o":[{"id":"а","t":"-лев- (удачлевым)"},{"id":"б","t":"-лив- (удачливым)"}],"c":"б","e":"Пишется -лив- (суффикса -лев- нет): удачливый."},{"id":"x-rus-t11-g34","k":"mc","les":"RU033","task":11,"q":"Найди ВЕРНО написанное слово.","o":[{"id":"а","t":"совестлевый"},{"id":"б","t":"совестливый"},{"id":"в","t":"доверчевый"},{"id":"г","t":"заносчевый"}],"c":"б","e":"Правильно «совестливый»: суффиксы -лив- и -чив- всегда с и. Формы с -лев-/-чев- (совестлевый, доверчевый, заносчевый) ошибочны."},{"id":"x-rus-t11-g35","k":"mc","les":"RU033","task":11,"q":"Дано: в слове «заносчивый» пишется и. Выбери верное объяснение.","o":[{"id":"а","t":"Суффикса -чев- не существует — всегда пишется -чив-"},{"id":"б","t":"Суффикс стоит под ударением"},{"id":"в","t":"Прилагательное женского рода"},{"id":"г","t":"В корне беглая гласная"}],"c":"а","e":"Выбор не зависит от ударения: суффиксов -лев-/-чев- в русском языке нет, поэтому всегда пишем -лив-/-чив- с и."},{"id":"x-rus-t11-g36","k":"mc","les":null,"task":11,"q":"На снегу лежал бел_нький котёнок. Какую букву писать?","o":[{"id":"а","t":"-оньк- (белонький)"},{"id":"б","t":"-еньк- (беленький)"}],"c":"б","e":"Перед суффиксом согласная л (не г, к, х), поэтому пишется -еньк-: беленький."},{"id":"x-rus-t11-g37","k":"mc","les":null,"task":11,"q":"Из-за двери донёсся тих_нький шёпот. Какую букву писать?","o":[{"id":"а","t":"-оньк- (тихонький)"},{"id":"б","t":"-еньк- (тихенький)"}],"c":"а","e":"Перед суффиксом стоит х — из ряда г, к, х, значит пишется -оньк-: тихонький."},{"id":"x-rus-t11-g38","k":"mc","les":null,"task":11,"q":"На нём был син_нький шарфик. Какую букву писать?","o":[{"id":"а","t":"-оньк- (синонький)"},{"id":"б","t":"-еньк- (синенький)"}],"c":"б","e":"Перед суффиксом согласная н (не г, к, х), поэтому -еньк-: синенький."},{"id":"x-rus-t11-g39","k":"mc","les":null,"task":11,"q":"С ветки свисал сух_нький листок. Какую букву писать?","o":[{"id":"а","t":"-оньк- (сухонький)"},{"id":"б","t":"-еньк- (сухенький)"}],"c":"а","e":"Перед суффиксом стоит х, а после г, к, х пишется -оньк-: сухонький."},{"id":"x-rus-t11-g40","k":"mc","les":null,"task":11,"q":"Найди ВЕРНЫЙ вариант — слово, где пишется -оньк-.","o":[{"id":"а","t":"дешёв_нький"},{"id":"б","t":"син_нький"},{"id":"в","t":"плох_нький"},{"id":"г","t":"мил_нький"}],"c":"в","e":"Плохонький — перед суффиксом х (из ряда г, к, х) → -оньк-. У остальных перед суффиксом в, н, л → -еньк- (дешевенький, синенький, миленький)."},{"id":"x-rus-t11-g41","k":"mc","les":null,"task":11,"q":"Дано: «тихонький» пишется с -оньк-. Выбери верное объяснение.","o":[{"id":"а","t":"Основа оканчивается на г, к или х (тиХ-)"},{"id":"б","t":"Основа оканчивается на мягкий согласный"},{"id":"в","t":"Суффикс стоит под ударением"},{"id":"г","t":"Это слово-исключение"}],"c":"а","e":"-оньк- пишется после г, к, х. В слове тиХонький перед суффиксом стоит х, поэтому -оньк-."},{"id":"x-rus-t11-g42","k":"mc","les":null,"task":11,"q":"На причале собрался матрос_кий отряд. Какую букву писать?","o":[{"id":"а","t":"-к- (матроский)"},{"id":"б","t":"-ск- (матросский)"}],"c":"б","e":"Прилагательное относительное, краткой формы нет, основа не на к/ч/ц. Значит пишем -ск-, а на стыке основы (матроС) и суффикса (-Ск-) получается сс: матросский."},{"id":"x-rus-t11-g43","k":"mc","les":null,"task":11,"q":"На берегу стоял рыбац_кий посёлок. Какую букву писать?","o":[{"id":"а","t":"-к- (рыбацкий)"},{"id":"б","t":"-ск- (рыбацский)"}],"c":"а","e":"Прилагательное образовано от слова рыбаК (основа на к, при этом к чередуется с ц). В таких случаях пишется -к-: рыбацкий."},{"id":"x-rus-t11-g44","k":"mc","les":null,"task":11,"q":"Он изучал немец_кий язык. Какую букву писать?","o":[{"id":"а","t":"-к- (немецкий)"},{"id":"б","t":"-ск- (немецский)"}],"c":"а","e":"Прилагательное образовано от слова немеЦ (основа на ц). От основ на к, ч, ц пишется суффикс -к-: немецкий."},{"id":"x-rus-t11-g45","k":"mc","les":null,"task":11,"q":"Мы смотрели француз_кий фильм. Какую букву писать?","o":[{"id":"а","t":"-к- (францукий)"},{"id":"б","t":"-ск- (французский)"}],"c":"б","e":"Прилагательное относительное, краткой формы нет, основа не на к/ч/ц. Пишется -ск-: французский."},{"id":"x-rus-t11-g46","k":"mc","les":null,"task":11,"q":"Прозвучал рез_кий звук. Какую букву писать?","o":[{"id":"а","t":"-к- (резкий)"},{"id":"б","t":"-ск- (резский)"}],"c":"а","e":"Прилагательное качественное, есть краткая форма: резкий — резок. В таких словах пишется -к-: резкий."},{"id":"x-rus-t11-g47","k":"mc","les":null,"task":11,"q":"Найди ВЕРНЫЙ вариант — слово, где пишется -ск-.","o":[{"id":"а","t":"ткац_кий"},{"id":"б","t":"рыбац_кий"},{"id":"в","t":"богатыр_кий"},{"id":"г","t":"немец_кий"}],"c":"в","e":"Богатырский — относительное прилагательное, краткой формы нет, основа на р → -ск-. Остальные образованы от основ на к/ч/ц (ткаЧ, рыбаК, немеЦ) → -к-."},{"id":"x-rus-t11-g48","k":"mc","les":null,"task":11,"q":"Дано: «низкий» пишется с суффиксом -к-. Выбери верное объяснение.","o":[{"id":"а","t":"Есть краткая форма (низок), прилагательное качественное"},{"id":"б","t":"Это относительное прилагательное"},{"id":"в","t":"Основа оканчивается на р"},{"id":"г","t":"Суффикс стоит под ударением"}],"c":"а","e":"-к- пишется в качественных прилагательных, у которых есть краткая форма: низкий — низок. Поэтому суффикс -к-."},{"id":"x-rus-t11-g49","k":"mc","les":"RU034","task":11,"q":"Врач будет совет_вать пациенту отдых. Какую букву писать?","o":[{"id":"а","t":"-ова- (советовать)"},{"id":"б","t":"-ыва- (советывать)"}],"c":"а","e":"Ставим в форму «я»: советую (оканчивается на -ую). Значит в инфинитиве пишется -ова-: советовать."},{"id":"x-rus-t11-g50","k":"mc","les":"RU034","task":11,"q":"Учитель будет воспит_вать в детях доброту. Какую букву писать?","o":[{"id":"а","t":"-ова- (воспитовать)"},{"id":"б","t":"-ыва- (воспитывать)"}],"c":"б","e":"Форма «я»: воспитываю (-ываю сохраняется). Значит пишется -ыва-: воспитывать."},{"id":"x-rus-t11-g51","k":"mc","les":"RU034","task":11,"q":"Капитан будет команд_вать судном. Какую букву писать?","o":[{"id":"а","t":"-ова- (командовать)"},{"id":"б","t":"-ыва- (командывать)"}],"c":"а","e":"Форма «я»: командую (оканчивается на -ую). Значит в инфинитиве -ова-: командовать."},{"id":"x-rus-t11-g52","k":"mc","les":"RU033","task":11,"q":"Он любит рассматр_вать старые фотографии. Какую букву писать?","o":[{"id":"а","t":"-ова- (рассматровать)"},{"id":"б","t":"-ива- (рассматривать)"}],"c":"б","e":"Форма «я»: рассматриваю (-иваю сохраняется). Значит пишется -ива-: рассматривать."},{"id":"x-rus-t11-g53","k":"mc","les":"RU033","task":11,"q":"Дети любят танц_вать на празднике. Какую букву писать?","o":[{"id":"а","t":"-ева- (танцевать)"},{"id":"б","t":"-ива- (танцивать)"}],"c":"а","e":"Форма «я»: танцую (оканчивается на -ую). Значит в инфинитиве -ева-: танцевать (после ц пишется -ева-)."},{"id":"x-rus-t11-g54","k":"mc","les":"RU034","task":11,"q":"Найди ВЕРНЫЙ вариант — глагол, где пишется -ыва-.","o":[{"id":"а","t":"завед_вать"},{"id":"б","t":"бесед_вать"},{"id":"в","t":"отклад_вать"},{"id":"г","t":"проповед_вать"}],"c":"в","e":"Проверяем формой «я». Откладывать — откладываю (-ываю сохраняется) → -ыва-. Остальные: заведую, беседую, проповедую (-ую) → -ова-."},{"id":"x-rus-t11-g55","k":"mc","les":"RU033","task":11,"q":"Дано: в слове «горевать» пишется -ева-. Выбери верное объяснение.","o":[{"id":"а","t":"В форме «я» получается «горюю» (нет -ыва-/-ива-)"},{"id":"б","t":"В форме «я» получается «горевываю»"},{"id":"в","t":"Суффикс стоит под ударением"},{"id":"г","t":"Это глагол-исключение"}],"c":"а","e":"Ставим в 1-е лицо: я горюю (оканчивается на -юю). Значит в инфинитиве пишется -ева-: горевать."},{"id":"x-rus-t11-g56","k":"mc","les":"RU034","task":11,"q":"В комнате пахло свеж_. Какую букву писать на конце наречия?","o":[{"id":"а","t":"-о (свежо)"},{"id":"б","t":"-е (свеже)"}],"c":"а","e":"Ставим ударение: свежО — оно падает на конец наречия. После шипящей под ударением пишется -о: свежо."},{"id":"x-rus-t11-g57","k":"mc","les":null,"task":11,"q":"Ручей журчал певуч_. Какую букву писать?","o":[{"id":"а","t":"-о (певучо)"},{"id":"б","t":"-е (певуче)"}],"c":"б","e":"Ударение: певУче — оно не на конце. После шипящей без ударения пишется -е: певуче."},{"id":"x-rus-t11-g58","k":"mc","les":null,"task":11,"q":"Он спорил горяч_ и увлечённо. Какую букву писать?","o":[{"id":"а","t":"-о (горячо)"},{"id":"б","t":"-е (горяче)"}],"c":"а","e":"Ударение: горячО — падает на конец. После шипящей под ударением пишется -о: горячо."},{"id":"x-rus-t11-g59","k":"mc","les":null,"task":11,"q":"Медвежонок двигался неуклюж_. Какую букву писать?","o":[{"id":"а","t":"-о (неуклюжо)"},{"id":"б","t":"-е (неуклюже)"}],"c":"б","e":"Ударение: неуклЮже — не на конце. После шипящей без ударения пишется -е: неуклюже."},{"id":"x-rus-t11-g60","k":"mc","les":"RU034","task":11,"q":"Он ответ ."},{"id":"x-rus-t12-g04","k":"mc","les":"RU035","task":12,"q":"Выберите верное написание: Ты не терп_шь возражений.","o":[{"id":"а","t":"терпишь"},{"id":"б","t":"терпешь"}],"c":"а","e":"Инфинитив — терпеть. Хотя оканчивается на -еть, это глагол-исключение II спряжения. Значит окончание с И → терпишь."},{"id":"x-rus-t12-g05","k":"mc","les":"RU035","task":12,"q":"Выберите верное написание: Рабочие кле_т обои в комнате.","o":[{"id":"а","t":"клеят"},{"id":"б","t":"клеют"}],"c":"а","e":"Инфинитив — клеить, на -ить → II спряжение. В 3 л. мн. ч. у II спряжения окончание -ят → клеят."},{"id":"x-rus-t12-g06","k":"mc","les":"RU035","task":12,"q":"Выберите верное написание: Ты стел_шь чистую скатерть.","o":[{"id":"а","t":"стелешь"},{"id":"б","t":"стелишь"}],"c":"а","e":"Инфинитив — стелить. Это глагол-исключение: несмотря на -ить, он относится к I спряжению (как и брить). Значит окончание с Е → стелешь."},{"id":"x-rus-t12-g07","k":"mc","les":"RU035","task":12,"q":"Обратная карточка. В слове ПИЛЯТ пишется буква Я. Выберите верное объяснение.","o":[{"id":"а","t":"пилить — глагол на -ить, II спряжение, в 3 л. мн. ч. окончание -ят"},{"id":"б","t":"пилить — I спряжение, поэтому -ят"},{"id":"в","t":"пилить — разноспрягаемый глагол"}],"c":"а","e":"Инфинитив — пилить, оканчивается на -ить → II спряжение. У II спряжения в 3 л. мн. ч. окончание -ат/-ят, после мягкого л → -ят: пилят."},{"id":"x-rus-t12-g08","k":"mc","les":"RU035","task":12,"q":"Обратная карточка. В каком слове на месте пропуска пишется Е (I спряжение)?","o":[{"id":"а","t":"дыш_т"},{"id":"б","t":"бре_т"},{"id":"в","t":"смотр_т"},{"id":"г","t":"держ_т"}],"c":"б","e":"Дышать, смотреть, держать — глаголы-исключения II спряжения (буквы И/А/Я). А брить — исключение I спряжения, поэтому бреет — окончание с Е."},{"id":"x-rus-t12-g09","k":"mc","les":"RU036","task":12,"q":"Выберите верное написание: пиш_щий письмо ученик.","o":[{"id":"а","t":"пишущий"},{"id":"б","t":"пишащий"}],"c":"а","e":"Причастие от глагола писать. Писать не на -ить и не исключение → I спряжение → суффикс -ущ-/-ющ- → пишущий."},{"id":"x-rus-t12-g10","k":"mc","les":"RU036","task":12,"q":"Выберите верное написание: стро_щий дом каменщик.","o":[{"id":"а","t":"строящий"},{"id":"б","t":"строющий"}],"c":"а","e":"Причастие от глагола строить, на -ить → II спряжение → суффикс -ащ-/-ящ- → строящий."},{"id":"x-rus-t12-g11","k":"mc","les":"RU035","task":12,"q":"Выберите верное написание: тяжело дыш_щий спортсмен.","o":[{"id":"а","t":"дышащий"},{"id":"б","t":"дышущий"}],"c":"а","e":"Причастие от глагола дышать — это исключение II спряжения → суффикс -ащ- → дышащий."},{"id":"x-rus-t12-g12","k":"mc","les":"RU035","task":12,"q":"Выберите верное написание: кол_щий бок предмет.","o":[{"id":"а","t":"колющий"},{"id":"б","t":"колящий"}],"c":"а","e":"Причастие от глагола колоть, не на -ить и не исключение → I спряжение → суффикс -ющ- → колющий."},{"id":"x-rus-t12-g13","k":"mc","les":"RU035","task":12,"q":"Выберите верное написание: завис_щий от погоды урожай.","o":[{"id":"а","t":"зависящий"},{"id":"б","t":"зависющий"}],"c":"а","e":"Причастие от глагола зависеть — это исключение II спряжения (на -еть, но II спр.) → суффикс -ящ- → зависящий."},{"id":"x-rus-t12-g14","k":"mc","les":"RU036","task":12,"q":"Обратная карточка. В каком причастии пишется суффикс -ЮЩ-?","o":[{"id":"а","t":"кле_щий"},{"id":"б","t":"хвал_щий"},{"id":"в","t":"та_щий снег"},{"id":"г","t":"люб_щий"}],"c":"в","e":"Клеить, хвалить, любить — на -ить, II спряжение (-ящ-). А таять — I спряжение → суффикс -ющ- → тающий."},{"id":"x-rus-t12-g15","k":"mc","les":"RU036","task":12,"q":"Обратная карточка. Слово БОРЮЩИЙСЯ пишется с суффиксом -ЮЩ-. Почему?","o":[{"id":"а","t":"бороться — I спряжения, у действительных причастий пишется -ущ-/-ющ-"},{"id":"б","t":"бороться — II спряжения, поэтому -ющ-"}],"c":"а","e":"Бороться не на -ить и не исключение → I спряжение. Действительные причастия наст. вр. от I спряжения имеют суффикс -ущ-/-ющ- → борющийся."},{"id":"x-rus-t12-g16","k":"mc","les":"RU035","task":12,"q":"Выберите верное написание: вид_мый издалека маяк.","o":[{"id":"а","t":"видимый"},{"id":"б","t":"видемый"}],"c":"а","e":"Причастие от глагола видеть — исключение II спряжения. Страдательные причастия от II спряжения имеют суффикс -им- → видимый."},{"id":"x-rus-t12-g17","k":"mc","les":"RU035","task":12,"q":"Выберите верное написание: чита_мый всеми роман.","o":[{"id":"а","t":"читаемый"},{"id":"б","t":"читаимый"}],"c":"а","e":"Причастие от глагола читать — I спряжение → суффикс -ем- → читаемый."},{"id":"x-rus-t12-g18","k":"mc","les":"RU035","task":12,"q":"Выберите верное написание: гон_мый ветром лист.","o":[{"id":"а","t":"гонимый"},{"id":"б","t":"гонемый"}],"c":"а","e":"Причастие от глагола гнать — исключение II спряжения → суффикс -им- → гонимый."},{"id":"x-rus-t12-g19","k":"mc","les":"RU035","task":12,"q":"Выберите верное написание: легко реша_мая задача.","o":[{"id":"а","t":"решаемая"},{"id":"б","t":"решаимая"}],"c":"а","e":"Причастие от глагола решать — не на -ить и не исключение → I спряжение → суффикс -ем- → решаемая."},{"id":"x-rus-t12-g20","k":"mc","les":"RU035","task":12,"q":"Выберите верное написание: завис_мый от родителей подросток.","o":[{"id":"а","t":"зависимый"},{"id":"б","t":"зависемый"}],"c":"а","e":"Причастие от глагола зависеть — исключение II спряжения → суффикс -им- → зависимый."},{"id":"x-rus-t12-g21","k":"mc","les":"RU036","task":12,"q":"Обратная карточка. В каком причастии пишется суффикс -ИМ-?","o":[{"id":"а","t":"изуча_мый"},{"id":"б","t":"уважа_мый"},{"id":"в","t":"муч_мый"},{"id":"г","t":"колебл_мый"}],"c":"в","e":"Изучать, уважать, колебать — I спряжение (-ем-). А мучить — на -ить, II спряжение → суффикс -им- → мучимый."},{"id":"x-rus-t12-g22","k":"mc","les":"RU035","task":12,"q":"Обратная карточка. Слово ведОмый пишется с суффиксом -ОМ-. Почему?","o":[{"id":"а","t":"вести — I спряжения, а -ом- — это ударный вариант суффикса -ем-"},{"id":"б","t":"вести — II спряжения, поэтому -ом-"}],"c":"а","e":"Глагол вести относится к I спряжению; у страдательных причастий I спряжения под ударением суффикс принимает вид -ом- → ведОмый."},{"id":"x-rus-t12-g23","k":"mc","les":"RU035","task":12,"q":"Выберите верное написание: увид_вший чудо ребёнок.","o":[{"id":"а","t":"увидевший"},{"id":"б","t":"увидивший"}],"c":"а","e":"Ставим в инфинитив: увидеть. Перед -ть стоит Е, значит и перед -вш- пишем Е → увидевший. Спряжение тут не важно."},{"id":"x-rus-t12-g24","k":"mc","les":null,"task":12,"q":"Выберите верное написание: услыш_вший новость сосед.","o":[{"id":"а","t":"услышавший"},{"id":"б","t":"услышевший"}],"c":"а","e":"Инфинитив — услышать. Перед -ть стоит А, поэтому и перед -вш- пишем А → услышавший."},{"id":"x-rus-t12-g25","k":"mc","les":null,"task":12,"q":"Выберите верное написание: раста_вший на солнце снег.","o":[{"id":"а","t":"растаявший"},{"id":"б","t":"растаевший"}],"c":"а","e":"Инфинитив — растаять. Перед -ть стоит Я, значит и перед -вш- пишем Я → растаявший."},{"id":"x-rus-t12-g26","k":"mc","les":null,"task":12,"q":"Выберите верное написание: кле_вший марки коллекционер.","o":[{"id":"а","t":"клеивший"},{"id":"б","t":"клеявший"}],"c":"а","e":"Инфинитив — клеить. Перед -ть стоит И, значит и перед -вш- пишем И → клеивший."},{"id":"x-rus-t12-g27","k":"mc","les":null,"task":12,"q":"Выберите верное написание: наде_вшийся на удачу игрок.","o":[{"id":"а","t":"надеявшийся"},{"id":"б","t":"надеевшийся"}],"c":"а","e":"Инфинитив — надеяться. Перед -ть стоит Я, поэтому и перед -вш- пишем Я → надеявшийся."},{"id":"x-rus-t12-g28","k":"mc","les":null,"task":12,"q":"Обратная карточка. Выберите верное причастие, образованное от глагола ПОСЕЯТЬ.","o":[{"id":"а","t":"посеявший"},{"id":"б","t":"посеевший"},{"id":"в","t":"посеивший"}],"c":"а","e":"В инфинитиве посеять перед -ть стоит Я. Эту же гласную сохраняем перед -вш- → посеявший."},{"id":"x-rus-t12-g29","k":"mc","les":null,"task":12,"q":"Обратная карточка. В слове ЗАМЕТИВШИЙ перед -ВШ- пишется И. Почему?","o":[{"id":"а","t":"инфинитив заметить, перед -ть стоит И — её и сохраняем"},{"id":"б","t":"инфинитив заметать, поэтому И"}],"c":"а","e":"Причастие образовано от глагола заметить. Перед -ть в нём стоит И, поэтому и перед -вш- пишем И → заметивший."},{"id":"x-rus-t12-g30","k":"mc","les":null,"task":12,"q":"Выберите верное написание: засе_нное пшеницей поле.","o":[{"id":"а","t":"засеянное"},{"id":"б","t":"засеенное"}],"c":"а","e":"Инфинитив — засеять, оканчивается на -ять. Перед -нн- сохраняем Я → засеянное."},{"id":"x-rus-t12-g31","k":"mc","les":null,"task":12,"q":"Выберите верное написание: постро_нный за год дом.","o":[{"id":"а","t":"построенный"},{"id":"б","t":"построянный"}],"c":"а","e":"Инфинитив — построить, оканчивается на -ить. В таких причастиях перед -нн- пишется Е → построенный."},{"id":"x-rus-t12-g32","k":"mc","les":null,"task":12,"q":"Выберите верное написание: услыш_нный на улице разговор.","o":[{"id":"а","t":"услышанный"},{"id":"б","t":"услышенный"}],"c":"а","e":"Инфинитив — услышать, на -ать. Перед -нн- сохраняем А → услышанный."},{"id":"x-rus-t12-g33","k":"mc","les":null,"task":12,"q":"Выберите верное написание: обещ_нный подарок.","o":[{"id":"а","t":"обещанный"},{"id":"б","t":"обещенный"}],"c":"а","e":"Инфинитив — обещать, на -ать. Перед -нн- сохраняем А → обещанный."},{"id":"x-rus-t12-g34","k":"mc","les":null,"task":12,"q":"Выберите верное написание: выуч_нный наизусть урок.","o":[{"id":"а","t":"выученный"},{"id":"б","t":"выучанный"}],"c":"а","e":"Инфинитив — выучить, на -ить. Значит перед -нн- пишется Е → выученный."},{"id":"x-rus-t12-g35","k":"mc","les":null,"task":12,"q":"Выберите верное написание: потер_нный в толпе кошелёк.","o":[{"id":"а","t":"потерянный"},{"id":"б","t":"потеренный"}],"c":"а","e":"Инфинитив — потерять, на -ять. Перед -нн- сохраняем Я → потерянный."},{"id":"x-rus-t12-g36","k":"mc","les":null,"task":12,"q":"Обратная карточка. В каком причастии перед -НН- пишется Я?","o":[{"id":"а","t":"скле_нный"},{"id":"б","t":"высме_нный"},{"id":"в","t":"подар_нный"},{"id":"г","t":"замеч_нный"}],"c":"б","e":"Склеить, подарить — на -ить, заметить — на -ить (склеенный, подаренный, замеченный, буква Е). А высмеять — на -ять → перед -нн- пишем Я → высмеянный."},{"id":"x-rus-t12-g37","k":"mc","les":null,"task":12,"q":"Обратная карточка. В слове РАССТРЕЛЯННЫЙ перед -НН- пишется Я. Почему?","o":[{"id":"а","t":"инфинитив расстрелять оканчивается на -ять, гласная перед -ть сохраняется"},{"id":"б","t":"инфинитив на -ить, поэтому Я"}],"c":"а","e":"Причастие образовано от глагола расстрелять (на -ять). Перед -нн- в таких словах сохраняется гласная А/Я → расстрелянный."},{"id":"x-rus-t12-g38","k":"mc","les":"RU035","task":12,"q":"Выберите верное написание: Ты хоч_шь пить?","o":[{"id":"а","t":"хочешь"},{"id":"б","t":"хочишь"}],"c":"а","e":"Хотеть — разноспрягаемый глагол. В единственном числе он спрягается по I спряжению, поэтому окончание с Е → хочешь."},{"id":"x-rus-t12-g39","k":"mc","les":"RU035","task":12,"q":"Выберите верное написание: Дети хот_т мороженого.","o":[{"id":"а","t":"хотят"},{"id":"б","t":"хотют"}],"c":"а","e":"Хотеть — разноспрягаемый. Во множественном числе он спрягается по II спряжению, поэтому в 3 л. мн. ч. окончание -ят → хотят."},{"id":"x-rus-t12-g40","k":"mc","les":"RU035","task":12,"q":"Выберите верное написание: Спортсмены беж_т к финишу.","o":[{"id":"а","t":"бегут"},{"id":"б","t":"бежат"}],"c":"а","e":"Бежать — разноспрягаемый глагол. В 3 л. мн. ч. у него особая форма по I спряжению → бегут."},{"id":"x-rus-t12-g41","k":"mc","les":"RU035","task":12,"q":"Выберите верное написание: Ты быстро беж_шь по дорожке.","o":[{"id":"а","t":"бежишь"},{"id":"б","t":"бежешь"}],"c":"а","e":"Бежать — разноспрягаемый. В форме 2 л. ед. ч. он спрягается по II спряжению → окончание с И → бежишь."},{"id":"x-rus-t12-g42","k":"mc","les":"RU035","task":12,"q":"Выберите верное написание: Мы хот_м отдохнуть.","o":[{"id":"а","t":"хотим"},{"id":"б","t":"хотем"}],"c":"а","e":"Хотеть во множественном числе спрягается по II спряжению, поэтому в 1 л. мн. ч. окончание -им → хотим."},{"id":"x-rus-t12-g43","k":"mc","les":"RU035","task":12,"q":"Обратная карточка. В какой форме глагол ХОТЕТЬ имеет окончание I спряжения (с Е)?","o":[{"id":"а","t":"он хоч_т (ед. число)"},{"id":"б","t":"они хот_т (мн. число)"}],"c":"а","e":"Хотеть в единственном числе спрягается по I спряжению → хочет (окончание с Е). Во множественном числе — по II спряжению (хотят)."},{"id":"x-rus-t12-g44","k":"mc","les":"RU035","task":12,"q":"Обратная карточка. Почему в форме БЕГУТ пишется окончание -УТ, а не -АТ?","o":[{"id":"а","t":"бежать — разноспрягаемый: в 3 л. мн. ч. форма образуется по I спряжению"},{"id":"б","t":"бежать относится к II спряжению во всех формах"}],"c":"а","e":"Бежать — разноспрягаемый глагол. Большинство форм у него по II спряжению, но 3 л. мн. ч. образуется по I спряжению → бегут."},{"id":"x-rus-t13-g01","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Река здесь (не)глубокая, а мелкая»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"б","e":"Как прийти к ответу: перед нами прилагательное; ищем противопоставление. В предложении есть союз «а» («не глубокая, а мелкая») — это прямое противопоставление, значит НЕ пишется РАЗДЕЛЬНО."},{"id":"x-rus-t13-g02","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Он дал (не)точный ответ»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"а","e":"Как прийти к ответу: прилагательное, противопоставления и слов «далеко не/вовсе не» нет. Подбираем синоним без НЕ: «неточный» = «приблизительный, ошибочный». Синоним есть — пишем СЛИТНО."},{"id":"x-rus-t13-g03","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Это далеко (не)простое решение»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"б","e":"Как прийти к ответу: прилагательное. Рядом стоит сочетание «далеко не» — оно всегда требует РАЗДЕЛЬНОГО написания, даже если можно подобрать синоним."},{"id":"x-rus-t13-g04","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Задача оказалась вовсе (не)трудной»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"б","e":"Как прийти к ответу: прилагательное. Есть усилитель отрицания «вовсе не» — в этом случае пишем РАЗДЕЛЬНО (сравни: «далеко не», «ничуть не», «отнюдь не»)."},{"id":"x-rus-t13-g05","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «За окном стояло (не)настье»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"а","e":"Как прийти к ответу: существительное. Проверяем, есть ли слово без НЕ — «настье» не существует, слово без НЕ не употребляется. Значит, пишем СЛИТНО: ненастье."},{"id":"x-rus-t13-g06","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Говори (не)громко, чтобы не разбудить малыша»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"а","e":"Как прийти к ответу: наречие на -о. Противопоставления и слов «вовсе не/далеко не» нет. Синоним без НЕ: «негромко» = «тихо». Синоним есть — СЛИТНО."},{"id":"x-rus-t13-g07","k":"mc","les":"RU037","task":13,"q":"Дано: «Дорога (не)близкая, а дальняя» — пишется РАЗДЕЛЬНО. Выбери верное объяснение.","o":[{"id":"а","t":"можно подобрать синоним без НЕ"},{"id":"б","t":"есть противопоставление с союзом «а»"},{"id":"в","t":"слово не употребляется без НЕ"}],"c":"б","e":"Верное объяснение: в предложении есть союз «а» и прямое противопоставление «не близкая, а дальняя». Именно противопоставление, а не синоним, диктует раздельное написание."},{"id":"x-rus-t13-g08","k":"mc","les":"RU037","task":13,"q":"В каком случае НЕ с прилагательным пишется СЛИТНО?","o":[{"id":"а","t":"(не)высокий, а низкий забор"},{"id":"б","t":"вовсе (не)высокий забор"},{"id":"в","t":"(не)высокий (низкий) забор без пояснений"}],"c":"в","e":"Как прийти к ответу: в первом варианте есть противопоставление с «а» (раздельно), во втором — «вовсе не» (раздельно). В третьем противопоставления и усилителей нет, есть синоним «низкий» — значит СЛИТНО."},{"id":"x-rus-t13-g09","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Он (не)был сегодня на занятиях»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"б","e":"Как прийти к ответу: «был» — глагол. С глаголами НЕ пишется РАЗДЕЛЬНО; слово «был» прекрасно существует без НЕ, исключений тут нет."},{"id":"x-rus-t13-g10","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Старик (не)годовал от возмущения»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"а","e":"Как прийти к ответу: «годовал» — глагол. Проверяем слово без НЕ: «годовать» не существует. Слово без НЕ не употребляется — значит СЛИТНО: негодовал."},{"id":"x-rus-t13-g11","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «(Не)зная броду, не суйся в воду»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"б","e":"Как прийти к ответу: «зная» — деепричастие. С деепричастиями НЕ пишется РАЗДЕЛЬНО; «зная» употребляется без НЕ, исключением не является."},{"id":"x-rus-t13-g12","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Ослабленный болезнью, ребёнок постоянно (не)доедает»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"а","e":"Как прийти к ответу: глагол в значении «есть недостаточно, меньше нормы». Это приставка недо- со значением неполноты/недостатка — пишется СЛИТНО: недоедает."},{"id":"x-rus-t13-g13","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Она с детства (не)навидела ложь»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"а","e":"Как прийти к ответу: «навидела» — глагол. Слова «навидеть» без НЕ не существует, слово без НЕ не употребляется — пишем СЛИТНО: ненавидела."},{"id":"x-rus-t13-g14","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Он ушёл, (не)попрощавшись с друзьями»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"б","e":"Как прийти к ответу: «попрощавшись» — деепричастие. Оно свободно употребляется без НЕ, исключением не является — значит НЕ пишется РАЗДЕЛЬНО."},{"id":"x-rus-t13-g15","k":"mc","les":"RU037","task":13,"q":"Дано: «Ученик (не)доумевал, глядя на задачу». Как пишется и почему?","o":[{"id":"а","t":"раздельно: это глагол, а глаголы всегда раздельно"},{"id":"б","t":"слитно: слово без НЕ не употребляется"},{"id":"в","t":"слитно: приставка недо- со значением неполноты"}],"c":"б","e":"Верное объяснение: «доумевать» без НЕ не существует, поэтому слово пишется СЛИТНО — недоумевал. Это исключение из общего правила о раздельном написании глаголов."},{"id":"x-rus-t13-g16","k":"mc","les":"RU037","task":13,"q":"В каком варианте НЕ с глаголом пишется СЛИТНО?","o":[{"id":"а","t":"(не)читал книгу"},{"id":"б","t":"(не)годовал от обиды"},{"id":"в","t":"(не)пришёл вовремя"}],"c":"б","e":"Как прийти к ответу: «читал» и «пришёл» существуют без НЕ, значит раздельно. А «годовать» без НЕ не употребляется, поэтому «негодовал» пишется СЛИТНО."},{"id":"x-rus-t13-g17","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «На столе лежала (не)прочитанная книга»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"а","e":"Как прийти к ответу: «прочитанная» — полное причастие. Зависимых слов и противопоставления нет — значит пишем СЛИТНО: непрочитанная."},{"id":"x-rus-t13-g18","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «На столе лежала (не)прочитанная мною книга»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"б","e":"Как прийти к ответу: «прочитанная» — полное причастие. Появилось зависимое слово «мною» (прочитанная кем? мною) — при зависимом слове пишем РАЗДЕЛЬНО."},{"id":"x-rus-t13-g19","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Это (не)распустившиеся, а увядшие цветы»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"б","e":"Как прийти к ответу: «распустившиеся» — причастие. Есть союз «а» и противопоставление «не распустившиеся, а увядшие» — значит РАЗДЕЛЬНО."},{"id":"x-rus-t13-g20","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Учитель собрал (не)проверенные тетради»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"а","e":"Как прийти к ответу: «проверенные» — полное причастие. Зависимых слов и противопоставления нет — пишем СЛИТНО: непроверенные."},{"id":"x-rus-t13-g21","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Учитель забрал ещё (не)проверенные им тетради»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"б","e":"Как прийти к ответу: «проверенные» — причастие с зависимым словом «им» (проверенные кем? им). Есть зависимое слово — пишем РАЗДЕЛЬНО."},{"id":"x-rus-t13-g22","k":"mc","les":"RU037","task":13,"q":"Дано: «(не)скошенная трава» пишется слитно. Что превратит написание в РАЗДЕЛЬНОЕ?","o":[{"id":"а","t":"подобрать синоним без НЕ"},{"id":"б","t":"добавить зависимое слово (например, «вовремя»)"},{"id":"в","t":"поставить причастие в начало предложения"}],"c":"б","e":"Верное объяснение: раздельное написание причастия появляется при зависимом слове. «Не скошенная вовремя трава» — зависимое слово «вовремя» делает написание РАЗДЕЛЬНЫМ."},{"id":"x-rus-t13-g23","k":"mc","les":"RU037","task":13,"q":"В каком случае полное причастие с НЕ пишется РАЗДЕЛЬНО?","o":[{"id":"а","t":"(не)замёрзшая река"},{"id":"б","t":"ещё (не)замёрзшая река"},{"id":"в","t":"(не)замерзающий ручей"}],"c":"б","e":"Как прийти к ответу: в вариантах без пояснений зависимых слов нет — слитно. Во втором варианте есть зависимое слово «ещё» (ещё не замёрзшая), поэтому пишем РАЗДЕЛЬНО."},{"id":"x-rus-t13-g24","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Работа до сих пор (не)выполнена»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"б","e":"Как прийти к ответу: «выполнена» отвечает на вопрос «что сделана?», заменяется глаголом (не выполнили) — это краткое причастие. Краткие причастия с НЕ пишутся РАЗДЕЛЬНО."},{"id":"x-rus-t13-g25","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Осенние поля ещё (не)вспаханы»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"б","e":"Как прийти к ответу: «вспаханы» — краткое причастие (что сделаны? — не вспахали). С краткими причастиями НЕ всегда пишется РАЗДЕЛЬНО."},{"id":"x-rus-t13-g26","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Контрольные тетради ещё (не)проверены»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"б","e":"Как прийти к ответу: «проверены» — краткое причастие (что сделаны? — не проверили). Значит, НЕ пишется РАЗДЕЛЬНО."},{"id":"x-rus-t13-g27","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Новый дом ещё (не)достроен»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"б","e":"Как прийти к ответу: «достроен» — краткое причастие (что сделан? — не достроили). Краткое причастие с НЕ пишем РАЗДЕЛЬНО."},{"id":"x-rus-t13-g28","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Ошибка ещё (не)найдена»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"б","e":"Как прийти к ответу: «найдена» — краткое причастие (что сделана? — не нашли). С краткими причастиями НЕ пишется РАЗДЕЛЬНО."},{"id":"x-rus-t13-g29","k":"mc","les":"RU037","task":13,"q":"Дано: «Задача (не)решена» — пишется РАЗДЕЛЬНО. Почему?","o":[{"id":"а","t":"есть зависимое слово"},{"id":"б","t":"это краткое причастие"},{"id":"в","t":"есть противопоставление с «а»"}],"c":"б","e":"Верное объяснение: «решена» — краткое причастие (что сделана? — не решили). С краткими причастиями НЕ всегда пишется раздельно, независимо от зависимых слов."},{"id":"x-rus-t13-g30","k":"mc","les":"RU037","task":13,"q":"В каком варианте перед нами КРАТКОЕ ПРИЧАСТИЕ, где НЕ пишется РАЗДЕЛЬНО?","o":[{"id":"а","t":"дом (не)высок"},{"id":"б","t":"задача (не)решена"},{"id":"в","t":"путь (не)близок"}],"c":"б","e":"Как прийти к ответу: «высок» и «близок» — краткие прилагательные (высокий, близкий), у них другое правило. «Решена» — краткое причастие (не решили), поэтому пишется РАЗДЕЛЬНО."},{"id":"x-rus-t13-g31","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Помочь ему было (не)кому»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"а","e":"Как прийти к ответу: «некому» — отрицательное местоимение. Предлога между НЕ и словом нет, ударение падает на НЕ — значит пишем СЛИТНО: некому."},{"id":"x-rus-t13-g32","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Обратиться за помощью было (не)_к_кому»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"б","e":"Как прийти к ответу: между НЕ и местоимением «кому» стоит предлог «к». При предлоге отрицательное местоимение пишется РАЗДЕЛЬНО: не к кому."},{"id":"x-rus-t13-g33","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Мне сегодня (не)чего тебе сказать»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"а","e":"Как прийти к ответу: «нечего» — отрицательное местоимение. Предлога нет, ударение на НЕ — пишем СЛИТНО: нечего."},{"id":"x-rus-t13-g34","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Спорить было (не)_о_чем»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"б","e":"Как прийти к ответу: между НЕ и словом «чем» стоит предлог «о». Предлог разрывает написание — пишем РАЗДЕЛЬНО: не о чем."},{"id":"x-rus-t13-g35","k":"mc","les":"RU037","task":13,"q":"Как пишется НЕ: «Торопиться было (не)куда»?","o":[{"id":"а","t":"слитно"},{"id":"б","t":"раздельно"}],"c":"а","e":"Как прийти к ответу: «некуда» — отрицательное наречие. Предлога нет, ударение на НЕ — пишем СЛИТНО: некуда."},{"id":"x-rus-t13-g36","k":"mc","les":"RU037","task":13,"q":"Дано: «Просить помощи было (не)_от_кого» — пишется РАЗДЕЛЬНО. Почему?","o":[{"id":"а","t":"ударение падает не на НЕ"},{"id":"б","t":"между НЕ и местоимением стоит предлог «от»"},{"id":"в","t":"это наречие, а не местоимение"}],"c":"б","e":"Верное объяснение: между НЕ и «кого» стоит предлог «от». Наличие предлога всегда даёт раздельное написание: не от кого."},{"id":"x-rus-t13-g37","k":"mc","les":"RU037","task":13,"q":"В каком случае пишется СЛИТНО?","o":[{"id":"а","t":"(не)_с_кем поговорить"},{"id":"б","t":"(не)кому пожаловаться"},{"id":"в","t":"(не)_за_что благодарить"}],"c":"б","e":"Как прийти к ответу: в первом и третьем вариантах есть предлоги («с», «за») — пишем раздельно (не с кем, не за что). Во втором предлога нет, ударение на НЕ — СЛИТНО: некому."},{"id":"x-rus-t14-g01","k":"mc","les":"RU039","task":14,"q":"«Я (то)же прочитал эту книгу за лето.» Как пишется?","o":[{"id":"а","t":"слитно: тоже"},{"id":"б","t":"раздельно: то же"}],"c":"а","e":"Как прийти к ответу: пробуем замену на «и» — «И я прочитал эту книгу». Смысл сохранился, значит это союз «тоже» → слитно."},{"id":"x-rus-t14-g02","k":"mc","les":null,"task":14,"q":"«Сегодня у нас то (же) задание, что и вчера.» Как пишется?","o":[{"id":"а","t":"слитно: тоже"},{"id":"б","t":"раздельно: то же"}],"c":"б","e":"Как прийти к ответу: на «и» не заменяется. Убираем «же»: «то задание, что и вчера» — смысл остался, есть «то… что». Значит местоимение «то» + частица «же» → раздельно."},{"id":"x-rus-t14-g03","k":"mc","les":"RU040","task":14,"q":"«Он решил задачу так(же), как учитель у доски.» Как пишется?","o":[{"id":"а","t":"слитно: также"},{"id":"б","t":"раздельно: так же"}],"c":"б","e":"Как прийти к ответу: рядом стоит сравнение «как». Это наречие «так» + частица «же» (можно убрать «же»: «так, как учитель»). Замена на «и» невозможна → раздельно."},{"id":"x-rus-t14-g04","k":"mc","les":"RU039","task":14,"q":"«(Так)же не забудь купить хлеба и молока.» Как пишется?","o":[{"id":"а","t":"слитно: также"},{"id":"б","t":"раздельно: так же"}],"c":"а","e":"Как прийти к ответу: заменяем на «и» — «И не забудь купить». Смысл присоединения сохранился, значит союз «также» → слитно."},{"id":"x-rus-t14-g05","k":"mc","les":null,"task":14,"q":"«Мне понравилось то (же), что и моему брату.» Как пишется?","o":[{"id":"а","t":"слитно: тоже"},{"id":"б","t":"раздельно: то же"}],"c":"б","e":"Как прийти к ответу: подставляем «(самое)»: «то же самое, что и брату». Частицу «же» можно убрать. Значит это «то» + «же» → раздельно."},{"id":"x-rus-t14-g06","k":"mc","les":"RU039","task":14,"q":"«Я зашёл в магазин, что(бы) купить хлеба.» Как пишется?","o":[{"id":"а","t":"слитно: чтобы"},{"id":"б","t":"раздельно: что бы"}],"c":"а","e":"Как прийти к ответу: пробуем убрать «бы» — «зашёл, что купить хлеба» разрушается. Значение цели («для того чтобы») → союз «чтобы», слитно."},{"id":"x-rus-t14-g07","k":"mc","les":null,"task":14,"q":"«Что (бы) мне подарить подруге на день рождения?» Как пишется?","o":[{"id":"а","t":"слитно: чтобы"},{"id":"б","t":"раздельно: что бы"}],"c":"б","e":"Как прийти к ответу: убираем «бы» — «Что мне подарить подруге?» Смысл сохранился, «бы» лишняя частица. Значит местоимение «что» + «бы» → раздельно."},{"id":"x-rus-t14-g08","k":"mc","les":"RU039","task":14,"q":"«Что(бы) не заблудиться, возьми с собой карту.» Как пишется?","o":[{"id":"а","t":"слитно: чтобы"},{"id":"б","t":"раздельно: что бы"}],"c":"а","e":"Как прийти к ответу: это придаточное цели (зачем взять карту?). «Бы» убрать нельзя, есть значение «для того чтобы» → слитно."},{"id":"x-rus-t14-g09","k":"mc","les":null,"task":14,"q":"«Что (бы) ты ни говорил, я тебе не поверю.» Как пишется?","o":[{"id":"а","t":"слитно: чтобы"},{"id":"б","t":"раздельно: что бы"}],"c":"б","e":"Как прийти к ответу: здесь местоимение «что» + частица «бы» (сочетание «что бы ни» с уступкой). Проверка: есть «ни» и предмет обсуждения «что» → раздельно."},{"id":"x-rus-t14-g10","k":"mc","les":"RU039","task":14,"q":"«Родители хотели, что(бы) дети выросли честными.» Как пишется?","o":[{"id":"а","t":"слитно: чтобы"},{"id":"б","t":"раздельно: что бы"}],"c":"а","e":"Как прийти к ответу: «чтобы» присоединяет придаточное (хотели чего? чтобы выросли). «Бы» не убрать и не переставить → союз, слитно."},{"id":"x-rus-t14-g11","k":"mc","les":"RU039","task":14,"q":"В каком предложении написание ВЕРНО?","o":[{"id":"а","t":"Чтобы мне надеть на праздник?"},{"id":"б","t":"Я пришёл, что бы помочь тебе."},{"id":"в","t":"Что бы такое интересное почитать?"},{"id":"г","t":"Все варианты неверны."}],"c":"в","e":"Как прийти к ответу: в 3-м «бы» можно убрать («Что почитать?») → раздельно, верно. В 1-м нужно «Что бы надеть» (можно убрать «бы»). Во 2-м цель → слитно «чтобы». Верный ответ 3."},{"id":"x-rus-t14-g12","k":"mc","les":"RU039","task":14,"q":"«Дорога была трудной, за(то) очень красивой.» Как пишется?","o":[{"id":"а","t":"слитно: зато"},{"id":"б","t":"раздельно: за то"}],"c":"а","e":"Как прийти к ответу: заменяем на «но» — «трудной, но красивой». Замена проходит, значит союз «зато» → слитно."},{"id":"x-rus-t14-g13","k":"mc","les":null,"task":14,"q":"«Мяч закатился за (то) дерево у забора.» Как пишется?","o":[{"id":"а","t":"слитно: зато"},{"id":"б","t":"раздельно: за то"}],"c":"б","e":"Как прийти к ответу: задаём вопрос «за какое?» — «за то дерево». Это предлог «за» + местоимение «то» перед существительным → раздельно."},{"id":"x-rus-t14-g14","k":"mc","les":null,"task":14,"q":"«Спасибо тебе за (то), что не бросил меня.» Как пишется?","o":[{"id":"а","t":"слитно: зато"},{"id":"б","t":"раздельно: за то"}],"c":"б","e":"Как прийти к ответу: на «но» не заменяется. Есть конструкция «за то, что» (благодарю за что?) → предлог + местоимение, раздельно."},{"id":"x-rus-t14-g15","k":"mc","les":"RU039","task":14,"q":"«Работа скучная, за(то) хорошо оплачивается.» Как пишется?","o":[{"id":"а","t":"слитно: зато"},{"id":"б","t":"раздельно: за то"}],"c":"а","e":"Как прийти к ответу: заменяем на «но» — «скучная, но хорошо оплачивается». Замена удалась → союз «зато», слитно."},{"id":"x-rus-t14-g16","k":"mc","les":null,"task":14,"q":"«Мы спрятались за (то) старое здание.» Как пишется?","o":[{"id":"а","t":"слитно: зато"},{"id":"б","t":"раздельно: за то"}],"c":"б","e":"Как прийти к ответу: вопрос «за какое здание?» — «за то». Предлог «за» относится к существительному «здание» → раздельно."},{"id":"x-rus-t14-g17","k":"mc","les":"RU039","task":14,"q":"В каком предложении выделенное написано ВЕРНО?","o":[{"id":"а","t":"Устал, за то доволен."},{"id":"б","t":"Спрячься зато дерево."},{"id":"в","t":"Ругали долго, зато потом похвалили."},{"id":"г","t":"Все варианты неверны."}],"c":"в","e":"Как прийти к ответу: в 3-м «зато» = «но» → слитно, верно. В 1-м нужно «зато» (=но). Во 2-м «за то дерево» (за какое?) → раздельно. Верный ответ 3."},{"id":"x-rus-t14-g18","k":"mc","les":null,"task":14,"q":"«Мне грустно от(того), что закончилось лето.» Как пишется?","o":[{"id":"а","t":"слитно: оттого"},{"id":"б","t":"раздельно: от того"}],"c":"а","e":"Как прийти к ответу: есть значение причины, конструкция «оттого что» = «потому что». Заменяем: «грустно потому, что…» — подходит → слитно."},{"id":"x-rus-t14-g19","k":"mc","les":null,"task":14,"q":"«От (того) дома до остановки пять минут.» Как пишется?","o":[{"id":"а","t":"слитно: оттого"},{"id":"б","t":"раздельно: от того"}],"c":"б","e":"Как прийти к ответу: задаём вопрос «от какого?» — «от того дома». Предлог «от» + местоимение «того» относятся к существительному → раздельно."},{"id":"x-rus-t14-g20","k":"mc","les":null,"task":14,"q":"«Я промолчал по(тому), что не хотел спорить.» Как пишется?","o":[{"id":"а","t":"слитно: потому"},{"id":"б","t":"раздельно: по тому"}],"c":"а","e":"Как прийти к ответу: причина, конструкция «потому что». Заменяем на «оттого что» — смысл тот же → слитно."},{"id":"x-rus-t14-g21","k":"mc","les":null,"task":14,"q":"«По (тому) берегу идти намного удобнее.» Как пишется?","o":[{"id":"а","t":"слитно: потому"},{"id":"б","t":"раздельно: по тому"}],"c":"б","e":"Как прийти к ответу: вопрос «по какому?» — «по тому берегу». Предлог «по» + местоимение относятся к существительному → раздельно."},{"id":"x-rus-t14-g22","k":"mc","les":null,"task":14,"q":"«Он опоздал от(того), что проспал будильник.» Как пишется?","o":[{"id":"а","t":"слитно: оттого"},{"id":"б","t":"раздельно: от того"}],"c":"а","e":"Как прийти к ответу: указывает причину (= «потому что»). Проверка вопросом «почему?», а не «от какого?» → слитно."},{"id":"x-rus-t14-g23","k":"mc","les":null,"task":14,"q":"В каком предложении выделенное написано ВЕРНО?","o":[{"id":"а","t":"Оттого дома веет холодом (о причине)."},{"id":"б","t":"Радуюсь оттого, что вернулся друг."},{"id":"в","t":"По тому я и не пришёл, что заболел."},{"id":"г","t":"Все варианты неверны."}],"c":"б","e":"Как прийти к ответу: во 2-м «оттого, что» = «потому что» (причина) → слитно, верно. В 1-м речь о доме (от какого дома) → «от того». В 3-м причина → нужно «потому». Верный ответ 2."},{"id":"x-rus-t14-g24","k":"mc","les":null,"task":14,"q":"«(И)так, начнём наш сегодняшний урок.» Как пишется?","o":[{"id":"а","t":"слитно: итак"},{"id":"б","t":"раздельно: и так"}],"c":"а","e":"Как прийти к ответу: это вводное слово в начале, подводит к выводу (= «следовательно, приступим»). Значит «итак» → слитно."},{"id":"x-rus-t14-g25","k":"mc","les":"RU039","task":14,"q":"«Не объясняй, я (и)так всё понял.» Как пишется?","o":[{"id":"а","t":"слитно: итак"},{"id":"б","t":"раздельно: и так"}],"c":"б","e":"Как прийти к ответу: заменяем на «и без того» — «я и без того всё понял». Замена проходит → союз «и» + наречие «так», раздельно."},{"id":"x-rus-t14-g26","k":"mc","les":null,"task":14,"q":"«(И)так, все собрались — можно отправляться.» Как пишется?","o":[{"id":"а","t":"слитно: итак"},{"id":"б","t":"раздельно: и так"}],"c":"а","e":"Как прийти к ответу: вводное слово-вывод, = «следовательно». Стоит в начале, выделяется запятой → «итак», слитно."},{"id":"x-rus-t14-g27","k":"mc","les":"RU039","task":14,"q":"«Он говорил тихо, (и)так, что никто не расслышал.» Как пишется?","o":[{"id":"а","t":"слитно: итак"},{"id":"б","t":"раздельно: и так"}],"c":"б","e":"Как прийти к ответу: «так» отвечает на вопрос «как? каким образом?» и присоединяется союзом «и» (и так, что…). Это «и» + «так» → раздельно."},{"id":"x-rus-t14-g28","k":"mc","les":null,"task":14,"q":"«(И)так, подведём итоги нашей встречи.» Как пишется?","o":[{"id":"а","t":"слитно: итак"},{"id":"б","t":"раздельно: и так"}],"c":"а","e":"Как прийти к ответу: вводное слово, синоним «следовательно/таким образом». Обобщает сказанное → «итак», слитно."},{"id":"x-rus-t14-g29","k":"mc","les":"RU039","task":14,"q":"В каком предложении выделенное написано ВЕРНО?","o":[{"id":"а","t":"И так, начнём собрание."},{"id":"б","t":"Я итак устал за день."},{"id":"в","t":"Итак, вывод очевиден."},{"id":"г","t":"Все варианты неверны."}],"c":"в","e":"Как прийти к ответу: в 3-м «итак» — вводное слово (= «следовательно») → слитно, верно. В 1-м тоже вводное, но написано раздельно — ошибка. Во 2-м «и так» = «и без того» → раздельно. Верный ответ 3."},{"id":"x-rus-t14-g30","k":"mc","les":null,"task":14,"q":"«Занятия отменили (в)виду сильных морозов.» Как пишется?","o":[{"id":"а","t":"слитно: ввиду"},{"id":"б","t":"раздельно: в виду"}],"c":"а","e":"Как прийти к ответу: заменяем на «из-за» — «из-за морозов». Замена удалась, значит это предлог «ввиду» → слитно."},{"id":"x-rus-t14-g31","k":"mc","les":null,"task":14,"q":"«Нам нужно поговорить (на)счёт поездки.» Как пишется?","o":[{"id":"а","t":"слитно: насчёт"},{"id":"б","t":"раздельно: на счёт"}],"c":"а","e":"Как прийти к ответу: заменяем на «о/об» — «поговорить о поездке». Замена проходит → предлог «насчёт», слитно."},{"id":"x-rus-t14-g32","k":"mc","les":"RU039","task":14,"q":"«(В)следствие проливного дождя дорогу размыло.» Как пишется?","o":[{"id":"а","t":"слитно: вследствие"},{"id":"б","t":"раздельно: в следствие"}],"c":"а","e":"Как прийти к ответу: заменяем на «из-за» — «из-за дождя». Значение причины → предлог «вследствие», слитно (на конце -е)."},{"id":"x-rus-t14-g33","k":"mc","les":null,"task":14,"q":"«Пожалуйста, имей это (в)виду на будущее.» Как пишется?","o":[{"id":"а","t":"слитно: ввиду"},{"id":"б","t":"раздельно: в виду"}],"c":"б","e":"Как прийти к ответу: замена на «из-за» невозможна. «Иметь в виду» — устойчивое сочетание, всегда пишется раздельно. Это исключение → раздельно."},{"id":"x-rus-t14-g34","k":"mc","les":null,"task":14,"q":"«Деньги перевели (на)счёт в банке.» Как пишется?","o":[{"id":"а","t":"слитно: насчёт"},{"id":"б","t":"раздельно: на счёт"}],"c":"б","e":"Как прийти к ответу: на «о/об» не заменяется. Здесь «счёт» — существительное (счёт в банке), к нему можно задать вопрос «на что?» → раздельно."},{"id":"x-rus-t14-g35","k":"mc","les":null,"task":14,"q":"«Дети выбежали (на)встречу маме.» Как пишется?","o":[{"id":"а","t":"слитно: навстречу"},{"id":"б","t":"раздельно: на встречу"}],"c":"а","e":"Как прийти к ответу: «навстречу маме» — предлог (= в сторону кого-то). Существительного «встреча» нет. Сравни: «пошёл на встречу с другом» (на что?) — там раздельно. Здесь → слитно."},{"id":"x-rus-t14-g36","k":"mc","les":"RU039","task":14,"q":"В каком предложении выделенное написано ВЕРНО?","o":[{"id":"а","t":"Спросил на счёт экзамена (в значении «об экзамене»)."},{"id":"б","t":"Ввиду болезни концерт перенесли."},{"id":"в","t":"Вследствии аварии образовалась пробка."},{"id":"г","t":"Все варианты неверны."}],"c":"б","e":"Как прийти к ответу: во 2-м «ввиду» = «из-за» → предлог, слитно, верно. В 1-м «насчёт» (=об) пишется слитно. В 3-м предлог причины оканчивается на -е: «вследствие». Верный ответ 2."},{"id":"x-rus-t14-g37","k":"mc","les":"RU039","task":14,"q":"«(В)течени_ часа шёл сильный дождь.» Как правильно?","o":[{"id":"а","t":"в течение (раздельно, -е)"},{"id":"б","t":"втечение (слитно)"},{"id":"в","t":"в течении (раздельно, -и)"}],"c":"а","e":"Как прийти к ответу: значение времени «сколько времени? — час». Это предлог времени, он пишется раздельно и оканчивается на -е → «в течение»."},{"id":"x-rus-t14-g38","k":"mc","les":"RU039","task":14,"q":"«(В)продолжени_ недели он готовился к экзамену.» Как правильно?","o":[{"id":"а","t":"в продолжение (раздельно, -е)"},{"id":"б","t":"впродолжение (слитно)"},{"id":"в","t":"в продолжении (раздельно, -и)"}],"c":"а","e":"Как прийти к ответу: значение времени (в течение какого срока — неделя). Предлог времени → раздельно, на конце -е: «в продолжение»."},{"id":"x-rus-t14-g39","k":"mc","les":null,"task":14,"q":"«(В)заключени_ доклада автор поблагодарил слушателей.» Как правильно?","o":[{"id":"а","t":"в заключение (раздельно, -е)"},{"id":"б","t":"взаключение (слитно)"},{"id":"в","t":"в заключении (раздельно, -и)"}],"c":"а","e":"Как прийти к ответу: значение «под конец, в завершение доклада» — это предлог. Пишется раздельно, на конце -е → «в заключение»."},{"id":"x-rus-t14-g40","k":"mc","les":null,"task":14,"q":"«В течени_ реки заметны быстрые водовороты.» Как правильно?","o":[{"id":"а","t":"в течение (-е)"},{"id":"б","t":"в течении (-и)"}],"c":"б","e":"Как прийти к ответу: здесь «течение» — существительное (течение реки), к нему вопрос «в чём? где?». Это предлог «в» + существительное в предложном падеже → на конце -и: «в течении»."},{"id":"x-rus-t14-g41","k":"mc","les":"RU039","task":14,"q":"«(В)течени_ всего года он ни разу не болел.» Как правильно?","o":[{"id":"а","t":"в течение (раздельно, -е)"},{"id":"б","t":"втечении (слитно, -и)"},{"id":"в","t":"в течении (раздельно, -и)"}],"c":"а","e":"Как прийти к ответу: значение времени «сколько? — год». Предлог времени всегда раздельно и на -е → «в течение»."},{"id":"x-rus-t14-g42","k":"mc","les":"RU039","task":14,"q":"В каком случае написание ВЕРНО?","o":[{"id":"а","t":"Втечение дня звонил телефон."},{"id":"б","t":"В течении часа мы ждали автобус."},{"id":"в","t":"В течение суток обещали ответ."},{"id":"г","t":"Все варианты неверны."}],"c":"в","e":"Как прийти к ответу: в 3-м значение времени (сколько? — сутки) → предлог, раздельно, -е: «в течение», верно. В 1-м нельзя слитно. Во 2-м время требует -е, а не -и. Верный ответ 3."},{"id":"x-rus-t14-g43","k":"mc","les":null,"task":14,"q":"«(Не)смотря на дождь, мы отправились в поход.» Как пишется?","o":[{"id":"а","t":"слитно: несмотря на"},{"id":"б","t":"раздельно: не смотря на"}],"c":"а","e":"Как прийти к ответу: заменяем на «вопреки» — «вопреки дождю». Замена проходит → это предлог «несмотря на», слитно."},{"id":"x-rus-t14-g44","k":"mc","les":null,"task":14,"q":"«Он бежал по тропинке, (не)смотря под ноги.» Как пишется?","o":[{"id":"а","t":"слитно: несмотря"},{"id":"б","t":"раздельно: не смотря"}],"c":"б","e":"Как прийти к ответу: речь о взгляде — «не глядя под ноги». Замена на «вопреки» не подходит. Это деепричастие «не смотря» → раздельно."},{"id":"x-rus-t14-g45","k":"mc","les":null,"task":14,"q":"«(Не)взирая на трудности, команда добилась цели.» Как пишется?","o":[{"id":"а","t":"слитно: невзирая на"},{"id":"б","t":"раздельно: не взирая на"}],"c":"а","e":"Как прийти к ответу: заменяем на «вопреки» — «вопреки трудностям». Это предлог «невзирая на» (аналог «несмотря на») → слитно."},{"id":"x-rus-t14-g46","k":"mc","les":null,"task":14,"q":"«Мы поехали за город, (не)смотря на усталость.» Как пишется?","o":[{"id":"а","t":"слитно: несмотря на"},{"id":"б","t":"раздельно: не смотря на"}],"c":"а","e":"Как прийти к ответу: = «вопреки усталости». Значение уступки, а не взгляда → предлог «несмотря на», слитно."},{"id":"x-rus-t14-g47","k":"mc","les":null,"task":14,"q":"«Она отвечала, (не)смотря собеседнику в глаза.» Как пишется?","o":[{"id":"а","t":"слитно: несмотря"},{"id":"б","t":"раздельно: не смотря"}],"c":"б","e":"Как прийти к ответу: буквально «не глядя в глаза» — действие взгляда. «Вопреки» не подставить. Это деепричастие → раздельно."},{"id":"x-rus-t14-g48","k":"mc","les":"RU039","task":14,"q":"В каком предложении выделенное написано ВЕРНО?","o":[{"id":"а","t":"Не смотря на мороз, дети играли во дворе."},{"id":"б","t":"Несмотря на карту, он всё равно заблудился."},{"id":"в","t":"Шёл, несмотря под ноги, и споткнулся."},{"id":"г","t":"Все варианты неверны."}],"c":"б","e":"Как прийти к ответу: во 2-м «несмотря на» = «вопреки карте» → предлог, слитно, верно. В 1-м тоже уступка (= вопреки морозу), надо слитно. В 3-м речь о взгляде → «не смотря» раздельно. Верный ответ 2."},{"id":"x-rus-t14-g49","k":"mc","les":"RU040","task":14,"q":"«Давай сделаем всё (по)новому.» Как пишется?","o":[{"id":"а","t":"через дефис: по-новому"},{"id":"б","t":"раздельно: по новому"}],"c":"а","e":"Как прийти к ответу: это наречие (как? — по-новому) с приставкой «по-» и суффиксом -ому. Такие наречия пишутся через дефис → по-новому."},{"id":"x-rus-t14-g50","k":"mc","les":null,"task":14,"q":"«Мы прошлись (по)новому мосту через реку.» Как пишется?","o":[{"id":"а","t":"через дефис: по-новому"},{"id":"б","t":"раздельно: по новому"}],"c":"б","e":"Как прийти к ответу: вопрос «по какому мосту?» — «по новому». Это предлог «по» + прилагательное, относится к существительному «мосту» → раздельно."},{"id":"x-rus-t14-g51","k":"mc","les":"RU040","task":14,"q":"«Наш гость свободно говорит (по)русски.» Как пишется?","o":[{"id":"а","t":"через дефис: по-русски"},{"id":"б","t":"раздельно: по русски"}],"c":"а","e":"Как прийти к ответу: наречие с приставкой «по-» и суффиксом -и (как? — по-русски). Такие наречия пишутся через дефис → по-русски."},{"id":"x-rus-t14-g52","k":"mc","les":"RU040","task":14,"q":"«(Во)первых, это дорого, а (во)вторых, неудобно.» Как пишутся эти слова?","o":[{"id":"а","t":"через дефис: во-первых, во-вторых"},{"id":"б","t":"раздельно: во первых, во вторых"}],"c":"а","e":"Как прийти к ответу: наречия, образованные от числительных с «в-/во-» и суффиксом -ых/-их, пишутся через дефис → во-первых, во-вторых."},{"id":"x-rus-t14-g53","k":"mc","les":"RU040","task":14,"q":"«(По)моему, тебе стоит извиниться перед ним.» Как пишется?","o":[{"id":"а","t":"через дефис: по-моему"},{"id":"б","t":"раздельно: по моему"}],"c":"а","e":"Как прийти к ответу: здесь вводное слово-наречие (= «на мой взгляд») с приставкой «по-» и суффиксом -ему → пишется через дефис: по-моему."},{"id":"x-rus-t14-g54","k":"mc","les":null,"task":14,"q":"«Собака побежала (по)моему следу к дому.» Как пишется?","o":[{"id":"а","t":"через дефис: по-моему"},{"id":"б","t":"раздельно: по моему"}],"c":"б","e":"Как прийти к ответу: вопрос «по чьему следу?» — «по моему». Это предлог «по» + притяжательное местоимение при существительном «следу» → раздельно."},{"id":"x-rus-t14-g55","k":"mc","les":"RU040","task":14,"q":"В каком случае выделенное написано ВЕРНО?","o":[{"id":"а","t":"Оденься по зимнему, на улице холодно."},{"id":"б","t":"Он поступил по-товарищески."},{"id":"в","t":"Иду по-новому проспекту."},{"id":"г","t":"Все варианты неверны."}],"c":"б","e":"Как прийти к ответу: во 2-м наречие с «по-» и суффиксом -ки (как? — по-товарищески) → дефис, верно. В 1-м «по-зимнему» тоже наречие, нужен дефис. В 3-м «по новому проспекту» (по какому?) → раздельно. Верный ответ 2."},{"id":"x-rus-t14-g56","k":"mc","les":"RU040","task":14,"q":"«Дай мне что(нибудь) почитать в дорогу.» Как пишется?","o":[{"id":"а","t":"через дефис: что-нибудь"},{"id":"б","t":"раздельно: что нибудь"}],"c":"а","e":"Как прийти к ответу: неопределённое местоимение с суффиксом «-нибудь». Такие слова пишутся через дефис → что-нибудь."},{"id":"x-rus-t14-g57","k":"mc","les":"RU040","task":14,"q":"«(Кое)кто уже успел уйти домой.» Как пишется?","o":[{"id":"а","t":"через дефис: кое-кто"},{"id":"б","t":"раздельно: кое кто"}],"c":"а","e":"Как прийти к ответу: приставка «кое-» с местоимением, между ними нет предлога. Значит пишем через дефис → кое-кто."},{"id":"x-rus-t14-g58","k":"mc","les":"RU040","task":14,"q":"«Расскажи мне что(либо) интересное о поездке.» Как пишется?","o":[{"id":"а","t":"через дефис: что-либо"},{"id":"б","t":"раздельно: что либо"}],"c":"а","e":"Как прийти к ответу: неопределённое местоимение с суффиксом «-либо» → пишется через дефис: что-либо."},{"id":"x-rus-t14-g59","k":"mc","les":null,"task":14,"q":"«Мне нужно кое (с) кем посоветоваться.» Как пишется?","o":[{"id":"а","t":"через дефис: кое-с-кем"},{"id":"б","t":"раздельно, в три слова: кое с кем"}],"c":"б","e":"Как прийти к ответу: между «кое» и «кем» вклинился предлог «с». По правилу в этом случае пишем раздельно, в три слова → кое с кем."},{"id":"x-rus-t14-g60","k":"mc","les":"RU040","task":14,"q":"«(Кто)то настойчиво стучит в дверь.» Как пишется?","o":[{"id":"а","t":"через дефис: кто-то"},{"id":"б","t":"раздельно: кто то"}],"c":"а","e":"Как прийти к ответу: местоимение «кто» + суффикс «-то». Предлога между нет → пишем через дефис: кто-то."},{"id":"x-rus-t14-g61","k":"mc","les":"RU040","task":14,"q":"«Я хочу кое (о) чём тебя спросить.» Как пишется?","o":[{"id":"а","t":"через дефис: кое-о-чём"},{"id":"б","t":"раздельно, в три слова: кое о чём"}],"c":"б","e":"Как прийти к ответу: между «кое» и «чём» стоит предлог «о». В таком случае дефис не ставится, пишем в три слова → кое о чём."},{"id":"x-rus-t14-g62","k":"mc","les":"RU040","task":14,"q":"В каком случае написание ВЕРНО?","o":[{"id":"а","t":"Я коекак добрался до дома."},{"id":"б","t":"Спроси у кого-нибудь дорогу."},{"id":"в","t":"Поговорю кое-с-кем завтра."},{"id":"г","t":"Все варианты неверны."}],"c":"б","e":"Как прийти к ответу: во 2-м «кого-нибудь» — местоимение с «-нибудь» → дефис, верно. В 1-м «кое-как» пишется через дефис (написано слитно — ошибка). В 3-м есть предлог «с», надо «кое с кем» в три слова. Верный ответ 2."},{"id":"x-rus-t15-g01","k":"mc","les":"RU041","task":15,"q":"Сколько Н? кожа_ый диван","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"а","e":"Прилагательное образовано от существительного кожа суффиксом -ан-: кожа → кожа+ан+ый. Суффиксы -ан-/-ян-/-ин- дают одну Н. Пишем кожаный."},{"id":"x-rus-t15-g02","k":"mc","les":null,"task":15,"q":"Сколько Н? серебр_ая ложка","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"а","e":"Серебро → серебр+ян+ый, суффикс -ян-. В -ан-/-ян-/-ин- одна Н. Пишем серебряная."},{"id":"x-rus-t15-g03","k":"mc","les":null,"task":15,"q":"Сколько Н? лебеди_ая песня","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"а","e":"Лебедь → лебед+ин+ый, суффикс -ин-. Суффикс -ин- даёт одну Н. Пишем лебединая."},{"id":"x-rus-t15-g04","k":"mc","les":null,"task":15,"q":"Сколько Н? песча_ый берег","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"а","e":"Песок → песч+ан+ый, суффикс -ан-. Одна Н. Пишем песчаный. (Не путай с суффиксом -енн-.)"},{"id":"x-rus-t15-g05","k":"mc","les":null,"task":15,"q":"Сколько Н? глин_ый горшок","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"а","e":"Глина → глин+ян+ый, суффикс -ян-. Одна Н. Пишем глиняный."},{"id":"x-rus-t15-g06","k":"mc","les":null,"task":15,"q":"Выберите ВЕРНО написанное слово","o":[{"id":"а","t":"стекляный шар"},{"id":"б","t":"стеклянный шар"}],"c":"б","e":"Стеклянный — одно из трёх исключений (стеклянный, оловянный, деревянный), где вопреки суффиксу -ян- пишется НН. Верно: стеклянный."},{"id":"x-rus-t15-g07","k":"mc","les":null,"task":15,"q":"Сколько Н? соломе_ая крыша","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Солома → солом+енн+ый, суффикс -енн-. Суффиксы -енн-/-онн- дают НН. Пишем соломенная."},{"id":"x-rus-t15-g08","k":"mc","les":null,"task":15,"q":"Сколько Н? революцио_ый настрой","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Революция → революци+онн+ый, суффикс -онн-. Пишем НН: революционный."},{"id":"x-rus-t15-g09","k":"mc","les":null,"task":15,"q":"Сколько Н? клюкве_ый морс","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Клюква → клюкв+енн+ый, суффикс -енн-. Пишем НН: клюквенный."},{"id":"x-rus-t15-g10","k":"mc","les":null,"task":15,"q":"Сколько Н? станцио_ый смотритель","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Станция → станци+онн+ый, суффикс -онн-. Пишем НН: станционный."},{"id":"x-rus-t15-g11","k":"mc","les":null,"task":15,"q":"Сколько Н? ветре_ый день","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"а","e":"Ветреный — исключение: пишется одна Н. Но как только появляется приставка, действует общее правило: безветренный — НН."},{"id":"x-rus-t15-g12","k":"mc","les":null,"task":15,"q":"Выберите ВЕРНО написанное слово","o":[{"id":"а","t":"безветреная погода"},{"id":"б","t":"безветренная погода"}],"c":"б","e":"Ветреный — исключение с одной Н, но с приставкой без- пишется НН: безветренная. Приставка снимает исключение."},{"id":"x-rus-t15-g13","k":"mc","les":null,"task":15,"q":"Сколько Н? тума_ое утро","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Основа существительного тумаН оканчивается на Н, добавляем суффикс -н-: туман+н+ый. На стыке две Н → туманное."},{"id":"x-rus-t15-g14","k":"mc","les":null,"task":15,"q":"Сколько Н? дли_ый коридор","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Длина: основа длиН- + суффикс -н- → длин+н+ый. Стык двух Н → длинный."},{"id":"x-rus-t15-g15","k":"mc","les":null,"task":15,"q":"Сколько Н? каме_ый дом","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Камень: основа камеН- + суффикс -н- → камен+н+ый. Две Н на стыке → каменный."},{"id":"x-rus-t15-g16","k":"mc","les":null,"task":15,"q":"Сколько Н? стари_ая книга","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Старина: основа стариН- + суффикс -н- → старин+н+ый. Стык двух Н → старинная."},{"id":"x-rus-t15-g17","k":"mc","les":null,"task":15,"q":"Сколько Н? карти_ая галерея","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Картина: основа картиН- + суффикс -н- → картин+н+ый. Две Н на стыке → картинная."},{"id":"x-rus-t15-g18","k":"mc","les":null,"task":15,"q":"Выберите ВЕРНО написанное слово","o":[{"id":"а","t":"длиный"},{"id":"б","t":"длинный"}],"c":"б","e":"Длина (основа на Н) + суффикс -н- = стык двух Н. Верно: длинный."},{"id":"x-rus-t15-g19","k":"mc","les":null,"task":15,"q":"Сколько Н? жаре_ый картофель","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"а","e":"Проверяем 4 признака: приставки нет, зависимого слова нет, суффикса -ова- нет, глагол жарить несовершенного вида. Все НЕТ → одна Н: жареный."},{"id":"x-rus-t15-g20","k":"mc","les":"RU042","task":15,"q":"Сколько Н? жаре_ый на масле картофель","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Появилось зависимое слово «на масле» (жаренный как? на масле). Есть зависимое слово → это причастие → НН: жаренный."},{"id":"x-rus-t15-g21","k":"mc","les":null,"task":15,"q":"Сколько Н? асфальтирова_ая дорога","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Есть суффикс -ова- (асфальтировать). Наличие -ова-/-ева- сразу даёт НН: асфальтированная."},{"id":"x-rus-t15-g22","k":"mc","les":null,"task":15,"q":"Сколько Н? скоше_ая трава","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Есть приставка с- и глагол совершенного вида скосить (что сделать?). Любого из этих признаков достаточно → НН: скошенная."},{"id":"x-rus-t15-g23","k":"mc","les":null,"task":15,"q":"Сколько Н? решё_ая задача","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Образовано от глагола совершенного вида решить (что сделать?). Совершенный вид → НН: решённая."},{"id":"x-rus-t15-g24","k":"mc","les":null,"task":15,"q":"Сколько Н? коше_ый луг","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"а","e":"Приставки нет, зависимого слова нет, -ова- нет, глагол косить несовершенного вида. Все признаки НЕТ → одна Н: кошеный."},{"id":"x-rus-t15-g25","k":"mc","les":null,"task":15,"q":"Сколько Н? кова_ый сундук","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"а","e":"Кованый — исключение: -ов- здесь входит в корень (ковать), это не суффикс -ова-. Пишется одна Н: кованый (так же жёваный, клёваный)."},{"id":"x-rus-t15-g26","k":"mc","les":null,"task":15,"q":"Сколько Н? неслыха_ая дерзость","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Неслыханный — слово из списка исключений (нежданный, негаданный, невиданный, неслыханный, нечаянный…). Пишется НН, хотя приставка не- обычно не влияет."},{"id":"x-rus-t15-g27","k":"mc","les":null,"task":15,"q":"Выберите ВЕРНО написанное словосочетание","o":[{"id":"а","t":"крашеный забор"},{"id":"б","t":"крашенный забор"}],"c":"а","e":"Нет приставки, зависимого слова, -ова- и глагол красить несовершенного вида — все признаки НЕТ. Значит одна Н: крашеный забор."},{"id":"x-rus-t15-g28","k":"mc","les":"RU041","task":15,"q":"В словосочетании «варёный картофель» пишется Н. Выберите верное объяснение","o":[{"id":"а","t":"Причастие от глагола совершенного вида"},{"id":"б","t":"Отглагольное прилагательное: нет приставки, зависимого слова, суффикса -ова- и глагол варить несовершенного вида"},{"id":"в","t":"Есть зависимое слово"}],"c":"б","e":"Все четыре признака НН отсутствуют (приставки, зависимого слова, -ова- нет; варить — несовершенный вид), поэтому это отглагольное прилагательное с одной Н."},{"id":"x-rus-t15-g29","k":"mc","les":"RU042","task":15,"q":"Сколько Н? Задача реше_а.","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"а","e":"Реше_а — краткое страдательное причастие (задача решена кем? — подразумевается деятель, можно заменить: задачу решили). Краткие причастия — одна Н: решена."},{"id":"x-rus-t15-g30","k":"mc","les":"RU042","task":15,"q":"Сколько Н? Поле засея_о вовремя.","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"а","e":"Засея_о — краткое причастие (поле засеяли, есть действие и деятель). Краткие причастия пишутся с одной Н: засеяно."},{"id":"x-rus-t15-g31","k":"mc","les":"RU042","task":15,"q":"Сколько Н? Девочка воспита_а бабушкой.","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"а","e":"Есть деятель — «бабушкой» (кем воспитана?). Это краткое причастие, обозначает действие → одна Н: воспитана."},{"id":"x-rus-t15-g32","k":"mc","les":"RU041","task":15,"q":"Сколько Н? Девочка умна и воспита_а.","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Здесь нет деятеля, «воспитанна» — постоянное качество, стоит в ряду с прилагательным «умна». Это краткое прилагательное от воспитанная → пишем как в полной форме, НН: воспитанна."},{"id":"x-rus-t15-g33","k":"mc","les":"RU041","task":15,"q":"Сколько Н? Дорога была дли_а.","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Длинна — краткое прилагательное от полного длинный (в нём НН). Краткое прилагательное сохраняет столько же Н, сколько в полной форме → длинна."},{"id":"x-rus-t15-g34","k":"mc","les":"RU042","task":15,"q":"В предложении «Туча рассеяна ветром» пишется Н. Выберите верное объяснение","o":[{"id":"а","t":"Краткое прилагательное, как в полной форме"},{"id":"б","t":"Краткое страдательное причастие: есть деятель «ветром», обозначает действие"},{"id":"в","t":"Это наречие"}],"c":"б","e":"Есть деятель «ветром» (кем рассеяна?), слово обозначает действие и заменяется глаголом (тучу рассеяло). Значит это краткое причастие → одна Н."},{"id":"x-rus-t15-g35","k":"mc","les":"RU041","task":15,"q":"Сколько Н? Он говорил взволнова_о.","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Наречие образовано от прилагательного/причастия взволнованный (НН, есть -ова- и приставка). Наречие сохраняет столько же Н → взволнованно."},{"id":"x-rus-t15-g36","k":"mc","les":"RU041","task":15,"q":"Сколько Н? Ученик отвечал пута_о.","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"а","e":"Наречие образовано от прилагательного путаный (одна Н: нет приставки, зависимого слова, -ова-, глагол путать несов. вида). Значит и в наречии одна Н → путано."},{"id":"x-rus-t15-g37","k":"mc","les":null,"task":15,"q":"Сколько Н? В лагерь приехал новый воспита_ик.","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Существительное образовано от воспитанный (НН). Существительное сохраняет то же число Н → воспитанник."},{"id":"x-rus-t15-g38","k":"mc","les":"RU041","task":15,"q":"Сколько Н? По площади скакала кон_ица.","o":[{"id":"а","t":"Н"},{"id":"б","t":"НН"}],"c":"б","e":"Существительное образовано от прилагательного конный (основа коН- + суффикс -н- = НН). Наследуется НН → конница."},{"id":"x-rus-t15-g39","k":"mc","les":"RU042","task":15,"q":"Выберите ВЕРНО написанное слово (Работали ___)","o":[{"id":"а","t":"организовано"},{"id":"б","t":"организованно"}],"c":"б","e":"Наречие от причастия организованный (суффикс -ова- → НН). Наречие сохраняет НН → работали организованно."},{"id":"x-rus-t16-g01","k":"mc","les":"RU046","task":16,"q":"Мелкий дождь сеял ( ) моросил над крышами домов.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Сеял и моросил — однородные сказуемые (что делал?), относятся к слову «дождь». Союза между ними НЕТ, связь только интонационная. По правилу между однородными без союза ставится запятая. Ответ: нужна."},{"id":"x-rus-t16-g02","k":"mc","les":"RU046","task":16,"q":"Она говорила негромко ( ) неторопливо.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Негромко, неторопливо — одноро
