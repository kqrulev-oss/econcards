разу стало уютнее». Нужна ли запятая?","o":[{"id":"а","t":"Нет"},{"id":"б","t":"Да"}],"c":"а","e":"«Так» — вторая часть двойного союза «когда…так». Изъять придаточное нельзя, поэтому запятая на стыке «и когда» не ставится."},{"id":"x-rus-t20-g30","k":"mc","les":"RU053","task":20,"q":"«Он предупредил, что ( ) хотя дорога дальняя, но выехать надо утром». Нужна ли запятая?","o":[{"id":"а","t":"Нет"},{"id":"б","t":"Да"}],"c":"а","e":"«Хотя…но» — двойной уступительный союз. Раз есть «но», придаточное не изъять, и запятая на стыке «что хотя» не ставится."},{"id":"x-rus-t20-g31","k":"mc","les":"RU053","task":20,"q":"«Погода портилась, но ( ) если бы мы поспешили, то успели бы до дождя». Нужна ли запятая?","o":[{"id":"а","t":"Нет"},{"id":"б","t":"Да"}],"c":"а","e":"Есть «то» — двойной союз «если…то». Изъятие невозможно, поэтому запятая на стыке «но если» не ставится."},{"id":"x-rus-t20-g32","k":"mc","les":"RU053","task":20,"q":"Как понять, что запятая на стыке НЕ нужна?","o":[{"id":"а","t":"После придаточного стоит то/так/но — вторая часть двойного союза"},{"id":"б","t":"После придаточного сразу стоит запятая"},{"id":"в","t":"Первый союз обязательно сочинительный"},{"id":"г","t":"Придаточное состоит из многих слов"}],"c":"а","e":"Единственный признак «без запятой» — наличие второй части двойного союза (то/так/но). Она связывает придаточное с главной частью так, что изъять его нельзя."},{"id":"x-rus-t20-g33","k":"mc","les":"RU053","task":20,"q":"В каком предложении запятая на стыке союзов НЕ нужна?","o":[{"id":"а","t":"Оказалось, что если выехать на рассвете, то пробок не будет"},{"id":"б","t":"Оказалось, что если выехать на рассвете, пробок не будет"}],"c":"а","e":"В первом есть «если…то» — двойной союз, запятой на стыке «что если» нет. Во втором «то» отсутствует, изъятие проходит, поэтому там запятая нужна."},{"id":"x-rus-t20-g34","k":"mc","les":"RU053","task":20,"q":"Ответ: «запятая не нужна». Какое объяснение верно для «..., и когда стемнело, то мы зажгли костёр»?","o":[{"id":"а","t":"После придаточного стоит «то» — вторая часть двойного союза «когда…то»"},{"id":"б","t":"Придаточное легко изымается"},{"id":"в","t":"«и» — подчинительный союз"},{"id":"г","t":"Слов то/так/но в предложении нет"}],"c":"а","e":"Именно «то» превращает союз в двойной «когда…то». Его части нельзя разрывать изъятием придаточного, поэтому запятая на стыке «и когда» не ставится."},{"id":"x-rus-t20-g35","k":"mc","les":"RU053","task":20,"q":"«Брат написал, что ( ) когда приедет, привезёт подарки». Нужна ли запятая?","o":[{"id":"а","t":"Да"},{"id":"б","t":"Нет"}],"c":"а","e":"Стык «что + когда», ТО нет. Изымаем: «Брат написал, что привезёт подарки» — цело. Запятая нужна."},{"id":"x-rus-t20-g36","k":"mc","les":"RU053","task":20,"q":"«Брат написал, что ( ) когда приедет, то привезёт подарки». Нужна ли запятая?","o":[{"id":"а","t":"Да"},{"id":"б","t":"Нет"}],"c":"б","e":"Здесь «когда…то» — двойной союз. Придаточное не изъять, поэтому запятая на стыке «что когда» не ставится."},{"id":"x-rus-t20-g37","k":"mc","les":"RU053","task":20,"q":"«Ветер стих, и ( ) чтобы согреться, туристы развели костёр». Нужна ли запятая?","o":[{"id":"а","t":"Да"},{"id":"б","t":"Нет"}],"c":"а","e":"Стык «и + чтобы». Изымаем: «Ветер стих, и туристы развели костёр» — цело, у «чтобы» пары то/так/но нет. Запятая нужна."},{"id":"x-rus-t20-g38","k":"mc","les":"RU053","task":20,"q":"«Все понимали, что ( ) если не поторопиться, поезд уйдёт». Нужна ли запятая?","o":[{"id":"а","t":"Да"},{"id":"б","t":"Нет"}],"c":"а","e":"Стык «что + если», ТО отсутствует. Изымаем: «Все понимали, что поезд уйдёт» — цело. Запятая на стыке нужна."},{"id":"x-rus-t20-g39","k":"mc","les":"RU053","task":20,"q":"Расставь шаги алгоритма задания 20 в правильном порядке:","o":[{"id":"а","t":"1) найти два союза; 2) убедиться, что дальше придаточное; 3) проверить, есть ли то/так/но; 4) есть — без запятой, нет — с запятой"},{"id":"б","t":"1) сосчитать слова; 2) поставить запятую; 3) проверить падеж; 4) убрать союз"},{"id":"в","t":"1) найти сказуемое; 2) найти подлежащее; 3) поставить тире; 4) закончить"}],"c":"а","e":"Верный алгоритм: находим стык союзов, убеждаемся в наличии придаточного, ищем вторую часть двойного союза (то/так/но) и по ней решаем — есть она, значит без запятой; нет — с запятой."},{"id":"x-rus-t20-g40","k":"mc","les":"RU053","task":20,"q":"В каком предложении запятая на стыке союзов расставлена ВЕРНО?","o":[{"id":"а","t":"Все затихли, и, когда учитель вошёл, урок начался"},{"id":"б","t":"Все затихли, и когда учитель вошёл, то, урок начался"},{"id":"в","t":"Все затихли и, когда учитель вошёл, то урок начался"}],"c":"а","e":"Придаточное «когда учитель вошёл» изымается: «Все затихли, и урок начался». Значит, оно выделяется с двух сторон, и на стыке «и когда» запятая стоит верно — вариант 1."},{"id":"x-rus-t20-g41","k":"mc","les":"RU053","task":20,"q":"Предложение «Гости заметили, что ( ) если хозяин молчит, то беседа гаснет». Верный ответ и почему?","o":[{"id":"а","t":"Запятая не нужна: есть «то» — двойной союз «если…то»"},{"id":"б","t":"Запятая нужна: придаточное легко изъять"},{"id":"в","t":"Запятая не нужна: «что» — сочинительный союз"},{"id":"г","t":"Запятая нужна: после «если» всегда ставится запятая"}],"c":"а","e":"Ключ — слово «то» после придаточного. Оно образует двойной союз «если…то», части которого нельзя разрывать, поэтому запятая на стыке «что если» не ставится."},{"id":"x-rus-t21-g01","k":"mc","les":"RU054","task":21,"q":"Чтение (?) вот лучшее учение. Какой знак ставится и почему?","o":[{"id":"а","t":"Тире: подлежащее и сказуемое — существительные, сказуемое присоединяется словом «вот»"},{"id":"б","t":"Двоеточие: вторая часть поясняет причину"},{"id":"в","t":"Запятая: обособляется вводное слово"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"Основа: подлежащее «чтение» (сущ. И.п.), сказуемое «учение» (сущ. И.п.). Связки нет, а перед сказуемым стоит «вот» — это прямой сигнал тире: Чтение — вот лучшее учение."},{"id":"x-rus-t21-g02","k":"mc","les":"RU054","task":21,"q":"Пять (?) нечётное число. Какой знак ставится и почему?","o":[{"id":"а","t":"Тире: подлежащее — числительное, сказуемое — существительное в И.п., связки нет"},{"id":"б","t":"Двоеточие: перечисление"},{"id":"в","t":"Запятая: однородные члены"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"Подлежащее «пять» (числительное), сказуемое «число» (сущ. И.п.). Между числительным-подлежащим и существительным-сказуемым без связки ставится тире: Пять — нечётное число."},{"id":"x-rus-t21-g03","k":"mc","les":"RU054","task":21,"q":"Жить (?) Родине служить. Какой знак ставится и почему?","o":[{"id":"а","t":"Тире: подлежащее и сказуемое выражены инфинитивами"},{"id":"б","t":"Двоеточие: пояснение"},{"id":"в","t":"Запятая: сравнительный оборот"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"И подлежащее «жить», и сказуемое «служить» выражены инфинитивами. При двух инфинитивах (или инфинитиве + сущ. И.п.) ставится тире: Жить — Родине служить."},{"id":"x-rus-t21-g04","k":"mc","les":"RU054","task":21,"q":"Наша задача (?) хорошо учиться. Какой знак ставится и почему?","o":[{"id":"а","t":"Тире: подлежащее — существительное И.п., сказуемое — инфинитив, связки нет"},{"id":"б","t":"Двоеточие: причина"},{"id":"в","t":"Запятая: обособление"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"Подлежащее «задача» (сущ. И.п.), сказуемое «учиться» (инфинитив). Сущ. И.п. + инфинитив без связки требуют тире: Наша задача — хорошо учиться."},{"id":"x-rus-t21-g05","k":"mc","les":"RU054","task":21,"q":"В каком предложении тире между подлежащим и сказуемым НЕ ставится?","o":[{"id":"а","t":"Москва столица России"},{"id":"б","t":"Сердце не камень"},{"id":"в","t":"Дважды два четыре"},{"id":"г","t":"Книга источник знаний"}],"c":"б","e":"Ищем случай, мешающий постановке тире. В «Сердце не камень» перед сказуемым-существительным стоит частица «не» — тире не ставится. В остальных — сущ. И.п. + сущ. И.п. без помех, тире нужно."},{"id":"x-rus-t21-g06","k":"mc","les":"RU054","task":21,"q":"В предложении «Лес — друг человека» тире стоит верно. Выберите верное объяснение.","o":[{"id":"а","t":"Подлежащее и сказуемое — существительные в И.п., глагол-связка отсутствует"},{"id":"б","t":"Это неполное предложение, пропущено сказуемое"},{"id":"в","t":"Обобщающее слово стоит перед однородными членами"},{"id":"г","t":"Вторая часть указывает причину"}],"c":"а","e":"«Лес» и «друг» — существительные в именительном падеже, между ними нет связки, нет «не» и «как». Это классический случай тире между подлежащим и сказуемым."},{"id":"x-rus-t21-g07","k":"mc","les":"RU055","task":21,"q":"В лесу, в поле, на лугу (?) везде цвели цветы. Какой знак ставится и почему?","o":[{"id":"а","t":"Тире: обобщающее слово «везде» стоит после однородных членов"},{"id":"б","t":"Двоеточие: обобщающее слово стоит перед однородными"},{"id":"в","t":"Запятая: продолжение перечисления"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"Однородные обстоятельства «в лесу, в поле, на лугу» стоят перед обобщающим словом «везде». Обобщающее слово после перечисления — ставим перед ним тире."},{"id":"x-rus-t21-g08","k":"mc","les":"RU055","task":21,"q":"И берёзы, и клёны, и дубы (?) все деревья оделись листвой. Какой знак ставится?","o":[{"id":"а","t":"Тире: обобщающее слово «все деревья» стоит после однородных членов"},{"id":"б","t":"Двоеточие: причина"},{"id":"в","t":"Запятая"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"Перечисление «берёзы, клёны, дубы» предшествует обобщающему словосочетанию «все деревья». Обобщающее слово стоит после однородных — ставим тире."},{"id":"x-rus-t21-g09","k":"mc","les":"RU055","task":21,"q":"Ни справа, ни слева, ни впереди (?) нигде не было видно жилья. Какой знак ставится?","o":[{"id":"а","t":"Тире: обобщающее слово «нигде» стоит после однородных членов"},{"id":"б","t":"Двоеточие: пояснение"},{"id":"в","t":"Запятая"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"Однородные обстоятельства «ни справа, ни слева, ни впереди» стоят перед обобщающим словом «нигде». Обобщающее после перечисления — тире."},{"id":"x-rus-t21-g10","k":"mc","les":"RU055","task":21,"q":"Столы, стулья, шкафы (?) вся мебель была старой. Какой знак ставится?","o":[{"id":"а","t":"Тире: обобщающее слово «вся мебель» стоит после однородных членов"},{"id":"б","t":"Двоеточие: обобщающее перед однородными"},{"id":"в","t":"Запятая"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"Перечисление предметов идёт первым, обобщающее «вся мебель» — после него. Обобщающее слово после однородных членов отделяется тире."},{"id":"x-rus-t21-g11","k":"mc","les":"RU054","task":21,"q":"Расставьте знаки: «Всё вокруг (?1) поля, леса, реки (?2) было залито солнцем.» Какие знаки на местах (?1) и (?2)?","o":[{"id":"а","t":"(?1) двоеточие, (?2) тире"},{"id":"б","t":"(?1) тире, (?2) двоеточие"},{"id":"в","t":"(?1) двоеточие, (?2) запятая"},{"id":"г","t":"(?1) запятая, (?2) тире"}],"c":"а","e":"Обобщающее слово «всё» стоит ПЕРЕД однородными «поля, леса, реки» — после него двоеточие. После перечисления предложение продолжается сказуемым «было залито» — перед ним ставится тире: Всё вокруг: поля, леса, реки — было залито солнцем."},{"id":"x-rus-t21-g12","k":"mc","les":"RU054","task":21,"q":"Мир освещается солнцем, а человек (?) знанием. Какой знак ставится и почему?","o":[{"id":"а","t":"Тире: неполное предложение, пропущено сказуемое «освещается»"},{"id":"б","t":"Двоеточие: пояснение"},{"id":"в","t":"Запятая: однородные члены"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"Во второй части есть подлежащее «человек» и дополнение «знанием», но нет сказуемого — оно восстанавливается из первой части («освещается»). На месте пропуска ставится тире."},{"id":"x-rus-t21-g13","k":"mc","les":"RU054","task":21,"q":"Одни собирали грибы, другие (?) ягоды. Какой знак ставится?","o":[{"id":"а","t":"Тире: неполное предложение, пропущено сказуемое «собирали»"},{"id":"б","t":"Двоеточие: причина"},{"id":"в","t":"Запятая"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"Во второй части подлежащее «другие» и дополнение «ягоды», но сказуемое отсутствует — оно ясно из первой части («собирали»). Пропуск сказуемого обозначается тире."},{"id":"x-rus-t21-g14","k":"mc","les":"RU054","task":21,"q":"Ты пойдёшь в кино, а я (?) домой. Какой знак ставится?","o":[{"id":"а","t":"Тире: неполное предложение, пропущено сказуемое «пойду»"},{"id":"б","t":"Двоеточие: пояснение"},{"id":"в","t":"Запятая"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"Во второй части есть «я … домой», но нет сказуемого; оно восстанавливается из первой части («пойду»). На месте пропуска — тире."},{"id":"x-rus-t21-g15","k":"mc","les":"RU054","task":21,"q":"Вечером мы пошли в театр, а наши друзья (?) на концерт. Какой знак ставится?","o":[{"id":"а","t":"Тире: неполное предложение, пропущено сказуемое «пошли»"},{"id":"б","t":"Двоеточие: дополнение"},{"id":"в","t":"Запятая"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"Во второй части подлежащее «друзья» и обстоятельство «на концерт», сказуемое пропущено (ясно из первой части — «пошли»). Пропуск обозначаем тире."},{"id":"x-rus-t21-g16","k":"mc","les":"RU054","task":21,"q":"В каком предложении тире ставится на месте пропущенного члена (неполное предложение)?","o":[{"id":"а","t":"Он врач по призванию"},{"id":"б","t":"Ты идёшь в школу, а я на работу"},{"id":"в","t":"Лес наше богатство"},{"id":"г","t":"Читать значит мыслить"}],"c":"б","e":"Проверяем каждую основу. В «Ты идёшь в школу, а я … на работу» во второй части пропущено сказуемое «иду» — это неполное предложение, здесь и нужно тире. В остальных тире связано с подлежащим и сказуемым, а не с пропуском."},{"id":"x-rus-t21-g17","k":"mc","les":"RU054","task":21,"q":"Труд человека кормит (?) лень портит. Какой знак ставится и почему?","o":[{"id":"а","t":"Тире: части бессоюзного предложения противопоставлены (можно вставить «а»)"},{"id":"б","t":"Двоеточие: причина"},{"id":"в","t":"Запятая: однородные"},{"id":"г","t":"Двоеточие: пояснение"}],"c":"а","e":"Две основы, союза нет — БСП. Между частями явный контраст: «Труд кормит, А лень портит». Возможность вставить «а» указывает на тире."},{"id":"x-rus-t21-g18","k":"mc","les":"RU054","task":21,"q":"Ты богат (?) я очень беден. Какой знак ставится?","o":[{"id":"а","t":"Тире: части противопоставлены (можно вставить «а»)"},{"id":"б","t":"Двоеточие: причина"},{"id":"в","t":"Запятая"},{"id":"г","t":"Двоеточие: дополнение"}],"c":"а","e":"БСП без союза; смысл частей противоположен: «ты богат, А я беден». Между противопоставленными частями ставится тире."},{"id":"x-rus-t21-g19","k":"mc","les":"RU054","task":21,"q":"Лето собирает (?) зима поедает. Какой знак ставится?","o":[{"id":"а","t":"Тире: противопоставление (можно вставить «а»)"},{"id":"б","t":"Двоеточие: пояснение"},{"id":"в","t":"Запятая"},{"id":"г","t":"Двоеточие: причина"}],"c":"а","e":"Части БСП противопоставлены по смыслу: «лето собирает, А зима поедает». Вставляется «а» — ставим тире."},{"id":"x-rus-t21-g20","k":"mc","les":"RU054","task":21,"q":"Служить бы рад (?) прислуживаться тошно. Какой знак ставится?","o":[{"id":"а","t":"Тире: части противопоставлены (можно вставить «но»)"},{"id":"б","t":"Двоеточие: причина"},{"id":"в","t":"Запятая"},{"id":"г","t":"Двоеточие: пояснение"}],"c":"а","e":"Между частями БСП контраст: «служить рад, НО прислуживаться тошно». Противопоставление (а/но) обозначается тире."},{"id":"x-rus-t21-g21","k":"mc","les":"RU054","task":21,"q":"В каком бессоюзном предложении ставится тире, потому что части противопоставлены (можно вставить «а/но»)?","o":[{"id":"а","t":"Чин следовал ему — он службу вдруг оставил"},{"id":"б","t":"Я доверяю ему: он честный человек"},{"id":"в","t":"Погода испортилась: пошёл дождь"},{"id":"г","t":"Знаю: будет гроза"}],"c":"а","e":"Ищем противопоставление. В «Чин следовал ему — он службу вдруг оставил» между частями можно вставить «но» (ожидание против поступка) — это тире. Остальные варианты — двоеточие (причина/пояснение/дополнение)."},{"id":"x-rus-t21-g22","k":"mc","les":"RU054","task":21,"q":"Сыр выпал (?) с ним была плутовка такова. Какой знак ставится и почему?","o":[{"id":"а","t":"Тире: быстрая смена событий, неожиданный результат"},{"id":"б","t":"Двоеточие: причина"},{"id":"в","t":"Запятая"},{"id":"г","t":"Двоеточие: пояснение"}],"c":"а","e":"БСП; события следуют стремительно одно за другим с эффектом неожиданности («сыр выпал — и плутовки след простыл»). Быстрая смена событий обозначается тире."},{"id":"x-rus-t21-g23","k":"mc","les":"RU054","task":21,"q":"Сверкнула молния (?) грянул гром. Какой знак ставится?","o":[{"id":"а","t":"Тире: быстрая смена событий"},{"id":"б","t":"Двоеточие: причина"},{"id":"в","t":"Запятая"},{"id":"г","t":"Двоеточие: дополнение"}],"c":"а","e":"Два события в БСП сменяют друг друга стремительно, одно тут же следует за другим. Такая быстрая смена событий обозначается тире."},{"id":"x-rus-t21-g24","k":"mc","les":"RU054","task":21,"q":"Игнат спустил курок (?) ружьё дало осечку. Какой знак ставится?","o":[{"id":"а","t":"Тире: неожиданный результат, быстрая смена событий"},{"id":"б","t":"Двоеточие: причина"},{"id":"в","t":"Запятая"},{"id":"г","t":"Двоеточие: пояснение"}],"c":"а","e":"БСП; вторая часть — неожиданный итог действия первой (ждали выстрел — вышла осечка). Неожиданный результат / быстрая смена — тире."},{"id":"x-rus-t21-g25","k":"mc","les":"RU054","task":21,"q":"Дан знак — тире (быстрая смена событий). В каком предложении оно оправдано этим значением?","o":[{"id":"а","t":"Сыр выпал — с ним была плутовка такова"},{"id":"б","t":"Мне грустно: друг уехал"},{"id":"в","t":"Смотрю: всё вокруг цветёт"},{"id":"г","t":"Знаю: ты придёшь"}],"c":"а","e":"Быстрая смена событий — в «Сыр выпал — …такова»: события мгновенно следуют друг за другом. Остальные — двоеточие: причина (грустно, потому что уехал), дополнение (смотрю и вижу, что…; знаю, что…)."},{"id":"x-rus-t21-g26","k":"mc","les":"RU054","task":21,"q":"Настанет утро (?) двинемся в путь. Какой знак ставится и почему?","o":[{"id":"а","t":"Тире: первая часть указывает время/условие (можно вставить «когда/если»)"},{"id":"б","t":"Двоеточие: причина"},{"id":"в","t":"Запятая"},{"id":"г","t":"Двоеточие: пояснение"}],"c":"а","e":"БСП; первая часть указывает на время/условие: «КОГДА настанет утро, двинемся в путь». Значение условия/времени в первой части обозначается тире."},{"id":"x-rus-t21-g27","k":"mc","les":"RU054","task":21,"q":"Взошло солнце (?) стало тепло. Какой знак ставится?","o":[{"id":"а","t":"Тире: вторая часть — следствие (можно вставить «поэтому»)"},{"id":"б","t":"Двоеточие: причина"},{"id":"в","t":"Запятая"},{"id":"г","t":"Двоеточие: дополнение"}],"c":"а","e":"БСП; вторая часть — следствие первой: «взошло солнце, ПОЭТОМУ стало тепло». Значение следствия/вывода обозначается тире."},{"id":"x-rus-t21-g28","k":"mc","les":"RU054","task":21,"q":"Любишь кататься (?) люби и саночки возить. Какой знак ставится?","o":[{"id":"а","t":"Тире: первая часть — условие (можно вставить «если»)"},{"id":"б","t":"Двоеточие: причина"},{"id":"в","t":"Запятая"},{"id":"г","t":"Двоеточие: пояснение"}],"c":"а","e":"БСП; первая часть — условие: «ЕСЛИ любишь кататься, люби и саночки возить». Условие в первой части обозначается тире."},{"id":"x-rus-t21-g29","k":"mc","les":"RU054","task":21,"q":"Ударил сильный мороз (?) деревья затрещали. Какой знак ставится?","o":[{"id":"а","t":"Тире: вторая часть — следствие (можно вставить «так что»)"},{"id":"б","t":"Двоеточие: причина"},{"id":"в","t":"Запятая"},{"id":"г","t":"Двоеточие: пояснение"}],"c":"а","e":"БСП; вторая часть — результат первой: «ударил мороз, ТАК ЧТО деревья затрещали». Следствие обозначается тире."},{"id":"x-rus-t21-g30","k":"mc","les":"RU054","task":21,"q":"В каком бессоюзном предложении ставится тире, потому что вторая часть — следствие (можно вставить «поэтому»)?","o":[{"id":"а","t":"Солнце село — похолодало"},{"id":"б","t":"Я замёрз: было холодно"},{"id":"в","t":"Он сказал: пора идти"},{"id":"г","t":"Знаю: ты придёшь"}],"c":"а","e":"Следствие — в «Солнце село — похолодало»: «село солнце, ПОЭТОМУ похолодало». Остальные — двоеточие: причина («потому что было холодно»), прямая речь, дополнение («знаю, что придёшь»)."},{"id":"x-rus-t21-g31","k":"mc","les":"RU054","task":21,"q":"Со мной был чугунный чайник (?) единственная моя отрада. Какой знак ставится и почему?","o":[{"id":"а","t":"Тире: распространённое приложение в конце предложения поясняет существительное"},{"id":"б","t":"Двоеточие: причина"},{"id":"в","t":"Запятая: вводное слово"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"«Единственная моя отрада» — приложение, второе название чайника, стоящее в конце предложения и поясняющее его (можно вставить «а именно»). Перед таким приложением ставится тире."},{"id":"x-rus-t21-g32","k":"mc","les":"RU054","task":21,"q":"Я люблю этот город (?) город моего детства. Какой знак ставится?","o":[{"id":"а","t":"Тире: пояснительное приложение в конце предложения"},{"id":"б","t":"Двоеточие: причина"},{"id":"в","t":"Запятая: однородные"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"«Город моего детства» — приложение, поясняющее слово «город», стоящее в конце предложения. Перед распространённым пояснительным приложением ставится тире."},{"id":"x-rus-t21-g33","k":"mc","les":"RU054","task":21,"q":"Рядом сидел мой сосед (?) старый рыбак. Какой знак ставится?","o":[{"id":"а","t":"Тире: приложение в конце предложения уточняет существительное"},{"id":"б","t":"Двоеточие: пояснение причины"},{"id":"в","t":"Запятая: сравнение"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"«Старый рыбак» — приложение к «сосед», стоящее в конце и уточняющее его (кто именно). Перед приложением в конце предложения ставится тире."},{"id":"x-rus-t21-g34","k":"mc","les":"RU054","task":21,"q":"Он показал на цветок (?) символ надежды. Какой знак ставится?","o":[{"id":"а","t":"Тире: пояснительное приложение в конце предложения"},{"id":"б","t":"Двоеточие: дополнение"},{"id":"в","t":"Запятая"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"«Символ надежды» — приложение к «цветок», поясняющее его значение и стоящее в конце предложения (можно вставить «а именно»). Ставится тире."},{"id":"x-rus-t21-g35","k":"mc","les":"RU054","task":21,"q":"В предложении «Мы подошли к Байкалу — самому глубокому озеру мира» тире стоит верно. Выберите верное объяснение.","o":[{"id":"а","t":"Обособленное приложение в конце предложения с пояснительным значением"},{"id":"б","t":"Подлежащее и сказуемое — существительные"},{"id":"в","t":"Неполное предложение, пропущено сказуемое"},{"id":"г","t":"Обобщающее слово после однородных членов"}],"c":"а","e":"«Самому глубокому озеру мира» — приложение, поясняющее «Байкал», стоящее в конце предложения. Именно пояснительное приложение в конце фразы отделяется тире."},{"id":"x-rus-t21-g36","k":"mc","les":"RU055","task":21,"q":"Всё изменилось вокруг (?) и погода, и настроение, и планы. Какой знак ставится и почему?","o":[{"id":"а","t":"Двоеточие: обобщающее слово «всё» стоит перед однородными членами"},{"id":"б","t":"Тире: обобщающее слово после однородных"},{"id":"в","t":"Запятая"},{"id":"г","t":"Тире: следствие"}],"c":"а","e":"Обобщающее слово «всё» стоит ПЕРЕД перечислением «погода, настроение, планы». После обобщающего слова, стоящего перед однородными, ставится двоеточие."},{"id":"x-rus-t21-g37","k":"mc","les":"RU055","task":21,"q":"В корзине лежали фрукты (?) яблоки, груши, сливы. Какой знак ставится?","o":[{"id":"а","t":"Двоеточие: обобщающее слово «фрукты» стоит перед однородными"},{"id":"б","t":"Тире: обобщающее после однородных"},{"id":"в","t":"Запятая"},{"id":"г","t":"Тире: пояснение"}],"c":"а","e":"«Фрукты» — обобщающее слово перед перечислением «яблоки, груши, сливы». Обобщающее слово перед однородными членами требует двоеточия."},{"id":"x-rus-t21-g38","k":"mc","les":"RU055","task":21,"q":"Меня окружали знакомые лица (?) друзья, соседи, коллеги. Какой знак ставится?","o":[{"id":"а","t":"Двоеточие: обобщающее словосочетание «знакомые лица» стоит перед однородными"},{"id":"б","t":"Тире: обобщающее после однородных"},{"id":"в","t":"Запятая"},{"id":"г","t":"Тире: противопоставление"}],"c":"а","e":"«Знакомые лица» — обобщающее словосочетание перед перечислением «друзья, соседи, коллеги». Обобщающее перед однородными — двоеточие."},{"id":"x-rus-t21-g39","k":"mc","les":"RU055","task":21,"q":"На выставке было представлено всё (?) картины, скульптуры, гравюры. Какой знак ставится?","o":[{"id":"а","t":"Двоеточие: обобщающее слово «всё» стоит перед однородными"},{"id":"б","t":"Тире: следствие"},{"id":"в","t":"Запятая"},{"id":"г","t":"Тире: обобщающее после однородных"}],"c":"а","e":"Обобщающее слово «всё» предшествует перечислению «картины, скульптуры, гравюры». После обобщающего слова перед однородными ставится двоеточие."},{"id":"x-rus-t21-g40","k":"mc","les":"RU054","task":21,"q":"Расставьте знаки: «Кругом (?1) в саду, во дворе, на улице (?2) было тихо.» Какие знаки на местах (?1) и (?2)?","o":[{"id":"а","t":"(?1) двоеточие, (?2) тире"},{"id":"б","t":"(?1) тире, (?2) двоеточие"},{"id":"в","t":"(?1) двоеточие, (?2) запятая"},{"id":"г","t":"(?1) запятая, (?2) двоеточие"}],"c":"а","e":"Обобщающее слово «кругом» стоит перед однородными «в саду, во дворе, на улице» — после него двоеточие. После перечисления предложение продолжается — перед сказуемым «было тихо» ставится тире: Кругом: в саду, во дворе, на улице — было тихо."},{"id":"x-rus-t21-g41","k":"mc","les":"RU054","task":21,"q":"Я люблю осень (?) она дарит спокойствие. Какой знак ставится и почему?","o":[{"id":"а","t":"Двоеточие: вторая часть указывает причину (можно вставить «потому что»)"},{"id":"б","t":"Тире: следствие"},{"id":"в","t":"Запятая"},{"id":"г","t":"Тире: противопоставление"}],"c":"а","e":"БСП; вторая часть объясняет причину первой: «люблю осень, ПОТОМУ ЧТО она дарит спокойствие». Значение причины во второй части обозначается двоеточием."},{"id":"x-rus-t21-g42","k":"mc","les":"RU054","task":21,"q":"Он покраснел (?) ему было стыдно. Какой знак ставится?","o":[{"id":"а","t":"Двоеточие: причина (можно вставить «потому что»)"},{"id":"б","t":"Тире: быстрая смена"},{"id":"в","t":"Запятая"},{"id":"г","t":"Тире: следствие"}],"c":"а","e":"БСП; вторая часть — причина первой: «покраснел, ПОТОМУ ЧТО было стыдно». Причина обозначается двоеточием."},{"id":"x-rus-t21-g43","k":"mc","les":"RU054","task":21,"q":"Дорогу размыло (?) прошёл сильный дождь. Какой знак ставится?","o":[{"id":"а","t":"Двоеточие: причина (можно вставить «так как»)"},{"id":"б","t":"Тире: следствие"},{"id":"в","t":"Запятая"},{"id":"г","t":"Тире: противопоставление"}],"c":"а","e":"БСП; вторая часть объясняет, почему произошло действие первой: «дорогу размыло, ТАК КАК прошёл дождь». Значение причины — двоеточие."},{"id":"x-rus-t21-g44","k":"mc","les":"RU054","task":21,"q":"Не спится, няня (?) здесь так душно. Какой знак ставится?","o":[{"id":"а","t":"Двоеточие: причина (можно вставить «потому что»)"},{"id":"б","t":"Тире: быстрая смена"},{"id":"в","t":"Запятая"},{"id":"г","t":"Тире: следствие"}],"c":"а","e":"БСП; вторая часть называет причину состояния из первой: «не спится, ПОТОМУ ЧТО душно». Причина обозначается двоеточием."},{"id":"x-rus-t21-g45","k":"mc","les":"RU054","task":21,"q":"В каком бессоюзном предложении ставится двоеточие, потому что вторая часть — причина (можно вставить «потому что»)?","o":[{"id":"а","t":"Я расстроился: проиграл матч"},{"id":"б","t":"Проиграл матч — расстроился"},{"id":"в","t":"Позвал — все обернулись"},{"id":"г","t":"Настанет вечер — пойдём домой"}],"c":"а","e":"Причина — в «Я расстроился: проиграл матч» («расстроился, ПОТОМУ ЧТО проиграл»). В остальных — тире: следствие («проиграл, поэтому расстроился»), быстрая смена, условие/время."},{"id":"x-rus-t21-g46","k":"mc","les":"RU054","task":21,"q":"Задача была такова (?) добраться до вершины к рассвету. Какой знак ставится и почему?","o":[{"id":"а","t":"Двоеточие: вторая часть поясняет содержание первой (можно вставить «а именно»)"},{"id":"б","t":"Тире: быстрая смена"},{"id":"в","t":"Запятая"},{"id":"г","t":"Тире: противопоставление"}],"c":"а","e":"БСП; вторая часть раскрывает, в чём именно состояла задача: «задача такова, А ИМЕННО добраться до вершины». Пояснение обозначается двоеточием."},{"id":"x-rus-t21-g47","k":"mc","les":"RU054","task":21,"q":"Случилось непредвиденное (?) машина сломалась в пути. Какой знак ставится?","o":[{"id":"а","t":"Двоеточие: вторая часть поясняет первую (можно вставить «а именно»)"},{"id":"б","t":"Тире: следствие"},{"id":"в","t":"Запятая"},{"id":"г","t":"Тире: противопоставление"}],"c":"а","e":"БСП; вторая часть конкретизирует, что именно случилось: «непредвиденное, А ИМЕННО машина сломалась». Пояснение — двоеточие."},{"id":"x-rus-t21-g48","k":"mc","les":"RU054","task":21,"q":"Условие простое (?) выиграет самый быстрый. Какой знак ставится?","o":[{"id":"а","t":"Двоеточие: вторая часть раскрывает содержание первой (можно вставить «а именно»)"},{"id":"б","t":"Тире: быстрая смена"},{"id":"в","t":"Запятая"},{"id":"г","t":"Тире: следствие"}],"c":"а","e":"БСП; вторая часть поясняет, в чём состоит условие: «условие простое, А ИМЕННО выиграет быстрый». Пояснение обозначается двоеточием."},{"id":"x-rus-t21-g49","k":"mc","les":"RU054","task":21,"q":"План был прост (?) ждать до утра. Какой знак ставится?","o":[{"id":"а","t":"Двоеточие: вторая часть поясняет первую (можно вставить «а именно»)"},{"id":"б","t":"Тире: следствие"},{"id":"в","t":"Запятая"},{"id":"г","t":"Тире: противопоставление"}],"c":"а","e":"БСП; вторая часть раскрывает содержание слова «прост»: «план прост, А ИМЕННО ждать до утра». Пояснение — двоеточие."},{"id":"x-rus-t21-g50","k":"mc","les":"RU054","task":21,"q":"В каком бессоюзном предложении двоеточие ставится именно потому, что вторая часть ПОЯСНЯЕТ первую (можно вставить «а именно»)?","o":[{"id":"а","t":"Порядок был такой: сначала младшие, потом старшие"},{"id":"б","t":"Стемнело — зажгли фонари"},{"id":"в","t":"Он опоздал: проспал"},{"id":"г","t":"Крикнул — все обернулись"}],"c":"а","e":"Пояснение («а именно») — в «Порядок был такой: сначала младшие, потом старшие»: вторая часть раскрывает, каков порядок. «Он опоздал: проспал» — тоже двоеточие, но это причина («потому что»), а не пояснение; остальные — тире (следствие, быстрая смена)."},{"id":"x-rus-t21-g51","k":"mc","les":"RU054","task":21,"q":"Я знаю (?) завтра будет дождь. Какой знак ставится и почему?","o":[{"id":"а","t":"Двоеточие: вторая часть дополняет глагол «знаю» (можно вставить «что»)"},{"id":"б","t":"Тире: следствие"},{"id":"в","t":"Запятая"},{"id":"г","t":"Тире: противопоставление"}],"c":"а","e":"В первой части глагол мысли «знаю», вторая часть его дополняет: «знаю, ЧТО будет дождь». При глаголах знать/видеть/слышать/чувствовать ставится двоеточие."},{"id":"x-rus-t21-g52","k":"mc","les":"RU054","task":21,"q":"Вдруг чувствую (?) кто-то трогает меня за плечо. Какой знак ставится?","o":[{"id":"а","t":"Двоеточие: вторая часть дополняет глагол «чувствую» (можно вставить «что»)"},{"id":"б","t":"Тире: быстрая смена"},{"id":"в","t":"Запятая"},{"id":"г","t":"Тире: следствие"}],"c":"а","e":"Глагол восприятия «чувствую» в первой части предупреждает о дальнейшем изложении: «чувствую, ЧТО кто-то трогает». Ставится двоеточие."},{"id":"x-rus-t21-g53","k":"mc","les":"RU054","task":21,"q":"Смотрю (?) на небе загораются первые звёзды. Какой знак ставится?","o":[{"id":"а","t":"Двоеточие: вторая часть дополняет глагол «смотрю» (можно вставить «и вижу, что»)"},{"id":"б","t":"Тире: следствие"},{"id":"в","t":"Запятая"},{"id":"г","t":"Тире: противопоставление"}],"c":"а","e":"Глагол восприятия «смотрю» требует пояснения: «смотрю И ВИЖУ, ЧТО загораются звёзды». При таких глаголах ставится двоеточие."},{"id":"x-rus-t21-g54","k":"mc","les":"RU054","task":21,"q":"Я слышал (?) за стеной кто-то плачет. Какой знак ставится?","o":[{"id":"а","t":"Двоеточие: вторая часть дополняет глагол «слышал» (можно вставить «что»)"},{"id":"б","t":"Тире: быстрая смена"},{"id":"в","t":"Запятая"},{"id":"г","t":"Тире: следствие"}],"c":"а","e":"Глагол «слышал» в первой части предупреждает о содержании второй: «слышал, ЧТО кто-то плачет». Дополнение-изъяснение обозначается двоеточием."},{"id":"x-rus-t21-g55","k":"mc","les":"RU054","task":21,"q":"В каком бессоюзном предложении двоеточие ставится потому, что вторая часть дополняет сказуемое первой (можно вставить «что»)?","o":[{"id":"а","t":"Он понял: помощи ждать неоткуда"},{"id":"б","t":"Помощи не было — пришлось справляться самому"},{"id":"в","t":"Уехал друг: стало грустно"},{"id":"г","t":"Небо потемнело — начался ливень"}],"c":"а","e":"Дополнение-изъяснение — в «Он понял: помощи ждать неоткуда» (глагол «понял» + «что помощи ждать неоткуда»). «Уехал друг: стало грустно» — двоеточие, но причина; остальные — тире (следствие, быстрая смена)."},{"id":"x-rus-t21-g56","k":"mc","les":"RU057","task":21,"q":"Учитель сказал (?) «Откройте учебники». Какой знак ставится и почему?","o":[{"id":"а","t":"Двоеточие: слова автора стоят перед прямой речью"},{"id":"б","t":"Тире: прямая речь стоит перед словами автора"},{"id":"в","t":"Запятая"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"Слова автора «Учитель сказал» стоят ПЕРЕД прямой речью. После слов автора перед прямой речью ставится двоеточие, а сама реплика — в кавычках."},{"id":"x-rus-t21-g57","k":"mc","les":"RU057","task":21,"q":"Она прошептала (?) «Как здесь красиво!» Какой знак ставится?","o":[{"id":"а","t":"Двоеточие: слова автора предшествуют прямой речи"},{"id":"б","t":"Тире: прямая речь перед словами автора"},{"id":"в","t":"Запятая"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"«Она прошептала» — слова автора перед прямой речью. После них ставится двоеточие, прямая речь заключается в кавычки."},{"id":"x-rus-t21-g58","k":"mc","les":"RU054","task":21,"q":"Мальчик спросил (?) «Который час?» Какой знак ставится?","o":[{"id":"а","t":"Двоеточие: слова автора стоят перед прямой речью"},{"id":"б","t":"Тире: прямая речь перед словами автора"},{"id":"в","t":"Запятая"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"Слова автора «Мальчик спросил» предшествуют прямой речи, поэтому после них ставится двоеточие, а вопрос — в кавычках со своим знаком."},{"id":"x-rus-t21-g59","k":"mc","les":"RU054","task":21,"q":"Я подумал (?) «Неужели это правда?» Какой знак ставится?","o":[{"id":"а","t":"Двоеточие: слова автора предшествуют прямой речи"},{"id":"б","t":"Тире: прямая речь перед словами автора"},{"id":"в","t":"Запятая"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"«Я подумал» — слова автора перед прямой речью (внутренняя речь тоже оформляется как прямая). После них ставится двоеточие."},{"id":"x-rus-t21-g60","k":"mc","les":"RU054","task":21,"q":"«Я вернусь» (?) сказал он. Какой знак нужен на месте пропуска?","o":[{"id":"а","t":"Тире: прямая речь стоит перед словами автора"},{"id":"б","t":"Двоеточие: слова автора перед прямой речью"},{"id":"в","t":"Запятая вместо тире"},{"id":"г","t":"Знак не нужен"}],"c":"а","e":"Здесь прямая речь стоит ПЕРЕД словами автора («сказал он»). В этом случае после закрывающих кавычек ставится не двоеточие, а тире: «Я вернусь», — сказал он."},{"id":"s-000","k":"mc","les":"RU018","task":4,"q":"Выбери верное ударение:","o":[{"id":"а","t":"аЭропорты"},{"id":"б","t":"аэрОпорты"},{"id":"в","t":"аэропОрты"},{"id":"г","t":"аэропортЫ"}],"c":"в","e":"Правильно: аэропОрты."},{"id":"s-001","k":"mc","les":"RU018","task":4,"q":"Выбери верное ударение:","o":[{"id":"а","t":"бАнты"},{"id":"б","t":"бантЫ"}],"c":"а","e":"Правильно: бАнты."},{"id":"s-002","k":"mc","les":"RU018","task":4,"q":"Выбери верное ударение:","o":[{"id":"а","t":"бОроду"},{"id":"б","t":"борОду"},{"id":"в","t":"бородУ"}],"c":"а","e":"Правильно: бОроду."},{"id":"s-003","k":"mc","les":"RU018","task":4,"q":"Выбери верное ударение:","o":[{"id":"а","t":"бУхгалтеров"},{"id":"б","t":"бухгАлтеров"},{"id":"в","t":"бухгалтЕров"},{"id":"г","t":"бухгалтерОв"}],"c":"б","e":"Правильно: бухгАлтеров."},{"id":"s-004","k":"mc","les":"RU018","task":4,"q":"Выбери верное ударение:","o":[{"id":"а","t":"верОисповедание"},{"id":"б","t":"вероИсповедание"},{"id":"в","t":"вероиспОведание"},{"id":"г","t":"вероисповЕдание"}],"c":"г","e":"Правильно: вероисповЕдание."},{"id":"s-005","k":"mc","les":"RU018","task":4,"q":"Выбери верное ударе ":"Наличность — имеющиеся денежные средства в наличной форме (выдать наличность). Наличие — факт присутствия (наличие билетов)."},{"id":"p-30-0","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «грубый, невоспитанный человек»?","o":[{"id":"б","t":"невежда"},{"id":"а","t":"невежа"}],"c":"а","e":"Невежа — грубый, невоспитанный человек (вести себя как невежа). Невежда — малообразованный, несведущий человек (невежда в физике)."},{"id":"p-30-1","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «малообразованный, несведущий человек»?","o":[{"id":"а","t":"невежда"},{"id":"б","t":"невежа"}],"c":"а","e":"Невежда — малообразованный, несведущий человек (невежда в физике). Невежа — грубый, невоспитанный человек (вести себя как невежа)."},{"id":"p-31-0","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «вызывающий обиду»?","o":[{"id":"а","t":"обидный"},{"id":"б","t":"обидчивый"}],"c":"а","e":"Обидный — вызывающий обиду (обидная реплика). Обидчивый — склонный обижаться (обидчивый собеседник)."},{"id":"p-31-1","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «склонный обижаться»?","o":[{"id":"б","t":"обидный"},{"id":"а","t":"обидчивый"}],"c":"а","e":"Обидчивый — склонный обижаться (обидчивый собеседник). Обидный — вызывающий обиду (обидная реплика)."},{"id":"p-32-0","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «относящийся к органике, организму или внутреннему единству»?","o":[{"id":"б","t":"органичный"},{"id":"а","t":"органический"}],"c":"а","e":"Органический — относящийся к органике, организму или внутреннему единству (органическая химия). Органичный — естественно вписывающийся (органичный образ)."},{"id":"p-32-1","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «естественно вписывающийся»?","o":[{"id":"а","t":"органичный"},{"id":"б","t":"органический"}],"c":"а","e":"Органичный — естественно вписывающийся (органичный образ). Органический — относящийся к органике, организму или внутреннему единству (органическая химия)."},{"id":"p-33-0","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «сохраняющийся в памяти или служащий памятью»?","o":[{"id":"а","t":"памятный"},{"id":"б","t":"памятливый"}],"c":"а","e":"Памятный — сохраняющийся в памяти или служащий памятью (памятная дата). Памятливый — хорошо помнящий (памятливый ученик)."},{"id":"p-33-1","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «хорошо помнящий»?","o":[{"id":"а","t":"памятливый"},{"id":"б","t":"памятный"}],"c":"а","e":"Памятливый — хорошо помнящий (памятливый ученик). Памятный — сохраняющийся в памяти или служащий памятью (памятная дата)."},{"id":"p-34-0","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «состоящий из песка или покрытый им»?","o":[{"id":"а","t":"песчаный"},{"id":"б","t":"песочный"}],"c":"а","e":"Песчаный — состоящий из песка или покрытый им (песчаный пляж). Песочный — связанный с песком; также название теста (песочное печенье)."},{"id":"p-34-1","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «связанный с песком; также название теста»?","o":[{"id":"а","t":"песочный"},{"id":"б","t":"песчаный"}],"c":"а","e":"Песочный — связанный с песком; также название теста (песочное печенье). Песчаный — состоящий из песка или покрытый им (песчаный пляж)."},{"id":"p-35-0","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «связанный с практикой»?","o":[{"id":"б","t":"практичный"},{"id":"а","t":"практический"}],"c":"а","e":"Практический — связанный с практикой (практическое занятие). Практичный — удобный, целесообразный (практичный рюкзак)."},{"id":"p-35-1","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «удобный, целесообразный»?","o":[{"id":"б","t":"практический"},{"id":"а","t":"практичный"}],"c":"а","e":"Практичный — удобный, целесообразный (практичный рюкзак). Практический — связанный с практикой (практическое занятие)."},{"id":"p-36-0","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «дать право, возможность или в распоряжение»?","o":[{"id":"б","t":"представить"},{"id":"а","t":"предоставить"}],"c":"а","e":"Предоставить — дать право, возможность или в распоряжение (предоставить отпуск). Представить — предъявить, познакомить или вообразить (представить отчёт)."},{"id":"p-36-1","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «предъявить, познакомить или вообразить»?","o":[{"id":"б","t":"предоставить"},{"id":"а","t":"представить"}],"c":"а","e":"Представить — предъявить, познакомить или вообразить (представить отчёт). Предоставить — дать право, возможность или в распоряжение (предоставить отпуск)."},{"id":"p-37-0","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «относящийся к продуктам питания»?","o":[{"id":"а","t":"продуктовый"},{"id":"б","t":"продуктивный"}],"c":"а","e":"Продуктовый — относящийся к продуктам питания (продуктовый магазин). Продуктивный — результативный, производительный (продуктивный разговор)."},{"id":"p-37-1","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «результативный, производительный»?","o":[{"id":"б","t":"продуктовый"},{"id":"а","t":"продуктивный"}],"c":"а","e":"Продуктивный — результативный, производительный (продуктивный разговор). Продуктовый — относящийся к продуктам питания (продуктовый магазин)."},{"id":"p-38-0","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «образованный, культурный»?","o":[{"id":"б","t":"просветительский"},{"id":"а","t":"просвещённый"}],"c":"а","e":"Просвещённый — образованный, культурный (просвещённый человек). Просветительский — связанный с распространением знаний (просветительский проект)."},{"id":"p-38-1","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «связанный с распространением знаний»?","o":[{"id":"б","t":"просвещённый"},{"id":"а","t":"просветительский"}],"c":"а","e":"Просветительский — связанный с распространением знаний (просветительский проект). Просвещённый — образованный, культурный (просвещённый человек)."},{"id":"p-39-0","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «неявный, не обнаруживающийся открыто»?","o":[{"id":"б","t":"скрытный"},{"id":"а","t":"скрытый"}],"c":"а","e":"Скрытый — неявный, не обнаруживающийся открыто (скрытый смысл). Скрытный — не склонный делиться мыслями (скрытный человек)."},{"id":"p-39-1","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «не склонный делиться мыслями»?","o":[{"id":"б","t":"скрытый"},{"id":"а","t":"скрытный"}],"c":"а","e":"Скрытный — не склонный делиться мыслями (скрытный человек). Скрытый — неявный, не обнаруживающийся открыто (скрытый смысл)."},{"id":"p-40-0","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «находящийся рядом»?","o":[{"id":"б","t":"соседский"},{"id":"а","t":"соседний"}],"c":"а","e":"Соседний — находящийся рядом (соседний дом). Соседский — принадлежащий соседу (соседский кот)."},{"id":"p-40-1","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «принадлежащий соседу»?","o":[{"id":"б","t":"соседний"},{"id":"а","t":"соседский"}],"c":"а","e":"Соседский — принадлежащий соседу (соседский кот). Соседний — находящийся рядом (соседний дом)."},{"id":"p-41-0","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «тот, кому сопутствует удача»?","o":[{"id":"б","t":"удачный"},{"id":"а","t":"удачливый"}],"c":"а","e":"Удачливый — тот, кому сопутствует удача (удачливый путешественник). Удачный — успешный, хорошо получившийся (удачный пример)."},{"id":"p-41-1","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «успешный, хорошо получившийся»?","o":[{"id":"б","t":"удачливый"},{"id":"а","t":"удачный"}],"c":"а","e":"Удачный — успешный, хорошо получившийся (удачный пример). Удачливый — тот, кому сопутствует удача (удачливый путешественник)."},{"id":"p-42-0","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «весь или неповреждённый»?","o":[{"id":"а","t":"целый"},{"id":"б","t":"цельный"}],"c":"а","e":"Целый — весь или неповреждённый (целый день). Цельный — единый, неразделённый; внутренне последовательный (цельный характер)."},{"id":"p-42-1","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «единый, неразделённый; внутренне последовательный»?","o":[{"id":"б","t":"целый"},{"id":"а","t":"цельный"}],"c":"а","e":"Цельный — единый, неразделённый; внутренне последовательный (цельный характер). Целый — весь или неповреждённый (целый день)."},{"id":"p-43-0","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «относящийся к экономике»?","o":[{"id":"б","t":"экономичный"},{"id":"а","t":"экономический"}],"c":"а","e":"Экономический — относящийся к экономике (экономический кризис). Экономичный — требующий небольших затрат (экономичный двигатель)."},{"id":"p-43-1","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «требующий небольших затрат»?","o":[{"id":"а","t":"экономичный"},{"id":"б","t":"экономический"}],"c":"а","e":"Экономичный — требующий небольших затрат (экономичный двигатель). Экономический — относящийся к экономике (экономический кризис)."},{"id":"p-44-0","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «дающий требуемый результат»?","o":[{"id":"а","t":"эффективный"},{"id":"б","t":"эффектный"}],"c":"а","e":"Эффективный — дающий требуемый результат (эффективный метод). Эффектный — производящий яркое впечатление (эффектный выход)."},{"id":"p-44-1","k":"mc","les":"RU019","task":5,"q":"Какое слово значит «производящий яркое впечатление»?","o":[{"id":"б","t":"эффективный"},{"id":"а","t":"эффектный"}],"c":"а","e":"Эффектный — производящий яркое впечатление (эффектный выход). Эффективный — дающий требуемый результат (эффективный метод)."},{"id":"f-RU001","k":"flip","les":"RU001","task":2,"q":"Какой источник прежде всего нужен, чтобы различить значения слов «эффектный» и «эффективный»?","a":"Словарь паронимов или толковый словарь.","e":"Требуется установить значение и сочетаемость, а не написание."},{"id":"f-RU002","k":"flip","les":"RU002","task":4,"q":"Почему в слове «яма» звуков больше, чем букв?","a":"Буква я в начале слова обозначает два звука.","e":"Остальные буквы в этом примере обозначают по одному звуку."},{"id":"f-RU003","k":"flip","les":"RU003","task":7,"q":"«Лес», «леса», «лесной» — какие единицы являются формами одного слова?","a":"Лес и леса.","e":"«Лесной» — новое слово, имя прилагательное."},{"id":"f-RU004","k":"flip","les":"RU004","task":1,"q":"К какой части речи относится слово «дежурный» в предложении «Дежурный погасил свет»?","a":"К имени существительному, возникшему в результате перехода из прилагательного.","e":"Здесь слово самостоятельно называет человека."},{"id":"f-RU005","k":"flip","les":"RU005","task":7,"q":"Какое время у глагола «решу»?","a":"Будущее.","e":"«Решить» — совершенный вид; формы настоящего времени у него нет."},{"id":"f-RU006","k":"flip","les":"RU006","task":8,"q":"Исправьте: «Возвращаясь домой, начался дождь».","a":"Когда я возвращался домой, начался дождь.","e":"Придаточное устраняет ошибочное отнесение добавочного действия к дождю."},{"id":"f-RU007","k":"flip","les":"RU007","task":1,"q":"В сочетании «их решение» слово «их» — личное или притяжательное местоимение?","a":"Притяжательное.","e":"Оно указывает на принадлежность решения, отвечает на вопрос «чьё?»."},{"id":"f-RU008","k":"flip","les":"RU008","task":1,"q":"Чем является «что» в предложении «Я увидел, что лежало на столе»?","a":"Союзным словом, подлежащим придаточной части.","e":"К нему относится сказуемое «лежало»; оно обозначает увиденный предмет."},{"id":"f-RU009","k":"flip","les":"RU009","task":1,"q":"«Почему важно признавать свои ошибки?» — тема, проблема или позиция?","a":"Проблема.","e":"Это вопрос, который может быть рассмотрен в тексте."},{"id":"f-RU010","k":"flip","les":"RU010","task":1,"q":"Какое отношение выражено в «Хотя шёл дождь, дети вышли гулять»?","a":"Уступка.","e":"Действие происходит вопреки названному обстоятельству."},{"id":"f-RU011","k":"flip","les":"RU011","task":2,"q":"В выражении «тёплый приём» слово «тёплый» обозначает температуру?","a":"Нет, доброжелательное, сердечное отношение.","e":"Контекст реализует переносное значение."},{"id":"f-RU012","k":"flip","les":"RU012","task":3,"q":"К какому стилю обычно относится заявление о приёме на работу?","a":"К официально-деловому.","e":"Документ фиксирует официальное обращение и использует стандартную форму."},{"id":"f-RU013","k":"flip","les":"RU013","task":23,"q":"Можно ли из «Несколько учеников опоздали» вывести «Все ученики опоздали»?","a":"Нет.","e":"Изменяется количественный объём утверждения."},{"id":"f-RU014","k":"flip","les":"RU014","task":3,"q":"«У дома стоял старый клён. Его ветви закрывали окно» — преимущественно какой тип речи?","a":"Описание.","e":"Переданы одновременно существующие признаки места."},{"id":"f-RU015","k":"flip","les":"RU015","task":2,"q":"Что означает «работать спустя рукава»?","a":"Работать небрежно, без старания.","e":"Это целостное переносное значение устойчивого сочетания."},{"id":"f-RU016","k":"flip","les":"RU016","task":1,"q":"Какое средство связывает «Начался снегопад. Он продолжался весь день»?","a":"Личное местоимение «он».","e":"Оно заменяет слово «снегопад» из предыдущего предложения."},{"id":"f-RU017","k":"flip","les":"RU017","task":23,"q":"Как называется короткая характеристика содержания и назначения книги без подробного пересказа?","a":"Аннотация.","e":"Она помогает понять, чему посвящён материал и кому он адресован."},{"id":"f-RU018","k":"flip","les":"RU018","task":4,"q":"Поставьте ударение: «красивее».","a":"красИвее.","e":"Ударение сохраняется на и, как в «красИвый»."},{"id":"f-RU019","k":"flip","les":"RU019","task":5,"q":"«Лекарство оказалось очень эффектным» — какое слово нужно, если говорится о лечебном результате?","a":"эффективным.","e":"Указывается результативность действия, а не внешнее впечатление."},{"id":"f-RU020","k":"flip","les":"RU020","task":6,"q":"Как исправить одним словом «Это играет важное значение»?","a":"Заменить «играет» на «имеет».","e":"Восстанавливается нормативная лексическая сочетаемость."},{"id":"f-RU021","k":"flip","les":"RU021","task":7,"q":"Исправьте форму: «опытные инженера».","a":"опытные инженеры.","e":"Нормативный именительный множественного числа — «инженеры»."},{"id":"f-RU022","k":"flip","les":"RU022","task":7,"q":"Поставьте «пятьсот» в творительный падеж.","a":"пятьюстами.","e":"Изменяются обе части сложного числительного."},{"id":"f-RU023","k":"flip","les":"RU023","task":7,"q":"Исправьте «благодаря нему».","a":"благодаря ему.","e":"После этого производного предлога начальное н у местоимения не добавляется."},{"id":"f-RU024","k":"flip","les":"RU024","task":8,"q":"Исправьте «Перечень необходимых документов были опубликованы».","a":"Перечень необходимых документов был опубликован.","e":"Подлежащее — «перечень», единственное число, мужской род."},{"id":"f-RU025","k":"flip","les":"RU025","task":8,"q":"Правильно ли «Закончив работу, можно отдохнуть»?","a":"Да.","e":"Добавочное действие и действие инфинитива относятся к одному подразумеваемому человеку."},{"id":"f-RU026","k":"flip","les":"RU026","task":7,"q":"Исправьте «по окончанию урока» в значении «после урока».","a":"по окончании урока.","e":"Предлог по в этом значении требует предложного падежа."},{"id":"f-RU027","k":"flip","les":"RU027","task":8,"q":"Исправьте «Она спросила, что когда начнётся встреча».","a":"Она спросила, когда начнётся встреча.","e":"Вопросительное союзное слово «когда» уже присоединяет придаточное; «что» лишнее."},{"id":"f-RU028","k":"flip","les":"RU028","task":9,"q":"Как проверить е в слове «лесистый»?","a":"Словом «лес».","e":"Тот же корень и значение, гласная находится под ударением."},{"id":"f-RU029","k":"flip","les":"RU029","task":9,"q":"Почему в слове «прикосновение» пишется о?","a":"После корня нет суффикса -а-.","e":"Для кас/кос при отсутствии этого суффикса выбирают кос."},{"id":"f-RU030","k":"flip","les":"RU030","task":10,"q":"Какая приставка в слове «бесшумный» и почему она заканчивается на с?","a":"Бес-, потому что далее стоит глухой ш.","e":"Это вариант приставки без-/бес-."},{"id":"f-RU031","k":"flip","les":"RU031","task":10,"q":"Как пишется «сверх..нтересный»?","a":"сверхинтересный.","e":"После сверх- начальное и сохраняется."},{"id":"f-RU032","k":"flip","les":"RU032","task":11,"q":"Почему «ключик» пишется с и?","a":"В форме «ключика» гласная сохраняется.","e":"Для суффикса -ик- характерна невыпадающая и."},{"id":"f-RU033","k":"flip","les":"RU033","task":11,"q":"Какая буква в «усидч..вый»?","a":"и.","e":"Суффикс -чив- всегда пишется с и."},{"id":"f-RU034","k":"flip","les":"RU034","task":11,"q":"Объясните написание «советовать».","a":"В первом лице «советую», поэтому суффикс -ова-.","e":"В форме первого лица нет сохраняющегося -ываю/-иваю."},{"id":"f-RU035","k":"flip","les":"RU035","task":12,"q":"Вставьте букву: «Они слыш..т музыку».","a":"слышат.","e":"«Слышать» входит в исключения второго спряжения."},{"id":"f-RU036","k":"flip","les":"RU036","task":12,"q":"Как пишется «бор..щийся»?","a":"борющийся.","e":"Бороться — борются; используется -ющ-."},{"id":"f-RU037","k":"flip","les":"RU037","task":13,"q":"Раскройте скобки: «Ответ (не)получен».","a":"Ответ не получен.","e":"Краткое страдательное причастие пишется с не раздельно."},{"id":"f-RU038","k":"flip","les":"RU038","task":13,"q":"Вставьте: «Где бы ты н.. был, помни о доме».","a":"ни.","e":"Это уступительная конструкция со значением «в любом месте»."},{"id":"f-RU039","k":"flip","les":"RU039","task":14,"q":"Раскройте скобки: «Мы говорили (на)счёт ремонта».","a":"насчёт.","e":"Производный предлог со значением «о ремонте»."},{"id":"f-RU040","k":"flip","les":"RU040","task":14,"q":"Как пишется «пол(лимона)»?","a":"пол-лимона.","e":"После пол- стоит слово с начальной л."},{"id":"f-RU041","k":"flip","les":"RU041","task":15,"q":"Почему «туманный» пишется с нн?","a":"Н основы «туман» соединяется с суффиксом -н-.","e":"Удвоение возникает на границе морфем."},{"id":"f-RU042","k":"flip","les":"RU042","task":15,"q":"Вставьте н/нн: «Письма уже отправле..ы».","a":"отправлены.","e":"Краткое страдательное причастие — одна н."},{"id":"f-RU043","k":"flip","les":"RU043","task":9,"q":"Выберите написание: «Он ож..г руку».","a":"ожёг.","e":"Это глагол; существительное с
