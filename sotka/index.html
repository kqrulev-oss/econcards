ола. Д—6: «вьюга злится и стучит в ставни» — неживому предмету приписаны действия живого существа, поэтому это олицетворение.","id":"h-19"},{"k":"match","task":26,"les":null,"q":"Прочитай фрагмент рецензии. Установи соответствие: к каждому пропуску (А—Д) подбери термин из списка.\n\nПростор родного края передаёт (А) («даль, бесконечная даль открывалась с обрыва»). Отношение рассказчика к самоуверенному приятелю выражает (Б) («наш „знаток“ перепутал даже названия месяцев»). Решимость героини звучит в (В) («Пусть говорят. Пусть смеются. Пусть не верят.»). Зимнюю картину дополняют (Г) («колючий зимний ветер») и (Д) («лёд на реке сверкал, словно начищенное зеркало»).","left":[{"id":"А","t":"пропуск А (цитата: «даль, бесконечная даль открывалась с обрыва»)"},{"id":"Б","t":"пропуск Б (цитата: «наш „знаток“ перепутал даже названия месяцев»)"},{"id":"В","t":"пропуск В (цитата: «Пусть говорят. Пусть смеются. Пусть не верят.»)"},{"id":"Г","t":"пропуск Г (цитата: «колючий зимний ветер»)"},{"id":"Д","t":"пропуск Д (цитата: «лёд на реке сверкал, словно начищенное зеркало»)"}],"right":[{"id":"1","t":"антитеза"},{"id":"2","t":"гипербола"},{"id":"3","t":"ирония"},{"id":"4","t":"сравнение"},{"id":"5","t":"эпитет"},{"id":"6","t":"фразеологизм"},{"id":"7","t":"лексический повтор"},{"id":"8","t":"парцелляция"},{"id":"9","t":"анафора"}],"map":{"А":"7","Б":"3","В":"9","Г":"5","Д":"4"},"e":"А—7: «даль, бесконечная даль открывалась с обрыва» — намеренное повторение одного и того же слова, поэтому это лексический повтор. Б—3: «наш „знаток“ перепутал даже названия месяцев» — слово употреблено в противоположном смысле, скрытая насмешка, поэтому это ирония. В—9: «Пусть говорят. Пусть смеются. Пусть не верят.» — одинаковое начало нескольких соседних предложений, поэтому это анафора. Г—5: «колючий зимний ветер» — образное определение, поэтому это эпитет. Д—4: «лёд на реке сверкал, словно начищенное зеркало» — предметы сопоставлены с помощью союза (как, словно, будто, точно), поэтому это сравнение.","id":"h-20"},{"k":"match","task":26,"les":null,"q":"Прочитай фрагмент рецензии. Установи соответствие: к каждому пропуску (А—Д) подбери термин из списка.\n\nРаздумья о малой родине открывает (А) («Что может быть дороже родного дома?»). Опустевшая усадьба показана через (Б) («осиротевший сад грустит без хозяев»). Драматизм развязки усиливает (В) («Письмо пришло. Спустя годы. Слишком поздно.»). Двойственность героини раскрывает (Г) («слова её были тёплыми, а взгляд — ледяным»), а мир маленькой лавки воссоздают (Д) («в лавке пахло корицей, ванилью, свежим хлебом и мятой»).","left":[{"id":"А","t":"пропуск А (цитата: «Что может быть дороже родного дома?»)"},{"id":"Б","t":"пропуск Б (цитата: «осиротевший сад грустит без хозяев»)"},{"id":"В","t":"пропуск В (цитата: «Письмо пришло. Спустя годы. Слишком поздно.»)"},{"id":"Г","t":"пропуск Г (цитата: «слова её были тёплыми, а взгляд — ледяным»)"},{"id":"Д","t":"пропуск Д (цитата: «в лавке пахло корицей, ванилью, свежим хлебом и мятой»)"}],"right":[{"id":"1","t":"лексический повтор"},{"id":"2","t":"сравнение"},{"id":"3","t":"гипербола"},{"id":"4","t":"олицетворение"},{"id":"5","t":"анафора"},{"id":"6","t":"риторический вопрос"},{"id":"7","t":"антитеза"},{"id":"8","t":"парцелляция"},{"id":"9","t":"ряды однородных членов"}],"map":{"А":"6","Б":"4","В":"8","Г":"7","Д":"9"},"e":"А—6: «Что может быть дороже родного дома?» — вопрос, не требующий ответа и усиливающий выразительность, поэтому это риторический вопрос. Б—4: «осиротевший сад грустит без хозяев» — неживому предмету приписаны действия живого существа, поэтому это олицетворение. В—8: «Письмо пришло. Спустя годы. Слишком поздно.» — высказывание намеренно разбито на короткие отрезки, поэтому это парцелляция. Г—7: «слова её были тёплыми, а взгляд — ледяным» — резкое противопоставление понятий, поэтому это антитеза. Д—9: «в лавке пахло корицей, ванилью, свежим хлебом и мятой» — перечисление грамматически однородных слов, поэтому это ряды однородных членов.","id":"h-21"},{"k":"multi","task":16,"les":"RU046","q":"Расставь знаки препинания. Укажи предложения, в которых нужно поставить ОДНУ запятую.","o":[{"id":"а","t":"Солнце светило ярко и снег на крышах начал таять."},{"id":"б","t":"К вечеру похолодало и на лужах появился тонкий лёд."},{"id":"в","t":"Не только дети но и взрослые с удовольствием катались с горки."},{"id":"г","t":"В лесу росли и сосны и ели и берёзы."},{"id":"д","t":"Ветер стих однако мороз к ночи усилился."}],"cs":["а","в","д"],"e":"а — сложносочинённое предложение без общего второстепенного члена: «Солнце светило ярко, и снег начал таять» — одна запятая, входит. б — ССП с общим второстепенным членом «к вечеру», который относится к обеим частям, поэтому запятая перед «и» не ставится — ноль запятых, не входит. в — двойной союз «не только… но и»: одна запятая перед второй частью союза («не только дети, но и взрослые») — входит. г — повторяющийся союз «и… и… и» при однородных членах: «и сосны, и ели, и берёзы» — две запятые, не входит. д — ССП с противительным союзом «однако» (= но): «Ветер стих, однако мороз усилился» — одна запятая, входит.","id":"m-0"},{"k":"multi","task":16,"les":"RU046","q":"Расставь знаки препинания. Укажи предложения, в которых нужно поставить ОДНУ запятую.","o":[{"id":"а","t":"Туман рассеялся и мы отправились в путь."},{"id":"б","t":"Как в поле так и в лесу пахло свежескошенной травой."},{"id":"в","t":"Вечером в парке зажглись фонари и заиграла музыка."},{"id":"г","t":"Он говорил тихо но уверенно."},{"id":"д","t":"Листья кружились в воздухе и медленно опускались на землю и ложились на тропинки."}],"cs":["а","б","г"],"e":"а — ССП с разными подлежащими и без общего члена: «Туман рассеялся, и мы отправились в путь» — одна запятая, входит. б — двойной союз «как… так и»: запятая только перед «так и» («как в поле, так и в лесу») — одна запятая, входит. в — общий второстепенный член «вечером в парке» относится к обеим частям, запятая перед «и» не нужна — не входит. г — однородные обстоятельства с противительным союзом «но»: «тихо, но уверенно» — одна запятая, входит. д — три однородных сказуемых с повторяющимся союзом «и»: «кружились, и опускались, и ложились» — две запятые, не входит.","id":"m-1"},{"k":"multi","task":16,"les":"RU046","q":"Расставь знаки препинания. Укажи предложения, в которых нужно поставить ОДНУ запятую.","o":[{"id":"а","t":"Море глухо роптало и волны яростно бились о берег."},{"id":"б","t":"Ночью ветер злится да стучит в окно."},{"id":"в","t":"В саду цвели яблони и груши и вишни."},{"id":"г","t":"Дождь то усиливался то совсем затихал."},{"id":"д","t":"Роман увлекает читателя острым сюжетом и яркими характерами героев."}],"cs":["а","г"],"e":"а — ССП: «Море глухо роптало, и волны яростно бились о берег» — одна запятая, входит. б — однородные сказуемые «злится да стучит», соединённые одиночным союзом «да» в значении «и», — запятая не нужна, не входит. в — однородные подлежащие с повторяющимся союзом «и»: «яблони, и груши, и вишни» — две запятые, не входит. г — повторяющийся союз «то… то»: «то усиливался, то затихал» — одна запятая, входит. д — однородные дополнения «сюжетом и характерами» с одиночным «и» — запятых нет, не входит.","id":"m-2"},{"k":"multi","task":16,"les":"RU046","q":"Расставь знаки препинания. Укажи предложения, в которых нужно поставить ОДНУ запятую.","o":[{"id":"а","t":"Гроза прошла и лес дышит свежестью."},{"id":"б","t":"Мал золотник да дорог."},{"id":"в","t":"На выставке были представлены картины и скульптуры и изделия народных промыслов."},{"id":"г","t":"Ни ветра ни солнца не было в этот пасмурный день."},{"id":"д","t":"Утром ярко светило солнце и блестел иней на ветках."}],"cs":["а","б","г"],"e":"а — ССП без общего члена: «Гроза прошла, и лес дышит свежестью» — одна запятая, входит. б — однородные сказуемые с союзом «да» в значении «но»: «Мал золотник, да дорог» — одна запятая, входит. в — повторяющийся союз «и»: «картины, и скульптуры, и изделия» — две запятые, не входит. г — повторяющийся союз «ни… ни» при двух однородных членах: «Ни ветра, ни солнца» — одна запятая, входит. д — ССП с общим второстепенным членом «утром», запятая перед «и» не ставится — не входит.","id":"m-3"},{"k":"multi","task":16,"les":"RU046","q":"Расставь знаки препинания. Укажи предложения, в которых нужно поставить ОДНУ запятую.","o":[{"id":"а","t":"Осенью дни становятся короче и заметно холодает."},{"id":"б","t":"Актёр играл вдохновенно и зрители наградили его аплодисментами."},{"id":"в","t":"Книга оказалась не только интересной но и полезной."},{"id":"г","t":"В походе нам пригодились и компас и карта и фонарик."},{"id":"д","t":"Тропинка вилась между деревьями и выводила путников к озеру."}],"cs":["б","в"],"e":"а — общий второстепенный член «осенью» относится к обеим частям сложного предложения, запятая перед «и» не нужна — не входит. б — ССП без общего члена: «Актёр играл вдохновенно, и зрители наградили его аплодисментами» — одна запятая, входит. в — двойной союз «не только… но и»: «не только интересной, но и полезной» — одна запятая, входит. г — повторяющийся союз «и»: «и компас, и карта, и фонарик» — две запятые, не входит. д — однородные сказуемые «вилась и выводила» с одиночным «и» — запятых нет, не входит.","id":"m-4"},{"k":"multi","task":16,"les":"RU046","q":"Расставь знаки препинания. Укажи предложения, в которых нужно поставить ОДНУ запятую.","o":[{"id":"а","t":"Лекция закончилась и слушатели стали расходиться."},{"id":"б","t":"Снег ложился и на поля и на леса и на застывшую реку."},{"id":"в","t":"В музее хранятся как древние рукописи так и старинные монеты."},{"id":"г","t":"На рассвете запели птицы и подул лёгкий ветерок."},{"id":"д","t":"Поезд замедлил ход и остановился у небольшой станции."}],"cs":["а","в"],"e":"а — ССП: «Лекция закончилась, и слушатели стали расходиться» — одна запятая, входит. б — повторяющийся союз «и»: «и на поля, и на леса, и на реку» — две запятые, не входит. в — двойной союз «как… так и»: «как рукописи, так и монеты» — одна запятая, входит. г — ССП с общим второстепенным членом «на рассвете», запятая не ставится — не входит. д — однородные сказуемые «замедлил и остановился» с одиночным «и» — запятых нет, не входит.","id":"m-5"},{"k":"multi","task":16,"les":"RU046","q":"Расставь знаки препинания. Укажи предложения, в которых нужно поставить ОДНУ запятую.","o":[{"id":"а","t":"Ручей журчал по камням и его негромкий говор успокаивал путников."},{"id":"б","t":"Хозяйка встретила гостей приветливо и радушно."},{"id":"в","t":"Либо утренняя зарядка либо вечерняя пробежка помогает сохранить бодрость."},{"id":"г","t":"Весной в лесу пахнет прелой листвой и звенят ручьи."},{"id":"д","t":"Художник писал и портреты и пейзажи и натюрморты."}],"cs":["а","в"],"e":"а — ССП с разными грамматическими основами: «Ручей журчал по камням, и его говор успокаивал путников» — одна запятая, входит. б — однородные обстоятельства с одиночным «и»: «приветливо и радушно» — запятых нет, не входит. в — повторяющийся союз «либо… либо» при двух однородных членах: «Либо зарядка, либо пробежка» — одна запятая, входит. г — общий второстепенный член «весной в лесу» относится к обеим частям, запятая перед «и» не нужна — не входит. д — повторяющийся союз «и»: «и портреты, и пейзажи, и натюрморты» — две запятые, не входит.","id":"m-6"},{"k":"multi","task":16,"les":"RU046","q":"Расставь знаки препинания. Укажи предложения, в которых нужно поставить ОДНУ запятую.","o":[{"id":"а","t":"Стемнело и в домах засветились окна."},{"id":"б","t":"Наука требует от человека и упорства и терпения."},{"id":"в","t":"По ночам подмораживало и лужи покрывались ледяной коркой."},{"id":"г","t":"Путешественники устали но упорно продолжали идти вперёд."},{"id":"д","t":"Утром мы позавтракали и собрали вещи и вышли из дома."}],"cs":["а","б","г"],"e":"а — ССП: «Стемнело, и в домах засветились окна» — одна запятая, входит. б — повторяющийся союз «и… и» при двух однородных членах: «и упорства, и терпения» — одна запятая, входит. в — ССП с общим второстепенным членом «по ночам», запятая перед «и» не ставится — не входит. г — однородные сказуемые с противительным союзом «но»: «устали, но продолжали идти» — одна запятая, входит. д — три однородных сказуемых с повторяющимся «и»: «позавтракали, и собрали, и вышли» — две запятые, не входит.","id":"m-7"},{"k":"multi","task":17,"les":"RU048","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nСозданная студентами (1) выставка (2) посвящённая истории города (3) открылась в зале (4) украшенном старинными фотографиями.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["б","в","г"],"e":"1 — причастный оборот «созданная студентами» стоит ДО определяемого слова «выставка» и не обособляется — запятая не нужна. 2 и 3 — причастный оборот «посвящённая истории города» стоит ПОСЛЕ определяемого слова «выставка» и выделяется запятыми с обеих сторон. 4 — причастный оборот «украшенном старинными фотографиями» стоит после определяемого слова «в зале» и обособляется — запятая нужна.","id":"m-8"},{"k":"multi","task":17,"les":"RU048","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nОн работал (1) не покладая рук (2) и (3) закончив проект раньше срока (4) уехал отдыхать в деревню.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["в","г"],"e":"1 и 2 — «не покладая рук» — фразеологизм (устойчивое выражение со значением «усердно»), деепричастные обороты-фразеологизмы не обособляются, запятые не нужны; перед «и», соединяющим однородные сказуемые «работал и уехал», запятая также не ставится. 3 и 4 — деепричастный оборот «закончив проект раньше срока» обособляется с обеих сторон: он стоит после союза «и», поэтому запятые ставятся на местах 3 и 4.","id":"m-9"},{"k":"multi","task":17,"les":"RU048","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nУлыбнувшись (1) девочка протянула руку к котёнку (2) свернувшемуся клубком (3) и осторожно погладила (4) блестящую на солнце (5) шёрстку.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"},{"id":"д","t":"5"}],"cs":["а","б","в"],"e":"1 — одиночное деепричастие «улыбнувшись» обособляется — запятая нужна. 2 и 3 — причастный оборот «свернувшемуся клубком» стоит после определяемого слова «котёнку» и выделяется запятыми с обеих сторон; запятая на месте 3 закрывает оборот перед союзом «и», соединяющим однородные сказуемые. 4 и 5 — причастный оборот «блестящую на солнце» стоит ДО определяемого слова «шёрстку» и не обособляется — запятые не нужны.","id":"m-10"},{"k":"multi","task":17,"les":"RU048","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nРазмытая дождями (1) дорога (2) петляла по склону (3) и путники (4) устав до изнеможения (5) решили сделать привал.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"},{"id":"д","t":"5"}],"cs":["в","г","д"],"e":"1 — причастный оборот «размытая дождями» стоит ДО определяемого слова «дорога» и не обособляется — запятая не нужна. 2 — между подлежащим «дорога» и сказуемым «петляла» запятая не ставится. 3 — сложносочинённое предложение: «дорога петляла, и путники решили» — перед «и» нужна запятая, общего члена у частей нет. 4 и 5 — деепричастный оборот «устав до изнеможения» обособляется с обеих сторон.","id":"m-11"},{"k":"multi","task":17,"les":"RU048","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nВолны (1) с шумом накатывая на берег (2) оставляли на песке (3) сверкающую пену (4) и медленно отступали.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["а","б"],"e":"1 и 2 — деепричастный оборот «с шумом накатывая на берег» обособляется с обеих сторон независимо от места в предложении. 3 — «сверкающую» — одиночное причастие перед определяемым словом «пену», не обособляется, запятая не нужна. 4 — союз «и» соединяет однородные сказуемые «оставляли и отступали», запятая перед одиночным «и» не ставится.","id":"m-12"},{"k":"multi","task":17,"les":"RU048","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nПутешественник (1) изучивший эти края (2) шёл быстро (3) не оглядываясь (4) и вскоре скрылся в (5) зеленеющей у реки (6) роще.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"},{"id":"д","t":"5"},{"id":"е","t":"6"}],"cs":["а","б","в","г"],"e":"1 и 2 — причастный оборот «изучивший эти края» стоит после определяемого слова «путешественник» и выделяется запятыми. 3 и 4 — одиночное деепричастие «не оглядываясь» обособляется с обеих сторон; запятая на месте 4 закрывает его перед союзом «и», соединяющим однородные сказуемые «шёл и скрылся». 5 и 6 — причастный оборот «зеленеющей у реки» стоит ДО определяемого слова «роще» и не обособляется — запятые не нужны.","id":"m-13"},{"k":"multi","task":17,"les":"RU048","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nСидеть (1) сложа руки (2) он не привык (3) и (4) выйдя на пенсию (5) продолжал трудиться в саду.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"},{"id":"д","t":"5"}],"cs":["г","д"],"e":"1 и 2 — «сложа руки» — фразеологизм (значение «бездельничая»), не обособляется, запятые не нужны. 3 — союз «и» соединяет однородные сказуемые «не привык и продолжал», запятая перед одиночным «и» не ставится. 4 и 5 — деепричастный оборот «выйдя на пенсию» стоит после союза «и» и обособляется с обеих сторон — запятые нужны.","id":"m-14"},{"k":"multi","task":17,"les":"RU048","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nПроснувшись на рассвете (1) рыбаки собрали снасти (2) и (3) стараясь не шуметь (4) направились к лодкам (5) привязанным у мостков.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"},{"id":"д","t":"5"}],"cs":["а","в","г","д"],"e":"1 — деепричастный оборот «проснувшись на рассвете» в начале предложения обособляется — запятая нужна. 2 — союз «и» соединяет однородные сказуемые «собрали и направились», запятая перед ним не ставится. 3 и 4 — деепричастный оборот «стараясь не шуметь» после союза «и» выделяется запятыми с обеих сторон. 5 — причастный оборот «привязанным у мостков» стоит после определяемого слова «к лодкам» и обособляется — запятая нужна.","id":"m-15"},{"k":"multi","task":18,"les":"RU051","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nМосква (1) конечно (2) сильно изменилась за последние годы. Однако (3) старинные переулки (4) кажется (5) сохранили своё очарование.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"},{"id":"д","t":"5"}],"cs":["а","б","г","д"],"e":"1 и 2 — вводное слово «конечно» выделяется запятыми с обеих сторон («Москва» здесь подлежащее, а не обращение). 3 — «однако» в начале предложения выступает в роли союза «но» и вводным не является — запятая не нужна. 4 и 5 — «кажется» — вводное слово (его можно убрать без потери смысла), выделяется запятыми с обеих сторон.","id":"m-16"},{"k":"multi","task":18,"les":"RU051","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nТы (1) я вижу (2) совсем не изменился. Даже (3) походка (4) осталась прежней (5) друг мой.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"},{"id":"д","t":"5"}],"cs":["а","б","д"],"e":"1 и 2 — вводная конструкция «я вижу» выделяется запятыми с обеих сторон. 3 — частица «даже» никогда не бывает вводным словом и не обособляется. 4 — между подлежащим «походка» и сказуемым «осталась» запятая не ставится. 5 — обращение «друг мой» в конце предложения отделяется запятой.","id":"m-17"},{"k":"multi","task":18,"les":"RU051","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nНебо (1) казалось (2) бездонным и прозрачным. Вдали (3) казалось (4) кто-то зажёг костёр.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["в","г"],"e":"1 и 2 — в первом предложении «казалось» — сказуемое («небо казалось бездонным»), его нельзя убрать без разрушения смысла, поэтому запятые не ставятся. 3 и 4 — во втором предложении «казалось» — вводное слово со значением неуверенности (его можно опустить: «Вдали кто-то зажёг костёр»), выделяется запятыми с обеих сторон.","id":"m-18"},{"k":"multi","task":18,"les":"RU051","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nРасскажи мне (1) бабушка (2) о своём детстве. Ведь (3) ты (4) наверное (5) многое помнишь.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"},{"id":"д","t":"5"}],"cs":["а","б","г","д"],"e":"1 и 2 — обращение «бабушка» в середине предложения выделяется запятыми с обеих сторон. 3 — частица «ведь» никогда не бывает вводным словом, запятая после неё не нужна. 4 и 5 — вводное слово «наверное» (выражает неуверенность) выделяется запятыми с обеих сторон.","id":"m-19"},{"k":"multi","task":18,"les":"RU051","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nДождь (1) вряд ли (2) прекратится к вечеру. К счастью (3) зонт (4) по словам сестры (5) лежал в рюкзаке.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"},{"id":"д","t":"5"}],"cs":["в","г","д"],"e":"1 и 2 — «вряд ли» — частица, она никогда не бывает вводным словом и не выделяется запятыми. 3 — вводное слово «к счастью» (выражает отношение к сообщаемому) отделяется запятой. 4 и 5 — вводная конструкция «по словам сестры» (указывает на источник сообщения) выделяется запятыми с обеих сторон.","id":"m-20"},{"k":"multi","task":18,"les":"RU051","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nГроза (1) очевидно (2) пройдёт стороной. Решение этой задачи (3) очевидно (4) для каждого школьника.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["а","б"],"e":"1 и 2 — в первом предложении «очевидно» — вводное слово со значением предположения (его можно убрать: «Гроза пройдёт стороной»), выделяется запятыми с обеих сторон. 3 и 4 — во втором предложении «очевидно» — сказуемое («решение очевидно для каждого»), член предложения, который нельзя опустить, поэтому запятые не ставятся.","id":"m-21"},{"k":"multi","task":18,"les":"RU051","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nПрощай (1) любимый город (2) мы уезжаем завтра. Может быть (3) когда-нибудь (4) мы вернёмся сюда снова.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["а","б","в"],"e":"1 и 2 — обращение «любимый город» выделяется запятыми с обеих сторон: запятая после «прощай» открывает обращение, запятая на месте 2 закрывает его перед второй частью предложения. 3 — вводная конструкция «может быть» (выражает предположение) отделяется запятой. 4 — «когда-нибудь» — обычное наречие времени, член предложения, запятой не выделяется.","id":"m-22"},{"k":"multi","task":18,"les":"RU051","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nЭксперимент (1) по мнению учёных (2) полностью подтвердил гипотезу. Результаты (3) будто (4) специально совпали с расчётами.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["а","б"],"e":"1 и 2 — вводная конструкция «по мнению учёных» (указывает на источник сообщения) выделяется запятыми с обеих сторон. 3 и 4 — «будто» — частица со значением сравнения или сомнения, она никогда не бывает вводным словом и запятыми не выделяется.","id":"m-23"},{"k":"multi","task":19,"les":"RU052","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nДом (1) в котором прошло моё детство (2) стоял на окраине села (3) потому что дед любил тишину (4) и простор.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["а","б","в"],"e":"1 и 2 — придаточное определительное «в котором прошло моё детство» стоит внутри главного предложения и выделяется запятыми с обеих сторон. 3 — перед составным союзом «потому что» ставится запятая, отделяющая придаточное причины. 4 — «тишину и простор» — однородные дополнения, соединённые одиночным союзом «и», запятая не нужна.","id":"m-24"},{"k":"multi","task":19,"les":"RU052","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nСтаринная усадьба (1) парк (2) которой спускался к реке (3) была построена в конце восемнадцатого века (4) и прекрасно сохранилась.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["а","в"],"e":"1 — запятая открывает придаточное определительное «парк которой спускался к реке». 2 — союзное слово «которой» стоит не в начале придаточного, а после слова «парк»; внутри придаточного перед «которой» запятая НЕ ставится. 3 — запятая закрывает придаточное перед продолжением главного предложения. 4 — «была построена и сохранилась» — однородные сказуемые с одиночным «и», запятая не нужна.","id":"m-25"},{"k":"multi","task":19,"les":"RU052","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nДля того (1) чтобы увидеть северное сияние (2) туристы приезжают в Заполярье (3) где зимой (4) стоит полярная ночь.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["б","в"],"e":"1 — составной союз «для того чтобы» стоит в начале предложения и не расчленяется: запятая внутри него не ставится. 2 — запятая закрывает придаточное цели перед главным предложением. 3 — запятая перед союзным словом «где» отделяет придаточное определительное. 4 — «зимой» — обстоятельство внутри придаточного, между ним и сказуемым «стоит» запятая не нужна.","id":"m-26"},{"k":"multi","task":19,"les":"RU052","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nУчёные выяснили (1) что перелётные птицы (2) маршруты (3) которых пролегают через горы (4) ориентируются по магнитному полю Земли.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["а","б","г"],"e":"1 — запятая перед союзом «что» отделяет придаточное изъяснительное. 2 — запятая открывает придаточное определительное «маршруты которых пролегают через горы». 3 — союзное слово «которых» стоит после слова «маршруты», внутри придаточного перед ним запятая НЕ ставится. 4 — запятая закрывает придаточное определительное перед сказуемым «ориентируются».","id":"m-27"},{"k":"multi","task":19,"les":"RU052","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nМы вышли к озеру (1) на берегу (2) которого стояла избушка (3) и решили остановиться там (4) чтобы переночевать.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["а","в","г"],"e":"1 — запятая открывает придаточное определительное «на берегу которого стояла избушка». 2 — союзное слово «которого» стоит не в начале придаточного, перед ним запятая не ставится. 3 — запятая закрывает придаточное перед союзом «и», соединяющим однородные сказуемые «вышли и решили». 4 — запятая перед союзом «чтобы» отделяет придаточное цели.","id":"m-28"},{"k":"multi","task":19,"les":"RU052","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nТуман рассеивался (1) по мере того (2) как поднималось солнце (3) чьи лучи (4) постепенно освещали долину.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["а","в"],"e":"1 — составной союз «по мере того как» стоит в середине предложения, запятая ставится перед всем союзом целиком. 2 — внутри нерасчленённого союза «по мере того как» запятая не ставится. 3 — запятая перед союзным словом «чьи» отделяет придаточное определительное. 4 — «чьи лучи» — начало придаточного, между подлежащим «лучи» и сказуемым «освещали» запятая не нужна.","id":"m-29"},{"k":"multi","task":19,"les":"RU052","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nЕсли (1) хочешь понять эпоху (2) читай письма людей (3) которые (4) жили в то время.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["б","в"],"e":"1 — после союза «если» в начале придаточного запятая не ставится. 2 — запятая закрывает придаточное условия перед главным предложением. 3 — запятая перед союзным словом «которые» отделяет придаточное определительное. 4 — «которые» здесь подлежащее придаточного, между ним и сказуемым «жили» запятая не нужна.","id":"m-30"},{"k":"multi","task":19,"les":"RU052","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nЭкскурсовод рассказал (1) о том (2) что в фондах музея хранятся рукописи (3) расшифровать (4) которые пока не удалось.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["б","в"],"e":"1 — «рассказал о том» — указательное слово «о том» входит в главное предложение, запятая перед ним не ставится. 2 — запятая перед союзом «что» отделяет придаточное изъяснительное. 3 — запятая открывает придаточное определительное «расшифровать которые пока не удалось». 4 — союзное слово «которые» стоит не в начале придаточного (после слова «расшифровать»), перед ним запятая не ставится.","id":"m-31"},{"k":"multi","task":20,"les":"RU053","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nОн знал (1) что (2) если опоздает на поезд (3) то придётся ждать до утра (4) и поэтому вышел из дома заранее.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["а","в","г"],"e":"1 — запятая перед «что» отделяет придаточное изъяснительное. 2 — на стыке союзов «что если» запятая НЕ ставится, потому что дальше есть вторая часть союза «то». 3 — запятая перед «то» закрывает придаточное условия. 4 — запятая закрывает всю придаточную часть перед «и поэтому вышел» (однородное сказуемое главного предложения: «знал и вышел»).","id":"m-32"},{"k":"multi","task":20,"les":"RU053","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nНаступила ночь (1) и (2) когда взошла луна (3) то степь озарилась серебристым светом (4) который придавал ей таинственный вид.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["а","в","г"],"e":"1 — запятая между частями сложносочинённого предложения перед «и». 2 — на стыке союзов «и когда» запятая не ставится, так как дальше следует «то». 3 — запятая перед «то» закрывает придаточное времени «когда взошла луна». 4 — запятая перед союзным словом «который» отделяет придаточное определительное.","id":"m-33"},{"k":"multi","task":20,"les":"RU053","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nУтром выяснилось (1) что (2) хотя дождь прекратился (3) дорогу совсем размыло (4) и придётся идти пешком.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["а","б","в"],"e":"1 — запятая перед «что» отделяет придаточное изъяснительное. 2 — на стыке союзов «что хотя» запятая СТАВИТСЯ, потому что дальше нет второй части союза («то», «но»): придаточное уступки можно изъять без перестройки предложения. 3 — запятая закрывает придаточное уступки «хотя дождь прекратился». 4 — «дорогу размыло и придётся идти» — однородные придаточные, соединённые одиночным «и», запятая перед ним не ставится.","id":"m-34"},{"k":"multi","task":20,"les":"RU053","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nЛес стоял тихий (1) и (2) если бы не редкий стук дятла (3) то можно было бы подумать (4) что всё вокруг уснуло.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["а","в","г"],"e":"1 — запятая между частями сложносочинённого предложения перед «и». 2 — на стыке союзов «и если» запятая не ставится: дальше есть вторая часть союза «то». 3 — запятая перед «то» закрывает придаточное условия. 4 — запятая перед «что» отделяет придаточное изъяснительное при «подумать».","id":"m-35"},{"k":"multi","task":20,"les":"RU053","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nМы понимали (1) что (2) когда начнётся гроза (3) укрыться будет негде (4) поэтому заторопились к сторожке.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["а","б","в","г"],"e":"1 — запятая перед «что» отделяет придаточное изъяснительное. 2 — на стыке союзов «что когда» запятая СТАВИТСЯ, потому что дальше нет «то»: придаточное времени можно изъять без перестройки. 3 — запятая закрывает придаточное времени «когда начнётся гроза». 4 — запятая закрывает придаточную часть перед «поэтому заторопились» — продолжением главного предложения (однородное сказуемое «понимали и заторопились»).","id":"m-36"},{"k":"multi","task":20,"les":"RU053","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nСобака насторожилась (1) и (2) хотя вокруг было тихо (3) но хозяин понял (4) что кто-то приближается к дому.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["а","в","г"],"e":"1 — запятая между частями сложносочинённого предложения перед «и». 2 — на стыке союзов «и хотя» запятая не ставится, потому что дальше есть соотносительное «но». 3 — запятая закрывает придаточное уступки «хотя вокруг было тихо» перед «но». 4 — запятая перед «что» отделяет придаточное изъяснительное.","id":"m-37"},{"k":"multi","task":20,"les":"RU053","q":"Расставь знаки препинания: укажи цифры, на месте которых должны стоять запятые.\n\nКогда поезд тронулся (1) и за окном поплыли огни станции (2) пассажиры затихли (3) потому что каждый думал (4) о своём.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"cs":["б","в"],"e":"1 — «когда поезд тронулся и за окном поплыли огни» — два однородных придаточных времени с общим союзом «когда», соединённые одиночным «и»: запятая между ними не ставится. 2 — запятая закрывает придаточные перед главным предложением. 3 — запятая перед составным союзом «потому что» отделяет придаточное причины. 4 — «о своём» — дополнение при сказуемом «думал», запятая не нужна.","id":"m-38"},{"k":"multi","task":21,"les":"RU054","q":"Найди предложения, в которых ТИРЕ ставится в соответствии с ОДНИМ и тем же правилом.","o":[{"id":"а","t":"Байкал — самое глубокое озеро планеты."},{"id":"б","t":"Лес — верный друг человека."},{"id":"в","t":"Настанет утро — двинемся в путь."},{"id":"г","t":"В музее хранятся старинные рукописи, в архиве — редкие фотографии."},{"id":"д","t":"Поля, овраги, перелески — всё было засыпано снегом."}],"cs":["а","б"],"e":"а — тире между подлежащим «Байкал» и сказуемым «озеро», выраженными существительными в именительном падеже, — входит. б — то же правило: подлежащее «лес» и сказуемое «друг» — существительные в именительном падеже, — входит. в — тире в бессоюзном сложном предложении (первая часть указывает на время/условие) — другое правило, не входит. г — тире в неполном предложении на месте пропущенного сказуемого «хранятся» — другое правило, не входит. д — тире после однородных членов перед обобщающим словом «всё» — другое правило, не входит.","id":"m-40"},{"k":"multi","task":21,"les":"RU054","q":"Найди предложения, в которых ЗАПЯТАЯ ставится в соответствии с ОДНИМ и тем же правилом.","o":[{"id":"а","t":"Ветер стих, и море постепенно успокоилось."},{"id":"б","t":"Листва, тронутая первым морозом, тихо осыпалась."},{"id":"в","t":"Солнце село, и на землю опустились сумерки."},{"id":"г","t":"Когда взошла луна, мы продолжили путь."},{"id":"д","t":"Снег укрыл поля, дороги, крыши домов."}],"cs":["а","в"],"e":"а — запятая между частями сложносочинённого предложения перед союзом «и» — входит. б — запятые выделяют причастный оборот «тронутая первым морозом» после определяемого слова — другое правило, не входит. в — запятая между частями сложносочинённого предложения перед «и» — то же правило, что в «а», входит. г — запятая отделяет придаточное времени в сложноподчинённом предложении — другое правило, не входит. д — запятые между однородными членами без союзов — другое правило, не входит.","id":"m-42"},{"k":"multi","task":21,"les":"RU054","q":"Найди предложения, в которых ДВОЕТОЧИЕ ставится в соответствии с ОДНИМ и тем же правилом.","o":[{"id":"а","t":"Всё напоминало об осени: жёлтые листья, паутина, прохладные утренники."},{"id":"б","t":"В рюкзак положили всё необходимое: фонарь, спички, запас еды."},{"id":"в","t":"Я оглянулся: на дороге никого не было."},{"id":"г","t":"Учитель повторял: «Не спешите с выводами»."},{"id":"д","t":"Хор исполнял всё: народные песни, романсы, современные произведения."}],"cs":["а","б","д"],"e":"а — двоеточие после обобщающего слова «всё» перед рядом однородных членов — входит. б — двоеточие после обобщающего слова «всё необходимое» перед однородными членами — то же правило, входит. в — двоеточие в бессоюзном сложном предложении (вторая часть дополняет первую: оглянулся И УВИДЕЛ, ЧТО) — другое правило, не входит. г — двоеточие после слов автора перед прямой речью — другое правило, не входит. д — двоеточие после обобщающего слова «всё» перед однородными членами — то же правило, что в «а» и «б», входит.","id":"m-44"},{"k":"multi","task":21,"les":"RU054","q":"Найди предложения, в которых ЗАПЯТАЯ ставится в соответствии с ОДНИМ и тем же правилом.","o":[{"id":"а","t":"Кажется, дождь скоро закончится."},{"id":"б","t":"Ребята, не шумите в читальном зале."},{"id":"в","t":"К счастью, никто не пострадал во время бури."},{"id":"г","t":"Конечно, наука не стоит на месте."},{"id":"д","t":"Тропинка, петлявшая среди сосен, вывела нас к озеру."}],"cs":["а","в","г"],"e":"а — запятая выделяет вводное слово «кажется» (значение неуверенности) — входит. б — запятая отделяет обращение «ребята» — другое правило, не входит. в — запятая выделяет вводное слово «к счастью» (отношение говорящего к сообщаемому) — то же правило, входит. г — запятая выделяет вводное слово «конечно» (уверенность) — то же правило, входит. д — запятые выделяют причастный оборот «петлявшая среди сосен» после определяемого слова — другое правило, не входит.","id":"m-45"},{"k":"multi","task":21,"les":"RU054","q":"Найди предложения, в которых ТИРЕ ставится в соответствии с ОДНИМ и тем же правилом.","o":[{"id":"а","t":"Дважды два — четыре."},{"id":"б","t":"Хочешь быть здоровым — закаляйся."},{"id":"в","t":"Архитектура — застывшая музыка."},{"id":"г","t":"Смелость — начало победы."},{"id":"д","t":"За рекой — заливные луга."}],"cs":["а","в","г"],"e":"а — тире между подлежащим и сказуемым («дважды два» и «четыре» — числительные) — входит. б — тире в бессоюзном сложном предложении (первая часть — условие: «если хочешь быть здоровым») — другое правило, не входит. в — тире между подлежащим «архитектура» и сказуемым «музыка», существительными в именительном падеже, — то же правило, входит. г — тире между подлежащим «смелость» и сказуемым «начало» — то же правило, входит. д — тире в неполном (эллиптическом) предложении на месте пропущенного сказуемого — другое правило, не входит.","id":"m-46"},{"k":"multi","task":21,"les":"RU054","q":"Найди предложения, в которых ДВОЕТОЧИЕ ставится в соответствии с ОДНИМ и тем же правилом.","o":[{"id":"а","t":"Диктор сообщил: «Завтра ожидается похолодание»."},{"id":"б","t":"Экскурсовод предупредил: «Фотографировать в залах запрещено»."},{"id":"в","t":"В саду росли старые деревья: липы, клёны, вязы."},{"id":"г","t":"Настя поняла: разговор предстоит трудный."},{"id":"д","t":"Врач напомнил: «Прогулки полезны в любую погоду»."}],"cs":["а","б","д"],"e":"а — двоеточие после слов автора перед прямой речью — входит. б — двоеточие после слов автора перед прямой речью — то же правило, входит. в — двоеточие после обобщающего слова «старые деревья» перед рядом однородных членов — другое правило, не входит. г — двоеточие в бессоюзном сложном предложении (вторая часть раскрывает содержание первой: поняла ЧТО ИМЕННО) — другое правило, не входит. д — двоеточие после слов автора перед прямой речью — то же правило, что в «а» и «б», входит.","id":"m-47"}]</script>
<script>
'use strict';
const VER = '8';
const LESSONS = JSON.parse(document.getElementById('lessondata').textContent);
const EXAM = JSON.parse(document.getElementById('examdata').textContent);
const BANK = JSON.parse(document.getElementById('bankdata').textContent);
const LMAP = {}; LESSONS.forEach(l => LMAP[l.id] = l);

/* Правила, которые трекает планировщик: все уроки из маршрутов заданий 1–26 */
const ROUTE = [];
EXAM.filter(e => e.n < 27).forEach(e => e.lessons.forEach(lid => { if (!ROUTE.includes(lid)) ROUTE.push(lid); }));
const PRIMARY_PTS = {}; EXAM.forEach(e => PRIMARY_PTS[e.n] = e.pts);
let LASTSEL = {}; // последний выбор в карточке-соответствии
const PRIMARY = {}; // урок -> основное задание
EXAM.filter(e => e.n < 27).forEach(e => e.lessons.forEach(lid => { if (!(lid in PRIMARY)) PRIMARY[lid] = e.n; }));
ROUTE.sort((a, b) => PRIMARY[a] - PRIMARY[b] || a.localeCompare(b));

/* карточки по урокам и пулы по заданиям (les=null) */
const BYLES = {}, BYTASK = {};
BANK.forEach(c => {
  if (c.les) (BYLES[c.les] = BYLES[c.les] || []).push(c);
  else (BYTASK[c.task] = BYTASK[c.task] || []).push(c);
});
function poolFor(lid) {
  const own = BYLES[lid] || [];
  const t = PRIMARY[lid];
  const shared = (BYTASK[t] || []);
  return own.concat(shared);
}

/* ------------ состояние ------------ */
const KEY = 'sotka1';
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { S = null; }
if (!S) S = { name: '', examDate: '2027-06-01', streak: 0, lastDone: '', rules: {}, hist: {}, seen: {}, right: {}, wrong: {} };
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today() { return dayKey(); }
function addDays(k, n) { const d = new Date(k + 'T12:00:00'); d.setDate(d.getDate() + n); return dayKey(d); }
function R(lid) { return S.rules[lid] || (S.rules[lid] = { st: 'new', passes: 0, due: null }); }

/* стрик: пропуск дня обнуляет */
(function () {
  if (S.lastDone && S.lastDone < addDays(today(), -1)) S.streak = 0;
})();

/* ------------ статусы ------------ */
function ruleState(lid) {
  const r = S.rules[lid];
  if (!r || r.st === 'new') return 'new';
  if (r.passes >= 4) return 'mst';
  return 'lrn';
}
function dueRules() { return ROUTE.filter(l => { const r = S.rules[l]; return r && r.st !== 'new' && r.passes < 4 && r.due && r.due <= today(); }); }
function newRules() { return ROUTE.filter(l => ruleState(l) === 'new'); }
function mastCount() { return ROUTE.filter(l => ruleState(l) === 'mst').length; }
function forecast() {
  let p = 0, max = 0;
  EXAM.filter(e => e.n < 27).forEach(e => {
    max += e.pts;
    const m = e.lessons.filter(l => ruleState(l) === 'mst').length;
    p += e.pts * (e.lessons.length ? m / e.lessons.length : 0);
  });
  return [Math.round(p), max];
}

/* ------------ экраны ------------ */
const $ = id => document.getElementById(id);
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DW = ['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];
function plu(n, f) { const a = Math.abs(n) % 100, b = a % 10; return f[(a > 10 && a < 20) ? 2 : (b > 1 && b < 5) ? 1 : b === 1 ? 0 : 2]; }

function renderToday() {
  const d = new Date();
  $('h-kick').textContent = DW[d.getDay()] + ' · ' + d.getDate() + ' ' + MON[d.getMonth()].toUpperCase();
  $('h-hi').textContent = S.name ? 'Привет, ' + S.name : 'Русский';
  const days = Math.max(0, Math.ceil((new Date(S.examDate + 'T10:00:00') - d) / 86400000));
  $('st-days').textContent = days;
  $('st-streak').textContent = S.streak;
  $('st-mast').textContent = mastCount();
  $('st-mast-l').textContent = 'закреплено из ' + ROUTE.length;
  const due = dueRules().length, nw = newRules().length;
  const inwork = ROUTE.filter(l => ruleState(l) === 'lrn').length - due;
  $('h-queue').innerHTML = (due ? '<b>к пересдаче ' + due + '</b> · ' : '') + 'в работе ' + Math.max(0, inwork) + ' · новых ' + nw;
  const [p, mx] = forecast();
  const sessions = Object.keys(S.hist).length;
  $('h-prog').textContent = sessions < 3
    ? 'Появится после ' + (3 - sessions) + ' ' + plu(3 - sessions, ['сессии','сессий','сессий']) + ' — мне нужно узнать тебя'
    : p + ' из ' + mx + ' первичных баллов';
}

function renderMap() {
  /* «продолжить чтение» — урок, на котором остановился */
  const rb = $('resumebox'); rb.innerHTML = '';
  if (S.lastRead && LMAP[S.lastRead]) {
    const btn = document.createElement('button'); btn.className = 'resume';
    btn.innerHTML = '<span><span class="rk2">Продолжить чтение</span><br><span class="rt2">' + esc(LMAP[S.lastRead].title) + '</span></span><span style="font-weight:800">→</span>';
    btn.onclick = () => openReader(S.lastRead, true);
    rb.appendChild(btn);
  }
  const box = $('maplist'); box.innerHTML = '';
  EXAM.forEach(e => {
    const row = document.createElement('button'); row.className = 'trow';
    if (e.n === 27) {
      row.innerHTML = '<div class="tnum-sq">27</div><div class="tt"><span class="n">Сочинение</span><span class="m">22 балла · приложение «Сочинение»</span></div><div style="font-weight:800">→</div>';
      row.onclick = () => location.href = '../essay/';
      box.appendChild(row); return;
    }
    const m = e.lessons.filter(l => ruleState(l) === 'mst').length;
    const pct = e.lessons.length ? Math.round(100 * m / e.lessons.length) : 0;
    if (pct === 100) row.classList.add('done');
    row.innerHTML = '<div class="tnum-sq">' + e.n + '</div><div class="tt"><span class="n">' + e.title + '</span><span class="m">' + e.pts + ' ' + plu(e.pts, ['балл','балла','баллов']) + ' · ' + m + '/' + e.lessons.length + ' правил</span></div><div class="tbar"><div class="tr"><div class="fl" style="width:' + pct + '%"></div></div></div>';
    const sub = document.createElement('div');
    if (!(S.mapOpen && S.mapOpen[e.n])) sub.className = 'hidden';
    e.lessons.forEach(lid => {
      const L = LMAP[lid]; if (!L) return;
      const st = ruleState(lid);
      const r = document.createElement('button'); r.className = 'rrow';
      const passInfo = st === 'mst' ? 'навсегда' : st === 'lrn' ? 'пересдач ' + (S.rules[lid].passes) + '/4' : '';
      r.innerHTML = '<div class="rsq ' + (st === 'mst' ? 'full' : st === 'lrn' ? 'half' : '') + '"></div><div class="rt">' + L.title + '</div><div class="rs">' + passInfo + '</div>';
      r.onclick = () => openRuleMenu(lid);
      sub.appendChild(r);
    });
    row.onclick = () => {
      sub.classList.toggle('hidden');
      S.mapOpen = S.mapOpen || {};
      if (sub.classList.contains('hidden')) delete S.mapOpen[e.n]; else S.mapOpen[e.n] = 1;
      save();
    };
    box.appendChild(row); box.appendChild(sub);
  });
  /* вернуть прокрутку экрана */
  if (S.mapScroll) requestAnimationFrame(() => scrollTo(0, S.mapScroll));
}

function openRuleMenu(lid) { openReader(lid, true); }

/* ------------ читалка ------------ */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
/* подсветка примеров: «…» и слова с пропуском букв (выр..внять) */
function hl(s) {
  return esc(s)
    .replace(/«([^»]{1,80})»/g, '<b class="q">«$1»</b>')
    .replace(/(^|[\s(])([а-яёА-ЯЁ]+\.\.[а-яёА-ЯЁ]+)/g, '$1<b class="q">$2</b>');
}
function itemHTML(it) {
  if (it.t === 'p') return '<p>' + hl(it.s) + '</p>';
  if (it.t === 'st') {
    let h = '<div class="steps">';
    it.items.forEach((s, i) => h += '<div class="step"><div class="sn">' + (i + 1) + '</div><div class="stx">' + hl(s) + '</div></div>');
    return h + '</div>';
  }
  if (it.t === 'ex') {
    let h = '<div class="exl">';
    it.items.forEach(s => h += '<div class="exi">' + hl(s) + '</div>');
    return h + '</div>';
  }
  if (it.t === 'wr') {
    let h = '<div class="warnl">';
    it.items.forEach(s => h += '<div class="wi">' + hl(s) + '</div>');
    return h + '</div>';
  }
  if (it.t === 'tb') {
    let h = '<div class="tbwrap"><table>';
    if (it.head) { h += '<tr>'; it.head.forEach(x => h += '<th>' + esc(x) + '</th>'); h += '</tr>'; }
    it.rows.forEach(r => { h += '<tr>'; r.forEach(c => h += '<td>' + hl(c) + '</td>'); h += '</tr>'; });
    return h + '</table></div>';
  }
  return '';
}
function openReader(lid, withGo) {
  const L = LMAP[lid]; if (!L) return;
  const b = $('r-body');
  let h = '<div class="rk">' + L.id + (L.tasks.length ? ' · задание ' + L.tasks.filter(t => t < 27).join(', ') : '') + '</div><h2>' + esc(L.title) + '</h2>';
  L.blocks.forEach(bl => {
    if (bl.h) h += '<h4>' + esc(bl.h) + '</h4>';
    bl.items.forEach(it => h += itemHTML(it));
  });
  if (withGo && poolFor(lid).length > 1) h += '<div class="go"><button class="nextbtn blue" onclick="startSession(\'' + lid + '\')">Тренировать это правило<span>→</span></button></div>';
  b.innerHTML = h;
  /* вернуть строку, где остановился */
  S.lastRead = lid;
  b.scrollTop = (S.readPos && S.readPos[lid]) || 0;
  READING = lid; save();
  $('sh-read').classList.add('on');
}
let READING = null, rpTimer = null;
$('r-body').addEventListener('scroll', () => {
  if (!READING) return;
  clearTimeout(rpTimer);
  rpTimer = setTimeout(() => {
    S.readPos = S.readPos || {};
    S.readPos[READING] = $('r-body').scrollTop;
    save();
  }, 300);
});
$('r-close').onclick = () => {
  if (READING) { S.readPos = S.readPos || {}; S.readPos[READING] = $('r-body').scrollTop; save(); READING = null; }
  $('sh-read').classList.remove('on');
  if (!$('v-map').classList.contains('hidden')) renderMap();
};

/* ------------ сессия ------------ */
/* очередь = список блоков-правил; внутри блока карточки идут, пока не будет 3 верных подряд (макс 6) */
let SESS = null;
/* полный формат ЕГЭ (мультивыбор, соответствия) даётся, когда правило уже держится:
   сначала мышца на простых карточках, потом экзаменационная форма */
const HARD = c => c.k === 'multi' || c.k === 'match';
function pickCards(lid, n, excl) {
  let pool = poolFor(lid).filter(c => !excl.has(c.id));
  const r = S.rules[lid];
  const ready = r && (r.passes >= 2 || ruleState(lid) === 'mst');
  const soft = pool.filter(c => !HARD(c)), hard = pool.filter(HARD);
  if (ready && hard.length) pool = hard.concat(soft);
  else if (soft.length) pool = soft.concat(hard);
  const unseen = pool.filter(c => !S.seen[c.id]);
  const wrongs = pool.filter(c => S.seen[c.id] && S.wrong[c.id]);
  const rest = pool.filter(c => S.seen[c.id] && !S.wrong[c.id]);
  const shuf = a => a.sort(() => Math.random() - .5);
  const ordered = shuf(wrongs).concat(shuf(unseen)).concat(shuf(rest));
  /* держим приоритет формата: у готовых правил экзаменационные идут первыми */
  ordered.sort((a, b) => (ready ? (HARD(b) - HARD(a)) : (HARD(a) - HARD(b))));
  return ordered.slice(0, n);
}
function buildPlan(focus) {
  const plan = [];
  if (focus) { plan.push(focus); return plan; }
  dueRules().slice(0, 2).forEach(l => plan.push(l));
  const lrn = ROUTE.filter(l => ruleState(l) === 'lrn' && !plan.includes(l) && !dueRules().includes(l));
  if (lrn.length && plan.length < 3) plan.push(lrn[0]);
  const nw = newRules();
  while (plan.length < 3 && nw.length) { const x = nw.shift(); if (!plan.includes(x)) plan.push(x); }
  return plan;
}
function startSession(focus) {
  $('sh-read').classList.remove('on');
  const plan = buildPlan(focus || null);
  if (!plan.length) { alert('Всё закреплено. Возвращайся завтра — что-нибудь подойдёт к пересдаче.'); return; }
  SESS = { plan, bi: 0, streak3: 0, served: 0, servedInBlock: 0, excl: new Set(), results: {}, totalTarget: plan.length * 4, theoryShown: {}, correctTotal: 0 };
  plan.forEach(l => SESS.results[l] = { before: ruleState(l), pass: false });
  $('sh-sess').classList.add('on');
  nextCard();
}
function curLes() { return SESS.plan[SESS.bi]; }
function sessProg() {
  const done = SESS.bi + Math.min(1, SESS.streak3 / 3);
  return Math.min(100, Math.round(100 * done / SESS.plan.length));
}
function nextCard() {
  if (!SESS) return;
  if (SESS.bi >= SESS.plan.length) { endSession(); return; }
  const lid = curLes();
  /* блок пройден: 3 подряд; блок не идёт: 6 карточек без серии */
  if (SESS.streak3 >= 3 || SESS.servedInBlock >= 6) {
    finishBlock(SESS.streak3 >= 3);
    SESS.bi++; SESS.streak3 = 0; SESS.servedInBlock = 0;
    nextCard(); return;
  }
  /* новое правило: с ходу зонд; теория покажется после первой ошибки */
  const cards = pickCards(lid, 1, SESS.excl);
  if (!cards.length) { finishBlock(SESS.streak3 >= 3); SESS.bi++; SESS.streak3 = 0; SESS.servedInBlock = 0; nextCard(); return; }
  const c = cards[0];
  SESS.excl.add(c.id); SESS.served++; SESS.servedInBlock++;
  renderCard(c);
}
/* шапка карточки: номер задания берём у самой карточки, название — у её правила */
function cardKick(c) {
  const lid = c.les || curLes();
  const L = LMAP[lid];
  const t = c.task || PRIMARY[lid];
  const ex = EXAM.find(e => e.n === t);
  const name = c.les ? (L && L.title) : (ex && ex.title) || (L && L.title);
  return 'Задание ' + t + (name ? ' · ' + name : '');
}
/* условие: вопрос жирным, текст-опора отдельным блоком — как в КИМе */
function qHTML(q) {
  const parts = String(q).split(/\n\n+/);
  let h = '<div class="cq">' + esc(parts[0]) + '</div>';
  if (parts.length > 1) h += '<div class="qtext">' + esc(parts.slice(1).join('\n\n')) + '</div>';
  return h;
}
function renderCard(c) {
  $('s-prog').style.width = sessProg() + '%';
  $('s-kick').textContent = 'Серия ' + SESS.streak3 + '/3';
  const b = $('s-body'); $('s-foot').classList.add('hidden');
  let h = '<div class="fade"><div class="ck">' + esc(cardKick(c)) + '</div>' + qHTML(c.q);
  if (c.k === 'flip') {
    h += '<button class="flipbtn" id="flipb">Показать ответ</button><div id="flipa" class="hidden"><div class="expl"><div class="ek ok">Ответ</div><div class="et">' + hl(c.a) + (c.e ? '\n\n' + hl(c.e) : '') + '</div></div><div class="selfrow"><button class="yes" id="fk-y">Знал</button><button id="fk-n">Не знал</button></div></div>';
    b.innerHTML = h + '</div>'; b.scrollTop = 0;
    $('flipb').onclick = () => { $('flipb').classList.add('hidden'); $('flipa').classList.remove('hidden'); };
    $('fk-y').onclick = () => answer(c, true, null);
    $('fk-n').onclick = () => answer(c, false, null);
    return;
  }
  if (c.k === 'multi') { renderMulti(c, h); return; }
  if (c.k === 'match') { renderMatch(c, h); return; }
  h += '<div class="opts">';
  c.o.forEach((o, i) => { h += '<button class="opt" data-oid="' + o.id + '"><span class="osq"></span>' + (/^\d+$/.test(o.t) ? '' : '<span class="oi">' + (i + 1) + ')</span>') + '<span>' + esc(o.t) + '</span></button>'; });
  h += '</div></div>';
  b.innerHTML = h; b.scrollTop = 0;
  /* первый тап — выбор (квадратик), повторный тап или «Ответить» — подтверждение */
  let picked = null;
  const confirmPick = () => {
    if (picked === null) return;
    const oid = picked; const ok = oid === c.c;
    b.querySelectorAll('.opt').forEach(x => {
      x.disabled = true; x.classList.remove('pick');
      if (x.dataset.oid === c.c) x.classList.add('right');
      else if (x.dataset.oid === oid) x.classList.add(ok ? 'right' : 'wrong');
    });
    $('s-foot').classList.add('hidden');
    answer(c, ok, oid);
  };
  b.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      if (btn.dataset.oid === picked) { confirmPick(); return; }
      picked = btn.dataset.oid;
      b.querySelectorAll('.opt').forEach(x => x.classList.toggle('pick', x.dataset.oid === picked));
      $('s-foot').classList.remove('hidden');
      $('s-next').innerHTML = 'Ответить<span>→</span>';
      $('s-next').classList.add('blue');
      $('s-next').onclick = confirmPick;
    };
  });
}
/* мультивыбор: отмечай квадратики, потом «Ответить»; засчитывается только полное совпадение */
function renderMulti(c, h) {
  const b = $('s-body');
  h += '<div class="opts">';
  c.o.forEach((o, i) => { h += '<button class="opt" data-oid="' + o.id + '"><span class="osq"></span>' + (/^\d+$/.test(o.t) ? '' : '<span class="oi">' + (i + 1) + ')</span>') + '<span>' + esc(o.t) + '</span></button>'; });
  h += '</div></div>';
  b.innerHTML = h; b.scrollTop = 0;
  const picked = new Set();
  const confirmPick = () => {
    if (!picked.size) return;
    const ok = picked.size === c.cs.length && c.cs.every(x => picked.has(x));
    b.querySelectorAll('.opt').forEach(x => {
      x.disabled = true; x.classList.remove('pick');
      const should = c.cs.includes(x.dataset.oid), did = picked.has(x.dataset.oid);
      if (should) x.classList.add('right');
      else if (did) x.classList.add('wrong');
    });
    $('s-foot').classList.add('hidden');
    answer(c, ok, null);
  };
  b.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      const oid = btn.dataset.oid;
      if (picked.has(oid)) { picked.delete(oid); btn.classList.remove('pick'); }
      else { picked.add(oid); btn.classList.add('pick'); }
      if (picked.size) {
        $('s-foot').classList.remove('hidden');
        $('s-next').innerHTML = 'Ответить<span>→</span>';
        $('s-next').classList.add('blue');
        $('s-next').onclick = confirmPick;
      } else $('s-foot').classList.add('hidden');
    };
  });
}
/* соответствие АБВГД -> цифры */
function renderMatch(c, h) {
  const b = $('s-body');
  h += '<div style="margin-top:12px">';
  c.right.forEach(r => { h += '<div class="mtxt"><b>' + r.id + ')</b> ' + esc(r.t) + '</div>'; });
  h += '</div>';
  c.left.forEach(l => {
    h += '<div class="mrow" data-lid="' + l.id + '"><div class="ml"><b>' + l.id + '</b> · ' + esc(l.t) + '</div><div class="digrow">';
    c.right.forEach(r => { h += '<button class="dig" data-lid="' + l.id + '" data-rid="' + r.id + '">' + r.id + '</button>'; });
    h += '</div><div class="mres"></div></div>';
  });
  h += '</div>';
  b.innerHTML = h; b.scrollTop = 0;
  const sel = {};
  const confirmPick = () => {
    if (Object.keys(sel).length < c.left.length) return;
    LASTSEL = sel;
    let ok = true;
    c.left.forEach(l => {
      const good = c.map[l.id] === sel[l.id];
      if (!good) ok = false;
      const row = b.querySelector('.mrow[data-lid="' + l.id + '"]');
      row.querySelectorAll('.dig').forEach(d => {
        d.disabled = true; d.classList.remove('on');
        if (d.dataset.rid === c.map[l.id]) d.classList.add('ok');
        else if (d.dataset.rid === sel[l.id]) d.classList.add('no');
      });
      const res = row.querySelector('.mres');
      res.textContent = good ? 'верно' : 'надо: ' + c.map[l.id];
      res.className = 'mres ' + (good ? 'ok' : 'no');
    });
    $('s-foot').classList.add('hidden');
    answer(c, ok, null);
  };
  b.querySelectorAll('.dig').forEach(d => {
    d.onclick = () => {
      const lid = d.dataset.lid;
      sel[lid] = d.dataset.rid;
      b.querySelectorAll('.dig[data-lid="' + lid + '"]').forEach(x => x.classList.toggle('on', x.dataset.rid === sel[lid]));
      if (Object.keys(sel).length === c.left.length) {
        $('s-foot').classList.remove('hidden');
        $('s-next').innerHTML = 'Ответить<span>→</span>';
        $('s-next').classList.add('blue');
        $('s-next').onclick = confirmPick;
      }
    };
  });
}
function answer(c, ok, oid) {
  S.seen[c.id] = 1;
  if (ok) { delete S.wrong[c.id]; SESS.streak3++; SESS.correctTotal++; }
  else { S.wrong[c.id] = 1; SESS.streak3 = 0; }
  save();
  const b = $('s-body');
  const wrap = document.createElement('div');
  let h = '';
  if (c.k !== 'flip') {
    let dg = '';
    if (c.k === 'multi') dg = c.o.map((o, i) => c.cs.includes(o.id) ? (i + 1) : '').join('');
    else if (c.k === 'match') dg = c.left.map(l => c.map[l.id]).join('');
    else dg = String(c.o.findIndex(o => o.id === c.c) + 1);
    let verdict = ok ? 'Верно' : 'Мимо';
    if (c.k === 'match' && !ok) {
      const hit = c.left.filter(l => LASTSEL[l.id] === c.map[l.id]).length;
      const pts = (PRIMARY_PTS[c.task] === 2) ? (hit >= c.left.length - 2 ? 1 : 0) : 0;
      verdict = hit + ' из ' + c.left.length + (PRIMARY_PTS[c.task] === 2 ? ' · ' + pts + ' балл из 2' : '');
    }
    h += '<div class="expl"><div class="ek ' + (ok ? 'ok' : 'no') + '">' + verdict + ' · Ответ: ' + dg + '</div><div class="et">' + hl(c.e || '') + '</div></div>';
  }
  /* первая ошибка в новом правиле -> теория */
  const lid = curLes(); const L = LMAP[lid];
  if (!ok && !SESS.theoryShown[lid] && SESS.results[lid].before === 'new' && L) {
    SESS.theoryShown[lid] = 1;
    h += theoryHTML(L);
  }
  wrap.innerHTML = h;
  b.appendChild(wrap);
  if (!ok) wrap.scrollIntoView({ block: 'nearest' });
  $('s-foot').classList.remove('hidden');
  $('s-next').classList.remove('blue');
  $('s-next').innerHTML = 'Дальше<span>→</span>';
  $('s-next').onclick = () => nextCard();
  if (ok && c.k !== 'flip' && !h.includes('theory')) { setTimeout(() => { if (SESS) nextCard(); }, (c.k === 'multi' || c.k === 'match') ? 1600 : 700); }
}
function theoryHTML(L) {
  let ps = [], steps = [];
  L.blocks.forEach(bl => {
    bl.items.forEach(it => {
      if (it.t === 'p' && ps.length < 2 && !steps.length) ps.push(it.s);
      if (it.t === 'st' && !steps.length) steps = it.items.slice(0, 4);
    });
  });
  let h = '<div class="theory"><div class="k">Правило</div><h3>' + esc(L.title) + '</h3>';
  ps.forEach(p => h += '<p>' + hl(p) + '</p>');
  if (steps.length) {
    h += '<div class="alg">';
    steps.forEach((s, i) => h += '<p style="margin-top:6px"><b>' + (i + 1) + '.</b> ' + hl(s) + '</p>');
    h += '</div>';
  }
  h += '<p style="margin-top:14px"><button style="border:1px solid rgba(255,255,255,.5);color:#fff;padding:10px 14px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em" onclick="openReader(\'' + L.id + '\')">Полная теория →</button></p></div>';
  return h;
}
function finishBlock(passed) {
  const lid = SESS.plan[SESS.bi]; const r = R(lid);
  if (passed) {
    SESS.results[lid].pass = true;
    if (r.st === 'new') { r.st = 'lrn'; r.passes = 1; r.due = addDays(today(), 1); }
    else if (r.due && r.due <= today() && r.lastPass !== today()) {
      r.passes++; r.lastPass = today();
      r.due = r.passes >= 4 ? null : addDays(today(), r.passes === 2 ? 3 : 7);
      if (r.passes >= 4) r.st = 'mst';
    } else if (!r.due) { r.due = addDays(today(), 1); }
  } else {
    if (r.st === 'new') { r.st = 'lrn'; r.passes = 0; }
    r.due = addDays(today(), 1);
  }
  save();
}
function endSession() {
  const tk = today();
  S.hist[tk] = (S.hist[tk] || 0) + 1;
  if (S.lastDone !== tk) { S.streak++; S.lastDone = tk; }
  save();
  const b = $('s-body');
  $('s-prog').style.width = '100%';
  $('s-kick').textContent = 'Готово';
  let h = '<div class="fade"><div class="kick"><span class="sq"></span>Сессия закрыта</div><div class="donebig">День в деле.<br>Стрик ' + S.streak + '.</div><div class="dlist">';
  SESS.plan.forEach(lid => {
    const L = LMAP[lid]; const r = S.rules[lid]; const res = SESS.results[lid];
    let st;
    if (ruleState(lid) === 'mst') st = 'Закреплено навсегда';
    else if (res.pass && res.before === 'new') st = 'Взято · пересдача завтра';
    else if (res.pass) st = 'Пересдано ' + r.passes + '/4';
    else st = 'Не далось · вернётся завтра';
    h += '<div class="drow"><span>' + esc(L ? L.title : lid) + '</span><span class="st">' + st + '</span></div>';
  });
  h += '</div></div>';
  b.innerHTML = h;
  $('s-foot').classList.remove('hidden');
  $('s-next').textContent = '';
  $('s-next').innerHTML = 'На сегодня всё<span>→</span>';
  $('s-next').onclick = closeSession;
}
function closeSession() {
  SESS = null;
  $('sh-sess').classList.remove('on');
  $('s-next').innerHTML = 'Дальше<span>→</span>';
  renderToday(); renderMap();
}
$('s-close').onclick = () => {
  if (SESS && SESS.bi < SESS.plan.length) { if (SESS.served > 0) { /* прогресс карточек уже сохранён */ } closeSession(); }
  else closeSession();
};
$('b-go').onclick = () => startSession(null);

/* ------------ навигация ------------ */
function tab(t) {
  if (!$('v-map').classList.contains('hidden') && t === 'today') { S.mapScroll = scrollY; save(); }
  $('v-today').classList.toggle('hidden', t !== 'today');
  $('v-map').classList.toggle('hidden', t !== 'map');
  $('tab-today').classList.toggle('on', t === 'today');
  $('tab-map').classList.toggle('on', t === 'map');
  if (t === 'map') renderMap(); else scrollTo(0, 0);
}
addEventListener('scroll', () => { if (!$('v-map').classList.contains('hidden')) { S.mapScroll = scrollY; } }, { passive: true });
addEventListener('pagehide', save);
$('tab-today').onclick = () => tab('today');
$('tab-map').onclick = () => tab('map');
$('inp-name').value = S.name || '';
$('inp-name').onchange = e => { S.name = e.target.value.trim(); save(); renderToday(); };
$('verline').textContent = 'Сотка · сборка ' + VER + ' · теория от 08.09.2026 (проект ФИПИ 2027) · ' + BANK.length + ' карточек';

renderToday();
