сочинение объёмом 149 слов по проекту 2027?","a":"Ноль по всем критериям.","e":"Минимальный засчитываемый объём — 150 слов."},{"id":"f-RU063","k":"flip","les":"RU063","task":27,"q":"Почему «Автор поднимает проблему дружбы» не является полноценной позицией?","a":"Фраза не содержит ответа на вопрос о дружбе.","e":"Названа область обсуждения, но не авторский вывод."},{"id":"f-RU064","k":"flip","les":"RU064","task":27,"q":"Достаточно ли написать после примера «Это подтверждает мысль автора»?","a":"Нет, нужно раскрыть, что именно показывает пример.","e":"Общее утверждение не объясняет его смысл в рамках проблемы."},{"id":"f-RU065","k":"flip","les":"RU065","task":27,"q":"Что нужно добавить к «Примеры противопоставлены»?","a":"Указать, что именно противопоставлено и какой авторский вывод это раскрывает.","e":"Без содержательного объяснения название связи неполно."},{"id":"f-RU066","k":"flip","les":"RU066","task":27,"q":"Почему название произведения без эпизода не является убедительным примером-аргументом?","a":"Не показано, какой факт подтверждает тезис и как он с ним связан.","e":"Ссылка должна иметь содержательную доказательную функцию."},{"id":"f-RU067","k":"flip","les":"RU067","task":27,"q":"Обязательно ли в сочинении ровно семь абзацев?","a":"Нет.","e":"Оцениваются содержание, логика и грамотность; абзацы должны соответствовать смысловому членению."},{"id":"f-RU068","k":"flip","les":"RU068","task":6,"q":"Какой тип ошибки в выводе «Он однажды опоздал, следовательно, он всегда безответственен»?","a":"Логическая ошибка — необоснованное обобщение.","e":"Один случай не доказывает постоянное качество."},{"id":"f-RU069","k":"flip","les":"RU069","task":23,"q":"Какая связь между двумя основными примерами в образце?","a":"Противопоставление невнимательной спешки рассказчика и деятельного внимания Ани.","e":"Контраст показывает, что внимание выражается в готовности уделить человеку время."},{"id":"f-RU070","k":"flip","les":"RU070","task":3,"q":"Что шире — национальный язык или литературный язык?","a":"Национальный язык.","e":"Литературный язык является одной из его форм наряду с другими разновидностями."},{"id":"f-RU071","k":"flip","les":"RU071","task":3,"q":"Какое качество нарушено, если текст грамматически верен, но слова допускают два разных понимания ключевой мысли?","a":"Точность и ясность выражения.","e":"Формальная правильность не устраняет смысловую неоднозначность."},{"id":"f-RU072","k":"flip","les":"RU072","task":3,"q":"Почему эмоционально убедительный рассказ не всегда является достаточным доказательством общего тезиса?","a":"Его факты могут не подтверждать общий вывод или описывать лишь отдельный случай.","e":"Для аргументации требуется проверка относимости и логической силы основания."},{"k":"mc","task":1,"les":"RU010","q":"Какое слово (сочетание слов) должно стоять на месте пропуска?\n\nВода в горных озёрах прогревается очень медленно. <...> даже в разгар лета купаться в них решаются немногие.","o":[{"id":"а","t":"однако"},{"id":"б","t":"поэтому"},{"id":"в","t":"например"},{"id":"г","t":"напротив"}],"c":"б","e":"Между предложениями отношение причины и следствия: холодная вода — причина, нежелание купаться — следствие, поэтому нужно «поэтому». «Однако» ошибочно вводит противопоставление, которого нет. «Например» предполагает иллюстрацию к общему тезису, а второе предложение не пример. «Напротив» требует противоположного по смыслу утверждения, а здесь второе предложение вытекает из первого.","id":"g-0"},{"k":"mc","task":1,"les":"RU010","q":"Какое слово (сочетание слов) должно стоять на месте пропуска?\n\nГепард способен развить скорость свыше ста километров в час. <...> удерживать её он может лишь несколько десятков секунд.","o":[{"id":"а","t":"поэтому"},{"id":"б","t":"например"},{"id":"в","t":"однако"},{"id":"г","t":"кроме того"}],"c":"в","e":"Второе предложение ограничивает, противопоставляется первому (огромная скорость — но ненадолго), поэтому верно «однако». «Поэтому» ложно представляет ограничение как следствие скорости. «Например» ошибочно: второе предложение не иллюстрирует первое. «Кроме того» присоединяет однородный дополнительный довод, а здесь смысл не добавляется, а противопоставляется.","id":"g-1"},{"k":"mc","task":1,"les":"RU010","q":"Какое слово (сочетание слов) должно стоять на месте пропуска?\n\nМногие металлы активно взаимодействуют с водой. <...>, натрий вспыхивает при первом же соприкосновении с ней.","o":[{"id":"а","t":"однако"},{"id":"б","t":"следовательно"},{"id":"в","t":"зато"},{"id":"г","t":"например"}],"c":"г","e":"Второе предложение — конкретная иллюстрация общего утверждения о металлах, поэтому нужно «например». «Однако» и «зато» ошибочно вводят противопоставление, хотя пример подтверждает, а не опровергает тезис. «Следовательно» ложно выдаёт частный пример за логический вывод из первого предложения.","id":"g-2"},{"k":"mc","task":1,"les":"RU010","q":"Какое слово (сочетание слов) должно стоять на месте пропуска?\n\nБумага легка и дешева в производстве. <...>, она хорошо впитывает краску, что особенно важно для печати.","o":[{"id":"а","t":"кроме того"},{"id":"б","t":"напротив"},{"id":"в","t":"следовательно"},{"id":"г","t":"однако"}],"c":"а","e":"Второе предложение добавляет ещё одно достоинство бумаги к уже названным, поэтому верно присоединительное «кроме того». «Напротив» и «однако» ошибочно вводят противопоставление, хотя оба предложения говорят о плюсах бумаги. «Следовательно» ложно представляет новое свойство (впитывание краски) как вывод из лёгкости и дешевизны, хотя одно из другого не следует.","id":"g-3"},{"k":"mc","task":1,"les":"RU010","q":"Какое слово (сочетание слов) должно стоять на месте пропуска?\n\nДнём в пустыне стоит невыносимая жара. Ночью, <...>, температура может опускаться ниже нуля.","o":[{"id":"а","t":"например"},{"id":"б","t":"напротив"},{"id":"в","t":"поэтому"},{"id":"г","t":"кроме того"}],"c":"б","e":"Жара днём и мороз ночью — противоположные явления, поэтому нужно «напротив». «Например» ошибочно: ночной холод не пример дневной жары. «Поэтому» ложно устанавливает причинную связь (жара не причина ночного холода в логике этого текста). «Кроме того» лишь добавляло бы однородный факт, не передавая ключевого контраста.","id":"g-4"},{"k":"mc","task":1,"les":"RU010","q":"Какое слово (сочетание слов) должно стоять на месте пропуска?\n\nВсе планеты-гиганты состоят преимущественно из газа. Юпитер — планета-гигант. <...>, твёрдой поверхности у него нет.","o":[{"id":"а","t":"однако"},{"id":"б","t":"например"},{"id":"в","t":"следовательно"},{"id":"г","t":"зато"}],"c":"в","e":"Третье предложение — логический вывод из двух посылок (все гиганты газовые; Юпитер — гигант), поэтому верно «следовательно». «Однако» и «зато» ошибочно вводят противопоставление, хотя вывод согласуется с посылками. «Например» ложно превращает умозаключение в иллюстрацию.","id":"g-5"},{"k":"mc","task":1,"les":"RU010","q":"Какое слово (сочетание слов) должно стоять на месте пропуска?\n\nПервые фотоаппараты весили несколько килограммов, а съёмка требовала долгой неподвижности. <...> желающих получить свой портрет было множество.","o":[{"id":"а","t":"поэтому"},{"id":"б","t":"иными словами"},{"id":"в","t":"например"},{"id":"г","t":"несмотря на это"}],"c":"г","e":"Второе предложение сообщает о результате вопреки названным трудностям, поэтому верно уступительное «несмотря на это». «Поэтому» ошибочно: популярность съёмки не следствие тяжести камер, а факт вопреки ей. «Иными словами» предполагает переформулировку той же мысли, а здесь новая информация. «Например» ложно выдаёт второе предложение за иллюстрацию первого.","id":"g-6"},{"k":"mc","task":1,"les":"RU010","q":"Какое слово (сочетание слов) должно стоять на месте пропуска?\n\nХамелеон меняет окраску не столько для маскировки, сколько для общения с сородичами. <...>, цвет его кожи — это своего рода язык.","o":[{"id":"а","t":"иными словами"},{"id":"б","t":"кроме того"},{"id":"в","t":"однако"},{"id":"г","t":"напротив"}],"c":"а","e":"Второе предложение переформулирует мысль первого в сжатом виде, поэтому нужно поясняющее «иными словами». «Кроме того» ошибочно вводит новую дополнительную информацию, хотя мысль та же. «Однако» и «напротив» ложно противопоставляют предложения, тогда как второе не спорит с первым, а поясняет его.","id":"g-7"},{"k":"mc","task":1,"les":"RU010","q":"Какое слово (сочетание слов) должно стоять на месте пропуска?\n\nДревесина кедра почти не поддаётся гниению. <...> из неё издавна делали лодки и колодезные срубы.","o":[{"id":"а","t":"однако"},{"id":"б","t":"напротив"},{"id":"в","t":"поэтому"},{"id":"г","t":"например"}],"c":"в","e":"Свойство древесины — причина, её применение — следствие, поэтому верно «поэтому». «Однако» и «напротив» ошибочно вводят противопоставление, хотя второе предложение естественно вытекает из первого. «Например» ложно: использование кедра — не иллюстрация тезиса о гниении, а его практическое следствие.","id":"g-8"},{"k":"mc","task":1,"les":"RU010","q":"Какое слово (сочетание слов) должно стоять на месте пропуска?\n\nЭлектромобиль пока уступает бензиновому автомобилю в запасе хода. <...> он значительно дешевле в обслуживании.","o":[{"id":"а","t":"зато"},{"id":"б","t":"поэтому"},{"id":"в","t":"следовательно"},{"id":"г","t":"например"}],"c":"а","e":"Второе предложение возмещает недостаток достоинством (уступает в одном — выигрывает в другом), поэтому верно противительно-возместительное «зато». «Поэтому» и «следовательно» ошибочно представляют дешевизну обслуживания следствием малого запаса хода. «Например» ложно вводит иллюстрацию, хотя второе предложение противопоставлено первому.","id":"g-9"},{"k":"mc","task":22,"les":"RU059","q":"Какое средство выразительности использовано: „В душе его давно погас костёр надежды“?","o":[{"id":"а","t":"сравнение"},{"id":"б","t":"метафора"},{"id":"в","t":"олицетворение"},{"id":"г","t":"эпитет"}],"c":"б","e":"«Костёр надежды погас» — скрытое сопоставление надежды с огнём без сравнительного союза, то есть метафора. Сравнение ошибочно: нет союзов «как», «словно», «будто». Олицетворение выбирают, путая перенос по сходству с наделением неживого действиями живого существа, но огонь здесь не «оживает». Эпитет — образное определение, а в цитате выразительность создаёт не определение, а перенос значения.","id":"g-10"},{"k":"mc","task":22,"les":"RU060","q":"Какое средство выразительности использовано: „Мы верили в дорогу, мы верили в рассвет, мы верили в удачу“?","o":[{"id":"а","t":"анафора"},{"id":"б","t":"эпифора"},{"id":"в","t":"парцелляция"},{"id":"г","t":"антитеза"}],"c":"а","e":"Одинаковое начало трёх отрезков («мы верили в…») — анафора. Эпифору выбирают, путая повтор в начале с повтором в конце отрезков. Парцелляция — намеренное дробление предложения на отдельные «обрубки», а здесь единое предложение с повтором. Антитеза требует противопоставления понятий, которого в цитате нет.","id":"g-11"},{"k":"mc","task":22,"les":"RU059","q":"Какое средство выразительности использовано: „Усталый ветер прилёг отдохнуть в высокой траве“?","o":[{"id":"а","t":"метафора"},{"id":"б","t":"сравнение"},{"id":"в","t":"гипербола"},{"id":"г","t":"олицетворение"}],"c":"г","e":"Ветер наделён действиями и состояниями живого существа (устал, прилёг отдохнуть) — это олицетворение. Метафору выбирают, не различая общий перенос по сходству и его частный случай — «оживление» неживого; здесь ключевое именно очеловечивание. Сравнение ошибочно: нет сопоставления двух предметов с союзом. Гипербола — преувеличение, а размеров или степени здесь никто не преувеличивает.","id":"g-13"},{"k":"mc","task":22,"les":"RU060","q":"Какое средство выразительности использовано: „Он искал славы — а нашёл забвение“?","o":[{"id":"а","t":"антитеза"},{"id":"б","t":"оксюморон"},{"id":"в","t":"градация"},{"id":"г","t":"парцелляция"}],"c":"а","e":"Противопоставлены контрастные понятия «слава» и «забвение» в симметричной конструкции — это антитеза. Оксюморон выбирают, путая противопоставление двух частей высказывания с соединением несоединимого в одном словосочетании (типа «живой труп»). Градация — расположение слов по нарастанию признака, а здесь всего два контрастных члена. Парцелляция — дробление предложения точками, чего в цитате нет.","id":"g-14"},{"k":"mc","task":22,"les":"RU059","q":"Какое средство выразительности использовано: „Ледник сползал в долину, как огромная белая река“?","o":[{"id":"а","t":"метафора"},{"id":"б","t":"олицетворение"},{"id":"в","t":"метонимия"},{"id":"г","t":"сравнение"}],"c":"г","e":"Ледник открыто сопоставлен с рекой при помощи союза «как» — это сравнение. Метафору выбирают, не заметив союза: при союзе сопоставление не скрытое, а прямое. Олицетворение ошибочно: ледник не наделён свойствами живого существа. Метонимия — перенос по смежности (автор — произведение, сосуд — содержимое), никакой смежности здесь нет.","id":"g-16"},{"k":"mc","task":22,"les":"RU060","q":"Какое средство выразительности использовано: „Он вернулся в родной город. Через двадцать лет. Один“?","o":[{"id":"а","t":"инверсия"},{"id":"б","t":"парцелляция"},{"id":"в","t":"анафора"},{"id":"г","t":"риторический вопрос"}],"c":"б","e":"Единое по смыслу высказывание намеренно разбито точками на короткие отрезки — это парцелляция. Инверсию выбирают, считая любое «необычное» построение перестановкой слов, но порядок слов здесь обычный — необычно членение. Анафора требует повтора начала отрезков, а начала разные. Риторический вопрос невозможен: в цитате нет вопросительных предложений.","id":"g-17"},{"k":"mc","task":22,"les":"RU061","q":"Какое средство выразительности использовано: „Грохот грома прокатился над горами и гулко замер вдали“?","o":[{"id":"а","t":"ассонанс"},{"id":"б","t":"анафора"},{"id":"в","t":"аллитерация"},{"id":"г","t":"гипербола"}],"c":"в","e":"Повтор согласных [г] и [р] (грохот, грома, прокатился, горами, гулко) имитирует раскаты — это аллитерация. Ассонанс выбирают, путая повтор согласных с повтором гласных. Анафору выбирают по созвучию терминов, но повтора начал отрезков здесь нет. Гипербола — преувеличение, а в цитате нет преувеличенных масштабов, выразительность чисто звуковая.","id":"g-18"},{"k":"mc","task":22,"les":"RU059","q":"Какое средство выразительности использовано: „Я тысячу раз просил его быть осторожнее“?","o":[{"id":"а","t":"литота"},{"id":"б","t":"ирония"},{"id":"в","t":"метафора"},{"id":"г","t":"гипербола"}],"c":"г","e":"«Тысячу раз» — намеренное преувеличение числа просьб — это гипербола. Литота — противоположный приём, преуменьшение, и выбирают её те, кто путает направление искажения. Ирония предполагает употребление слова в противоположном смысле (похвала вместо насмешки), чего здесь нет. Метафора — перенос по сходству, а «тысяча раз» — не перенос значения, а преувеличение количества.","id":"g-19"},{"k":"mc","task":22,"les":"RU060","q":"Какое средство выразительности использовано: „Разве можно забыть свою первую встречу с морем?“?","o":[{"id":"а","t":"риторическое обращение"},{"id":"б","t":"риторический вопрос"},{"id":"в","t":"антитеза"},{"id":"г","t":"инверсия"}],"c":"б","e":"Вопрос не требует ответа, а утверждает мысль «забыть невозможно» — это риторический вопрос. Риторическое обращение выбирают, путая два «риторических» термина: обращение — это призыв к кому-либо («О море!»), а здесь адресата нет. Антитеза требует противопоставления понятий, которого нет. Инверсия — необычный порядок слов, а порядок слов в цитате нейтрален.","id":"g-20"},{"k":"mc","task":22,"les":"RU061","q":"Какое средство выразительности использовано: „За окном всю ночь бормотал дождь: кап-кап, кап-кап“?","o":[{"id":"а","t":"аллитерация"},{"id":"б","t":"ассонанс"},{"id":"в","t":"звукоподражание"},{"id":"г","t":"парцелляция"}],"c":"в","e":"«Кап-кап» прямо воспроизводит звук падающих капель — это звукоподражание. Аллитерацию выбирают, сводя всякую звукопись к повтору согласных, но здесь слово целиком имитирует реальный звук. Ассонанс ошибочен: выразительность создаётся не повтором гласных. Парцелляция — синтаксическое дробление предложения, к звукописи отношения не имеет.","id":"g-21"},{"k":"mc","task":23,"les":"RU013","q":"Какое утверждение соответствует содержанию текста?\n\n(1)Первые маяки были простыми кострами, которые разводили на возвышенных местах побережья. (2)Свет открытого огня был слабым и сильно зависел от погоды. (3)Позднее пламя стали окружать системой зеркал, усиливавших свет. (4)Наконец, изобретение ступенчатой линзы позволило собирать лучи в мощный направленный пучок. (5)Благодаря этому свет маяка стал виден за десятки километров.","o":[{"id":"а","t":"Первые маяки представляли собой сооружения из систем зеркал."},{"id":"б","t":"Ступенчатая линза позволила направлять свет маяка мощным пучком."},{"id":"в","t":"Свет костра на берегу был виден морякам за десятки километров."},{"id":"г","t":"Ступенчатая линза была изобретена раньше зеркальных систем."}],"c":"б","e":"Вариант «б» прямо подтверждается предложением 4. Вариант «а» — искажение хронологии: первые маяки были кострами (1), зеркала появились позднее (3). Вариант «в» — перенос детали: видимость за десятки километров относится к свету линзы (5), а свет костра назван слабым (2). Вариант «г» — нарушение последовательности событий: зеркала появились раньше линзы (3, 4).","id":"g-22"},{"k":"mc","task":23,"les":"RU013","q":"Какое утверждение НЕ соответствует содержанию текста?\n\n(1)Пчёлы сообщают сородичам о найденном корме с помощью особого «танца». (2)Направление движений указывает, куда лететь, а темп движений — как далеко находится корм. (3)Чем ближе цветущее поле, тем энергичнее движения разведчицы. (4)Таким образом, танец пчелы — это настоящий язык, передающий точную информацию.","o":[{"id":"а","t":"Танец пчелы передаёт сородичам сведения о найденном корме."},{"id":"б","t":"Темп танца указывает пчёлам направление полёта к корму."},{"id":"в","t":"Близкому корму соответствуют более энергичные движения пчелы."},{"id":"г","t":"Автор называет танец пчелы своеобразным языком."}],"c":"б","e":"Верен «б» как НЕ соответствующий: в тексте роли перепутаны местами — направление указывают направлением движений, а темп сообщает о расстоянии (2); это типовая ошибка подмены признака. «а» соответствует предложению 1, «в» — предложению 3, «г» — предложению 4, поэтому они не подходят под вопрос о несоответствии.","id":"g-23"},{"k":"mc","task":23,"les":"RU013","q":"Какое утверждение соответствует содержанию текста?\n\n(1)Долгое время бумагу делали из тряпья, и стоила она дорого. (2)Лишь в середине XIX века научились получать бумагу из древесины. (3)Новое сырьё оказалось дешёвым и практически неисчерпаемым. (4)Именно поэтому книги и газеты быстро превратились из предмета роскоши в обыденную вещь.","o":[{"id":"а","t":"Бумагу из древесины начали делать раньше, чем из тряпья."},{"id":"б","t":"Тряпичная бумага стоила дешевле древесной."},{"id":"в","t":"Удешевление бумаги сделало печатные издания общедоступными."},{"id":"г","t":"Несмотря на новое сырьё, книги остались предметом роскоши."}],"c":"в","e":"Вариант «в» передаёт причинно-следственную связь предложений 3 и 4. Вариант «а» — обратная хронология: сначала было тряпьё (1), древесина — с середины XIX века (2). Вариант «б» — перестановка признака: дорогой названа именно тряпичная бумага (1), дешёвым — древесное сырьё (3). Вариант «г» прямо противоречит предложению 4.","id":"g-24"},{"k":"mc","task":23,"les":"RU013","q":"Какое утверждение НЕ соответствует содержанию текста?\n\n(1)На больших глубинах океана царит полная темнота. (2)Многие обитатели глубин сами вырабатывают свет с помощью особых органов. (3)Одни используют свечение, чтобы приманивать добычу, другие — чтобы отпугивать хищников. (4)Кроме того, свет помогает глубоководным существам находить сородичей. (5)Так одно приспособление решает совершенно разные задачи.","o":[{"id":"а","t":"Солнечный свет не достигает больших океанских глубин."},{"id":"б","t":"Свечение помогает некоторым глубоководным существам отпугивать врагов."},{"id":"в","t":"Все глубоководные обитатели светятся только для приманивания добычи."},{"id":"г","t":"Свет используется глубоководными существами для поиска сородичей."}],"c":"в","e":"Верен «в» как НЕ соответствующий: это неправомерное обобщение — в тексте сказано «многие», а не «все» (2), и названы три разные функции свечения (3, 4), а не одна. «а» следует из предложения 1, «б» — из предложения 3, «г» — из предложения 4, то есть эти утверждения тексту соответствуют.","id":"g-25"},{"k":"mc","task":23,"les":"RU013","q":"Какое утверждение соответствует содержанию текста?\n\n(1)Акварель требует от художника быстроты и точности. (2)Краска ложится на влажную бумагу и мгновенно растекается. (3)Исправить неудачный мазок почти невозможно: красочный слой прозрачен, и любая правка заметна. (4)Поэтому акварелисты продумывают будущую работу до мельчайших деталей ещё до первого прикосновения кисти.","o":[{"id":"а","t":"Акварель позволяет многократно переписывать неудачные места."},{"id":"б","t":"Акварелисты обычно начинают работу без предварительного замысла."},{"id":"в","t":"Акварельную краску наносят только на полностью сухую бумагу."},{"id":"г","t":"Прозрачность красочного слоя мешает исправлять ошибки в акварели."}],"c":"г","e":"Вариант «г» прямо подтверждается предложением 3. Вариант «а» противоречит предложению 3 («исправить почти невозможно»). Вариант «б» противоречит предложению 4 — работа продумывается заранее. Вариант «в» — искажение детали: в тексте краска ложится на влажную бумагу (2), а не на сухую.","id":"g-26"},{"k":"mc","task":23,"les":"RU013","q":"Какое утверждение НЕ соответствует содержанию текста?\n\n(1)Первые пассажиры железных дорог относились к поездам с опаской. (2)Врачи всерьёз уверяли, что скорость свыше сорока километров в час опасна для человека. (3)Тем не менее удобство и дешевизна нового транспорта быстро победили страхи. (4)Уже через десятилетие поездка по железной дороге стала для многих привычным делом.","o":[{"id":"а","t":"Поначалу люди относились к железной дороге настороженно."},{"id":"б","t":"Опасения врачей подтвердились, и скорость поездов пришлось ограничить."},{"id":"в","t":"Удобство и дешевизна помогли железной дороге завоевать пассажиров."},{"id":"г","t":"Со временем поездки по железной дороге стали привычными."}],"c":"б","e":"Верен «б» как НЕ соответствующий: в тексте нет сведений об ограничении скорости, а логика текста обратная — страхи были побеждены (3); это типовая ошибка домысливания информации, отсутствующей в тексте. «а» соответствует предложению 1, «в» — предложению 3, «г» — предложению 4.","id":"g-27"},{"k":"mc","task":23,"les":"RU013","q":"Какое утверждение соответствует содержанию текста?\n\n(1)Коралловый риф часто принимают за причудливую подводную скалу. (2)На самом деле риф создают крошечные живые организмы — коралловые полипы. (3)Каждый полип строит вокруг себя известковый «домик». (4)Из миллионов таких «домиков» за века и вырастает риф. (5)Поэтому рифы называют самыми большими сооружениями, созданными живыми существами.","o":[{"id":"а","t":"Коралловый риф — горная порода вулканического происхождения."},{"id":"б","t":"Риф складывается из известковых построек множества полипов."},{"id":"в","t":"Коралловые полипы возводят риф всего за несколько лет."},{"id":"г","t":"Рифы создаются крупными морскими животными."}],"c":"б","e":"Вариант «б» обобщает предложения 3 и 4. Вариант «а» — типовая ошибка: за истину принято бытовое заблуждение, которое текст как раз опровергает (1, 2). Вариант «в» искажает срок: риф растёт века (4), а не несколько лет. Вариант «г» противоречит предложению 2 — полипы названы крошечными.","id":"g-28"},{"k":"mc","task":23,"les":"RU013","q":"Какое утверждение НЕ соответствует содержанию текста?\n\n(1)Первые воздушные шары наполняли горячим дымом от костра. (2)Изобретатели считали, что подъёмную силу создаёт особый «электрический дым». (3)В действительности шар поднимал обычный нагретый воздух, который легче холодного. (4)Ошибочная теория не помешала успешным полётам: шары исправно взлетали.","o":[{"id":"а","t":"Первые воздушные шары наполняли дымом от костра."},{"id":"б","t":"Подъёмную силу шару давал нагретый воздух, более лёгкий, чем холодный."},{"id":"в","t":"Неверное объяснение подъёмной силы делало полёты невозможными."},{"id":"г","t":"Создатели первых шаров неправильно объясняли причину их подъёма."}],"c":"в","e":"Верен «в» как НЕ соответствующий: он прямо противоречит предложению 4 — ошибочная теория полётам не помешала; типовая ошибка — считать, что неверная теория обязательно ведёт к неудаче на практике. «а» соответствует предложению 1, «б» — предложению 3, «г» — предложениям 2 и 3.","id":"g-29"},{"k":"mc","task":23,"les":"RU013","q":"Какое утверждение соответствует содержанию текста?\n\n(1)Листья, собранные с одного чайного куста, могут превратиться в совершенно разные напитки. (2)Зелёный чай получают, быстро высушивая свежие листья. (3)Для чёрного чая листья, наоборот, долго выдерживают, позволяя им окислиться. (4)Таким образом, цвет и вкус чая зависят прежде всего от способа обработки листа.","o":[{"id":"а","t":"Зелёный и чёрный чай собирают с разных видов чайных кустов."},{"id":"б","t":"Листья для чёрного чая сушат быстрее, чем для зелёного."},{"id":"в","t":"Зелёный и чёрный чай можно изготовить из листьев одного растения."},{"id":"г","t":"Вкус чая зависит исключительно от места произрастания куста."}],"c":"в","e":"Вариант «в» прямо следует из предложения 1. Вариант «а» — распространённое заблуждение, которое текст опровергает первым же предложением. Вариант «б» переставляет признаки: быстро сушат листья для зелёного чая (2), а для чёрного — долго выдерживают (3). Вариант «г» подменяет вывод текста: главным названо не место произрастания, а способ обработки (4).","id":"g-30"},{"k":"mc","task":23,"les":"RU013","q":"Какое утверждение НЕ соответствует содержанию текста?\n\n(1)Ледники — это огромные запасы пресной воды. (2)Медленно двигаясь, ледник перепахивает долины и переносит камни на сотни километров. (3)Многие озёрные котловины на севере Европы выпаханы именно древними ледниками. (4)Так медленная «река льда» веками меняет облик целых материков.","o":[{"id":"а","t":"Ледники хранят огромные запасы солёной морской воды."},{"id":"б","t":"Двигаясь, ледник способен переносить камни на большие расстояния."},{"id":"в","t":"Часть озёрных котловин на севере Европы создана древними ледниками."},{"id":"г","t":"Ледники постепенно изменяют облик земной поверхности."}],"c":"а","e":"Верен «а» как НЕ соответствующий: в тексте ледники названы запасами пресной, а не солёной воды (1); типовая ошибка — подмена ключевого признака при внешнем сходстве формулировки. «б» соответствует предложению 2, «в» — предложению 3, «г» — предложению 4.","id":"g-31"},{"k":"mc","task":24,"les":"RU014","q":"Какой тип речи представлен в предложениях 1—4?\n\n(1)Утренний лес стоял тихий и торжественный. (2)Стволы сосен отливали медью, а на хвое дрожали капли росы. (3)Между деревьями плыли полосы прозрачного тумана. (4)Пахло смолой и влажной землёй.","o":[{"id":"а","t":"повествование"},{"id":"б","t":"рассуждение"},{"id":"в","t":"описание"},{"id":"г","t":"повествование с элементами рассуждения"}],"c":"в","e":"Текст рисует одновременные признаки одной картины (цвет стволов, роса, туман, запахи) — это описание: к нему можно задать вопрос «каков лес?». Повествование выбирают, приняв глаголы «стоял», «плыли» за смену событий, но события друг друга не сменяют. Рассуждение требует тезиса и аргументов, которых нет. Вариант «г» неверен вдвойне: нет ни цепочки событий, ни элементов доказательства.","id":"g-32"},{"k":"mc","task":24,"les":"RU014","q":"Какой тип речи представлен в предложениях 1—4?\n\n(1)Путник вышел из деревни на рассвете. (2)К полудню он миновал сосновый бор и спустился к реке. (3)Внезапно небо потемнело, и хлынул ливень. (4)Пришлось пережидать непогоду под старой елью.","o":[{"id":"а","t":"описание"},{"id":"б","t":"повествование"},{"id":"в","t":"рассуждение"},{"id":"г","t":"описание с элементами рассуждения"}],"c":"б","e":"События последовательно сменяют друг друга (вышел — миновал — хлынул ливень — пережидал), текст отвечает на вопрос «что произошло?» — это повествование. Описание выбирают из-за упоминания природы, но её признаки не разворачиваются, а события движутся во времени. Рассуждение требует тезиса и доказательств, их нет. В варианте «г» нет ни статичной картины, ни доказательства.","id":"g-33"},{"k":"mc","task":24,"les":"RU014","q":"Какой тип речи представлен в предложениях 1—4?\n\n(1)Почему полезно читать медленно? (2)Торопливый читатель скользит по строчкам и упускает оттенки смысла. (3)Медленное чтение, напротив, позволяет заметить детали и обдумать мысль автора. (4)Значит, неспешность — не потеря времени, а условие глубокого понимания книги.","o":[{"id":"а","t":"повествование"},{"id":"б","t":"описание"},{"id":"в","t":"рассуждение"},{"id":"г","t":"повествование с элементами описания"}],"c":"в","e":"Текст построен по схеме рассуждения: вопрос-тезис (1), аргументы (2, 3) и вывод со словом «значит» (4). Повествование ошибочно: нет сменяющих друг друга событий. Описание ошибочно: не изображаются признаки предмета или картины. Вариант «г» не подходит, поскольку в тексте нет ни событийной цепочки, ни статичных зарисовок — только доказательство мысли.","id":"g-34"},{"k":"mc","task":24,"les":"RU014","q":"Как связаны по смыслу предложения 1 и 2?\n\n(1)Осенью перелётные птицы покидают северные леса. (2)С холодами исчезают насекомые — их основной корм. (3)Стаи из года в год движутся по одним и тем же маршрутам. (4)Весной птицы вновь возвращаются к местам гнездования.","o":[{"id":"а","t":"предложение 2 указывает причину того, о чём говорится в предложении 1"},{"id":"б","t":"предложение 2 содержит следствие того, о чём говорится в предложении 1"},{"id":"в","t":"предложение 2 противопоставлено по смыслу предложению 1"},{"id":"г","t":"предложение 2 приводит пример к сказанному в предложении 1"}],"c":"а","e":"Исчезновение корма объясняет, почему птицы улетают, — предложение 2 называет причину. Вариант «б» путает направление связи: следствием был бы отлёт из-за голода, а не наоборот. Вариант «в» ошибочен: между предложениями нет контраста. Вариант «г» ошибочен: исчезновение насекомых — не частный пример отлёта птиц, а его объяснение.","id":"g-35"},{"k":"mc","task":24,"les":"RU014","q":"Как связаны по смыслу предложения 1 и 2?\n\n(1)Ночью в горах прошёл сильный ливень. (2)К утру тропы размокли и стали непроходимыми. (3)Группе пришлось остаться в лагере ещё на день. (4)Только к вечеру солнце подсушило склоны.","o":[{"id":"а","t":"предложение 2 поясняет содержание предложения 1"},{"id":"б","t":"предложение 2 противопоставлено предложению 1"},{"id":"в","t":"предложение 2 содержит следствие того, о чём говорится в предложении 1"},{"id":"г","t":"предложение 2 указывает причину того, о чём говорится в предложении 1"}],"c":"в","e":"Размокшие тропы — результат ливня: предложение 2 содержит следствие. Вариант «г» путает направление причинно-следственной связи: причина (ливень) названа в первом предложении, а не во втором. Вариант «а» ошибочен: второе предложение не переформулирует первое, а сообщает новое событие-результат. Вариант «б» ошибочен: контраста между предложениями нет.","id":"g-36"},{"k":"mc","task":24,"les":"RU014","q":"Как связаны по смыслу предложения 1 и 2?\n\n(1)Старший из братьев рос молчаливым и осторожным. (2)Младший же был шумным и решительным. (3)Несмотря на разницу характеров, братья всюду были вместе. (4)С годами их дружба только окрепла.","o":[{"id":"а","t":"предложение 2 содержит следствие того, о чём говорится в предложении 1"},{"id":"б","t":"предложение 2 противопоставлено по смыслу предложению 1"},{"id":"в","t":"предложение 2 поясняет содержание предложения 1"},{"id":"г","t":"предложение 2 приводит пример к предложению 1"}],"c":"б","e":"Характеры братьев контрастны (молчаливый и осторожный — шумный и решительный), контраст подчёркнут частицей «же»: предложение 2 противопоставлено первому. Вариант «а» ошибочен: характер младшего не вытекает из характера старшего. Вариант «в» ошибочен: второе предложение говорит о другом человеке, а не раскрывает первое. Вариант «г» ошибочен: это не иллюстрация общего положения, а сопоставление двух разных лиц.","id":"g-37"},{"k":"mc","task":24,"les":"RU014","q":"Как связаны по смыслу предложения 1 и 2?\n\n(1)Некоторые растения приспособились ловить насекомых. (2)Так, росянка удерживает добычу блестящими клейкими капельками на листьях. (3)Пойманное насекомое растение постепенно переваривает. (4)Эти вещества восполняют недостаток питания на бедных почвах.","o":[{"id":"а","t":"предложение 2 противопоставлено предложению 1"},{"id":"б","t":"предложение 2 содержит следствие того, о чём говорится в предложении 1"},{"id":"в","t":"предложение 2 иллюстрирует примером сказанное в предложении 1"},{"id":"г","t":"предложение 2 указывает причину того, о чём говорится в предложении 1"}],"c":"в","e":"Первое предложение содержит общее утверждение, второе вводит конкретный пример (показатель — слово «так»): росянка иллюстрирует тезис. Вариант «а» ошибочен: контраста нет, пример подтверждает тезис. Вариант «б» ошибочен: поведение росянки не результат общего утверждения, а его частный случай. Вариант «г» ошибочен: пример ничего не объясняет причинно, он лишь конкретизирует.","id":"g-38"},{"k":"mc","task":24,"les":"RU014","q":"Какой тип речи представлен в предложениях 1—4?\n\n(1)На каминной полке стояли старинные часы в дубовом корпусе. (2)Их циферблат был расписан выцветшими голубыми цветами. (3)Тонкие стрелки заканчивались изящными завитками. (4)Внизу тускло поблёскивал тяжёлый бронзовый маятник.","o":[{"id":"а","t":"описание"},{"id":"б","t":"повествование"},{"id":"в","t":"рассуждение"},{"id":"г","t":"рассуждение с элементами повествования"}],"c":"а","e":"Перечислены одновременные признаки одного предмета (корпус, циферблат, стрелки, маятник) — это описание, «фотография» часов. Повествование выбирают по привычке видеть в глаголах события, но «стояли», «поблёскивал» передают состояние, а не смену действий. Рассуждение требует тезиса и аргументации — их нет. Вариант «г» неверен: в тексте нет ни доказательства, ни цепочки событий.","id":"g-39"},{"k":"mc","task":24,"les":"RU014","q":"Какой тип речи представлен в предложениях 1—4?\n\n(1)Отчего снег кажется нам белым, хотя каждая снежинка прозрачна? (2)Лучи света многократно отражаются от бесчисленных граней ледяных кристаллов. (3)Отражённый свет смешивается и рассеивается во все стороны. (4)Поэтому глаз воспринимает снежный покров как ослепительно белый.","o":[{"id":"а","t":"повествование"},{"id":"б","t":"описание"},{"id":"в","t":"рассуждение"},{"id":"г","t":"описание с элементами повествования"}],"c":"в","e":"Текст отвечает на вопрос «почему?»: вопрос (1), объяснение (2, 3) и вывод с «поэтому» (4) — классическое рассуждение-объяснение. Повествование ошибочно: отражение лучей — не события сюжета, а звенья объяснения. Описание ошибочно: признаки снега не перечисляются ради картины, а служат доказательству. Вариант «г» неверен: нет ни зарисовки, ни рассказа о событиях.","id":"g-40"},{"k":"mc","task":24,"les":"RU014","q":"Какой тип речи представлен в предложениях 1—5?\n\n(1)Ранним утром мальчишки вынесли на луг самодельного воздушного змея. (2)Первый порыв ветра вырвал его из рук и швырнул в траву. (3)Со второй попытки змей нехотя пополз вверх. (4)Потом верёвка натянулась, и он рванулся к облакам. (5)Через минуту в небе плясала крошечная яркая точка.","o":[{"id":"а","t":"рассуждение"},{"id":"б","t":"описание"},{"id":"в","t":"повествование с элементами описания"},{"id":"г","t":"рассуждение с элементами описания"}],"c":"в","e":"Основа текста — цепочка сменяющих друг друга событий (вынесли — вырвал — пополз — рванулся), то есть повествование, а «крошечная яркая точка» в небе добавляет описательный штрих. Чистое описание ошибочно: события движутся во времени, картина не статична. Рассуждение и вариант «г» ошибочны: в тексте нет тезиса, доказательства и вывода — никто ничего не обосновывает.","id":"g-41"},{"k":"mc","task":25,"les":"RU015","q":"В каком предложении текста использован фразеологизм?\n\n(1)Экспедиция готовилась к выходу на маршрут. (2)Снаряжение проверяли несколько раз. (3)Проводник знал эти горы как свои пять пальцев. (4)На рассвете группа покинула лагерь.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"c":"в","e":"В предложении 3 употреблён фразеологизм «знать как свои пять пальцев» — устойчивое неделимое сочетание со значением «знать очень хорошо». В предложении 2 сочетание «несколько раз» свободное, каждое слово сохраняет своё значение — его ошибочно принимают за устойчивое из-за частотности. В предложениях 1 и 4 все слова употреблены в прямых значениях, устойчивых оборотов нет.","id":"g-42"},{"k":"mc","task":25,"les":"RU015","q":"В каком предложении текста использованы антонимы?\n\n(1)В картинной галерее всегда стоит особая тишина. (2)Огромные полотна соседствуют здесь с крошечными этюдами. (3)Посетители подолгу задерживаются у любимых картин. (4)Смотрители внимательно следят за порядком.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"c":"б","e":"В предложении 2 противопоставлены антонимы «огромные — крошечные». В предложении 3 «подолгу» иногда ошибочно ищут пару, но второго слова с противоположным значением там нет. В предложениях 1 и 4 слова не образуют противоположных пар; «тишина» и «порядок» — не антонимы, а просто слова разной семантики, их сближают по ложной ассоциации «контраста обстановки».","id":"g-43"},{"k":"mc","task":25,"les":"RU015","q":"В каком предложении текста использованы синонимы?\n\n(1)Полярники месяцами жили среди льдов. (2)Работа требовала смелых, отважных людей. (3)Любой выход из дома мог обернуться встречей с белым медведем. (4)Однако наблюдения не прекращались ни на день.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"c":"б","e":"В предложении 2 рядом стоят синонимы «смелых, отважных» — слова одной части речи с близким значением, усиливающие друг друга. В предложении 1 «месяцами» и «среди льдов» не синонимичны — их выбирают по ошибке, приняв однородность впечатления за близость значений. В предложениях 3 и 4 пар близких по значению слов нет: «выход» и «встреча», «наблюдения» и «день» семантически различны.","id":"g-44"},{"k":"mc","task":25,"les":"RU015","q":"В каком предложении текста использованы устаревшие слова?\n\n(1)Дед любил рассказывать нам сказки собственного сочинения. (2)«Не кручинься, добрый молодец», — молвил в них старый волшебник. (3)Мы слушали, забыв обо всём на свете. (4)Эти зимние вечера запомнились мне на всю жизнь.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"c":"б","e":"В предложении 2 употреблены устаревшие слова «кручинься» (печалься) и «молвил» (сказал), характерные для языка сказок. Предложение 1 выбирают из-за слова «дед», но оно современное и общеупотребительное — возраст персонажа не делает слово устаревшим. В предложениях 3 и 4 вся лексика современная; «на всю жизнь» — обычное сочетание, а не архаизм.","id":"g-45"},{"k":"mc","task":25,"les":"RU015","q":"В каком предложении текста использована разговорная лексика?\n\n(1)К вечеру небо затянуло тяжёлыми тучами. (2)Ребятня мигом попряталась по домам. (3)Начался сильный дождь с порывистым ветром. (4)Через час небо снова прояснилось.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"c":"б","e":"В предложении 2 сразу несколько разговорных слов: «ребятня», «мигом», «попряталась». Предложение 3 выбирают, считая разговорным всё эмоционально насыщенное, но «сильный дождь», «порывистый ветер» — нейтральные книжно-общеупотребительные сочетания. В предложениях 1 и 4 лексика также стилистически нейтральна: «затянуло», «прояснилось» — обычные общеупотребительные глаголы.","id":"g-46"},{"k":"mc","task":25,"les":"RU015","q":"В каком предложении текста использованы антонимы?\n\n(1)Спор о новой книге разгорелся нешуточный. (2)Одни критики хвалили автора, другие беспощадно ругали. (3)Читатели тем временем быстро раскупали тираж. (4)Через месяц издательству пришлось печатать книгу заново.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"c":"б","e":"В предложении 2 антонимы «хвалили — ругали» передают противоположные оценки. Предложение 1 выбирают из-за слова «спор», но само упоминание разногласий — не антонимия: нужны именно пары слов с противоположным значением. В предложениях 3 и 4 противоположных по значению слов нет; «раскупали» и «печатать» связаны по смыслу ситуации, но не являются антонимами.","id":"g-48"},{"k":"mc","task":25,"les":"RU015","q":"В каком предложении текста использованы синонимы?\n\n(1)Метель бушевала всю ночь напролёт. (2)К утру дорогу замело, занесло снегом по самые заборы. (3)Деревня будто погрузилась в глубокий сон. (4)Лишь дым из печных труб напоминал о жизни.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"c":"б","e":"В предложении 2 употреблены синонимы «замело — занесло», усиливающие картину снежных заносов. Предложение 1 выбирают из-за выразительного глагола «бушевала», но одно яркое слово синонимического ряда в тексте не образует. В предложении 3 «погрузилась в сон» — метафора, её ошибочно принимают за лексический повтор значения. В предложении 4 близких по значению слов нет.","id":"g-49"},{"k":"mc","task":25,"les":"RU015","q":"В каком предложении текста использовано устаревшее слово?\n\n(1)Путешественник подробно описывал свой путь в дневнике. (2)До ближайшего города оставалось ещё тридцать вёрст. (3)Лошади устали, и путники остановились на ночлег у реки. (4)Утром дорога повела их через густой лес.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"c":"б","e":"В предложении 2 употреблено устаревшее слово «верста» — старинная мера длины, вышедшая из активного употребления. Предложение 3 выбирают из-за слов «лошади» и «ночлег», но обе лексемы современные и общеупотребительные: упоминание старинного быта не делает слово устаревшим. В предложениях 1 и 4 вся лексика современная («дневник», «дорога» относятся к активному словарю).","id":"g-50"},{"k":"mc","task":25,"les":"RU015","q":"В каком предложении текста использована разговорная лексика?\n\n(1)В воскресенье в парке проходил городской велопробег. (2)Зрители дружно подбадривали участников. (3)Какой-то малыш вопил от восторга громче всех. (4)Победителя встречали продолжительными аплодисментами.","o":[{"id":"а","t":"1"},{"id":"б","t":"2"},{"id":"в","t":"3"},{"id":"г","t":"4"}],"c":"в","e":"В предложении 3 разговорные слова «малыш» и особенно «вопил» (сниженный синоним нейтрального «кричал»). Предложение 2 выбирают из-за «дружно подбадривали», но оба слова стилистически нейтральны — эмоциональность содержания не равна разговорности лексики. В предложениях 1 и 4 употреблена нейтральная и книжная лексика («велопробег», «продолжительными аплодисментами»), сниженных слов нет.","id":"g-51"},{"k":"match","task":8,"les":null,"q":"Установите соответствие между грамматическими ошибками и предложениями: к каждой позиции первого столбца подберите позицию из второго.","left":[{"id":"А","t":"нарушение связи между подлежащим и сказуемым"},{"id":"Б","t":"ошибка в построении предложения с однородными членами"},{"id":"В","t":"ошибка в построении предложения с деепричастным оборотом"},{"id":"Г","t":"неправильное употребление падежной формы существительного с предлогом"},{"id":"Д","t":"нарушение в построении предложения с несогласованным приложением"}],"right":[{"id":"1","t":"В газете «Вечернем городе» опубликовали репортаж о фестивале."},{"id":"2","t":"В саду пахло яблоками и свежескошенной травой."},{"id":"3","t":"Осенний лес стоял тихий и прозрачный."},{"id":"4","t":"Мы долго гуляли по набережной и любовались закатом."},{"id":"5","t":"Подъезжая к станции, у меня слетела шляпа."},{"id":"6","t":"Все, кто побывал на выставке, остался под сильным впечатлением."},{"id":"7","t":"Вечером вся семья собралась за большим столом."},{"id":"8","t":"Я люблю и горжусь своей школой."},{"id":"9","t":"По приезду в город мы сразу отправились в гостиницу."}],"map":{"А":"6","Б":"8","В":"5","Г":"9","Д":"1"},"e":"А—6: при подлежащем «все» сказуемое должно стоять во множественном числе: все… остались. Б—8: однородные сказуемые «люблю» и «горжусь» требуют разных падежей дополнения: люблю школу и горжусь ею. В—5: действие деепричастия не относится к подлежащему: шляпа не подъезжала к станции. Г—9: предлог «по» в значении «после» требует предложного падежа: по приезде. Д—1: при родовом слове «газета» название ставится в именительном падеже: в газете «Вечерний город».","id":"h-0"},{"k":"match","task":8,"les":null,"q":"Установите соответствие между грамматическими ошибками и предложениями: к каждой позиции первого столбца подберите позицию из второго.","left":[{"id":"А","t":"нарушение в построении предложения с несогласованным приложением"},{"id":"Б","t":"ошибка в построении предложения с деепричастным оборотом"},{"id":"В","t":"неправильное употребление падежной формы существительного с предлогом"},{"id":"Г","t":"ошибка в построении предложения с однородными членами"},{"id":"Д","t":"ошибка в видовременной соотнесённости глагольных форм"}],"right":[{"id":"1","t":"Читая эту книгу, возникает ощущение полёта."},{"id":"2","t":"Когда взошло солнце, туман над рекой рассеялся."},{"id":"3","t":"На встрече говорили не только о музыке, но и живописи."},{"id":"4","t":"Статья о редких птицах вышла в журнале «Природе»."},{"id":"5","t":"Согласно приказа директора занятия перенесли на среду."},{"id":"6","t":"Он внимательно слушал лекцию и записывает главное."},{"id":"7","t":"Зимой в деревне темнеет рано."},{"id":"8","t":"Врач посоветовал пациенту больше гулять на свежем воздухе."},{"id":"9","t":"Согласно расписанию поезд прибывает в полдень."}],"map":{"А":"4","Б":"1","В":"5","Г":"3","Д":"6"},"e":"А—4: при родовом слове название не склоняется: в журнале «Природа». Б—1: деепричастный оборот нельзя употреблять в безличном предложении: читая книгу, я ощущаю полёт. В—5: предлог «согласно» требует дательного падежа: согласно приказу. Г—3: при однородных членах пропущен предлог: не только о музыке, но и о живописи. Д—6: сказуемые «слушал» и «записывает» стоят в разных временах без основания.","id":"h-2"},{"k":"match","task":8,"les":null,"q":"Установите соответствие между грамматическими ошибками и предложениями: к каждой позиции первого столбца подберите позицию из второго.","left":[{"id":"А","t":"нарушение в построении предложения с косвенной речью"},{"id":"Б","t":"нарушение в построении сложного предложения"},{"id":"В","t":"нарушение связи между подлежащим и сказуемым"},{"id":"Г","t":"нарушение в построении предложения с причастным оборотом"},{"id":"Д","t":"ошибка в построении предложения с деепричастным оборотом"}],"right":[{"id":"1","t":"Сестра спросила, что долго ли я пробуду в отъезде."},{"id":"2","t":"В журнале «Родник» напечатали рассказ начинающего писателя."},{"id":"3","t":"Никто из туристов не были готовы к резкому похолоданию."},{"id":"4","t":"Окончив школу, нас направили на практику в лабораторию."},{"id":"5","t":"Написанный роман молодым автором сразу заметили критики."},{"id":"6","t":"Мама спросила, куда мы собираемся в выходные."},{"id":"7","t":"Комната, в которую мы вошли в неё, была залита солнцем."},{"id":"8","t":"Ребята быстро собрали палатку и развели костёр."},{"id":"9","t":"Все участники олимпиады получили памятные дипломы."}],"map":{"А":"1","Б":"7","В":"3","Г":"5","Д":"4"},"e":"А—1: при частице «ли» союз «что» лишний: спросила, долго ли я пробуду. Б—7: лишнее местоимение дублирует союзное слово: комната, в которую мы вошли. В—3: при подлежащем «никто» сказуемое ставится в единственном числе: никто не был готов. Г—5: причастный оборот разорван определяемым словом: роман, написанный молодым автором. Д—4: действие деепричастия должно относиться к подлежащему: окончив школу, мы отправились на практику.","id":"h-3"},{"k":"match","task":8,"les":null,"q":"Установите соответствие между грамматическими ошибками и предложениями: к каждой позиции первого столбца подберите позицию из второго.","left":[{"id":"А","t":"неправильное употребление падежной формы существительного с предлогом"},{"id":"Б","t":"ошибка в видовременной соотнесённости глагольных форм"},{"id":"В","t":"нарушение в построении предложения с несогласованным приложением"},{"id":"Г","t":"нарушение в построении предложения с косвенной речью"},{"id":"Д","t":"ошибка в построении предложения с однородными членами"}],"right":[{"id":"1","t":"На теплоходе «Метеоре» мы добрались до острова за час."},{"id":"2","t":"Мы приехали в лагерь и сразу пошли знакомиться с вожатыми."},{"id":"3","t":"Благодаря упорства он добился заметных успехов."},{"id":"4","t":"Собака бежала рядом и весело виляет хвостом."},{"id":"5","t":"Тропинка, петлявшая между сосен, вывела нас к озеру."},{"id":"6","t":"Он открыл окно, и комната наполнилась свежестью."},{"id":"7","t":"Каждый из нас понимал важность предстоящего дела."},{"id":"8","t":"Тренер сказал спортсменам, что выходите на разминку."},{"id":"9","t":"В корзине лежали фрукты, овощи, яблоки и груши."}],"map":{"А":"3","Б":"4","В":"1","Г":"8","Д":"9"},"e":"А—3: предлог «благодаря» требует дательного падежа: благодаря упорству. Б—4: сказуемые «бежала» и «виляет» не соотнесены по времени. В—1: название при родовом слове должно стоять в именительном падеже: на теплоходе «Метеор». Г—8: повелительное наклонение в косвенной речи недопустимо: сказал, чтобы спортсмены выходили на разминку. Д—9: родовое понятие («фрукты») нельзя ставить в один ряд с видовыми («яблоки», «груши»).","id":"h-4"},{"k":"match","task":8,"les":null,"q":"Установите соответствие между грамматическими ошибками и предложениями: к каждой позиции первого столбца подберите позицию из второго.","left":[{"id":"А","t":"ошибка в построении предложения с деепричастным оборотом"},{"id":"Б","t":"нарушение связи между подлежащим и сказуемым"},{"id":"В","t":"нарушение в построении предложения с причастным оборотом"},{"id":"Г","t":"нарушение в построении сложного предложения"},{"id":"Д","t":"неправильное употребление падежной формы существительного с предлогом"}],"right":[{"id":"1","t":"Все, кто читал эту повесть, отмечает точность деталей."},{"id":"2","t":"Ребята, увлекающимся астрономией, организовали в школе кружок."},{"id":"3","t":"Автор убеждает нас в том, что будто доброта сильнее силы."},{"id":"4","t":"По окончании концерта артисты вышли на поклон."},{"id":"5","t":"Читая старые письма, я вспоминал детство."},{"id":"6","t":"Готовясь к экзамену, у сестры не оставалось свободного времени."},{"id":"7","t":"Те, кто любит утренние прогулки, знают цену тишине."},{"id":"8","t":"Капитан сообщил, что судно выйдет в море на рассвете."},{"id":"9","t":"По окончанию школы она поступила в медицинский институт."}],"map":{"А":"6","Б":"1","В":"2","Г":"3","Д":"9"},"e":"А—6: в безличном предложении деепричастный оборот недопустим: готовясь к экзамену, сестра не имела свободного времени. Б—1: «все» требует сказуемого во множественном числе: все… отмечают. В—2: причастие не согласовано с определяемым словом: ребята, увлекающиеся астрономией. Г—3: нельзя совмещать союзы «что» и «будто». Д—9: правильно: по окончании школы (предложный падеж).","id":"h-5"},{"k":"match","task":8,"les":null,"q":"Установите соответствие между грамматическими ошибками и предложениями: к каждой позиции первого столбца подберите позицию из второго.","left":[{"id":"А","t":"ошибка в построении предложения с однородными членами"},{"id":"Б","t":"нарушение в построении предложения с несогласованным приложением"},{"id":"В","t":"нарушение в построении предложения с косвенной речью"},{"id":"Г","t":"ошибка в видовременной соотнесённости глагольных форм"},{"id":"Д","t":"нарушение в построении предложения с причастным оборотом"}],"right":[{"id":"1","t":"Согласно расписанию поезд прибывает в полдень."},{"id":"2","t":"Возвращаясь домой, мы обсуждали увиденный спектакль."},{"id":"3","t":"Врач спросил больного, что как вы себя чувствуете."},{"id":"4","t":"Мы долго гуляли по набережной и любовались закатом."},{"id":"5","t":"Зрители смотрели и восхищались игрой актёров."},{"id":"6","t":"Тропинка, петлявшая между сосен, вывела нас к озеру."},{"id":"7","t":"Мы долго готовились к концерту и выступаем без единой ошибки."},{"id":"8","t":"Одному из героев повести, ищущим правду, автор явно симпатизирует."},{"id":"9","t":"В повести «Первом снеге» рассказывается о деревенском детстве."}],"map":{"А":"5","Б":"9","В":"3","Г":"7","Д":"8"},"e":"А—5: «смотрели» и «восхищались» требуют разного управления: смотрели на игру и восхищались ею. Б—9: при родовом слове «повесть» название не склоняется: в повести «Первый снег». В—3: смешение прямой и косвенной речи: спросил, как он себя чувствует. Г—7: сказуемые «готовились» и «выступаем» стоят в разных временах без основания. Д—8: причастие не согласовано с определяемым словом: одному из героев, ищущему правду.","id":"h-6"},{"k":"match","task":8,"les":null,"q":"Установите соответствие между грамматическими ошибками и предложениями: к каждой позиции первого столбца подберите позицию из второго.","left":[{"id":"А","t":"нарушение в построении сложного предложения"},{"id":"Б","t":"неправильное употребление падежной формы существительного с предлогом"},{"id":"В","t":"ошибка в построении предложения с деепричастным оборотом"},{"id":"Г","t":"нарушение связи между подлежащим и сказуемым"},{"id":"Д","t":"нарушение в построении предложения с косвенной речью"}],"right":[{"id":"1","t":"Он открыл окно, и комната наполнилась свежестью."},{"id":"2","t":"Брат сказал, что я вернусь поздно, и попросил не ждать его."},{"id":"3","t":"Все участники олимпиады получили памятные дипломы."},{"id":"4","t":"Успех зависел от того, что насколько слаженно сыграет команда."},{"id":"5","t":"Те, кто опоздали к началу спектакля, ждали антракта в фойе."},{"id":"6","t":"В саду пахло яблоками и свежескошенной травой."},{"id":"7","t":"Слушая ночной дождь, настроение становится спокойным."},{"id":"8","t":"Книга, подаренная дедушкой, стала моей любимой."},{"id":"9","t":"Вопреки прогноза день выдался ясным и тёплым."}],"map":{"А":"4","Б":"9", он."},{"id":"5","t":"Те, кто любит утренние прогулки, знают цену тишине."},{"id":"6","t":"Капитан сообщил, что судно выйдет в море на рассвете."},{"id":"7","t":"Поднявшись на смотровую площадку, город виден как на ладони."},{"id":"8","t":"Бабушка достала альбом и показывает нам старые фотографии."},{"id":"9","t":"Детвора с самого утра резвились во дворе."}],"map":{"А":"7","Б":"3","В":"8","Г":"9","Д":"2"},"e":"А—7: деепричастный оборот невозможен в этой конструкции: поднявшись на площадку, мы увидели город как на ладони. Б—3: форма первого лица в косвенной речи недопустима: ответил, что не знает этой улицы. В—8: глаголы «достала» и «показывает» не соотнесены по времени. Г—9: существительное «детвора» стоит в единственном числе: детвора резвилась. Д—2: «гордимся» и «любим» требуют разных падежей дополнения: гордимся городом и любим его.","id":"h-11"},{"k":"match","task":26,"les":null,"q":"Прочитай фрагмент рецензии. Установи соответствие: к каждому пропуску (А—Д) подбери термин из списка.\n\nРассказывая о сельском учителе, автор передаёт обаяние его речи с помощью такого средства, как (А) («бархатный голос»). Мир вокруг героя оживает — этому служит (Б) («старый дом вздыхает по ночам»). Зимнюю картину делает зримой (В) («снег лежал на крышах, словно пуховое одеяло»). Взволнованность авторской интонации передаёт (Г) («Разве можно разлюбить родные места?»), а народный колорит вносит (Д) («работали засучив рукава»).","left":[{"id":"А","t":"пропуск А (цитата: «бархатный голос»)"},{"id":"Б","t":"пропуск Б (цитата: «старый дом вздыхает по ночам»)"},{"id":"В","t":"пропуск В (цитата: «снег лежал на крышах, словно пуховое одеяло»)"},{"id":"Г","t":"пропуск Г (цитата: «Разве можно разлюбить родные места?»)"},{"id":"Д","t":"пропуск Д (цитата: «работали засучив рукава»)"}],"right":[{"id":"1","t":"гипербола"},{"id":"2","t":"антитеза"},{"id":"3","t":"фразеологизм"},{"id":"4","t":"олицетворение"},{"id":"5","t":"сравнение"},{"id":"6","t":"риторический вопрос"},{"id":"7","t":"анафора"},
