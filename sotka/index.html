ируйте второе основание.","Проверяйте, что все выбранные номера удовлетворяют формулировке задания."]}]},{"h":"Разбор","items":[{"t":"ex","items":["«Знание — сила» и «Чтение — мой отдых» объединены нулевой связкой между подлежащим и именным сказуемым.","«Я читаю прозу, а брат — стихи» к ним не относится: тире обозначает пропуск глагола.","«Пошёл дождь — мы вернулись» — бессоюзное сложное с результативным отношением."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Сравнивать только соседние слова","Объединять все сложные предложения","Считать любой знак перед существительным тире между главными членами","Пропускать авторскую речь и цитирование"]}]}]},{"id":"RU059","title":"Тропы: перенос значения и художественный образ","mod":"M07","tasks":[22,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Троп строится на образном употреблении слова или выражения. В задании нужно установить механизм, а не просто отметить, что фраза красивая. Один фрагмент может содержать несколько средств; выбор делают с учётом выделения и предложенного списка терминов."},{"t":"p","s":"Эпитет — образное или эмоционально выразительное определение: «тревожная тишина», «упрямый ветер». Не всякое прилагательное — эпитет: «деревянный стол» в нейтральном описании материала не создаёт образной оценки. Эпитет может выражаться не только прилагательным: важна функция определения и выразительность."},{"t":"p","s":"Метафора — перенос по сходству: «река огней», «мысль зацепилась за деталь». Название или признак одной области переносится на другую. Олицетворение — изображение неживого или отвлечённого через свойства живого: «ветер спорил с деревьями». Это частный вид метафорического переноса; если в списке есть более точный термин и пример явный, учитывайте эту точность."},{"t":"p","s":"Метонимия — перенос по смежности, реальной связи: «Весь класс засмеялся» — помещение/учебная группа вместо учеников; «читать Пушкина» — автор вместо произведений. Синекдоха — отношение части и целого: «в семье появился лишний рот» в значении человека, которого надо кормить. В базовом перечне ФИПИ акцент сделан на метонимии; дополнительные термины полезны как расширение, но не следует вводить их в ответ, если их нет в списке."},{"t":"p","s":"Сравнение сопоставляет предметы: «лёд блестит, словно стекло». Оно может выражаться союзом, сравнительной формой, творительным падежом или иной конструкцией: «туман молоком разлился по лугу». Отличие от метафоры — явное соотнесение двух образов, но границы отдельных примеров могут быть спорными; для учебного теста выбирайте ясные случаи."},{"t":"p","s":"Гипербола — намеренное преувеличение: «я ждал целую вечность». Литота — намеренное преуменьшение: «комната с напёрсток». Оксюморон соединяет контрастные по смыслу признаки: «оглушительная тишина». Перифраз описательно заменяет прямое название: «город на Неве» вместо Петербурга. Ирония создаёт расхождение буквальной похвалы или утверждения и подразумеваемой оценки; её нельзя доказать без контекста."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Лес проснулся и потянулся навстречу солнцу» — олицетворение: действия живого существа приписаны лесу.","«Лес стоял стеной» — сравнение через творительный падеж в соответствующем прочтении.","«Стена леса» — метафорическое называние.","Уточнение формы помогает различать близкие средства."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Любое прилагательное называть эпитетом","Любое слово как считать сравнением","Смешивать сходство и смежность","Искать «более красивый» термин вместо точного механизма"]}]}]},{"id":"RU060","title":"Синтаксические фигуры: повтор, противопоставление, построение","mod":"M07","tasks":[22,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Фигура речи возникает из особой организации слов и предложений. Для узнавания надо увидеть повторяемую позицию, порядок, нарастание или структурное нарушение привычного целого."},{"t":"p","s":"Лексический повтор — повтор слова или сочетания ради смыслового акцента: «Ждать. Ждать и надеяться». Анафора — одинаковое начало соседних отрезков: «Мы помним этот дом. Мы помним этот сад». Эпифора — одинаковое окончание: «Он мечтал о встрече. Она говорила о встрече». Повтор в любой позиции не следует автоматически называть анафорой."},{"t":"p","s":"Синтаксический параллелизм — сходное строение: «День приносил заботы. Вечер возвращал надежду». Слова могут быть разными; повторяется грамматическая модель. Анафора и параллелизм могут сочетаться, поэтому важны выделенные элементы и список ответа."},{"t":"p","s":"Антитеза — композиционно выраженное противопоставление: «Один обещал многое, другой молча помог». Антонимы могут её поддерживать, но не обязательны. Одна словарная пара без противопоставления мысли ещё не доказывает полноценную антитезу. Оксюморон соединяет противоположности в одном образе; антитеза сопоставляет контрастные положения."},{"t":"p","s":"Градация — последовательное усиление или ослабление: «Он тревожился, боялся, приходил в ужас». Простое перечисление «читал, писал, рисовал» градацией не является: должна быть ось нарастания. Инверсия — выразительное изменение обычного порядка: «Тих был вечер». Русский порядок слов свободен, поэтому необычность должна иметь стилистическую функцию."},{"t":"p","s":"Парцелляция — выделение зависимого компонента в отдельный интонационный и графический отрезок: «Он вернулся. Поздно. Один». Фрагменты можно восстановить как одно предложение. Несколько коротких самостоятельных предложений не обязательно парцелляция."},{"t":"p","s":"Многосоюзие — намеренное повторение союзов для ритма и акцента: «И дождь, и ветер, и холод не остановили нас». Бессоюзие как выразительное средство — намеренное перечисление без союзов: «Шум, огни, голоса, шаги». Не каждое бессоюзное сложное предложение автоматически используется как стилистическая фигура."},{"t":"p","s":"Риторический вопрос не требует реального ответа, а утверждает, оценивает или вовлекает: «Кто же откажется от надежды?» Риторическое восклицание эмоционально подчёркивает мысль. Риторическое обращение адресовано условному или отсутствующему собеседнику: «О время, остановись!» Вопросно-ответная форма отличается тем, что автор сам задаёт вопрос и затем содержательно отвечает на него."}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Называть любой вопрос риторическим","Любую точку — парцелляцией","Любые три слова — градацией","Не различать позиционный повтор и общий параллелизм"]}]}]},{"id":"RU061","title":"Звукопись и алгоритм задания 22","mod":"M07","tasks":[22],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Аллитерация — выразительное повторение согласных звуков, ассонанс — гласных. Анализировать нужно звучание, а не только одинаковые буквы: безударные гласные и позиционные изменения согласных могут менять звуковой состав. Одна случайно повторившаяся буква не является достаточным доказательством звукописи."},{"t":"p","s":"Звукопись может создавать впечатление шороха, плавности, тяжести, резкости, но значение нельзя механически закрепить за каждой буквой. «Р всегда означает угрозу» — неверная модель. Сначала покажите повтор, затем осторожно объясните его роль в конкретном фрагменте."},{"t":"p","s":"В навигаторе ФИПИ 2026 отдельно указано, что в задании 22 ассонанс, аллитерация и метонимия маркируются, а другие средства выделяются по необходимости. Для переноса в приложение критически важно сохранить выделение слов и букв: без него исходное задание может стать неоднозначным. Эти технические особенности следует повторно сверять при обновлении формата."}]},{"h":"Алгоритм","items":[{"t":"st","items":["Прочитайте весь список терминов.","Для каждого фрагмента сначала определите уровень: звук, значение слова или конструкция.","Проанализируйте выделенные элементы, если они есть.","Назовите диагностический признак: повтор начала, перенос по сходству, нарастание, добавочное выделение.","Сопоставьте все позиции и проверьте отсутствие повторов номеров, если действующая инструкция их исключает."]}]},{"h":"Разбор","items":[{"t":"ex","items":["В учебной фразе «Шуршит в тишине камыш» можно рассмотреть повтор шипящих как аллитерацию, если именно эти звуки выделены и это цель упражнения.","В «Тихо-тихо падал снег» виден лексический повтор; само присутствие одинаковых гласных не делает ассонанс главным ответом."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Выбирать средство по одному знакомому слову","Игнорировать маркировку","Выдавать контекстно возможный второй приём за единственный правильный","Путать два балла задания с пятью независимо начисляемыми баллами"]}]}]},{"id":"RU062","title":"Задание 27: требования, объём и критерии","mod":"M08","tasks":[27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Сочинение строится по указанной в задании проблеме исходного текста. Нужно передать позицию автора или рассказчика, прокомментировать её с опорой на два примера из текста, пояснить каждый пример и смысловую связь между ними, затем сформулировать и обосновать собственное отношение с примером-аргументом. Пересказ всего текста не заменяет эти действия."},{"t":"p","s":"По проекту демоверсии 2027 работа должна содержать не менее 150 слов. При 149 словах или меньше выставляется ноль по всем критериям. Поэтому прежние памятки о частичном оценивании более коротких работ для этого проекта непригодны. Практический рабочий объём можно выбрать около 220–300 слов, если хватает точности и времени; это редакционная рекомендация, а не официальный верхний предел."},{"t":"p","s":"Максимум — 22 первичных балла. К1 проверяет позицию автора — 1; К2 комментарий — 3; К3 своё отношение с обоснованием — 2; К4 фактическую точность — 1; К5 логику — 2; К6 этические нормы — 1; К7 орфографию, К8 пунктуацию, К9 грамматику, К10 речевые нормы — по 3. Полные условия и исключения приведены в демоверсии, печатные страницы 25–29."},{"t":"p","s":"Если позиция автора не сформулирована или неверна, К2 и К3 также оцениваются нулём. Если нет опоры на исходный текст либо работа представляет только его переписывание/пересказ без комментария, действуют нулевые условия из критериев. Нельзя компенсировать отсутствие понимания красивым общим вступлением."}]},{"h":"Подсчёт слов","items":[{"t":"p","s":"Учитывают самостоятельные и служебные слова. Дефисное написание без пробела обычно считается одним словом: всё-таки; раздельное — двумя: всё же. Инициалы с фамилией считаются одним словом. Цифры не считаются словами: «5 лет» — одно слово, «пять лет» — два. Служебные записи вроде «сочинение» и «смотрите на обороте» не увеличивают объём. Для частично переписанного или пересказанного текста учитывают собственную часть по указаниям критериев; полностью скопированные сведения об авторе и формулировка проблемы не включаются в объём."}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Писать ровно 150 по примитивному счётчику пробелов","Превращать количество абзацев в официальный критерий","Считать любое согласие достаточным к3","Использовать нормы старого года"]}]},{"h":"Критерии оценивания","items":[{"t":"tb","head":["Критерий","Макс"],"rows":[["K1 · Позиция автора","1"],["K2 · Комментарий","3"],["K3 · Собственное отношение и обоснование","2"],["K4 · Фактическая точность","1"],["K5 · Логичность","2"],["K6 · Этические нормы","1"],["K7 · Орфография","3"],["K8 · Пунктуация","3"],["K9 · Грамматические нормы","3"],["K10 · Речевые нормы","3"]]}]}]},{"id":"RU063","title":"Как сформулировать позицию автора","mod":"M08","tasks":[27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Позиция — содержательный ответ на проблему. Если вопрос «В чём проявляется забота?», фраза «Автор рассуждает о заботе» не отвечает на него. Нужно назвать проявление: «Забота выражается в умении заметить конкретную потребность другого и помочь делом»."},{"t":"p","s":"В публицистическом тексте позиция может быть сформулирована прямо. В художественном — раскрывается через поступки, детали, композицию, противопоставления и финальную оценку. Реплика персонажа не всегда выражает позицию автора. Особенно осторожно работают с иронией, отрицательным героем и ограниченным рассказчиком."},{"t":"p","s":"Не расширяйте вывод сверх текста. Если автор показывает ценность небольшого доброго поступка, нельзя превращать это в «любая помощь всегда решает все проблемы». Сохраняйте ограничения и смысловой масштаб. Не сужайте позицию до имени героя: читатель должен увидеть общую мысль, подтверждённую его поступком."}]},{"h":"Алгоритм","items":[{"t":"st","items":["Прочитайте формулировку проблемы.","Найдите авторские оценки и ключевой эпизод.","Сформулируйте ответ одним-двумя предложениями.","Проверьте его по двум выбранным примерам и финалу.","Если один пример противоречит ответу, уточните позицию или выбор примера."]}]},{"h":"Разбор","items":[{"t":"ex","items":["Слабо: «Автор считает, что мальчик помог женщине».","Это событие.","Лучше: «Автор убеждён, что доброта проявляется в конкретной помощи и внимании к человеку».","Эта мысль обобщает событие и отвечает проблеме, если именно её поддерживает текст.","Вводные формулы «По мнению автора…», «Писатель показывает…» удобны, но не обязательны.","Ошибка не в отсутствии клише, а в отсутствии точного содержания.","Имя автора пишите правильно; если оно не дано или есть риск перепутать инициалы, используйте «автор» или «рассказчик» в соответствии с заданием."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Заменять позицию темой","Приписывать автору собственное убеждение","Формулировать слишком общий моральный лозунг","Путать автора художественного произведения и героя-рассказчика"]}]}]},{"id":"RU064","title":"Два примера и пояснение: как писать комментарий","mod":"M08","tasks":[27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Пример-иллюстрация — конкретный элемент исходного текста, раскрывающий позицию: поступок, реплика, деталь, реакция, описанная ситуация. Он должен быть достаточно определённым, чтобы проверяющий узнал его. При этом не требуется пересказывать весь эпизод или цитировать большой абзац."},{"t":"p","s":"Пояснение отвечает: что показывает пример в рамках проблемы и почему он важен для позиции? Формула «Этот пример очень важен» не поясняет ничего. Фраза «Автор заставляет задуматься» без указания, о чём именно и за счёт чего, также недостаточна."},{"t":"p","s":"Хорошая микроструктура: указание на эпизод — краткое содержание — интерпретация. Например: «Герой замечает, что соседка не может донести сумку, и помогает ей. Этот поступок показывает, что внимание становится добротой тогда, когда приводит к действию». Вторая фраза раскрывает смысл первой."},{"t":"p","s":"Два примера должны добавлять понимание. Можно взять контрастные поступки, причину и следствие, два проявления одного качества, исходное и изменившееся состояние героя. Дважды пересказанная одна деталь не становится двумя полноценными иллюстрациями только из-за новых слов."}]},{"h":"Разбор","items":[{"t":"ex","items":["Плохой комментарий: «В первом примере герой помог соседке.","Во втором она поблагодарила.","Оба примера важны».","Улучшение: «Помощь героя показывает его готовность потратить время ради другого.","Благодарность и изменившееся настроение соседки позволяют увидеть результат этой помощи: человек перестаёт чувствовать себя одиноким».","Здесь у каждого элемента есть смысловая функция.","Цитировать можно коротко и точно.","Если точная формулировка не нужна, передайте эпизод своими словами.","Номера предложений помогают ориентироваться, но сами по себе не заменяют содержания.","Не приписывайте персонажу чувства, которые текст не подтверждает."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Пересказ вместо анализа","Большой цитатный блок","Пояснение, не связанное с проблемой","Фактологическая ошибка в поступке, имени или мотиве","Два примера, не поддерживающие заявленную позицию"]}]}]},{"id":"RU065","title":"Смысловая связь между примерами","mod":"M08","tasks":[27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Для полного комментария необходимо не только назвать связь, но и объяснить её содержание. «Примеры противопоставлены» — название. «Обещания первого героя контрастируют с молчаливой помощью второго; это показывает, что нравственную ценность имеют поступки, а не уверенные слова» — объяснение."},{"t":"p","s":"Дополнение: два примера раскрывают разные стороны мысли. Нужно назвать, что добавляет второй. «Первый показывает внимание, второй — готовность действовать». Причина и следствие: один пример объясняет возникновение другого; важно не перепутать направление. «Внимание героя вернуло собеседнику уверенность, что видно по его дальнейшему решению»."},{"t":"p","s":"Противопоставление: примеры обнаруживают различия, значимые для вывода. Сопоставление может выявлять общее или различное без резкого контраста. Уточнение/конкретизация: второй пример делает общий смысл первого более определённым. Обобщение: несколько наблюдений приводят к более широкому выводу. Временная последовательность сама по себе ещё не причинность."},{"t":"p","s":"Единственного закрытого перечня слов-связок для всех сочинений нет. Не нужно искусственно подгонять эпизоды под заученный ярлык. Правильно объяснённое отношение важнее термина ради термина. Связь допустимо раскрыть рядом со вторым примером или в отдельном фрагменте, если текст остаётся понятным."}]},{"h":"Разбор","items":[{"t":"ex","items":["Пример 1: школьник решает не перебивать выступающего.","Пример 2: выступающий справляется с волнением и завершает речь.","Возможна причинно-следственная связь: поддерживающее поведение аудитории помогает человеку продолжить.","Но если текст не связывает эти факты, нельзя приписывать причинность только потому, что события идут подряд."]}]},{"h":"Алгоритм","items":[{"t":"st","items":["Кратко назовите смысл каждого примера.","Спросите, зачем автору нужны оба.","Сформулируйте отношение обычной фразой.","Проверьте, помогает ли оно раскрыть позицию.","Удалите пустые слова вроде «более полно и глубоко» без конкретного содержания."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Только называть связь","Объяснять отношения персонажей вместо отношений иллюстраций","Утверждать, что любые два примера дополняют друг друга","Путать следствие с доказательством и последовательностью"]}]}]},{"id":"RU066","title":"Собственное отношение и пример-аргумент","mod":"M08","tasks":[27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Собственное отношение должно быть сформулировано и обосновано. «Я согласен» — только знак отношения. Нужно объяснить, почему позиция кажется верной, и привести пример-аргумент из читательского, историко-культурного или жизненного опыта. Он не должен просто повторять исходный текст."},{"t":"p","s":"Аргумент состоит из тезиса, конкретного подтверждения и вывода, связывающего подтверждение с тезисом. «В литературе много добрых людей» — общее замечание. «В рассказе Куприна «Чудесный доктор» Пирогов помогает семье Мерцаловых медицински и материально; его деятельное участие возвращает людям надежду» — конкретное подтверждение мысли о помощи."},{"t":"p","s":"Литературный аргумент требует точности автора, названия и события. Не используйте произведение, если помните только название. Исторический пример должен подтверждаться фактами, а не популярной легендой. Жизненный пример может быть обычным наблюдением; не стоит ради выразительности выдумывать личный опыт и выдавать его за случившийся с вами."},{"t":"p","s":"В проекте демоверсии не учитываются примеры-аргументы из комиксов, аниме, манги, фанфиков, графических романов, компьютерных игр и подобных форматов. Это экзаменационное ограничение на источник аргумента. Для обучающего интерфейса храните его как условие версии задания, не как общую оценку художественной ценности этих форм."}]},{"h":"Разбор","items":[{"t":"ex","items":["Слабый вариант: «Я согласен, потому что доброта очень важна».","Более содержательный: «Я согласен: помощь ценна тем, что уменьшает конкретное затруднение человека.","В рассказе Куприна «Чудесный доктор» Пирогов не ограничивается сочувствием семье Мерцаловых, а осматривает больного ребёнка и помогает семье.","Его поступок подтверждает, что сострадание проявляется в действии».","Дальнейшее изложение не должно превращаться в полный пересказ рассказа.","Допустимо уточнить позицию автора или аргументированно не согласиться, если сохраняются понимание проблемы, логика и корректность.","Не нужно имитировать несогласие ради оригинальности."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Аргумент к другой проблеме","Перечисление названий без анализа","Повтор авторского примера","Выдуманная цитата","Вывод, не следующий из факта","Чрезмерное обобщение одного эпизода"]}]}]},{"id":"RU067","title":"Композиция сочинения и распределение времени","mod":"M08","tasks":[27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Композиция должна помогать проверяющему проследить мысль. Удобная учебная последовательность: позиция автора; первый пример и пояснение; второй пример и пояснение; объяснение связи; собственное отношение, аргумент и вывод. Некоторые элементы можно объединить в одном абзаце. Фиксированное число абзацев не является отдельным официальным требованием."},{"t":"p","s":"Вступление не обязано быть длинным. Переписывание вопроса из задания расходует время и не заменяет позиции. Заключение должно завершать мысль, но отдельный абзац с общим лозунгом не обязателен, если содержательный вывод уже сформулирован."},{"t":"p","s":"Черновик эффективнее строить как план: проблема → позиция → пример 1 → его смысл → пример 2 → его смысл → связь → собственный тезис → аргумент. После проверки логики разворачивайте план в связный текст. Это уменьшает риск написать красивый, но не отвечающий заданию абзац."}]},{"h":"Рабочая организация","items":[{"t":"p","s":"На всю работу в проекте отведено 210 минут. Личный план времени стоит проверить на пробных вариантах: например, около 70–85 минут на задания с кратким ответом, 90–110 минут на чтение, план и сочинение, оставшееся — на проверку и бланки. Это пример распределения, а не норматив ФИПИ; он должен подстраиваться под темп ученика."},{"t":"p","s":"Сочинение полезно проверять несколькими проходами. Сначала содержание и факты. Затем основания запятых, грамматические конструкции, орфография и лексические повторы. Одновременная проверка всего хуже управляется вниманием. После переноса в бланк ещё раз проверяют пропущенные слова и границы абзацев."}]},{"h":"Разбор","items":[{"t":"ex","items":["Если первый и второй примеры уже раскрыты, но связь не объяснена, не нужно добавлять новое длинное вступление.","Нужно исправить конкретный незавершённый компонент: назвать отношение примеров и показать, как оно поддерживает позицию."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Сначала писать сочинение целиком, затем искать для него проблему","Тратить половину работы на вступление","Исправлять отдельные слова до проверки смысловой структуры","Считать рекомендуемый объём официальным максимумом"]}]}]},{"id":"RU068","title":"Логические, фактические, речевые и грамматические ошибки","mod":"M08","tasks":[6,7,8,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Фактическая ошибка искажает событие, имя, авторство, содержание исходного текста или привлекаемого примера. Логическая — нарушает связь суждений: вывод не следует из основания, причина подменяется следствием, тезис противоречит собственному примеру, сравниваются несопоставимые явления. Речевая — связана с неудачным употреблением слов; грамматическая — с образованием форм и построением конструкции."},{"t":"p","s":"«Писатель родился в неверно указанном городе» — фактологическая проблема. «Он помог одному человеку, значит, всегда помогает всем» — чрезмерное логическое обобщение. «Это играет значение» — лексическая сочетаемость. «Благодаря помощи, которую оказали друзья, он смог закончить работу» грамматически допустимо; «благодаря помощи друзей смогла закончить работу» при подлежащем «он» нарушает согласование."},{"t":"p","s":"Речевые недостатки: плеоназм, тавтология, неоправданная канцелярская тяжеловесность, смешение стилей, двусмысленное местоимение, неверный пароним. Простые точные фразы часто сильнее искусственно сложных. «Автор показывает, что помощь важна» лучше, чем «автор осуществляет демонстрацию актуальности оказания помощи»."},{"t":"p","s":"По проекту 2027 для К7–К10 общий ряд порогов таков: нет ошибок — 3; одна-две — 2; три-четыре — 1; пять и более — 0. Для К5: нет логических ошибок — 2; одна-две — 1; три и более — 0. К4 даёт 1 при отсутствии фактических ошибок. Подсчёт ошибок и пограничные классификации требуют применения полных методических указаний, а не автоматического подсчёта подчёркиваний редактора."},{"t":"p","s":"К6 применяется по официальной формулировке демоверсии, включающей специальные ограничения на содержание и лексику. В учебной работе используйте корректную аргументацию, точные нейтральные слова и проверяйте словарную норму. Автоматическому проверяющему нельзя приписывать статус официального эксперта лишь потому, что он умеет выдавать баллы."}]},{"h":"Проверка","items":[{"t":"p","s":"Для каждого абзаца задайте вопрос: какую функцию он выполняет? Для каждого местоимения найдите однозначную опору. Для каждой цитаты сверьте текст. Для каждого вывода укажите основание. Затем проверьте обороты, управление, согласование и все личные окончания."}]}]},{"id":"RU069","title":"Полный учебный пример: текст, сочинение и разбор","mod":"M08","tasks":[23,24,25,26,27],"blocks":[{"h":"Исходный учебный текст","items":[{"t":"p","s":"Текст ниже создан специально для этой базы. Это учебный материал, а не опубликованное задание ФИПИ и не отрывок, приписанный писателю."},{"t":"p","s":"(1) После уроков мы готовили школьную выставку старых фотографий. (2) В коридоре было шумно: одни спорили о подписях, другие искали свободные рамки. (3) У окна стояла пожилая женщина с небольшим конвертом в руках. (4) Я решил, что она кого-то ждёт, и несколько раз прошёл мимо."},{"t":"p","s":"(5) Потом женщина негромко спросила, можно ли показать фотографии её отца, который когда-то преподавал в нашей школе. (6) Я ответил, что свободных мест почти не осталось, и уже повернулся к лестнице. (7) Но моя одноклассница Аня остановилась, взяла конверт и предложила вместе посмотреть снимки."},{"t":"p","s":"(8) На одном из них молодой учитель стоял возле совсем маленького школьного здания. (9) Женщина стала рассказывать, как её отец после уроков помогал ребятам готовиться к поступлению. (10) Аня не торопила её и уточняла имена людей на фотографиях. (11) Я заметил, что собеседница постепенно перестала сжимать края конверта и заговорила увереннее."},{"t":"p","s":"(12) Для снимков мы всё-таки нашли место. (13) Подписи к ним женщина помогла составить сама. (14) Уходя, она сказала, что боялась оказаться здесь лишней, ведь почти никого в школе уже не знала. (15) А теперь ей казалось, будто она снова встретилась с отцом и его учениками."},{"t":"p","s":"(16) Я посмотрел на Аню и подумал: свободное место на стене оказалось найти легче, чем свободную минуту в собственном расписании. (17) Но именно с этой минуты и началась наша настоящая работа над выставкой."}]},{"h":"Учебное задание","items":[{"t":"p","s":"Напишите сочинение по проблеме: «В чём проявляется внимание к человеку?» Выполните требования задания 27: позиция, два примера с пояснениями, связь с объяснением, собственное отношение с примером-аргументом. Объём — не менее 150 слов."}]},{"h":"Образец сочинения","items":[{"t":"p","s":"Внимание к человеку проявляется в готовности заметить его переживания, выслушать и помочь ему почувствовать свою значимость. Именно такую мысль раскрывает автор предложенного текста. Он показывает, что даже небольшая остановка в привычной суете может стать для другого человека настоящей поддержкой."},{"t":"p","s":"Сначала рассказчик несколько раз проходит мимо пожилой женщины, а затем сообщает ей, что свободных мест для фотографий почти не осталось. Для него важнее организационные заботы выставки, чем история посетительницы. Этот эпизод показывает, как занятость мешает увидеть человека за внешне незначительной просьбой. Рассказчик не стремится обидеть женщину, однако его поспешный ответ заставляет её почувствовать себя ненужной."},{"t":"p","s":"Иначе поступает Аня. Она рассматривает принесённые снимки, слушает рассказ и уточняет имена изображённых людей. Постепенно женщина начинает говорить увереннее, а перед уходом признаётся, что прежде боялась оказаться в школе лишней. Эта перемена помогает понять ценность внимательного отношения: собеседница ощущает, что её память и чувства интересны другим."},{"t":"p","s":"Примеры противопоставлены. Поспешность рассказчика оставляет женщину наедине с неловкостью, тогда как участие Ани возвращает ей уверенность. Благодаря этому контрасту автор убеждает читателя, что внимание определяется не громкими обещаниями, а готовностью уделить человеку время."},{"t":"p","s":"Я согласен с этой позицией. Поддержка начинается с умения выслушать, потому что без этого трудно понять, какая помощь действительно нужна. В рассказе Куприна «Чудесный доктор» Пирогов не отворачивается от отчаявшегося Мерцалова, узнаёт о беде его семьи и помогает ей. Его участие возвращает людям надежду. Этот пример подтверждает: внимательное отношение способно стать началом конкретной помощи, которая меняет положение человека."},{"t":"p","s":"Таким образом, быть внимательным — значит воспринимать чужую просьбу как повод понять человека и откликнуться на его переживания."}]},{"h":"Почему конструкция работает","items":[{"t":"p","s":"В первом абзаце дан ответ на проблему. Первый пример показывает невнимание через спешку; второй — участие и его результат. После каждого объяснено значение эпизода. Связь раскрыта как контраст двух отношений. Собственное мнение обосновано, а литературный пример добавлен отдельно от исходного текста. Последняя фраза завершает вывод, а не вводит новую тему."},{"t":"p","s":"Это учебный образец структуры, не готовый текст для любого варианта и не гарантия конкретного балла. Ключевые слова и выводы должны меняться вместе с исходным текстом. Разбор помогает понять действие каждого абзаца, а не запомнить его дословно."}]}]},{"id":"RU070","title":"Язык как система, национальный язык и культура","mod":"M09","tasks":[3,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Язык — система знаков и правил их сочетания. Его единицы образуют уровни: звуки и фонемы, морфемы, слова, словосочетания, предложения. Речь — использование этой системы в конкретном общении. Один человек может знать правило, но нарушить его в спешке; поэтому знание языка и качество конкретного высказывания не совпадают автоматически."},{"t":"p","s":"Основные функции языка — общение, выражение мысли, называние предметов и явлений, сохранение и передача опыта. В художественном тексте важна эстетическая функция, в разговоре — установление и поддержание контакта. В одном высказывании функции обычно сочетаются."},{"t":"p","s":"Национальный язык шире литературного. Он включает литературную форму, территориальные говоры, просторечие и социальные разновидности. Литературный язык обладает кодифицированными нормами и обслуживает разные публичные сферы. Диалектная или жаргонная единица может быть уместна в речи персонажа, но потребовать нейтральной замены в экзаменационном рассуждении."},{"t":"p","s":"Русский язык входит в восточнославянскую группу славянской ветви индоевропейской семьи. Историческое родство языков устанавливают по системе соответствий, а не по сходству отдельных случайных слов. Современный состав языка формируется наследованием, словообразованием, заимствованием и развитием новых значений."},{"t":"p","s":"Заимствование не является ошибкой само по себе: многие давно освоенные слова стали нейтральными. Оцениваются понятность адресату, точность, уместность и словарная норма. Речевая культура предполагает осознанный выбор выражений, уважение к собеседнику и способность передать мысль без лишней грубости и неясности."}]},{"h":"Разбор","items":[{"t":"ex","items":["Термин «фонема» уместен в лингвистическом объяснении.","Для человека, не знакомого с термином, его нужно определить.","В бытовой просьбе «произнесите звук ещё раз» сложная терминология может быть избыточной.","Выбор зависит от задачи общения, а не от престижности слова."]}]}]},{"id":"RU071","title":"Речевая ситуация, этикет и качества хорошей речи","mod":"M09","tasks":[3,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Речевая ситуация включает адресанта, адресата, тему, цель, мотив, условия и канал общения. Одну просьбу формулируют по-разному другу, учителю и незнакомому сотруднику. Это изменение регистра, а не изменение содержания факта."},{"t":"p","s":"Речевая деятельность включает говорение, слушание, чтение и письмо. Слушание не равно физическому восприятию звука: нужно понимать смысл, выделять основное и соотносить сказанное с контекстом. Чтение может быть ознакомительным, изучающим, просмотровым и поисковым; для задания на точность содержания требуется внимательное возвращение к фрагменту."},{"t":"tb","head":null,"rows":[["Качества хорошей речи: правильность","соответствие нормам"],["точность","соответствие выражения мысли и фактам"],["логичность","ясные отношения суждений"],["уместность","соответствие ситуации"],["чистота","отсутствие неуместных засоряющих элементов"],["богатство","разнообразие средств без искусственного усложнения"],["выразительность","способность удержать внимание и выделить существенное"]]},{"t":"p","s":"Речевой этикет помогает установить контакт, выразить просьбу, благодарность, отказ, согласие и несогласие. Корректное возражение направлено на тезис: «Этот вывод не подтверждён примером», а не на унижение автора. В сочинении важно оценивать поступок или мысль аргументированно, избегая оскорбительных обобщений."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Вы всё неправильно поняли» — неконкретная оценка собеседника.","«В тексте названа другая причина поступка; обратимся к этому эпизоду» — содержательное уточнение.","Во втором случае общение продвигается к проверяемому основанию."]}]}]},{"id":"RU072","title":"Публичное выступление и аргументация","mod":"M09","tasks":[3,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Публичное выступление строится под цель и аудиторию. Тема обозначает область, тезис — защищаемую мысль, аргументы — основания, иллюстрации — конкретные случаи. Композиция обычно включает введение в вопрос, развитие мысли и завершение. Эти умения переносятся на письменное рассуждение, хотя устная речь имеет свои темп, интонацию и контакт с аудиторией."},{"t":"p","s":"Аргумент должен быть относимым к тезису, достаточно достоверным и логически связанным с выводом. Пример иллюстрирует возможность, но не всегда доказывает всеобщность. Из одного успешного опыта нельзя без дополнительных оснований выводить закон для всех людей."},{"t":"p","s":"Причинное объяснение отличается от временной последовательности. Сравнение требует общего основания. Обращение к мнению специалиста полезно лишь в пределах его компетенции и при точной передаче позиции. Эмоциональное воздействие не подменяет доказательство, хотя может помогать выразить значимость вопроса."},{"t":"p","s":"Для подготовки составьте краткий план, подберите понятный пример, продумайте возможное возражение и проверьте ключевые слова. Объясняйте термины, которые аудитория может не знать. В устном выступлении короткие фразы облегчают восприятие, а в письменном тексте переходы между абзацами должны делать ход мысли видимым без голоса говорящего."}]},{"h":"Разбор","items":[{"t":"ex","items":["Тезис «Проверка черновика помогает избежать случайных ошибок» поддерживается примером обнаруженного пропущенного слова.","Но из этого примера нельзя вывести «Каждый ученик после одной проверки обязательно получит максимальный балл».","Второе утверждение существенно сильнее доказанного."]}]}]}]</script>

узей он выстоял."},{"id":"в","t":"Он молчал весь вечер."},{"id":"г","t":"Внезапно пошёл дождь."}],"c":"б","e":"«Благодаря» требует дательного падежа: благодаря поддержке."},{"id":"x-rus-t8-06","k":"mc","les":"RU026","task":8,"q":"В каком предложении допущена грамматическая ошибка?","o":[{"id":"а","t":"Согласно приказу все вышли на субботник."},{"id":"б","t":"Согласно приказа все вышли на субботник."},{"id":"в","t":"Он крепко спал."},{"id":"г","t":"Мы обсудили план."}],"c":"б","e":"«Согласно» требует дательного падежа: согласно приказу."},{"id":"x-rus-t8-07","k":"mc","les":"RU025","task":8,"q":"В каком предложении допущена грамматическая ошибка?","o":[{"id":"а","t":"Те, кто был на собрании, знают об этом."},{"id":"б","t":"Читая книгу, мне было интересно."},{"id":"в","t":"Он пришёл первым."},{"id":"г","t":"Все остались довольны."}],"c":"б","e":"В деепричастном обороте нет деятеля: «читая… мне было интересно» — ошибка."},{"id":"x-rus-t8-08","k":"mc","les":"RU026","task":8,"q":"В каком предложении допущена грамматическая ошибка?","o":[{"id":"а","t":"Он любит спорт и увлекается им."},{"id":"б","t":"Он любит и увлекается спортом."},{"id":"в","t":"Она хорошо поёт."},{"id":"г","t":"Мы уехали рано."}],"c":"б","e":"Однородные требуют разного управления: любит (что?) спорт и увлекается (чем?) спортом."},{"id":"x-rus-t8-09","k":"mc","les":"RU026","task":8,"q":"В каком предложении допущена грамматическая ошибка?","o":[{"id":"а","t":"Вопреки прогнозу погода была ясной."},{"id":"б","t":"Вопреки прогноза погода была ясной."},{"id":"в","t":"Он долго думал."},{"id":"г","t":"Все согласились."}],"c":"б","e":"«Вопреки» требует дательного падежа: вопреки прогнозу."},{"id":"x-rus-t8-10","k":"mc","les":"RU025","task":8,"q":"В каком предложении допущена грамматическая ошибка?","o":[{"id":"а","t":"Приехавшие на съезд делегаты обсудили вопрос."},{"id":"б","t":"Приехавшие делегаты на съезд обсудили вопрос."},{"id":"в","t":"Он читал весь вечер."},{"id":"г","t":"Мы ждали ответа."}],"c":"б","e":"Причастный оборот разорван: «приехавшие на съезд делегаты»."},{"id":"x-rus-t16-01","k":"mc","les":null,"task":16,"q":"Нужна ли запятая на месте пропуска ( )?\n\nСолнце село ( ) и стало прохладно.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"а","e":"Две грамматические основы (солнце село / стало прохладно) — ССП, запятая перед «и» нужна."},{"id":"x-rus-t16-02","k":"mc","les":"RU046","task":16,"q":"Нужна ли запятая на месте пропуска ( )?\n\nОн встал ( ) и вышел из комнаты.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"б","e":"Однородные сказуемые при одном подлежащем, одиночное «и» — запятая не нужна."},{"id":"x-rus-t16-03","k":"mc","les":"RU047","task":16,"q":"Нужна ли запятая на месте пропуска ( )?\n\nВечером похолодало ( ) и пошёл дождь.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"б","e":"У частей общий второстепенный член «вечером» — запятая перед «и» не ставится."},{"id":"x-rus-t16-04","k":"mc","les":"RU046","task":16,"q":"Нужна ли запятая на месте пропуска ( )?\n\nЯ купил тетради ( ) и ручки.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"б","e":"Одиночное «и» соединяет два однородных дополнения — запятая не нужна."},{"id":"x-rus-t16-05","k":"mc","les":"RU046","task":16,"q":"Нужна ли запятая на месте пропуска ( )?\n\nИ днём ( ) и ночью шёл снег.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"а","e":"Повторяющийся союз и…и — запятая между однородными нужна."},{"id":"x-rus-t16-06","k":"mc","les":null,"task":16,"q":"Нужна ли запятая на месте пропуска ( )?\n\nВетер стих ( ) но туман не рассеялся.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"а","e":"ССП с союзом «но» — запятая нужна."},{"id":"x-rus-t16-07","k":"mc","les":"RU046","task":16,"q":"Нужна ли запятая на месте пропуска ( )?\n\nНа столе лежали книги ( ) тетради и карандаши.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"а","e":"Однородные без союза (книги, тетради) — запятая нужна."},{"id":"x-rus-t16-08","k":"mc","les":null,"task":16,"q":"Нужна ли запятая на месте пропуска ( )?\n\nНебо потемнело ( ) и подул холодный ветер.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"а","e":"ССП, разные подлежащие (небо / ветер) — запятая нужна."},{"id":"x-rus-t16-09","k":"mc","les":"RU046","task":16,"q":"Нужна ли запятая на месте пропуска ( )?\n\nОн любит читать ( ) и рисовать.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"б","e":"Одиночное «и», однородные сказуемые — запятая не нужна."},{"id":"x-rus-t16-10","k":"mc","les":"RU046","task":16,"q":"Нужна ли запятая на месте пропуска ( )?\n\nТо дождь ( ) то снег шёл весь день.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"а","e":"Повторяющийся союз то…то — запятая между однородными нужна."},{"id":"x-rus-t17-01","k":"mc","les":"RU048","task":17,"q":"Нужны ли запятые для выделения выделенного оборота?\n\nКнига ( ) лежавшая на столе ( ) исчезла.","o":[{"id":"а","t":"Да, нужны"},{"id":"б","t":"Нет, не нужны"}],"c":"а","e":"Причастный оборот стоит после определяемого слова «книга» — обособляется."},{"id":"x-rus-t17-02","k":"mc","les":"RU048","task":17,"q":"Нужны ли запятые для выделения выделенного оборота?\n\nЛежавшая на столе ( ) книга исчезла.","o":[{"id":"а","t":"Да, нужны"},{"id":"б","t":"Нет, не нужны"}],"c":"б","e":"Причастный оборот стоит перед определяемым словом — не обособляется."},{"id":"x-rus-t17-03","k":"mc","les":"RU048","task":17,"q":"Нужны ли запятые для выделения выделенного оборота?\n\nОн шёл ( ) напевая песню.","o":[{"id":"а","t":"Да, нужны"},{"id":"б","t":"Нет, не нужны"}],"c":"а","e":"Деепричастный оборот обособляется."},{"id":"x-rus-t17-04","k":"mc","les":null,"task":17,"q":"Нужны ли запятые для выделения выделенного оборота?\n\nТуристы ( ) уставшие за день ( ) быстро уснули.","o":[{"id":"а","t":"Да, нужны"},{"id":"б","t":"Нет, не нужны"}],"c":"а","e":"Оборот после определяемого слова «туристы» — обособляется."},{"id":"x-rus-t17-05","k":"mc","les":"RU049","task":17,"q":"Нужны ли запятые для выделения выделенного оборота?\n\nОн читал ( ) лёжа.","o":[{"id":"а","t":"Да, нужны"},{"id":"б","t":"Нет, не нужны"}],"c":"б","e":"Одиночное деепричастие, перешедшее в наречие («лёжа»), не обособляется."},{"id":"x-rus-t17-06","k":"mc","les":null,"task":17,"q":"Нужны ли запятые для выделения выделенного оборота?\n\nРаботал он ( ) спустя рукава.","o":[{"id":"а","t":"Да, нужны"},{"id":"б","t":"Нет, не нужны"}],"c":"б","e":"Оборот-фразеологизм не обособляется."},{"id":"x-rus-t17-07","k":"mc","les":"RU048","task":17,"q":"Нужны ли запятые для выделения выделенного оборота?\n\nМальчик ( ) прочитавший книгу ( ) пересказал её.","o":[{"id":"а","t":"Да, нужны"},{"id":"б","t":"Нет, не нужны"}],"c":"а","e":"Причастный оборот после определяемого слова — обособляется."},{"id":"x-rus-t17-08","k":"mc","les":"RU048","task":17,"q":"Нужны ли запятые для выделения выделенного оборота?\n\nНапевая песню ( ) он шёл по улице.","o":[{"id":"а","t":"Да, нужны"},{"id":"б","t":"Нет, не нужны"}],"c":"а","e":"Деепричастный оборот в начале предложения обособляется."},{"id":"x-rus-t17-09","k":"mc","les":"RU048","task":17,"q":"Нужны ли запятые для выделения выделенного оборота?\n\nУставший ( ) он молчал весь вечер.","o":[{"id":"а","t":"Да, нужны"},{"id":"б","t":"Нет, не нужны"}],"c":"а","e":"Определение относится к личному местоимению «он» — обособляется."},{"id":"x-rus-t17-10","k":"mc","les":"RU048","task":17,"q":"Нужны ли запятые для выделения выделенного оборота?\n\nДом ( ) построенный в прошлом веке ( ) ещё крепок.","o":[{"id":"а","t":"Да, нужны"},{"id":"б","t":"Нет, не нужны"}],"c":"а","e":"Причастный оборот после определяемого слова — обособляется."},{"id":"x-rus-t18-01","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми выделенное слово?\n\nОн ( ) кажется ( ) опоздает на встречу.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"а","e":"«Кажется» — вводное (можно убрать), выделяется запятыми."},{"id":"x-rus-t18-02","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми выделенное слово?\n\nМне кажется ( ) он прав.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"б","e":"«Кажется» здесь сказуемое (мне кажется), запятыми не выделяется; запятая ставится перед второй частью, а само слово не обособляется."},{"id":"x-rus-t18-03","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми выделенное слово?\n\nПоезд ( ) однако ( ) задержался.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"а","e":"«Однако» в середине предложения — вводное, выделяется."},{"id":"x-rus-t18-04","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми выделенное слово?\n\nОднако ( ) он так и не пришёл.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"б","e":"«Однако» в начале = союз «но», запятыми не выделяется."},{"id":"x-rus-t18-05","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми выделенное слово?\n\nК счастью ( ) всё обошлось.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"а","e":"«К счастью» — вводное слово, выделяется запятой."},{"id":"x-rus-t18-06","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми выделенное слово?\n\nДети ( ) конечно ( ) обрадовались подарку.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"а","e":"«Конечно» — вводное, выделяется запятыми."},{"id":"x-rus-t18-07","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми выделенное слово?\n\nПо-моему ( ) ты ошибаешься.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"а","e":"«По-моему» — вводное слово, выделяется запятой."},{"id":"x-rus-t18-08","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми выделенное слово?\n\nОн был ( ) безусловно ( ) прав.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"а","e":"«Безусловно» — вводное, выделяется запятыми."},{"id":"x-rus-t18-09","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми выделенное слово?\n\nДрузья ( ) пора отправляться в путь.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"а","e":"«Друзья» — обращение, выделяется запятой."},{"id":"x-rus-t18-10","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми выделенное слово?\n\nНаконец ( ) он закончил работу и ушёл.","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"а","e":"«Наконец» в значении «и ещё» — вводное, выделяется."},{"id":"x-rus-t1-g01","k":"mc","les":null,"task":1,"q":"Определите стиль: «Молекула воды состоит из двух атомов водорода и одного атома кислорода; полярность молекулы обусловливает её высокую растворяющую способность.»","o":[{"id":"а","t":"Научный"},{"id":"б","t":"Художественный"},{"id":"в","t":"Разговорный"},{"id":"г","t":"Публицистический"}],"c":"а","e":"Идём по алгоритму: 1) сфера — точное объяснение устройства вещества (учебник); 2) есть термины (молекула, атом, полярность, растворяющая способность); 3) нет эмоций и тропов; 4) изложение объективное и безличное. Все признаки указывают на научный стиль."},{"id":"x-rus-t1-g02","k":"mc","les":null,"task":1,"q":"Определите стиль: «Таким образом, увеличение температуры приводит к ускорению химической реакции, что подтверждается экспериментальными данными.»","o":[{"id":"а","t":"Разговорный"},{"id":"б","t":"Научный"},{"id":"в","t":"Официально-деловой"},{"id":"г","t":"Художественный"}],"c":"б","e":"1) Сфера — научное рассуждение; 2) термины (химическая реакция, экспериментальные данные); 3) вводное слово-связка 'таким образом' указывает на логику вывода; 4) нет эмоций и образов. Это научный стиль."},{"id":"x-rus-t1-g03","k":"mc","les":null,"task":1,"q":"Какой признак НЕ характерен для научного стиля?","o":[{"id":"а","t":"Точность и логичность"},{"id":"б","t":"Использование терминов"},{"id":"в","t":"Эмоционально-оценочная лексика и восклицания"},{"id":"г","t":"Безличность изложения"}],"c":"в","e":"Вспоминаем признаки научного стиля: точность, логичность, термины, безличность. Эмоционально-оценочная лексика и восклицания — это признак публицистического или разговорного стиля, а научному они чужды. Значит, лишний признак — эмоциональность."},{"id":"x-rus-t1-g04","k":"mc","les":null,"task":1,"q":"Определите стиль: «Функция f(x) называется непрерывной в точке, если бесконечно малому приращению аргумента соответствует бесконечно малое приращение функции.»","o":[{"id":"а","t":"Художественный"},{"id":"б","t":"Публицистический"},{"id":"в","t":"Научный"},{"id":"г","t":"Официально-деловой"}],"c":"в","e":"1) Сфера — математика (учебник); 2) термины (функция, непрерывность, приращение аргумента); 3) строгое определение без эмоций и образов; 4) объективность и точность. Это научный стиль."},{"id":"x-rus-t1-g05","k":"mc","les":null,"task":1,"q":"Определите стиль: «Клетки эпителия выполняют защитную и секреторную функции, образуя сплошной пласт на поверхности органа.»","o":[{"id":"а","t":"Научный"},{"id":"б","t":"Разговорный"},{"id":"в","t":"Художественный"},{"id":"г","t":"Публицистический"}],"c":"а","e":"1) Сфера — биология; 2) термины (клетки эпителия, секреторная функция); 3) точное объективное описание; 4) нет оценки и тропов. Все признаки — научный стиль."},{"id":"x-rus-t1-g06","k":"mc","les":"RU008","task":1,"q":"Дан текст научного стиля. Какой признак из текста это ПОДТВЕРЖДАЕТ: «Гравитация — фундаментальное взаимодействие, определяющее движение небесных тел»?","o":[{"id":"а","t":"Обращение к читателю и призыв"},{"id":"б","t":"Использование термина и объективное определение понятия"},{"id":"в","t":"Разговорные частицы и неполные предложения"},{"id":"г","t":"Развёрнутая метафора"}],"c":"б","e":"Проверяем, чем подтверждается стиль: в тексте термин 'гравитация' и его строгое определение, изложение объективно. Обращений, частиц и метафор здесь нет. Значит, стиль подтверждают именно термин и объективное определение."},{"id":"x-rus-t1-g07","k":"mc","les":null,"task":1,"q":"В каком фрагменте представлен НАУЧНЫЙ стиль?","o":[{"id":"а","t":"Ну и погодка сегодня, аж до костей пробирает!"},{"id":"б","t":"Осадки представляют собой атмосферную влагу, выпадающую из облаков в жидком или твёрдом состоянии."},{"id":"в","t":"Дожди зарядили, хоть из дома не выходи."},{"id":"г","t":"Небо плакало холодными слезами над уснувшим городом."}],"c":"б","e":"Ищем текст с терминами, точностью и без эмоций. Вариант с определением осадков содержит термин и объективное описание — это научный стиль. Остальные: разговорные реплики и художественная метафора ('небо плакало')."},{"id":"x-rus-t1-g08","k":"mc","les":null,"task":1,"q":"Определите стиль: «В соответствии с приказом директора от 15.03.2026 работникам предприятия надлежит пройти инструктаж по технике безопасности.»","o":[{"id":"а","t":"Публицистический"},{"id":"б","t":"Официально-деловой"},{"id":"в","t":"Научный"},{"id":"г","t":"Разговорный"}],"c":"б","e":"1) Сфера — документ (приказ); 2) клише-канцеляризмы: 'в соответствии с', 'надлежит'; 3) стандартная точная формулировка без эмоций и образов. Это официально-деловой стиль."},{"id":"x-rus-t1-g09","k":"mc","les":null,"task":1,"q":"Определите стиль: «Настоящим уведомляем, что договор аренды подлежит расторжению по истечении указанного в нём срока.»","o":[{"id":"а","t":"Официально-деловой"},{"id":"б","t":"Художественный"},{"id":"в","t":"Разговорный"},{"id":"г","t":"Научный"}],"c":"а","e":"1) Сфера — деловая переписка; 2) клише 'настоящим уведомляем', 'подлежит расторжению', 'по истечении срока'; 3) сухость, точность, отсутствие эмоций. Это официально-деловой стиль."},{"id":"x-rus-t1-g10","k":"mc","les":"RU008","task":1,"q":"Какой признак характерен именно для официально-делового стиля?","o":[{"id":"а","t":"Обилие эпитетов и метафор"},{"id":"б","t":"Стандартные обороты-клише и отсутствие тропов"},{"id":"в","t":"Риторические вопросы и призывы"},{"id":"г","t":"Разговорные частицы и междометия"}],"c":"б","e":"Вспоминаем признаки: официально-деловой стиль строится на клише ('в соответствии с', 'настоящим', 'надлежащий') и лишён образности. Эпитеты — художественный, риторические вопросы — публицистический, частицы — разговорный. Верный признак — клише и отсутствие тропов."},{"id":"x-rus-t1-g11","k":"mc","les":null,"task":1,"q":"Определите стиль: «Прошу предоставить мне ежегодный оплачиваемый отпуск с 1 июля 2026 года сроком на 14 календарных дней.»","o":[{"id":"а","t":"Разговорный"},{"id":"б","t":"Научный"},{"id":"в","t":"Официально-деловой"},{"id":"г","t":"Публицистический"}],"c":"в","e":"1) Сфера — заявление (документ); 2) стандартная формула 'прошу предоставить', точное указание сроков; 3) нет эмоций и образов. Это официально-деловой стиль."},{"id":"x-rus-t1-g12","k":"mc","les":null,"task":1,"q":"Определите стиль: «Гражданин обязан возместить причинённый ущерб в порядке, установленном действующим законодательством.»","o":[{"id":"а","t":"Официально-деловой"},{"id":"б","t":"Научный"},{"id":"в","t":"Художественный"},{"id":"г","t":"Разговорный"}],"c":"а","e":"1) Сфера — правовая норма; 2) канцеляризмы 'возместить ущерб', 'в порядке, установленном законодательством'; 3) точность, не допускающая инотолкований, без эмоций. Это официально-деловой стиль."},{"id":"x-rus-t1-g13","k":"mc","les":null,"task":1,"q":"В каком фрагменте представлен ОФИЦИАЛЬНО-ДЕЛОВОЙ стиль?","o":[{"id":"а","t":"Слушай, отдай долг, а то неудобно уже."},{"id":"б","t":"Заёмщик обязуется вернуть сумму займа в срок, указанный в пункте 3 договора."},{"id":"в","t":"Деньги — как вода: утекают сквозь пальцы незаметно."},{"id":"г","t":"Экономисты бьют тревогу: закредитованность населения растёт год от года!"}],"c":"б","e":"Ищем документ с клише и точностью. Вариант с 'Заёмщик обязуется вернуть сумму займа в срок, указанный в пункте 3 договора' — типичный текст договора. Остальные: разговорная реплика, художественное сравнение и публицистический призыв."},{"id":"x-rus-t1-g14","k":"mc","les":null,"task":1,"q":"Дан текст официально-делового стиля. Какая характеристика ему соответствует: «Заявление подаётся в письменной форме и рассматривается в тридцатидневный срок»?","o":[{"id":"а","t":"Образность и эмоциональность"},{"id":"б","t":"Стандартизированность и точность формулировок"},{"id":"в","t":"Непринуждённость и разговорная лексика"},{"id":"г","t":"Наличие риторических вопросов"}],"c":"б","e":"Проверяем текст на признаки: есть стандартная процедура и точный срок ('тридцатидневный срок'), нет эмоций, образов и вопросов. Значит, соответствует характеристика 'стандартизированность и точность формулировок'."},{"id":"x-rus-t1-g15","k":"mc","les":null,"task":1,"q":"Определите стиль: «Неужели мы и дальше будем молчать, когда наши леса безжалостно вырубают? Пора действовать, пока не поздно!»","o":[{"id":"а","t":"Научный"},{"id":"б","t":"Официально-деловой"},{"id":"в","t":"Публицистический"},{"id":"г","t":"Разговорный"}],"c":"в","e":"1) Сфера — обращение к обществу на важную тему; 2) есть оценка и эмоция; 3) риторический вопрос ('Неужели...?') и призыв ('Пора действовать!'). Сочетание воздействия и общественной темы — публицистический стиль."},{"id":"x-rus-t1-g16","k":"mc","les":null,"task":1,"q":"Определите стиль: «Спорт объединяет нации. Именно на стадионах рождается то чувство единства, которое так нужно современному миру.»","o":[{"id":"а","t":"Публицистический"},{"id":"б","t":"Научный"},{"id":"в","t":"Разговорный"},{"id":"г","t":"Художественный"}],"c":"а","e":"1) Сфера — статья на общественную тему; 2) общественная лексика (нации, единство, современный мир); 3) открытая оценка и стремление убедить читателя. Это публицистический стиль."},{"id":"x-rus-t1-g17","k":"mc","les":null,"task":1,"q":"Какое сочетание признаков указывает на публицистический стиль?","o":[{"id":"а","t":"Термины и безличность"},{"id":"б","t":"Клише и стандартные бланки"},{"id":"в","t":"Информирование в сочетании с воздействием, оценочность, призывы"},{"id":"г","t":"Только тропы и образность без фактов"}],"c":"в","e":"Ключ публицистики — двойная задача: сообщить факт И повлиять на читателя. Отсюда оценочность, риторические вопросы, призывы. Термины с безличностью — научный, клише — деловой, чистая образность — художественный. Верно третье."},{"id":"x-rus-t1-g18","k":"mc","les":null,"task":1,"q":"Определите стиль: «Каждый из нас может изменить город к лучшему. Начни с малого — не проходи мимо чужой беды!»","o":[{"id":"а","t":"Официально-деловой"},{"id":"б","t":"Публицистический"},{"id":"в","t":"Научный"},{"id":"г","t":"Разговорный"}],"c":"б","e":"1) Сфера — обращение к широкой аудитории; 2) прямое обращение ('каждый из нас', 'начни'); 3) призыв и восклицание с оценкой. Воздействие на читателя — публицистический стиль."},{"id":"x-rus-t1-g19","k":"mc","les":null,"task":1,"q":"Определите стиль: «Сегодня как никогда важно помнить: будущее планеты в наших руках. И этот выбор мы делаем каждый день.»","o":[{"id":"а","t":"Художественный"},{"id":"б","t":"Научный"},{"id":"в","t":"Публицистический"},{"id":"г","t":"Разговорный"}],"c":"в","e":"1) Сфера — общественно значимая тема (экология, будущее); 2) призывный, убеждающий тон; 3) оценочность и обращение к читателю ('в наших руках'). Это публицистический стиль."},{"id":"x-rus-t1-g20","k":"mc","les":null,"task":1,"q":"В каком фрагменте представлен ПУБЛИЦИСТИЧЕСКИЙ стиль?","o":[{"id":"а","t":"Скорость света в вакууме составляет около 300 000 км/с."},{"id":"б","t":"Доколе мы будем терпеть равнодушие? Общество обязано услышать голос каждого!"},{"id":"в","t":"Настоящим договором стороны определяют порядок расчётов."},{"id":"г","t":"Ветер трепал занавеску, и комната дышала прохладой."}],"c":"б","e":"Ищем текст, который убеждает и обращается к обществу. Вариант с риторическим вопросом 'Доколе мы будем терпеть...?' и призывом — публицистический. Остальные: научный факт, деловой документ, художественная зарисовка."},{"id":"x-rus-t1-g21","k":"mc","les":null,"task":1,"q":"Дан текст публицистического стиля. Какой его признак назван ВЕРНО: «Пока мы спорим, время уходит. Разве не пора объединиться?»?","o":[{"id":"а","t":"Строгая терминология"},{"id":"б","t":"Риторический вопрос и призыв к действию"},{"id":"в","t":"Канцелярские клише"},{"id":"г","t":"Отсутствие всякой оценки"}],"c":"б","e":"Проверяем текст: есть риторический вопрос ('Разве не пора...?') и скрытый призыв объединиться. Терминов и клише нет, оценка присутствует. Верный признак — риторический вопрос и призыв."},{"id":"x-rus-t1-g22","k":"mc","les":null,"task":1,"q":"Определите стиль: «Ты чего так поздно? Я уж вся испереживалась, звоню-звоню — не берёшь!»","o":[{"id":"а","t":"Публицистический"},{"id":"б","t":"Разговорный"},{"id":"в","t":"Художественный"},{"id":"г","t":"Официально-деловой"}],"c":"б","e":"1) Сфера — непринуждённый бытовой разговор; 2) разговорные слова ('уж', 'испереживалась'); 3) обращение к собеседнику, неполные предложения, эмоциональность. Это разговорный стиль."},{"id":"x-rus-t1-g23","k":"mc","les":"RU008","task":1,"q":"Определите стиль: «Да ладно тебе, не переживай! Подумаешь, тройка. В следующий раз пересдашь.»","o":[{"id":"а","t":"Разговорный"},{"id":"б","t":"Научный"},{"id":"в","t":"Официально-деловой"},{"id":"г","t":"Художественный"}],"c":"а","e":"1) Сфера — бытовое общение; 2) частицы и разговорные обороты ('да ладно', 'подумаешь'); 3) непринуждённость и обращение к собеседнику. Это разговорный стиль."},{"id":"x-rus-t1-g24","k":"mc","les":"RU008","task":1,"q":"Какой признак характерен для разговорного стиля?","o":[{"id":"а","t":"Термины и сложные предложения"},{"id":"б","t":"Канцелярские клише"},{"id":"в","t":"Частицы, неполные предложения, непринуждённость"},{"id":"г","t":"Развёрнутые метафоры и эпитеты"}],"c":"в","e":"Признаки разговорного стиля — непринуждённость, разговорная лексика, частицы, неполные предложения. Термины — научный, клише — деловой, метафоры — художественный. Верно третье."},{"id":"x-rus-t1-g25","k":"mc","les":null,"task":1,"q":"Определите стиль: «Слушай, а давай в выходные на дачу махнём? Шашлык, речка — красота!»","o":[{"id":"а","t":"Официально-деловой"},{"id":"б","t":"Разговорный"},{"id":"в","t":"Научный"},{"id":"г","t":"Публицистический"}],"c":"б","e":"1) Сфера — дружеская беседа; 2) разговорные слова ('махнём', 'красота'), обращение ('слушай'); 3) неполные предложения, эмоциональность. Это разговорный стиль."},{"id":"x-rus-t1-g26","k":"mc","les":"RU008","task":1,"q":"Определите стиль: «Ну ты даёшь! Я про это и думать забыл, а ты вон вспомнила.»","o":[{"id":"а","t":"Разговорный"},{"id":"б","t":"Художественный"},{"id":"в","t":"Научный"},{"id":"г","t":"Официально-деловой"}],"c":"а","e":"1) Сфера — бытовой диалог; 2) междометно-разговорные обороты ('ну ты даёшь'), частицы ('вон'); 3) непринуждённость и адресность. Это разговорный стиль."},{"id":"x-rus-t1-g27","k":"mc","les":"RU008","task":1,"q":"В каком фрагменте представлен РАЗГОВОРНЫЙ стиль?","o":[{"id":"а","t":"Испарение — переход вещества из жидкого состояния в газообразное."},{"id":"б","t":"Ой, забыла совсем! Ну надо же, вот голова дырявая."},{"id":"в","t":"Работник вправе обжаловать решение в установленном порядке."},{"id":"г","t":"Луна серебрила спящую гладь озера."}],"c":"б","e":"Ищем непринуждённую бытовую реплику. Вариант с 'Ой, забыла совсем! Ну надо же, вот голова дырявая' содержит междометие, частицы и разговорную оценку — разговорный стиль. Остальные: научное определение, деловая норма, художественный образ."},{"id":"x-rus-t1-g28","k":"mc","les":"RU008","task":1,"q":"Дан текст разговорного стиля. Какая характеристика ему подходит: «Да брось ты, ерунда всё это, забудь!»?","o":[{"id":"а","t":"Точность и стандартизированность"},{"id":"б","t":"Непринуждённость, частицы, эмоциональность"},{"id":"в","t":"Строгая логика и термины"},{"id":"г","t":"Общественно-политическая лексика"}],"c":"б","e":"Проверяем текст: частицы ('да', 'ты'), разговорное слово 'ерунда', эмоциональный совет. Ни точности документа, ни терминов, ни общественной лексики нет. Подходит характеристика 'непринуждённость, частицы, эмоциональность'."},{"id":"x-rus-t1-g29","k":"mc","les":null,"task":1,"q":"Определите стиль: «Золотые листья кружились в прощальном танце, и осень тихо шептала лесу свою печальную песню.»","o":[{"id":"а","t":"Научный"},{"id":"б","t":"Художественный"},{"id":"в","t":"Официально-деловой"},{"id":"г","t":"Разговорный"}],"c":"б","e":"1) Сфера — литература; 2) тропы: эпитет 'золотые', метафора 'прощальный танец', олицетворение 'осень шептала'; 3) цель — создать образ и настроение. Это художественный стиль."},{"id":"x-rus-t1-g30","k":"mc","les":null,"task":1,"q":"Определите стиль: «Море дышало спокойно и ровно, а на горизонте таяли последние розовые отблески заката.»","o":[{"id":"а","t":"Художественный"},{"id":"б","t":"Научный"},{"id":"в","t":"Публицистический"},{"id":"г","t":"Разговорный"}],"c":"а","e":"1) Сфера — художественный текст; 2) олицетворение 'море дышало', эпитеты 'розовые отблески', образ 'таяли'; 3) эстетическая цель — нарисовать картину. Это художественный стиль."},{"id":"x-rus-t1-g31","k":"mc","les":null,"task":1,"q":"Какой признак отличает художественный стиль от остальных?","o":[{"id":"а","t":"Стандартные клише"},{"id":"б","t":"Термины и безличность"},{"id":"в","t":"Образность, созданная тропами (эпитеты, метафоры, сравнения)"},{"id":"г","t":"Риторические вопросы к обществу"}],"c":"в","e":"Ядро художественного стиля — образ, создаваемый тропами: эпитетами, метафорами, сравнениями, олицетворениями. Клише — деловой, термины — научный, риторические вопросы — публицистический. Верно третье."},{"id":"x-rus-t1-g32","k":"mc","les":null,"task":1,"q":"Определите стиль: «Ночь укутала деревню чёрным бархатом, и только одинокий фонарь дрожал, будто испуганный светлячок.»","o":[{"id":"а","t":"Разговорный"},{"id":"б","t":"Художественный"},{"id":"в","t":"Научный"},{"id":"г","t":"Официально-деловой"}],"c":"б","e":"1) Сфера — литература; 2) метафора 'чёрный бархат', олицетворение 'фонарь дрожал', сравнение 'будто светлячок'; 3) цель — образ и настроение. Это художественный стиль."},{"id":"x-rus-t1-g33","k":"mc","les":null,"task":1,"q":"Определите стиль: «Река несла свои воды лениво и важно, словно старик, которому некуда спешить.»","o":[{"id":"а","t":"Художественный"},{"id":"б","t":"Публицистический"},{"id":"в","t":"Научный"},{"id":"г","t":"Разговорный"}],"c":"а","e":"1) Сфера — художественный текст; 2) олицетворение и сравнение 'словно старик', эпитеты 'лениво и важно'; 3) эстетическая, образная цель. Это художественный стиль."},{"id":"x-rus-t1-g34","k":"mc","les":null,"task":1,"q":"В каком фрагменте представлен ХУДОЖЕСТВЕННЫЙ стиль?","o":[{"id":"а","t":"Скорость реакции зависит от концентрации реагентов."},{"id":"б","t":"Заявление рассматривается в установленный срок."},{"id":"в","t":"Заря румянила восток, и роса горела на траве алмазами."},{"id":"г","t":"Ну ты чего, обиделся, что ли?"}],"c":"в","e":"Ищем текст с образностью и тропами. Вариант 'Заря румянила восток, и роса горела на траве алмазами' содержит олицетворение и метафору — художественный стиль. Остальные: научный факт, деловая норма, разговорная реплика."},{"id":"x-rus-t1-g35","k":"mc","les":null,"task":1,"q":"Дан текст художественного стиля. Что доказывает эту принадлежность: «Ветер гладил поля, и колосья кланялись солнцу»?","o":[{"id":"а","t":"Наличие терминов и цифр"},{"id":"б","t":"Олицетворения и образность ('ветер гладил', 'колосья кланялись')"},{"id":"в","t":"Канцелярские клише"},{"id":"г","t":"Риторический вопрос"}],"c":"б","e":"Проверяем текст: 'ветер гладил', 'колосья кланялись' — олицетворения, создающие образ. Терминов, клише и вопросов нет. Принадлежность доказывают олицетворения и образность."},{"id":"x-rus-t1-g36","k":"mc","les":null,"task":1,"q":"Верно или неверно: «В научном стиле широко используется эмоционально-оценочная лексика и восклицательные предложения.»","o":[{"id":"а","t":"Верно"},{"id":"б","t":"Неверно"}],"c":"б","e":"Вспоминаем признаки научного стиля: точность, логичность, термины, безличность, отсутствие эмоций. Эмоционально-оценочная лексика и восклицания ему НЕ свойственны (это черты публицистики и разговорной речи). Утверждение неверно."},{"id":"x-rus-t1-g37","k":"mc","les":null,"task":1,"q":"Верно или неверно: «Для официально-делового стиля характерны стандартные обороты (клише) и отсутствие тропов.»","o":[{"id":"а","t":"Верно"},{"id":"б","t":"Неверно"}],"c":"а","e":"Признаки делового стиля: клише ('в соответствии с', 'настоящим'), стандартность, точность, отсутствие образности и эмоций. Всё это совпадает с утверждением. Значит, верно."},{"id":"x-rus-t1-g38","k":"mc","les":null,"task":1,"q":"Верно или неверно: «Риторические вопросы, призывы и оценочность типичны для публицистического стиля.»","o":[{"id":"а","t":"Верно"},{"id":"б","t":"Неверно"}],"c":"а","e":"Публицистика решает двойную задачу — информировать и воздействовать, поэтому опирается на риторические вопросы, призывы и оценку. Утверждение соответствует признакам стиля — верно."},{"id":"x-rus-t1-g39","k":"mc","les":"RU008","task":1,"q":"Верно или неверно: «Разговорный стиль отличается обилием терминов и сложными развёрнутыми предложениями.»","o":[{"id":"а","t":"Верно"},{"id":"б","t":"Неверно"}],"c":"б","e":"Признаки разговорного стиля — простые и неполные предложения, разговорная лексика, частицы, непринуждённость. Термины и сложный синтаксис — черты научного стиля. Значит, утверждение неверно."},{"id":"x-rus-t1-g40","k":"mc","les":null,"task":1,"q":"Верно или неверно: «Основная функция художественного стиля — точная передача правовых норм.»","o":[{"id":"а","t":"Верно"},{"id":"б","t":"Неверно"}],"c":"б","e":"Функция художественного стиля — эстетическое воздействие через образ. Точная передача правовых норм — задача официально-делового стиля. Признаки перепутаны, поэтому утверждение неверно."},{"id":"x-rus-t1-g41","k":"mc","les":null,"task":1,"q":"Верно или неверно: «Использование терминов и стремление к объективности характерны для научного стиля.»","o":[{"id":"а","t":"Верно"},{"id":"б","t":"Неверно"}],"c":"а","e":"Термины, точность и объективность (безличность, отсутствие эмоций) — ключевые признаки научного стиля. Утверждение полностью соответствует им — верно."},{"id":"x-rus-t1-g42","k":"mc","les":null,"task":1,"q":"Какое утверждение о признаках стилей ВЕРНО?","o":[{"id":"а","t":"В научном стиле уместны просторечия и междометия."},{"id":"б","t":"В официально-деловом стиле используются стандартные клише и не допускаются разночтения."},{"id":"в","t":"Публицистический стиль избегает любой оценки и эмоций."},{"id":"г","t":"В художественном стиле запрещено использовать средства других стилей."}],"c":"б","e":"Проверяем каждое: просторечия чужды научному стилю (неверно); публицистика опирается на оценку (неверно); художественный стиль как раз свободно берёт средства любых стилей (неверно). Верно только про деловой стиль: клише и отсутствие разночтений."},{"id":"x-rus-t1-g43","k":"mc","les":null,"task":1,"q":"Дан художественный текст с метафорами и эпитетами. Какое утверждение о нём ВЕРНО?","o":[{"id":"а","t":"Он выполняет прежде всего эстетическую функцию, создавая образ."},{"id":"б","t":"Он предназначен для точного регулирования правовых отношений."},{"id":"в","t":"Его главная черта — терминологичность и безличность."},{"id":"г","t":"Он строится на канцелярских клише."}],"c":"а","e":"Метафоры и эпитеты работают на образ и эстетику — это функция художественного стиля. Правовое регулирование — деловой стиль, терминологичность — научный, клише — деловой. Верно первое утверждение."},{"id":"x-rus-t2-g01","k":"mc","les":"RU011","task":2,"q":"Учёные предполагали, что эксперимент займёт несколько лет. (…) результат был получен уже через месяц.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Поэтому"},{"id":"б","t":"Однако"},{"id":"в","t":"Кроме того"},{"id":"г","t":"Например"}],"c":"б","e":"Как прийти к ответу: во втором предложении факт противоречит ожиданию из первого (ждали годы — вышло за месяц). Подставляем «но» — смысл сохраняется, значит это противопоставление. Подходит «Однако». «Поэтому» (следствие), «Кроме того» (добавление), «Например» (пример) логику контраста не передают."},{"id":"x-rus-t2-g02","k":"mc","les":"RU011","task":2,"q":"Билеты на спектакль стоили очень дорого. (…) зал был полон.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Тем не менее"},{"id":"б","t":"Поэтому"},{"id":"в","t":"Потому что"},{"id":"г","t":"Во-первых"}],"c":"а","e":"Как прийти к ответу: результат идёт вопреки ожиданию (дорого — а зал всё равно полон). Это уступка. Подставляем «но» — подходит. «Тем не менее» = «несмотря на это». «Поэтому» дало бы обратный смысл (пустой зал), «потому что» вводит причину, «во-первых» — перечисление."},{"id":"x-rus-t2-g03","k":"mc","les":"RU011","task":2,"q":"В горах было холодно и дул пронизывающий ветер. (…) вид с вершины окупал все трудности.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Зато"},{"id":"б","t":"Следовательно"},{"id":"в","t":"Также"},{"id":"г","t":"Во-первых"}],"c":"а","e":"Как прийти к ответу: недостаток (холод, ветер) возмещается плюсом (прекрасный вид). Именно оттенок компенсации передаёт «зато». «Следовательно» — вывод, «также» — добавление, «во-первых» — порядок."},{"id":"x-rus-t2-g04","k":"mc","les":"RU011","task":2,"q":"Все ждали от него резкого ответа. (…) он спокойно улыбнулся.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Напротив"},{"id":"б","t":"Поэтому"},{"id":"в","t":"Кроме того"},{"id":"г","t":"Итак"}],"c":"а","e":"Как прийти к ответу: поведение оказалось прямо обратным ожиданию (ждали резкость — получили спокойствие). Полную противоположность подчёркивает «напротив». «Поэтому/итак» — вывод, «кроме того» — добавление."},{"id":"x-rus-t2-g05","k":"mc","les":"RU011","task":2,"q":"Прибор исправно работал много лет. (…) недавно он стал давать сбои.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Однако"},{"id":"б","t":"Поэтому"},{"id":"в","t":"Ведь"},{"id":"г","t":"Таким образом"}],"c":"а","e":"Как прийти к ответу: второе предложение вводит новый факт, идущий вразрез с первым (работал — стал ломаться). Проверка «но» проходит. «Ведь» — причина, «поэтому/таким образом» — следствие, здесь их нет."},{"id":"x-rus-t2-g06","k":"mc","les":"RU011","task":2,"q":"В каком случае на месте пропуска уместно слово ЗАТО (недостаток возмещается плюсом)?","o":[{"id":"а","t":"Дорога была долгой и утомительной. (…) мы увидели редчайший водопад."},{"id":"б","t":"Он много готовился к экзамену. (…) сдал его на отлично."},{"id":"в","t":"Начался дождь. (…) мы раскрыли зонты."}],"c":"а","e":"Как прийти к ответу: «зато» уместно там, где минус компенсируется плюсом. В первом пункте усталость от дороги «окупается» редким водопадом — это компенсация. Во втором — следствие («поэтому»), в третьем — тоже следствие."},{"id":"x-rus-t2-g07","k":"mc","les":"RU011","task":2,"q":"Дан ответ: ОДНАКО. Какое объяснение выбора верно?","o":[{"id":"а","t":"Второе предложение содержит вывод из первого."},{"id":"б","t":"Второе предложение противопоставлено первому: в нём факт, идущий вопреки ожиданию."},{"id":"в","t":"Второе предложение указывает причину того, о чём говорится в первом."},{"id":"г","t":"Второе предложение добавляет ещё один однородный аргумент."}],"c":"б","e":"Как прийти к ответу: «однако» — противительная связка. Её роль — ввести факт, противоречащий сказанному ранее или ожидаемому. Это второй вариант. Остальные описывают следствие, причину и добавление — другие типы связи."},{"id":"x-rus-t2-g08","k":"mc","les":"RU011","task":2,"q":"Дорогу занесло снегом. (…) движение автобусов пришлось отменить.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Поэтому"},{"id":"б","t":"Однако"},{"id":"в","t":"Например"},{"id":"г","t":"Ведь"}],"c":"а","e":"Как прийти к ответу: второе предложение — прямой результат первого (занесло дорогу — значит, отменили движение). Подставляем «поэтому» — подходит. «Однако» дало бы контраст, «ведь» — причину, «например» — пример."},{"id":"x-rus-t2-g09","k":"mc","les":"RU011","task":2,"q":"Все свидетели дали одинаковые показания. (…) их рассказу можно верить.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Следовательно"},{"id":"б","t":"Напротив"},{"id":"в","t":"Кроме того"},{"id":"г","t":"Во-первых"}],"c":"а","e":"Как прийти к ответу: второе предложение — логический вывод из первого (совпали показания — значит, можно верить). Строгий вывод вводит «следовательно». «Напротив» — противопоставление, «кроме того» — добавление, «во-первых» — порядок."},{"id":"x-rus-t2-g10","k":"mc","les":"RU011","task":2,"q":"Мы взвесили все доводы за и против. (…), решение было принято единогласно.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Таким образом"},{"id":"б","t":"Однако"},{"id":"в","t":"Ведь"},{"id":"г","t":"Например"}],"c":"а","e":"Как прийти к ответу: второе предложение подводит итог рассуждению. Обобщающий вывод в конце вводит «таким образом» (= «в итоге»). «Однако» — контраст, «ведь» — причина, «например» — пример."},{"id":"x-rus-t2-g11","k":"mc","les":"RU011","task":2,"q":"Он совсем не готовился к контрольной. (…) получил низкую оценку.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"поэтому"},{"id":"б","t":"однако"},{"id":"в","t":"зато"},{"id":"г","t":"то есть"}],"c":"а","e":"Как прийти к ответу: низкая оценка — прямое следствие того, что не готовился. Проверка «поэтому» проходит. «Однако» и «зато» вводили бы противоположный (неожиданно хороший) результат, «то есть» — пояснение."},{"id":"x-rus-t2-g12","k":"mc","les":"RU011","task":2,"q":"Свет от далёких звёзд идёт к нам многие годы. (…), мы видим их такими, какими они были в прошлом.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Значит"},{"id":"б","t":"Наоборот"},{"id":"в","t":"Кроме того"},{"id":"г","t":"Ведь"}],"c":"а","e":"Как прийти к ответу: второе предложение — вывод из первого («что из этого следует?»). «Значит» = «следовательно». «Наоборот» — противопоставление, «кроме того» — добавление, «ведь» — причина."},{"id":"x-rus-t2-g13","k":"mc","les":"RU011","task":2,"q":"В каком случае на месте пропуска нужно слово со значением СЛЕДСТВИЯ (вывода)?","o":[{"id":"а","t":"Урожай в этом году богатый. (…) лето было тёплым и дождливым."},{"id":"б","t":"Лето было тёплым и дождливым. (…) урожай в этом году богатый."},{"id":"в","t":"Урожай богатый. (…) собрать его в срок непросто."}],"c":"б","e":"Как прийти к ответу: следствие — это когда сначала причина, потом результат. Во втором пункте «тёплое лето → богатый урожай» (поэтому). В первом порядок обратный — там нужна причина («ведь»). Третий — противопоставление/добавление."},{"id":"x-rus-t2-g14","k":"mc","les":"RU011","task":2,"q":"Дан ответ: ТАКИМ ОБРАЗОМ. Что оно выражает?","o":[{"id":"а","t":"Обобщающий вывод из всего сказанного ранее."},{"id":"б","t":"Противопоставление."},{"id":"в","t":"Причину."},{"id":"г","t":"Пример к сказанному."}],"c":"а","e":"Как прийти к ответу: «таким образом» подытоживает рассуждение, подводит общий итог. Это обобщающий вывод. Остальные значения передаются другими связками (однако; ведь; например)."},{"id":"x-rus-t2-g15","k":"mc","les":"RU011","task":2,"q":"Не стоит удивляться его победе. (…) он тренировался каждый день много лет.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Ведь"},{"id":"б","t":"Однако"},{"id":"в","t":"Поэтому"},{"id":"г","t":"Кроме того"}],"c":"а","e":"Как прийти к ответу: задаём к первому предложению вопрос «почему не удивляться?» — второе отвечает (потому что тренировался). Причину вводит «ведь». «Поэтому» дало бы обратный порядок (следствие), «однако» — контраст."},{"id":"x-rus-t2-g16","k":"mc","les":"RU011","task":2,"q":"В жару растения поливают чаще обычного. (…) влага в это время испаряется особенно быстро.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Ведь"},{"id":"б","t":"Зато"},{"id":"в","t":"Следовательно"},{"id":"г","t":"Например"}],"c":"а","e":"Как прийти к ответу: второе объясняет, почему поливают чаще (влага быстро испаряется). Это причина — «ведь». «Следовательно» — вывод (обратная логика), «зато» — компенсация, «например» — пример."},{"id":"x-rus-t2-g17","k":"mc","les":"RU011","task":2,"q":"Я сегодня останусь дома. (…) на улице сильный ливень.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Ведь"},{"id":"б","t":"Поэтому"},{"id":"в","t":"Однако"},{"id":"г","t":"Значит"}],"c":"а","e":"Как прийти к ответу: спрашиваем «почему останусь дома?» — ответ во втором предложении (ливень). Это причина, вводится «ведь». Ловушка «поэтому»: оно потребовало бы обратного порядка (сначала ливень, потом решение)."},{"id":"x-rus-t2-g18","k":"mc","les":"RU011","task":2,"q":"Малыш уснул мгновенно, едва коснувшись подушки. (…) за день он очень набегался и устал.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Ведь"},{"id":"б","t":"Однако"},{"id":"в","t":"Кроме того"},{"id":"г","t":"Наоборот"}],"c":"а","e":"Как прийти к ответу: второе предложение объясняет причину быстрого сна (устал за день). Вопрос «почему уснул?» → ответ. Значит, «ведь». Остальные варианты дают контраст или добавление, а не причину."},{"id":"x-rus-t2-g19","k":"mc","les":"RU011","task":2,"q":"Экскурсию пришлось перенести на другой день. Дело в том, (…) экскурсовод внезапно заболел.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"что"},{"id":"б","t":"как"},{"id":"в","t":"чтобы"},{"id":"г","t":"если"}],"c":"а","e":"Как прийти к ответу: устойчивая связка причины «дело в том, что…» требует союза «что». Он присоединяет объяснение причины (заболел экскурсовод). «Как/чтобы/если» разрушают конструкцию."},{"id":"x-rus-t2-g20","k":"mc","les":"RU011","task":2,"q":"В каком варианте пропуск требует слова со значением ПРИЧИНЫ?","o":[{"id":"а","t":"Стемнело. (…) мы зажгли фонари."},{"id":"б","t":"Мы зажгли фонари. (…) уже совсем стемнело."},{"id":"в","t":"Стемнело. (…) заметно похолодало."}],"c":"б","e":"Как прийти к ответу: причина отвечает на «почему?». Во втором пункте «почему зажгли фонари? — ведь стемнело» (сначала итог, потом объяснение). В первом — следствие («поэтому»), в третьем — добавление."},{"id":"x-rus-t2-g21","k":"mc","les":"RU011","task":2,"q":"Дан ответ: ВЕДЬ. Какое объяснение верно?","o":[{"id":"а","t":"Вто
