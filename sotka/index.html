дные обстоятельства (как говорила?). Союза между ними нет, только перечислительная интонация. Значит, ставим запятую. Ответ: нужна."},{"id":"x-rus-t16-g03","k":"mc","les":"RU046","task":16,"q":"Ветер срывал с деревьев листья ( ) гнал их по дороге.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Срывал, гнал — однородные сказуемые при подлежащем «ветер». Союза между ними нет. Проверяем: перечисление без союза — запятая обязательна. Ответ: нужна."},{"id":"x-rus-t16-g04","k":"mc","les":"RU046","task":16,"q":"На поляне цвели ромашки ( ) колокольчики ( ) незабудки.","o":[{"id":"а","t":"Запятая нужна на обоих местах"},{"id":"б","t":"Запятая не нужна нигде"},{"id":"в","t":"Запятая нужна только на первом месте"}],"c":"а","e":"Ромашки, колокольчики, незабудки — однородные подлежащие. Между ними нет союзов (чистое перечисление), поэтому на каждом стыке ставится запятая. Ответ: нужна на обоих местах."},{"id":"x-rus-t16-g05","k":"mc","les":"RU046","task":16,"q":"Мы долго бродили по берегу ( ) любовались тихим закатом.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Бродили, любовались — однородные сказуемые при подлежащем «мы». Союз отсутствует. Как приходим к ответу: нашли однородные — проверили союз — союза нет — ставим запятую. Ответ: нужна."},{"id":"x-rus-t16-g06","k":"mc","les":"RU046","task":16,"q":"В каком предложении запятая между однородными членами поставлена ВЕРНО?","o":[{"id":"а","t":"Птицы пели, и порхали над водой."},{"id":"б","t":"Птицы пели, порхали над водой."},{"id":"в","t":"Птицы, пели порхали над водой."}],"c":"б","e":"Верный вариант — второй: «пели, порхали» — два однородных сказуемых без союза, запятая между ними обязательна. В первом варианте союз И одиночный, перед ним запятая не нужна. В третьем запятая стоит внутри основы — грубая ошибка."},{"id":"x-rus-t16-g07","k":"mc","les":"RU046","task":16,"q":"Дано: в предложении «Дети смеялись ( ) шумели ( ) бегали по двору» на месте пропусков нужны запятые. Какое правило это объясняет?","o":[{"id":"а","t":"Однородные сказуемые связаны без союзов"},{"id":"б","t":"Повторяющийся союз и…и"},{"id":"в","t":"Двойной союз как…так и"},{"id":"г","t":"Это ССП с разными подлежащими"}],"c":"а","e":"Смеялись, шумели, бегали — однородные сказуемые, соединённые только интонацией (никаких союзов). Именно перечисление без союзов требует запятой на каждом стыке. Ответ: однородные без союза."},{"id":"x-rus-t16-g08","k":"mc","les":"RU046","task":16,"q":"Я купил в магазине хлеб ( ) и молоко.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"Хлеб и молоко — однородные дополнения. Союз И одиночный (не повторяется) и соединяет их. Перед одиночным соединительным И запятая не ставится. Ответ: не нужна."},{"id":"x-rus-t16-g09","k":"mc","les":"RU046","task":16,"q":"Небо к вечеру стало чистым ( ) и прозрачным.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"Чистым, прозрачным — однородные определения-сказуемые, соединены одиночным И. Проверяем: союз один, соединяет однородные — значит запятой перед ним нет. Ответ: не нужна."},{"id":"x-rus-t16-g10","k":"mc","les":"RU046","task":16,"q":"Пойдём мы сегодня в парк ( ) или останемся дома?","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"Пойдём, останемся — однородные сказуемые при подлежащем «мы» (одна основа), соединены одиночным ИЛИ. Перед одиночным разделительным ИЛИ запятая не ставится. Ответ: не нужна."},{"id":"x-rus-t16-g11","k":"mc","les":null,"task":16,"q":"Дед сидел на крыльце ( ) да покуривал трубку.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"Заменяем ДА на И: «сидел и покуривал» — смысл сохранился, значит ДА(=и), соединительный и одиночный. Перед ним запятая не нужна. Ответ: не нужна."},{"id":"x-rus-t16-g12","k":"mc","les":"RU046","task":16,"q":"Он тихо открыл дверь ( ) и вошёл в комнату.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"Открыл, вошёл — однородные сказуемые при одном подлежащем «он» (одна основа!). Союз И одиночный. Это НЕ ССП, а однородные члены, поэтому запятая перед И не ставится. Ответ: не нужна."},{"id":"x-rus-t16-g13","k":"mc","les":"RU046","task":16,"q":"В каком предложении перед союзом И запятая НЕ нужна?","o":[{"id":"а","t":"Стемнело, и зажглись фонари."},{"id":"б","t":"Он взял книгу и сел читать."},{"id":"в","t":"Ветер стих, и наступила тишина."}],"c":"б","e":"Во втором предложении И соединяет однородные сказуемые «взял, сел» при одном подлежащем «он» — запятой нет. В первом и третьем — две разные основы (ССП), поэтому там запятая нужна. Ответ: второй вариант."},{"id":"x-rus-t16-g14","k":"mc","les":null,"task":16,"q":"В предложении «Мал золотник ( ) да дорог» запятая НУЖНА. Почему?","o":[{"id":"а","t":"ДА = И, соединительный союз"},{"id":"б","t":"ДА = НО, противительный союз"},{"id":"в","t":"Это повторяющийся союз"},{"id":"г","t":"Это двойной союз"}],"c":"б","e":"Заменяем ДА на И: «мал да дорог» → «мал и дорог» — смысл искажается, здесь противопоставление, значит ДА = НО. Перед противительным союзом (но, а, да=но) запятая ставится всегда. Ответ: ДА = НО."},{"id":"x-rus-t16-g15","k":"mc","les":null,"task":16,"q":"И днём ( ) и ночью за окном шумел осенний дождь.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Союз И повторяется: и днём — и ночью. Перед первым И запятой нет, а перед вторым (повторяющимся) она ставится. Ответ: нужна."},{"id":"x-rus-t16-g16","k":"mc","les":"RU046","task":16,"q":"Ни звёзд ( ) ни луны не было видно на тёмном небе.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Союз НИ…НИ повторяющийся. Однородные члены «звёзд», «луны» соединены повторяющимся союзом, поэтому перед вторым НИ ставим запятую. Ответ: нужна."},{"id":"x-rus-t16-g17","k":"mc","les":"RU046","task":16,"q":"То накрапывал мелкий дождь ( ) то падал редкий снег.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Союз ТО…ТО повторяется. Перед вторым ТО ставится запятая (как при любом повторяющемся союзе между однородными). Ответ: нужна."},{"id":"x-rus-t16-g18","k":"mc","les":"RU046","task":16,"q":"Мальчик читал в поезде либо газеты ( ) либо старые журналы.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Союз ЛИБО…ЛИБО повторяющийся. Однородные дополнения «газеты», «журналы». Перед вторым ЛИБО ставим запятую. Ответ: нужна."},{"id":"x-rus-t16-g19","k":"mc","les":null,"task":16,"q":"В сосновом бору пахло и хвоей ( ) и грибами ( ) и прогретой смолой.","o":[{"id":"а","t":"Запятая нужна на обоих местах"},{"id":"б","t":"Запят1ая не нужна нигде"},{"id":"в","t":"Запятая нужна только на первом месте"}],"c":"а","e":"Союз И повторяется трижды (и…и…и). Перед самым первым И запятой нет, а перед каждым последующим повторяющимся И запятая ставится. Значит, на обоих пропусках нужна запятая. Ответ: на обоих местах."},{"id":"x-rus-t16-g20","k":"mc","les":null,"task":16,"q":"В каком предложении запятая при повторяющемся союзе поставлена ВЕРНО?","o":[{"id":"а","t":"И лес, и поле укрыл пушистый снег."},{"id":"б","t":"И лес и поле, укрыл пушистый снег."},{"id":"в","t":"И, лес и поле укрыл пушистый снег."}],"c":"а","e":"Верный вариант — первый: запятая стоит перед вторым И (и лес, и поле). Во втором варианте запятая отрывает подлежащие от сказуемого — ошибка. В третьем запятая после первого И недопустима. Ответ: первый вариант."},{"id":"x-rus-t16-g21","k":"mc","les":"RU046","task":16,"q":"Дано: во фразе «Ни рыба ( ) ни мясо» на месте пропуска нужна запятая. Какое это правило?","o":[{"id":"а","t":"Повторяющийся союз ни…ни"},{"id":"б","t":"Одиночный союз"},{"id":"в","t":"Двойной союз не только…но и"},{"id":"г","t":"Однородные без союза"}],"c":"а","e":"НИ…НИ — классический повторяющийся союз. Между однородными членами при повторяющемся союзе запятая ставится перед вторым НИ. Ответ: повторяющийся союз."},{"id":"x-rus-t16-g22","k":"mc","les":null,"task":16,"q":"Он одинаково хорошо знал как русский язык ( ) так и литературу.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Двойной союз КАК…ТАК И. Запятая в двойном союзе ставится перед второй частью — перед ТАК И. Ответ: нужна."},{"id":"x-rus-t16-g23","k":"mc","les":null,"task":16,"q":"Наша соседка была не только приветлива ( ) но и очень добра.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Двойной союз НЕ ТОЛЬКО…НО И. Запятая ставится один раз — перед второй частью НО И. Перед «не только» запятой нет. Ответ: нужна."},{"id":"x-rus-t16-g24","k":"mc","les":null,"task":16,"q":"Приходи к нам не столько ради угощения ( ) сколько ради беседы.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Двойной союз НЕ СТОЛЬКО…СКОЛЬКО. Запятая ставится перед второй частью — перед СКОЛЬКО. Ответ: нужна."},{"id":"x-rus-t16-g25","k":"mc","les":"RU046","task":16,"q":"Как в большом городе ( ) так и в глухой деревне люди ждали первого снега.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Двойной союз КАК…ТАК И связывает однородные обстоятельства. Запятая ставится перед второй частью ТАК И. Ответ: нужна."},{"id":"x-rus-t16-g26","k":"mc","les":"RU046","task":16,"q":"Ученик не только прочитал повесть ( ) но и подробно её пересказал.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Двойной союз НЕ ТОЛЬКО…НО И соединяет однородные сказуемые. По правилу запятая ставится перед второй частью НО И. Ответ: нужна."},{"id":"x-rus-t16-g27","k":"mc","les":null,"task":16,"q":"В каком предложении запятая при двойном союзе поставлена ВЕРНО?","o":[{"id":"а","t":"Не только взрослые, но и дети радовались снегу."},{"id":"б","t":"Не только, взрослые но и дети радовались снегу."},{"id":"в","t":"Не только взрослые но и, дети радовались снегу."}],"c":"а","e":"Верный вариант — первый: запятая стоит перед второй частью союза (но и). Во втором и третьем вариантах запятая разрывает части союза не в том месте — это ошибка. Ответ: первый вариант."},{"id":"x-rus-t16-g28","k":"mc","les":null,"task":16,"q":"Где ставится единственная запятая в двойном союзе «как…так и»?","o":[{"id":"а","t":"Перед второй частью — перед «так и»"},{"id":"б","t":"Перед первой частью — перед «как»"},{"id":"в","t":"Не ставится вообще"},{"id":"г","t":"Перед обеими частями союза"}],"c":"а","e":"В любом двойном союзе (как…так и; не только…но и) запятая ставится один раз — перед второй частью. Значит, перед «так и». Перед «как» запятой нет. Ответ: перед «так и»."},{"id":"x-rus-t16-g29","k":"mc","les":"RU047","task":16,"q":"Наступила тихая ночь ( ) и на небе зажглись первые звёзды.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Две грамматические основы: «наступила ночь» и «зажглись звёзды» — разные подлежащие. Это ССП, общего члена нет. Значит, перед И ставим запятую. Ответ: нужна."},{"id":"x-rus-t16-g30","k":"mc","les":"RU047","task":16,"q":"Ветер к утру совсем утих ( ) и дождь наконец перестал.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Две основы: «ветер утих» и «дождь перестал». Подлежащие разные, части самостоятельные, общего члена нет. ССП — перед И запятая. Ответ: нужна."},{"id":"x-rus-t16-g31","k":"mc","les":null,"task":16,"q":"Прозвенел долгожданный звонок ( ) и ученики шумно вошли в класс.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Основы разные: «прозвенел звонок» и «ученики вошли». Это два самостоятельных предложения в составе ССП. Перед соединительным И между разными основами ставится запятая. Ответ: нужна."},{"id":"x-rus-t16-g32","k":"mc","les":null,"task":16,"q":"Я расскажу тебе одну историю ( ) а ты постарайся её запомнить.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Основы «я расскажу» и «ты постарайся» — разные подлежащия. Союз А (противительный) в ССП всегда требует запятой. Ответ: нужна."},{"id":"x-rus-t16-g33","k":"mc","les":null,"task":16,"q":"Учитель задал классу трудный вопрос ( ) но никто не смог ответить.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Две основы: «учитель задал» и «никто не смог ответить». Части ССП с разными подлежащими соединены союзом НО. Перед НО запятая ставится. Ответ: нужна."},{"id":"x-rus-t16-g34","k":"mc","les":"RU046","task":16,"q":"В каком предложении перед союзом И нужна запятая?","o":[{"id":"а","t":"Взошло солнце, и дружно запели птицы."},{"id":"б","t":"Он встал и молча подошёл к окну."},{"id":"в","t":"Скоро стемнеет и заметно похолодает."}],"c":"а","e":"В первом — две разные основы «взошло солнце» и «запели птицы» (ССП), запятая нужна. Во втором И соединяет однородные сказуемые при одном подлежащем. В третьем есть общий член «скоро». Ответ: первый вариант."},{"id":"x-rus-t16-g35","k":"mc","les":"RU047","task":16,"q":"Дано: в предложении «Сверкнула молния ( ) и грянул гром» запятая нужна. Почему?","o":[{"id":"а","t":"Две разные грамматические основы, общего члена нет"},{"id":"б","t":"Это однородные сказуемые"},{"id":"в","t":"Есть общий второстепенный член"},{"id":"г","t":"Это двойной союз"}],"c":"а","e":"«Сверкнула молния» и «грянул гром» — две самостоятельные основы с разными подлежащими, общего второстепенного члена или вводного слова нет. Это ССП, поэтому перед И ставится запятая. Ответ: две разные основы без общего члена."},{"id":"x-rus-t16-g36","k":"mc","les":"RU047","task":16,"q":"Вечером заметно похолодало ( ) и пошёл мокрый снег.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"Две основы: «похолодало» и «пошёл снег». Но в начале стоит общий второстепенный член «вечером» (когда?), он относится к обеим частям. При общем члене запятая перед И не ставится. Ответ: не нужна."},{"id":"x-rus-t16-g37","k":"mc","les":"RU047","task":16,"q":"К утру ветер совсем стих ( ) и море успокоилось.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"Общий второстепенный член «к утру» (когда?) относится и к «ветер стих», и к «море успокоилось». Есть общий член — запятую перед И не ставим. Ответ: не нужна."},{"id":"x-rus-t16-g38","k":"mc","les":"RU047","task":16,"q":"Скоро прозвенит звонок ( ) и начнётся первый урок.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"Обе части относятся к общему обстоятельству «скоро» (когда?). Проверяем: общий второстепенный член есть — значит запятая перед И не нужна. Ответ: не нужна."},{"id":"x-rus-t16-g39","k":"mc","les":"RU047","task":16,"q":"В деревне у бабушки пахло свежим сеном ( ) и звонко пели петухи.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"Общий второстепенный член «в деревне у бабушки» (где?) относится к обеим частям ССП. При общем члене запятая перед И не ставится. Ответ: не нужна."},{"id":"x-rus-t16-g40","k":"mc","les":null,"task":16,"q":"К счастью, гроза быстро прошла ( ) и снова выглянуло солнце.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"Вводное слово «к счастью» общее для обеих частей ССП. При общем вводном слове запятая перед И не ставится (запятая после «к счастью» — это выделение вводного, а не разделение частей). Ответ: не нужна."},{"id":"x-rus-t16-g41","k":"mc","les":"RU047","task":16,"q":"В каком предложении перед союзом И запятая НЕ нужна?","o":[{"id":"а","t":"Осенью рано темнеет и часто идут дожди."},{"id":"б","t":"Стемнело, и в окнах зажглись огни."},{"id":"в","t":"Пошёл ливень, и все разбежались."}],"c":"а","e":"В первом предложении общий член «осенью» (когда?) относится к обеим частям — запятая не нужна. Во втором и третьем общего члена нет, это обычные ССП с разными основами, там запятая нужна. Ответ: первый вариант."},{"id":"x-rus-t16-g42","k":"mc","les":"RU047","task":16,"q":"Дано: в предложении «По вечерам зажигались фонари ( ) и играла музыка» запятая НЕ нужна. Почему?","o":[{"id":"а","t":"Есть общий второстепенный член «по вечерам»"},{"id":"б","t":"Это однородные члены"},{"id":"в","t":"Это повторяющийся союз"},{"id":"г","t":"Разные подлежащие без общего члена"}],"c":"а","e":"Основы разные («зажигались фонари» и «играла музыка»), но их объединяет общее обстоятельство «по вечерам» (когда?). При общем второстепенном члене запятая перед И не ставится. Ответ: есть общий член «по вечерам»."},{"id":"x-rus-t17-g01","k":"mc","les":"RU056","task":17,"q":"Тропинка (1) ведущая к реке (2) заросла густой травой. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"1 и 2"},{"id":"б","t":"только 1"},{"id":"в","t":"только 2"},{"id":"г","t":"запятые не нужны"}],"c":"а","e":"Как прийти к ответу: определяемое слово 'тропинка' стоит ПЕРЕД оборотом 'ведущая к реке'. Оборот после определяемого слова обособляется с двух сторон → запятые на местах 1 и 2."},{"id":"x-rus-t17-g02","k":"mc","les":"RU056","task":17,"q":"Освещённая ярким солнцем (1) поляна (2) казалась золотой. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"1 и 2"},{"id":"б","t":"только 1"},{"id":"в","t":"только 2"},{"id":"г","t":"запятые не нужны"}],"c":"г","e":"Как прийти к ответу: оборот 'освещённая ярким солнцем' стоит ПЕРЕД определяемым словом 'поляна'. Оборот перед определяемым словом не обособляется → запятые не нужны."},{"id":"x-rus-t17-g03","k":"mc","les":"RU048","task":17,"q":"Взволнованный неожиданной вестью (1) он (2) долго не мог заснуть. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"только 1"},{"id":"б","t":"только 2"},{"id":"в","t":"1 и 2"},{"id":"г","t":"запятые не нужны"}],"c":"а","e":"Как прийти к ответу: определяемое слово — личное местоимение 'он'. При личном местоимении причастный оборот обособляется ВСЕГДА, даже если стоит перед ним → запятая на месте 1. На месте 2 запятой нет, потому что оборот закончился до местоимения."},{"id":"x-rus-t17-g04","k":"mc","les":"RU056","task":17,"q":"Дом (1) построенный на высоком холме (2) виден издалека. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"1 и 2"},{"id":"б","t":"только 1"},{"id":"в","t":"только 2"},{"id":"г","t":"запятые не нужны"}],"c":"а","e":"Как прийти к ответу: определяемое слово 'дом' стоит перед оборотом 'построенный на высоком холме'. Оборот после определяемого слова → обособляется с двух сторон, запятые 1 и 2."},{"id":"x-rus-t17-g05","k":"mc","les":"RU056","task":17,"q":"Уставшие от долгой жары (1) туристы (2) остановились на привал. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"запятые не нужны"},{"id":"б","t":"только 1"},{"id":"в","t":"только 2"},{"id":"г","t":"1 и 2"}],"c":"а","e":"Как прийти к ответу: оборот 'уставшие от долгой жары' стоит ПЕРЕД определяемым словом 'туристы'. Оборот перед существительным не обособляется → запятые не нужны."},{"id":"x-rus-t17-g06","k":"mc","les":"RU048","task":17,"q":"В каком предложении причастный оборот НЕ обособляется (запятые не нужны)?","o":[{"id":"а","t":"Ветер, налетевший внезапно, сорвал листья."},{"id":"б","t":"Налетевший внезапно ветер сорвал листья."},{"id":"в","t":"Она, испуганная громом, вздрогнула."},{"id":"г","t":"Мальчик, увлечённый игрой, не слышал зова."}],"c":"б","e":"Как прийти к ответу: ищем оборот ПЕРЕД определяемым словом. В варианте 2 'налетевший внезапно' стоит перед словом 'ветер' → не обособляется. В остальных оборот стоит после определяемого слова, поэтому запятые нужны."},{"id":"x-rus-t17-g07","k":"mc","les":"RU048","task":17,"q":"В предложении «Оглушённый взрывом, он упал на землю» оборот стоит ПЕРЕД словом, но запятая всё равно нужна. Почему?","o":[{"id":"а","t":"Определяемое слово — личное местоимение 'он', при нём оборот обособляется всегда"},{"id":"б","t":"Причастные обороты всегда обособляются"},{"id":"в","t":"Оборот стоит в начале предложения"},{"id":"г","t":"Это ошибка, запятая не нужна"}],"c":"а","e":"Как прийти к ответу: обычно оборот перед определяемым словом не обособляется, но здесь определяемое слово — личное местоимение 'он'. Правило: при личном местоимении причастный оборот обособляется в любой позиции."},{"id":"x-rus-t17-g08","k":"mc","les":"RU048","task":17,"q":"Уставший (1) он (2) присел на скамейку. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"только 1"},{"id":"б","t":"только 2"},{"id":"в","t":"1 и 2"},{"id":"г","t":"запятые не нужны"}],"c":"а","e":"Как прийти к ответу: одиночное определение 'уставший' относится к личному местоимению 'он'. При личном местоимении определение обособляется всегда → запятая на месте 1."},{"id":"x-rus-t17-g09","k":"mc","les":"RU048","task":17,"q":"Она (1) счастливая (2) улыбнулась друзьям. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"1 и 2"},{"id":"б","t":"только 1"},{"id":"в","t":"только 2"},{"id":"г","t":"запятые не нужны"}],"c":"а","e":"Как прийти к ответу: определение 'счастливая' стоит после личного местоимения 'она'. При личном местоимении определение обособляется с двух сторон → запятые 1 и 2."},{"id":"x-rus-t17-g10","k":"mc","les":"RU048","task":17,"q":"Ветер (1) тёплый и ласковый (2) коснулся лица. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"1 и 2"},{"id":"б","t":"только 1"},{"id":"в","t":"только 2"},{"id":"г","t":"запятые не нужны"}],"c":"а","e":"Как прийти к ответу: после существительного 'ветер' стоят два однородных одиночных определения — 'тёплый' и 'ласковый'. Два и более определений после определяемого слова обособляются → запятые 1 и 2."},{"id":"x-rus-t17-g11","k":"mc","les":"RU048","task":17,"q":"Весёлая (1) песня (2) зазвучала над рекой. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"запятые не нужны"},{"id":"б","t":"только 1"},{"id":"в","t":"только 2"},{"id":"г","t":"1 и 2"}],"c":"а","e":"Как прийти к ответу: одно определение 'весёлая' стоит ПЕРЕД существительным 'песня' и относится к нему обычным образом. Одиночное определение перед существительным не обособляется → запятые не нужны."},{"id":"x-rus-t17-g12","k":"mc","les":"RU048","task":17,"q":"Голодные (1) они (2) быстро съели весь хлеб. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"только 1"},{"id":"б","t":"только 2"},{"id":"в","t":"1 и 2"},{"id":"г","t":"запятые не нужны"}],"c":"а","e":"Как прийти к ответу: определение 'голодные' относится к личному местоимению 'они' и стоит перед ним. При личном местоимении определение обособляется всегда → запятая на месте 1."},{"id":"x-rus-t17-g13","k":"mc","les":"RU048","task":17,"q":"В каком предложении одиночное определение обособляется?","o":[{"id":"а","t":"Румяная девочка вошла в класс."},{"id":"б","t":"Утомлённая, она закрыла глаза."},{"id":"в","t":"Синий шар взлетел вверх."},{"id":"г","t":"Новый дом стоял у дороги."}],"c":"б","e":"Как прийти к ответу: ищем определение при личном местоимении. В варианте 2 'утомлённая' относится к местоимению 'она' → обособляется. В остальных вариантах одиночное определение стоит перед существительным и не обособляется."},{"id":"x-rus-t17-g14","k":"mc","les":"RU048","task":17,"q":"Дети (1) увидев маму (2) побежали ей навстречу. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"1 и 2"},{"id":"б","t":"только 1"},{"id":"в","t":"только 2"},{"id":"г","t":"запятые не нужны"}],"c":"а","e":"Как прийти к ответу: 'увидев маму' — деепричастный оборот ('что сделав?'). Деепричастный оборот обособляется всегда, здесь он в середине предложения → запятые с двух сторон, 1 и 2."},{"id":"x-rus-t17-g15","k":"mc","les":"RU049","task":17,"q":"Мальчик долго читал (1) лёжа. На месте цифры 1 нужна запятая?","o":[{"id":"а","t":"запятая не нужна"},{"id":"б","t":"запятая нужна"}],"c":"а","e":"Как прийти к ответу: одиночное деепричастие 'лёжа' перешло в наречие образа действия (читал как? — лёжа). Такие слова (лёжа, молча, стоя, сидя) не обособляются → запятая не нужна."},{"id":"x-rus-t17-g16","k":"mc","les":"RU049","task":17,"q":"Он всё лето работал (1) спустя рукавА. На месте цифры 1 нужна запятая?","o":[{"id":"а","t":"запятая не нужна"},{"id":"б","t":"запятая нужна"}],"c":"а","e":"Как прийти к ответу: 'спустя рукавА' — устойчивый оборот (фразеологизм) в значении 'небрежно'. Фразеологизмы с деепричастием не обособляются → запятая не нужна."},{"id":"x-rus-t17-g17","k":"mc","les":"RU048","task":17,"q":"Закончив работу (1) мы отправились домой. На месте цифры 1 нужна запятая?","o":[{"id":"а","t":"запятая нужна"},{"id":"б","t":"запятая не нужна"}],"c":"а","e":"Как прийти к ответу: 'закончив работу' — деепричастный оборот в начале предложения. Деепричастный оборот обособляется всегда → запятая на месте 1."},{"id":"x-rus-t17-g18","k":"mc","les":"RU049","task":17,"q":"Улыбаясь (1) она протянула мне руку. На месте цифры 1 нужна запятая?","o":[{"id":"а","t":"запятая нужна"},{"id":"б","t":"запятая не нужна"}],"c":"а","e":"Как прийти к ответу: 'улыбаясь' — одиночное деепричастие, оно сохраняет значение добавочного действия (что делая?), а не образа действия-наречия. Такое деепричастие обособляется → запятая нужна. Сравни с наречиями лёжа, молча."},{"id":"x-rus-t17-g19","k":"mc","les":"RU049","task":17,"q":"В каком предложении деепричастие НЕ обособляется (запятая не нужна)?","o":[{"id":"а","t":"Она слушала молча."},{"id":"б","t":"Она слушала, затаив дыхание."},{"id":"в","t":"Улыбаясь, он вошёл в комнату."},{"id":"г","t":"Устав, дети быстро уснули."}],"c":"а","e":"Как прийти к ответу: 'молча' — одиночное деепричастие, перешедшее в наречие образа действия (слушала как? — молча), оно не обособляется. В остальных вариантах есть деепричастный оборот или деепричастие со значением добавочного действия — они обособляются."},{"id":"x-rus-t17-g20","k":"mc","les":"RU050","task":17,"q":"Пушкин (1) великий русский поэт (2) родился в Москве. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"1 и 2"},{"id":"б","t":"только 1"},{"id":"в","t":"только 2"},{"id":"г","t":"запятые не нужны"}],"c":"а","e":"Как прийти к ответу: 'великий русский поэт' — распространённое приложение, стоит после определяемого слова 'Пушкин'. Такое приложение обособляется с двух сторон → запятые 1 и 2."},{"id":"x-rus-t17-g21","k":"mc","les":"RU050","task":17,"q":"Мы (1) школьники (2) участвовали в субботнике. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"1 и 2"},{"id":"б","t":"только 1"},{"id":"в","t":"только 2"},{"id":"г","t":"запятые не нужны"}],"c":"а","e":"Как прийти к ответу: приложение 'школьники' относится к личному местоимению 'мы'. При личном местоимении приложение обособляется всегда → запятые 1 и 2."},{"id":"x-rus-t17-g22","k":"mc","les":"RU056","task":17,"q":"Мой друг (1) Иван (2) приехал вчера вечером. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"запятые не нужны"},{"id":"б","t":"1 и 2"},{"id":"в","t":"только 1"},{"id":"г","t":"только 2"}],"c":"а","e":"Как прийти к ответу: 'Иван' — одиночное имя собственное, стоящее после нарицательного 'друг'. Оно только называет, не поясняет с добавочным значением, поэтому не обособляется → запятые не нужны."},{"id":"x-rus-t17-g23","k":"mc","les":"RU056","task":17,"q":"Как опытный врач (1) он сразу поставил верный диагноз. На месте цифры 1 нужна запятая?","o":[{"id":"а","t":"запятая нужна"},{"id":"б","t":"запятая не нужна"}],"c":"а","e":"Как прийти к ответу: оборот 'как опытный врач' здесь имеет значение причины ('будучи опытным врачом, поэтому сразу поставил диагноз'). Приложение с 'как' в значении причины обособляется → запятая нужна. Сравни: 'Он известен как врач' ('как'='в качестве') — не обособляется."},{"id":"x-rus-t17-g24","k":"mc","les":"RU050","task":17,"q":"Река Волга (1) главная водная артерия России (2) впадает в Каспийское море. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"1 и 2"},{"id":"б","t":"только 1"},{"id":"в","t":"только 2"},{"id":"г","t":"запятые не нужны"}],"c":"а","e":"Как прийти к ответу: 'главная водная артерия России' — распространённое приложение после определяемого сочетания 'река Волга'. Обособляется с двух сторон → запятые 1 и 2. (В самом сочетании 'река Волга' запятых нет.)"},{"id":"x-rus-t17-g25","k":"mc","les":"RU050","task":17,"q":"В каком предложении приложение НЕ обособляется?","o":[{"id":"а","t":"Наш учитель Пётр Ильич заболел."},{"id":"б","t":"Пётр Ильич, наш учитель, заболел."},{"id":"в","t":"Мы, туристы, разбили лагерь у реки."},{"id":"г","t":"Гагарин, первый космонавт Земли, стал героем."}],"c":"а","e":"Как прийти к ответу: в варианте 1 'Пётр Ильич' — одиночное имя собственное после нарицательного 'учитель', оно не обособляется. В остальных вариантах приложение либо распространённое после определяемого слова, либо относится к местоимению 'мы' — они обособляются."},{"id":"x-rus-t17-g26","k":"mc","les":"RU049","task":17,"q":"Внизу (1) под горой (2) раскинулось небольшое село. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"1 и 2"},{"id":"б","t":"только 1"},{"id":"в","t":"только 2"},{"id":"г","t":"запятые не нужны"}],"c":"а","e":"Как прийти к ответу: два обстоятельства места стоят подряд: 'внизу' — общее, 'под горой' — уточняет (где именно внизу?). Уточняющее обстоятельство обособляется → запятые 1 и 2."},{"id":"x-rus-t17-g27","k":"mc","les":"RU049","task":17,"q":"Утром (1) часов в шесть (2) я проснулся от шума. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"1 и 2"},{"id":"б","t":"только 1"},{"id":"в","t":"только 2"},{"id":"г","t":"запятые не нужны"}],"c":"а","e":"Как прийти к ответу: 'часов в шесть' уточняет время 'утром' (когда именно утром?). Уточняющее обстоятельство времени обособляется с двух сторон → запятые 1 и 2."},{"id":"x-rus-t17-g28","k":"mc","les":"RU056","task":17,"q":"Мы обязательно встретимся завтра (1) то есть в понедельник. На месте цифры 1 нужна запятая?","o":[{"id":"а","t":"запятая нужна"},{"id":"б","t":"запятая не нужна"}],"c":"а","e":"Как прийти к ответу: 'то есть в понедельник' поясняет слово 'завтра'. Перед пояснительным союзом 'то есть' ставится запятая → запятая нужна."},{"id":"x-rus-t17-g29","k":"mc","les":"RU056","task":17,"q":"Я очень люблю фрукты (1) особенно спелые яблоки. На месте цифры 1 нужна запятая?","o":[{"id":"а","t":"запятая нужна"},{"id":"б","t":"запятая не нужна"}],"c":"а","e":"Как прийти к ответу: оборот с 'особенно' имеет уточняющий, выделительный характер. Перед 'особенно' в таком значении ставится запятая → запятая нужна."},{"id":"x-rus-t17-g30","k":"mc","les":"RU049","task":17,"q":"Там (1) за широкой рекой (2) начинался густой лес. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"1 и 2"},{"id":"б","t":"только 1"},{"id":"в","t":"только 2"},{"id":"г","t":"запятые не нужны"}],"c":"а","e":"Как прийти к ответу: 'за широкой рекой' уточняет обстоятельство места 'там' (где именно там?). Уточняющее обстоятельство обособляется с двух сторон → запятые 1 и 2."},{"id":"x-rus-t17-g31","k":"mc","les":"RU049","task":17,"q":"В каком предложении есть уточняющий член, требующий обособления?","o":[{"id":"а","t":"Здесь, в родном городе, прошло всё моё детство."},{"id":"б","t":"Летом дни становятся длиннее."},{"id":"в","t":"Он говорил тихо и спокойно."},{"id":"г","t":"Птицы улетают на юг."}],"c":"а","e":"Как прийти к ответу: ищем два обстоятельства подряд, где второе конкретизирует первое. В варианте 1 'в родном городе' уточняет 'здесь' (где именно здесь?) → уточняющий член обособляется. В остальных предложениях уточнения нет."},{"id":"x-rus-t17-g32","k":"mc","les":"RU049","task":17,"q":"Несмотря на сильный дождь (1) мы пошли гулять. На месте цифры 1 нужна запятая?","o":[{"id":"а","t":"запятая нужна"},{"id":"б","t":"запятая не нужна"}],"c":"а","e":"Как прийти к ответу: 'несмотря на сильный дождь' = 'вопреки дождю' — обстоятельство уступки с предлогом 'несмотря на' (слитно). Оно обособляется → запятая нужна."},{"id":"x-rus-t17-g33","k":"mc","les":"RU049","task":17,"q":"Он пришёл на работу (1) несмотря на болезнь. На месте цифры 1 нужна запятая?","o":[{"id":"а","t":"запятая нужна"},{"id":"б","t":"запятая не нужна"}],"c":"а","e":"Как прийти к ответу: 'несмотря на болезнь' = 'вопреки болезни' — обстоятельство уступки. Оборот с предлогом 'несмотря на' обособляется независимо от позиции → запятая нужна."},{"id":"x-rus-t17-g34","k":"mc","les":"RU049","task":17,"q":"Мы (1) несмотря на усталость (2) продолжили путь. На месте каких цифр нужны запятые?","o":[{"id":"а","t":"1 и 2"},{"id":"б","t":"только 1"},{"id":"в","t":"только 2"},{"id":"г","t":"запятые не нужны"}],"c":"а","e":"Как прийти к ответу: оборот 'несмотря на усталость' (=вопреки усталости) стоит в середине предложения. Обстоятельство уступки обособляется с двух сторон → запятые 1 и 2."},{"id":"x-rus-t17-g35","k":"mc","les":"RU056","task":17,"q":"Он быстро шёл вперёд (1) не смотря по сторонам. На месте цифры 1 нужна запятая, и как пишется выделенное?","o":[{"id":"а","t":"Запятая нужна; 'не смотря' пишется раздельно (=не глядя, деепричастие)"},{"id":"б","t":"Запятая не нужна; пишется слитно"},{"id":"в","t":"Запятая нужна; пишется слитно 'несмотря'"},{"id":"г","t":"Запятая не нужна; пишется раздельно"}],"c":"а","e":"Как прийти к ответу: здесь значение 'не глядя по сторонам' — это деепричастие 'не смотря', пишется РАЗДЕЛЬНО и обособляется как деепричастный оборот → запятая нужна. Не путай с предлогом 'несмотря на' (=вопреки), который пишется слитно."},{"id":"x-rus-t17-g36","k":"mc","les":"RU049","task":17,"q":"В каком предложении «несмотря на» пишется слитно и является обстоятельством уступки?","o":[{"id":"а","t":"Он читал, не смотря на экран телефона."},{"id":"б","t":"Несмотря на юный возраст, дедушка был бодр."},{"id":"в","t":"Она бежала, не смотря по сторонам."},{"id":"г","t":"Он говорил, не смотря собеседнику в глаза."}],"c":"б","e":"Как прийти к ответу: слитное 'несмотря на' имеет значение 'вопреки'. В варианте 2 'несмотря на юный возраст' = 'вопреки возрасту' — обстоятельство уступки, пишется слитно. В остальных 'не смотря' = 'не глядя' (деепричастие, раздельно)."},{"id":"x-rus-t18-g01","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми слово в скобках: «Завтра, (по-видимому), похолодает»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«По-видимому» выражает неуверенность (говорящий предполагает). Уберём его — «Завтра похолодает» — смысл и структура целы. Вопрос к слову задать нельзя. Значит, это вводное слово, выделяем запятыми."},{"id":"x-rus-t18-g02","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «(Возможно), мы ещё увидимся»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«Возможно» = «может быть», это оценка достоверности (неуверенность). Стоит в начале, убирается без потери смысла. Вводное слово в начале предложения выделяется одной запятой."},{"id":"x-rus-t18-g03","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «Она, (разумеется), согласилась помочь»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«Разумеется» = «конечно», выражает уверенность. Уберём — «Она согласилась помочь» — предложение целое. Это вводное слово, в середине выделяется с двух сторон."},{"id":"x-rus-t18-g04","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми слово в скобках: «Дом (кажется) пустым и заброшенным»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"б","e":"Задаём вопрос: «дом кажется каким? — пустым». «Кажется» здесь — сказуемое (=выглядит), убрать нельзя: «Дом пустым» разрушится. Это член предложения, а не вводное слово, запятыми не выделяется."},{"id":"x-rus-t18-g05","k":"mc","les":"RU051","task":18,"q":"В каком предложении слово «кажется» нужно выделить запятыми (оно вводное)?","o":[{"id":"а","t":"Море (кажется) синим и бездонным."},{"id":"б","t":"Он, (кажется), нас даже не заметил."}],"c":"б","e":"В первом «кажется» — сказуемое: «море кажется каким? — синим», убрать нельзя. Во втором «кажется» = «по-видимому» (неуверенность), убирается: «Он нас не заметил». Поэтому вводное только во втором — там и нужны запятые."},{"id":"x-rus-t18-g06","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «(К счастью), всё обошлось без последствий»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«К счастью» выражает эмоциональную оценку (говорящий рад). Убирается: «Всё обошлось без последствий». Это вводное сочетание, в начале выделяется запятой."},{"id":"x-rus-t18-g07","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «Он, (к сожалению), опоздал на поезд»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«К сожалению» передаёт чувство говорящего (огорчение). Уберём — «Он опоздал на поезд» — смысл цел. Вводное сочетание в середине выделяется с двух сторон."},{"id":"x-rus-t18-g08","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «(К моему удивлению), дверь оказалась открыта»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«К моему удивлению» выражает эмоцию говорящего. Оно не член предложения и убирается без ущерба. Это вводное сочетание — выделяем запятой."},{"id":"x-rus-t18-g09","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «Погода, (к нашей радости), наконец наладилась»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«К нашей радости» — эмоциональная оценка события. Убирается: «Погода наладилась». Вводное сочетание в середине выделяется с двух сторон."},{"id":"x-rus-t18-g10","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми оборот в скобках: «Он всю жизнь стремился (к счастью)»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"б","e":"Задаём вопрос: «стремился к чему? — к счастью». Здесь «к счастью» — дополнение, член предложения, убрать нельзя. Это не вводное сочетание — запятыми не выделяется."},{"id":"x-rus-t18-g11","k":"mc","les":"RU051","task":18,"q":"В каком предложении «к счастью» — вводное сочетание (нужны запятые)?","o":[{"id":"а","t":"Дорога вела прямо (к счастью) и покою."},{"id":"б","t":"(К счастью), ливень скоро закончился."}],"c":"б","e":"В первом «к счастью» — дополнение: «вела к чему?». Во втором оно выражает чувство говорящего и убирается: «Ливень скоро закончился». Вводное только во втором предложении — там ставим запятую."},{"id":"x-rus-t18-g12","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «(По-моему), этот путь короче»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«По-моему» = «на мой взгляд», указывает на источник мнения. Убирается: «Этот путь короче». Это вводное слово — в начале выделяется запятой."},{"id":"x-rus-t18-g13","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «Дожди, (по словам синоптиков), скоро прекратятся»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«По словам синоптиков» указывает на источник сведений. Оборот убирается без потери смысла. Это вводное сочетание, в середине выделяется с двух сторон."},{"id":"x-rus-t18-g14","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «Эта книга, (говорят), очень интересная»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«Говорят» = «по слухам», указывает на источник (неопределённый). Убирается: «Эта книга очень интересная». Это вводное слово — выделяем с двух сторон."},{"id":"x-rus-t18-g15","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «(Как известно), вода кипит при ста градусах»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«Как известно» указывает на общеизвестный источник. Убирается без ущерба: «Вода кипит при ста градусах». Это вводное сочетание — выделяется запятой."},{"id":"x-rus-t18-g16","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми оборот в скобках: «Пусть всё будет (по-твоему)»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"б","e":"Задаём вопрос: «будет как? — по-твоему». Здесь «по-твоему» = «как ты хочешь», это обстоятельство образа действия, член предложения. Не вводное — запятыми не выделяется."},{"id":"x-rus-t18-g17","k":"mc","les":"RU051","task":18,"q":"В каком предложении «по-моему» — вводное слово (нужна запятая)?","o":[{"id":"а","t":"Сделай, пожалуйста, всё (по-моему)."},{"id":"б","t":"Этот фильм, (по-моему), довольно скучный."}],"c":"б","e":"В первом «по-моему» = «как я прошу» (вопрос как?) — обстоятельство. Во втором = «на мой взгляд», источник мнения, убирается: «Этот фильм довольно скучный». Вводное во втором — там и запятые."},{"id":"x-rus-t18-g18","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «(Во-первых), это дорого, во-вторых, ненадёжно»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«Во-первых» указывает на порядок мыслей (перечисление аргументов). Оно организует текст, но не член предложения. Это вводное слово — выделяется запятой."},{"id":"x-rus-t18-g19","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «(Итак), подведём итоги нашей встречи»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«Итак» выражает вывод, связь мыслей (=подводя итог). Убирается: «Подведём итоги». Это вводное слово — в начале выделяется запятой."},{"id":"x-rus-t18-g20","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «Он опоздал и, (следовательно), пропустил начало»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«Следовательно» выражает вывод, связь мыслей (=значит). Убирается: «Он опоздал и пропустил начало». Это вводное слово — выделяется с двух сторон."},{"id":"x-rus-t18-g21","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «Многие животные, (например), впадают в спячку»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«Например» вводит иллюстрацию, оформляет мысль. Убирается: «Многие животные впадают в спячку». Это вводное слово — в середине выделяется с двух сторон."},{"id":"x-rus-t18-g22","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми оборот в скобках: «Соедини провода вот (таким образом)»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"б","e":"Задаём вопрос: «соедини как? — таким образом». Здесь это обстоятельство образа действия (=так, этим способом), член предложения. Не вводное — запятыми не выделяется."},{"id":"x-rus-t18-g23","k":"mc","les":"RU051","task":18,"q":"В каком предложении «таким образом» — вводное слово (нужны запятые)?","o":[{"id":"а","t":"Детали собирают вот (таким образом)."},{"id":"б","t":"(Таким образом), мы приходим к важному выводу."}],"c":"б","e":"В первом «таким образом» = «так» (вопрос как?) — обстоятельство. Во втором оно выражает вывод, связь мыслей, убирается: «Мы приходим к выводу». Вводное во втором — там ставим запятую."},{"id":"x-rus-t18-g24","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять «однако» запятыми как вводное: «Мне, (однако), пора идти»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«Однако» стоит в середине, между членами предложения, и его можно убрать: «Мне пора идти». Заменить на союз «но» здесь нельзя. Значит, это вводное слово — выделяем с двух сторон."},{"id":"x-rus-t18-g25","k":"mc","les":"RU051","task":18,"q":"Нужно ли обособлять «однако» с ДВУХ сторон: «Мы долго спорили, (однако) так и не решили»?","o":[{"id":"а","t":"Да, это вводное — выделить с двух сторон"},{"id":"б","t":"Нет, это союз (=но), выделять с двух сторон не нужно"}],"c":"б","e":"Здесь «однако» = «но»: соединяет части сложного предложения и стоит на границе. Это союз, а не вводное слово. Ставится только запятая перед ним, с двух сторон он не выделяется."},{"id":"x-rus-t18-g26","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять «наконец» запятыми: «Да прекрати же ты, (наконец)!»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"Здесь «наконец» выражает нетерпение, эмоцию (не время). Подставим «-то»: «наконец-то прекрати» — по смыслу не подходит. Значит, это вводное слово — выделяем запятыми."},{"id":"x-rus-t18-g27","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять «наконец» запятыми: «Мы долго блуждали и (наконец) вышли к реке»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"б","e":"Здесь «наконец» = «в итоге, под конец» (значение времени). Подставим «-то»: «наконец-то вышли» — смысл сохранён. Это наречие-обстоятельство, а не вводное слово — запятыми не выделяется."},{"id":"x-rus-t18-g28","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять «значит» запятыми: «Этот человек много (значит) для меня»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"б","e":"Здесь «значит» = «означает», это сказуемое: «много значит». Убрать нельзя. Это член предложения, а не вводное слово — запятыми не выделяется."},{"id":"x-rus-t18-g29","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять «значит» запятыми: «Ты, (значит), решил остаться?»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"Здесь «значит» = «следовательно», выражает вывод. Убирается: «Ты решил остаться?». Это вводное слово — выделяем с двух сторон."},{"id":"x-rus-t18-g30","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять «может» запятыми: «Он (может) поднять сто килограммов»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"б","e":"Здесь «может» — глагол-сказуемое (от «мочь»): «может поднять». Убрать нельзя. Это член предложения, а не вводное слово — запятыми не выделяется."},{"id":"x-rus-t18-g31","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять «верно» запятыми: «Вы, (верно), приехали издалека?»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"Здесь «верно» = «наверное, вероятно» (неуверенность). Убирается: «Вы приехали издалека?». Сравни: «часы идут верно» (=правильно) — там наречие. В нашем случае это вводное слово — выделяем запятыми."},{"id":"x-rus-t18-g32","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять «правда» запятыми: «Дом небольшой, (правда), очень уютный»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"Здесь «правда» = «однако, впрочем» (уступка). Убирается: «Дом небольшой, очень уютный». Сравни: «Правда всегда побеждает» — там подлежащее (=истина). У нас это вводное слово — выделяем запятыми."},{"id":"x-rus-t18-g33","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять «в конце концов» запятыми: «(В конце концов) все разошлись по домам»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"б","e":"Здесь «в конце концов» = «в итоге, под конец» (значение времени, вопрос когда?). Это обстоятельство, член предложения. Сравни с эмоцией: «Оставьте меня, в конце концов!». В нашем случае — не вводное, запятыми не выделяется."},{"id":"x-rus-t18-g34","k":"mc","les":"RU051","task":18,"q":"Дан вывод: в предложении «Ты, значит, уезжаешь завтра?» слово «значит» — вводное. Какое объяснение верное?","o":[{"id":"а","t":"Его можно убрать без потери смысла, оно = «следовательно»"},{"id":"б","t":"Это сказуемое, оно = «означает»"}],"c":"а","e":"«Значит» вводное, когда = «следовательно» и убирается: «Ты уезжаешь завтра?». Вариант со «сказуемым (=означает)» описывал бы невводный случай («жест много значит»). Здесь верно первое объяснение."},{"id":"x-rus-t18-g35","k":"mc","les":"RU051","task":18,"q":"В каком предложении «наконец» — вводное слово (нужны запятые)?","o":[{"id":"а","t":"Поезд шёл всё медленнее и (наконец) остановился."},{"id":"б","t":"Замолчите же вы, (наконец)!"}],"c":"б","e":"В первом «наконец» = «в итоге» (можно «наконец-то») — наречие времени, не вводное. Во втором выражает нетерпение, «-то» не подставить — это вводное слово. Значит, запятая нужна во втором предложении."},{"id":"x-rus-t18-g36","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми слово в скобках: «Он (вдруг) остановился посреди дороги»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"б","e":"«Вдруг» — наречие, тесно связанное со сказуемым (остановился как? — вдруг/неожиданно). Оно не выражает оценку достоверности или чувства и НЕ является вводным. Запятыми не выделяется."},{"id":"x-rus-t18-g37","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «Ты (ведь) обещал прийти вовремя»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"б","e":"«Ведь» — усилительная частица. Она не входит в список вводных слов и не выражает их значений. Частица «ведь» запятыми не выделяется."},{"id":"x-rus-t18-g38","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «Горы (будто) плыли в утреннем тумане»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"б","e":"«Будто» (как и «как будто») — сравнительная частица, а не вводное слово. Она примыкает к сказуемому и запятыми не выделяется."},{"id":"x-rus-t18-g39","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «Он (якобы) ничего не знал об этом»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"б","e":"«Якобы» — частица со значением сомнения/чужих слов, но в список вводных слов она НЕ входит. По правилу «якобы» запятыми не выделяется."},{"id":"x-rus-t18-g40","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «(Именно) этого я и опасался»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"б","e":"«Именно» — усилительно-выделительная частица. Она не является вводным словом и запятыми не выделяется."},{"id":"x-rus-t18-g41","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «(Даже) малыши справились с этим заданием»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"б","e":"«Даже» — усилительная частица. Она не выражает вводных значений и запятыми не выделяется."},{"id":"x-rus-t18-g42","k":"mc","les":"RU051","task":18,"q":"В каком предложении выделенное слово НЕ является вводным (запятые не нужны)?","o":[{"id":"а","t":"Он, кажется, слегка устал с дороги."},{"id":"б","t":"Он (вдруг) резко обернулся на шум."}],"c":"б","e":"В первом «кажется» = «по-видимому» (неуверенность) — вводное, нужны запятые. Во втором «вдруг» — наречие (обернулся как?), не вводное. Значит, без запятых должно быть второе предложение."},{"id":"x-rus-t18-g43","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми слово в скобках: «(Друзья), давайте жить дружно!»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«Друзья» называет тех, к кому обращена речь, и не является членом предложения (к нему нельзя задать вопрос от сказуемого). Это обращение — в начале выделяется запятой."},{"id":"x-rus-t18-g44","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «Спой, (светик), не стыдись!»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«Светик» — ласковое называние адресата речи, не член предложения. Обращение в середине выделяется запятыми с двух сторон."},{"id":"x-rus-t18-g45","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «(Мама), можно мне пойти погулять?»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«Мама» здесь называет того, к кому обращаются, и не входит в грамматическую основу. Это обращение — в начале выделяется запятой."},{"id":"x-rus-t18-g46","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми: «Не шуми ты, (рожь), спелым колосом»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"а","e":"«Рожь» — олицетворённое обращение, адресат речи, не член предложения. Обращение в середине выделяется запятыми с двух сторон."},{"id":"x-rus-t18-g47","k":"mc","les":"RU051","task":18,"q":"Нужно ли выделять запятыми слово в скобках: «(Мама) готовит вкусный ужин»?","o":[{"id":"а","t":"Нужно выделить запятыми"},{"id":"б","t":"Не нужно выделять запятыми"}],"c":"б","e":"Задаём вопрос: «кто готовит? — мама». Здесь «мама» — подлежащее, часть грамматической основы, а не обращение. Подлежащее запятыми не выделяется."},{"id":"x-rus-t18-g48","k":"mc","les":"RU051","task":18,"q":"В каком предложении есть обращение (нужны запятые)?","o":[{"id":"а","t":"Зима недаром злится, прошла её пора."},{"id":"б","t":"Что клонишь ты, (ива), над самой водой?"}],"c":"б","e":"В первом «зима» — подлежащее (кто злится? — зима), не обращение. Во втором «ива» называет адресата речи, не член предложения. Обращение есть во втором предложении — там и нужны запятые."},{"id":"x-rus-t19-g01","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nОн пообещал ( ) что обязательно позвонит вечером.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Две основы: «он пообещал» и «(он) позвонит». Придаточное изъяснительное присоединяется союзом «что». Как прийти к ответу: находим стык главной и придаточной части — перед «что» ставим запятую."},{"id":"x-rus-t19-g02","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nМы отдыхали там ( ) где раньше был старый сад.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Основы: «мы отдыхали» и «был сад». «Где» — союзное слово, начинающее придаточное места. Ответ: запятая на границе частей, перед «где»."},{"id":"x-rus-t19-g03","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nЯ не поеду за город ( ) если испортится погода.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Основы: «я не поеду» и «погода испортится». Придаточное условия с союзом «если». Разбор: определяем границу частей и ставим запятую перед «если»."},{"id":"x-rus-t19-g04","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nРасскажи ( ) когда отправляется поезд.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Основы: «расскажи» и «поезд отправляется». «Когда» — союзное слово. Ответ: на стыке главной и придаточной частей — запятая перед «когда»."},{"id":"x-rus-t19-g05","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nВетер дул так сильно ( ) что деревья гнулись до земли.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Основы: «ветер дул» и «деревья гнулись». Придаточное степени с союзом «что» (соотносится со словом «так»). Разбор: перед «что» — граница частей, ставим запятую."},{"id":"x-rus-t19-g06","k":"mc","les":"RU052","task":19,"q":"В каком предложении на месте ( ) нужна запятая?","o":[{"id":"а","t":"Я рад ( ) что ты наконец пришёл."},{"id":"б","t":"Он готов помочь во что бы то ( ) ни стало."},{"id":"в","t":"Мы знаем, что придёшь ( ) и что поможешь."}],"c":"а","e":"Ищем настоящую границу главной и придаточной части. Вариант 1: «я рад» + придаточное «что ты пришёл» — запятая нужна. Вариант 2 — цельное сочетание «во что бы то ни стало», запятой нет. Вариант 3 — однородные придаточные с одиночным «и», запятая не ставится. Верно 1."},{"id":"x-rus-t19-g07","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nДорога опустела ( ) потому что наступила ночь.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Составной союз «потому что». Перед ним нет частицы или отрицания, значит союз цельный: запятая ставится ОДИН раз — перед всем союзом. Ответ: запятая нужна перед «потому»."},{"id":"x-rus-t19-g08","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nОн говорил шёпотом, потому ( ) что рядом спал ребёнок.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"Союз «потому что» не расчленён (нет частицы, акцента на «потому»). Запятая уже стоит перед всем союзом. Внутри союза, между «потому» и «что», запятая НЕ ставится. Ответ: не нужна."},{"id":"x-rus-t19-g09","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nЯ молчал не потому ( ) что согласился с ним.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Перед союзом стоит отрицание «не», логический акцент падает на «потому». В этом случае союз расчленяется: запятая ставится перед второй частью — перед «что». Ответ: запятая нужна."},{"id":"x-rus-t19-g10","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nМы встали пораньше ( ) для того чтобы успеть на первый автобус.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Составной союз «для того чтобы». Частицы/акцента перед ним нет — союз цельный, запятая ставится один раз перед всем союзом. Ответ: запятая нужна перед «для того»."},{"id":"x-rus-t19-g11","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nЗадание оказалось трудным, оттого ( ) что было плохо объяснено.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"Союз «оттого что» цельный (нет частицы перед ним), запятая уже поставлена перед «оттого». Внутри союза, между «оттого» и «что», запятая не нужна. Ответ: не нужна."},{"id":"x-rus-t19-g12","k":"mc","les":"RU052","task":19,"q":"В каком предложении запятая внутри составного союза поставлена ВЕРНО?","o":[{"id":"а","t":"Я замолчал не потому, что обиделся."},{"id":"б","t":"Он ушёл, потому, что очень устал."},{"id":"в","t":"Она грустила, оттого, что осталась одна."}],"c":"а","e":"Внутри составного союза запятая перед «что» уместна только при расчленении — когда есть отрицание или акцент. Вариант 1: есть «не потому» — расчленение оправдано, запятая перед «что» верна. Варианты 2 и 3 — союзы цельные, запятая внутри лишняя. Верно 1."},{"id":"x-rus-t19-g13","k":"mc","les":"RU052","task":19,"q":"Когда составной союз «потому что» расчленяется и запятая ставится перед «что»?","o":[{"id":"а","t":"Когда перед первой частью стоит отрицание или усилительная частица (не, лишь, именно)."},{"id":"б","t":"Всегда, в любом предложении."},{"id":"в","t":"Никогда — союз неделим."}],"c":"а","e":"По умолчанию запятая ставится перед всем союзом, внутри её нет. Расчленение происходит при отрицании или логическом акценте на первой части: «не потому, что», «именно потому, что». Верно 1."},{"id":"x-rus-t19-g14","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nДом, который стоял на краю деревни ( ) был виден издалека.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Придаточное «который стоял на краю деревни» стоит внутри главного («дом ... был виден»). Первая запятая уже есть перед «который». На месте скобок — конец придаточного, поэтому нужна вторая, закрывающая запятая. Ответ: нужна."},{"id":"x-rus-t19-g15","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nВсе ( ) кто пришёл на праздник, остались довольны.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Придаточное «кто пришёл на праздник» вставлено внутрь главного («все ... остались довольны»). На месте скобок — начало придаточного, перед союзным словом «кто». Ставим открывающую запятую. Ответ: нужна."},{"id":"x-rus-t19-g16","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nТам, где кончалась тропинка ( ) начинался густой лес.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Придаточное «где кончалась тропинка» находится внутри главного. Первая запятая перед «где» есть, на месте скобок — граница возврата к главной части. Нужна закрывающая запятая. Ответ: нужна."},{"id":"x-rus-t19-g17","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nКнига, что лежала на верхней полке ( ) оказалась редким изданием.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Придаточное «что лежала на верхней полке» стоит в середине главного. На месте скобок придаточное заканчивается и продолжается главная часть — ставим вторую запятую. Ответ: нужна."},{"id":"x-rus-t19-g18","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nМальчик ( ) которого мы встретили утром, помахал нам рукой.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Придаточное «которого мы встретили утром» разрывает главное («мальчик ... помахал»). На месте скобок — начало придаточного, перед словом «которого». Ставим открывающую запятую. Ответ: нужна."},{"id":"x-rus-t19-g19","k":"mc","les":"RU052","task":19,"q":"Сколько запятых нужно поставить в предложении?\nРека которая протекала за лесом была очень широкой.","o":[{"id":"а","t":"Одну"},{"id":"б","t":"Две"},{"id":"в","t":"Три"}],"c":"б","e":"Придаточное «которая протекала за лесом» стоит внутри главного («река ... была широкой»). Его выделяют с двух сторон: перед «которая» и после «лесом». Значит, нужны ДВЕ запятые. Верно 2."},{"id":"x-rus-t19-g20","k":"mc","les":"RU052","task":19,"q":"В каком предложении придаточное стоит ВНУТРИ главного и выделяется двумя запятыми?","o":[{"id":"а","t":"Гроза, что началась внезапно, быстро прошла."},{"id":"б","t":"Мы ушли, когда стемнело."},{"id":"в","t":"Скажи, что тебя тревожит."}],"c":"а","e":"Ищем, где придаточное «разрывает» главное. Вариант 1: «что началась внезапно» стоит в середине («гроза ... прошла») — две запятые. В вариантах 2 и 3 придаточное в конце — одна запятая. Верно 1."},{"id":"x-rus-t19-g21","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nОн решил добиться своего во что бы то ( ) ни стало.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"«Во что бы то ни стало» — устойчивое, неразложимое сочетание (фразеологизм со значением «обязательно»). Это не придаточное. Запятая перед «ни стало» не ставится. Ответ: не нужна."},{"id":"x-rus-t19-g22","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nРебёнок бежал по дорожке что ( ) есть духу.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"«Что есть духу» — цельное фразеологизированное сочетание (= «очень быстро»). Своей отдельной мысли-придаточного тут нет. Запятая перед «есть» не ставится. Ответ: не нужна."},{"id":"x-rus-t19-g23","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nОна встретила гостей как ( ) ни в чём не бывало.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"«Как ни в чём не бывало» — устойчивый оборот (= «спокойно, будто ничего не случилось»). Он неразложим, придаточным не является. Запятая внутри не ставится. Ответ: не нужна."},{"id":"x-rus-t19-g24","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nКаждый украшал ёлку кто ( ) во что горазд.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"«Кто во что горазд» — цельное устойчивое сочетание (= «каждый по-своему»). Это фразеологизм, а не придаточное. Запятая перед «во что» не ставится. Ответ: не нужна."},{"id":"x-rus-t19-g25","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nБери что ( ) хочешь, мне не жалко.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"«Бери что хочешь» — цельное сочетание (= «бери любое»); «что хочешь» здесь неразложимо, как «что угодно». Запятая перед «хочешь» не ставится. Ответ: не нужна."},{"id":"x-rus-t19-g26","k":"mc","les":"RU052","task":19,"q":"В каком предложении запятая перед «что» / «как» НЕ ставится?","o":[{"id":"а","t":"Кричи что есть мочи, я всё равно не услышу."},{"id":"б","t":"Я знаю, что ты был прав."},{"id":"в","t":"Он спросил, что случилось на дороге."}],"c":"а","e":"Отделяем фразеологизм от настоящего придаточного. Вариант 1: «что есть мочи» — цельное сочетание, запятой нет. В вариантах 2 и 3 «что» присоединяет придаточное изъяснительное — запятая нужна. Верно 1."},{"id":"x-rus-t19-g27","k":"mc","les":"RU052","task":19,"q":"Почему в предложении «Спасайся во что бы то ни стало» нет запятой?","o":[{"id":"а","t":"Это цельное устойчивое сочетание (фразеологизм) — запятая не ставится."},{"id":"б","t":"Здесь нет союза «что»."},{"id":"в","t":"Придаточное стоит внутри главного."}],"c":"а","e":"«Во что бы то ни стало» неразложимо и равно наречию «обязательно». Раз это фразеологизм, а не отдельная придаточная часть, запятая внутри не ставится. Верно 1."},{"id":"x-rus-t19-g28","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nЯ знаю, что ты приедешь ( ) и что мы всё обсудим.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"Два однородных придаточных изъяснительных («что приедешь» и «что обсудим») относятся к слову «знаю» и соединены одиночным союзом «и». Как между однородными членами, запятая перед «и» не ставится. Ответ: не нужна."},{"id":"x-rus-t19-g29","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nОн рассказал, где побывал ( ) и что успел увидеть.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"Придаточные «где побывал» и «что успел увидеть» однородны (оба относятся к «рассказал») и соединены одиночным «и». Запятая между ними не ставится. Ответ: не нужна."},{"id":"x-rus-t19-g30","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nКогда рассвело ( ) и когда туман рассеялся, мы двинулись в путь.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"Два однородных придаточных времени соединены одиночным союзом «и». Запятая между однородными придаточными с «и» не ставится (первая запятая всего предложения стоит после «рассеялся»). Ответ: не нужна."},{"id":"x-rus-t19-g31","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nОна спросила, приду ли я ( ) и останусь ли до утра.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"б","e":"Однородные придаточные «приду ли я» и «останусь ли до утра» относятся к «спросила» и соединены одиночным «и». Запятая перед «и» не нужна. Ответ: не нужна."},{"id":"x-rus-t19-g32","k":"mc","les":"RU052","task":19,"q":"Нужна ли запятая на месте скобок?\nОн признался, что виноват ( ) но что непременно исправит ошибку.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Придаточные однородны, но соединены не соединительным, а ПРОТИВИТЕЛЬНЫМ союзом «но». Перед «но» между однородными придаточными запятая ставится. Ответ: нужна."},{"id":"x-rus-t19-g33","k":"mc","les":"RU052","task":19,"q":"Между однородными придаточными стоит одиночный союз «и». Нужна ли перед ним запятая?","o":[{"id":"а","t":"Да, всегда"},{"id":"б","t":"Нет, запятая не ставится"},{"id":"в","t":"Только в устной речи"}],"c":"б","e":"Однородные придаточные при одиночном союзе «и» ведут себя как однородные члены: запятая перед «и» не ставится. Верно 2."},{"id":"x-rus-t19-g34","k":"mc","les":"RU052","task":19,"q":"В каком предложении на месте ( ) запятая НЕ нужна?","o":[{"id":"а","t":"Мы верим, что победим ( ) и что всё получится."},{"id":"б","t":"Наступил вечер ( ) и в окнах зажглись фонари."},{"id":"в","t":"Он вошёл в зал ( ) и все сразу замолчали."}],"c":"а","e":"Вариант 1 — два однородных придаточных с одиночным «и», запятая не нужна. Варианты 2 и 3 — сложносочинённые предложения (две грамматические основы), перед «и» запятая нужна. Верно 1."},{"id":"x-rus-t20-g01","k":"mc","les":"RU053","task":20,"q":"Что называют «стыком союзов» в задании 20?","o":[{"id":"а","t":"Соседство двух союзов подряд (например: и когда, что если)"},{"id":"б","t":"Повтор одного союза (и... и...)"},{"id":"в","t":"Союз в самом конце предложения"},{"id":"г","t":"Отсутствие союзов между частями"}],"c":"а","e":"Стык союзов — это когда два союза стоят рядом: сочинительный + подчинительный (и когда) или два подчинительных (что если). Именно на этом стыке и решают вопрос о запятой."},{"id":"x-rus-t20-g02","k":"mc","les":"RU053","task":20,"q":"От чего зависит, ставить ли запятую на стыке союзов?","o":[{"id":"а","t":"От наличия второй части двойного союза (то/так/но) после придаточного"},{"id":"б","t":"От длины всего предложения"},{"id":"в","t":"От того, какой первый союз по счёту"},{"id":"г","t":"От того, есть ли в предложении восклицание"}],"c":"а","e":"Как прийти к ответу: изыми придаточное и посмотри, есть ли дальше ТО/ТАК/НО. Есть — запятой нет; нет — запятая ставится. Всё решает именно вторая часть двойного союза."},{"id":"x-rus-t20-g03","k":"mc","les":"RU053","task":20,"q":"В каком сочетании есть стык ДВУХ союзов?","o":[{"id":"а","t":"...и когда..."},{"id":"б","t":"...красивый и умный..."},{"id":"в","t":"...потому что..."},{"id":"г","t":"...очень быстро..."}],"c":"а","e":"«И когда» — это сочинительный (и) плюс подчинительный (когда), настоящий стык. «Красивый и умный» — один союз «и» между однородными; «потому что» — единый составной союз, а не два."},{"id":"x-rus-t20-g04","k":"mc","les":"RU053","task":20,"q":"Главный приём проверки запятой на стыке союзов — это...","o":[{"id":"а","t":"попытка изъять (или переставить) придаточное"},{"id":"б","t":"подсчёт количества слов"},{"id":"в","t":"замена союза синонимом"},{"id":"г","t":"определение падежа существительного"}],"c":"а","e":"Приём изъятия: убери придаточное после второго союза. Если фраза осталась целой (и нет то/так/но) — запятая нужна; если ломается из-за то/так — не нужна."},{"id":"x-rus-t20-g05","k":"mc","les":"RU053","task":20,"q":"Если после придаточного стоит вторая часть двойного союза «то», запятая на стыке...","o":[{"id":"а","t":"не ставится"},{"id":"б","t":"ставится всегда"},{"id":"в","t":"ставится, если предложение длинное"},{"id":"г","t":"заменяется на тире"}],"c":"а","e":"«Если…то», «когда…так», «хотя…но» — двойные союзы. Их части нельзя разрывать изъятием придаточного, поэтому запятая на стыке не ставится."},{"id":"x-rus-t20-g06","k":"mc","les":"RU053","task":20,"q":"В предложении «Он знал, что( ) когда стемнеет, дорога опустеет» запятая на стыке нужна. Почему это верно?","o":[{"id":"а","t":"Придаточное «когда стемнеет» можно изъять, и нет второй части то/так/но"},{"id":"б","t":"Потому что предложение вопросительное"},{"id":"в","t":"Потому что «что» — сочинительный союз"},{"id":"г","t":"Потому что дальше стоит слово «то»"}],"c":"а","e":"Проверяем изъятием: «Он знал, что дорога опустеет» — фраза цела, слова ТО/ТАК/НО нет. Значит, запятая между «что» и «когда» нужна."},{"id":"x-rus-t20-g07","k":"mc","les":"RU053","task":20,"q":"Дано: на стыке союзов запятая НЕ поставлена. В каком предложении это верно?","o":[{"id":"а","t":"Мы решили, что если пойдёт дождь, то останемся дома"},{"id":"б","t":"Мы решили, что если пойдёт дождь, останемся дома"},{"id":"в","t":"Пришла весна, и когда потеплело, ручьи побежали"},{"id":"г","t":"Он сказал, что когда все уснут, он тихо уйдёт"}],"c":"а","e":"Отсутствие запятой оправдано только там, где есть вторая часть двойного союза. В первом предложении «если…то» — запятой на стыке нет. В остальных ТО/ТАК/НО отсутствует, поэтому там запятая как раз нужна."},{"id":"x-rus-t20-g08","k":"mc","les":"RU053","task":20,"q":"«Стемнело, и ( ) когда зажглись фонари, город преобразился». Нужна ли запятая в скобках?","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"а","e":"Стык «и + когда». Изымаем придаточное: «Стемнело, и город преобразился» — фраза цела, ТО/ТАК/НО нет. Значит, запятая на стыке нужна."},{"id":"x-rus-t20-g09","k":"mc","les":"RU053","task":20,"q":"«Стемнело, и ( ) когда зажглись фонари, то город преобразился». Нужна ли запятая в скобках?","o":[{"id":"а","t":"Да, нужна"},{"id":"б","t":"Нет, не нужна"}],"c":"б","e":"После придаточного стоит «то» — вторая часть двойного союза «когда…то». Изъять придаточное нельзя, поэтому запятая на стыке «и когда» не ставится."},{"id":"x-rus-t20-g10","k":"mc","les":"RU053","task":20,"q":"«Задача оказалась трудной, но ( ) если разобраться в условии, решение находится быстро». Нужна ли запятая?","o":[{"id":"а","t":"Да"},{"id":"б","t":"Нет"}],"c":"а","e":"Стык «но + если». Убираем придаточное: «Задача оказалась трудной, но решение находится быстро» — цело, ТО/ТАК нет. Запятая нужна."},{"id":"x-rus-t20-g11","k":"mc","les":"RU053","task":20,"q":"«Задача оказалась трудной, но ( ) если разобраться в условии, то решение находится быстро». Нужна ли запятая?","o":[{"id":"а","t":"Да"},{"id":"б","t":"Нет"}],"c":"б","e":"Есть «то» — двойной союз «если…то». Части разрывать нельзя, поэтому запятая на стыке «но если» не ставится."},{"id":"x-rus-t20-g12","k":"mc","les":"RU053","task":20,"q":"«Мы вышли рано, и ( ) чтобы не опоздать, прибавили шагу». Нужна ли запятая?","o":[{"id":"а","t":"Да"},{"id":"б","t":"Нет"}],"c":"а","e":"Стык «и + чтобы». Изымаем: «Мы вышли рано, и прибавили шагу» — фраза цела, у «чтобы» второй части то/так/но нет. Запятая нужна."},{"id":"x-rus-t20-g13","k":"mc","les":"RU053","task":20,"q":"В каком предложении запятая на стыке «и когда» расставлена ВЕРНО?","o":[{"id":"а","t":"Начался ливень, и, когда мы спрятались, гроза утихла"},{"id":"б","t":"Начался ливень, и когда мы спрятались, то, гроза утихла"},{"id":"в","t":"Начался ливень и, когда мы спрятались гроза утихла"}],"c":"а","e":"Придаточное «когда мы спрятались» изымается: «Начался ливень, и гроза утихла». Значит, оно выделяется запятыми с двух сторон, в том числе между «и» и «когда». Верен первый вариант."},{"id":"x-rus-t20-g14","k":"mc","les":"RU053","task":20,"q":"Дан ответ: «запятая на стыке НЕ нужна». Для какого предложения он верен?","o":[{"id":"а","t":"Похолодало, и когда выпал снег, то дети обрадовались"},{"id":"б","t":"Похолодало, и когда выпал снег, дети обрадовались"}],"c":"а","e":"Ответ «не нужна» подходит только там, где есть вторая часть двойного союза. В первом предложении «когда…то» — запятая на стыке «и когда» не ставится."},{"id":"x-rus-t20-g15","k":"mc","les":"RU053","task":20,"q":"«Он предупредил, что ( ) если задержится, ужинать надо без него». Нужна ли запятая?","o":[{"id":"а","t":"Да"},{"id":"б","t":"Нет"}],"c":"а","e":"Стык двух подчинительных: «что + если». Изымаем внутреннее придаточное: «Он предупредил, что ужинать надо без него» — цело, ТО нет. Запятая между «что» и «если» нужна."},{"id":"x-rus-t20-g16","k":"mc","les":"RU053","task":20,"q":"«Он предупредил, что ( ) если задержится, то ужинать надо без него». Нужна ли запятая?","o":[{"id":"а","t":"Да"},{"id":"б","t":"Нет"}],"c":"б","e":"После придаточного стоит «то» — двойной союз «если…то». Изъять придаточное нельзя, поэтому запятая на стыке «что если» не ставится."},{"id":"x-rus-t20-g17","k":"mc","les":"RU053","task":20,"q":"«Учитель заметил, что ( ) когда ученики увлечены, время летит незаметно». Нужна ли запятая?","o":[{"id":"а","t":"Да"},{"id":"б","t":"Нет"}],"c":"а","e":"Стык «что + когда». Изымаем: «Учитель заметил, что время летит незаметно» — фраза цела, ТО/ТАК нет. Запятая нужна."},{"id":"x-rus-t20-g18","k":"mc","les":"RU053","task":20,"q":"«Она надеялась, что ( ) хотя все устали, работу удастся закончить». Нужна ли запятая?","o":[{"id":"а","t":"Да"},{"id":"б","t":"Нет"}],"c":"а","e":"Стык «что + хотя». Второй части «но» после придаточного нет, поэтому изъятие проходит: «Она надеялась, что работу удастся закончить». Запятая нужна."},{"id":"x-rus-t20-g19","k":"mc","les":"RU053","task":20,"q":"«Она надеялась, что ( ) хотя все устали, но работу удастся закончить». Нужна ли запятая?","o":[{"id":"а","t":"Да"},{"id":"б","t":"Нет"}],"c":"б","e":"У уступительного союза «хотя» вторая часть — «но». Здесь оно есть («хотя…но»), значит придаточное не изъять и запятая на стыке «что хотя» не ставится."},{"id":"x-rus-t20-g20","k":"mc","les":"RU053","task":20,"q":"В каком предложении на стыке двух подчинительных союзов запятая нужна?","o":[{"id":"а","t":"Гид сказал, что когда откроют музей, всех пропустят"},{"id":"б","t":"Гид сказал, что когда откроют музей, то всех пропустят"}],"c":"а","e":"В первом предложении нет «то»: изъятие проходит («Гид сказал, что всех пропустят») — запятая между «что» и «когда» нужна. Во втором есть «когда…то», поэтому запятой нет."},{"id":"x-rus-t20-g21","k":"mc","les":"RU053","task":20,"q":"Ответ: «запятая нужна». Какое объяснение правильно для «Я верю, что( ) если постараться, мечта сбудется»?","o":[{"id":"а","t":"Придаточное «если постараться» можно изъять, и второй части «то» нет"},{"id":"б","t":"После «если» всегда ставится запятая"},{"id":"в","t":"«что» и «если» — сочинительные союзы"},{"id":"г","t":"В предложении есть слово «то»"}],"c":"а","e":"Проверка изъятием: «Я верю, что мечта сбудется» — фраза цела, ТО отсутствует. Именно поэтому на стыке «что если» нужна запятая."},{"id":"x-rus-t20-g22","k":"mc","les":"RU053","task":20,"q":"Приём изъятия: «Светало, и ( ) когда петухи запели, деревня проснулась» → «Светало, и деревня проснулась». О чём это говорит?","o":[{"id":"а","t":"Придаточное изымается свободно — значит, запятая на стыке нужна"},{"id":"б","t":"Предложение разрушилось — значит, запятая не нужна"}],"c":"а","e":"Раз после изъятия придаточного фраза осталась целой и нет то/так/но, приём прошёл успешно. Это признак того, что запятую на стыке «и когда» ставить нужно."},{"id":"x-rus-t20-g23","k":"mc","les":"RU053","task":20,"q":"«Родители обещали, что ( ) если сдам экзамены, поедем к морю». Проверь изъятием и реши.","o":[{"id":"а","t":"Запятая нужна"},{"id":"б","t":"Запятая не нужна"}],"c":"а","e":"Изымаем: «Родители обещали, что поедем к морю» — цело, ТО нет. Приём прошёл, значит запятая на стыке «что если» нужна."},{"id":"x-rus-t20-g24","k":"mc","les":"RU053","task":20,"q":"«Дождь усилился, но ( ) когда мы добежали до навеса, почти не намокли». Нужна ли запятая?","o":[{"id":"а","t":"Да"},{"id":"б","t":"Нет"}],"c":"а","e":"Изымаем придаточное: «Дождь усилился, но почти не намокли» — фраза цела, то/так/но-продолжения нет. Запятая на стыке «но когда» нужна."},{"id":"x-rus-t20-g25","k":"mc","les":"RU053","task":20,"q":"«Капитан знал, что ( ) чтобы выиграть, команде нужен точный план». Нужна ли запятая?","o":[{"id":"а","t":"Да"},{"id":"б","t":"Нет"}],"c":"а","e":"Стык «что + чтобы». Изымаем: «Капитан знал, что команде нужен точный план» — цело. У «чтобы» второй части то/так/но нет. Запятая нужна."},{"id":"x-rus-t20-g26","k":"mc","les":"RU053","task":20,"q":"«Прозвенел звонок, и ( ) хотя урок закончился, никто не встал». Нужна ли запятая?","o":[{"id":"а","t":"Да"},{"id":"б","t":"Нет"}],"c":"а","e":"Стык «и + хотя». После придаточного нет «но», поэтому изъятие проходит: «Прозвенел звонок, и никто не встал». Запятая на стыке нужна."},{"id":"x-rus-t20-g27","k":"mc","les":"RU053","task":20,"q":"В каком предложении приём изъятия придаточного проходит успешно (значит, запятая нужна)?","o":[{"id":"а","t":"Он сказал, что когда стихнет буря, корабль выйдет в море"},{"id":"б","t":"Он сказал, что когда стихнет буря, то корабль выйдет в море"}],"c":"а","e":"В первом: «Он сказал, что корабль выйдет в море» — цело, ТО нет, запятая нужна. Во втором «когда…то» держит придаточное, изъять нельзя — запятой нет."},{"id":"x-rus-t20-g28","k":"mc","les":"RU053","task":20,"q":"«Мы договорились, что ( ) если пойдёт снег, то встречу перенесём». Нужна ли запятая в скобках?","o":[{"id":"а","t":"Нет, не нужна"},{"id":"б","t":"Да, нужна"}],"c":"а","e":"После придаточного стоит «то» — двойной союз «если…то». Части разрывать нельзя, поэтому запятая на стыке «что если» не ставится."},{"id":"x-rus-t20-g29","k":"mc","les":"RU053","task":20,"q":"«Стало темно, и ( ) когда включили свет, так с
