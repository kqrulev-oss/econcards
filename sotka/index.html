рое предложение содержит следствие первого."},{"id":"б","t":"Второе предложение объясняет причину того, о чём сказано в первом."},{"id":"в","t":"Второе предложение противопоставлено первому."},{"id":"г","t":"Второе предложение вводит пример."}],"c":"б","e":"Как прийти к ответу: «ведь» — связка причины, отвечающая на вопрос «почему?». Значит, верно второе объяснение. Следствие вводит «поэтому», контраст — «однако», пример — «например»."},{"id":"x-rus-t2-g22","k":"mc","les":"RU011","task":2,"q":"Этот сплав прочен и удивительно лёгок. (…), он совсем не боится влаги.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Кроме того"},{"id":"б","t":"Однако"},{"id":"в","t":"Поэтому"},{"id":"г","t":"Наоборот"}],"c":"а","e":"Как прийти к ответу: второе предложение добавляет ещё одно достоинство того же ряда (прочный, лёгкий — и не боится влаги). Добавление вводит «кроме того». «Однако/наоборот» — контраст, «поэтому» — следствие."},{"id":"x-rus-t2-g23","k":"mc","les":"RU011","task":2,"q":"Спортсмен побил рекорд страны. (…), он превзошёл и мировое достижение.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Более того"},{"id":"б","t":"Однако"},{"id":"в","t":"Например"},{"id":"г","t":"Следовательно"}],"c":"а","e":"Как прийти к ответу: второй факт сильнее первого, идёт нарастание (рекорд страны → мировой). Усиление вводит «более того». «Кроме того» тоже добавляет, но именно нарастание точнее передаёт «более того»; контраст и следствие тут не подходят."},{"id":"x-rus-t2-g24","k":"mc","les":"RU011","task":2,"q":"Книга увлекательна по содержанию. Она (…) прекрасно оформлена и богато иллюстрирована.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"к тому же"},{"id":"б","t":"однако"},{"id":"в","t":"поэтому"},{"id":"г","t":"наоборот"}],"c":"а","e":"Как прийти к ответу: второе достоинство (оформление) прибавляется к первому (содержание). Присоединение внутри предложения передаёт «к тому же». «Однако/наоборот» вводили бы недостаток, «поэтому» — следствие."},{"id":"x-rus-t2-g25","k":"mc","les":"RU011","task":2,"q":"Новый сотрудник быстро освоил все обязанности. (…) он предложил несколько ценных идей.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Кроме того"},{"id":"б","t":"Зато"},{"id":"в","t":"Ведь"},{"id":"г","t":"То есть"}],"c":"а","e":"Как прийти к ответу: второе предложение прибавляет ещё один плюс сотрудника того же ряда. Это добавление — «кроме того». «Зато» — компенсация, «ведь» — причина, «то есть» — пояснение."},{"id":"x-rus-t2-g26","k":"mc","les":"RU011","task":2,"q":"Он не только согласился помочь. (…), он сделал даже больше, чем его просили.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Более того"},{"id":"б","t":"Однако"},{"id":"в","t":"Поэтому"},{"id":"г","t":"Например"}],"c":"а","e":"Как прийти к ответу: второй довод усиливает первый (согласился → сделал больше). Нарастание мысли вводит «более того». Контраст, следствие и пример логике усиления не соответствуют."},{"id":"x-rus-t2-g27","k":"mc","les":"RU011","task":2,"q":"В каком случае уместно слово со значением ДОБАВЛЕНИЯ ещё одного факта?","o":[{"id":"а","t":"Дом старый. (…) его давно пора ремонтировать."},{"id":"б","t":"Дом старый. (…) он ещё и стоит в неудобном месте."},{"id":"в","t":"Дом старый. (…) выглядит он вполне крепким."}],"c":"б","e":"Как прийти к ответу: добавление — это ещё один факт того же ряда. Во втором пункте к «старости» прибавляется «неудобное место» (кроме того). В первом — следствие («поэтому»), в третьем — противопоставление («однако»)."},{"id":"x-rus-t2-g28","k":"mc","les":"RU011","task":2,"q":"Дан ответ: БОЛЕЕ ТОГО. Что оно выражает?","o":[{"id":"а","t":"Усиление, нарастание мысли — добавляет ещё более весомый довод."},{"id":"б","t":"Противопоставление."},{"id":"в","t":"Причину."},{"id":"г","t":"Порядок перечисления по пунктам."}],"c":"а","e":"Как прийти к ответу: «более того» присоединяет довод, который сильнее предыдущего, — это градация, нарастание. Значит, первый вариант. Контраст, причина и перечисление вводятся другими словами."},{"id":"x-rus-t2-g29","k":"mc","les":"RU011","task":2,"q":"Многих домашних животных легко обучить. (…), собаки способны выполнять десятки команд.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Например"},{"id":"б","t":"Однако"},{"id":"в","t":"Поэтому"},{"id":"г","t":"Зато"}],"c":"а","e":"Как прийти к ответу: второе предложение приводит частный случай к общему утверждению (животные обучаемы → собаки как пример). Пример вводит «например». Контраст, следствие и компенсация тут не подходят."},{"id":"x-rus-t2-g30","k":"mc","les":"RU011","task":2,"q":"Реформа затронула самые разные области жизни. (…), серьёзно изменилась система школьного образования.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"В частности"},{"id":"б","t":"Наоборот"},{"id":"в","t":"Следовательно"},{"id":"г","t":"Ведь"}],"c":"а","e":"Как прийти к ответу: второе предложение выделяет одну конкретную область из общего ряда. Такое выделение частного вводит «в частности» (близко к «например»). «Наоборот» — контраст, «следовательно» — вывод, «ведь» — причина."},{"id":"x-rus-t2-g31","k":"mc","les":"RU011","task":2,"q":"Опыт необходимо повторить трижды. (…), результат должен подтвердиться в каждой из попыток.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"То есть"},{"id":"б","t":"Однако"},{"id":"в","t":"Кроме того"},{"id":"г","t":"Зато"}],"c":"а","e":"Как прийти к ответу: второе предложение поясняет первое, повторяет мысль другими словами (повторить трижды = подтвердить в каждой попытке). Пояснение-равнозначность вводит «то есть». Остальные варианты меняют смысл."},{"id":"x-rus-t2-g32","k":"mc","les":"RU011","task":2,"q":"Причин у этого явления несколько. Во-первых, изменился климат; во-вторых, выросло население; (…), усилилось загрязнение среды.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"наконец"},{"id":"б","t":"однако"},{"id":"в","t":"например"},{"id":"г","t":"поэтому"}],"c":"а","e":"Как прийти к ответу: перед нами перечисление по пунктам (во-первых, во-вторых…). Последний пункт ряда вводит «наконец». «Однако/поэтому/например» ряд перечисления не продолжают."},{"id":"x-rus-t2-g33","k":"mc","les":"RU011","task":2,"q":"Он большой мастер недомолвок. (…), он почти никогда не говорит прямо.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Иными словами"},{"id":"б","t":"Однако"},{"id":"в","t":"Поэтому"},{"id":"г","t":"Зато"}],"c":"а","e":"Как прийти к ответу: второе предложение перефразирует первое, объясняет ту же мысль по-другому (мастер недомолвок = не говорит прямо). Такое перефразирование вводит «иными словами». Контраст и следствие здесь неуместны."},{"id":"x-rus-t2-g34","k":"mc","les":"RU011","task":2,"q":"В каком случае уместно слово НАПРИМЕР (вводит пример к сказанному)?","o":[{"id":"а","t":"Спорт укрепляет здоровье. (…), плавание развивает почти все группы мышц."},{"id":"б","t":"Спорт укрепляет здоровье. (…) заниматься им нужно регулярно."},{"id":"в","t":"Спорт укрепляет здоровье. (…) не всем он одинаково доступен."}],"c":"а","e":"Как прийти к ответу: «например» вводит частный случай общей мысли. В первом пункте плавание — пример полезного спорта. Во втором — следствие («поэтому»), в третьем — противопоставление («однако»)."},{"id":"x-rus-t2-g35","k":"mc","les":"RU011","task":2,"q":"Дан ответ: ТО ЕСТЬ. Какова его роль?","o":[{"id":"а","t":"Вводит пояснение: уточняет, повторяет сказанное другими словами."},{"id":"б","t":"Выражает противопоставление."},{"id":"в","t":"Указывает на причину."},{"id":"г","t":"Добавляет новый, независимый факт."}],"c":"а","e":"Как прийти к ответу: «то есть» присоединяет пояснение-равнозначность, раскрывает мысль иначе. Значит, первый вариант. Контраст, причина и добавление вводятся другими связками."},{"id":"x-rus-t2-g36","k":"mc","les":"RU011","task":2,"q":"В углу гостиной стоял массивный дубовый шкаф. (…) шкаф достался хозяину ещё от деда.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Этот"},{"id":"б","t":"Такой"},{"id":"в","t":"Каждый"},{"id":"г","t":"Любой"}],"c":"а","e":"Как прийти к ответу: пропуск указывает на конкретный, уже названный предмет (тот самый шкаф). Указательное «этот» согласуется с ним в роде, числе, падеже. «Такой» указывал бы на признак, «каждый/любой» — на все шкафы вообще."},{"id":"x-rus-t2-g37","k":"mc","les":"RU011","task":2,"q":"Учёный посвятил своему исследованию всю жизнь. (…) труд не пропал даром.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Этот"},{"id":"б","t":"Свой"},{"id":"в","t":"Такой"},{"id":"г","t":"Некоторый"}],"c":"а","e":"Как прийти к ответу: пропуск отсылает к уже названному «исследованию/труду» — конкретный предмет. Указательное «этот» (м. р., ед. ч.) верно связывает предложения. «Свой» вносит принадлежность, «такой» — признак, «некоторый» — неопределённость."},{"id":"x-rus-t2-g38","k":"mc","les":"RU011","task":2,"q":"Ледники планеты стремительно тают. (…) грозит подъёмом уровня Мирового океана.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Это"},{"id":"б","t":"Он"},{"id":"в","t":"Такой"},{"id":"г","t":"Тот"}],"c":"а","e":"Как прийти к ответу: пропуск-подлежащее замещает не отдельное слово, а всю мысль первого предложения (сам факт таяния). Целую мысль в роли подлежащего замещает «это» (ср. род). «Он/тот» требовали бы конкретного существительного, «такой» — признака."},{"id":"x-rus-t2-g39","k":"mc","les":"RU011","task":2,"q":"Компании требуется помощник, свободно владеющий тремя языками. (…) специалиста найти сегодня непросто.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Такого"},{"id":"б","t":"Этого"},{"id":"в","t":"Своего"},{"id":"г","t":"Любого"}],"c":"а","e":"Как прийти к ответу: пропуск указывает не на конкретное лицо, а на человека с описанным признаком (владеющего языками). На признак/качество указывает «такой». «Этот» показал бы на уже названного конкретного человека, «свой/любой» меняют смысл."},{"id":"x-rus-t2-g40","k":"mc","les":"RU011","task":2,"q":"Весной в сквере высадили молодые липы. (…) быстро прижились и дали первую листву.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Они"},{"id":"б","t":"Это"},{"id":"в","t":"Такие"},{"id":"г","t":"Те"}],"c":"а","e":"Как прийти к ответу: пропуск замещает существительное «липы» (мн. ч.) в роли подлежащего. Простую замену без указания даёт личное местоимение «они». «Это» замещало бы мысль, «такие» — признак, «те» противопоставляло бы другим."},{"id":"x-rus-t2-g41","k":"mc","les":"RU011","task":2,"q":"В каком случае пропуск заменяет ЦЕЛУЮ мысль первого предложения, а не отдельное слово?","o":[{"id":"а","t":"На заводе установили новые станки. (…) станки работают вдвое быстрее."},{"id":"б","t":"На заводе установили новые станки. (…) сразу повысило производительность труда."},{"id":"в","t":"На заводе установили новые станки. Инженеры (…) долго обучались работе на них."}],"c":"б","e":"Как прийти к ответу: во втором пункте подлежащее замещает весь факт (сам факт установки повысил производительность) — здесь нужно «это». В первом пропуск указывает на слово «станки» («эти»), в третьем — на инженеров («свои»)."},{"id":"x-rus-t2-g42","k":"mc","les":"RU011","task":2,"q":"Дан ответ: ТАКОЙ. На что указывает это местоимение?","o":[{"id":"а","t":"На признак, качество предмета, о котором говорилось ранее."},{"id":"б","t":"На причину."},{"id":"в","t":"На следствие."},{"id":"г","t":"На противопоставление."}],"c":"а","e":"Как прийти к ответу: «такой» — указательное местоимение, отсылающее к признаку или качеству ранее описанного предмета/лица. Значит, первый вариант. Причину, следствие и контраст выражают союзы, а не местоимение."},{"id":"x-rus-t2-g43","k":"mc","les":"RU011","task":2,"q":"Успех приходит вовсе не к самым удачливым. (…) упорный ежедневный труд приводит человека к цели.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Именно"},{"id":"б","t":"Однако"},{"id":"в","t":"Поэтому"},{"id":"г","t":"Ведь"}],"c":"а","e":"Как прийти к ответу: нужно выделить, подчеркнуть, что к цели ведёт не что-нибудь, а труд («не другое, а это»). Точное выделение даёт частица «именно». «Однако» — контраст, «поэтому» — следствие, «ведь» — причина."},{"id":"x-rus-t2-g44","k":"mc","les":"RU011","task":2,"q":"Вход в парк был платным для всех посетителей. (…) детям младше семи лет билет не требовался.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Только"},{"id":"б","t":"Именно"},{"id":"в","t":"Даже"},{"id":"г","t":"Поэтому"}],"c":"а","e":"Как прийти к ответу: второе предложение вводит единственное исключение из общего правила. Ограничение, выделение единственного случая передаёт «только» (= «лишь»). «Именно» — точное выделение, «даже» — крайний случай, «поэтому» — следствие."},{"id":"x-rus-t2-g45","k":"mc","les":"RU011","task":2,"q":"Задача оказалась необычайно трудной. Её не смог решить (…) самый опытный математик.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"даже"},{"id":"б","t":"лишь"},{"id":"в","t":"именно"},{"id":"г","t":"зато"}],"c":"а","e":"Как прийти к ответу: подчёркивается крайний, неожиданный случай (не справился настолько сильный специалист). Крайнюю степень вводит частица «даже». «Лишь» — ограничение, «именно» — точное выделение, «зато» — компенсация."},{"id":"x-rus-t2-g46","k":"mc","les":"RU011","task":2,"q":"Вода — основа всего живого на планете. (…) поэтому так важно беречь её чистоту.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"Именно"},{"id":"б","t":"Однако"},{"id":"в","t":"Например"},{"id":"г","t":"Зато"}],"c":"а","e":"Как прийти к ответу: пропуск усиливает слово «поэтому», подчёркивая причину («именно поэтому» — по этой самой причине). Усилительную частицу даёт «именно». «Однако» и «зато» — контраст, «например» — пример."},{"id":"x-rus-t2-g47","k":"mc","les":"RU011","task":2,"q":"Гонка выдалась тяжёлой: до финиша добрался (…) один спортсмен из двадцати.\nВыберите слово на месте пропуска.","o":[{"id":"а","t":"лишь"},{"id":"б","t":"даже"},{"id":"в","t":"именно"},{"id":"г","t":"зато"}],"c":"а","e":"Как прийти к ответу: подчёркивается, что дошёл всего один — ограничение, малое количество. Значение «только, всего» даёт частица «лишь». «Даже» — крайний случай, «именно» — точное выделение, «зато» — компенсация."},{"id":"x-rus-t2-g48","k":"mc","les":"RU011","task":2,"q":"Дан ответ: ДАЖЕ. Какое значение вносит эта частица?","o":[{"id":"а","t":"Указывает на крайний, неожиданный случай, усиливает высказывание."},{"id":"б","t":"Выражает следствие."},{"id":"в","t":"Ограничивает, выделяет единственное."},{"id":"г","t":"Противопоставляет два факта."}],"c":"а","e":"Как прийти к ответу: «даже» — усилительная частица, отмечающая крайнюю, неожиданную ступень («не справился даже опытный»). Значит, первый вариант. Ограничение даёт «лишь/только», следствие и контраст — союзы."},{"id":"x-rus-t2-g49","k":"mc","les":"RU011","task":2,"q":"В каком случае уместна выделительно-ограничительная частица ЛИШЬ (= только)?","o":[{"id":"а","t":"Все давно разошлись по домам. (…) он один остался ждать в опустевшем зале."},{"id":"б","t":"Пошёл сильный дождь. (…) все прохожие раскрыли зонты."},{"id":"в","t":"Он очень устал за день. (…) продолжал упорно работать."}],"c":"а","e":"Как прийти к ответу: «лишь» выделяет единственное, ограничивает. В первом пункте подчёркивается, что остался только он один. Во втором — следствие («поэтому»), в третьем — противопоставление («однако»)."},{"id":"x-rus-t3-g01","k":"mc","les":"RU012","task":3,"q":"Определите значение слова ГЛУХОЙ: «ГлухОй рОкот грОма доносИлся издалекА».","o":[{"id":"а","t":"Лишённый слуха, не способный слышать"},{"id":"б","t":"Приглушённый, неясный (о звуке)"},{"id":"в","t":"Заросший, отдалённый (о месте)"},{"id":"г","t":"Сплошной, без отверстий"}],"c":"б","e":"Слово относится к «рОкоту» — это звук. Подставляем: рокот не «лишён слуха», не «заросший», не «без отверстий». Подходит только «приглушённый, неясный»: глухОй рОкот = негромкий, невнятный звук."},{"id":"x-rus-t3-g02","k":"mc","les":"RU012","task":3,"q":"«Мы дОлго пробирАлись сквозь глухОй лес». Значение слова ГЛУХОЙ?","o":[{"id":"а","t":"Не способный слышать"},{"id":"б","t":"Тихий, приглушённый (о звуке)"},{"id":"в","t":"Дикий, заросший, отдалённый"},{"id":"г","t":"Не имеющий сквозного отверстия"}],"c":"в","e":"Слово определяет «лес» — это место. Лес не слышит и не звучит, «без отверстий» к лесу не подходит. Подставляем «дикий, заросший, отдалённый» — смысл сохраняется: глухОй лес = глушь."},{"id":"x-rus-t3-g03","k":"mc","les":"RU012","task":3,"q":"«Дом окружАла высОкая глухАя стенА без Окон». Значение слова ГЛУХОЙ?","o":[{"id":"а","t":"Заросший лесом"},{"id":"б","t":"Сплошной, без проёмов и отверстий"},{"id":"в","t":"Неясный по звучанию"},{"id":"г","t":"Отдалённый от жилья"}],"c":"б","e":"Речь о стене «без окон». Подставляем: стена не «заросшая» и не «неясная по звуку». Подходит «сплошная, без проёмов» — на это же указывает уточнение «без Окон»."},{"id":"x-rus-t3-g04","k":"mc","les":"RU012","task":3,"q":"«Это произошлО глухОй нОчью, когдА все спАли». Значение слова ГЛУХОЙ?","o":[{"id":"а","t":"Тихий, безлюдный, самый поздний (о времени)"},{"id":"б","t":"Лишённый слуха"},{"id":"в","t":"Приглушённый (о звуке)"},{"id":"г","t":"Сплошной, без отверстий"}],"c":"а","e":"Слово сочетается со словом «ночь» — обозначение времени. Значения о слухе, звуке и отверстиях к времени неприменимы. Остаётся «самая тихая, глухая пора»: глухАя нОчь = поздняя, безлюдная."},{"id":"x-rus-t3-g05","k":"mc","les":"RU012","task":3,"q":"В каком предложении слово ГЛУХОЙ употреблено в значении «приглушённый, неясный (о звуке)»?","o":[{"id":"а","t":"Дед совсЕм глухОй и не слЫшит телефОна."},{"id":"б","t":"Из подвАла слЫшался глухОй стук."},{"id":"в","t":"За дерЕвней начинАлся глухОй лес."},{"id":"г","t":"ЗабОр был глухОй, без едИной щЕли."}],"c":"б","e":"Проверяем каждое: 1) о человеке — «лишённый слуха»; 3) о лесе — «дикий»; 4) о заборе — «сплошной». Только во 2-м речь о звуке (стук), и глухОй = приглушённый, невнятный."},{"id":"x-rus-t3-g06","k":"mc","les":"RU012","task":3,"q":"Дано: «ПОезд останОвился на глухОм полустАнке». Ученик выбрал толкование «отдалённый, малолюдный». Верно ли?","o":[{"id":"а","t":"Неверно: здесь значение «о звуке»"},{"id":"б","t":"Верно: полустанок далёкий, захолустный"},{"id":"в","t":"Неверно: значение «сплошной»"},{"id":"г","t":"Неверно: значение «лишённый слуха»"}],"c":"б","e":"Полустанок — место. Значения «о звуке», «сплошной», «о слухе» к нему не подходят. Остаётся «отдалённый, захолустный» — выбор ученика верен."},{"id":"x-rus-t3-g07","k":"mc","les":"RU012","task":3,"q":"«К чАю подАли свЕжий, тОлько что испечённый хлеб». Значение слова СВЕЖИЙ?","o":[{"id":"а","t":"Прохладный, чистый (о воздухе)"},{"id":"б","t":"Недавно приготовленный, не испортившийся"},{"id":"в","t":"Новый, только что появившийся (о новостях)"},{"id":"г","t":"Бодрый, отдохнувший"}],"c":"б","e":"Речь о хлебе (о еде) с пометой «только что испечённый». Значит, свЕжий = недавно приготовленный, не чёрствый. Толкования о воздухе, новостях и человеке к хлебу не подходят."},{"id":"x-rus-t3-g08","k":"mc","les":"RU012","task":3,"q":"«В окнО подУл свЕжий Утренний вЕтер». Значение слова СВЕЖИЙ?","o":[{"id":"а","t":"Прохладный, чистый"},{"id":"б","t":"Не испорченный (о продуктах)"},{"id":"в","t":"Только что появившийся (о новости)"},{"id":"г","t":"Не бывший в употреблении"}],"c":"а","e":"Слово описывает ветер (воздух). Ветер не «испорченный» и не «новость». Подставляем «прохладный, чистый» — смысл сохраняется."},{"id":"x-rus-t3-g09","k":"mc","les":"RU012","task":3,"q":"«В газЕте напечАтали свЕжие нОвости». Значение слова СВЕЖИЙ?","o":[{"id":"а","t":"Прохладные"},{"id":"б","t":"Не испорченные"},{"id":"в","t":"Только что появившиеся, новые"},{"id":"г","t":"Отдохнувшие"}],"c":"в","e":"Слово относится к новостям, к сведениям. Прохлада и несвежесть тут ни при чём. свЕжие нОвости = недавно полученные, новые."},{"id":"x-rus-t3-g10","k":"mc","les":"RU012","task":3,"q":"«ПОсле Отдыха он вЫглядел бОдрым и свЕжим». Значение слова СВЕЖИЙ?","o":[{"id":"а","t":"Не испорченный"},{"id":"б","t":"Прохладный"},{"id":"в","t":"Новый"},{"id":"г","t":"Бодрый, отдохнувший, полный сил"}],"c":"г","e":"Слово характеризует человека и стоит рядом со словом «бодрый». Значения о еде, воздухе и новизне неуместны. свЕжий вид = отдохнувший, посвежевший."},{"id":"x-rus-t3-g11","k":"mc","les":"RU012","task":3,"q":"«Острым ножОм легкО нарЕзать Овощи». Значение слова ОСТРЫЙ?","o":[{"id":"а","t":"Хорошо, легко режущий"},{"id":"б","t":"Сильно действующий на вкус, пряный"},{"id":"в","t":"Проницательный, находчивый (об уме)"},{"id":"г","t":"Напряжённый, критический"}],"c":"а","e":"Слово определяет нож. Нож не бывает «пряным» или «проницательным». Острый нож = хорошо наточенный, легко режущий."},{"id":"x-rus-t3-g12","k":"mc","les":"RU012","task":3,"q":"«На стОл поставили Очень острое блЮдо с пЕрцем». Значение слова ОСТРЫЙ?","o":[{"id":"а","t":"Хорошо режущий"},{"id":"б","t":"Сильно действующий на вкус, пряный, жгучий"},{"id":"в","t":"Остроумный"},{"id":"г","t":"Проницательный"}],"c":"б","e":"Речь о блюде, о еде, да ещё «с перцем». Значит острый = жгучий на вкус, пряный. Режущее и умственные значения к блюду не подходят."},{"id":"x-rus-t3-g13","k":"mc","les":"RU012","task":3,"q":"В каком предложении слово ГОРЯЧИЙ употреблено в ПРЯМОМ значении «имеющий высокую температуру»?","o":[{"id":"а","t":"В цехУ началАсь горЯчая порА."},{"id":"б","t":"МЕжду нИми вспЫхнул горЯчий спор."},{"id":"в","t":"Он налИл в крУжку горЯчий чАй."},{"id":"г","t":"У негО горЯчий, вспЫльчивый харАктер."}],"c":"в","e":"Прямое значение — то, что можно измерить термометром. «Пора», «спор», «характер» горячи образно. Буквально высокую температуру имеет только чАй."},{"id":"x-rus-t3-g14","k":"mc","les":"RU012","task":3,"q":"«ПОд ногАми былА твёрдая, ссОхшаяся зЕмля». Значение слова ТВЁРДЫЙ?","o":[{"id":"а","t":"Не жидкий и не мягкий; плотный, жёсткий"},{"id":"б","t":"Устойчивый, непоколебимый (о характере)"},{"id":"в","t":"Уверенный (о походке, руке)"},{"id":"г","t":"Хорошо усвоенный (о знаниях)"}],"c":"а","e":"Слово описывает землю, вещественный предмет, с пометой «ссохшаяся». Переносные значения о характере, походке и знаниях сюда не подходят. твёрдая зЕмля = плотная, жёсткая."},{"id":"x-rus-t3-g15","k":"mc","les":"RU012","task":3,"q":"«Он прИнял твёрдое решЕние не отступАть». Значение слова ТВЁРДЫЙ?","o":[{"id":"а","t":"Плотный, жёсткий"},{"id":"б","t":"Непоколебимый, окончательный, устойчивый"},{"id":"в","t":"Не жидкий"},{"id":"г","t":"Уверенный (о движении)"}],"c":"б","e":"Слово определяет «решение» — отвлечённое понятие, его нельзя пощупать. Физические толкования отпадают. твёрдое решЕние = непоколебимое, окончательное."},{"id":"x-rus-t3-g16","k":"mc","les":"RU012","task":3,"q":"«ГрУз привязАли крЕпкой верёвкой». Значение слова КРЕПКИЙ?","o":[{"id":"а","t":"Прочный, надёжный, не рвущийся"},{"id":"б","t":"Физически сильный, здоровый (о человеке)"},{"id":"в","t":"Насыщенный, сильнодействующий (о чае)"},{"id":"г","t":"Глубокий (о сне)"}],"c":"а","e":"Слово определяет верёвку. Здоровье, насыщенность и сон к верёвке неприменимы. крЕпкая верёвка = прочная, не рвущаяся."},{"id":"x-rus-t3-g17","k":"mc","les":"RU012","task":3,"q":"«Он вЫпил чАшку крЕпкого кОфе». Значение слова КРЕПКИЙ?","o":[{"id":"а","t":"Прочный"},{"id":"б","t":"Здоровый, сильный"},{"id":"в","t":"Насыщенный, сильно действующий"},{"id":"г","t":"Глубокий (о сне)"}],"c":"в","e":"Слово сочетается с «кофе» — с напитком. Прочность, здоровье и сон тут ни при чём. крЕпкий кОфе = насыщенный, сильно действующий."},{"id":"x-rus-t3-g18","k":"mc","les":"RU012","task":3,"q":"«У негО мЯгкий, устУпчивый харАктер». Значение слова МЯГКИЙ?","o":[{"id":"а","t":"Легко поддающийся нажиму, не твёрдый"},{"id":"б","t":"Кроткий, покладистый, уступчивый"},{"id":"в","t":"Приятный, не резкий (о звуке, свете)"},{"id":"г","t":"Тёплый, не суровый (о климате)"}],"c":"б","e":"Слово характеризует «характер», рядом стоит подсказка «уступчивый». Физическая мягкость, свет и климат сюда не подходят. мЯгкий харАктер = кроткий, покладистый."},{"id":"x-rus-t3-g19","k":"mc","les":"RU012","task":3,"q":"«Озеро покрЫл тОнкий, непрОчный лёд». Значение слова ТОНКИЙ?","o":[{"id":"а","t":"Небольшой в поперечнике, малой толщины"},{"id":"б","t":"Изящный, не грубый"},{"id":"в","t":"Высокий (о звуке)"},{"id":"г","t":"Проницательный (об уме)"}],"c":"а","e":"Слово определяет лёд с пометой «непрочный». Изящество, звук и ум ко льду не относятся. тОнкий лёд = малой толщины."},{"id":"x-rus-t3-g20","k":"mc","les":"RU012","task":3,"q":"В каком предложении ТОНКИЙ значит «проницательный, искусный, тонко разбирающийся»?","o":[{"id":"а","t":"ОнА надЕла плАтье из тОнкой ткАни."},{"id":"б","t":"Это был тОнкий знатОк жИвописи."},{"id":"в","t":"СлЫшался тОнкий писк комарА."},{"id":"г","t":"Лёд был совсЕм тОнкий."}],"c":"б","e":"1) о ткани — «малой толщины»; 3) о писке — «высокий по тону»; 4) о льде — «малой толщины». Только во 2-м речь о человеке-знатоке: тОнкий = проницательный, искусный."},{"id":"x-rus-t3-g21","k":"mc","les":"RU012","task":3,"q":"Дано: «У негО твёрдый харАктер». Какое толкование ВЕРНО?","o":[{"id":"а","t":"Не жидкий, плотный"},{"id":"б","t":"Хорошо усвоенный"},{"id":"в","t":"Непоколебимый, стойкий, решительный"},{"id":"г","t":"Уверенный, ровный (о походке)"}],"c":"в","e":"«Характер» — отвлечённое понятие. Физическое «плотный», «о знаниях» и «о походке» отпадают. твёрдый харАктер = стойкий, решительный, непоколебимый."},{"id":"x-rus-t3-g22","k":"mc","les":"RU012","task":3,"q":"«ДЕвочка запЕла тОнким, высОким гОлосом». Значение слова ВЫСОКИЙ?","o":[{"id":"а","t":"Большой по протяжённости снизу вверх"},{"id":"б","t":"Звонкий, тонкий (о звуке, голосе)"},{"id":"в","t":"Выдающийся, почётный"},{"id":"г","t":"Возвышенный, торжественный"}],"c":"б","e":"Слово определяет «голос», рядом подсказка «тонким». Речь о высоте звука, а не о размере или почёте. высОкий гОлос = звонкий, тонкий по тону."},{"id":"x-rus-t3-g23","k":"mc","les":"RU012","task":3,"q":"«ЕмУ окАзана высОкая честь». Значение слова ВЫСОКИЙ?","o":[{"id":"а","t":"Большой по высоте"},{"id":"б","t":"Тонкий (о голосе)"},{"id":"в","t":"Почётная, очень значительная, важная"},{"id":"г","t":"Большая по величине (о цене)"}],"c":"в","e":"Слово определяет «честь» — отвлечённое понятие. Размер, звук и цена сюда не подходят. высОкая честь = почётная, очень значительная."},{"id":"x-rus-t3-g24","k":"mc","les":"RU012","task":3,"q":"«Он совершИл нИзкий, пОдлый постУпок». Значение слова НИЗКИЙ?","o":[{"id":"а","t":"Малый по высоте"},{"id":"б","t":"Басовый (о звуке)"},{"id":"в","t":"Бесчестный, подлый, презренный"},{"id":"г","t":"Небольшой (о цене)"}],"c":"в","e":"Слово определяет «поступок», рядом синоним «подлый». Размер, звук и цена неуместны. нИзкий постУпок = бесчестный, презренный."},{"id":"x-rus-t3-g25","k":"mc","les":"RU012","task":3,"q":"«Он смОтрел на нас с чИстой сОвестью». Значение слова ЧИСТЫЙ?","o":[{"id":"а","t":"Не загрязнённый, опрятный"},{"id":"б","t":"Без примесей"},{"id":"в","t":"Нравственно безупречный, честный"},{"id":"г","t":"Аккуратно, тщательно сделанный"}],"c":"в","e":"Слово определяет «совесть» — отвлечённое понятие. Грязь, примеси и аккуратность к совести неприменимы. чИстая сОвесть = нравственно безупречная, честная."},{"id":"x-rus-t3-g26","k":"mc","les":"RU012","task":3,"q":"«КОльцо былО из чИстого зОлота». Значение слова ЧИСТЫЙ?","o":[{"id":"а","t":"Не грязный"},{"id":"б","t":"Без примесей, беспримесный"},{"id":"в","t":"Аккуратный"},{"id":"г","t":"Нравственно безупречный"}],"c":"б","e":"Слово относится к золоту как к веществу. Речь о составе: чИстое зОлото = без примесей. Опрятность и нравственность тут ни при чём."},{"id":"x-rus-t3-g27","k":"mc","les":"RU012","task":3,"q":"«ПЕред нАми расстилАлось чИстое пОле». Значение слова ЧИСТЫЙ?","o":[{"id":"а","t":"Опрятный, вымытый"},{"id":"б","t":"Без примесей"},{"id":"в","t":"Открытый, ничем не занятый, свободный"},{"id":"г","t":"Сущий, совершенный (чистая правда)"}],"c":"в","e":"Слово описывает поле как пространство. Подставляем: не «вымытое», не «без примесей», не «сущее». Подходит «открытое, ничем не занятое»: чИстое пОле = ровное, свободное."},{"id":"x-rus-t3-g28","k":"mc","les":"RU012","task":3,"q":"В каком предложении ВЫСОКИЙ значит «возвышенный, идейно значительный»?","o":[{"id":"а","t":"Дом оказАлся слИшком высОким."},{"id":"б","t":"ПевЕц взял высОкую нОту."},{"id":"в","t":"Он говорИл о высОких идеАлах."},{"id":"г","t":"В Этом годУ высОкие цЕны."}],"c":"в","e":"1) о доме — размер; 2) о ноте — высота звука; 4) о ценах — большая величина. Только в 3-м «идеалы» описаны как возвышенные, благородные."},{"id":"x-rus-t3-g29","k":"mc","les":"RU012","task":3,"q":"«ЗадАча оказАлась сОвсем лёгкой». Значение слова ЛЁГКИЙ?","o":[{"id":"а","t":"Небольшой по весу"},{"id":"б","t":"Несложный, простой для выполнения"},{"id":"в","t":"Слабый, незначительный"},{"id":"г","t":"Непринуждённый, свободный"}],"c":"б","e":"Слово определяет «задачу». Задачу нельзя взвесить. Подставляем «несложная, простая» — смысл ясен. лёгкая задАча = нетрудная."},{"id":"x-rus-t3-g30","k":"mc","les":"RU012","task":3,"q":"«ПодУл лёгкий ветерОк». Значение слова ЛЁГКИЙ?","o":[{"id":"а","t":"Малый по весу"},{"id":"б","t":"Простой"},{"id":"в","t":"Слабый, несильный, незначительный"},{"id":"г","t":"Поверхностный, несерьёзный"}],"c":"в","e":"Слово характеризует ветер. Вес, сложность и серьёзность к ветру неприменимы. лёгкий ветерОк = слабый, несильный."},{"id":"x-rus-t3-g31","k":"mc","les":"RU012","task":3,"q":"«У негО лёгкий, весёлый харАктер». Значение слова ЛЁГКИЙ?","o":[{"id":"а","t":"Небольшой по весу"},{"id":"б","t":"Несложный"},{"id":"в","t":"Уживчивый, непринуждённый, не создающий трудностей"},{"id":"г","t":"Слабый, незначительный"}],"c":"в","e":"Слово описывает характер человека, рядом «весёлый». Вес и сложность отпадают. лёгкий харАктер = уживчивый, непринуждённый."},{"id":"x-rus-t3-g32","k":"mc","les":"RU012","task":3,"q":"«У ребёнка живОй, любознАтельный ум». Значение слова ЖИВОЙ?","o":[{"id":"а","t":"Обладающий жизнью, не мёртвый"},{"id":"б","t":"Подвижный, деятельный, быстрый"},{"id":"в","t":"Яркий, выразительный"},{"id":"г","t":"Реальный, взятый из жизни"}],"c":"б","e":"Слово определяет «ум», рядом подсказка «любознательный». «Не мёртвый» к уму не подходит по смыслу задания. живОй ум = подвижный, деятельный, быстрый."},{"id":"x-rus-t3-g33","k":"mc","les":"RU012","task":3,"q":"«Он привёл живОй, убедИтельный примЕр». Значение слова ЖИВОЙ?","o":[{"id":"а","t":"Не мёртвый"},{"id":"б","t":"Подвижный (о человеке)"},{"id":"в","t":"Яркий, наглядный, взятый из жизни"},{"id":"г","t":"Существующий, действующий"}],"c":"в","e":"Слово определяет «пример», рядом «убедительный». Пример не «мёртв» и не «подвижен». живОй примЕр = яркий, наглядный, взятый из жизни."},{"id":"x-rus-t3-g34","k":"mc","les":"RU012","task":3,"q":"«ОнИ встрЕтили нас тёплым, сердЕчным приёмом». Значение слова ТЁПЛЫЙ?","o":[{"id":"а","t":"Имеющий умеренно высокую температуру"},{"id":"б","t":"Хорошо защищающий от холода (об одежде)"},{"id":"в","t":"Ласковый, сердечный, дружеский"},{"id":"г","t":"Не жаркий и не холодный (о климате)"}],"c":"в","e":"Слово определяет «приём», рядом синоним «сердечным». Температура, одежда и климат сюда не подходят. тёплый приём = сердечный, дружеский."},{"id":"x-rus-t3-g35","k":"mc","les":"RU012","task":3,"q":"В каком предложении ЖИВОЙ значит «яркий, выразительный»?","o":[{"id":"а","t":"В прудУ не остАлось ни одногО живОго существА."},{"id":"б","t":"ОнА велА живОй, увлекАтельный расскАз."},{"id":"в","t":"Ребёнок был Очень живОй и непосЕдливый."},{"id":"г","t":"Это живОй примЕр из прАктики."}],"c":"б","e":"1) о существе — «обладающий жизнью»; 3) о ребёнке — «подвижный»; 4) о примере — «взятый из жизни». Только во 2-м рассказ описан как живой = яркий, выразительный, увлекательный."},{"id":"x-rus-t3-g36","k":"mc","les":"RU012","task":3,"q":"В каком предложении ГОРЯЧИЙ употреблён в ПЕРЕНОСНОМ значении?","o":[{"id":"а","t":"Он обжёгся о горЯчий утЮг."},{"id":"б","t":"Из крАна теклА горЯчая водА."},{"id":"в","t":"МЕжду спОрщиками разгорЕлся горЯчий спор."},{"id":"г","t":"ЧАй был ещё горЯчий."}],"c":"в","e":"Прямое значение — измеримая температура (утюг, вода, чай). В «горячем споре» температуры нет — это образ, значение «страстный, напряжённый». Значит, переносное употребление в 3-м."},{"id":"x-rus-t3-g37","k":"mc","les":"RU012","task":3,"q":"В каком предложении ОСТРЫЙ употреблён в ПРЯМОМ значении?","o":[{"id":"а","t":"У негО острый, проницАтельный ум."},{"id":"б","t":"Нож был Очень острый."},{"id":"в","t":"ВОзник острый конфлИкт."},{"id":"г","t":"Он отпустИл острое словцО."}],"c":"б","e":"Прямое значение острый — «хорошо режущий», буквальный признак предмета. Ум, конфликт и словцо остры образно. Буквально режущим является только нож."},{"id":"x-rus-t3-g38","k":"mc","les":"RU012","task":3,"q":"«ХолОдный приём» — в каком значении употреблено слово ХОЛОДНЫЙ?","o":[{"id":"а","t":"Имеющий низкую температуру"},{"id":"б","t":"Недружелюбный, равнодушный, сдержанный"},{"id":"в","t":"Плохо защищающий от холода"},{"id":"г","t":"Спокойный, рассудочный"}],"c":"б","e":"«Приём» нельзя измерить термометром — значит, значение переносное. холОдный приём = недружелюбный, сдержанный, без теплоты."},{"id":"x-rus-t3-g39","k":"mc","les":"RU012","task":3,"q":"«СухОй отвЕт» — определите значение слова СУХОЙ.","o":[{"id":"а","t":"Лишённый влаги, не мокрый"},{"id":"б","t":"Сдержанный, холодный, неприветливый"},{"id":"в","t":"Худощавый (о человеке)"},{"id":"г","t":"Неинтересный, скучный (о рассказе)"}],"c":"б","e":"Ответ нельзя намочить или высушить — значение переносное. Речь идёт о тоне: сухОй отвЕт = сдержанный, холодный, неприветливый."},{"id":"x-rus-t3-g40","k":"mc","les":"RU012","task":3,"q":"В каком предложении слово МЯГКИЙ употреблено в ПРЯМОМ значении?","o":[{"id":"а","t":"У неё мЯгкий, дОбрый харАктер."},{"id":"б","t":"ДивАн был мЯгкий и удОбный."},{"id":"в","t":"Он говорИл мЯгким гОлосом."},{"id":"г","t":"В Этом годУ мЯгкая зимА."}],"c":"б","e":"Прямое значение мягкий — «легко поддающийся нажиму», физическое свойство предмета. Характер, голос и зима мягки образно. Буквально таков только диван."},{"id":"x-rus-t3-g41","k":"mc","les":"RU012","task":3,"q":"«ГлубОкая тишинА стоЯла в дОме». Значение слова ГЛУБОКИЙ?","o":[{"id":"а","t":"Имеющий большую глубину (о водоёме)"},{"id":"б","t":"Достигший высшей степени, полный, совершенный"},{"id":"в","t":"Поздний (глубокая ночь)"},{"id":"г","t":"Основательный (о знаниях)"}],"c":"б","e":"«Тишину» нельзя измерить в метрах глубины — значение переносное. глубОкая тишинА = полная, совершенная, ничем не нарушаемая."},{"id":"x-rus-t3-g42","k":"mc","les":"RU012","task":3,"q":"«Твёрдые цЕны не менЯлись весь гОд». Отсеките лишнее и выберите значение.","o":[{"id":"а","t":"Плотный, жёсткий (о материале)"},{"id":"б","t":"Устойчивый, не подлежащий изменению"},{"id":"в","t":"Уверенный (о руке)"},{"id":"г","t":"Хорошо усвоенный (о знаниях)"}],"c":"б","e":"Проверяем сочетание «твёрдые цены»: цены — не материал (не «жёсткие»), не «рука», не «знания». Остаётся «устойчивые, не подлежащие изменению» — это подтверждает «не менялись весь год»."},{"id":"x-rus-t3-g43","k":"mc","les":"RU012","task":3,"q":"«КрЕпкий морОз удАрил нОчью». Выберите подходящее значение.","o":[{"id":"а","t":"Прочный, надёжный"},{"id":"б","t":"Здоровый, сильный (о человеке)"},{"id":"в","t":"Сильный, интенсивный (о морозе, ветре)"},{"id":"г","t":"Глубокий (о сне)"}],"c":"в","e":"Сочетание «крепкий мороз»: мороз не «прочный», не «здоровый», не «сон». Отсекаем лишнее — остаётся «сильный, интенсивный». крЕпкий морОз = очень сильный."},{"id":"x-rus-t3-g44","k":"mc","les":"RU012","task":3,"q":"«ГлубОкая осень ужЕ вступИла в свои правА». Выберите значение.","o":[{"id":"а","t":"Имеющая большую глубину"},{"id":"б","t":"Поздняя, полностью наступившая (о времени года)"},{"id":"в","t":"Основательная (о знаниях)"},{"id":"г","t":"Сильная (о чувстве)"}],"c":"б","e":"Сочетание «глубокая осень»: осень нельзя измерить глубиной, это не «знания» и не «чувство». Остаётся значение о времени: глубОкая осень = поздняя, полностью наступившая."},{"id":"x-rus-t3-g45","k":"mc","les":"RU012","task":3,"q":"«У больнОго высОкая температУра». Выберите значение слова ВЫСОКИЙ.","o":[{"id":"а","t":"Большой по протяжённости вверх"},{"id":"б","t":"Значительно превышающий норму, большой по величине"},{"id":"в","t":"Тонкий (о голосе)"},{"id":"г","t":"Возвышенный, торжественный"}],"c":"б","e":"Сочетание «высокая температура»: температуру не измеришь в высоту снизу вверх, это не голос и не идея. Остаётся «значительно превышающая норму, большая по величине»."},{"id":"x-rus-t3-g46","k":"mc","les":"RU012","task":3,"q":"Дано: «Он облАдал тОнким слУхом». Какое толкование ВЕРНО?","o":[{"id":"а","t":"Малый в поперечнике"},{"id":"б","t":"Высокий (о звуке)"},{"id":"в","t":"Острый, чуткий, способный различать оттенки"},{"id":"г","t":"Изящный, не грубый"}],"c":"в","e":"Сочетание «тонкий слух»: слух не «в поперечнике» и не «высокий по тону». Отсекаем — остаётся «острый, чуткий». тОнкий слух = способный различать малейшие оттенки звука."},{"id":"x-rus-t3-g47","k":"mc","les":"RU012","task":3,"q":"В каком случае толкование слова ЛЁГКИЙ подобрано ВЕРНО?","o":[{"id":"а","t":"«Лёгкий чемодАн» — незначительный, слабый"},{"id":"б","t":"«Лёгкий морОз» — небольшой по весу"},{"id":"в","t":"«Лёгкая пОходка» — непринуждённая, грациозная"},{"id":"г","t":"«Лёгкая задАча» — поверхностная, несерьёзная"}],"c":"в","e":"Проверяем каждое: чемодан — «небольшой по весу» (а не «слабый»); мороз — «слабый» (а не «по весу»); задача — «несложная» (а не «поверхностная»). Верно только для походки: лёгкая пОходка = непринуждённая, грациозная."},{"id":"x-rus-t5-g01","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Мама теплО ... малыша перед прогулкой». (одела / надела)","o":[{"id":"а","t":"одела"},{"id":"б","t":"надела"}],"c":"а","e":"Малыш — тот, КОГО одевают (живое существо). После глагола стоит «кого?» — малыша, значит «одела». Подсказка: одевают Надежду."},{"id":"x-rus-t5-g02","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Я ... новое пальто и вышел на улицу». (одел / надел)","o":[{"id":"а","t":"одел"},{"id":"б","t":"надел"}],"c":"б","e":"Пальто — вещь, которую надевают на себя (что?). После глагола «что?» — пальто, значит «надел». Подсказка: надевают одежду."},{"id":"x-rus-t5-g03","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Бабушка ... внучку в тёплую шубку». (одела / надела)","o":[{"id":"а","t":"одела"},{"id":"б","t":"надела"}],"c":"а","e":"Внучка — тот, кого одевают (кого? — внучку). Значит «одела». Живое существо → одеть."},{"id":"x-rus-t5-g04","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Перед выходом артИст ... костюм и грим». (одел / надел)","o":[{"id":"а","t":"одел"},{"id":"б","t":"надел"}],"c":"б","e":"Костюм — что надевают на себя (что? — костюм). Значит «надел». Вещь на себя → надеть."},{"id":"x-rus-t5-g05","k":"mc","les":"RU019","task":5,"q":"В каком предложении пароним употреблён ВЕРНО?","o":[{"id":"а","t":"Он одел шляпу и вышел."},{"id":"б","t":"Он надел шляпу и вышел."},{"id":"в","t":"Он одел на голову шляпу."}],"c":"б","e":"Шляпа — вещь, надеваемая на себя (что?). Верно «надел шляпу». Варианты со «одел шляпу» ошибочны: «одеть» требует того, кого одевают."},{"id":"x-rus-t5-g06","k":"mc","les":"RU019","task":5,"q":"Дан верный ответ: «надеть перчатки». Какое объяснение правильно?","o":[{"id":"а","t":"Перчатки — тот, кого одевают, поэтому надеть"},{"id":"б","t":"Перчатки — вещь, которую надевают на себя (что?), поэтому надеть"},{"id":"в","t":"Оба глагола здесь равнозначны"}],"c":"б","e":"Перчатки — предмет одежды (что?), надеваемый на себя. Правило: надевают одежду → «надеть перчатки»."},{"id":"x-rus-t5-g07","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Разрешите ... вам нового сотрудника». (представить / предоставить)","o":[{"id":"а","t":"представить"},{"id":"б","t":"предоставить"}],"c":"а","e":"Речь о знакомстве — познакомить с человеком. Это значение у «представить». Подставь «познакомить» — подходит."},{"id":"x-rus-t5-g08","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Банк ... клиенту крупный кредит». (представил / предоставил)","o":[{"id":"а","t":"представил"},{"id":"б","t":"предоставил"}],"c":"б","e":"Кредит дают в пользование, распоряжение. Значение «дать в пользование» — у «предоставить». Подставь «дал» — подходит."},{"id":"x-rus-t5-g09","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Ему ... возможность выступить первым». (представили / предоставили)","o":[{"id":"а","t":"представили"},{"id":"б","t":"предоставили"}],"c":"б","e":"«Дать возможность» — это «предоставить возможность». Устойчивое сочетание. Подставь «дали возможность»."},{"id":"x-rus-t5-g10","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Абитуриент должен ... документы в приёмную комиссию». (представить / предоставить)","o":[{"id":"а","t":"представить"},{"id":"б","t":"предоставить"}],"c":"а","e":"Здесь значение «предъявить, подать документы» — это «представить документы». Подставь «предъявить»."},{"id":"x-rus-t5-g11","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Директор ... сотруднику внеочередной отпуск». (представил / предоставил)","o":[{"id":"а","t":"представил"},{"id":"б","t":"предоставил"}],"c":"б","e":"Отпуск дают в распоряжение — «предоставить отпуск». Подставь «дал». Устойчивое: предоставить отпуск/слово/кредит."},{"id":"x-rus-t5-g12","k":"mc","les":"RU019","task":5,"q":"В каком случае нужен глагол «предоставить»?","o":[{"id":"а","t":"... гостя хозяевам"},{"id":"б","t":"... слово докладчику"},{"id":"в","t":"... себе картину будущего"}],"c":"б","e":"«Предоставить слово» = дать возможность говорить. В остальных: представить гостя (познакомить), представить картину (вообразить)."},{"id":"x-rus-t5-g13","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Она появилась в ... красном платье». (эффектном / эффективном)","o":[{"id":"а","t":"эффектном"},{"id":"б","t":"эффективном"}],"c":"а","e":"Платье производит впечатление, яркое — «эффектное». Подставь «яркое, броское» — подходит."},{"id":"x-rus-t5-g14","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Учёные нашли ... способ борьбы с болезнью». (эффектный / эффективный)","o":[{"id":"а","t":"эффектный"},{"id":"б","t":"эффективный"}],"c":"б","e":"Способ, дающий результат, — «эффективный». Подставь «действенный, результативный»."},{"id":"x-rus-t5-g15","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Спектакль завершился ... финалом». (эффектным / эффективным)","o":[{"id":"а","t":"эффектным"},{"id":"б","t":"эффективным"}],"c":"а","e":"Финал производит впечатление — «эффектный». Проверка синонимом «яркий, впечатляющий»."},{"id":"x-rus-t5-g16","k":"mc","les":"RU019","task":5,"q":"Выберите верное существительное: «... нового метода подтвердилась ростом продаж». (Эффектность / Эффективность)","o":[{"id":"а","t":"Эффектность"},{"id":"б","t":"Эффективность"}],"c":"б","e":"Речь о результативности метода — «эффективность». «Эффектность» — это яркость, внешнее впечатление."},{"id":"x-rus-t5-g17","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Это лекарство очень ..., боль проходит за минуты». (эффектное / эффективное)","o":[{"id":"а","t":"эффектное"},{"id":"б","t":"эффективное"}],"c":"б","e":"Лекарство даёт результат — «эффективное» (действенное). Не о впечатлении, а о пользе."},{"id":"x-rus-t5-g18","k":"mc","les":"RU019","task":5,"q":"Где верно употреблено слово «эффектный»?","o":[{"id":"а","t":"эффектный метод лечения"},{"id":"б","t":"эффектный жест на сцене"},{"id":"в","t":"эффектное использование ресурсов"}],"c":"б","e":"«Эффектный» = производящий впечатление, поэтому «эффектный жест». В остальных нужен «эффективный» (результативный)."},{"id":"x-rus-t5-g19","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Мой дед очень ... человек, зря денег не тратит». (экономный / экономичный)","o":[{"id":"а","t":"экономный"},{"id":"б","t":"экономичный"}],"c":"а","e":"О человеке, который бережлив, — «экономный». Проверка: «бережливый»."},{"id":"x-rus-t5-g20","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Этот автомобиль очень ..., мало расходует топлива». (экономный / экономичный)","o":[{"id":"а","t":"экономный"},{"id":"б","t":"экономичный"}],"c":"б","e":"Механизм, дающий экономию, — «экономичный». Проверка: «дающий экономию»."},{"id":"x-rus-t5-g21","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «В стране разразился ... кризис». (экономный / экономический)","o":[{"id":"а","t":"экономный"},{"id":"б","t":"экономический"}],"c":"б","e":"Относится к экономике как сфере — «экономический». Проверка: «относящийся к экономике»."},{"id":"x-rus-t5-g22","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «... режим стирки бережёт воду и электричество». (Экономный / Экономичный)","o":[{"id":"а","t":"Экономный"},{"id":"б","t":"Экономичный"}],"c":"б","e":"Режим даёт экономию ресурсов — «экономичный». Не о человеке, а об устройстве/способе."},{"id":"x-rus-t5-g23","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «На форуме обсуждали ... развитие региона». (экономное / экономическое)","o":[{"id":"а","t":"экономное"},{"id":"б","t":"экономическое"}],"c":"б","e":"Развитие относится к экономике — «экономическое». Проверка: «относящееся к экономике»."},{"id":"x-rus-t5-g24","k":"mc","les":"RU019","task":5,"q":"К какому существительному подходит слово «экономный»?","o":[{"id":"а","t":"двигатель"},{"id":"б","t":"хозяин"},{"id":"в","t":"кризис"}],"c":"б","e":"«Экономный» = бережливый, о человеке. Значит «экономный хозяин». Двигатель — экономичный, кризис — экономический."},{"id":"x-rus-t5-g25","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Он стал ... международного конкурса скрипачей». (дипломатом / дипломантом)","o":[{"id":"а","t":"дипломатом"},{"id":"б","t":"дипломантом"}],"c":"б","e":"Награждённый на конкурсе — «дипломант». Проверка: получил диплом на состязании."},{"id":"x-rus-t5-g26","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Сложные переговоры вёл опытный ... ». (дипломат / дипломант)","o":[{"id":"а","t":"дипломат"},{"id":"б","t":"дипломант"}],"c":"а","e":"Работник дипломатии — «дипломат». На переговорах работает именно дипломат, а не участник конкурса."},{"id":"x-rus-t5-g27","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Он повёл себя очень ..., никого не задев». (дипломатично / дипломатически)","o":[{"id":"а","t":"дипломатично"},{"id":"б","t":"дипломатически"}],"c":"а","e":"Свойство поведения (тактично) — от «дипломатичный». Проверка: «тактично, тонко»."},{"id":"x-rus-t5-g28","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «На приёме присутствовал весь ... корпус». (дипломатичный / дипломатический)","o":[{"id":"а","t":"дипломатичный"},{"id":"б","t":"дипломатический"}],"c":"б","e":"Принадлежность к сфере дипломатии — «дипломатический корпус». «Дипломатичный» = тактичный (о поведении)."},{"id":"x-rus-t5-g29","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Победитель и три ... вышли на сцену за наградами». (дипломата / дипломанта)","o":[{"id":"а","t":"дипломата"},{"id":"б","t":"дипломанта"}],"c":"б","e":"Награждённые на конкурсе — «дипломанты». Контекст награждения → дипломАНТ."},{"id":"x-rus-t5-g30","k":"mc","les":"RU019","task":5,"q":"В каком словосочетании верно употреблено «дипломант»?","o":[{"id":"а","t":"дипломант вручил ноту протеста"},{"id":"б","t":"дипломант вокального конкурса"},{"id":"в","t":"дипломант ответ уклончиво"}],"c":"б","e":"«Дипломант» — награждённый на конкурсе. Верно «дипломант вокального конкурса». Ноту вручает дипломат; уклончиво отвечает дипломатичный человек."},{"id":"x-rus-t5-g31","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Я купил ... в бассейн на месяц». (абонемент / абонент)","o":[{"id":"а","t":"абонемент"},{"id":"б","t":"абонент"}],"c":"а","e":"Документ на право пользования — «абонемент». Проверка: покупают что? — абонемент."},{"id":"x-rus-t5-g32","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «... временно недоступен или находится вне зоны действия сети». (Абонемент / Абонент)","o":[{"id":"а","t":"Абонемент"},{"id":"б","t":"Абонент"}],"c":"б","e":"Пользователь связи — «абонент». Недоступен именно человек-пользователь. Абонент — живое лицо."},{"id":"x-rus-t5-g33","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «... в консерваторию даёт право на шесть концертов». (Абонемент / Абонент)","o":[{"id":"а","t":"Абонемент"},{"id":"б","t":"Абонент"}],"c":"а","e":"Право посещения по документу — «абонемент». Даёт право что? — абонемент."},{"id":"x-rus-t5-g34","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Оператор уведомил ... о смене тарифа». (абонемент / абонента)","o":[{"id":"а","t":"абонемент"},{"id":"б","t":"абонента"}],"c":"б","e":"Уведомляют пользователя — «абонента» (кого?). Живое лицо → абонент."},{"id":"x-rus-t5-g35","k":"mc","les":"RU019","task":5,"q":"К какому слову подходит «абонент»?","o":[{"id":"а","t":"... в театр на сезон"},{"id":"б","t":"... не отвечает"},{"id":"в","t":"... в плавательный бассейн"}],"c":"б","e":"«Абонент» — это пользователь-человек, поэтому «абонент не отвечает». В остальных нужен «абонемент» (документ)."},{"id":"x-rus-t5-g36","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Спасение утопающего — настоящий геройский ... ». (поступок / проступок)","o":[{"id":"а","t":"поступок"},{"id":"б","t":"проступок"}],"c":"а","e":"Действие благородное, без вины — «поступок». Проверка: нет оттенка провинности."},{"id":"x-rus-t5-g37","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «За этот ... ученика вызвали к директору». (поступок / проступок)","o":[{"id":"а","t":"поступок"},{"id":"б","t":"проступок"}],"c":"б","e":"Есть провинность, нарушение — «проступок». Приставка про- сигналит о нарушении."},{"id":"x-rus-t5-g38","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Он совершил благородный ..., вернув находку хозяину». (поступок / проступок)","o":[{"id":"а","t":"поступок"},{"id":"б","t":"проступок"}],"c":"а","e":"Действие достойное — «поступок». «Благородный» несовместим с провинностью."},{"id":"x-rus-t5-g39","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Даже мелкий ... не остался без замечания». (поступок / проступок)","o":[{"id":"а","t":"поступок"},{"id":"б","t":"проступок"}],"c":"б","e":"Речь о нарушении, за которое делают замечание, — «проступок». Значение вины → проступок."},{"id":"x-rus-t5-g40","k":"mc","les":"RU019","task":5,"q":"В каком предложении верно употреблено «проступок»?","o":[{"id":"а","t":"Его смелый проступок все оценили."},{"id":"б","t":"За дисциплинарный проступок объявили выговор."},{"id":"в","t":"Проступок героя вошёл в историю."}],"c":"б","e":"«Проступок» = провинность. Верно «за дисциплинарный проступок объявили выговор». В остальных нужен «поступок» (достойное действие)."},{"id":"x-rus-t5-g41","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «В его словах был ... смысл». (скрытый / скрытный)","o":[{"id":"а","t":"скрытый"},{"id":"б","t":"скрытный"}],"c":"а","e":"Смысл тайный, не явный — «скрытый». Проверка: «тайный». Это не человек."},{"id":"x-rus-t5-g42","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Он очень ... человек, ни с кем не делится переживаниями». (скрытый / скрытный)","o":[{"id":"а","t":"скрытый"},{"id":"б","t":"скрытный"}],"c":"б","e":"О человеке, неоткровенном, — «скрытный». Проверка: «неоткровенный»."},{"id":"x-rus-t5-g43","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «У предприятия есть ... резервы роста». (скрытые / скрытные)","o":[{"id":"а","t":"скрытые"},{"id":"б","t":"скрытные"}],"c":"а","e":"Резервы неявные, незадействованные — «скрытые». Не о человеке, значит скрытый."},{"id":"x-rus-t5-g44","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Она была замкнутой и ... по натуре». (скрытой / скрытной)","o":[{"id":"а","t":"скрытой"},{"id":"б","t":"скрытной"}],"c":"б","e":"Черта характера человека — «скрытная». Стоит рядом со «замкнутой» — тоже о характере."},{"id":"x-rus-t5-g45","k":"mc","les":"RU019","task":5,"q":"К какому слову подходит «скрытный»?","o":[{"id":"а","t":"... угроза"},{"id":"б","t":"... механизм"},{"id":"в","t":"... подросток"}],"c":"в","e":"«Скрытный» относится только к человеку: «скрытный подросток». Угроза и механизм — скрытые (тайные, спрятанные)."},{"id":"x-rus-t5-g46","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Мы живём в ... доме, через стену». (соседнем / соседском)","o":[{"id":"а","t":"соседнем"},{"id":"б","t":"соседском"}],"c":"а","e":"Дом расположен рядом — «соседний». Вопрос «какой по расположению?» → соседний."},{"id":"x-rus-t5-g47","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «... кот повадился к нам в сад». (Соседний / Соседский)","o":[{"id":"а","t":"Соседний"},{"id":"б","t":"Соседский"}],"c":"б","e":"Кот принадлежит соседям — «соседский». Вопрос «чей?» → соседский."},{"id":"x-rus-t5-g48","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «За ... столиком сидели незнакомые люди». (соседним / соседским)","o":[{"id":"а","t":"соседним"},{"id":"б","t":"соседским"}],"c":"а","e":"Столик находится рядом — «соседний». Расположение → соседний."},{"id":"x-rus-t5-g49","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «... дети целыми днями играли во дворе». (Соседние / Соседские)","o":[{"id":"а","t":"Соседние"},{"id":"б","t":"Соседские"}],"c":"б","e":"Дети принадлежат соседям — «соседские». Вопрос «чьи?» → соседские."},{"id":"x-rus-t5-g50","k":"mc","les":"RU019","task":5,"q":"Где верно употреблено «соседний»?","o":[{"id":"а","t":"соседский сад за забором"},{"id":"б","t":"соседний подъезд нашего дома"},{"id":"в","t":"соседский пёс лает по ночам"}],"c":"б","e":"«Соседний» = расположенный рядом: «соседний подъезд». Сад и пёс принадлежат соседям — соседские (чей?)."},{"id":"x-rus-t5-g51","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Впереди нас ждал ... путь домой». (длинный / длительный)","o":[{"id":"а","t":"длинный"},{"id":"б","t":"длительный"}],"c":"а","e":"Путь измеряется в расстоянии — «длинный». Проверка: протяжённость в пространстве."},{"id":"x-rus-t5-g52","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «После операции ему назначили ... лечение». (длинное / длительное)","o":[{"id":"а","t":"длинное"},{"id":"б","t":"длительное"}],"c":"б","e":"Лечение долго длится во времени — «длительное». Проверка: «долгое по времени»."},{"id":"x-rus-t5-g53","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «У неё красивые ... волосы до пояса». (длинные / длительные)","o":[{"id":"а","t":"длинные"},{"id":"б","t":"длительные"}],"c":"а","e":"Волосы имеют протяжённость в пространстве — «длинные». Измеряются в длине."},{"id":"x-rus-t5-g54","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Переговоры оказались ... и трудными». (длинными / длительными)","o":[{"id":"а","t":"длинными"},{"id":"б","t":"длительными"}],"c":"б","e":"Переговоры долго шли во времени — «длительными». Процесс во времени → длительный."},{"id":"x-rus-t5-g55","k":"mc","les":"RU019","task":5,"q":"К какому слову подходит «длительный»?","o":[{"id":"а","t":"... коридор"},{"id":"б","t":"... забор"},{"id":"в","t":"... отпуск"}],"c":"в","e":"«Длительный» = долгий по времени: «длительный отпуск». Коридор и забор измеряются в пространстве — они длинные."},{"id":"x-rus-t5-g56","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «На столе стоял старинный ... кувшин». (глиняный / глинистый)","o":[{"id":"а","t":"глиняный"},{"id":"б","t":"глинистый"}],"c":"а","e":"Кувшин сделан из глины — «глиняный». Проверка: «сделанный из глины»."},{"id":"x-rus-t5-g57","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «... почва плохо пропускает воду». (Глиняная / Глинистая)","o":[{"id":"а","t":"Глиняная"},{"id":"б","t":"Глинистая"}],"c":"б","e":"Почва содержит глину — «глинистая». Суффикс -ист- = «содержащий»."},{"id":"x-rus-t5-g58","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Ребёнок слепил ... горшочек». (глиняный / глинистый)","o":[{"id":"а","t":"глиняный"},{"id":"б","t":"глинистый"}],"c":"а","e":"Горшочек целиком из глины — «глиняный». Изделие из материала → глиняный."},{"id":"x-rus-t5-g59","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Берег реки был ... и скользкий». (глиняный / глинистый)","o":[{"id":"а","t":"глиняный"},{"id":"б","t":"глинистый"}],"c":"б","e":"Берег с примесью глины — «глинистый». Не сделан из глины, а содержит её."},{"id":"x-rus-t5-g60","k":"mc","les":"RU019","task":5,"q":"Где верно употреблено «глинистый»?","o":[{"id":"а","t":"глинистый кувшин"},{"id":"б","t":"глинистая свистулька"},{"id":"в","t":"глинистый грунт"}],"c":"в","e":"«Глинистый» = содержащий глину: «глинистый грунт». Кувшин и свистулька сделаны из глины — они глиняные."},{"id":"x-rus-t5-g61","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «У неё прекрасная ... память». (зрительная / зрительская)","o":[{"id":"а","t":"зрительная"},{"id":"б","t":"зрительская"}],"c":"а","e":"Память связана со зрением — «зрительная». Проверка: относится к зрению."},{"id":"x-rus-t5-g62","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Фильм имел огромный ... успех». (зрительный / зрительский)","o":[{"id":"а","t":"зрительный"},{"id":"б","t":"зрительский"}],"c":"б","e":"Успех у зрителей — «зрительский». Относится к людям-зрителям."},{"id":"x-rus-t5-g63","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Перед началом спектакля ... зал был полон». (зрительный / зрительский)","o":[{"id":"а","t":"зрительный"},{"id":"б","t":"зрительский"}],"c":"а","e":"«Зрительный зал» — устойчивое сочетание, связано с местом для зрения/просмотра. Верно «зрительный»."},{"id":"x-rus-t5-g64","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «... симпатии были на стороне главного героя». (Зрительные / Зрительские)","o":[{"id":"а","t":"Зрительные"},{"id":"б","t":"Зрительские"}],"c":"б","e":"Симпатии зрителей — «зрительские». Относится к аудитории зрителей."},{"id":"x-rus-t5-g65","k":"mc","les":"RU019","task":5,"q":"К какому слову подходит «зрительный»?","o":[{"id":"а","t":"... успех"},{"id":"б","t":"... нерв"},{"id":"в","t":"... овация"}],"c":"б","e":"«Зрительный» связан с органом зрения: «зрительный нерв». Успех и овация исходят от зрителей — они зрительские."},{"id":"x-rus-t5-g66","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Врач проявил ... отношение к пациенту». (гуманное / гуманитарное)","o":[{"id":"а","t":"гуманное"},{"id":"б","t":"гуманитарное"}],"c":"а","e":"Отношение человечное, милосердное — «гуманное». Проверка: «человечное»."},{"id":"x-rus-t5-g67","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Он поступил на ... факультет». (гуманный / гуманитарный)","o":[{"id":"а","t":"гуманный"},{"id":"б","t":"гуманитарный"}],"c":"б","e":"Факультет наук о человеке/обществе — «гуманитарный». Область образования → гуманитарный."},{"id":"x-rus-t5-g68","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «В пострадавший район прибыла ... помощь». (гуманная / гуманитарная)","o":[{"id":"а","t":"гуманная"},{"id":"б","t":"гуманитарная"}],"c":"б","e":"«Гуманитарная помощь» — устойчивое сочетание (помощь пострадавшим). Верно «гуманитарная»."},{"id":"x-rus-t5-g69","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Роман проникнут ... идеалами добра и свободы». (гуманными / гуманистическими)","o":[{"id":"а","t":"гуманными"},{"id":"б","t":"гуманистическими"}],"c":"б","e":"Идеалы гуманизма как мировоззрения — «гуманистические». Проверка: относится к гуманизму."},{"id":"x-rus-t5-g70","k":"mc","les":"RU019","task":5,"q":"К какому слову подходит «гуманный»?","o":[{"id":"а","t":"... вуз"},{"id":"б","t":"... поступок"},{"id":"в","t":"... конвой с продовольствием"}],"c":"б","e":"«Гуманный» = человечный: «гуманный поступок». Вуз — гуманитарный; конвой с помощью — гуманитарный."},{"id":"x-rus-t5-g71","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Учитель дал ясное и ... объяснение». (понятное / понятливое)","o":[{"id":"а","t":"понятное"},{"id":"б","t":"понятливое"}],"c":"а","e":"Объяснение, доступное для понимания, — «понятное». Проверка: «ясное». Это объект, который понимают."},{"id":"x-rus-t5-g72","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Он очень ... ученик, всё схватывает на лету». (понятный / понятливый)","o":[{"id":"а","t":"понятный"},{"id":"б","t":"понятливый"}],"c":"б","e":"Человек, быстро понимающий, — «понятливый». Суффикс -лив- = свойство человека."},{"id":"x-rus-t5-g73","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Инструкция написана простым и ... языком». (понятным / понятливым)","o":[{"id":"а","t":"понятным"},{"id":"б","t":"понятливым"}],"c":"а","e":"Язык доступен для понимания — «понятный». Не человек, а объект восприятия."},{"id":"x-rus-t5-g74","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «... ребёнок сразу усвоил новое правило». (Понятный / Понятливый)","o":[{"id":"а","t":"Понятный"},{"id":"б","t":"Понятливый"}],"c":"б","e":"Ребёнок, который хорошо понимает, — «понятливый». Речь о человеке → понятливый."},{"id":"x-rus-t5-g75","k":"mc","les":"RU019","task":5,"q":"К какому слову подходит «понятный»?","o":[{"id":"а","t":"... стажёр"},{"id":"б","t":"... чертёж"},{"id":"в","t":"... подмастерье"}],"c":"б","e":"«Понятный» = ясный, о том, что понимают: «понятный чертёж». Стажёр и подмастерье — люди, они могут быть понятливыми."},{"id":"x-rus-t5-g76","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «От жажды он выпил ... стакан воды». (целый / цельный)","o":[{"id":"а","t":"целый"},{"id":"б","t":"цельный"}],"c":"а","e":"Значение «весь, полный» — «целый стакан». Проверка: «весь стакан целиком»."},{"id":"x-rus-t5-g77","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «У него ... характер: слова не расходятся с делом». (целый / цельный)","o":[{"id":"а","t":"целый"},{"id":"б","t":"цельный"}],"c":"б","e":"Единая, монолитная натура — «цельный характер». Проверка: «единый, без внутреннего разлада»."},{"id":"x-rus-t5-g78","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Мы прождали его ... час». (целый / цельный)","o":[{"id":"а","t":"целый"},{"id":"б","t":"цельный"}],"c":"а","e":"Значение «весь, полный час» — «целый». Проверка: «весь час целиком»."},{"id":"x-rus-t5-g79","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «В магазине продаётся ... молоко, не разбавленное водой». (целое / цельное)","o":[{"id":"а","t":"целое"},{"id":"б","t":"цельное"}],"c":"б","e":"Неразбавленное — «цельное молоко». Устойчивое сочетание, значение «без примеси»."},{"id":"x-rus-t5-g80","k":"mc","les":"RU019","task":5,"q":"Где верно употреблено «цельный»?","o":[{"id":"а","t":"целый день шёл дождь"},{"id":"б","t":"он съел цельный пирог"},{"id":"в","t":"у неё цельная, сильная натура"}],"c":"в","e":"«Цельный» = единый, монолитный: «цельная натура». В остальных нужно «целый» (весь, полный)."},{"id":"x-rus-t5-g81","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Он сделал мне ... замечание при всех». (обидное / обидчивое)","o":[{"id":"а","t":"обидное"},{"id":"б","t":"обидчивое"}],"c":"а","e":"Замечание вызывает обиду — «обидное». Проверка: «причиняющее обиду»."},{"id":"x-rus-t5-g82","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Она очень ..., обижается по любому пустяку». (обидная / обидчивая)","o":[{"id":"а","t":"обидная"},{"id":"б","t":"обидчивая"}],"c":"б","e":"Человек, который легко обижается, — «обидчивый». Суффикс -чив- = склонность человека."},{"id":"x-rus-t5-g83","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Как ... было проиграть на послЕдней минуте!» (обидно / обидчиво)","o":[{"id":"а","t":"обидно"},{"id":"б","t":"обидчиво"}],"c":"а","e":"Досадно, вызывает обиду — от «обидный». Проверка: «досадно»."},{"id":"x-rus-t5-g84","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «С таким ... человеком трудно шутить». (обидным / обидчивым)","o":[{"id":"а","t":"обидным"},{"id":"б","t":"обидчивым"}],"c":"б","e":"Человек, легко обижающийся, — «обидчивый». Речь о свойстве характера."},{"id":"x-rus-t5-g85","k":"mc","les":"RU019","task":5,"q":"К какому слову подходит «обидчивый»?","o":[{"id":"а","t":"... промах"},{"id":"б","t":"... намёк"},{"id":"в","t":"... человек"}],"c":"в","e":"«Обидчивый» — склонный обижаться, о человеке: «обидчивый человек». Промах и намёк вызывают обиду — они обидные."},{"id":"x-rus-t5-g86","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «На завтра назначена важная ... встреча». (деловая / деловитая)","o":[{"id":"а","t":"деловая"},{"id":"б","t":"деловитая"}],"c":"а","e":"Встреча относится к сфере дел — «деловая». Проверка: «связанная с делами, работой»."},{"id":"x-rus-t5-g87","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Старший коллега дал мне ... совет». (деловитый / дельный)","o":[{"id":"а","t":"деловитый"},{"id":"б","t":"дельный"}],"c":"б","e":"Совет полезный по существу — «дельный». Проверка: «толковый, полезный»."},{"id":"x-rus-t5-g88","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Она вошла в кабинет с ... видом». (деловым / деловитым)","o":[{"id":"а","t":"деловым"},{"id":"б","t":"деловитым"}],"c":"б","e":"Внешняя манера занятого, энергичного человека — «деловитый вид». Проверка: «озабоченно-энергичный вид»."},{"id":"x-rus-t5-g89","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Это ... предложение стоит принять». (деловитое / дельное)","o":[{"id":"а","t":"деловитое"},{"id":"б","t":"дельное"}],"c":"б","e":"Предложение толковое, по существу полезное — «дельное». Проверка: «толковое»."},{"id":"x-rus-t5-g90","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Он отправил партнёрам ... письмо». (деловое / деловитое)","o":[{"id":"а","t":"деловое"},{"id":"б","t":"деловитое"}],"c":"а","e":"Письмо относится к работе, деловой переписке — «деловое». Сфера дел → деловой."},{"id":"x-rus-t5-g91","k":"mc","les":"RU019","task":5,"q":"К какому слову подходит «дельный»?","o":[{"id":"а","t":"... костюм"},{"id":"б","t":"... работник"},{"id":"в","t":"... переписка"}],"c":"б","e":"«Дельный» = толковый, полезный по существу: «дельный работник». Костюм и переписка — деловые (сфера дел)."},{"id":"x-rus-t5-g92","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Был издан ... указ о помиловании». (царский / царственный)","o":[{"id":"а","t":"царский"},{"id":"б","t":"царственный"}],"c":"а","e":"Указ принадлежит царю — «царский». Проверка: «относящийся к царю»."},{"id":"x-rus-t5-g93","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «У неё была величавая ... осанка». (царская / царственная)","o":[{"id":"а","t":"царская"},{"id":"б","t":"царственная"}],"c":"б","e":"Осанка величественная — «царственная». Проверка: «величественная, торжественная»."},{"id":"x-rus-t5-g94","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «... династия правит уже более двухсот лет». (Царская / Царствующая)","o":[{"id":"а","t":"Царская"},{"id":"б","t":"Царствующая"}],"c":"б","e":"Ныне правящая династия — «царствующая». Проверка: «которая сейчас правит»."},{"id":"x-rus-t5-g95","k":"mc","les":"RU019","task":5,"q":"Выберите верный пароним: «Гостей ждал поистине ... приём с роскошным столом». (царский / царствующий)","o":[{"id":"а","t":"царский"},{"id":"б","t":"царствующий"}],"c":"а","e":"Роскошный, богатый приём — «царский». У «царский» есть значение «роскошный»."},{"id":"x-rus-t5-g96","k":"mc","les":"RU019","task":5,"q":"К какому слову подходит «царственный»?","o":[{"id":"а","t":"... указ"},{"id":"б","t":"... жест"},{"id":"в","t":"... особа на троне"}],"c":"б","e":"«Царственный» = величественный: «царственный жест». Указ — царский (принадлежит царю); правящая особа — царствующая."},{"id":"x-rus-t6-g01","k":"mc","les":"RU020","task":6,"q":"Найдите лишнее слово (плеоназм): «главная суть доклада».","o":[{"id":"а","t":"главная"},{"id":"б","t":"суть"},{"id":"в","t":"доклада"},{"id":"г","t":"ошибки нет"}],"c":"а","e":"Как прийти: подставь определение — «суть» = самое главное, важное. Значит слово «главная» повторяет этот смысл и является лишним. Верно: суть доклада."},{"id":"x-rus-t6-g02","k":"mc","les":"RU020","task":6,"q":"Найдите лишнее слово: «памятный сувенир из поездки».","o":[{"id":"а","t":"из поездки"},{"id":"б","t":"памятный"},{"id":"в","t":"сувенир"},{"id":"г","t":"ошибки нет"}],"c":"б","e":"Как прийти: «сувенир» = подарок на память. Значение 'память' уже заложено в слове, поэтому «памятный» дублирует смысл. Верно: сувенир из поездки."},{"id":"x-rus-t6-g03","k":"mc","les":"RU020","task":6,"q":"«В отдел требуется работник на свободную вакансию.» Какое слово лишнее?","o":[{"id":"а","t":"требуется"},{"id":"б","t":"свободную"},{"id":"в","t":"вакансию"},{"id":"г","t":"работник"}],"c":"б","e":"Как прийти: «вакансия» = свободная (незанятая) должность. Определение уже содержит значение 'свободная', поэтому это слово избыточно. Верно: на вакансию."},{"id":"x-rus-t6-g04","k":"mc","les":"RU020","task":6,"q":"Найдите плеоназм: «Мы вернулись в апреле месяце».","o":[{"id":"а","t":"вернулись"},{"id":"б","t":"апреле"},{"id":"в","t":"месяце"},{"id":"г","t":"ошибки нет"}],"c":"в","e":"Как прийти: «апрель» — это уже название месяца, слово 'месяц' в его значении заложено. Значит «месяце» лишнее. Верно: вернулись в апреле."},{"id":"x-rus-t6-g05","k":"mc","les":"RU020","task":6,"q":"Найдите лишнее слово: «ответная реакция организма».","o":[{"id":"а","t":"ответная"},{"id":"б","t":"реакция"},{"id":"в","t":"организма"},{"id":"г","t":"ошибки нет"}],"c":"а","e":"Как прийти: «реакция» = ответ на воздействие. Значение 'ответ' уже входит в слово, поэтому «ответная» дублирует смысл. Верно: реакция организма."},{"id":"x-rus-t6-g06","k":"mc","les":"RU020","task":6,"q":"В каком словосочетании НЕТ речевой избыточности (плеоназма)?","o":[{"id":"а","t":"свободная вакансия"},{"id":"б","t":"памятный сувенир"},{"id":"в","t":"строгий регламент"},{"id":"г","t":"полное фиаско"}],"c":"в","e":"Как прийти: проверь каждое через определение. Вакансия=свободное место (лишнее 'свободная'), сувенир=подарок на память (лишнее 'памятный'), фиаско=полная неудача (лишнее 'полное'). А «регламент» = порядок/распорядок, слово 'строгий' не входит в его значение — плеоназма нет."},{"id":"x-rus-t6-g07","k":"mc","les":"RU020","task":6,"q":"Дано: в сочетании «народный фольклор» есть речевая избыточность. Какое объяснение ВЕРНОЕ?","o":[{"id":"а","t":"«фольклор» — это и есть народное творчество, поэтому «народный» лишнее"},{"id":"б","t":"«народный» употреблено в неверном значении (пароним)"},{"id":"в","t":"слова однокоренные — это тавтология"},{"id":"г","t":"нарушена лексическая сочетаемость слов"}],"c":"а","e":"Как прийти: «фольклор» = устное народное творчество, значение 'народный' уже в нём заложено. Корни у слов разные, поэтому это не тавтология, а плеоназм — дублирование смысла разнокоренными словами."},{"id":"x-rus-t6-g08","k":"mc","les":"RU020","task":6,"q":"Найдите тавтологию и выберите верную правку: «В своём рассказе автор рассказывает о детстве».","o":[{"id":"а","t":"в своём рассказе автор повествует о детстве"},{"id":"б","t":"в своём рассказе автор рассказывает про детство"},{"id":"в","t":"всё верно"},{"id":"г","t":"в рассказе автор-рассказчик о детстве"}],"c":"а","e":"Как прийти: выдели корни — «рассказ-е» и «рассказ-ывает» однокоренные, это тавтология. Заменяем один синонимом с другим корнем: рассказывает → повествует."},{"id":"x-rus-t6-g09","k":"mc","les":"RU020","task":6,"q":"Найдите лишнее слово (тавтология): «соединить воедино усилия».","o":[{"id":"а","t":"соединить"},{"id":"б","t":"воедино"},{"id":"в","t":"усилия"},{"id":"г","t":"ошибки нет"}],"c":"б","e":"Как прийти: корни — «со-един-ить» и «во-един-о» совпадают (-един-). Значение 'вместе' уже есть в глаголе, поэтому «воедино» лишнее. Верно: соединить усилия."},{"id":"x-rus-t6-g10","k":"mc","les":"RU020","task":6,"q":"Какое сочетание содержит тавтологию?","o":[{"id":"а","t":"проливной ливень"},{"id":"б","t":"сильный дождь"},{"id":"в","t":"мелкий дождик"},{"id":"г","t":"затяжной дождь"}],"c":"а","e":"Как прийти: сравни корни. «Про-лив-ной» и «ли-вень» имеют общий корень -лив-/-ли- — это тавтология. В остальных сочетаниях однокоренных повторов нет."},{"id":"x-rus-t6-g11","k":"mc","les":"RU020","task":6,"q":"Выберите верную правку: «Учёные провели исследование, исследуя новый вид растений».","o":[{"id":"а","t":"провели исследование нового вида растений"},{"id":"б","t":"исследовали исследование нового вида"},{"id":"в","t":"провели исследовательское исследование"},{"id":"г","t":"всё верно"}],"c":"а","e":"Как прийти: «исследование» и «исследуя» — однокоренные (корень -следова-), это тавтология. Убираем повтор, оставив одно слово: провели исследование нового вида растений."},{"id":"x-rus-t6-g12","k":"mc","les":"RU020","task":6,"q":"Какие слова образуют тавтологию: «Художник изобразил яркий образ героя»?","o":[{"id":"а","t":"изобразил — образ"},{"id":"б","t":"яркий — героя"},{"id":"в","t":"изобразил — героя"},{"id":"г","t":"образ — яркий"}],"c":"а","e":"Как прийти: выдели корни — «изо-браз-ил» и «образ» имеют общий корень -образ-. Это тавтология. Правка: создал образ / изобразил героя."},{"id":"x-rus-t6-g13","k":"mc","les":"RU020","task":6,"q":"В каком предложении НЕТ тавтологии?","o":[{"id":"а","t":"Приблизился ближе к финишу."},{"id":"б","t":"Мы вновь возобновили переговоры."},{"id":"в","t":"Он рассказал интересную историю."},{"id":"г","t":"Ливень лил всю ночь."}],"c":"в","e":"Как прийти: ищи однокоренные пары. Приблизился—ближе (-близ-), возобновили—вновь (-нов-), ливень—лил (-ли-) — везде тавтология. Только в «рассказал интересную историю» однокоренных повторов нет."},{"id":"x-rus-t6-g14","k":"mc","les":"RU020","task":6,"q":"Найдите ВЕРНЫЙ вариант — без тавтологии.","o":[{"id":"а","t":"Следует отметить следующие особенности."},{"id":"б","t":"Нужно отметить следующие особенности."},{"id":"в","t":"Следует перечислить следующие пункты."},{"id":"г","t":"Следует назвать следующие черты."}],"c":"б","e":"Как прийти: «следует» и «следующие» однокоренные (-след-) — тавтология. Чтобы её убрать, заменяем глагол синонимом с другим корнем: нужно/необходимо отметить следующие особенности."},{"id":"x-rus-t6-g15","k":"mc","les":"RU020","task":6,"q":"Исправьте нарушение сочетаемости: «Успеваемость играет большое значение».","o":[{"id":"а","t":"имеет большое значение"},{"id":"б","t":"играет большое значение"},{"id":"в","t":"носит большое значение"},{"id":"г","t":"ошибки нет"}],"c":"а","e":"Как прийти: есть два устойчивых оборота — «играть роль» и «иметь значение». В предложении их смешали. Для слова 'значение' правильный глагол — иметь. Верно: имеет большое значение."},{"id":"x-rus-t6-g16","k":"mc","les":"RU020","task":6,"q":"«Наша команда одержала поражение.» Выберите верный вариант.","o":[{"id":"а","t":"одержала поражение"},{"id":"б","t":"потерпела поражение"},{"id":"в","t":"совершила поражение"},{"id":"г","t":"получила поражение"}],"c":"б","e":"Как прийти: 'одержать' сочетается с 'победу/верх', а 'поражение' — только с глаголом 'потерпеть'. Верно: потерпела поражение."},{"id":"x-rus-t6-g17","k":"mc","les":"RU020","task":6,"q":"«Кондуктор попросил оплатить за проезд.» Как правильно?","o":[{"id":"а","t":"оплатить за проезд"},{"id":"б","t":"оплатить проезд"},{"id":"в","t":"заплатить проезд"},{"id":"г","t":"уплатить в проезде"}],"c":"б","e":"Как прийти: глагол «оплатить» переходный и требует существительного без предлога — оплатить (что?) проезд. Вариант с предлогом возможен только с другим глаголом: заплатить за проезд."},{"id":"x-rus-t6-g18","k":"mc","les":"RU020","task":6,"q":"«Правительство обещало предпринять меры.» Выберите верный вариант.","o":[{"id":"а","t":"предпринять меры"},{"id":"б","t":"принять меры"},{"id":"в","t":"совершить меры"},{"id":"г","t":"произвести меры"}],"c":"б","e":"Как прийти: устойчиво — «принять меры». Глагол 'предпринять' сочетается со словами шаги, действия, попытку, но не 'меры'. Верно: принять меры."},{"id":"x-rus-t6-g19","k":"mc","les":"RU020","task":6,"q":"«Регулярное чтение повышает ваш кругозор.» Как правильно?","o":[{"id":"а","t":"повышает кругозор"},{"id":"б","t":"расширяет кругозор"},{"id":"в","t":"поднимает кругозор"},{"id":"г","t":"увеличивает кругозор"}],"c":"б","e":"Как прийти: кругозор — это широта взглядов, его 'расширяют'. Глагол 'повышать' сочетается с уровнем, ценами, качеством. Верно: расширяет кругозор."},{"id":"x-rus-t6-g20","k":"mc","les":"RU020","task":6,"q":"В каком предложении сочетаемость слов НЕ нарушена?","o":[{"id":"а","t":"Он одержал победу в финале."},{"id":"б","t":"Он потерпел победу в финале."},{"id":"в","t":"Он совершил победу в финале."},{"id":"г","t":"Он занял победу в финале."}],"c":"а","e":"Как прийти: победу — 'одерживают' (устойчивый оборот). 'Потерпеть' сочетается с поражением/неудачей, а 'совершить/занять' с победой не сочетаются. Верно: одержал победу."},{"id":"x-rus-t6-g21","k":"mc","les":"RU020","task":6,"q":"Дано: в сочетании «поднять тост» нарушена сочетаемость. Какая правка верна?","o":[{"id":"а","t":"произнести тост (или поднять бокал)"},{"id":"б","t":"поставить тост"},{"id":"в","t":"сказать тост-бокал"},{"id":"г","t":"всё верно, ошибки нет"}],"c":"а","e":"Как прийти: смешаны два оборота — «произнести тост» и «поднять бокал». Тост (краткая речь) — произносят; поднимают бокал. Верно: произнести тост."},{"id":"x-rus-t6-g22","k":"mc","les":"RU020","task":6,"q":"Выберите верный вариант: «Мальчик ... новую куртку и вышел на улицу».","o":[{"id":"а","t":"одел"},{"id":"б","t":"надел"},{"id":"в","t":"пододел"},{"id":"г","t":"возодел"}],"c":"б","e":"Как прийти: пароним. Надеть — что-то на себя (надеть куртку); одеть — кого-то (одеть ребёнка). Подсказка: 'надеть Надежду, одеть Одежду' — надеваем вещь, одеваем человека. Верно: надел."},{"id":"x-rus-t6-g23","k":"mc","les":"RU020","task":6,"q":"Выберите верный пароним: «Прошу ... мне краткосрочный отпуск».","o":[{"id":"а","t":"представить"},{"id":"б","t":"предоставить"},{"id":"в","t":"преставить"},{"id":"г","t":"предоставлять"}],"c":"б","e":"Как прийти: предоставить = дать в пользование, распоряжение (предоставить отпуск, слово, кредит). Представить = показать, познакомить, вообразить. По смыслу нужно 'дать отпуск' — предоставить."},{"id":"x-rus-t6-g24","k":"mc","les":"RU020","task":6,"q":"Выберите верное слово: «... этому лекарству больной быстро выздоровел».","o":[{"id":"а","t":"Благодаря"},{"id":"б","t":"Из-за"},{"id":"в","t":"Ввиду"},{"id":"г","t":"Вследствие"}],"c":"а","e":"Как прийти: результат положительный (выздоровел), поэтому уместно «благодаря» (сохраняет оттенок 'блага'). При отрицательном итоге писали бы 'из-за'. Верно: Благодаря."},{"id":"x-rus-t6-g25","k":"mc","les":"RU020","task":6,"q":"Выберите верный пароним: «Он оказался очень ... человеком и помог всем».","o":[{"id":"а","t":"добротным"},{"id":"б","t":"добрым"},{"id":"в","t":"доброхотным"},{"id":"г","t":"добропорядочностным"}],"c":"б","e":"Как прийти: о человеке (отзывчивом) говорят 'добрый'. 'Добротный' относится к вещам — качественный, прочный (добротный дом, добротная ткань). По смыслу нужен добрый."},{"id":"x-rus-t6-g26","k":"mc","les":"RU020","task":6,"q":"Выберите верный пароним: «Это был самый ... костюм на карнавале».","o":[{"id":"а","t":"эффективный"},{"id":"б","t":"эффектный"},{"id":"в","t":"эффектированный"},{"id":"г","t":"аффективный"}],"c":"б","e":"Как прийти: эффектный = производящий сильное впечатление, яркий (эффектный вид, костюм). Эффективный = дающий результат (эффективный метод). По смыслу о ярком костюме — эффектный."},{"id":"x-rus-t6-g27","k":"mc","les":"RU020","task":6,"q":"В каком предложении пароним употреблён ВЕРНО?","o":[{"id":"а","t":"Надо оплатить абонента в бассейн."},{"id":"б","t":"Я продлил абонемент в бассейн."},{"id":"в","t":"Абонент — это карточка на посещение."},{"id":"г","t":"Он купил абонента на концерт."}],"c":"б","e":"Как прийти: абонемент = документ/право на посещение (абонемент в бассейн, на концерт); абонент = человек, пользующийся
