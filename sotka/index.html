<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Сотка — русский ЕГЭ</title>
<meta name="description" content="Сотка: тренажёр ЕГЭ по русскому. Правила до мастерства, интервальные пересдачи, честный прогноз балла.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#f3f2f2">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<script>if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;800&display=swap');
:root{
  --bg:#f3f2f2; --surface:#eae9e9; --ink:#201e1d; --acc:#0B3D91;
  --acc-100:#eef2fa; --acc-200:#dae3f5; --acc-300:#b3c6e6; --acc-600:#082f73;
  --n300:#d7d3d3; --n400:#bab6b6; --n500:#9b9797; --n600:#7d7979; --n700:#605d5d;
  --div:rgba(32,30,29,.4);
  --ok:#1c7c31;
  --red:#c02717;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif;font-size:15px;line-height:1.45}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.pad{padding:0 20px}
.kick{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--n600)}
.kick .sq{display:inline-block;width:10px;height:10px;background:var(--acc);margin-right:8px;vertical-align:baseline}
h1{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.12}
.tnum{font-variant-numeric:tabular-nums}

/* stat bar */
.statbar{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin-top:18px}
.stat{padding:14px 12px;border-left:1px solid var(--div)}
.stat:first-child{border-left:none;padding-left:20px}
.stat .v{font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--n600);margin-top:6px}
.stat.blue .v{color:var(--acc)}

/* big button */
.bigbtn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;background:var(--ink);color:#fff;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:16px 18px;margin-top:20px;text-align:left}
.bigbtn:active{background:var(--acc)}
.qline{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--n600);margin-top:12px}
.qline b{color:var(--acc);font-weight:800}

/* poster */
.poster{background:var(--acc);color:#fff;padding:24px 20px;margin-top:24px}
.poster .k{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;opacity:.85}
.poster .t{font-size:22px;font-weight:800;line-height:1.2;margin-top:10px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--ink);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:15px 0 13px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--n500)}
.tabs button.on{color:var(--ink)}
.tabs button.on::before{content:'';display:block;width:10px;height:10px;background:var(--acc);margin:0 auto 5px}
.tabs button::before{content:'';display:block;width:10px;height:10px;background:transparent;margin:0 auto 5px}

/* map */
.trow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--n300);width:100%;text-align:left}
.tnum-sq{width:34px;height:34px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.trow.done .tnum-sq{background:var(--ink);color:#fff}
.trow .tt{flex:1;min-width:0}
.trow .tt .n{font-size:14px;font-weight:600;display:block}
.trow .tt .m{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--n500);display:block;margin-top:2px}
.tbar{width:56px;flex:none}
.tbar .tr{height:8px;background:var(--n300)}
.tbar .fl{height:8px;background:var(--acc);transition:width .3s}
.rrow{display:flex;align-items:center;gap:12px;padding:11px 0 11px 14px;border-bottom:1px solid var(--n300);width:100%;text-align:left}
.rsq{width:18px;height:18px;border:2px solid var(--ink);flex:none;position:relative}
.rsq.half::after{content:'';position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--acc)}
.rsq.full{background:var(--acc);border-color:var(--acc)}
.rrow .rt{flex:1;font-size:13.5px;min-width:0}
.rrow .rs{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--n500);flex:none}
.linkrow{display:block;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--n300);font-size:13px;color:var(--n700)}
.linkrow b{font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--acc-600)}

/* sheet (session / reader) */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;animation:up .35s cubic-bezier(.3,1,.4,1)}
.sheet.on{display:flex}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.shead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;padding-top:calc(14px + env(safe-area-inset-top))}
.shead .x{font-size:22px;font-weight:800;padding:4px 8px;color:var(--n600)}
.prog{height:4px;background:var(--n300);margin:0 20px}
.prog .fl{height:4px;background:var(--acc);transition:width .3s}
.sbody{flex:1;overflow-y:auto;padding:18px 20px 130px;-webkit-overflow-scrolling:touch}
.sfoot{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--n300)}
.nextbtn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;background:var(--ink);color:#fff;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:14px 18px;text-align:left}
.nextbtn:active{background:var(--acc)}
.nextbtn.blue{background:var(--acc)}

/* card in session */
.ck{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--acc-600);margin-bottom:10px}
.cq{font-size:17px;font-weight:600;line-height:1.4;white-space:pre-wrap}
.qtext{font-size:15px;font-weight:400;line-height:1.62;white-space:pre-wrap;margin-top:12px;padding:14px 14px;background:#fff;border-left:3px solid var(--ink)}
.opts{margin-top:18px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--n400);margin-top:8px;font-size:14.5px;line-height:1.4;min-height:48px}
.opt .osq{width:20px;height:20px;border:2px solid var(--ink);flex:none;position:relative;background:#fff}
.opt .oi{font-weight:800;flex:none;text-transform:uppercase}
.opt.pick{border:2px solid var(--ink);padding:12px 13px}
.opt.pick .osq{background:var(--acc);border-color:var(--acc)}
.opt.pick .osq::after{content:'';position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.opt.right{border:2px solid var(--acc);padding:12px 13px;background:var(--acc-100)}
.opt.right .osq{background:var(--acc);border-color:var(--acc)}
.opt.right .osq::after{content:'';position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.opt.wrong{border:2px solid var(--red);padding:12px 13px;color:var(--red)}
.opt.wrong .osq{background:var(--red);border-color:var(--red)}
.opt.wrong .osq::after{content:'✕';position:absolute;left:3px;top:-1px;color:#fff;font-size:13px;font-weight:800}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
/* соответствия АБВГД -> цифры */
.mtxt{font-size:13.5px;line-height:1.5;margin-top:8px;padding:10px 12px;border:1px solid var(--n300)}
.mtxt b{font-weight:800}
.mrow{margin-top:14px;border-top:1px solid var(--n300);padding-top:10px}
.mrow .ml{font-size:13.5px;line-height:1.45}
.mrow .ml b{font-weight:800;color:var(--acc-600)}
.digrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dig{width:38px;height:38px;border:1px solid var(--n400);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.dig.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dig.ok{background:var(--acc);color:#fff;border-color:var(--acc)}
.dig.no{background:var(--red);color:#fff;border-color:var(--red)}
.mres{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.mres.ok{color:var(--ok)} .mres.no{color:var(--red)}
/* продолжить чтение */
.resume{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:2px solid var(--ink);padding:13px 14px;margin-top:16px}
.resume .rk2{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--acc-600)}
.resume .rt2{font-size:14px;font-weight:600;margin-top:3px}
.expl{margin-top:18px;border-top:2px solid var(--ink);padding-top:12px}
.expl .ek{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.expl .ek.ok{color:var(--ok)} .expl .ek.no{color:var(--red)}
.expl .et{font-size:14px;color:var(--n700);white-space:pre-wrap}
.theory{background:var(--ink);color:#fff;padding:22px 20px;margin:-4px -20px 0}
.theory .k{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--acc-300)}
.theory h3{font-size:20px;font-weight:800;line-height:1.2;margin:10px 0 12px}
.theory p{font-size:14px;line-height:1.55;opacity:.92;margin-top:10px}
.theory .alg{border-left:3px solid var(--acc-300);padding-left:12px;margin-top:14px}
.flipbtn{width:100%;min-height:50px;border:2px solid var(--ink);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-top:20px}
.selfrow{display:flex;gap:8px;margin-top:14px}
.selfrow button{flex:1;min-height:50px;border:2px solid var(--ink);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.selfrow .yes{background:var(--ink);color:#fff}

/* done screen */
.donebig{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:10px}
.dlist{margin-top:20px;border-top:2px solid var(--ink)}
.drow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--n300);font-size:14px}
.drow .st{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--acc-600)}

/* reader */
.rd h2{font-size:24px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.rd .rk{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--n600);margin-bottom:8px}
.rd h4{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:24px 0 10px;color:var(--acc-600);border-top:2px solid var(--ink);padding-top:12px}
.rd p{font-size:14.5px;line-height:1.6;margin-top:10px}
.rd .go{margin-top:26px}
b.q{font-weight:700;background:var(--acc-100);box-shadow:0 -2px 0 var(--acc-200) inset;padding:0 2px}
.theory b.q{background:none;box-shadow:0 -2px 0 rgba(255,255,255,.35) inset;color:#fff;font-weight:700}
/* шаги алгоритма */
.steps{margin-top:6px}
.step{display:flex;gap:12px;align-items:flex-start;margin-top:10px}
.step .sn{width:24px;height:24px;border:2px solid var(--ink);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.step .stx{font-size:14px;line-height:1.5}
/* разбор-примеры */
.exl{margin-top:6px;border-left:3px solid var(--acc);background:var(--acc-100);padding:4px 14px 12px}
.exl .exi{font-size:14px;line-height:1.55;margin-top:8px}
.exl .exi::before{content:'';display:inline-block;width:8px;height:8px;background:var(--acc);margin-right:8px;vertical-align:2px}
/* ловушки */
.warnl{margin-top:6px;border-left:3px solid var(--red);background:#faf0ee;padding:4px 14px 12px}
.warnl .wi{font-size:13.5px;line-height:1.5;margin-top:8px;color:#7c2417}
.warnl .wi::before{content:'';display:inline-block;width:8px;height:8px;background:var(--red);margin-right:8px;vertical-align:2px}
/* таблицы */
.rd .tbwrap{overflow-x:auto;margin-top:10px;border-top:2px solid var(--ink)}
.rd table{border-collapse:collapse;width:100%}
.rd th{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--n600);text-align:left;padding:9px 10px 7px;border-bottom:1px solid var(--n300)}
.rd td{font-size:13.5px;line-height:1.45;padding:9px 10px;border-bottom:1px solid var(--n300);vertical-align:top}
.rd td:first-child{font-weight:600;border-right:1px solid var(--n300)}

.hidden{display:none!important}
.fade{animation:fd .3s}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
input.name{border:none;border-bottom:1px solid var(--n400);background:none;font-family:inherit;font-size:15px;padding:6px 0;width:100%;border-radius:0}
input.name:focus{outline:none;border-bottom-color:var(--acc)}
.small{font-size:12px;color:var(--n600);line-height:1.5}
</style>
</head>
<body>
<div class="app">

<!-- СЕГОДНЯ -->
<section id="v-today" class="pad">
  <div style="padding-top:calc(10px + env(safe-area-inset-top))"></div>
  <div class="kick"><span class="sq"></span><span id="h-kick"></span></div>
  <h1 id="h-hi" style="margin-top:8px">Русский</h1>
  <div class="statbar">
    <div class="stat"><div class="v tnum" id="st-days">—</div><div class="l">дней до ЕГЭ</div></div>
    <div class="stat blue"><div class="v tnum" id="st-streak">0</div><div class="l">стрик, дней</div></div>
    <div class="stat"><div class="v tnum" id="st-mast">0</div><div class="l" id="st-mast-l">закреплено</div></div>
  </div>

  <div class="qline" id="h-queue"></div>

    <div class="k">Прогноз · часть 1</div>
    <div class="t" id="h-prog">—</div>
  </div>
</section>

<!-- ТЕОРИЯ -->
<section id="v-map" class="pad hidden">
  <div style="padding-top:calc(10px + env(safe-area-inset-top))"></div>
  <div class="kick"><span class="sq"></span>26 заданий · 50 правил</div>
  <h1 style="margin-top:8px">Теория</h1>
  <div id="resumebox"></div>
  <div id="maplist" style="margin-top:16px"></div>
  <div style="margin-top:22px">
    <div class="kick">Рядом</div>
    <a class="linkrow" href="../essay/" style="text-decoration:none;color:inherit"><b>Сочинение →</b><br>Задание 27 тренируется в отдельном приложении</a>
    <a class="linkrow" href="../udarenie/" style="text-decoration:none;color:inherit"><b>Ударение →</b><br>Дрилл словника ФИПИ для задания 4</a>
    <a class="linkrow" href="../motor/" style="text-decoration:none;color:inherit"><b>ЕГЭ Мотор →</b><br>План недели, фокус и мотивация</a>

  <div style="margin-top:22px">
    <div class="kick">Имя на экране</div>
    <input class="name" id="inp-name" placeholder="Как тебя зовут?">
  </div>
  <div class="small" id="verline" style="margin-top:26px;padding-bottom:8px"></div>
</section>

<!-- СЕССИЯ -->
<div class="sheet" id="sh-sess">
  <div class="shead"><div class="kick"><span class="sq"></span><span id="s-kick">Сессия</span></div><button class="x" id="s-close">✕</button></div>
  <div class="prog"><div class="fl" id="s-prog" style="width:0%"></div></div>
  <div class="sbody" id="s-body"></div>
  <div class="sfoot hidden" id="s-foot"><button class="nextbtn" id="s-next">Дальше<span>→</span></button></div>
</div>

<!-- ЧИТАЛКА -->
<div class="sheet" id="sh-read">
  <div class="shead"><div class="kick"><span class="sq"></span>Теория</div><button class="x" id="r-close">✕</button></div>
  <div class="sbody rd" id="r-body"></div>
</div>

<nav class="tabs">
  <button id="tab-today" class="on">Сегодня</button>
  <button id="tab-map">Теория</button>
</nav>

<script id="lessondata" type="application/json">[{"id":"RU001","title":"Языковая норма и работа со словарями","mod":"M01","tasks":[2,3,4,5,6,7,8,27],"blocks":[{"h":"Теория","items":[{"t":"tb","head":null,"rows":[["Языковая норма","принятое в литературном языке употребление языковой единицы. Норма регулирует разные действия: как произнести слово, образовать его форму, соединить слова, написать их и поставить знаки. Ошибки следует различать: «звОнит» нарушает норму ударения"],["«ихний»","норму образования и употребления формы"],["«согласно приказа»","управление"],["«зделать»","орфографию. От типа ошибки зависит способ проверки"]]},{"t":"p","s":"Литературный язык обслуживает образование, культуру и публичное общение. Разговорная речь не равна неграмотной: в ней допустимы непринуждённые выражения, которые неуместны в научной статье. Просторечная форма, напротив, может находиться за пределами литературной нормы. Помета «разговорное» и помета «неправильно» обозначают разные вещи."},{"t":"p","s":"Норма бывает единственной и вариантной. Если словарь допускает два варианта, нельзя объявлять один ошибкой лишь потому, что он непривычен. В экзаменационном материале ориентируются на источники, указанные ФИПИ, и на условия конкретного задания. Дата словаря и грамматическая форма слова существенны: норма одной формы не всегда автоматически переносится на другую."}]},{"h":"Как выбрать источник","items":[{"t":"p","s":"Орфографический словарь проверяет написание, слитность, дефис и некоторые формы."},{"t":"p","s":"Орфоэпический словарь проверяет произношение и ударение; орфографическое ударение в статье не заменяет всех произносительных сведений."},{"t":"p","s":"Толковый словарь раскрывает значения, сочетаемость и стилистические пометы."},{"t":"p","s":"Словари паронимов, синонимов, антонимов и фразеологизмов решают соответствующие лексические вопросы."},{"t":"p","s":"Словообразовательный словарь показывает образование слов; этимологический — их происхождение. Историческое происхождение не подменяет современный морфемный разбор."},{"t":"p","s":"Грамматический словарь помогает с родом, склонением и формами; справочник по пунктуации — со строением предложений и знаками."}]},{"h":"Разбор","items":[{"t":"ex","items":["Нужно проверить «по приезду» в значении «после приезда».","Это не вопрос о букве в приставке: перед нами предлог и падеж существительного.","Нормативно «по приезде».","В сочетании «скучать по родному дому» у того же предлога другое значение и другое управление.","Поэтому правило нельзя хранить как запрет любого сочетания «по + дательный падеж»."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Искать норму только по частотности поисковой выдачи","Считать любое однокоренное слово проверочным","Смешивать литературную допустимость и уместность в данном стиле","Использовать старую памятку как документ текущего экзамена"]}]}]},{"id":"RU002","title":"Фонетика, буквы, звуки и ударение","mod":"M01","tasks":[4,9,10,22,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Буква — знак письма, звук — единица звучащей речи. В русском алфавите 33 буквы; ь и ъ собственного звука не обозначают. В слове количество букв и звуков может различаться: «ель» содержит три буквы и три звука, потому что е в начале слова передаёт сочетание [й’] с гласным, а ь отдельного звука не добавляет. В слове «яма» три буквы, но четыре звука."},{"t":"p","s":"Гласные образуют слоги. Число слогов в обычном школьном разборе равно числу гласных звуков. Ударение выделяет один из слогов; русское ударение разноместное и может быть подвижным при изменении слова. Буквы е, ё, ю, я после согласного обычно указывают на его мягкость и обозначают гласный, а в начале слова, после гласной и после разделительного ь или ъ обычно передают два звука. Это описание школьной модели; точная транскрипция учитывает позиционные изменения."},{"t":"p","s":"Согласные различаются по звонкости/глухости и твёрдости/мягкости. Парные звонкие оглушаются на конце слова: в «дуб» слышится конечный [п], но пишется б. Перед согласными возможны уподобления по звонкости. Это объясняет, почему орфографию нельзя строить на принципе «пиши, как слышишь». Для проверки согласного полезна позиция перед гласным: дуб — дубы."},{"t":"p","s":"Безударные гласные изменяют звучание. В орфографии важно восстановить букву значимой части слова, а не записать приблизительный звук. Однако для чередующихся корней проверка ударением часто неприменима: выбор определяется специальным правилом."}]},{"h":"Алгоритм фонетического анализа","items":[{"t":"st","items":["Записать слово, установить ударение и разделить на слоги.","Произнести слово целиком, учитывая соседние звуки.","Составить транскрипцию в принятой учебной системе.","Описать гласные и согласные; отдельно объяснить отсутствие звука у ь/ъ и двойную функцию е/ё/ю/я.","Сравнить число букв и звуков."]}]},{"h":"Разбор","items":[{"t":"ex","items":["«Съезд»: ъ отделяет согласный от йотированного е.","Сам ъ не звучит, но помогает обозначить раздельное произношение.","Для написания проверяют строение слова; для транскрипции — ещё и оглушение конечной группы согласных.","Это два разных анализа одного слова."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Называть ь мягким звуком","Считать, что е всегда обозначает два звука","Переносить ударение с начальной формы на все остальные","Путать ударный звук и ударную букву"]}]}]},{"id":"RU003","title":"Морфемика и словообразование","mod":"M01","tasks":[7,9,10,11,12,14,15,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Морфема — минимальная значимая часть слова. Корень объединяет родственные слова, приставка стоит перед корнем, суффикс — после корня. Окончание выражает грамматические отношения и обычно изменяется при склонении или спряжении. Основа изменяемого слова — часть без окончания; при учебном разборе формообразующие суффиксы также отделяют от основы по принятой в курсе модели. Постфикс располагается после других частей: -ся/-сь, -то, -либо, -нибудь."},{"t":"p","s":"Нулевое окончание и отсутствие окончания не одно и то же. У «стол» есть нулевое окончание: стол-а, стол-у. У неизменяемого наречия «вчера» окончания нет. Нельзя объявлять последнюю букву окончанием лишь из-за её положения."},{"t":"p","s":"Формы слова сохраняют его лексическое значение: река — рекой. Новое слово получает новое значение: река — речной. Однокоренность устанавливают по общности значения, а не по одинаковым буквам: «гора» и «гореть» не однокоренные. В корне возможны чередования согласных: рука — ручной."}]},{"h":"Способы образования","items":[{"t":"p","s":"Приставочный: писать → переписать."},{"t":"p","s":"Суффиксальный: лес → лесник."},{"t":"p","s":"Приставочно-суффиксальный: окно → подоконник."},{"t":"p","s":"Бессуффиксный в школьной терминологии: переход к производному слову без материально выраженного словообразовательного суффикса; например, переходить → переход. Направление образования проверяют по значению и словарю."},{"t":"p","s":"Сложение основ: лес + степь → лесостепь; возможны соединительные гласные."},{"t":"p","s":"Аббревиация: вуз, МГУ; сокращённое слово не следует смешивать с графическим сокращением, которое при чтении разворачивается."},{"t":"p","s":"Переход в другую часть речи: «дежурный ученик» → «дежурный открыл дверь»."}]},{"h":"Алгоритм","items":[{"t":"st","items":["Сначала измените слово и найдите окончание.","Затем подберите близкие родственные слова и определите корень.","Найдите непосредственное производящее слово: не самое короткое, а то, через которое объясняется значение.","После этого выделяйте приставки и суффиксы.","Для орфограммы укажите именно ту морфему, в которой находится пропуск."]}]},{"h":"Разбор","items":[{"t":"ex","items":["«Безвкусный»: значение «лишённый вкуса», приставка без- заканчивается на з перед звонким в.","Нельзя увидеть сочетание «сн» в конце и применить к приставке правило о непроизносимой согласной: сначала требуется определить границы морфем."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Подбирать «проверку» без учёта значения","Называть корнем любую одинаковую последовательность букв","Определять способ образования по всем имеющимся морфемам, а не по последнему шагу образования"]}]}]},{"id":"RU004","title":"Существительное, прилагательное, числительное","mod":"M01","tasks":[1,3,7,8,11,15,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Часть речи определяют по совокупности значения, грамматических признаков и роли в предложении. Один вопрос не всегда достаточен. Существительное обозначает предмет в грамматическом смысле: человек, действие, чувство или явление. Оно имеет род, изменяется по падежам и обычно по числам. У слов только множественного числа, например «ножницы», род не определяется. Одушевлённость — грамматический признак, который проявляется в соотношении винительного падежа с родительным или именительным; она не сводится к биологической жизни."},{"t":"p","s":"Склонение — тип изменения существительного. В школьной системе к первому относятся многие слова на -а/-я, ко второму — существительные мужского рода с нулевым окончанием и среднего на -о/-е, к третьему — существительные женского рода с мягким знаком. Несклоняемые слова, разносклоняемые слова на -мя и слово «путь» рассматриваются отдельно. Для окончания нужно знать падеж, число и тип склонения."},{"t":"p","s":"Прилагательное обозначает признак и согласуется с существительным. Качественные прилагательные могут иметь степени сравнения и краткую форму: высокий — выше — высок. Возможность образования зависит от конкретного слова. Относительные называют отношение к материалу, месту, времени или назначению: деревянный, вечерний. Притяжательные обозначают принадлежность: лисий, мамин. В переносном употреблении разряд может меняться: «золотое кольцо» и «золотой характер»."},{"t":"p","s":"Числительное обозначает количество, число или порядок при счёте. Количественные, порядковые и собирательные числительные имеют разные правила изменения. Слова «двойка» и «тройня» называют предмет или совокупность как существительные; вопрос «сколько?» нельзя механически приложить к любому слову, связанному с числом."}]},{"h":"Разбор","items":[{"t":"ex","items":["«В течение трёх зимних месяцев».","«Месяцев» — существительное в родительном падеже множественного числа.","«Зимних» — согласованное с ним прилагательное.","«Трёх» — падежная форма количественного числительного.","«В течение» — составной предлог: он не является сочетанием предлога «в» с предметным значением слова «течение»."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Считать разряд прилагательного неизменным при любом значении","Определять род у «суток»","Склонять только последнюю часть составного количественного числительного","Смешивать форму слова и название части речи"]}]}]},{"id":"RU005","title":"Глагол: вид, время, наклонение, спряжение","mod":"M01","tasks":[7,8,11,12,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Глагол обозначает действие или состояние. Инфинитив — неопределённая форма: читать, прочитать. Несовершенный вид отвечает на вопрос «что делать?» и представляет процесс, повторяемость или действие без указания на достигнутый предел. Совершенный отвечает на вопрос «что сделать?» и обозначает действие как ограниченное, целостное или результативное. Приставка не является универсальным признаком совершенного вида: «перечитывать» — несовершенный вид."},{"t":"p","s":"Глаголы несовершенного вида имеют настоящее, прошедшее и составное будущее: читаю, читал, буду читать. У совершенного вида настоящего времени нет: «прочитаю» — простое будущее, хотя личные окончания похожи на окончания настоящего."},{"t":"p","s":"Изъявительное наклонение представляет действие как реальное во времени. Условное выражает возможность или желательность и обычно образуется формой на -л с частицей бы: «прочитал бы». Повелительное выражает просьбу, приказ или совет: «прочитай». Частица бы может стоять отдельно от глагола, но от этого наклонение не меняется."},{"t":"p","s":"Переходные глаголы могут управлять прямым дополнением в винительном падеже без предлога: читать книгу. При отрицании или значении части возможно родительное дополнение. Возвратность определяется постфиксом -ся/-сь. Возвратный глагол не обязательно обозначает действие, буквально направленное на себя: «бояться»."},{"t":"p","s":"Спряжение — система личных окончаний. Оно нужно для выбора е/и и у(ю)/а(я) в безударных окончаниях и для некоторых причастных суффиксов. При ударном личном окончании ориентируются на само окончание; правило по инфинитиву предназначено прежде всего для безударных случаев. У разноспрягаемых и особо спрягаемых глаголов есть отдельные модели."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Когда прочитаю статью, подготовлю ответ».","Оба сказуемых стоят в простом будущем времени, совершенном виде.","Ошибка — назвать «прочитаю» настоящим временем только потому, что в нём нет вспомогательного «буду»."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Менять вид исходного глагола при подборе инфинитива","Не узнавать частицу бы","Определять спряжение по ударению инфинитива вместо личной формы","Считать любой глагол с -ся непереходным по смыслу «делать себе», не рассматривая грамматическую конструкцию"]}]}]},{"id":"RU006","title":"Причастие и деепричастие","mod":"M01","tasks":[8,12,13,15,17,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Причастие соединяет признаки глагола и прилагательного: называет признак предмета по действию, сохраняет вид и другие глагольные свойства, но изменяется по родам, числам и падежам. В разных учебных описаниях его рассматривают как особую форму глагола или самостоятельную часть речи. Для экзамена важно владеть признаками и правилами, а не спорить о терминологической модели."},{"t":"p","s":"Действительное причастие обозначает признак того, кто действует: «читающий ученик». Страдательное — того, на кого направлено действие: «прочитанная статья». Причастия настоящего времени образуются от глаголов несовершенного вида. Не от каждого глагола можно образовать все возможные по схеме причастия: переходность, вид и реальное употребление ограничивают образование."},{"t":"p","s":"Причастный оборот — причастие со всеми зависимыми словами: «статья, прочитанная вчера вечером». Само определяемое существительное в оборот не входит. У страдательных причастий есть краткие формы: прочитан, прочитана, прочитано, прочитаны. Их необходимо различать с краткими прилагательными при выборе н/нн."},{"t":"p","s":"Деепричастие обозначает добавочное действие и не изменяется: читая, прочитав. Деепричастный оборот включает зависимые слова: «прочитав трудную статью». Основное и добавочное действия должны относиться к одному исполнителю в допустимой синтаксической конструкции."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Прочитав статью, ученик записал вывод».","Ученик и прочитал, и записал: конструкция правильная.","«Прочитав статью, вывод стал понятен» — грамматическая ошибка: подлежащим является «вывод», который читать не может.","Исправление: «Прочитав статью, я понял вывод» или «После чтения статьи вывод стал понятен».","«Читающий у окна ученик» — действительное причастие настоящего времени.","«Прочитанная учеником книга» — страдательное причастие прошедшего времени.","Окно не определяемое слово первого оборота: причастие характеризует ученика."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Заканчивать оборот на первом зависимом слове","Определять причастие только по суффиксу","Называть деепричастие сказуемым","Проверять совпадение исполнителя по ближайшему существительному, а не по основе предложения"]}]}]},{"id":"RU007","title":"Местоимения, наречия и слова состояния","mod":"M01","tasks":[1,3,7,13,14,26,27],"blocks":[{"h":"Теория","items":[{"t":"tb","head":null,"rows":[["Местоимения указывают на предметы, признаки и количество, не называя их непосредственно. Разряды: личные","я, ты, он"],["возвратное","себя"],["притяжательные","мой, свой, его"],["указательные","этот, тот, такой"],["определительные","весь, каждый, сам"],["вопросительные","кто? какой?"],["относительные","те же слова как средство связи частей"],["отрицательные","никто, нечего"],["неопределённые","кто-то, некоторый"]]},{"t":"p","s":"Форма и функция различаются. «Увидел его» — форма личного местоимения; «его книга» — притяжательное местоимение. Поэтому слово «его» нельзя автоматически помечать одним разрядом во всех предложениях. Возвратное «себя» не имеет формы именительного падежа. Слово «свой» должно иметь ясного обладателя: неудачная конструкция может сделать указание двусмысленным."},{"t":"p","s":"Наречие обозначает признак действия, признака или другого обстоятельства и обычно не изменяется: быстро, очень, вчера. Основные значения — образ действия, мера и степень, место, время, причина, цель. Местоименные наречия «там», «тогда», «поэтому», «так» указывают на обстоятельство и особенно важны для связи предложений."},{"t":"tb","head":null,"rows":[["Слова категории состояния в безличном предложении обозначают состояние или оценку: «Мне холодно», «Здесь тихо», «Нужно повторить». В школьных классификациях границы этой группы описываются по-разному. Уверенное решение строится на синтаксической функции. Сравните: «Море спокойно»","краткое прилагательное"],["«Он говорил спокойно»","наречие"],["«На душе спокойно»","слово состояния"]]}]},{"h":"Алгоритм для задания 1","items":[{"t":"st","items":["Если запрошено местоимение, установите нужный разряд и его опору в предыдущем контексте.","Если запрошено наречие, определите, какое обстоятельственное значение надо передать.","Одновременно проверьте грамматику предложения и смысл всего перехода."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Считать «поэтому» союзом","Определять часть речи только по вопросу «как?»","Относить любое «его» к личным местоимениям","Смешивать союзное слово и самостоятельную часть речи — союзное слово является синтаксической функцией местоимения или наречия"]}]}]},{"id":"RU008","title":"Предлоги, союзы, частицы и междометия","mod":"M01","tasks":[1,8,13,14,18,19,20,26],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Служебные слова выражают отношения и оттенки значения. Предлог связывает падежную форму имени с другим словом: к дому, благодаря помощи. Предлоги бывают непроизводные и производные, простые, сложные и составные: в, из-за, в течение. Предлог обычно не является отдельным членом предложения; членом предложения становится всё сочетание с именем."},{"t":"p","s":"Союз соединяет однородные члены или части сложного предложения. Сочинительные союзы выражают соединение (и, да в значении и), противопоставление (а, но, зато), разделение (или, либо), а также другие отношения. Подчинительные выражают причину, условие, время, цель, уступку, следствие, сравнение или изъяснение: потому что, если, когда, чтобы, хотя, так что, словно, что."},{"t":"p","s":"Союзное слово — местоимение или наречие, которое соединяет части и одновременно является членом придаточного. В «Я знаю, что он приехал» что — союз. В «Я знаю, что он привёз» что — союзное слово, дополнение к «привёз». Механическая проверка удалением помогает не всегда: главным остаётся наличие синтаксической роли."},{"t":"p","s":"Частицы придают оттенки значения либо образуют формы: не/ни, только, именно, даже, ведь, ли, бы, пусть. В сочетании «да здравствует» да участвует в выражении побуждения и не равно соединительному союзу. Междометия выражают чувства и побуждения без называния: ах, увы, эй. Их нужно отличать от слов, вошедших в состав частиц и устойчивых сочетаний."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Мы задержались, потому что поезд опоздал» — сложноподчинённое предложение.","«Поезд опоздал, поэтому мы задержались» в модели навигатора ФИПИ — бессоюзное сложное предложение, связанное по смыслу местоименным наречием.","Слово «поэтому» передаёт следствие, но его значение не делает его союзом."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Считать все слова между частями союзами","Смешивать «так что» и «поэтому»","Не узнавать составной предлог","Принимать частицу за полноценное отрицательное местоимение","Ставить запятые по наличию слова без анализа его функции"]}]}]},{"id":"RU009","title":"Тема, проблема, главная мысль и информация","mod":"M02","tasks":[1,3,23,24,26,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Текст — связное высказывание, объединённое темой, замыслом и завершённостью в конкретной ситуации общения. Тема отвечает на вопрос «о чём говорится?». Главная мысль — «что автор хочет сообщить об этом?». Проблема — вопрос, который автор рассматривает. Позиция автора — его ответ на этот вопрос. «Дружба» — тема; «В чём проявляется настоящая дружба?» — проблема; «Настоящий друг помогает делом, даже когда это неудобно» — возможная позиция."},{"t":"p","s":"Микротема — относительно самостоятельная часть общей темы. Часто она раскрывается в абзаце, но абзац не является надёжной единицей смысла сам по себе: один эпизод может занимать несколько абзацев, а короткая реплика — отдельный абзац без новой микротемы."},{"t":"p","s":"Фактуальная информация сообщает, что произошло, кто действовал, какие обстоятельства названы. Концептуальная раскрывает авторское понимание событий и их значение. Подтекстовая прямо не высказана, но выводится из деталей, сопоставлений, интонации. Подтекст требует опоры на текст: нельзя приписывать герою чувство, для которого нет основания."},{"t":"p","s":"Факт и оценка различаются. «Герой вернулся через час» — сообщение о событии. «Он поступил благородно» — оценка. Оценка тоже может входить в содержание текста, однако это не превращает её в объективно измеренное свойство. Следует различать автора, рассказчика и персонажа: их взгляды не обязаны совпадать."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Дима обещал помочь, но не пришёл.","Молчаливый сосед принёс инструменты и починил дверь».","Факты — обещание, отсутствие, помощь соседа.","Возможная смысловая линия — различие слов и поступков.","Вывод «Дима всегда обманывает всех знакомых» чрезмерен: один эпизод не доказывает постоянное поведение."]}]},{"h":"Алгоритм","items":[{"t":"st","items":["Прочитайте текст целиком.","Обозначьте участников и события.","Сформулируйте микротемы короткими фразами.","Отдельно выпишите оценки и противопоставления.","Затем сформулируйте общий вывод и проверьте, объясняет ли он ключевые детали, включая финал."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Называть тему проблемой","Заменять позицию пересказом","Принимать слова отрицательного героя за мнение автора","Усиливать авторское утверждение словами «всегда», «любой», «только»"]}]}]},{"id":"RU010","title":"Логические отношения и подбор связующего слова: задание 1","mod":"M02","tasks":[1,26,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Связующее средство выбирают по двум независимым признакам: требуемой части речи и смысловому отношению. Одной смысловой близости мало. Если требуется подчинительный союз, наречие «поэтому» не удовлетворяет условию, даже если предложение говорит о следствии."},{"t":"p","s":"Основные отношения: добавление новой информации; противопоставление; причина; следствие; условие; уступка; пояснение; пример; последовательность; вывод. Причина отвечает «почему произошло?», следствие — «что из этого получилось?». Уступка описывает действие вопреки обстоятельству: «Хотя было поздно, мы продолжили работу». Условие описывает зависимость возможного действия: «Если останется время, проверим ответ»."},{"t":"p","s":"Пояснение делает мысль яснее, переформулирует её. Пример конкретизирует общее утверждение. Вывод подводит итог нескольким наблюдениям. Нельзя автоматически заменять «например» на «следовательно»: приведённый случай ещё не является логическим итогом."}]},{"h":"Алгоритм","items":[{"t":"st","items":["Прочитайте предложение с пропуском и соседние предложения.","Определите, что уже известно и какая мысль добавляется.","Назовите отношение своими словами: «это причина», «это возражение».","Вспомните требуемую часть речи и при необходимости разряд.","Подставьте слово; проверьте грамматику, пунктуационную конструкцию и отсутствие лишнего смыслового оттенка."]}]},{"h":"Разбор","items":[{"t":"ex","items":["«В комнате было темно. … я включил лампу».","Если требуется местоименное наречие со значением следствия, подходит «поэтому».","«Однако» изменило бы отношение на противопоставление, которого здесь нет.","«Потому что» не подходит: пришлось бы перестроить синтаксис и изменить направление связи.","«… этот прибор прост, пользоваться им без инструкции не следует».","Для уступки возможен союз «хотя».","Конкретный ответ зависит от полной формулировки задания: требуется одно слово, сочетание либо определённый разряд."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Работать только с предложением, содержащим пропуск","Выбирать первое грамматически возможное слово","Игнорировать часть речи","Считать совпадение темы достаточным для выбора связки"]}]}]},{"id":"RU011","title":"Лексическое значение в контексте: задание 2","mod":"M02","tasks":[2,5,6,25,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Лексическое значение — содержание слова как единицы словаря. У многозначного слова есть связанные значения. «Корень растения», «корень слова», «корень проблемы» объединены идеей основы, но не обозначают один и тот же объект. Контекст выбирает конкретное значение."},{"t":"p","s":"Омонимы совпадают по форме, но имеют разные, не связанные в современном языке значения: лук как растение и оружие. Омофоны одинаково звучат, но могут по-разному писаться; омографы одинаково пишутся, но по-разному произносятся, например за́мок и замо́к. Омоформы совпадают лишь в отдельных грамматических формах. Эти термины описывают разные виды совпадения."},{"t":"p","s":"Прямое значение непосредственно называет предмет или признак; переносное основано на переосмыслении. Переносное значение может стать обычным словарным: «ножка стола». Не всякое переносное употребление в современном тексте является ярким авторским художественным приёмом."}]},{"h":"Алгоритм проверки определения","items":[{"t":"st","items":["Найдите слово в тексте.","Прочитайте весь фрагмент.","Установите, что оно обозначает здесь.","Затем подставьте предложенное толкование вместо слова с необходимой грамматической перестройкой.","Проверьте все ограничения толкования: сферу, предмет, оценку, характер действия.","Одно совпавшее ключевое слово не доказывает правильность всей формулировки."]}]},{"h":"Разбор","items":[{"t":"ex","items":["«В споре он занял твёрдую позицию».","Прилагательное «твёрдый» означает устойчивость, определённость убеждений.","Определение «сохраняющий форму, сопротивляющийся физическому воздействию» подходит к материалу, но не к этому употреблению.","Ошибка — принять любое словарное значение за контекстное.","Если проверяется несколько утверждений, каждое рассматривают самостоятельно.","Не нужно угадывать количество ответов по предыдущим вариантам: оно определяется инструкцией и конкретным набором утверждений."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Проверять слово вне предложения","Ориентироваться только на знакомое первое значение","Смешивать значение и эмоциональную оценку","Считать, что термин обязательно непонятен неспециалисту"]}]}]},{"id":"RU012","title":"Функциональные разновидности языка: задание 3","mod":"M02","tasks":[3,22,24,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Стиль определяется целью общения, сферой, адресатом и системой языковых средств. Тема сама по себе стиль не определяет. О воде можно написать научную статью, инструкцию, газетный очерк и рассказ."},{"t":"p","s":"Научный стиль объясняет и доказывает закономерности. Его признаки — точность, логичность, отвлечённость, термины, определения, причинные связи. Настоящее время нередко имеет обобщённое значение: «металл проводит ток». Научно-популярное изложение рассчитано на неспециалиста, поэтому может включать образные сравнения и обращения к читателю; это не отменяет познавательной цели."},{"t":"p","s":"Официально-деловой стиль регулирует отношения, фиксирует решения, права, обязанности и сведения. Характерны стандартизированные формулы, точность наименований, перечисления, нейтральная лексика, отсутствие эмоциональной двусмысленности. Жанры — заявление, приказ, договор, доверенность, резюме."},{"t":"p","s":"Публицистический стиль сообщает об общественно значимом и воздействует на аудиторию. В нём сочетаются факты и оценка, общественная лексика, призывы, риторические вопросы, противопоставления. Жанры — статья, репортаж, очерк, интервью. Не каждый материал в интернете публицистический: место публикации не заменяет анализа."},{"t":"p","s":"Разговорная речь обслуживает непосредственное неофициальное общение. Для неё характерны ситуативность, непринуждённость, диалогичность, неполные предложения, частицы, разговорная лексика. Она может быть литературной и грамматически корректной."},{"t":"p","s":"Художественная речь создаёт образы и эстетическое переживание. Она свободно использует средства других разновидностей языка для авторской задачи: научный термин может характеризовать персонажа, разговорная реплика — создавать его речевой портрет. В кодификаторе отдельно говорится о языке художественной литературы."}]},{"h":"Алгоритм","items":[{"t":"st","items":["Сначала назовите цель: объяснить, предписать, убедить, непринуждённо общаться или создать образ.","Затем найдите несколько независимых языковых подтверждений.","В задании проверяйте каждое утверждение полностью: правильное название стиля не делает верным неверный перечень его признаков."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["«есть термин — значит научный»","«есть эмоции — значит художественный»","«есть сложные предложения — значит книжный стиль определён»","Путать стиль с типом речи: рассуждение встречается в разных стилях"]}]}]},{"id":"RU013","title":"Проверка содержания и выводов: задание 23","mod":"M02","tasks":[23,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Проверка содержания требует точности. Утверждение может повторять знакомые слова текста, но искажать причинность, последовательность, участника или масштаб. «Герой промолчал из страха» и «герой промолчал, чтобы не обидеть собеседника» описывают одно внешнее действие с разными мотивами."},{"t":"p","s":"Вывод допустим, если опирается на текст и не добавляет независимых сведений. Отсутствие прямой цитаты не делает утверждение неверным: мысль может быть передана синонимически. Однако правдоподобие в реальной жизни не заменяет текстового подтверждения."},{"t":"p","s":"Особенно внимательно проверяют отрицание, ограничительные слова «только», «всегда», «все», «никогда», количественные характеристики, временные отношения и причинные союзы. Замена «некоторые» на «все» меняет объём утверждения. Замена «после» на «из-за» превращает последовательность в причинность."}]},{"h":"Алгоритм","items":[{"t":"st","items":["Прочитайте, требуются верные или неверные утверждения.","Для каждого отметьте участника, действие, причину и ограничения.","Найдите подтверждающий фрагмент либо явное противоречие.","Сформулируйте короткое основание решения.","В конце заново сверьтесь с отрицанием в инструкции."]}]},{"h":"Разбор","items":[{"t":"ex","items":["Текст: «Лена не сразу ответила: она хотела точно вспомнить разговор».","Утверждение «Лена молчала, потому что не хотела разговаривать» неверно.","Утверждение «Перед ответом Лена пыталась восстановить подробности разговора» верно по смыслу, хотя не повторяет предложение буквально."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Подменять прочитанное житейскими знаниями","Оценивать поступок вместо проверки утверждения","Переносить событие одного персонажа на другого","Забывать, что требуется выбрать несоответствующее"]}]}]},{"id":"RU014","title":"Описание, повествование, рассуждение: задание 24","mod":"M02","tasks":[3,24,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Повествование показывает смену событий: что произошло сначала, затем и в результате. Его опора — временное развитие; часто используются глаголы действия совершенного вида, но это признак, а не единственное условие. Последовательность событий может передаваться настоящим историческим временем."},{"t":"p","s":"Описание раскрывает признаки предмета, человека, места или состояния. Условно его можно представить как один кадр. В нём возможны глаголы: «Вдоль дороги растут сосны, над водой стелется туман». Наличие глагола не превращает описание в повествование. Различают портрет, пейзаж, интерьер и другие предметные разновидности."},{"t":"p","s":"Рассуждение устанавливает связи, объясняет и обосновывает мысль. Типичная структура: тезис — основания/доказательства — вывод. Отдельные компоненты могут быть выражены неявно. Рассуждение бывает доказательством, объяснением, размышлением. Для его распознавания важно движение мысли, а не только слова «потому что» или «поэтому»."},{"t":"p","s":"В тексте типы речи сочетаются. Автор может начать повествованием, включить описание героя, затем перейти к рассуждению. В задании рассматривают именно указанный диапазон предложений. Кроме типа речи могут проверяться отношения: конкретизация, объяснение, причина, следствие, противопоставление. Эти отношения и тип речи не тождественны."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Я открыл дверь, вошёл и зажёг свет» — повествование.","«Комната была узкой, стены — светлыми, окна — высокими» — описание.","«Света оказалось мало, потому что окна выходили во двор» — объяснение причины; в контексте это элемент рассуждения."]}]},{"h":"Алгоритм","items":[{"t":"st","items":["Сформулируйте главное действие фрагмента: он перечисляет признаки, ведёт по событиям или объясняет мысль?","Затем проверьте языковые маркеры.","Если в утверждении сказано «содержит элементы описания», не требуйте, чтобы весь фрагмент был чистым описанием."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Считать любые глаголы повествованием","Определять тип по общему тексту вместо указанного фрагмента","Путать рассуждение с публицистическим стилем","Не различать «объясняет» и «является следствием»"]}]}]},{"id":"RU015","title":"Синонимы, антонимы, фразеологизмы и пласты лексики","mod":"M02","tasks":[2,3,22,25,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Синонимы близки по значению, но могут отличаться оттенком, сочетаемостью и стилем: смелый, храбрый, отважный. Контекстные синонимы сближаются именно в данном тексте. Их нельзя назначать произвольно: нужно показать, что они называют один объект или близкое качество в конкретном фрагменте."},{"t":"p","s":"Антонимы противоположны по одному смысловому признаку: высокий — низкий, победа — поражение. Разные предметы не становятся антонимами только потому, что автор их перечислил. Контекстные антонимы образуют противопоставление в тексте, хотя вне него могут не входить в словарную пару."},{"t":"p","s":"Фразеологизм — устойчивое воспроизводимое сочетание с целостным значением: «держать язык за зубами» — молчать; «спустя рукава» — небрежно; «рукой подать» — близко. Устойчивость не означает абсолютную неизменяемость всех форм, но свободно заменять компоненты обычно нельзя. Свободное сочетание «держать книгу в руках» сохраняет прямые значения компонентов."},{"t":"p","s":"Термин называет специальное понятие научной или профессиональной области: фонема, морфема. Профессионализм — характерное для профессиональной среды обозначение, не обязательно официально закреплённый термин. Диалектизм ограничен территорией, жаргонизм — социальной или профессиональной группой. Просторечие не равно любому разговорному слову."},{"t":"p","s":"Архаизм — устаревшее название сохраняющегося понятия: «очи» вместо «глаза». Историзм — название исчезнувшей реалии, например «кольчуга» как предмет исторического вооружения. Неологизм — новое слово или значение; его новизна зависит от времени. Индивидуально-авторский неологизм создаётся конкретным автором для художественной задачи."}]},{"h":"Алгоритм задания 25","items":[{"t":"st","items":["Установите, что требуется выписать: слово, пару или сочетание.","Ограничьте поиск указанными предложениями.","Проверьте значение кандидата и границы выражения.","Перенесите форму из текста, если инструкция не требует иной.","Для пары не добавляйте третье близкое слово."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Выписывать половину фразеологизма","Давать собственный синоним вместо слова из текста","Превращать любую необычную фразу в фразеологизм","Считать просторечной нейтральную разговорную лексику"]}]}]},{"id":"RU016","title":"Средства связи предложений: задание 26","mod":"M02","tasks":[1,26,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Цепная связь устроена так, что новое предложение подхватывает компонент предыдущего: «Мы подошли к реке. Она была спокойной». Параллельная связь соотносит несколько предложений с общей темой и часто поддерживается сходным построением. В реальном тексте способы могут сочетаться."},{"t":"p","s":"Лексические средства связи: повтор слова, синонимическая замена, антонимическое соотнесение, родовидовые отношения, слова одной тематической группы. Морфологические: формы одного слова, личные и указательные местоимения, местоименные наречия, соотнесённость временных форм. Синтаксические: сходное построение, неполнота, союзы и другие соединительные средства. Классификационные границы в учебниках различаются, поэтому в ответе нужно следовать конкретному термину задания."},{"t":"p","s":"Повтор слова, формы одного слова и однокоренные слова нельзя смешивать: «книга — книга» — повтор в той же форме; «книга — книгой» — формы одного слова; «книга — книжный» — однокоренные слова. В широком стилистическом анализе повтор может охватывать разные формы; в упражнении на различение средств используйте заданную модель."},{"t":"p","s":"Средство связи должно связывать данное предложение с требуемым соседним, а не просто присутствовать внутри него. В «Она улыбнулась, когда увидела брата» местоимение может отсылать к предыдущей фразе, но союз «когда» связывает части самого предложения."}]},{"h":"Алгоритм","items":[{"t":"st","items":["Прочитайте требование: связь с предыдущим предложением, несколькими предложениями или иной указанной единицей.","Проверьте каждое предложение диапазона и его левый контекст.","Для каждого запрошенного средства найдите конкретную пару: местоимение — заменяемое слово, повтор — предыдущее употребление.","Если названы два средства, подтвердите оба."]}]},{"h":"Разбор","items":[{"t":"ex","items":["«Мы заметили старый дом.","Этот дом стоял у самой воды».","«Этот» — указательное местоимение, «дом» повторяется.","«Мы заметили старый дом.","Вечером начался дождь» — временное наречие само по себе не доказывает запрошенную местоименную связь с домом."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Указывать первое предложение диапазона без чтения предыдущего","Путать личное «его» и притяжательное","Принимать внутрипредложный союз за межфразовую связь","Находить одно средство из требуемых двух"]}]}]},{"id":"RU017","title":"План, тезисы, конспект, аннотация и рецензия","mod":"M02","tasks":[23,24,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"План показывает последовательность смысловых частей. Назывной план состоит из коротких заголовков, вопросный — из вопросов, тезисный — из основных утверждений. Хороший план сохраняет логику исходного текста и не дробит его по каждому предложению."},{"t":"p","s":"Тезисы кратко формулируют главные положения. Конспект сохраняет структуру, основные мысли, существенные доказательства и примеры. Реферат систематически излагает содержание одного или нескольких источников по теме; собственное исследование нельзя подменять пересказом, но и чужие выводы нельзя выдавать за собственные."},{"t":"p","s":"Аннотация отвечает, о чём материал и для чего он может быть полезен, без подробного пересказа. Отзыв передаёт обоснованное впечатление и оценку. Рецензия включает анализ и мотивированную оценку произведения или работы: предмет, основные особенности, достоинства, ограничения. Одного «мне понравилось» для анализа недостаточно."},{"t":"p","s":"При работе с несколькими источниками отделяют тезис автора, приведённый факт и собственный вывод. График, таблица и инфографика тоже требуют проверки единиц, подписей, масштаба и условий сравнения. Красивое изображение не снимает требования точно понимать данные."}]},{"h":"Разбор","items":[{"t":"ex","items":["Исходная мысль: «Регулярное повторение помогает лучше удерживать материал, если ученик воспроизводит его самостоятельно и разбирает ошибки».","Плохой тезис: «Надо учиться».","Хороший: «Повторение должно включать самостоятельное воспроизведение и анализ ошибок».","Он сохраняет существенные условия исходной мысли."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Выдавать длинную цитату за конспект","Исключать оговорки, меняющие смысл","Оценивать источник без аргументов","Использовать пересказ вместо комментария к авторской позиции в сочинении"]}]}]},{"id":"RU018","title":"Ударение: подготовка к заданию 4","mod":"M03","tasks":[4],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Ударение в русском языке нельзя надёжно вычислить по одному универсальному правилу. Продуктивная подготовка сочетает запоминание конкретных словоформ с изучением ограниченных закономерностей. Учить «начать» недостаточно: важны нАчал, началА, нАчали. Каждая карточка должна содержать форму и при необходимости значение."},{"t":"p","s":"В ряде форм женского рода прошедшего времени ударение переходит на окончание: взялА, ждалА, снялА. Но это не универсальное правило: клАла, послАла. У многих глаголов на -ить ударение в личной форме падает на окончание: звонИт, облегчИт. Однако само окончание инфинитива -ить не позволяет переносить эту модель на все глаголы."},{"t":"p","s":"Смысл способен различать ударение: Отзыв о книге и отзЫв посла. В формах множественного числа ударение тоже требует проверки: тОрты, бАнты, шАрфы, срЕдства. Нельзя выводить норму только из того, как говорят знакомые."}]},{"h":"Актуальность словника","items":[{"t":"p","s":"На дату сборки доступен тематический навигатор ФИПИ с «Орфоэпическим списком — 2026». Это название источника сохранено: список не выдан за отдельный словник 2027 года. В нём есть указание на исключённые из предстоящей для этого документа кампании слова; перед выпуском курса 2027 следует сверить новую редакцию. Исключение слова из задания не означает автоматического запрета слова в русском языке."}]},{"h":"Алгоритм обучения и решения","items":[{"t":"st","items":["Произнесите форму до просмотра подсказки.","Сверьте ударную гласную.","При ошибке запишите правильную форму в коротком естественном сочетании, например «проверенные срЕдства».","Повторяйте трудные формы с интервалом и в перемешанном порядке.","В экзаменационном задании проверяйте каждое слово независимо и переносите номера по инструкции.","Буква ё в экзаменационной записи может быть заменена буквой е.","Нужно смотреть на обозначенное ударение и нормативное звучание, а не считать любую запись с е автоматически ошибочной.","В приложении ударную гласную лучше хранить отдельной позицией, сохраняя исходную букву ё."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Запоминать только ошибочный вариант","Учить без грамматической формы","Переносить закономерность на все слова сходного вида","Считать список случайного сайта официально утверждённым"]}]},{"h":"Словник: 100 ударений","items":[{"t":"tb","head":null,"rows":[["аэропОрты","бАнты"],["бОроду","бухгАлтеров"],["вероисповЕдание","водопровОд"],["газопровОд","граждАнство"],["дефИс","дешевИзна"],["диспансЕр","договорЁнность"],["докумЕнт","досУг"],["еретИк","жалюзИ"],["знАчимость","Иксы"],["каталОг","квартАл"],["киломЕтр","кОнусов"],["корЫсть","крАны"],["кремЕнь","кремнЯ"],["лЕкторов","лОктя"],["локтЕй","лыжнЯ"],["мЕстностей","намЕрение"],["нЕдруг","недУг"],["некролОг","нЕнависть"],["нефтепровОд","новостЕй"],["нОгтя","ногтЕй"],["Отрочество","партЕр"],["портфЕль","придАное"],["призЫв","свЁкла"],["сирОты","созЫв"],["сосредотОчение","срЕдства"],["стАтуя","столЯр"],["тамОжня","тОрты"],["тУфля","цемЕнт"],["цЕнтнер","цепОчка"],["шАрфы","шофЁр"],["экспЕрт","вернА"],["знАчимый","красИвее"],["красИвейший","кУхонный"],["ловкА","мозаИчный"],["оптОвый","прозорлИвый"],["прозорлИва","слИвовый"],["бралА","бралАсь"],["взялА","взялАсь"],["влилАсь","ворвалАсь"],["воспринЯть","воспринялА"],["воссоздалА","вручИт"],["гналА","гналАсь"],["добралА","добралАсь"],["дождалАсь","дозвонИтся"],["дозИровать","ждалА"],["закУпорить","занЯть"],["зАнял","занялА"],["зАняли","заперлА"],["запломбировАть","защемИт"],["звалА","звонИт"]]}]}]},{"id":"RU019","title":"Паронимы: задание 5","mod":"M03","tasks":[5,6,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Паронимы похожи по звучанию и написанию, но различаются значением или употреблением. Их смешивают из-за внешнего сходства. Нужно знать не только краткое толкование, но и типичные объекты: предоставить слово — представить доклад; оплатить проезд — заплатить за проезд."},{"t":"p","s":"«Эффективный» даёт нужный результат; «эффектный» производит сильное впечатление. «Экономический» относится к экономике; «экономичный» позволяет экономить ресурсы; «экономный» бережливо расходует их и может характеризовать человека или расходование. «Практический» относится к практике; «практичный» удобен и целесообразен в быту либо характеризует деловитого человека."},{"t":"p","s":"«Надеть» обычно сочетается с предметом одежды или тем, что помещают на кого-либо: надеть пальто, надеть ребёнку шапку. «Одеть» — снабдить кого-либо одеждой: одеть ребёнка. Мнемоника «одеть Надежду, надеть одежду» помогает, но не отменяет полного значения и управления."},{"t":"p","s":"«Представить» — предъявить, познакомить, вообразить: представить отчёт, представить коллегу. «Предоставить» — дать возможность или передать в распоряжение: предоставить отпуск, помещение, слово. «Адресант» отправляет, «адресат» получает. «Абонемент» даёт право пользоваться услугой, «абонент» — пользователь."}]},{"h":"Алгоритм","items":[{"t":"st","items":["Определите смысл всего предложения.","Найдите выделенное слово, нарушающее этот смысл или сочетаемость.","Подберите именно пароним, а не произвольный синоним.","Поставьте замену в нужную грамматическую форму.","Проверьте управление и окончание: ответ должен вписываться в исходное предложение."]}]},{"h":"Разбор","items":[{"t":"ex","items":["«Организаторы представили участникам возможность задать вопросы».","Нужна замена «предоставили»: речь о возможности, данной участникам.","«Показали» близко по некоторым значениям к «представили», но не является требуемым паронимом и не исправляет конструкцию."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Учить слова по отдельности","Использовать только правило «это про человека, это про предмет» там, где значения шире","Не изменять форму ответа","Путать паронимическую замену с устранением лишнего слова"]}]},{"h":"Словарик паронимов","items":[{"t":"tb","head":["Слово","Значение и пример"],"rows":[["абонемент","право пользоваться услугой · купить абонемент"],["абонент","пользователь услуги · номер абонента"],["адресант","отправитель · адресант письма"],["адресат","получатель · найти адресата"],["авторитарный","основанный на жёстком подчинении · авторитарный стиль"],["авторитетный","пользующийся признанием · авторитетный специалист"],["артистический","относящийся к искусству артиста · артистическая карьера"],["артистичный","обладающий выразительностью и мастерством · артистичный исполнитель"],["благодарный","испытывающий признательность · благодарный слушатель"],["благодарственный","выражающий благодарность · благодарственное письмо"],["благотворительный","направленный на безвозмездную помощь · благотворительный концерт"],["благотворный","приносящий пользу · благотворное влияние"],["болотистый","изобилующий болотами или заболоченный · болотистая местность"],["болотный","относящийся к болоту · болотная растительность"],["вековой","существующий долго, веками · вековой дуб"],["вечный","не имеющий конца или постоянно повторяющийся · вечный вопрос"],["великий","выдающийся по значению · великий учёный"],["величественный","внушающий почтение масштабом и видом · величественный дворец"],["враждебный","проникнутый неприязнью · враждебное отношение"],["вражеский","принадлежащий противнику · вражеский отряд"],["выборный","избираемый голосованием · выборная должность"],["выборочный","охватывающий часть объектов · выборочная проверка"],["гарантийный","относящийся к гарантии · гарантийный срок"],["гарантированный","обеспеченный гарантией · гарантированный результат"],["гармонический","относящийся к гармонии как системе · гармонический анализ"],["гармоничный","согласованный, соразмерный · гармоничный образ"],["глинистый","содержащий много глины · глинистая почва"],["глиняный","сделанный из глины · глиняный кувшин"],["годичный","продолжительностью в один год · годичный курс"],["годовалый","в возрасте одного года · годовалый ребёнок"],["горделивый","исполненный подчёркнутой гордости · горделивая осанка"],["гордый","обладающий чувством достоинства или гордости · гордый человек"],["дипломатический","относящийся к дипломатии · дипломатические отношения"],["дипломатичный","тактичный, умело обходящий острые углы · дипломатичный ответ"],["дождевой","относящийся к дождю · дождевая вода"],["дождливый","изобилующий дождями · дождливый сентябрь"],["драматический","относящийся к драме, иногда к напряжённому событию · драматический театр"],["драматичный","напряжённый, тяжёлый по переживаниям · драматичный финал"],["жизненный","относящийся к жизни · жизненный опыт"],["житейский","относящийся к повседневному быту · житейские заботы"],["запасный","предназначенный для замены или резерва · запасный выход"],["запасливый","склонный делать запасы · запасливый хозяин"],["звериный","относящийся к зверю · звериный след"],["зверский","крайне жестокий · зверский поступок"],["исполнительный","старательный в выполнении поручений; также связанный с исполнением · исполнительный работник"],["исполнительский","относящийся к художественному исполнению · исполнительское мастерство"],["каменистый","покрытый камнями · каменистый берег"],["каменный","сделанный из камня · каменный дом"],["кожаный","сделанный из кожи · кожаный ремень"],["кожный","относящийся к коже как органу · кожный покров"],["костный","относящийся к кости · костная ткань"],["костяной","изготовленный из кости · костяная пуговица"],["ледовый","связанный со льдом как пространством или условиями · ледовый дворец"],["ледяной","состоящий изо льда или очень холодный · ледяная глыба"],["лесистый","обильно покрытый лесом · лесистый склон"],["лесной","относящийся к лесу · лесная тропа"],["надеть","поместить одежду или предмет на кого-либо · надеть пальто"],["одеть","снабдить одеждой кого-либо · одеть ребёнка"],["наличие","факт присутствия · наличие билетов"],["наличность","имеющиеся денежные средства в наличной форме · выдать наличность"],["невежа","грубый, невоспитанный человек · вести себя как невежа"],["невежда","малообразованный, несведущий человек · невежда в физике"],["обидный","вызывающий обиду · обидная реплика"],["обидчивый","склонный обижаться · обидчивый собеседник"],["органический","относящийся к органике, организму или внутреннему единству · органическая химия"],["органичный","естественно вписывающийся · органичный образ"],["памятный","сохраняющийся в памяти или служащий памятью · памятная дата"],["памятливый","хорошо помнящий · памятливый ученик"],["песчаный","состоящий из песка или покрытый им · песчаный пляж"],["песочный","связанный с песком; также название теста · песочное печенье"],["практический","связанный с практикой · практическое занятие"],["практичный","удобный, целесообразный · практичный рюкзак"],["предоставить","дать право, возможность или в распоряжение · предоставить отпуск"],["представить","предъявить, познакомить или вообразить · представить отчёт"],["продуктовый","относящийся к продуктам питания · продуктовый магазин"],["продуктивный","результативный, производительный · продуктивный разговор"],["просвещённый","образованный, культурный · просвещённый человек"],["просветительский","связанный с распространением знаний · просветительский проект"],["скрытый","неявный, не обнаруживающийся открыто · скрытый смысл"],["скрытный","не склонный делиться мыслями · скрытный человек"],["соседний","находящийся рядом · соседний дом"],["соседский","принадлежащий соседу · соседский кот"],["удачливый","тот, кому сопутствует удача · удачливый путешественник"],["удачный","успешный, хорошо получившийся · удачный пример"],["целый","весь или неповреждённый · целый день"],["цельный","единый, неразделённый; внутренне последовательный · цельный характер"],["экономический","относящийся к экономике · экономический кризис"],["экономичный","требующий небольших затрат · экономичный двигатель"],["эффективный","дающий требуемый результат · эффективный метод"],["эффектный","производящий яркое впечатление · эффектный выход"]]}]}]},{"id":"RU020","title":"Лексическая сочетаемость, плеоназм и тавтология: задание 6","mod":"M03","tasks":[6,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Лексическая сочетаемость — возможность слов соединяться в принятом значении. По-русски «играют роль» и «имеют значение». Смешение даёт ошибочное «играет значение». Такая ошибка не исправляется поиском орфограммы: нужно восстановить правильное сочетание."},{"t":"p","s":"Плеоназм — смысловая избыточность: один компонент повторяет смысл другого без оправданной задачи. «Главная суть» избыточно, потому что суть уже означает самое существенное. «Свободная вакансия» в обычном значении также дублирует признак незанятого места. Но не всякое повторение содержания ошибочно: контекст и стилистическая цель могут оправдывать уточнение."},{"t":"p","s":"Тавтология — неоправданное повторение однокоренных или близких по звучанию и значению единиц: «в рассказе рассказывается» часто требует правки. Однако однокоренные слова могут быть необходимы терминологически или художественно: нельзя удалять их автоматически. Лексический повтор как средство выразительности имеет задачу; речевая ошибка возникает при ненужном повторе."},{"t":"p","s":"Другие ошибки: употребление слова в несвойственном значении; смешение паронимов; нарушение устойчивого выражения; неоправданное сочетание разных стилей; пропуск необходимого слова; неоднозначное местоименное указание. В задании 6 нужно выполнять указанное действие: исключить лишнее слово или заменить неверно употреблённое."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Этот пример играет большое значение».","Возможны литературные конструкции «имеет большое значение» и «играет большую роль».","Если инструкция требует заменить одно слово, подходит «имеет»: замена «значение» на «роль» потребовала бы ещё изменить «большое» на «большую».","«Он впервые дебютировал на сцене» — при обычном понимании дебюта слово «впервые» лишнее.","Но любое исправление следует сверять с точным предложением: «впервые выступил на этой сцене» не содержит той же избыточности."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Убирать слово, после которого нарушается грамматика","Исправлять два слова при требовании одного","Видеть ошибку в любом повторе","Ориентироваться на звучность вместо значения"]}]}]},{"id":"RU021","title":"Нормы существительных: род, число и падеж","mod":"M03","tasks":[7,8,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Род несклоняемого существительного нельзя определять только по последней букве. Неодушевлённые заимствованные слова часто среднего рода: новое метро, интересное интервью. Но есть словарные исключения: вкусный кофе — нормативный вариант для строгой письменной речи. Названия лиц и животных могут учитывать пол и закреплённую словарную норму: известный маэстро. У географических названий важен род родового слова: солнечный Сочи — город, полноводная Миссисипи — река."},{"t":"p","s":"Род аббревиатуры часто связан с главным словом: МГУ объявил — университет; ООН приняла — организация. При превращении сокращения в обычное склоняемое слово действуют также грамматическое освоение и закреплённое употребление: престижный вуз. Для исключений нужна словарная проверка."},{"t":"p","s":"Формы именительного множественного неодинаковы: директора, профессора, паспорта; инженеры, бухгалтеры, договоры. Нельзя выбирать -а по аналогии со всеми названиями профессий. Иногда окончания различают значение: корпуса зданий и корпусы как отдельные виды наборов или устройств в специальных значениях; каждый такой случай проверяют по словарю."},{"t":"p","s":"Родительный множественного: нет носков, чулок, сапог, ботинок; килограммов, апельсинов, помидоров; яблок, мест, полотенец. В счётных конструкциях у отдельных единиц измерения бывают варианты. Не следует распространять нулевое окончание одной единицы на остальные."},{"t":"p","s":"Разносклоняемые существительные: нет времени, к знамени, о пламени. У слова «путь» — пути, путём. Несклоняемые слова не получают падежного окончания: с новым пальто, о старом кино. Род и падеж могут выражаться зависимыми словами."}]},{"h":"Алгоритм","items":[{"t":"st","items":["Установите исходное слово и значение.","Определите требуемые число и падеж.","Проверьте, не относится ли слово к несклоняемым или особой группе.","Сверьте словарную форму, затем согласуйте окружающие слова."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["«пять килограмм» переносить на все существительные","«инженера» по аналогии с «директора»","Образовывать «нет местов»","Пытаться склонять «пальто»"]}]}]},{"id":"RU022","title":"Степени сравнения и склонение числительных","mod":"M03","tasks":[7,8,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Простая сравнительная степень: выше, красивее, лучше. Составная: более высокий, менее удобный. Нельзя смешивать модели: «более лучше», «более красивее». Простая превосходная: высочайший, красивейший; составная: самый высокий, наиболее удобный. Сочетание «самый наилучший» в строгой учебной норме избыточно. Не всякое прилагательное допускает все формы: реальные ограничения проверяют по словарю."},{"t":"p","s":"У составного количественного числительного склоняются все изменяемые части: к двумстам тридцати пяти участникам; с двумястами тридцатью пятью участниками. У составного порядкового обычно изменяется последняя часть: в две тысячи двадцать седьмом году."},{"t":"p","s":"Числительные сорок, девяносто, сто имеют по две формы: именительный/винительный — сорок, девяносто, сто; остальные падежи — сорока, девяноста, ста. Полтора/полторы в косвенных падежах имеют форму полутора; полтораста — полутораста. У пятьдесят — восемьдесят и двести — девятьсот изменяются обе части: пятидесяти, пятьюдесятью; двухсот, двумстам, двумястами."},{"t":"p","s":"Собирательные двое, трое и т. д. употребляются с определёнными группами: лицами мужского пола, детьми, личными местоимениями, некоторыми существительными только множественного числа. «Трое девушек» в нейтральной литературной речи исправляют на «три девушки». Нормативны «двое детей», «нас трое»."},{"t":"p","s":"«Оба» сочетается с мужским и средним родом, «обе» — с женским: оба окна, обе книги; обоих домов, обеих сторон; обоими друзьями, обеими руками. У существительных только множественного числа нельзя определять род, поэтому конструкции с оба/обе требуют перестройки: «те и другие часы» либо «и одни и другие» по смыслу."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Благодаря двухстам участникам» → «благодаря двумстам участникам».","Предлог требует дательного, а «двухсот» относится к родительному.","Для исправления нужно знать одновременно управление и парадигму числительного."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Склонять только последнее слово количественного числительного","Смешивать «двухсот» и «двумстам»","Употреблять «обоих сестёр»","Исправлять нормативное «самый лучший» по механической аналогии с «более лучше»"]}]}]},{"id":"RU023","title":"Нормы глаголов, местоимений и образования слов","mod":"M03","tasks":[7,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Нормативные формы глаголов часто требуют запоминания: езжай, поезжай; ляг; положи; клади; машет; полощет. «Ехай», «ляжь», «ложить» без нормативной приставочной модели не подходят для строгой литературной речи. Различайте класть — положить, а не создавайте искусственную пару «ложить — покласть»."},{"t":"p","s":"Некоторые глаголы не имеют обычной нейтральной формы первого лица единственного числа: вместо искусственного «побежду» используют «смогу победить», «одержу победу». Не стоит автоматически распространять отсутствие формы на все похожие глаголы. «Убедить» также удобнее передать через «смогу убедить»."},{"t":"p","s":"Прошедшее время глаголов с -ну- не всегда сохраняет этот суффикс: замёрз, промок, исчез. В некоторых словах варианты допустимы. «Жжёт» — нормативная форма от «жечь»; вариант «жгёт» ошибочен. Для конкретного исходного слова обязательно устанавливают инфинитив. В учебных заданиях не создавайте искусственные варианты без проверки словаря."},{"t":"p","s":"Притяжательное местоимение — «их», а не «ихний». После многих предлогов у личных местоимений третьего лица появляется н: у него, к ней, с ними. После некоторых производных предлогов н не появляется: благодаря ему, вопреки ей; после сравнительной степени — старше его. В притяжательном «у его дома» н не добавляется."},{"t":"p","s":"Возвратные местоимения требуют ясной отнесённости: «Учитель попросил ученика прочитать свой текст» может быть двусмысленно. В собственной речи лучше уточнить: текст ученика или текст учителя. Словообразовательные ошибки возникают при ненормативных суффиксах, приставках и смешении моделей; необычность слова сама по себе не доказывает ошибку, если оно словарное или авторское в уместном контексте."}]},{"h":"Алгоритм","items":[{"t":"st","items":["Определите, какая форма нужна: лицо, число, наклонение, время.","Назовите инфинитив и вид.","Проверьте нормативное образование.","В ответе сохраните требуемую грамматическую функцию."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Считать приставку гарантией нормативности любого слова","Добавлять н к притяжательному «его»","Образовывать редкую форму
