 услугой (абонент связи). Верно: продлил абонемент."},{"id":"x-rus-t6-g28","k":"mc","les":"RU020","task":6,"q":"Дано: предложение «Ученик одел пальто» содержит ошибку. Какое объяснение ВЕРНОЕ?","o":[{"id":"а","t":"нужно «надел»: надевают вещь на себя, одевают кого-то"},{"id":"б","t":"нужно «переодел»"},{"id":"в","t":"это плеоназм — лишнее слово"},{"id":"г","t":"нарушена сочетаемость слова «пальто»"}],"c":"а","e":"Как прийти: это ошибка в паронимах. Надеть (что? на себя) — надел пальто; одеть (кого?) — одел брата. Пальто надевают на себя, значит верно «надел»."},{"id":"x-rus-t7-g01","k":"mc","les":"RU021","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"отряд солдАт"},{"id":"б","t":"пара чулкОв"},{"id":"в","t":"много Яблок"},{"id":"г","t":"пара сапОг"}],"c":"б","e":"Чулок — парный предмет, у него в родительном падеже мн. ч. нулевое окончание: «пара чулОк». Форма «чулкОв» с окончанием -ов НЕВЕРНА. Остальные верны: солдАт, Яблок, сапОг — тоже нулевое окончание."},{"id":"x-rus-t7-g02","k":"mc","les":null,"task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"пять гусАр"},{"id":"б","t":"среди грузИн"},{"id":"в","t":"нет погОнов"},{"id":"г","t":"много вАфель"}],"c":"в","e":"«Погон» — парный предмет (знак различия), родительный мн. ч. нулевой: «нет погОн». «ПогОнов» НЕВЕРНО. ГусАр (воинская группа), грузИн (национальность), вАфель — все с нулевым окончанием, верны."},{"id":"x-rus-t7-g03","k":"mc","les":null,"task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"нет тУфель"},{"id":"б","t":"пара сапОг"},{"id":"в","t":"пять гусАров"},{"id":"г","t":"отряд партизАн"}],"c":"в","e":"«Гусар» — название воинской группы, родительный мн. ч. с нулевым окончанием: «пять гусАр». «ГусАров» НЕВЕРНО. ТУфель, сапОг, партизАн образованы верно (нулевое окончание)."},{"id":"x-rus-t7-g04","k":"mc","les":"RU021","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"много Яблок"},{"id":"б","t":"пара чулОк"},{"id":"в","t":"нет ботИнков"},{"id":"г","t":"среди армЯн"}],"c":"в","e":"«Ботинок» — парный предмет, в родительном мн. ч. нулевое окончание: «нет ботИнок». «БотИнков» НЕВЕРНО. Яблок, чулОк, армЯн — тоже нулевое окончание, верны."},{"id":"x-rus-t7-g05","k":"mc","les":null,"task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"нет мест"},{"id":"б","t":"пара сапогОв"},{"id":"в","t":"отряд солдАт"},{"id":"г","t":"пять партизАн"}],"c":"б","e":"«Сапог» — парный предмет, родительный мн. ч. нулевой: «пара сапОг». «СапогОв» НЕВЕРНО. Мест, солдАт, партизАн — верные формы с нулевым окончанием."},{"id":"x-rus-t7-g06","k":"mc","les":"RU021","task":7,"q":"Найдите ВЕРНО образованную форму родительного падежа мн. числа.","o":[{"id":"а","t":"чулкОв"},{"id":"б","t":"сапогОв"},{"id":"в","t":"солдАтов"},{"id":"г","t":"много сапОг"}],"c":"г","e":"Верно «много сапОг»: у парного предмета нулевое окончание. А «чулкОв», «сапогОв», «солдАтов» — ошибочные формы с лишним -ов; надо чулОк, сапОг, солдАт."},{"id":"x-rus-t7-g07","k":"mc","les":"RU021","task":7,"q":"В каком варианте форма родительного падежа мн. числа образована ВЕРНО?","o":[{"id":"а","t":"пара носОк"},{"id":"б","t":"пять помидОр"},{"id":"в","t":"много чулОк"},{"id":"г","t":"нет местОв"}],"c":"в","e":"Верно «много чулОк» (нулевое окончание у парного предмета). «Носок» надо «носкОв» (-ов), «помидор» → «помидОров» (-ов), «мест» — без -ов. Значит верен только третий вариант."},{"id":"x-rus-t7-g08","k":"mc","les":"RU021","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"сто гектАров"},{"id":"б","t":"пять апельсИн"},{"id":"в","t":"нет носкОв"},{"id":"г","t":"много помидОров"}],"c":"б","e":"«Апельсин» — название фрукта, в родительном мн. ч. окончание -ов: «пять апельсИнов». Форма «апельсИн» НЕВЕРНА. ГектАров, носкОв, помидОров — верно (-ов)."},{"id":"x-rus-t7-g09","k":"mc","les":"RU021","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"килогрАмм помидОр"},{"id":"б","t":"нет чулОк"},{"id":"в","t":"много Яблок"},{"id":"г","t":"пара носкОв"}],"c":"а","e":"«Помидор» — овощ, родительный мн. ч. с окончанием -ов: «килограмм помидОров». «ПомидОр» НЕВЕРНО. ЧулОк, Яблок (нулевое), носкОв (-ов) образованы верно."},{"id":"x-rus-t7-g10","k":"mc","les":null,"task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"среди монгОлов"},{"id":"б","t":"пять таджИков"},{"id":"в","t":"нет мандарИн"},{"id":"г","t":"много узбЕков"}],"c":"в","e":"«Мандарин» — фрукт, родительный мн. ч. с -ов: «нет мандарИнов». «МандарИн» НЕВЕРНО. Национальности монгОлов, таджИков, узбЕков берут окончание -ов — верно."},{"id":"x-rus-t7-g11","k":"mc","les":"RU021","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"нет носкОв"},{"id":"б","t":"пара гОльфов"},{"id":"в","t":"без баклажАн"},{"id":"г","t":"много абрикОсов"}],"c":"в","e":"«Баклажан» — овощ, литературная форма родительного мн. ч. с -ов: «без баклажАнов». «БаклажАн» НЕВЕРНО. НоскОв, гОльфов, абрикОсов — верные формы с -ов."},{"id":"x-rus-t7-g12","k":"mc","les":"RU021","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"пять свечЕй"},{"id":"б","t":"нет носкОв"},{"id":"в","t":"много помидОров"},{"id":"г","t":"без апельсИн"}],"c":"г","e":"«Апельсин» — фрукт, родительный мн. ч. с -ов: «без апельсИнов». «АпельсИн» НЕВЕРНО. СвечЕй (-ей), носкОв, помидОров (-ов) образованы верно."},{"id":"x-rus-t7-g13","k":"mc","les":"RU021","task":7,"q":"Найдите ВЕРНО образованную форму родительного падежа мн. числа.","o":[{"id":"а","t":"пять помидОр"},{"id":"б","t":"пять помидОров"},{"id":"в","t":"много Яблоков"},{"id":"г","t":"нет носОк"}],"c":"б","e":"Верно «пять помидОров»: у названий овощей окончание -ов. «ПомидОр» без -ов НЕВЕРНО, «Яблоков» надо «Яблок» (нулевое), «носОк» надо «носкОв»."},{"id":"x-rus-t7-g14","k":"mc","les":"RU021","task":7,"q":"В каком варианте форма родительного падежа мн. числа образована ВЕРНО?","o":[{"id":"а","t":"без баклажАн"},{"id":"б","t":"без баклажАнов"},{"id":"в","t":"среди грузИнов"},{"id":"г","t":"пять апельсИн"}],"c":"б","e":"Верно «без баклажАнов» (овощ, окончание -ов). «БаклажАн» и «апельсИн» без -ов НЕВЕРНЫ, а «грузИнов» надо «грузИн» (национальность с нулевым окончанием)."},{"id":"x-rus-t7-g15","k":"mc","les":null,"task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"опытные директорА"},{"id":"б","t":"молодые инженерА"},{"id":"в","t":"известные профессорА"},{"id":"г","t":"дальние поездА"}],"c":"б","e":"«Инженер» в именительном мн. ч. имеет окончание -ы: инженЕры. Форма «инженерА» НЕВЕРНА. ДиректорА, профессорА, поездА закреплены с окончанием -а — верно."},{"id":"x-rus-t7-g16","k":"mc","les":null,"task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"новые паспортА"},{"id":"б","t":"подписанные договорА"},{"id":"в","t":"опытные докторА"},{"id":"г","t":"старые кузовА"},{"id":"д","t":"хорошие мастерА"}],"c":"б","e":"«Договор» в именительном мн. ч. — договОры (окончание -ы). «ДоговорА» НЕВЕРНО. ПаспортА, докторА, кузовА, мастерА закреплены с -а — верно."},{"id":"x-rus-t7-g17","k":"mc","les":null,"task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"строгие бухгалтерА"},{"id":"б","t":"опытные шофёры"},{"id":"в","t":"умелые поварА"},{"id":"г","t":"ночные сторожА"}],"c":"а","e":"«Бухгалтер» в именительном мн. ч. — бухгАлтеры (-ы). «БухгалтерА» НЕВЕРНО. Шофёры (-ы), поварА и сторожА (-а) — верные закреплённые формы."},{"id":"x-rus-t7-g18","k":"mc","les":null,"task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"опытные тренерА"},{"id":"б","t":"строгие директорА"},{"id":"в","t":"известные профессорА"},{"id":"г","t":"умелые мастерА"}],"c":"а","e":"«Тренер» в именительном мн. ч. — трЕнеры (-ы). «ТренерА» НЕВЕРНО. ДиректорА, профессорА, мастерА закреплены с окончанием -а — верно."},{"id":"x-rus-t7-g19","k":"mc","les":null,"task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"приглашённые лекторА"},{"id":"б","t":"опытные докторА"},{"id":"в","t":"большие городА"},{"id":"г","t":"дальние краЯ"}],"c":"а","e":"«Лектор» в именительном мн. ч. — лЕкторы (-ы). «ЛекторА» НЕВЕРНО. ДокторА, городА, краЯ имеют закреплённое окончание -а/-я — верно."},{"id":"x-rus-t7-g20","k":"mc","les":"RU021","task":7,"q":"Найдите ВЕРНО образованную форму именительного падежа мн. числа.","o":[{"id":"а","t":"инженерА"},{"id":"б","t":"договорА"},{"id":"в","t":"директорА"},{"id":"г","t":"бухгалтерА"}],"c":"в","e":"Верно «директорА» (закреплённое окончание -а). Остальные — ошибки: надо инженЕры, договОры, бухгАлтеры (окончание -ы)."},{"id":"x-rus-t7-g21","k":"mc","les":"RU021","task":7,"q":"В каком ряду форма именительного падежа мн. числа образована ВЕРНО?","o":[{"id":"а","t":"тренерА"},{"id":"б","t":"тОрты"},{"id":"в","t":"шофёрА"},{"id":"г","t":"лекторА"}],"c":"б","e":"Верно «тОрты» (окончание -ы, ударение на первый слог). Ошибочны «тренерА» (→ трЕнеры), «шофёрА» (→ шофёры), «лекторА» (→ лЕкторы)."},{"id":"x-rus-t7-g22","k":"mc","les":"RU021","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"в новом пальтЕ"},{"id":"б","t":"играть на пианино"},{"id":"в","t":"чашка какао"},{"id":"г","t":"ехать в метро"}],"c":"а","e":"«Пальто» — несклоняемое существительное, форма во всех падежах одна: «в новом пальто». «В пальтЕ» НЕВЕРНО. Пианино, какао, метро тоже не склоняются — верно."},{"id":"x-rus-t7-g23","k":"mc","les":"RU021","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"крепкий кофе"},{"id":"б","t":"красивАЯ тюль"},{"id":"в","t":"новый шампунь"},{"id":"г","t":"больнАЯ мозоль"}],"c":"б","e":"«Тюль» — существительное мужского рода: «красивЫЙ тюль». «КрасивАЯ тюль» НЕВЕРНО. Кофе и шампунь — мужского рода (крепкий, новый), мозоль — женского (больнАя) — согласование верное."},{"id":"x-rus-t7-g24","k":"mc","les":"RU021","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"вкусный кофе"},{"id":"б","t":"новАЯ шампунь"},{"id":"в","t":"белый тюль"},{"id":"г","t":"старый рояль"}],"c":"б","e":"«Шампунь» — существительное мужского рода: «новЫЙ шампунь». «НовАЯ шампунь» НЕВЕРНО. Кофе, тюль, рояль — тоже мужского рода, согласованы верно."},{"id":"x-rus-t7-g25","k":"mc","les":null,"task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"ехали на такси"},{"id":"б","t":"играли на пианинЕ"},{"id":"в","t":"пили какао"},{"id":"г","t":"смотрели кино"}],"c":"б","e":"«Пианино» — несклоняемое, форма не меняется: «играли на пианино». «На пианинЕ» НЕВЕРНО. Такси, какао, кино тоже не склоняются — верно."},{"id":"x-rus-t7-g26","k":"mc","les":"RU021","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"у кенгуру"},{"id":"б","t":"с шимпанзе"},{"id":"в","t":"о кашпо"},{"id":"г","t":"в кинЕ"}],"c":"г","e":"«Кино» — несклоняемое существительное: «в кино». «В кинЕ» НЕВЕРНО. Кенгуру, шимпанзе, кашпо также не склоняются — верно."},{"id":"x-rus-t7-g27","k":"mc","les":"RU021","task":7,"q":"Найдите ВЕРНЫЙ вариант.","o":[{"id":"а","t":"чёрное кофе"},{"id":"б","t":"чёрный кофе"},{"id":"в","t":"в пальтЕ"},{"id":"г","t":"красивАЯ тюль"}],"c":"б","e":"Верно «чёрный кофе»: кофе — мужского рода. «Чёрное кофе» — ошибка рода; «в пальтЕ» — склонение несклоняемого (надо «в пальто»); «красивАЯ тюль» — ошибка рода (тюль мужского рода)."},{"id":"x-rus-t7-g28","k":"mc","les":"RU021","task":7,"q":"Найдите ВЕРНЫЙ вариант.","o":[{"id":"а","t":"играли на пианинЕ"},{"id":"б","t":"новАЯ шампунь"},{"id":"в","t":"прочный тюль"},{"id":"г","t":"в депЕ"}],"c":"в","e":"Верно «прочный тюль» (тюль — мужского рода). Ошибки: «на пианинЕ» и «в депЕ» — склонение несклоняемых (надо «на пианино», «в депо»); «новАЯ шампунь» — неверный род (шампунь мужского рода)."},{"id":"x-rus-t7-g29","k":"mc","les":"RU022","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"у обЕих сестёр"},{"id":"б","t":"с обОими друзьями"},{"id":"в","t":"с обОими руками"},{"id":"г","t":"по обе стороны"}],"c":"в","e":"«Руки» — женский род, значит нужна форма от «обе»: «с обЕими руками». «С обОими руками» НЕВЕРНО. Сёстры (ж.р. → обЕих), друзья (м.р. → обОими), стороны — согласованы верно."},{"id":"x-rus-t7-g30","k":"mc","les":"RU022","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"обОих братьев"},{"id":"б","t":"обЕими подругами"},{"id":"в","t":"в обЕих случаях"},{"id":"г","t":"на обОих берегах"}],"c":"в","e":"«Случай» — мужской род, нужна форма от «оба»: «в обОих случаях». «В обЕих случаях» НЕВЕРНО. Братья (м.р. → обОих), подруги (ж.р. → обЕими), берега (м.р. → обОих) — верно."},{"id":"x-rus-t7-g31","k":"mc","les":"RU022","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"у обОих окон"},{"id":"б","t":"обЕими руками"},{"id":"в","t":"обОих девочек"},{"id":"г","t":"на обЕих щеках"}],"c":"в","e":"«Девочки» — женский род, нужна форма от «обе»: «обЕих девочек». «ОбОих девочек» НЕВЕРНО. Окна (ср.р. → обОих), руки и щёки (ж.р. → обЕими/обЕих) — верно."},{"id":"x-rus-t7-g32","k":"mc","les":"RU022","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"обЕими глазами"},{"id":"б","t":"обОими ушами"},{"id":"в","t":"обе страны"},{"id":"г","t":"обОих студентов"}],"c":"а","e":"«Глаза» — мужской род, нужна форма от «оба»: «обОими глазами». «ОбЕими глазами» НЕВЕРНО. Уши (ср.р. → обОими), страны (ж.р. → обе), студенты (м.р. → обОих) — верно."},{"id":"x-rus-t7-g33","k":"mc","les":null,"task":7,"q":"Как правильно: «поделиться с ... подругами»?","o":[{"id":"а","t":"обОими"},{"id":"б","t":"обЕими"}],"c":"б","e":"«Подруги» — женского рода, поэтому берём форму от «обе»: «с обЕими подругами». Форма «обОими» используется только для мужского и среднего рода."},{"id":"x-rus-t7-g34","k":"mc","les":"RU022","task":7,"q":"Найдите ВЕРНЫЙ вариант.","o":[{"id":"а","t":"с обОими сёстрами"},{"id":"б","t":"у обЕих братьев"},{"id":"в","t":"на обОих деревьях"},{"id":"г","t":"в обЕих домах"}],"c":"в","e":"Верно «на обОих деревьях»: дерево — среднего рода, форма от «оба». Ошибки: сёстры (ж.р.) → «обЕими», братья и дома (м.р.) → «обОих»."},{"id":"x-rus-t7-g35","k":"mc","les":"RU022","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"двое друзей"},{"id":"б","t":"трое студентов"},{"id":"в","t":"двое подруг"},{"id":"г","t":"четверо суток"}],"c":"в","e":"«Подруги» — лица женского рода, с ними собирательное числительное не употребляется: нужно «две подруги». «Двое подруг» НЕВЕРНО. Друзья, студенты (м.р.) и сутки (парное слово) — сочетаются с собирательными верно."},{"id":"x-rus-t7-g36","k":"mc","les":"RU022","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"трое детей"},{"id":"б","t":"трое женщин"},{"id":"в","t":"двое ножниц"},{"id":"г","t":"пятеро ребят"}],"c":"б","e":"«Женщины» — лица женского рода, собирательное числительное недопустимо: «три женщины». «Трое женщин» НЕВЕРНО. Дети, ребята и ножницы (слово без ед. ч.) сочетаются с собирательными верно."},{"id":"x-rus-t7-g37","k":"mc","les":"RU022","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"двое сирот"},{"id":"б","t":"семеро козлят"},{"id":"в","t":"двое учениц"},{"id":"г","t":"трое солдат"}],"c":"в","e":"«Ученицы» — лица женского рода, собирательное числительное не подходит: «две ученицы». «Двое учениц» НЕВЕРНО. Сироты, козлята (детёныши), солдаты (м.р.) — сочетаются верно."},{"id":"x-rus-t7-g38","k":"mc","les":null,"task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"их было трое"},{"id":"б","t":"нас двое"},{"id":"в","t":"двое из нас"},{"id":"г","t":"двое девчонок"}],"c":"г","e":"«Девчонки» — лица женского рода, собирательное недопустимо: «две девчонки». «Двое девчонок» НЕВЕРНО. С личными местоимениями (их, нас) собирательные употребляются верно."},{"id":"x-rus-t7-g39","k":"mc","les":"RU021","task":7,"q":"Найдите ВЕРНЫЙ вариант сочетания числительного с существительным.","o":[{"id":"а","t":"двое сестёр"},{"id":"б","t":"две сестры"},{"id":"в","t":"трое девушек"},{"id":"г","t":"двое учительниц"}],"c":"б","e":"Верно «две сестры»: с лицами женского рода употребляется количественное числительное. «Двое сестёр», «трое девушек», «двое учительниц» — ошибки, ведь это лица женского рода."},{"id":"x-rus-t7-g40","k":"mc","les":"RU022","task":7,"q":"Как правильно сказать о промежутке в два дня?","o":[{"id":"а","t":"двое суток"},{"id":"б","t":"две сутки"}],"c":"а","e":"Верно «двое суток». Слово «сутки» не имеет формы единственного числа, поэтому с ним используется именно собирательное числительное, а не «две сутки»."},{"id":"x-rus-t7-g41","k":"mc","les":"RU022","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"около пятисОт книг"},{"id":"б","t":"в две тысячи первом году"},{"id":"в","t":"с тремястАми рублями"},{"id":"г","t":"в двух тысячи пятом году"}],"c":"г","e":"В порядковом числительном склоняется только последнее слово: «в две тысячи пятом году». «В двух тысячи пятом» НЕВЕРНО. ПятисОт, «в две тысячи первом», тремястАми — верные формы."},{"id":"x-rus-t7-g42","k":"mc","les":"RU021","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"около пятисОт"},{"id":"б","t":"около пятистА"},{"id":"в","t":"до шестисОт"},{"id":"г","t":"от восьмисОт"}],"c":"б","e":"Родительный падеж от «пятьсот» — пятисОт (склоняются обе части). «ПятистА» НЕВЕРНО. ШестисОт, восьмисОт образованы верно по той же модели."},{"id":"x-rus-t7-g43","k":"mc","les":"RU022","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"полтора часа"},{"id":"б","t":"с полтора метрами"},{"id":"в","t":"полторы недели"},{"id":"г","t":"о полУтора годах"}],"c":"б","e":"В косвенном падеже «полтора» превращается в «полУтора»: «с полУтора метрами». «С полтора метрами» НЕВЕРНО. «Полтора часа», «полторы недели» (именит./винит.) и «о полУтора годах» — верны."},{"id":"x-rus-t7-g44","k":"mc","les":"RU021","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"около четырёхсОт"},{"id":"б","t":"к трёмстА"},{"id":"в","t":"с восемьюстАми"},{"id":"г","t":"до девятисОт"}],"c":"б","e":"Дательный падеж от «триста» — трёмстАм (склоняются обе части). «ТрёмстА» НЕВЕРНО. ЧетырёхсОт, восемьюстАми, девятисОт образованы верно."},{"id":"x-rus-t7-g45","k":"mc","les":"RU021","task":7,"q":"Найдите ВЕРНЫЙ вариант.","o":[{"id":"а","t":"в двух тысячи двадцатом году"},{"id":"б","t":"в две тысячи двадцатом году"},{"id":"в","t":"около полтораста рублей"},{"id":"г","t":"до пятистА метров"}],"c":"б","e":"Верно «в две тысячи двадцатом году»: в порядковом склоняется лишь последнее слово. Ошибки: «в двух тысячи…» (изменена не та часть), «полтораста» в косвенном падеже → «полУтораста», «пятистА» → «пятисОт»."},{"id":"x-rus-t7-g46","k":"mc","les":"RU021","task":7,"q":"Выберите верную форму: «дорога заняла около ... часов».","o":[{"id":"а","t":"полутора"},{"id":"б","t":"полтора"}],"c":"а","e":"После предлога «около» нужен родительный падеж, а «полтора» в косвенных падежах имеет форму «полУтора»: «около полУтора часов». «Около полтора часов» НЕВЕРНО."},{"id":"x-rus-t7-g47","k":"mc","les":null,"task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"их сад"},{"id":"б","t":"её книга"},{"id":"в","t":"ихний дом"},{"id":"г","t":"его портфель"}],"c":"в","e":"Формы «ихний» в литературном языке нет; притяжательность выражается местоимением «их»: «их дом». «Ихний дом» НЕВЕРНО. «Их», «её», «его» — верные притяжательные формы."},{"id":"x-rus-t7-g48","k":"mc","les":null,"task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"около них"},{"id":"б","t":"благодаря ему"},{"id":"в","t":"навстречу ей"},{"id":"г","t":"возле их"}],"c":"г","e":"После предлога у местоимения 3-го лица появляется «н»: «возле них». «Возле их» НЕВЕРНО. «Около них», «благодаря ему», «навстречу ей» построены верно."},{"id":"x-rus-t7-g49","k":"mc","les":null,"task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"их дети"},{"id":"б","t":"её платье"},{"id":"в","t":"евонная сумка"},{"id":"г","t":"наши книги"}],"c":"в","e":"Формы «евонный» не существует; нужно притяжательное «его»: «его сумка». «Евонная сумка» НЕВЕРНО. «Их», «её», «наши» — верные формы."},{"id":"x-rus-t7-g50","k":"mc","les":null,"task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"их деньги"},{"id":"б","t":"ейные вещи"},{"id":"в","t":"его дело"},{"id":"г","t":"твоё письмо"}],"c":"б","e":"Формы «ейный» в норме нет; притяжательность выражается местоимением «её»: «её вещи». «Ейные вещи» НЕВЕРНО. «Их», «его», «твоё» образованы верно."},{"id":"x-rus-t7-g51","k":"mc","les":null,"task":7,"q":"Найдите ВЕРНЫЙ вариант.","o":[{"id":"а","t":"ихние проблемы"},{"id":"б","t":"их проблемы"},{"id":"в","t":"евонный друг"},{"id":"г","t":"ейный кот"}],"c":"б","e":"Верно «их проблемы»: притяжательность у 3-го лица мн. ч. выражается формой «их». «Ихние», «евонный», «ейный» — просторечные формы, которых в литературном языке нет."},{"id":"x-rus-t7-g52","k":"mc","les":null,"task":7,"q":"Найдите ВЕРНЫЙ вариант.","o":[{"id":"а","t":"наблюдать за ими"},{"id":"б","t":"наблюдать за ними"},{"id":"в","t":"ихний план"},{"id":"г","t":"около их"}],"c":"б","e":"Верно «наблюдать за ними»: после предлога к местоимению добавляется «н». «За ими» и «около их» — без «н», неверно; «ихний» — просторечная форма (надо «их»)."},{"id":"x-rus-t7-g53","k":"mc","les":"RU022","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"более интересный доклад"},{"id":"б","t":"красивее всех"},{"id":"в","t":"более красивее"},{"id":"г","t":"самый добрый человек"}],"c":"в","e":"Нельзя соединять «более» с формой на -ее: получается двойная сравнительная степень. Правильно «более красивый» ИЛИ «красивее». «Более красивее» НЕВЕРНО. Остальные формы корректны."},{"id":"x-rus-t7-g54","k":"mc","les":"RU022","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"умнейший ученик"},{"id":"б","t":"самый умнейший"},{"id":"в","t":"более умный"},{"id":"г","t":"умнее всех"}],"c":"б","e":"Нельзя соединять «самый» с превосходной формой на -ейш: это двойная превосходная степень. Правильно «самый умный» ИЛИ «умнейший». «Самый умнейший» НЕВЕРНО."},{"id":"x-rus-t7-g55","k":"mc","les":"RU022","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"лучший друг"},{"id":"б","t":"более лёгкий путь"},{"id":"в","t":"более лучший результат"},{"id":"г","t":"наиболее удобный вариант"}],"c":"в","e":"«Лучший» — уже форма сравнения от «хороший», поэтому «более лучший» — двойная степень. Надо «лучший» или «более хороший». «Более лучший» НЕВЕРНО."},{"id":"x-rus-t7-g56","k":"mc","les":"RU022","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"менее слабый соперник"},{"id":"б","t":"слабее прежнего"},{"id":"в","t":"менее слабее"},{"id":"г","t":"самый слабый"}],"c":"в","e":"Нельзя соединять «менее» с формой на -ее. Правильно «менее слабый» ИЛИ «слабее». «Менее слабее» — двойная сравнительная степень, НЕВЕРНО."},{"id":"x-rus-t7-g57","k":"mc","les":"RU022","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"выше дерева"},{"id":"б","t":"более высокий дом"},{"id":"в","t":"более выше"},{"id":"г","t":"самый высокий этаж"}],"c":"в","e":"«Выше» — уже сравнительная степень, поэтому «более выше» — двойная степень. Надо «выше» или «более высокий». «Более выше» НЕВЕРНО."},{"id":"x-rus-t7-g58","k":"mc","les":"RU022","task":7,"q":"Найдите ВЕРНЫЙ вариант.","o":[{"id":"а","t":"более лучше"},{"id":"б","t":"более хорошо"},{"id":"в","t":"самый красивейший"},{"id":"г","t":"более выше"}],"c":"б","e":"Верно «более хорошо»: составная сравнительная степень наречия («более» + начальная форма). Остальные — двойные степени: «более лучше», «самый красивейший», «более выше» недопустимы."},{"id":"x-rus-t7-g59","k":"mc","les":"RU022","task":7,"q":"Найдите ВЕРНЫЙ вариант.","o":[{"id":"а","t":"самый глубочайший"},{"id":"б","t":"глубочайший"},{"id":"в","t":"более глубже"},{"id":"г","t":"наиболее глубже"}],"c":"б","e":"Верно «глубочайший» — простая превосходная степень. «Самый глубочайший» и «наиболее глубже» — двойные степени, «более глубже» — двойная сравнительная. Все три неверны."},{"id":"x-rus-t7-g60","k":"mc","les":"RU023","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"поезжай домой"},{"id":"б","t":"положи книгу"},{"id":"в","t":"ляжьте на кушетку"},{"id":"г","t":"беги быстрее"}],"c":"в","e":"Повелительное наклонение от «лечь» — ляг(те). «Ляжьте» НЕВЕРНО. «Поезжай», «положи», «беги» — верные формы повелительного наклонения."},{"id":"x-rus-t7-g61","k":"mc","les":"RU023","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"клади аккуратно"},{"id":"б","t":"не ложи сюда"},{"id":"в","t":"положи на стол"},{"id":"г","t":"выложи всё"}],"c":"б","e":"Глагол без приставки — только «класть»: «не клади сюда». Формы «ложи» нет. «Не ложи» НЕВЕРНО. «Клади», а с приставками «положи», «выложи» — верны."},{"id":"x-rus-t7-g62","k":"mc","les":"RU023","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"поезжай туда"},{"id":"б","t":"едь быстрее"},{"id":"в","t":"беги домой"},{"id":"г","t":"ляг отдохни"}],"c":"б","e":"Повелительное наклонение от «ехать» — поезжАй(те). Форм «едь», «ехай» в литературном языке нет. «Едь» НЕВЕРНО. «Поезжай», «беги», «ляг» — верны."},{"id":"x-rus-t7-g63","k":"mc","les":"RU023","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"маши флагом"},{"id":"б","t":"махай рукой"},{"id":"в","t":"положи ложку"},{"id":"г","t":"поезжайте прямо"}],"c":"б","e":"Повелительное наклонение от «махать» — маши(те). «Махай» НЕВЕРНО. «Маши», «положи», «поезжайте» образованы верно."},{"id":"x-rus-t7-g64","k":"mc","les":"RU023","task":7,"q":"Найдите пример с ОШИБКОЙ в образовании формы слова.","o":[{"id":"а","t":"огонь жжёт"},{"id":"б","t":"он жгёт костёр"},{"id":"в","t":"мама печёт пирог"},{"id":"г","t":"время бережёт нас"}],"c":"б","e":"Глагол «жечь» в 3-м лице ед. ч. — жжёт. «Жгёт» НЕВЕРНО. «Жжёт», «печёт», «бережёт» образованы верно."},{"id":"x-rus-t7-g65","k":"mc","les":"RU023","task":7,"q":"Найдите ВЕРНЫЙ вариант.","o":[{"id":"а","t":"ляжь на диван"},{"id":"б","t":"ложи сюда"},{"id":"в","t":"поезжай домой"},{"id":"г","t":"едь прямо"}],"c":"в","e":"Верно «поезжай домой» — норма повелительного наклонения от «ехать». Ошибки: «ляжь» (надо «ляг»), «ложи» (надо «клади»), «едь» (надо «поезжай»)."},{"id":"x-rus-t7-g66","k":"mc","les":"RU023","task":7,"q":"Как правильно образовать повелительное наклонение от глагола «класть»?","o":[{"id":"а","t":"ложи"},{"id":"б","t":"поклади"},{"id":"в","t":"клади"},{"id":"г","t":"ложь"}],"c":"в","e":"Верно «клади»: глагол «класть» употребляется без приставки и даёт форму «клади». Форм «ложи», «поклади», «ложь» в литературном языке нет (с приставкой был бы другой глагол — «положи»)."},{"id":"x-rus-t8-g01","k":"mc","les":"RU025","task":8,"q":"Найдите предложение с грамматической ошибкой в построении причастного оборота.","o":[{"id":"а","t":"Одна из картин, висевшая в зале, была особенно красива."},{"id":"б","t":"Ребёнок, игравший во дворе, вернулся домой."},{"id":"в","t":"Дорога, ведущая к дому, заросла травой."},{"id":"г","t":"Цветы, стоявшие на окне, давно завяли."}],"c":"а","e":"Задай вопрос от определяемого слова. Оборот характеризует «картин» (какиХ? — из множества), а не «одну», поэтому нужно «висеВШИХ». Пункт «одна из + сущ.» → причастие во мн.ч. В остальных оборот согласован верно."},{"id":"x-rus-t8-g02","k":"mc","les":null,"task":8,"q":"Выберите верную форму причастия: «Мы подошли к дому, … ещё прадедом».","o":[{"id":"а","t":"построенный"},{"id":"б","t":"построенному"},{"id":"в","t":"построенном"}],"c":"б","e":"Найди определяемое слово: «к дому» (к чему? — дат.п.). Причастие согласуется с ним в падеже → «построеннОМУ» (дат.п.)."},{"id":"x-rus-t8-g03","k":"mc","les":null,"task":8,"q":"В каком предложении причастие НЕ согласовано с определяемым словом?","o":[{"id":"а","t":"Книги, лежавшую на полке, покрылись пылью."},{"id":"б","t":"Туча, надвигавшаяся с запада, закрыла солнце."},{"id":"в","t":"Мы любовались морем, раскинувшимся до горизонта."},{"id":"г","t":"Тропинка, петлявшая по лесу, вывела нас к реке."}],"c":"а","e":"«Книги» — мн.ч., им.п. Причастие должно быть «лежаВШИЕ», а стоит «лежавшую» (ед.ч.) — рассогласование. Проверяй число и падеж: какиЕ книги? — лежавшиЕ."},{"id":"x-rus-t8-g04","k":"mc","les":null,"task":8,"q":"В предложении «Приехавшие гости на праздник остались довольны» нарушение состоит в том, что…","o":[{"id":"а","t":"определяемое слово «гости» разрывает причастный оборот"},{"id":"б","t":"причастие не согласовано в роде"},{"id":"в","t":"причастие употреблено в неверном времени"},{"id":"г","t":"ошибок нет"}],"c":"а","e":"Оборот «приехавшие на праздник» разорван словом «гости». Правильно: «Приехавшие на праздник гости…» или «Гости, приехавшие на праздник,…». Определяемое слово не должно стоять внутри оборота."},{"id":"x-rus-t8-g05","k":"mc","les":null,"task":8,"q":"В каком предложении допущена ошибка в согласовании причастия?","o":[{"id":"а","t":"Озеро, окружённое лесом, было спокойным."},{"id":"б","t":"Мы шли по аллее, засаженной липами."},{"id":"в","t":"Дети слушали сказку, рассказанную бабушкой."},{"id":"г","t":"Роман, прочитанная мною летом, произвёл впечатление."}],"c":"г","e":"«Роман» — м.р., а «прочитанная» — ж.р. Задай вопрос: какоЙ роман? — прочитаннЫЙ. Рассогласование в роде — ошибка."},{"id":"x-rus-t8-g06","k":"mc","les":"RU025","task":8,"q":"В каком предложении причастный оборот построен ВЕРНО?","o":[{"id":"а","t":"Гора, покрытые снегом, видна издалека."},{"id":"б","t":"Ученик, решивший задачу, поднял руку."},{"id":"в","t":"Стихи, написанное поэтом, стали известны."},{"id":"г","t":"Улицы, украшенный к празднику, сияли огнями."}],"c":"б","e":"Проверяй согласование. «Ученик… решивший» (м.р., ед.ч.) — верно. В остальных: «гора… покрытАЯ», «стихи… написаннЫЕ», «улицы… украшеннЫЕ» — везде рассогласование."},{"id":"x-rus-t8-g07","k":"mc","les":null,"task":8,"q":"В предложении «Одна из песен, исполненная на концерте, всем понравилась» есть ошибка. Как её исправить?","o":[{"id":"а","t":"«исполненная» → «исполненных» (согласовать с «песен»)"},{"id":"б","t":"«одна» → «одной»"},{"id":"в","t":"«понравилась» → «понравились»"},{"id":"г","t":"исправлять ничего не нужно"}],"c":"а","e":"Оборот относится к «песен» (какиХ? — из многих), поэтому «исполненнЫХ». Конструкция «одна из + сущ.» требует причастия во мн.ч."},{"id":"x-rus-t8-g08","k":"mc","les":"RU024","task":8,"q":"Найдите предложение с ошибкой в употреблении деепричастного оборота.","o":[{"id":"а","t":"Подъезжая к городу, я увидел вокзал."},{"id":"б","t":"Подъезжая к городу, у меня закружилась голова."},{"id":"в","t":"Закончив работу, мы отправились домой."},{"id":"г","t":"Читая книгу, он делал заметки."}],"c":"б","e":"Спроси: кто подъезжал? Действие сказуемого выполняет «голова», но голова не подъезжала. Предложение безличное («у меня закружилась»), подлежащего-деятеля нет — деепричастие недопустимо."},{"id":"x-rus-t8-g09","k":"mc","les":"RU024","task":8,"q":"В каком предложении деепричастный оборот употреблён неверно?","o":[{"id":"а","t":"Выполнив упражнение, проверьте ответы."},{"id":"б","t":"Готовясь к экзамену, повторяйте правила."},{"id":"в","t":"Возвращаясь домой, мне стало холодно."},{"id":"г","t":"Услышав шум, дети выбежали во двор."}],"c":"в","e":"«Мне стало холодно» — безличное предложение, нет подлежащего, которое «возвращалось» и которому «стало холодно» одновременно как деятелю. Деепричастие невозможно. Варианты с повелительным наклонением («проверьте», «повторяйте») допустимы."},{"id":"x-rus-t8-g10","k":"mc","les":null,"task":8,"q":"Найдите грамматическую ошибку.","o":[{"id":"а","t":"Спускаясь с горы, туристы пели песни."},{"id":"б","t":"Открыв окно, комната наполнилась свежестью."},{"id":"в","t":"Написав письмо, я отправил его сразу."},{"id":"г","t":"Обдумав ответ, ученик поднял руку."}],"c":"б","e":"Кто открыл окно? По предложению получается «комната», но комната не открывала окно. Субъекты действий разные — ошибка. Надо: «Открыв окно, я почувствовал…»."},{"id":"x-rus-t8-g11","k":"mc","les":"RU024","task":8,"q":"В каком предложении есть ошибка в построении предложения с деепричастным оборотом?","o":[{"id":"а","t":"Прочитав рассказ, я задумался о жизни."},{"id":"б","t":"Собрав вещи, туристы двинулись в путь."},{"id":"в","t":"Переходя дорогу, нужно смотреть по сторонам."},{"id":"г","t":"Подойдя к двери, она была заперта."}],"c":"г","e":"«Подойдя к двери…» — кто подошёл? В предложении подлежащее «дверь», но дверь не подходила. Ошибка. Вариант «Переходя дорогу, нужно смотреть…» верен: инфинитивное предложение допускает деепричастие."},{"id":"x-rus-t8-g12","k":"mc","les":null,"task":8,"q":"Найдите предложение с ошибкой.","o":[{"id":"а","t":"Заметив ошибку, редактор исправил текст."},{"id":"б","t":"Гуляя по парку, было приятно дышать свежим воздухом."},{"id":"в","t":"Услышав звонок, ученики заняли места."},{"id":"г","t":"Приготовив ужин, хозяйка накрыла на стол."}],"c":"б","e":"«Было приятно» — безличное предложение, нет деятеля, который «гулял». Деепричастие недопустимо. Правильно: «Гуляя по парку, я с удовольствием дышал…»."},{"id":"x-rus-t8-g13","k":"mc","les":"RU025","task":8,"q":"В каком предложении деепричастный оборот употреблён ВЕРНО?","o":[{"id":"а","t":"Опаздывая на урок, мне пришлось бежать."},{"id":"б","t":"Прочитав книгу, её вернули в библиотеку."},{"id":"в","t":"Закончив школу, выпускники поступают в вузы."},{"id":"г","t":"Глядя в окно, поезд тронулся."}],"c":"в","e":"«Выпускники закончили школу и поступают» — один субъект выполняет оба действия. Верно. В остальных субъекты не совпадают или предложение безличное."},{"id":"x-rus-t8-g14","k":"mc","les":"RU024","task":8,"q":"Почему предложение «Подъезжая к дому, залаяла собака» построено неверно?","o":[{"id":"а","t":"действия «подъезжая» и «залаяла» относятся к разным субъектам: собака не подъезжала"},{"id":"б","t":"деепричастие стоит не на своём месте"},{"id":"в","t":"деепричастие образовано неверно"},{"id":"г","t":"ошибки нет"}],"c":"а","e":"Деепричастие называет добавочное действие подлежащего. Подлежащее — «собака», а она не подъезжала к дому. Субъекты действий разные — грамматическая ошибка."},{"id":"x-rus-t8-g15","k":"mc","les":null,"task":8,"q":"Найдите предложение с ошибкой в употреблении названия в кавычках.","o":[{"id":"а","t":"В романе «Войне и мире» изображена эпоха."},{"id":"б","t":"В журнале «Наука и жизнь» напечатали статью."},{"id":"в","t":"О картине «Грачи прилетели» знают все."},{"id":"г","t":"В повести «Капитанская дочка» есть тема чести."}],"c":"а","e":"При родовом слове «романе» название в кавычках не склоняется, стоит в И.п.: «в романе „Война и мир“». «Войне и мире» — ошибка."},{"id":"x-rus-t8-g16","k":"mc","les":null,"task":8,"q":"В каком предложении допущена ошибка?","o":[{"id":"а","t":"Герой оперы «Евгения Онегина» страдает."},{"id":"б","t":"В газете «Аргументы и факты» вышло интервью."},{"id":"в","t":"Роман «Отцы и дети» изучают в школе."},{"id":"г","t":"В стихотворении «Парус» звучит мотив одиночества."}],"c":"а","e":"При родовом слове «оперы» название не склоняется: «оперы „Евгений Онегин“». «Евгения Онегина» — ошибка."},{"id":"x-rus-t8-g17","k":"mc","les":null,"task":8,"q":"Выберите верный вариант: «Об этом писали в газете …».","o":[{"id":"а","t":"«Комсомольскую правду»"},{"id":"б","t":"«Комсомольская правда»"},{"id":"в","t":"«Комсомольской правды»"}],"c":"б","e":"Есть родовое слово «газете» → название ставится в И.п. и не склоняется: газете «Комсомольская правда»."},{"id":"x-rus-t8-g18","k":"mc","les":null,"task":8,"q":"Выберите верный вариант (родового слова нет): «Эти строки взяты из …».","o":[{"id":"а","t":"из «Евгения Онегина»"},{"id":"б","t":"из «Евгений Онегин»"},{"id":"в","t":"из «Евгением Онегиным»"}],"c":"а","e":"Родового слова («роман») нет — значит название склоняется: из «Евгения Онегина» (Р.п.)."},{"id":"x-rus-t8-g19","k":"mc","les":"RU026","task":8,"q":"Найдите ошибку в построении предложения с приложением.","o":[{"id":"а","t":"В спектакле «Вишнёвом саде» заняты лучшие актёры."},{"id":"б","t":"Я прочитал роман «Преступление и наказание»."},{"id":"в","t":"В журнале «Мурзилка» много загадок."},{"id":"г","t":"Мы смотрели фильм «Летят журавли»."}],"c":"а","e":"При родовом слове «спектакле» название не склоняется: «спектакле „Вишнёвый сад“». «Вишнёвом саде» — ошибка."},{"id":"x-rus-t8-g20","k":"mc","les":null,"task":8,"q":"В каком предложении название в кавычках употреблено ВЕРНО?","o":[{"id":"а","t":"В поэме «Мёртвых душах» много героев."},{"id":"б","t":"В опере «Пиковая дама» звучит музыка Чайковского."},{"id":"в","t":"О рассказе «Хамелеоне» мы говорили на уроке."},{"id":"г","t":"В балете «Лебедином озере» прекрасная музыка."}],"c":"б","e":"При родовом слове название стоит в И.п.: «в опере „Пиковая дама“» — верно. В остальных название склонено при родовом слове — ошибка."},{"id":"x-rus-t8-g21","k":"mc","les":null,"task":8,"q":"В предложении «В романе „Тихом Доне“ показана жизнь казаков» есть ошибка. Как исправить?","o":[{"id":"а","t":"«Тихом Доне» → «Тихий Дон» (при слове «романе» название не склоняется)"},{"id":"б","t":"«романе» → «роману»"},{"id":"в","t":"убрать кавычки"},{"id":"г","t":"ошибки нет"}],"c":"а","e":"При наличии родового слова «романе» название остаётся в И.п.: «в романе „Тихий Дон“»."},{"id":"x-rus-t8-g22","k":"mc","les":"RU026","task":8,"q":"Найдите предложение с ошибкой в построении предложения с однородными членами.","o":[{"id":"а","t":"Я люблю и горжусь своей страной."},{"id":"б","t":"Он читал и перечитывал письмо."},{"id":"в","t":"Мы пели и танцевали на празднике."},{"id":"г","t":"Ученики слушали и записывали лекцию."}],"c":"а","e":"«Любить (кого? — вин.п.) страну» и «гордиться (кем? — тв.п.) страной» требуют разных падежей. Нельзя ставить одно общее дополнение. Надо: «люблю свою страну и горжусь ею»."},{"id":"x-rus-t8-g23","k":"mc","les":null,"task":8,"q":"В каком предложении нарушено употребление двойного союза?","o":[{"id":"а","t":"Он не только опоздал, а также забыл тетрадь."},{"id":"б","t":"Как я, так и мой друг любим футбол."},{"id":"в","t":"Она была не только красива, но и умна."},{"id":"г","t":"Мы посетили как музей, так и выставку."}],"c":"а","e":"Двойной союз имеет строгую пару: «не только… НО И». «а также» вместо «но и» — ошибка. Надо: «не только опоздал, но и забыл тетрадь»."},{"id":"x-rus-t8-g24","k":"mc","les":"RU026","task":8,"q":"Найдите грамматическую ошибку.","o":[{"id":"а","t":"Я люблю футбол и как играют мастера."},{"id":"б","t":"Он рассказал о поездке и о своих впечатлениях."},{"id":"в","t":"Мы говорили о книгах и о фильмах."},{"id":"г","t":"Она купила тетради и ручки."}],"c":"а","e":"Нельзя соединять как однородные существительное («футбол») и придаточное предложение («как играют мастера»). Это разнотипные конструкции."},{"id":"x-rus-t8-g25","k":"mc","les":"RU026","task":8,"q":"В каком предложении ошибка при обобщающем слове?","o":[{"id":"а","t":"Он побывал во многих странах: Франция, Италия, Испания."},{"id":"б","t":"На столе лежали книги, тетради, ручки."},{"id":"в","t":"Мы собрали ягоды: малину, чернику, землянику."},{"id":"г","t":"В саду росли цветы: розы, лилии, тюльпаны."}],"c":"а","e":"Обобщающее слово «в странах» стоит в предл.п., поэтому однородные должны быть в том же падеже: «во Франции, в Италии, в Испании». Именительный «Франция, Италия…» — ошибка."},{"id":"x-rus-t8-g26","k":"mc","les":"RU026","task":8,"q":"Найдите ошибку в предложении с однородными членами.","o":[{"id":"а","t":"Книга, лежащая на столе и которую я читаю, интересна."},{"id":"б","t":"Дом, стоящий у реки, виден издалека."},{"id":"в","t":"Ученик, который старается, добьётся успеха."},{"id":"г","t":"Мы любовались морем и небом."}],"c":"а","e":"Нельзя соединять как однородные причастный оборот («лежащая на столе») и придаточное определительное («которую я читаю»). Надо оставить что-то одно."},{"id":"x-rus-t8-g27","k":"mc","les":"RU026","task":8,"q":"В каком предложении однородные члены построены ВЕРНО?","o":[{"id":"а","t":"Я ценю и восхищаюсь этим человеком."},{"id":"б","t":"Он не только певец, но и композитор."},{"id":"в","t":"Она мечтала и стремилась к успеху."},{"id":"г","t":"Мы обсудили статью и что делать дальше."}],"c":"б","e":"«Не только… но и» — верная пара двойного союза, обе части однотипны. В остальных: «ценить кого — восхищаться кем», «мечтать о чём — стремиться к чему» (разное управление), и соединение сущ.+придаточного."},{"id":"x-rus-t8-g28","k":"mc","les":null,"task":8,"q":"В предложении «Ученики любили и увлекались историей» есть ошибка. В чём она?","o":[{"id":"а","t":"«любить» (кого? что?) и «увлекаться» (кем? чем?) требуют разных падежей, а дополнение одно"},{"id":"б","t":"неверный порядок слов"},{"id":"в","t":"пропущен союз"},{"id":"г","t":"ошибки нет"}],"c":"а","e":"«Любить историю» (вин.п.) и «увлекаться историей» (тв.п.) управляют разными падежами. Общее дополнение недопустимо. Надо: «любили историю и увлекались ею»."},{"id":"x-rus-t8-g29","k":"mc","les":"RU024","task":8,"q":"Найдите предложение с ошибкой в связи подлежащего и сказуемого.","o":[{"id":"а","t":"Те, кто опоздали на поезд, остались на вокзале."},{"id":"б","t":"Все, кто пришёл, получили подарки."},{"id":"в","t":"Каждый, кто был там, запомнил этот день."},{"id":"г","t":"Тот, кто много читает, много знает."}],"c":"а","e":"При местоимении «кто» сказуемое ставится в ед.ч.: «кто опоздаЛ». Ошибка — «кто опоздали». Сказуемое при «те» («остались») стоит во мн.ч. верно."},{"id":"x-rus-t8-g30","k":"mc","les":null,"task":8,"q":"В каком предложении допущена ошибка?","o":[{"id":"а","t":"Никто из учеников не знали ответа."},{"id":"б","t":"Кто из девочек забыл тетрадь?"},{"id":"в","t":"Все, кто участвовал в конкурсе, молодцы."},{"id":"г","t":"Каждый из нас мечтает о лете."}],"c":"а","e":"«Никто из…» требует ед.ч.: «никто не знаЛ». «Не знали» — ошибка."},{"id":"x-rus-t8-g31","k":"mc","les":"RU024","task":8,"q":"Найдите ошибку в согласовании сказуемого.","o":[{"id":"а","t":"МГУ объявил набор студентов."},{"id":"б","t":"ООН приняла резолюцию."},{"id":"в","t":"Кофе остыл."},{"id":"г","t":"Молодёжь активно участвуют в жизни города."}],"c":"г","e":"«Молодёжь» — собирательное существительное ед.ч., сказуемое в ед.ч.: «участвуЕТ». МГУ (университет — м.р.), ООН (организация — ж.р.), кофе (м.р.) согласованы верно."},{"id":"x-rus-t8-g32","k":"mc","les":"RU024","task":8,"q":"В каком предложении ошибка?","o":[{"id":"а","t":"Врач Иванова провела приём."},{"id":"б","t":"Кенгуру прыгал по поляне."},{"id":"в","t":"Пятеро друзей отправились в поход."},{"id":"г","t":"Стая птиц улетели на юг."}],"c":"г","e":"Подлежащее — «стая» (собирательное, ед.ч.), сказуемое в ед.ч.: «стая улетеЛА». «Улетели» — ошибка."},{"id":"x-rus-t8-g33","k":"mc","les":"RU024","task":8,"q":"Найдите предложение с грамматической ошибкой.","o":[{"id":"а","t":"Он один из тех, кто всегда помогает."},{"id":"б","t":"Те, кто читал эту книгу, помнят финал."},{"id":"в","t":"Все, кто пришли на встречу, остались довольны."},{"id":"г","t":"Каждый, кто знает правило, решит задачу."}],"c":"в","e":"При «кто» сказуемое в ед.ч.: «кто пришёЛ». «Кто пришли» — ошибка. Сказуемое при «все» («остались») во мн.ч. верно."},{"id":"x-rus-t8-g34","k":"mc","les":"RU024","task":8,"q":"В каком предложении подлежащее и сказуемое согласованы ВЕРНО?","o":[{"id":"а","t":"Те, кто опоздал, вошли тихо."},{"id":"б","t":"Все, кто видели закат, были в восторге."},{"id":"в","t":"Никто из гостей не остались равнодушными."},{"id":"г","t":"Молодёжь любят спорт."}],"c":"а","e":"«Кто опоздаЛ» (ед.ч.) и «те вошли» (мн.ч.) — оба согласования верны. В остальных: «кто видеЛ», «никто не осталСЯ», «молодёжь любИТ»."},{"id":"x-rus-t8-g35","k":"mc","les":"RU024","task":8,"q":"В предложении «Все, кто побывали на выставке, восхищались картинами» ошибка. Как исправить?","o":[{"id":"а","t":"«кто побывали» → «кто побывал» (при «кто» сказуемое в ед.ч.)"},{"id":"б","t":"«все» → «всё»"},{"id":"в","t":"«восхищались» → «восхищался»"},{"id":"г","t":"ошибки нет"}],"c":"а","e":"Придаточное с «кто» требует сказуемого в ед.ч.: «кто побываЛ». Главное «все… восхищались» — во мн.ч. верно."},{"id":"x-rus-t8-g36","k":"mc","les":"RU027","task":8,"q":"Найдите предложение с ошибкой в построении косвенной речи.","o":[{"id":"а","t":"Петя сказал, что я обязательно приду завтра."},{"id":"б","t":"Учитель сказал, что урок окончен."},{"id":"в","t":"Мама попросила, чтобы я убрал комнату."},{"id":"г","t":"Друг спросил, приду ли я на встречу."}],"c":"а","e":"Говорит Петя, значит его слова в косвенной речи идут в 3-м лице: «что ОН обязательно придёт». «Что я приду» сохраняет 1-е лицо — ошибка."},{"id":"x-rus-t8-g37","k":"mc","les":"RU027","task":8,"q":"В каком предложении неверно передана косвенная речь?","o":[{"id":"а","t":"Гагарин сказал, что я вижу Землю из космоса."},{"id":"б","t":"Мальчик ответил, что он выучил стихотворение."},{"id":"в","t":"Она сказала, что вернётся к вечеру."},{"id":"г","t":"Врач предупредил, что лекарство нужно принимать утром."}],"c":"а","e":"В косвенной речи слова говорящего (Гагарина) идут в 3-м лице: «что ОН видит Землю». «Что я вижу» — ошибка."},{"id":"x-rus-t8-g38","k":"mc","les":"RU027","task":8,"q":"Прямая речь: Брат сказал: «Я починю велосипед». Выберите верную косвенную речь.","o":[{"id":"а","t":"Брат сказал, что я починю велосипед."},{"id":"б","t":"Брат сказал, что он починит велосипед."},{"id":"в","t":"Брат сказал, что ты починишь велосипед."}],"c":"б","e":"«Я» говорящего заменяется на «он»: «Брат сказал, что ОН починИТ велосипед». Меняется и местоимение, и лицо глагола."},{"id":"x-rus-t8-g39","k":"mc","les":null,"task":8,"q":"Найдите ошибку.","o":[{"id":"а","t":"Мама сказала, что я сегодня приготовлю ужин сама."},{"id":"б","t":"Он сообщил, что задание выполнено."},{"id":"в","t":"Гость спросил, можно ли войти."},{"id":"г","t":"Она добавила, что придёт позже."}],"c":"а","e":"Говорит мама — её слова в 3-м лице: «что ОНА сегодня приготовит ужин сама». «Что я приготовлю сама» сохраняет 1-е лицо — ошибка."},{"id":"x-rus-t8-g40","k":"mc","les":"RU027","task":8,"q":"Найдите предложение с грамматической ошибкой.","o":[{"id":"а","t":"Пушкин писал, что чувства добрые я пробуждал лирой."},{"id":"б","t":"Критик отметил, что роман удался."},{"id":"в","t":"Она сказала, что устала."},{"id":"г","t":"Отец напомнил, что нужно вернуться рано."}],"c":"а","e":"После «что» слова автора должны идти в 3-м лице: «что ОН пробуждал…». Сохранённое «я» внутри косвенной речи — ошибка (без кавычек так нельзя)."},{"id":"x-rus-t8-g41","k":"mc","les":"RU027","task":8,"q":"В каком предложении косвенная речь построена ВЕРНО?","o":[{"id":"а","t":"Друг сказал, что я помогу тебе завтра."},{"id":"б","t":"Тренер сказал, что команда хорошо подготовилась."},{"id":"в","t":"Она пообещала, что я обязательно вернусь."},{"id":"г","t":"Он крикнул, что берегитесь машины."}],"c":"б","e":"«Тренер сказал, что команда подготовилась» — всё в 3-м лице, верно. В остальных сохранены «я» или повелительное «берегитесь», что в косвенной речи недопустимо."},{"id":"x-rus-t8-g42","k":"mc","les":"RU027","task":8,"q":"Прямая речь: «Я прочитал эту книгу», — сказал ученик. Почему неверно: «Ученик сказал, что я прочитал эту книгу»?","o":[{"id":"а","t":"местоимение «я» при передаче чужой речи заменяется на «он»: «что он прочитал»"},{"id":"б","t":"нужно поставить запятую"},{"id":"в","t":"глагол «прочитал» стоит в неверном времени"},{"id":"г","t":"ошибки нет"}],"c":"а","e":"В косвенной речи лицо говорящего передаётся 3-м лицом: «Ученик сказал, что ОН прочитал эту книгу»."},{"id":"x-rus-t8-g43","k":"mc","les":"RU026","task":8,"q":"Найдите предложение с ошибкой в употреблении предлога и падежа.","o":[{"id":"а","t":"Согласно приказа директора занятия отменили."},{"id":"б","t":"Благодаря помощи друзей мы справились."},{"id":"в","t":"Вопреки прогнозу день был солнечным."},{"id":"г","t":"Наперекор судьбе он добился цели."}],"c":"а","e":"Предлог «согласно» требует дательного падежа: согласно (чему?) приказУ. «Согласно приказа» (род.п.) — ошибка."},{"id":"x-rus-t8-g44","k":"mc","les":"RU026","task":8,"q":"В каком предложении ошибка?","o":[{"id":"а","t":"По приезду в город мы пошли в гостиницу."},{"id":"б","t":"По окончании школы он поступил в институт."},{"id":"в","t":"По прибытии поезда объявили посадку."},{"id":"г","t":"По завершении работы все отдохнули."}],"c":"а","e":"Предлог «по» в значении «после» требует предложного падежа: по (о чём?) приездЕ. «По приезду» — ошибка. Ср.: по окончаниИ, по прибытиИ, по завершениИ."},{"id":"x-rus-t8-g45","k":"mc","les":"RU026","task":8,"q":"Найдите ошибку.","o":[{"id":"а","t":"Вопреки ожиданий команда проиграла."},{"id":"б","t":"Согласно расписанию поезд прибыл вовремя."},{"id":"в","t":"Благодаря учителю я полюбил математику."},{"id":"г","t":"Наперекор ветру лодка шла вперёд."}],"c":"а","e":"«Вопреки» требует дательного падежа: вопреки (чему?) ожиданиЯМ. «Вопреки ожиданий» (род.п.) — ошибка."},{"id":"x-rus-t8-g46","k":"mc","les":"RU026","task":8,"q":"Выберите верный вариант.","o":[{"id":"а","t":"согласно договора"},{"id":"б","t":"согласно договору"},{"id":"в","t":"согласно договором"}],"c":"б","e":"«Согласно» + дательный падеж: согласно (чему?) договорУ."},{"id":"x-rus-t8-g47","k":"mc","les":"RU026","task":8,"q":"Найдите предложение с грамматической ошибкой.","o":[{"id":"а","t":"Благодаря упорной тренировки он победил."},{"id":"б","t":"По окончании концерта зрители аплодировали."},{"id":"в","t":"Согласно инструкции прибор безопасен."},{"id":"г","t":"Вопреки трудностям экспедиция продолжалась."}],"c":"а","e":"«Благодаря» требует дательного падежа: благодаря (чему?) тренировкЕ. «Благодаря тренировки» (род.п.) — ошибка."},{"id":"x-rus-t8-g48","k":"mc","les":"RU026","task":8,"q":"В каком предложении предлог с существительным употреблён ВЕРНО?","o":[{"id":"а","t":"По прибытию поезда объявили остановку."},{"id":"б","t":"Согласно расписанию урок начался вовремя."},{"id":"в","t":"Вопреки совета он уехал."},{"id":"г","t":"Благодаря упорства он победил."}],"c":"б","e":"«Согласно расписанию» (дат.п.) — верно. В остальных ошибки: по прибытиИ (П.п.), вопреки советУ (дат.п.), благодаря упорствУ (дат.п.)."},{"id":"x-rus-t8-g49","k":"mc","les":"RU026","task":8,"q":"В предложении «Согласно приказа ректора студенты сдают экзамен» ошибка. Как исправить?","o":[{"id":"а","t":"«приказа» → «приказу» (предлог «согласно» требует дательного падежа)"},{"id":"б","t":"«согласно» → «согласного»"},{"id":"в","t":"«сдают» → «сдадут»"},{"id":"г","t":"ошибки нет"}],"c":"а","e":"«Согласно» управляет дательным падежом: согласно (чему?) приказУ."},{"id":"x-rus-t8-g50","k":"mc","les":"RU024","task":8,"q":"Найдите предложение с нарушением видо-временной соотнесённости глаголов.","o":[{"id":"а","t":"Мальчик открыл книгу и начинает читать."},{"id":"б","t":"Он встал и подошёл к окну."},{"id":"в","t":"Она читает и делает заметки."},{"id":"г","t":"Мы пришли и сели за стол."}],"c":"а","e":"«Открыл» — прош. вр., «начинает» — наст. вр. Глаголы-сказуемые должны стоять в одном времени: «открыл и начал» или «открывает и начинает»."},{"id":"x-rus-t8-g51","k":"mc","les":null,"task":8,"q":"В каком предложении нарушено единство времени?","o":[{"id":"а","t":"Ветер стих, и наступает тишина."},{"id":"б","t":"Солнце село, и стало темно."},{"id":"в","t":"Гости приходят и садятся за стол."},{"id":"г","t":"Дети играли и смеялись."}],"c":"а","e":"«Стих» — прош. вр., «наступает» — наст. вр. Нужно единое время: «стих, и наступила тишина»."},{"id":"x-rus-t8-g52","k":"mc","les":"RU024","task":8,"q":"Выберите верный вариант: «Художник берёт кисть и … картину».","o":[{"id":"а","t":"написал"},{"id":"б","t":"пишет"},{"id":"в","t":"напишет"}],"c":"б","e":"«Берёт» — наст. вр., несов. вид. Второе сказуемое должно быть таким же: «пишет» (наст. вр., несов. вид)."},{"id":"x-rus-t8-g53","k":"mc","les":null,"task":8,"q":"Найдите ошибку.","o":[{"id":"а","t":"Турист поднялся на вершину и любуется видом."},{"id":"б","t":"Он открыл дверь и вошёл в комнату."},{"id":"в","t":"Она улыбнулась и помахала рукой."},{"id":"г","t":"Мальчик поймал мяч и бросил его обратно."}],"c":"а","e":"«Поднялся» — прош. вр., «любуется» — наст. вр. Нужно единство времени: «поднялся и залюбовался»."},{"id":"x-rus-t8-g54","k":"mc","les":"RU024","task":8,"q":"В каком предложении глаголы-сказуемые не соотнесены по времени?","o":[{"id":"а","t":"Автор описывает героя и показал его характер."},{"id":"б","t":"Писатель создаёт образ и раскрывает его."},{"id":"в","t":"Он думал и вспоминал прошлое."},{"id":"г","t":"Она встала и ушла."}],"c":"а","e":"«Описывает» — наст. вр., «показал» — прош. вр. Нужно единое время: «описывает и показывает»."},{"id":"x-rus-t8-g55","k":"mc","les":null,"task":8,"q":"В каком предложении глаголы согласованы по виду и времени ВЕРНО?","o":[{"id":"а","t":"Он сел за стол и берёт ручку."},{"id":"б","t":"Девочка нарисовала домик и раскрасила его."},{"id":"в","t":"Мы идём в лес и собрали грибы."},{"id":"г","t":"Ученик решает задачу и записал ответ."}],"c":"б","e":"«Нарисовала… раскрасила» — оба прош. вр., сов. вид. Согласованы верно. В остальных смешаны прош. и наст. время."},{"id":"x-rus-t8-g56","k":"mc","les":"RU024","task":8,"q":"В предложении «Он вошёл в класс и садится за парту» есть ошибка. В чём она?","o":[{"id":"а","t":"сказуемые стоят в разном времени: «вошёл» (прош.) и «садится» (наст.) — нужно единое время"},{"id":"б","t":"неверный порядок слов"},{"id":"в","t":"пропущен союз"},{"id":"г","t":"ошибки нет"}],"c":"а","e":"Однородные сказуемые должны быть в одном времени и виде: «вошёл и сел» либо «входит и садится»."},{"id":"x-rus-t8-g57","k":"mc","les":"RU027","task":8,"q":"Найдите предложение с ошибкой в построении сложного предложения.","o":[{"id":"а","t":"Он спросил, что приду ли я завтра."},{"id":"б","t":"Он спросил, приду ли я завтра."},{"id":"в","t":"Я знаю, что он придёт."},{"id":"г","t":"Мы узнали, когда начнётся спектакль."}],"c":"а","e":"В косвенном вопросе нельзя ставить и «что», и «ли». Союз «что» лишний: «Он спросил, приду ли я завтра»."},{"id":"x-rus-t8-g58","k":"mc","les":null,"task":8,"q":"В каком предложении допущена ошибка?","o":[{"id":"а","t":"В рассказе описывается о том, как живут герои."},{"id":"б","t":"В рассказе говорится о том, как живут герои."},{"id":"в","t":"Мы думали о том, что будет дальше."},{"id":"г","t":"Она вспоминала о том, как прошло лето."}],"c":"а","e":"«Описывается» не сочетается с «о том»: описывать можно что-то, а не о чём-то. Надо: «описывается, как живут герои». «Говорится о том» — верно."},{"id":"x-rus-t8-g59","k":"mc","les":null,"task":8,"q":"Найдите ошибку в сложном предложении.","o":[{"id":"а","t":"Он утверждал, что будто бы всё сделал сам."},{"id":"б","t":"Он утверждал, что всё сделал сам."},{"id":"в","t":"Он утверждал, будто всё сделал сам."},{"id":"г","t":"Мы поверили, что он прав."}],"c":"а","e":"Нельзя ставить рядом два союза «что будто бы». Нужен один: «что всё сделал сам» или «будто всё сделал сам»."},{"id":"x-rus-t8-g60","k":"mc","les":"RU027","task":8,"q":"В каком предложении ошибка в построении сложного предложения?","o":[{"id":"а","t":"Мне интересно, что смогу ли я решить задачу."},{"id":"б","t":"Мне интересно, смогу ли я решить задачу."},{"id":"в","t":"Я не помню, куда положил ключи."},{"id":"г","t":"Скажи, придёшь ли ты."}],"c":"а","e":"В косвенном вопросе с «ли» союз «что» лишний: «Мне интересно, смогу ли я…». Одновременно «что» и «ли» ставить нельзя."},{"id":"x-rus-t8-g61","k":"mc","les":null,"task":8,"q":"Найдите предложение с грамматической ошибкой.","o":[{"id":"а","t":"Он не понимал то, какой опасности подвергается."},{"id":"б","t":"Он не понимал, какой опасности подвергается."},{"id":"в","t":"Мы гадали, что будет дальше."},{"id":"г","t":"Я знаю, где растут грибы."}],"c":"а","e":"Указательное слово «то» здесь лишнее и мешает связи: «Он не понимал, какой опасности подвергается». Убери лишнее указательное слово."},{"id":"x-rus-t8-g62","k":"mc","les":"RU027","task":8,"q":"В каком сложном предложении НЕТ грамматической ошибки?","o":[{"id":"а","t":"Он спросил, что пойду ли я гулять."},{"id":"б","t":"Учитель поинтересовался, выполнил ли я задание."},{"id":"в","t":"Она сказала, что будто бы устала."},{"id":"г","t":"Мне интересно, что придёт ли гость."}],"c":"б","e":"«Поинтересовался, выполнил ли я задание» — косвенный вопрос с одним «ли», всё верно. В остальных лишний союз «что» при «ли» или двойной союз «что будто бы»."},{"id":"x-rus-t8-g63","k":"mc","les":"RU027","task":8,"q":"В предложении «Я спросил друга, что пойдёт ли он в кино» есть ошибка. Как исправить?","o":[{"id":"а","t":"убрать союз «что»: «спросил, пойдёт ли он в кино» (нельзя одновременно «что» и «ли»)"},{"id":"б","t":"заменить «ли» на «что»"},{"id":"в","t":"убрать запятую"},{"id":"г","t":"ошибки нет"}],"c":"а","e":"Косвенный вопрос присоединяется частицей «ли» без союза «что». «Что» лишнее: «Я спросил друга, пойдёт ли он в кино»."},{"id":"x-rus-t9-g01","k":"mc","les":null,"task":9,"q":"Какую букву писать: прогл_тить кусок?","o":[{"id":"а","t":"а"},{"id":"б","t":"о"}],"c":"б","e":"Корень -глот-, гласная безударная. Проверочное слово — глОтка (под ударением О). Значит, проглОтить → пишем О."},{"id":"x-rus-t9-g02","k":"mc","les":null,"task":9,"q":"Какую букву писать: нак_рмить гостей?","o":[{"id":"а","t":"а"},{"id":"б","t":"о"}],"c":"б","e":"Корень -корм-. Проверочное слово — кОрм (О под ударением). Значит, накОрмить → пишем О."},{"id":"x-rus-t9-g03","k":"mc","les":null,"task":9,"q":"Какую букву писать: уд_вительный случай?","o":[{"id":"а","t":"и"},{"id":"б","t":"е"}],"c":"а","e":"Корень -див-. Проверочные слова — дИво, дИвный (И под ударением). Значит, удИвительный → пишем И."},{"id":"x-rus-t9-g04","k":"mc","les":null,"task":9,"q":"Какую букву писать: просв_щённый человек?","o":[{"id":"а","t":"е"},{"id":"б","t":"и"}],"c":"а","e":"Корень -свещ-/-свет-. Проверочное слово — свЕт (Е под ударением). Значит, просвЕщённый → пишем Е."},{"id":"x-rus-t9-g05","k":"mc","les":null,"task":9,"q":"Какую букву писать: зап_вать таблетку водой?","o":[{"id":"а","t":"и"},{"id":"б","t":"е"}],"c":"а","e":"По контексту «запивать = пить» корень -пи-. Проверочное слово — запИть, пьёт (И под ударением). Значит, запИвать → И. (Не путать с запевАть песню от «петь».)"},{"id":"x-rus-t9-g06","k":"mc","les":"RU029","task":9,"q":"В каком слове безударная гласная в корне ПРОВЕРЯЕТСЯ ударением?","o":[{"id":"а","t":"гористый"},{"id":"б","t":"загореть"},{"id":"в","t":"коснуться"},{"id":"г","t":"растение"}],"c":"а","e":"Как прийти к ответу: проверь каждый корень. «Гористый» проверяется словом гОры — это проверяемая гласная. Загореть (гар/гор), коснуться (кас/кос), растение (раст/рос) — чередующиеся корни, ударением не проверяются."},{"id":"x-rus-t9-g07","k":"mc","les":"RU028","task":9,"q":"В слове «удивляться» пишется И. Какое объяснение ВЕРНО?","o":[{"id":"а","t":"Проверочное слово — дИво, И под ударением"},{"id":"б","t":"Это чередующийся корень"},{"id":"в","t":"Это словарное слово, пишем по памяти"}],"c":"а","e":"Корень -див- не входит в списки чередующихся и не словарный: гласную можно проверить ударением. Проверочное слово дИво (И под ударением) → удИвляться."},{"id":"x-rus-t9-g08","k":"mc","les":"RU028","task":9,"q":"Какую букву писать: пал_садник у дома?","o":[{"id":"а","t":"и"},{"id":"б","t":"е"}],"c":"а","e":"Безударную гласную проверить нельзя, корень не чередующийся — слово словарное. «Палисадник» пишется с И, запоминаем."},{"id":"x-rus-t9-g09","k":"mc","les":"RU028","task":9,"q":"Какую букву писать: прив_легия?","o":[{"id":"а","t":"е"},{"id":"б","t":"и"}],"c":"б","e":"Слово иноязычное, безударную гласную проверить нельзя — словарное. «Привилегия» пишется с И, запоминаем."},{"id":"x-rus-t9-g10","k":"mc","les":"RU028","task":9,"q":"Какую букву писать на месте пропуска: ар_мат цветов?","o":[{"id":"а","t":"о"},{"id":"б","t":"а"}],"c":"а","e":"Слово словарное, ударение падает на последний слог (арОмАт). Безударную гласную корня проверить нельзя — пишем «аромат» с О, запоминаем."},{"id":"x-rus-t9-g11","k":"mc","les":"RU028","task":9,"q":"В каком слове безударную гласную в корне НЕЛЬЗЯ проверить ударением (словарное)?","o":[{"id":"а","t":"винегрет"},{"id":"б","t":"гористый"},{"id":"в","t":"проглотить"},{"id":"г","t":"накормить"}],"c":"а","e":"Как прийти к ответу: попробуй подобрать проверочное слово. Гористый — гОры, проглотить — глОтка, накормить — кОрм (все проверяются). А к «винегрету» проверочного нет и чередования нет → словарное слово."},{"id":"x-rus-t9-g12","k":"mc","les":"RU028","task":9,"q":"Почему в слове «палисадник» пишется И?","o":[{"id":"а","t":"Это словарное слово, написание запоминаем"},{"id":"б","t":"Проверяется формой палИсадник"},{"id":"в","t":"Это чередующийся корень"}],"c":"а","e":"Гласная безударная, проверочного слова нет, корень не чередующийся. Значит, написание непроверяемое (словарное) — И запоминаем по словарю."},{"id":"x-rus-t9-g13","k":"mc","les":"RU029","task":9,"q":"Какую букву писать: заг_рать на пляже?","o":[{"id":"а","t":"о"},{"id":"б","t":"а"}],"c":"а","e":"Корень гар/гор. Под ударением загАр, но здесь ударение НЕ на корне → без ударения пишется О: загорАть."},{"id":"x-rus-t9-g14","k":"mc","les":"RU029","task":9,"q":"Какую букву писать: з_ря догорала?","o":[{"id":"а","t":"а"},{"id":"б","t":"о"}],"c":"а","e":"Корень зар/зор. Без ударения в этом корне пишется А: зарЯ. (Под ударением было бы зОрька.)"},{"id":"x-rus-t9-g15","k":"mc","les":null,"task":9,"q":"Какую букву писать: накл_ниться к воде?","o":[{"id":"а","t":"о"},{"id":"б","t":"а"}],"c":"а","e":"Корень клан/клон. Ударение не на корне → без ударения пишется О: наклонИться. (Под ударением — поклОн, клАняться.)"},{"id":"x-rus-t9-g16","k":"mc","les":null,"task":9,"q":"Какую букву писать: тв_рить добро?","o":[{"id":"а","t":"о"},{"id":"б","t":"а"}],"c":"а","e":"Корень твар/твор. Без ударения пишется О: творИть, творЕние. (Исключение — Утварь.)"},{"id":"x-rus-t9-g17","k":"mc","les":null,"task":9,"q":"Какую букву писать: попл_вок на воде?","o":[{"id":"а","t":"а"},{"id":"б","t":"о"}],"c":"а","e":"Корень плав/плов: почти всегда А, независимо от ударения → поплавОк. Исключения только пловЕц, пловчИха."},{"id":"x-rus-t9-g18","k":"mc","les":"RU029","task":9,"q":"В каком слове в корне пишется А?","o":[{"id":"а","t":"з_ря"},{"id":"б","t":"заг_реть"},{"id":"в","t":"накл_ниться"},{"id":"г","t":"тв_рение"}],"c":"а","e":"Как прийти к ответу: у зар/зор без ударения — А (зарЯ). У гар/гор, клан/клон, твар/твор без ударения — О (загОреть, наклОниться, твОрение). Значит, А только в «заря»."},{"id":"x-rus-t9-g19","k":"mc","les":"RU029","task":9,"q":"Почему в слове «загорелый» пишется О?","o":[{"id":"а","t":"Корень гар/гор: без ударения пишется О"},{"id":"б","t":"Проверочное слово — гОры"},{"id":"в","t":"Это словарное слово"}],"c":"а","e":"Корень гар/гор — чередующийся, ударением не проверяется. Ударение здесь падает не на корень, а по правилу без ударения пишется О: загорЕлый."},{"id":"x-rus-t9-g20","k":"mc","les":"RU029","task":9,"q":"Какую букву писать: выр_сли грибы?","o":[{"id":"а","t":"о"},{"id":"б","t":"а"}],"c":"а","e":"Корень раст/ращ/рос. Перед С пишется О → вЫросли. (Перед СТ и Щ было бы А: растУ, вырАщенный.)"},{"id":"x-rus-t9-g21","k":"mc","les":"RU029","task":9,"q":"Какую букву писать: р_стение у окна?","o":[{"id":"а","t":"а"},{"id":"б","t":"о"}],"c":"а","e":"Корень раст/рос. Перед СТ пишется А → растЕние."},{"id":"x-rus-t9-g22","k":"mc","les":"RU029","task":9,"q":"Какую букву писать: прил_гать усилия?","o":[{"id":"а","t":"а"},{"id":"б","t":"о"}],"c":"а","e":"Корень лаг/лож. Перед Г пишется А → прилагАть. (Перед Ж было бы О: приложИть.)"},{"id":"x-rus-t9-g23","k":"mc","les":"RU029","task":9,"q":"Какую букву писать: предл_жить помощь?","o":[{"id":"а","t":"о"},{"id":"б","t":"а"}],"c":"а","e":"Корень лаг/лож. Перед Ж пишется О → предложИть."},{"id":"x-rus-t9-g24","k":"mc","les":"RU029","task":9,"q":"Какую букву писать: переск_чить забор?","o":[{"id":"а","t":"а"},{"id":"б","t":"о"}],"c":"б","e":"Корень скак/скоч. Перед Ч пишется О → перескочИть. (Перед К было бы А: скакАть.)"},{"id":"x-rus-t9-g25","k":"mc","les":null,"task":9,"q":"В каком слове пишется А по правилу «согласная после корня»?","o":[{"id":"а","t":"выр_щенный"},{"id":"б","t":"выр_с"},{"id":"в","t":"р_сток"},{"id":"г","t":"отр_сль"}],"c":"а","e":"Как прийти к ответу: смотри на согласную. Выращенный — перед Щ → А. Вырос — перед С → О. Росток и отрасль — слова-исключения. Значит, А по правилу только в «выращенный»."},{"id":"x-rus-t9-g26","k":"mc","les":null,"task":9,"q":"Почему в слове «росток» пишется О, хотя стоит перед СТ?","o":[{"id":"а","t":"Это слово-исключение из правила раст/рос"},{"id":"б","t":"Проверяется словом рОст"},{"id":"в","t":"Потому что после корня есть суффикс -а-"}],"c":"а","e":"По правилу перед СТ должна быть А, но «росток» (а также ростОвщик, Ростов, Ростислав) — исключение, пишется О. Исключения надо запомнить."},{"id":"x-rus-t9-g27","k":"mc","les":null,"task":9,"q":"Какую букву писать: соб_рать грибы?","o":[{"id":"а","t":"и"},{"id":"б","t":"е"}],"c":"а","e":"Корень бир/бер. Сразу после корня есть суффикс -а- → пишем И: собирАть."},{"id":"x-rus-t9-g28","k":"mc","les":null,"task":9,"q":"Какую букву писать: соб_ру урожай?","o":[{"id":"а","t":"е"},{"id":"б","t":"и"}],"c":"а","e":"Корень бир/бер. Суффикса -а- после корня НЕТ → пишем Е: соберУ."},{"id":"x-rus-t9-g29","k":"mc","les":null,"task":9,"q":"Какую букву писать: заст_лать постель?","o":[{"id":"а","t":"и"},{"id":"б","t":"е"}],"c":"а","e":"Корень стил/стел. После корня есть суффикс -а- → пишем И: застилАть. (Без -а- было бы Е: застелИть.)"},{"id":"x-rus-t9-g30","k":"mc","les":null,"task":9,"q":"Какую букву писать: медаль будет бл_стеть?","o":[{"id":"а","t":"е"},{"id":"б","t":"и"}],"c":"а","e":"Корень блист/блест. Суффикса -а- после корня нет → пишем Е: блестЕть. (С -а- было бы И: блистАть.)"},{"id":"x-rus-t9-g31","k":"mc","les":"RU029","task":9,"q":"Какую букву писать: прик_саться к стене?","o":[{"id":"а","t":"о"},{"id":"б","t":"а"}],"c":"б","e":"Корень кас/кос. После корня есть суффикс -а- → пишем А: касАться."},{"id":"x-rus-t9-g32","k":"mc","les":"RU029","task":9,"q":"Какую букву писать: прик_снуться к руке?","o":[{"id":"а","t":"а"},{"id":"б","t":"о"}],"c":"б","e":"Корень кас/кос. Суффикса -а- после корня нет → пишем О: коснУться."},{"id":"x-rus-t9-g33","k":"mc","les":null,"task":9,"q":"В каком слове пишется И (после корня есть суффикс -а-)?","o":[{"id":"а","t":"зам_реть"},{"id":"б","t":"зам_рать"},{"id":"в","t":"выт_реть"},{"id":"г","t":"бл_снуть"}],"c":"б","e":"Как прийти к ответу: ищи суффикс -а- сразу после корня. ЗамирАть — есть -а- → И. Замереть, вытереть, блеснуть — суффикса -а- нет → там Е. Значит, И в «замирать»."},{"id":"x-rus-t9-g34","k":"mc","les":"RU029","task":9,"q":"Почему в слове «расстелить» пишется Е?","o":[{"id":"а","t":"После корня нет суффикса -а-, поэтому Е"},{"id":"б","t":"После корня есть суффикс -а-, поэтому Е"},{"id":"в","t":"Проверяется словом стЕлька"}],"c":"а","e":"Корень стил/стел — чередующийся. Суффикса -а- после корня нет → пишем Е: расстелИть. (Ср. расстилАть — там -а-, и пишется И.)"},{"id":"x-rus-t9-g35","k":"mc","les":"RU029","task":9,"q":"Какую букву писать: обм_кнуть перо в чернила?","o":[{"id":"а","t":"о"},{"id":"б","t":"а"}],"c":"б","e":"Значение «погружать в жидкость» → корень мак → пишем А: обмакнУть."},{"id":"x-rus-t9-g36","k":"mc","les":null,"task":9,"q":"Какую букву писать: пром_кнуть под дождём?","o":[{"id":"а","t":"а"},{"id":"б","t":"о"}],"c":"б","e":"Значение «пропускать влагу, становиться мокрым» → корень мок → пишем О: промокнУть."},{"id":"x-rus-t9-g37","k":"mc","les":"RU029","task":9,"q":"Какую букву писать: ур_внять шансы соперников?","o":[{"id":"а","t":"о"},{"id":"б","t":"а"}],"c":"б","e":"Значение «сделать равными, одинаковыми» → корень равн → пишем А: уравнЯть."},{"id":"x-rus-t9-g38","k":"mc","les":"RU029","task":9,"q":"Какую букву писать: выр_внять грядку?","o":[{"id":"а","t":"а"},{"id":"б","t":"о"}],"c":"б","e":"Значение «сделать ровным, гладким» → корень ровн → пишем О: выровнЯть."},{"id":"x-rus-t9-g39","k":"mc","les":"RU029","task":9,"q":"Какую букву писать: широкая р_внина?","o":[{"id":"а","t":"а"},{"id":"б","t":"о"}],"c":"а","e":"По смыслу «ровное место» ждали бы О, но «равнина» — слово-исключение, пишется А. Исключение надо запомнить."},{"id":"x-rus-t9-g40","k":"mc","les":"RU029","task":9,"q":"Дано: «обмакнуть кисть в краску» — буква А. Какое объяснение ВЕРНО?","o":[{"id":"а","t":"Корень мак — «погружать в жидкость» → А"},{"id":"б","t":"Корень мок — «пропускать влагу» → О"},{"id":"в","t":"Это словарное слово"}],"c":"а","e":"Кисть погружают в краску, значит значение «погружать» → корень мак → пишется А: обмакнУть."},{"id":"x-rus-t9-g41","k":"mc","les":null,"task":9,"q":"Почему в слове «промокашка» пишется О?","o":[{"id":"а","t":"Корень мок — «пропускать, впитывать жидкость» → О"},{"id":"б","t":"Корень мак — «погружать» → А"},{"id":"в","t":"Проверочное слово — мОкрый"}],"c":"а","e":"Промокашка впитывает, пропускает влагу — значение «становиться мокрым, пропускать жидкость» → корень мок → пишется О."},{"id":"x-rus-t10-g01","k":"mc","les":"RU030","task":10,"q":"Вставьте букву: он реши́л _делать всю работу за один день (з/с).","o":[{"id":"а","t":"сделать"},{"id":"б","t":"зделать"}],"c":"а","e":"Шаг 1: нахожу приставку — с-. Шаг 2: вспоминаю ключевое правило: приставки з- в русском языке НЕ существует, всегда пишется с-, даже если слышится [з]. Ответ: сделать."},{"id":"x-rus-t10-g02","k":"mc","les":"RU030","task":10,"q":"Вставьте букву: нужно по_писать договор (д/т).","o":[{"id":"а","t":"подписать"},{"id":"б","t":"потписать"}],"c":"а","e":"Шаг 1: приставка под-. Шаг 2: неизменяемые приставки пишутся всегда одинаково; перед глухим [п] слышится [т], но пишем д. Ответ: подписать."},{"id":"x-rus-t10-g03","k":"mc","les":"RU030","task":10,"q":"Вставьте букву: пора о_дать долг (д/т).","o":[{"id":"а","t":"отдать"},{"id":"б","t":"оддать"}],"c":"а","e":"Приставка от- — неизменяемая. Перед звонким [д] она может слышаться как [д], но пишется всегда от-. Ответ: отдать."},{"id":"x-rus-t10-g04","k":"mc","les":"RU030","task":10,"q":"Вставьте букву: решили на_строить ещё один этаж (д/т).","o":[{"id":"а","t":"надстроить"},{"id":"б","t":"натстроить"}],"c":"а","e":"Приставка над- неизменяемая, пишется одинаково всегда; перед глухим [с] слышится [т], но пишем д. Ответ: надстроить."},{"id":"x-rus-t10-g05","k":"mc","les":"RU030","task":10,"q":"Вставьте букву: помоги о_гадать загадку (д/т).","o":[{"id":"а","t":"отгадать"},{"id":"б","t":"одгадать"}],"c":"а","e":"Приставка от- неизменяемая. Перед звонким [г] может слышаться [д], но пишем всегда от-. Ответ: отгадать."},{"id":"x-rus-t10-g06","k":"mc","les":"RU030","task":10,"q":"Обратная задача: выберите ВЕРНО написанное слово.","o":[{"id":"а","t":"зделать"},{"id":"б","t":"сделать"}],"c":"б","e":"Опознавательный признак: приставки з- не существует. Значит вариант зделать невозможен в принципе, всегда пишется с-. Верно: сделать."},{"id":"x-rus-t10-g07","k":"mc","les":"RU030","task":10,"q":"Дан ответ: в слове пишется приставка ПОД-. Какое объяснение верно?","o":[{"id":"а","t":"Пишем под-, потому что это неизменяемая приставка и её написание не зависит от произношения"},{"id":"б","t":"Пишем под-, потому что перед глухим согласным приставка озвончается"},{"id":"в","t":"Пишем пот-, потому что перед глухим слышится [т]"}],"c":"а","e":"Под- — неизменяемая приставка: такие приставки пишутся единообразно всегда. Звук может оглушаться ([пот]), но буква д остаётся. Верно первое объяснение."},{"id":"x-rus-t10-g08","k":"mc","les":"RU030","task":10,"q":"Вставьте букву: перед нами бе_крайняя степь (з/с).","o":[{"id":"а","t":"бескрайняя"},{"id":"б","t":"безкрайняя"}],"c":"а","e":"Шаг 1: приставка на з/с — без-/бес-. Шаг 2: смотрю на первую букву корня — к, это глухой согласный. Шаг 3: перед глухим пишу с. Ответ: бескрайняя."},{"id":"x-rus-t10-g09","k":"mc","les":"RU030","task":10,"q":"Вставьте букву: не надо ра_бросать вещи по комнате (з/с).","o":[{"id":"а","t":"разбросать"},{"id":"б","t":"расбросать"}],"c":"а","e":"Приставка раз-/рас-. Корень начинается на б — звонкий согласный. Перед звонким пишу з. Ответ: разбросать."},{"id":"x-rus-t10-g10","k":"mc","les":"RU030","task":10,"q":"Вставьте букву: мама успела и_печь пирог (з/с).","o":[{"id":"а","t":"испечь"},{"id":"б","t":"избечь"}],"c":"а","e":"Приставка из-/ис-. Корень (печь) начинается на п — глухой согласный. Перед глухим пишу с. Ответ: испечь."},{"id":"x-rus-t10-g11","k":"mc","les":"RU030","task":10,"q":"Вставьте букву: его выбрали во_главить отряд (з/с).","o":[{"id":"а","t":"возглавить"},{"id":"б","t":"восглавить"}],"c":"а","e":"Приставка воз-/вос-. Корень начинается на г — звонкий согласный. Перед звонким пишу з. Ответ: возглавить."},{"id":"x-rus-t10-g12","k":"mc","les":"RU030","task":10,"q":"Вставьте букву: у него был совершенно бе_шумный шаг (з/с).","o":[{"id":"а","t":"бесшумный"},{"id":"б","t":"безшумный"}],"c":"а","e":"Приставка без-/бес-. Корень начинается на ш — глухой согласный. Перед глухим пишу с. Ответ: бесшумный."},{"id":"x-rus-t10-g13","k":"mc","les":"RU030","task":10,"q":"Вставьте букву: буря грозила всё ни_вергнуть (з/с).","o":[{"id":"а","t":"низвергнуть"},{"id":"б","t":"нисвергнуть"}],"c":"а","e":"Приставка низ-/нис-. Корень начинается на в — звонкий согласный. Перед звонким пишу з. Ответ: низвергнуть."},{"id":"x-rus-t10-g14","k":"mc","les":"RU030","task":10,"q":"В каком слове на конце приставки пишется З?","o":[{"id":"а","t":"и_пугать"},{"id":"б","t":"ра_будить"},{"id":"в","t":"бе_конечный"},{"id":"г","t":"во_питать"}],"c":"б","e":"З пишется перед звонким согласным. Проверяю корни: пугать (п — глухой → с), будить (б — звонкий → з), конечный (к — глухой → с), питать (п — глухой → с). Только перед б стоит звонкий. Ответ: разбудить."},{"id":"x-rus-t10-g15","k":"mc","les":"RU030","task":10,"q":"Дан ответ: на конце приставки пишется С. В каком слове это верно?","o":[{"id":"а","t":"ра_дать"},{"id":"б","t":"бе_дельник"},{"id":"в","t":"и_черпать"},{"id":"г","t":"во_рождение"}],"c":"в","e":"С пишется перед глухим согласным. Проверяю: черпать — ч, глухой → с (исчерпать). Остальные: раздать (д — звонкий → з), бездельник (д — звонкий → з), возрождение (р — звонкий → з). Ответ: исчерпать."},{"id":"x-rus-t10-g16","k":"mc","les":"RU030","task":10,"q":"Вставьте: поезд пр_был на станцию точно по расписанию (значение — приехал).","o":[{"id":"а","t":"прибыл"},{"id":"б","t":"пребыл"}],"c":"а","e":"Определяю значение: приехал, приблизился — это значение приближения → пишу при-. Ответ: прибыл. Ср. пребывать = находиться (с пре-)."},{"id":"x-rus-t10-g17","k":"mc","les":"RU030","task":10,"q":"Вставьте: нужно пр_шить пуговицу к рубашке.","o":[{"id":"а","t":"пришить"},{"id":"б","t":"прешить"}],"c":"а","e":"Значение — присоединение (прикрепить одно к другому) → при-. Ответ: пришить."},{"id":"x-rus-t10-g18","k":"mc","les":"RU030","task":10,"q":"Вставьте: он реши́л пр_открыть окно (чуть-чуть).","o":[{"id":"а","t":"приоткрыть"},{"id":"б","t":"преоткрыть"}],"c":"а","e":"Значение — неполнота действия (открыть немного, не до конца) → при-. Ответ: приоткрыть."},{"id":"x-rus-t10-g19","k":"mc","les":"RU030","task":10,"q":"Вставьте: мы гуляли по пр_школьному участку.","o":[{"id":"а","t":"пришкольному"},{"id":"б","t":"прешкольному"}],"c":"а","e":"Значение — близость, нахождение около (участок возле школы) → при-. Ответ: пришкольному."},{"id":"x-rus-t10-g20","k":"mc","les":"RU030","task":10,"q":"Вставьте: это была пр_интересная книга (значение — очень).","o":[{"id":"а","t":"преинтересная"},{"id":"б","t":"приинтересная"}],"c":"а","e":"Приставку можно заменить словом \"очень\": очень интересная → пишу пре-. Ответ: преинтересная."},{"id":"x-rus-t10-g21","k":"mc","les":"RU030","task":10,"q":"Вставьте: пришлось пр_рвать разговор на полуслове.","o":[{"id":"а","t":"прервать"},{"id":"б","t":"прирвать"}],"c":"а","e":"Приставка близка по значению к пере- (прекратить, перебить) → пишу пре-. Ответ: прервать."},{"id":"x-rus-t10-g22","k":"mc","les":"RU030","task":10,"q":"Вставьте: он долго пр_бывал в глубоком раздумье (значение — находился).","o":[{"id":"а","t":"пребывал"},{"id":"б","t":"прибывал"}],"c":"а","e":"Значение — находиться, быть в каком-то состоянии → пре-. Запомни пару: пребывать (быть, находиться) — прибывать (приезжать). Здесь находился → пребывал."},{"id":"x-rus-t10-g23","k":"mc","les":"RU030","task":10,"q":"Вставьте: нельзя пр_зирать слабых (значение — относиться свысока, с презрением).","o":[{"id":"а","t":"презирать"},{"id":"б","t":"призирать"}],"c":"а","e":"Презирать (относиться с презрением, свысока) пишется с пре-. Запомни пару: презирать (ненавидеть) — призирать/призреть (дать приют, позаботиться). Здесь пре-."},{"id":"x-rus-t10-g24","k":"mc","les":"RU030","task":10,"q":"Дан ответ: приставка ПРИ. В каком слове она написана верно по значению?","o":[{"id":"а","t":"пр_морский (у моря)"},{"id":"б","t":"пр_градить путь"},{"id":"в","t":"пр_красный вид"},{"id":"г","t":"пр_рвать связь"}],"c":"а","e":"При- пишется в значениях приближения, присоединения, близости, неполноты. Приморский = находящийся у моря (близость) → при-. Остальные — пре-: преградить (=пере-), прекрасный (=очень), прервать (=пере-). Ответ: приморский."},{"id":"x-rus-t10-g25","k":"mc","les":"RU030","task":10,"q":"В каком предложении выделенное слово написано ВЕРНО?","o":[{"id":"а","t":"Стоит прИдать значение этой детали"},{"id":"б","t":"Изменник хотел прИдать Родину"},{"id":"в","t":"Поезд будет прЕбывать по расписанию"},{"id":"г","t":"Старый радиопрЕёмник наконец замолчал"}],"c":"а","e":"придать значение = добавить (при-) — верно. Ошибки: предать Родину (пре-, изменить), прибывать по расписанию (приезжать, при-), приёмник радио (при-). Ответ: первый."},{"id":"x-rus-t10-g26","k":"mc","les":"RU030","task":10,"q":"Вставьте: нужно с_грать финальную партию.","o":[{"id":"а","t":"сыграть"},{"id":"б","t":"сиграть"}],"c":"а","e":"Шаг 1: приставка с- оканчивается на согласный. Шаг 2: корень игр- начинается на и. Шаг 3: после русской приставки на согласную и переходит в ы. Ответ: сыграть."},{"id":"x-rus-t10-g27","k":"mc","les":"RU030","task":10,"q":"Вставьте: помоги под_скать подходящий вариант.","o":[{"id":"а","t":"подыскать"},{"id":"б","t":"подискать"}],"c":"а","e":"Приставка под- оканчивается на согласную, корень иск-. После русской приставки на согласный и → ы. Ответ: подыскать."},{"id":"x-rus-t10-g28","k":"mc","les":null,"task":10,"q":"Вставьте: это был сверх_нтересный сюжет.","o":[{"id":"а","t":"сверхинтересный"},{"id":"б","t":"сверхынтересный"}],"c":"а","e":"Исключение: после приставок сверх- и меж- и НЕ меняется на ы. Поэтому пишем и. Ответ: сверхинтересный."},{"id":"x-rus-t10-g29","k":"mc","les":"RU030","task":10,"q":"Вставьте: прошли меж_нститутские соревнования.","o":[{"id":"а","t":"межинститутские"},{"id":"б","t":"межынститутские"}],"c":"а","e":"После приставки меж- сохраняется и (исключение, как и сверх-). Ответ: межинститутские."},{"id":"x-rus-t10-g30","k":"mc","les":"RU030","task":10,"q":"Вставьте: в помещении провели дез_нфекцию.","o":[{"id":"а","t":"дезинфекцию"},{"id":"б","t":"дезынфекцию"}],"c":"а","e":"Дез- — иноязычная приставка. После иноязычных приставок (дез-, контр-, пост-, супер-, транс- и др.) пишется и. Ответ: дезинфекцию."},{"id":"x-rus-t10-g31","k":"mc","les":"RU030","task":10,"q":"Вставьте: нам объяснили пред_сторию конфликта.","o":[{"id":"а","t":"предысторию"},{"id":"б","t":"предисторию"}],"c":"а","e":"Приставка пред- оканчивается на согласный (русская), корень истор-. После неё и → ы. Ответ: предысторию."},{"id":"x-rus-t10-g32","k":"mc","les":"RU030","task":10,"q":"Вставьте: команды провели контр_гру.","o":[{"id":"а","t":"контригр
