 по аналогии","Менять смысл действия при исправлении"]}]}]},{"id":"RU024","title":"Связь подлежащего и сказуемого: задание 8","mod":"M03","tasks":[8,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Сказуемое соотносится с подлежащим по числу, а в прошедшем времени и условном наклонении единственного числа — по роду. Чтобы проверить согласование, нужно найти подлежащее, а не ближайшее существительное: «Список новых книг лежал на столе». Слово «книг» не управляет числом сказуемого."},{"t":"p","s":"В конструкции «Все, кто пришёл, получили задания» два грамматических центра: все получили; кто пришёл. Сказуемое при кто обычно имеет форму единственного числа, а сказуемое главной части согласуется с «все». Возможные смысловые варианты согласования сложнее, но в типовом задании нельзя переносить множественное число механически с главной части на придаточную."},{"t":"p","s":"Сочетания с количественным значением допускают смысловое согласование в определённых условиях: «Большинство участников проголосовало» и «Большинство участников проголосовали» могут быть нормативными. Единственное число подчёркивает совокупность, множественное — отдельных действующих лиц. Поэтому нельзя считать один вариант безусловной ошибкой без контекста."},{"t":"p","s":"Род несклоняемого существительного или аббревиатуры сначала устанавливают по норме, затем согласуют сказуемое: «МГУ объявил», «ООН приняла». В сочетании названия с родовым словом обычно ориентируются на него: «Журнал «Наука» опубликовал статью»."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Все, кто участвовали в обсуждении, получил памятку» содержит нарушения в двух частях.","Нейтральная исправленная модель: «Все, кто участвовал в обсуждении, получили памятку».","Нельзя ограничиться последним глаголом."]}]},{"h":"Алгоритм","items":[{"t":"st","items":["Выделите все основы.","Для каждого сказуемого найдите своё подлежащее.","Уберите мысленно зависимые обороты и придаточные.","Проверьте число и род, затем верните полную конструкцию.","Отдельно проверьте слова кто, каждый, тот, все."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Согласовывать по ближайшему слову","«лечить» правильное смысловое согласование как очевидную ошибку","Не различать главную и придаточную части","Путать дополнение в винительном падеже с подлежащим"]}]}]},{"id":"RU025","title":"Грамматические ошибки в причастных и деепричастных оборотах","mod":"M03","tasks":[8,17,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Причастие согласуется с определяемым словом в роде, числе и падеже: «о книге, прочитанной летом». Ошибочно «о книге, прочитанная летом». Определяемое слово не должно разрывать причастный оборот: вместо «прочитанная книга летом» при значении единого оборота — «книга, прочитанная летом» или «прочитанная летом книга»."},{"t":"p","s":"Необходимо учитывать смысловую отнесённость: «Я увидел портрет художника, висевший на стене». На стене висел портрет; форма причастия должна помогать установить эту связь. Если смысл остаётся двусмысленным, лучше перестроить предложение."},{"t":"p","s":"У деепричастия и основного действия должен быть общий исполнитель. В определённо-личном предложении подлежащее может быть не выражено: «Проверив расчёты, отправь отчёт» — исполнитель «ты», конструкция допустима. Не всякое предложение без явного подлежащего ошибочно."},{"t":"p","s":"В безличной конструкции с инфинитивом возможны нормативные обороты, если действия относятся к одному подразумеваемому лицу: «Готовясь к экзамену, нужно повторять правила». Но «Готовясь к экзамену, мне стало тревожно» в учебной проверке нарушает требование к отнесённости деепричастия: основное сказуемое обозначает состояние без нужной инфинитивной конструкции. Надёжное исправление — придаточное времени."},{"t":"p","s":"При страдательном сказуемом особенно внимательно проверяют исполнителя: «Изучив документы, решение было принято» ошибочно. «Изучив документы, комиссия приняла решение» правильно. Тот, кто изучает, должен быть тем, кто принимает."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Подъезжая к станции, у меня выпал билет» → «Когда я подъезжал к станции, у меня выпал билет».","Билет не подъезжал; замена деепричастного оборота придаточным сохраняет смысл и устраняет несоответствие."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Считать любую безличную конструкцию запрещённой","Исправлять лишь запятые при грамматической ошибке","Подбирать форму причастия по ближайшему слову","Оставлять определяемое слово внутри оборота"]}]}]},{"id":"RU026","title":"Управление, однородные члены и приложения","mod":"M03","tasks":[7,8,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Управление означает, что главное слово требует определённой формы зависимого: восхищаться кем/чем; гордиться кем/чем; удивляться кому/чему; оплатить что; заплатить за что. Сходство значений глаголов не означает одинакового управления."},{"t":"p","s":"Предлоги благодаря, согласно, вопреки требуют дательного: благодаря поддержке, согласно расписанию, вопреки ожиданиям. Предлоги ввиду, вследствие, в течение — родительного в своих соответствующих значениях. По в значении «после» требует предложного: по окончании, по прибытии, по завершении."},{"t":"p","s":"Если два однородных сказуемых требуют разных падежей, нельзя оставлять одно общее дополнение в форме, подходящей лишь к одному: «любить и восхищаться музыкой» → «любить музыку и восхищаться ею». Однородные члены должны быть логически сопоставимы и синтаксически совместимы."},{"t":"p","s":"Парные союзы сохраняют модель и располагаются перед сопоставимыми элементами: не только … но и; как … так и; не столько … сколько. «Он не только изучал теорию, но и решал задачи» — однородные сказуемые. «Он изучал не только теорию, но и практику» — однородные дополнения. Смешение мест частей союза может разрушить параллелизм."},{"t":"p","s":"В названии с родовым словом несогласованное приложение обычно сохраняет именительный падеж: «в романе «Капитанская дочка»». Без родового слова название склоняется: «в «Капитанской дочке»». Ошибка «в романе «Капитанской дочке»» возникает из-за двойного изменения конструкции."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Согласно нового плана мы изучаем и интересуемся историей города».","Исправление: «Согласно новому плану мы изучаем историю города и интересуемся ею».","Здесь две независимые зоны: падеж после предлога и общее дополнение при разных управлениях."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Искать только одну ошибку в длинной конструкции","Считать любой перечень логически однородным","Менять форму собственного названия после родового слова","Смешивать пары «не только … а также» без проверки нормативной конструкции"]}]}]},{"id":"RU027","title":"Сложное предложение, косвенная речь и видо-временная соотнесённость","mod":"M03","tasks":[8,19,20,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Придаточная часть должна относиться к ясному слову или ко всей главной части. Неправильно выбранное место придаточного с «который» создаёт двусмысленность: «Я прочитал статью в журнале, которая меня заинтересовала». Исправление: «В журнале я прочитал статью, которая меня заинтересовала»."},{"t":"p","s":"Не следует смешивать две синтаксические модели: «Автор показывает о том, что…» образовано из «показывает, что…» и «рассказывает о том, что…». Лишний союз или указательное слово также может нарушить конструкцию: «Когда наступил вечер, и мы вернулись домой» требует удаления и при обычной модели придаточного времени."},{"t":"p","s":"Косвенная речь передаёт содержание чужого высказывания в структуре авторского предложения. Местоимения, формы лица и обстоятельства меняются по новой ситуации: прямая речь «Я приду завтра», произнесённая Антоном, превращается в «Антон сказал, что придёт на следующий день», если рассказ ведётся позже. При вопросе используется ли или вопросительное союзное слово: «Он спросил, готов ли я»."},{"t":"p","s":"Вид и время глаголов должны отражать реальную последовательность и способ изображения. «Вчера он пришёл домой и начинает читать» может быть неоправданным скачком. Но историческое настоящее в художественном повествовании бывает осознанным приёмом. Ошибку устанавливают по контексту, а не по одному факту соседства разных времён."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Учитель спросил, что готовы ли мы к обсуждению» смешивает союз что и вопросительную модель с ли.","Правильно: «Учитель спросил, готовы ли мы к обсуждению».","«Учитель сказал, что мы готовы» — уже сообщение, а не вопрос."]}]},{"h":"Алгоритм задания 8","items":[{"t":"st","items":["Прочитайте названия ошибок.","Для каждого предложения сначала проверьте основу и управление, затем обороты, однородность, придаточные и чужую речь.","Установите конкретное нарушение и только после этого сопоставьте его категории.","Проверяйте соответствие по всем пяти позициям, а не по ощущению «так не говорят»."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Считать любую смену времени нарушением","Переносить «я» из прямой речи без смены точки отсчёта","Объединять что и ли","Выбирать категорию раньше, чем найдено место ошибки"]}]}]},{"id":"RU028","title":"Проверяемые, непроверяемые гласные и согласные в корне","mod":"M04","tasks":[9,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Безударную проверяемую гласную устанавливают по форме того же слова или однокоренному слову с ударением на нужном месте: лесной — лес, примирение — мир. Проверочное слово должно сохранять тот же корень и нужное значение. «Посвятить стихотворение» связано со «святостью», а «посветить фонарём» — со «светом». Внешнее сходство не заменяет смысловой связи."},{"t":"p","s":"Непроверяемые гласные запоминают и проверяют по орфографическому словарю: винегрет, привилегия, интеллигентный. У некоторых заимствованных и исторически связанных слов написание не объясняется простой современной проверкой. Если надёжного проверочного слова нет, нельзя изобретать его ради правила."},{"t":"p","s":"Чередующаяся гласная подчиняется специальному условию: суффиксу, ударению, следующей согласной или значению. Проверка ударением не заменяет это условие. Например, «касаться» и «коснуться» различаются наличием суффикса -а- после корня. Слово «косой» не проверочное для «касаться»."},{"t":"p","s":"Парную согласную проверяют позицией, в которой её качество слышно: просьба — просить, резкий — резок, лодка — лодочка. Непроизносимую согласную — формой или однокоренным словом с ясно слышным звуком: местный — место, сердце — сердечный. В словах «чудесный», «опасный», «вкусный» дополнительной согласной нет: нельзя вставлять т по аналогии с «местный»."},{"t":"p","s":"Удвоенные согласные могут возникать на стыке морфем или принадлежать корню заимствованного слова. «Рассказ» содержит раз- и корень с начальным с в соответствующей приставочной модели; «коллекция» требует словарного запоминания. Удвоение и непроизносимость — разные орфограммы."}]},{"h":"Алгоритм задания 9","items":[{"t":"st","items":["Определите значение слова и границы корня.","Установите тип орфограммы.","Вставьте букву и дайте основание.","Проверьте все слова строки: даже одна неподходящая буква исключает строку, если требуется общая буква.","Не выбирайте строку после проверки первого слова."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Проверять чередование ударением","Проверять «умалять достоинства» словом «молится»","Добавлять несуществующую согласную","Не читать слова в скобках, уточняющие значение"]}]}]},{"id":"RU029","title":"Чередующиеся корни: система условий и исключения","mod":"M04","tasks":[9,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"У чередования сначала определяют группу, затем применяют её условие. Одно правило «есть -а- — пиши и» подходит только к определённым корням и не объясняет весь раздел."}]},{"h":"Зависимость от суффикса","items":[{"t":"p","s":"В бер/бир, дер/дир, мер/мир, пер/пир, тер/тир, блест/блист, жег/жиг, стел/стил, чет/чит перед суффиксом -а- обычно пишется и: собирать — соберу, вытирать — вытереть, застилать — застелить. Исключения: сочетать, сочетание и родственные. В кас/кос перед -а- пишется а: касаться — коснуться. В сочетаниях а(я)/им, а(я)/ин ориентируются на словообразовательную пару: сжать — сжимать, начать — начинать."}]},{"h":"Зависимость от согласной","items":[{"t":"p","s":"Лаг/лож: а перед г, о перед ж — предлагать, предложить; полог — отдельное исключение. Раст/ращ/рос: а перед ст и щ, о перед с — растение, выращенный, вырос. Исключения: росток, ростовщик, Ростов, Ростислав, отрасль и соответствующие производные. Скак/скоч: а перед к и о перед ч — скакать, выскочить; скачок, скачу — исключения. При сомнении устанавливайте конкретный глагол: нельзя смешивать форму «скачу» от «скакать» и образования от «скочить»."}]},{"h":"Зависимость от ударения","items":[{"t":"p","s":"Гар/гор: без ударения о — загореть; под ударением обычно а — загар; выгарки, изгарь, пригарь — исключения. Зар/зор: без ударения а — заря, озарение; под ударением пишется слышимая гласная — зарево, зори. Клан/клон, твар/твор: без ударения о — поклониться, творение; под ударением — по звучанию; «утварь» запоминается отдельно. Плав/плов: обычно а — плавать, поплавок; пловец, пловчиха — о; плывун — ы, отдельное словарное слово."}]},{"h":"Зависимость от значения","items":[{"t":"p","s":"Мак — погружение в жидкость: макать кисть. Мок — намокание, пропускание или впитывание жидкости: промокнуть, непромокаемый, промокательная бумага. Равн — равенство: сравнить числа, уравнение; ровн — гладкость, прямизна: выровнять поверхность. Исключения и закреплённые написания: равнина, ровесник, поровну, уровень; «равняться» и «ровняться» различают по значению. В ряде слов возможны смысловые оттенки: выбирайте написание в контексте, а не по одному приблизительному синониму."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Выр..внять площадку» — сделать ровной, пишем о.","«Ур..внять права» — сделать равными, пишем а.","«Ср..внить два ответа» — сопоставить, корень равн.","Нельзя использовать одну из этих форм как универсальное проверочное слово для остальных."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Не различать корни-омонимы: «примерять одежду» связано с мерой, а «замирать» — с чередованием","Забывать исключения","Объявлять любое похожее сочетание букв чередованием"]}]}]},{"id":"RU030","title":"Приставки: неизменяемые, з/с, пре/при","mod":"M04","tasks":[10,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Неизменяемые приставки сохраняют написание независимо от оглушения и озвончения: под-, над-, от-, об-, с- и другие. В «сделать», «сбить» пишется с: отдельной приставки з- в этой модели нет. В «здесь», «здание», «здоровье» з принадлежит корню."},{"t":"p","s":"Приставки на з/с выбирают по следующему согласному: перед звонким — з, перед глухим — с: безвкусный, бесшумный; разбудить, расписать; воззвать, восход. Сонорные л, м, н, р, й относятся к звонким. Вариант с обычно слышен в начале группы, но основание — правило, а не приблизительное произношение."},{"t":"p","s":"Пре- часто обозначает высокую степень признака или действия: премудрый; либо значение, близкое к пере-: преградить, преобразовать. При- часто обозначает приближение, присоединение, близость, неполноту действия: приехать, приклеить, пришкольный, приоткрыть. Однако эти подсказки не исчерпывают словарь. Значение современного слова может быть непрозрачным: привилегия, президент, претендент проверяются по словарю, а не по искусственному объяснению приставки."}]},{"h":"Смысловые пары","items":[{"t":"tb","head":["Как пишется","Что значит"],"rows":[["Пребывать в городе","находиться"],["прибывать в город","приезжать"],["Претворить замысел","осуществить"],["притворить дверь","слегка закрыть"],["Предать друга","изменить ему"],["придать форму","сообщить свойство"],["Преходящий успех","временный"],["приходящий сотрудник","тот, кто приходит"],["Преступить закон","нарушить"],["приступить к делу","начать"],["Преемник","продолжает дело"],["приёмник","принимает сигнал"]]}]},{"h":"Разбор","items":[{"t":"ex","items":["«Пр..ступить к проверке» — начать, пишем и.","«Пр..ступить запрет» — нарушить, пишем е.","Общий звук в начале слова не помогает: решение определяется значением."]}]},{"h":"Алгоритм","items":[{"t":"st","items":["Убедитесь, что выделена приставка.","Для неизменяемой восстановите словарную форму; для з/с определите следующий звук; для пре/при раскройте значение.","Если значение не укладывается в продуктивную модель, проверьте слово в словаре."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["«зделать» по произношению","Считать любую последовательность пре/при приставкой с прозрачным значением","Путать слово «преувеличить» с «приуменьшить» по механической симметрии"]}]}]},{"id":"RU031","title":"Ы/И после приставок, разделительные Ъ/Ь и мягкий знак","mod":"M04","tasks":[10,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"После русской приставки на согласный начальное и корня обычно переходит в ы: играть — сыграть, искать — разыскать, итог — подытожить. После меж- и сверх- сохраняется и: межинститутский, сверхинтересный. После иноязычных приставок и первых компонентов соответствующего типа также обычно и: дезинформация, постиндустриальный, контригра. «Взимать» — словарное исключение. После приставки на гласную и сохраняется: поиграть."},{"t":"p","s":"Разделительный ъ пишется перед е, ё, ю, я после приставки на согласный: подъезд, объявление, съёмка, предъюбилейный. Он встречается и после некоторых числительных первых частей: двухъярусный, трёхъязычный. Заимствованные слова типа «объект», «субъект» проверяют по словарю и соответствующей модели."},{"t":"p","s":"Разделительный ь употребляется внутри слова перед е, ё, ю, я, и: вьюга, семья, соловьи. В отдельных заимствованиях он стоит перед о: бульон, павильон. Правило «перед я всегда ъ» неверно: важна позиция относительно морфем."},{"t":"p","s":"Мягкий знак может обозначать мягкость или грамматическую форму. После шипящих он пишется у существительных женского рода третьего склонения: ночь, рожь; не пишется у мужского рода и в родительном множественного первого склонения: плащ, задач, рощ. У кратких прилагательных мужского рода ь нет: хорош, могуч."},{"t":"tb","head":null,"rows":[["В глаголе мягкий знак сохраняется в инфинитиве и формах второго лица единственного числа, повелительных формах соответствующего типа: беречь, пишешь, спрячь, спрячьте. -Ться/-тся различают вопросом и грамматикой: «может учиться»","что делать?"],["«он учится»","что делает? У наречий после шипящих обычно ь: настежь, прочь, вскачь"],["уж, замуж, невтерпёж","исключения"]]}]},{"h":"Разбор","items":[{"t":"ex","items":["«Под..ём» → «подъём»: приставка под- оканчивается согласной, далее ё.","«В..юга» → «вьюга»: разделение внутри слова, а не после приставки.","«С..грать» → «сыграть»: приставка с- + играть."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Проверять ь только по мягкости: в «пишешь» он является грамматическим знаком","Ставить ъ перед и после любой приставки","Переносить правило ы на сверх-/меж-"]}]}]},{"id":"RU032","title":"Суффиксы существительных","mod":"M04","tasks":[11,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Для -ек-/-ик- измените слово: если гласная выпадает, пишется е; сохраняется — и. «Замочек — замочка», но «ключик — ключика». Проверка относится к гласной суффикса, а не к любой букве е/и в конце слова."},{"t":"p","s":"В -чик-/-щик- после д, т, з, с, ж обычно пишется -чик-: переводчик, лётчик, рассказчик, переписчик, перебежчик. После других согласных — -щик-: каменщик, сварщик. Мягкий знак перед -щик- обычно появляется после л: стекольщик. Отдельные заимствованные основы и закреплённые образования требуют словарной проверки."},{"t":"p","s":"Суффикс -иц- характерен для ряда существительных женского рода: владелица; -ец- — мужского: владелец. В существительных среднего рода выбор -ец-/-иц- связан с ударением и моделью: письмецо́, креслице. Здесь нельзя использовать только правило рода без положения ударения."},{"t":"p","s":"Сочетания -инк- и -енк- различают по производящему слову: горошина → горошинка, соломина → соломинка; вишня → вишенка, башня → башенка. Если в основе исходного слова уже есть -ин-, оно сохраняется. Названия лиц, уменьшительные и ласкательные образования имеют множество словарных особенностей."},{"t":"p","s":"После шипящих под ударением в некоторых именных суффиксах пишется о: зайчонок, медвежонок, пирожок. Однако «девчонка» и «тушёнка» относятся к разным моделям: происхождение от глагола и сохранение причастной части влияют на написание. Поэтому правило «после шипящей под ударением всегда о» недопустимо."}]},{"h":"Алгоритм","items":[{"t":"st","items":["Определите часть речи, производящее слово и границу суффикса.","Примените конкретное условие: выпадение гласной, предыдущую согласную, род, ударение или исходную основу.","Для заимствований и редких суффиксов используйте словарь."]}]},{"h":"Разбор","items":[{"t":"ex","items":["«Ореш..к»: орешка — гласная выпала, значит орешек.","«Карандаш..к»: карандашика — гласная сохраняется, значит карандашик.","Нельзя проверять эти слова родом: оба мужского рода, а выбор разный."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Смешивать -ек- с конечным сочетанием -ик- в корне","Не изменять слово","Определять суффикс по последним трём буквам без производящей основы"]}]}]},{"id":"RU033","title":"Суффиксы прилагательных","mod":"M04","tasks":[11,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"В -ив-/-ев- под ударением обычно пишется и, без ударения — е: красивый, ключевой. Исключения: милостивый, юродивый. Необходимо убедиться, что перед нами именно эти суффиксы. В -лив- и -чив- всегда и: заботливый, доверчивый; ударение здесь не меняет выбор."},{"t":"p","s":"Суффикс -к- пишется в качественных прилагательных, имеющих соответствующую краткую форму, и в ряде образований от основ на к, ч, ц с чередованием: резкий — резок, немец — немецкий, ткач — ткацкий. Суффикс -ск- используется в других продуктивных моделях: городской, январский. Исключения, собственные имена и нетипичные основы проверяются словарно; правило нельзя свести к наличию буквы к в готовом слове."},{"t":"p","s":"Суффиксы -оньк-/-еньк- обычно различаются по предшествующей согласной и словарной модели: беленький, тихонький. Вариантность отдельных ласкательных образований не следует превращать в искусственную экзаменационную ошибку."},{"t":"p","s":"В суффиксах -оват-/-еват-, -овит-/-евит-, -ов-/-ев- учитывают предшествующий согласный и ударение в конкретной модели: грубоватый, синеватый, деловитый, глянцевый. Для -ов-/-ев- после шипящих и ц действует различие ударной о и безударной е: камышовый, грушевый, свинцовый, ситцевый. Сначала выделяют суффикс: корневая гласная подчиняется другому правилу."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Заботл..вый» → заботливый: выделяем -лив-, а не -ив-; он пишется с и независимо от ударения.","«Груш..вый» → грушевый: безударный суффикс -ев- после шипящей.","«Крас..вый» → красивый: ударный -ив-."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Писать -лев- в слове с -лив-","Распространять исключения -ив- на все прилагательные","Проверять суффикс родственным словом вместо соответствующего условия","Смешивать суффикс и окончание"]}]}]},{"id":"RU034","title":"Суффиксы глаголов и наречий","mod":"M04","tasks":[11,12,14,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Суффиксы -ова-/-ева- и -ыва-/-ива- проверяют формой первого лица единственного числа настоящего или простого будущего времени. Если получается -ую/-юю, пишется -ова-/-ева-: советую — советовать, ночую — ночевать. Если сохраняется -ываю/-иваю, пишется -ыва-/-ива-: рассказываю — рассказывать, настаиваю — настаивать. Глагол при проверке должен оставаться тем же по виду и значению."},{"t":"p","s":"Перед ударным суффиксом -ва- обычно сохраняется гласная соответствующего инфинитива без -ва-: запить — запивать, успеть — успевать. Есть закреплённые словарные случаи и омонимичные модели: продлевать, затмевать и некоторые другие требуют отдельного запоминания. Нельзя применять проверку «-ую» к любому сочетанию букв ова/ева без морфемного анализа."},{"t":"p","s":"Перед -л- прошедшего времени сохраняется гласная инфинитива перед -ть: слышать — слышал, видеть — видел. В глаголах на -чь и других особых моделях образование устроено иначе: беречь — берёг. Для страдательных причастий используются отдельные условия, поэтому «строить — строил» не позволяет написать «строиный»."},{"t":"p","s":"Глаголы на -еть обычно обозначают приобретение признака самим субъектом: обессилеть от усталости. Глаголы на -ить могут обозначать воздействие на объект: обессилить противника. Это смысловая модель для соответствующих пар, а не универсальная характеристика всех глаголов на -еть/-ить."},{"t":"p","s":"В наречиях, образованных приставочно-суффиксальным способом от прилагательных, после из-/до-/с- часто пишется -а: издавна, досуха, справа; после в-/на-/за- — -о: влево, начисто, заново. Если приставка уже была в исходном прилагательном, механическая схема может не работать: досрочный → досрочно. Установите способ образования."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Наста..вать на ответе» → настаиваю → настаивать.","«Ноч..вать» → ночую → ночевать.","Подбор «настою» вместо «настаиваю» меняет вид и приводит к неправильной проверке."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Не сохранять вид проверяемого глагола","Смешивать суффикс инфинитива с личным окончанием","Писать окончание у неизменяемого наречия","Не различать обессилеть и обессилить"]}]}]},{"id":"RU035","title":"Личные окончания глаголов: задание 12","mod":"M05","tasks":[12,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Сначала определите, является ли пропуск частью личного окончания. В «строишь» это окончание -ишь; в «строить» — инфинитив; в «строил» и перед -л- — суффиксальная гласная. Разные позиции нельзя проверять одним способом."},{"t":"p","s":"Первое спряжение в безударных окончаниях имеет -ешь, -ет, -ем, -ете, -ут/-ют; второе — -ишь, -ит, -им, -ите, -ат/-ят. В первом лице единственного числа -у/-ю встречается у обоих спряжений, поэтому форма «я…» сама по себе их не различает."},{"t":"p","s":"Если личное окончание ударное, спряжение видно из него: летишь, летят — второе, хотя инфинитив «лететь». Если окончание безударное, устанавливают точный инфинитив. Ко второму относятся глаголы на -ить, кроме брить и стелить, а также гнать, держать, дышать, слышать, видеть, обидеть, ненавидеть, зависеть, терпеть, вертеть, смотреть. Производные обычно сохраняют соответствующее спряжение. Редкие образования, включая модели зиждиться и зыбиться, следует проверять отдельно по словарю, а не добавлять без объяснения к распространённой школьной памятке."},{"t":"p","s":"Разноспрягаемые: хотеть — хочешь, хочет, но хотим, хотите, хотят; бежать — бежишь, бежит, бежим, бежите, но бегут. Есть — ем, ешь, ест, едим, едите, едят; дать — дам, дашь, даст, дадим, дадите, дадут: особые парадигмы. Приставочные формы соотносят с исходным глаголом."}]},{"h":"Алгоритм","items":[{"t":"st","items":["Определите лицо и число, затем ударность окончания.","При безударности восстановите инфинитив без изменения вида: «выберешь» — выбрать, а не выбирать.","Проверьте исключение и запишите окончание нужного спряжения.","При приставке вы-, перетягивающей ударение, полезно восстановить форму без неё: вылетишь — летишь."]}]},{"h":"Разбор","items":[{"t":"ex","items":["«Они стро..т» → строить, второе спряжение, строят.","«Он бор..тся» → бороться, первое, борется.","«Они стел..т» → стелить, исключение первого спряжения, стелют."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Определять спряжение ударной формы только по инфинитиву","Выбирать видовую пару вместо нужного инфинитива","Забывать исключения","Путать «вы пишете» и повелительное «пишите!»"]}]}]},{"id":"RU036","title":"Суффиксы причастий и деепричастий","mod":"M05","tasks":[12,15,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Действительные причастия настоящего времени соотносятся с третьим лицом множественного: читают → читающий, борются → борющийся; строят → строящий, слышат → слышащий. Для первого спряжения типичны -ущ-/-ющ-, для второго — -ащ-/-ящ-. Не нужно угадывать букву по благозвучию: сначала восстановите личную форму."},{"t":"p","s":"Страдательные причастия настоящего времени обычно имеют -ем- при первом спряжении и -им- при втором: читаемый, решаемый; видимый, хранимый. Суффикс -ом- встречается в ограниченных образованиях: ведомый. Не каждый переходный глагол образует общеупотребительное причастие настоящего времени, поэтому механический генератор форм даёт ошибки."},{"t":"p","s":"Действительные причастия прошедшего времени: -вш- после гласной, -ш- после согласной в соответствующей основе: прочитавший, нёсший. Перед -вш- сохраняется гласная основы: увидевший от увидеть, услышавший от услышать, построивший от построить."},{"t":"p","s":"В страдательных причастиях прошедшего времени от глаголов на -ать/-ять обычно сохраняется а/я перед -нн-: прочитать — прочитанный, посеять — посеянный. Во многих образованиях от -ить и иных основ используется -енн-/-ённ- с возможным чередованием: построить — построенный, решить — решённый, обидеть — обиженный. Отдельно существуют формы с -т-: закрытый, взятый, вымытый. Правило по одному последнему слогу инфинитива не покрывает все образования."},{"t":"p","s":"Деепричастия несовершенного вида обычно образуются с -а/-я: читая, слыша. Совершенного — с -в, -вши, -ши: прочитав, умывшись, принёсши; выбор и употребительность конкретной формы требуют нормы. У «будучи» особое образование. Формы типа «ехая» нельзя создавать автоматически."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Кле..щий» → клеить → клеят → клеящий.","«Посе..нный» → посеять → посеянный.","«Обид..вшийся» → обидеться → обидевшийся.","В трёх случаях пропуски проверяются разными промежуточными формами."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["«клеющий» из-за привычного звучания","Проверять прошедшее причастие спряжением","Переносить и инфинитива в «построенный»","Не различать действительное и страдательное причастие"]}]}]},{"id":"RU037","title":"НЕ с разными частями речи","mod":"M05","tasks":[13,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Первый шаг — определить часть речи и форму. Если слово без не в современном языке обычно не употребляется, написание слитное: ненавидеть, небрежный, невежда. Отдельные исторические формы не отменяют этого учебного условия."},{"t":"p","s":"С глаголами и деепричастиями не обычно раздельно: не знал, не прочитав. Различайте приставку недо- со значением недостаточности и не + до- со значением незавершённости: недоедать — получать недостаточно пищи; не доесть суп — оставить часть. «Недосмотреть за ребёнком» — недостаточно проследить; «не досмотреть фильм» — не закончить просмотр."},{"t":"p","s":"С существительными, качественными прилагательными и наречиями на -о/-е слитное написание передаёт утверждение нового признака: небольшой дом, негромко говорил, неправда. Подстановка синонима помогает понять значение, но не отменяет условий раздельности. Противопоставление с а требует раздельного: не высокий, а низкий. Усиленное отрицание: вовсе не готовый в значении «отнюдь не», далеко не простой, ничуть не интересный."},{"t":"p","s":"Союз но не равен а: «небольшой, но удобный дом» одновременно обладает двумя признаками. Слова совсем и вовсе могут усиливать как отрицание, так и утверждение признака в разных контекстах; их наличие не даёт автоматического ответа. С относительными и притяжательными прилагательными при отрицании признака обычно раздельно: не деревянный, не мамин."},{"t":"p","s":"С полными причастиями не пишется слитно при отсутствии условий раздельности: непрочитанная книга. Раздельно при зависимых словах, поддерживающих глагольное значение, или противопоставлении: не прочитанная мной книга; не прочитанная, а просмотренная. Слова меры и степени сами по себе обычно не требуют раздельности: совершенно непродуманное решение. Если слово стало прилагательным, наличие зависимого слова нельзя использовать механически."},{"t":"p","s":"С краткими причастиями раздельно: работа не выполнена. С краткими прилагательными действуют смысл и словарная норма: задача несложна; он не готов, не рад, не должен. С числительными, большинством местоимений и предикативных отрицаний — раздельно: не два, не я, не здесь. Отрицательные и неопределённые местоимения имеют отдельную модель: некого, не с кем."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Работа (не)проверена» — краткое причастие, не проверена.","«(Не)проверенная работа лежит на столе» — непроверенная.","«(Не)проверенная учителем работа» — не проверенная учителем.","Сравните условия, а не только общее значение отрицания."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["«есть любой зависимый элемент — всегда раздельно»","«можно подобрать синоним — всегда слитно»","Не различать причастие и прилагательное","Считать не и недо- одним случаем"]}]}]},{"id":"RU038","title":"НЕ и НИ: значение, ударение и устойчивые конструкции","mod":"M05","tasks":[13,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Не обычно отрицает действие или признак: не пришёл. Ни часто усиливает отрицание: не сказал ни слова; ни один не ответил. Само отрицательное сказуемое может быть подразумеваемым: «На улице ни души» — подразумевается «нет». Повторяющееся ни … ни связывает однородные элементы под общим отрицанием."},{"t":"p","s":"В отрицательных местоимениях и наречиях под ударением пишется не, без ударения — ни: не́кого — никого́, не́где — нигде́. Предлог разделяет местоименную конструкцию: не у кого, ни с кем. В наречиях предлог внутрь не вставляют: негде, никуда."},{"t":"p","s":"В уступительных придаточных с кто, что, как, где, куда и т. п. употребляется ни: «Куда ни посмотрю, всюду лес». Значение — при любом направлении взгляда. В самостоятельном вопросе или восклицании возможно не: «Кто не мечтал о путешествии!» — многие мечтали. Сначала определяют конструкцию, затем букву."},{"t":"p","s":"«Не раз» означает многократно; «ни разу» — ни одного раза при отрицании: «Я не раз проверял расчёт», «Я ни разу не ошибся». «Не один» — несколько или много; «ни один» усиливает отрицание: «Не один ученик решил задачу», «Ни один ученик не ушёл»."},{"t":"p","s":"Различайте: «Это не кто иной, как учитель» — утверждение тождества с не и конструкцией как. «Никто иной не смог помочь» — отрицательное местоимение с ни. Аналогично: не что иное, как; ничто иное не. Двойное не может давать утверждение: «не мог не заметить» — обязательно заметил."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Как бы он ни старался, работа не получалась».","В придаточной части уступка: при любом старании; поэтому ни.","В главной обычное отрицание: не получалась.","Написание не определяется тем, сколько отрицательных слов уже есть в предложении."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Считать ни самостоятельным обычным отрицанием во всех случаях","Путать не раз и ни разу","Выбирать букву по ударению в частице, когда требуется анализ уступительной конструкции"]}]}]},{"id":"RU039","title":"Союзы и производные предлоги: слитно или раздельно","mod":"M05","tasks":[14,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Одинаковое звучание может скрывать разные части речи. Проверка должна объяснять и значение, и грамматику. Союз «чтобы» обычно пишется слитно; местоимение что с частицей бы — раздельно: «Что бы мне прочитать?» Частицу можно переставить: «Что мне бы прочитать?» Эта проверка полезна, но смысл и синтаксис важнее механической перестановки."},{"t":"p","s":"Тоже и также как соединительные союзы близки к и: «Я тоже пришёл», «Он также участвовал». В «то же задание» же относится к местоимению, а в «так же, как раньше» — к наречию так. Возможность убрать же без разрушения основного смысла помогает, но не является единственным критерием."},{"t":"p","s":"Зато — противительный союз, близкий к но: «Было трудно, зато интересно». За то — предлог с местоимением: «Спасибо за то письмо». Итак вводит итог: «Итак, начнём»; и так соединяет союз и наречие: «Он и так всё знает». Причём/притом — союзы в значении присоединения; при чём/при том — сочетания с местоимением в самостоятельной синтаксической роли."},{"t":"p","s":"В течение, в продолжение, в заключение в соответствующих предложных употреблениях пишутся раздельно с е: в течение часа, в продолжение разговора, в заключение выступления. Существительное сохраняет своё значение и падеж: в течении реки, в продолжении романа, в заключении эксперта."},{"t":"p","s":"Вследствие = из-за, слитно: вследствие дождя; в следствии по делу — предлог с существительным. Насчёт = о: поговорить насчёт поездки; на счёт банка — направить на банковский счёт. Ввиду = из-за: ввиду задержки; иметь в виду — устойчивое раздельное сочетание. Навстречу = по направлению к: идти навстречу другу; на встречу с другом — существительное."},{"t":"p","s":"Несмотря на/невзирая на как предлоги уступки пишутся слитно с не: несмотря на холод. Деепричастие сохраняет буквальное действие зрения: шёл, не смотря под ноги. Производный предлог не равен деепричастию только по внешней форме."}]},{"h":"Алгоритм","items":[{"t":"st","items":["Определите связь с соседним словом и синтаксическую роль.","Замените подходящим союзом/предлогом без изменения смысла.","Если перед вами имя, проверьте вопрос, падеж и возможность зависимого определения.","Не используйте одну подстановку как абсолютный тест."]}]}]},{"id":"RU040","title":"Наречия, сложные слова, ПОЛ- и дефис","mod":"M05","tasks":[14,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Через дефис пишутся наречия с по- и суффиксами -ому/-ему, -и в соответствующих моделях: по-новому, по-прежнему, по-русски, по-волчьи. Но «по новому мосту» — предлог с прилагательным и существительным, поэтому раздельно. «Поэтому» не относится к данной дефисной модели."},{"t":"p","s":"Во-первых, в-третьих — наречные образования от порядковых числительных. Где-то, кое-как, когда-нибудь — дефис с -то/-либо/-нибудь и кое-. Если внутри местоименного сочетания появляется предлог, написание раздельное: кое с кем. Повтор и близость основ дают едва-едва, крепко-накрепко, давным-давно. Не все внешне повторяющиеся сочетания дефисные: бок о бок, с глазу на глаз пишутся раздельно."},{"t":"p","s":"Наречия и именные сочетания различаются по значению: «вначале было трудно» — наречие времени; «в начале урока» — существительное с зависимым словом. «Посмотреть вдаль» — направление; «в даль моря» — имя с определяющим компонентом. Некоторые сочетания словарные: наизусть, впоследствии, вплотную; без устали, до смерти, на ходу. Одного вопроса «как?» недостаточно для слитного написания."},{"t":"p","s":"Пол- пишется через дефис перед гласной, л и прописной буквой: пол-апельсина, пол-лимона, пол-Москвы; слитно перед другими согласными: полчаса, полметра. Если между пол и существительным стоит определение, раздельно: пол чайной ложки. Полу- обычно слитно: полукруг, полумера."},{"t":"p","s":"Сложные прилагательные с равноправными основами часто дефисные: русско-английский, научно-технический; оттенки цвета — тёмно-синий. Подчинительное отношение часто даёт слитное написание: железнодорожный — железная дорога. Но это не безусловный тест «можно вставить и»: терминологическая традиция и современные словарные нормы требуют проверки. Слова с первыми компонентами медиа-, видео-, мини-, экс- нельзя все подчинить одному шаблону без словаря."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Работать (по)новому» → по-новому.","«Идти (по)новому маршруту» → по новому маршруту.","В первом случае наречие, во втором — согласуемое прилагательное с существительным."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Считать любое обстоятельство наречием","Писать все слова с пол- через дефис","Переносить старую норму сложных заимствований без проверки","Забывать раздельное «кое с кем»"]}]}]},{"id":"RU041","title":"Н и НН в отымённых прилагательных и производных","mod":"M05","tasks":[15,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Сначала установите, от существительного или глагола образовано слово. Отыменные прилагательные с -ан-/-ян-/-ин- обычно имеют одну н: кожаный, серебряный, гусиный. Исключения: стеклянный, оловянный, деревянный. Прилагательные «ветреный» и производные соответствующего типа запоминаются; «безветренный» пишется с нн. «Ветряной» и «ветреный» различаются значением."},{"t":"p","s":"Суффиксы -енн-/-онн- дают нн: соломенный, традиционный. Если основа существительного оканчивается на н и добавляется суффикс -н-, тоже получается нн: туман — туманный, длина — длинный. В «юный», «румяный», «пряный» нет основания автоматически удваивать н по правилу суффикса -ян-: следует учитывать строение и закреплённое написание."},{"t":"p","s":"Краткие прилагательные обычно сохраняют столько н, сколько в полной форме, когда форма позволяет их показать: дорога длинна, объяснение туманно, выводы ценны. В краткой форме мужского рода «длинен» удвоение не проявляется так же, как в женском: сравнивать нужно конкретные формы."},{"t":"p","s":"Наречие на -о/-е обычно сохраняет н/нн производящего прилагательного: туманный — туманно, ветреный — ветрено. В существительных, образованных от прилагательных, написание также связано с производящей основой: современный — современник. Однако формальная подстановка случайного прилагательного без проверки образования недопустима."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Серебря..ый» → серебро + -ян-, серебряный.","«Тума..ый» → туман + -н-, туманный.","«Деревя..ый» → деревянный, исключение.","Нельзя отвечать «две н, потому что прилагательное длинное» или «есть приставка»: приставочная модель относится к другому разделу."]}]},{"h":"Алгоритм","items":[{"t":"st","items":["Найдите производящее существительное.","Выделите суффикс и конечную н основы.","Проверьте исключения.","Для краткой формы, наречия или производного существительного восстановите полное исходное прилагательное."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Смешивать отымённые и отглагольные правила","Не замечать н на стыке","Считать, что в любом кратком слове одна н","Переносить «ветреный» на «безветренный»"]}]}]},{"id":"RU042","title":"Н и НН в причастиях, отглагольных прилагательных и кратких формах","mod":"M05","tasks":[15,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"В полных страдательных причастиях прошедшего времени пишется нн: прочитанный, решённый. В отглагольных прилагательных от бесприставочных глаголов несовершенного вида часто одна н: жареный, крашеный, вязаный. Определение части речи и значение действия важнее механического подсчёта признаков."},{"t":"p","s":"Школьные ориентиры для нн: совершенный вид — решённый; приставка, кроме не-, при соответствующем причастном образовании — покрашенный; зависимое слово, раскрывающее действие, — жаренная на масле рыба; суффиксы -ованн-/-ёванн-/-еванн- — организованный, маринованный. Исключения и особые слова: кованый, жёваный, но подкованный, разжёванный; желанный, нежданный, негаданный, невиданный, неслыханный, священный и некоторые другие закреплённые образования."},{"t":"p","s":"Не является приставкой, автоматически вызывающей нн: некрашеный пол. В сложных прилагательных первая часть сама по себе не становится приставкой к глаголу: свежемороженая рыба; число н зависит от образования и смысла. Зависимый компонент может относиться не к глагольному действию, а к степени качества: его наличие не всегда создаёт причастие."},{"t":"p","s":"Краткие страдательные причастия пишутся с одной н: задача решена, письма отправлены, рыба пожарена. Краткие прилагательные, когда обозначают качество, обычно сохраняют нн полной формы: дети воспитанны, движения скованны. Сравните: «Дети воспитаны бабушкой» — действие; «Дети вежливы и воспитанны» — качества. У отдельных слов возможны закреплённые особенности кратких форм, которые следует проверять в словаре."},{"t":"p","s":"Наречие сохраняет написание основы: «говорил взволнованно». «Море взволновано ветром» — краткое причастие. Вопрос «как?» без анализа предложения не позволяет различить их надёжно: учитывайте, является ли слово обстоятельством, сказуемым со значением качества или страдательного действия."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Краше..ый забор» — крашеный, качественная характеристика без дополнительных условий.","«Покраше..ый забор» — покрашенный.","«Краше..ый вчера забор» — крашенный вчера.","«Забор покраше..» — покрашен.","Одинаковая основа даёт разные написания в разных конструкциях."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["«с приставкой всегда нн» без проверки части речи","«в краткой форме всегда одна н»","Считать любой зависимый наречный компонент признаком причастия","Забывать глагольный вид"]}]}]},{"id":"RU043","title":"Орфография для сочинения: окончания, О/Ё, прописные буквы и перенос","mod":"M05","tasks":[9,10,11,12,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"В падежных окончаниях существительных учитывают склонение и особую модель: к деревне, о деревне; к ночи, о ночи; в тетради. У слов на -ия в родительном, дательном и предложном единственного — и: лекции; у -ий/-ие в предложном — и: о санатории, о решении. Не смешивайте «в здании» и «в зданье»: это разные формы с различным окончанием."},{"t":"p","s":"В окончаниях прилагательных полезен вопрос от существительного, но окончание вопроса не универсально переносится во всех позициях. «О каком? — о новом», «каким? — новым». Именительный/винительный мужского рода требует собственной модели: новый, синий, молодой. Притяжательные прилагательные имеют особенности: лисий, лисьего."},{"t":"p","s":"После шипящих о/ё выбирают по морфеме и части речи. В корнях под ударением часто ё при соотношении с е: шёпот — шептать, жёлтый — желтеть. Словарные о: шорох, шов, крыжовник. В именных окончаниях и суффиксах под ударением нередко о: врачом, свечой, камышовый; без ударения е: товарищем. В глагольных формах и причастных образованиях пишется ё в соответствующих позициях: бережёт, печёт, решённый. «Ожог» — существительное; «ожёг» — глагол."},{"t":"p","s":"После ц в корне обычно и: цирк, цифра; исключения цыган, цыплёнок, цыпочки, цыц и производные. В окончаниях и суффиксе -ын- — ы: огурцы, сестрицын. Заимствованные слова проверяются словарно. Эти правила не заменяют правила ы/и после приставок."},{"t":"p","s":"Прописная буква используется в начале предложения и в собственных именах. В составных названиях не каждое слово автоматически получает прописную: проверяют вид названия и официальную форму. Названия произведений заключают в кавычки: роман «Капитанская дочка». Цитаты должны сохранять авторский смысл и быть грамматически встроены."},{"t":"p","s":"Перенос слова не равен любому делению на слоги: нельзя оставлять или переносить одну букву; ь, ъ и й не отделяют от предшествующей буквы. Сокращения и инициалы имеют отдельные ограничения. В цифровом приложении перенос интерфейса лучше поручать верстке, не вставляя дефисы в словарную форму."}]}]},{"id":"RU044","title":"Грамматическая основа и виды сказуемого","mod":"M06","tasks":[8,16,17,19,20,21,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Грамматическая основа выражает сообщение о действительности. В двусоставном предложении она включает подлежащее и сказуемое; в односоставном — один главный член. Подлежащее часто выражено существительным или местоимением в именительном, но может быть инфинитивом или сочетанием: «Учиться полезно», «Трое друзей пришли»."},{"t":"p","s":"Простое глагольное сказуемое выражает действие одной глагольной формой, в том числе составной по образованию: «буду читать» — одна форма будущего времени, поэтому это простое глагольное сказуемое. Фразеологическое сочетание также может выполнять его функцию."},{"t":"p","s":"Составное глагольное сказуемое включает вспомогательное значение начала, продолжения, окончания, возможности, желания и инфинитив одного исполнителя: начал читать, хотел ответить, должен учиться. В «попросил друга прочитать» действие инфинитива относится к другу, поэтому «попросил прочитать» не является одним составным сказуемым подлежащего."},{"t":"p","s":"Составное именное сказуемое включает связку и именную часть: был врачом, стал серьёзным, оказался прав. В настоящем времени связка часто нулевая: «Небо ясное». Именная часть может быть выражена не только прилагательным. Пропуск связки не означает отсутствие сказуемого."}]},{"h":"Односоставные предложения","items":[{"t":"p","s":"Определённо-личные: «Пишу письмо» — исполнитель я. Неопределённо-личные: «В дверь постучали» — исполнители не названы. Обобщённо-личные передают общий опыт: «Без труда не вытащишь и рыбку из пруда». Безличные: «Смеркается», «Мне холодно», «Нужно работать». Назывные: «Тихий вечер». Неполное двусоставное отличается тем, что пропущенный член восстанавливается из контекста, а не определяется типом конструкции."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Я хочу научиться решать задачи» — цепочка с общим субъектом и модальным компонентом; при синтаксическом разборе рассматривается сложное составное сказуемое, а не несколько самостоятельных основ.","«Я попросил сестру решить задачу» — грамматическая основа «я попросил»; инфинитив обозначает действие сестры."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Считать каждый инфинитив новой основой","Считать «буду читать» составным глагольным по числу слов","Не находить сказуемое без глагола","Назначать подлежащим любое существительное перед сказуемым"]}]}]},{"id":"RU045","title":"Словосочетание и осложнение простого предложения","mod":"M06","tasks":[8,16,17,18,21,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Словосочетание строится на подчинительной связи знаменательных слов. Подлежащее со сказуемым — грамматическая основа, а не обычное словосочетание. Сочетание предлога со словом и однородные члены также не относятся к подчинительным словосочетаниям в школьном разборе."},{"t":"p","s":"При согласовании зависимое слово уподобляется главному: новый дом — нового дома. При управлении главное требует падежной формы: читать книгу, гордиться другом. При примыкании зависимое неизменяемо: говорить тихо, желание учиться. Неизменяемое притяжательное «его» в «его книга» связано примыканием; личное «его» в «увидел его» участвует в управлении."},{"t":"p","s":"Второстепенные члены — определение, дополнение, обстоятельство. Их определяют по значению и связи, а не по одной части речи. Инфинитив может быть определением в «желание учиться», существительное — обстоятельством в «вернулся вечером»."},{"t":"p","s":"Простое предложение может быть осложнено однородными членами, обособленными определениями и обстоятельствами, уточнениями, обращениями, вводными и вставными конструкциями. Осложнение не создаёт автоматически новую грамматическую основу: «Уставший после дороги, он сел» — одна основа."}]},{"h":"Алгоритм пунктуационного анализа","items":[{"t":"st","items":["Сначала найдите основы.","Затем установите границы частей сложного предложения.","Внутри каждой части найдите однородность, обороты и вставные элементы.","Назовите причину каждого знака.","Лишь после этого оценивайте интонацию и возможную смысловую вариантность."]}]},{"h":"Разбор","items":[{"t":"ex","items":["«Мы, уставшие после прогулки, молча вернулись домой».","Основа одна: мы вернулись.","Определение «уставшие после прогулки» относится к личному местоимению и обособлено.","«Молча» — одиночное наречие, запятых не требует.","Длина предложения не доказывает его сложность."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["«есть две запятые — значит три части»","Считать причастный оборот придаточным","Определять управление только по наличию предлога","Обособлять обычное обстоятельство из-за паузы"]}]}]},{"id":"RU046","title":"Однородные члены: задание 16","mod":"M06","tasks":[16,21,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Однородные члены выполняют одну синтаксическую функцию, относятся к одному компоненту или соотносятся на равных основаниях и соединены сочинительной связью. Совпадение вопроса помогает, но не всегда достаточно для признания определений однородными."},{"t":"p","s":"Без союзов ставятся запятые: «Мы взяли бумагу, карандаши, линейку». Перед одиночными и, или, либо между однородными членами запятой обычно нет: «бумагу и карандаши». Перед а, но, зато, да в значении но запятая ставится. Повторяющиеся союзы обычно разделяют элементы: «и бумагу, и карандаши, и линейку»; «бумагу, и карандаши, и линейку» — при едином ряде."},{"t":"p","s":"При парном объединении запятые стоят между парами: «книги и тетради, ручки и карандаши». В устойчивых сочетаниях типа «ни свет ни заря», «и смех и грех» запятая не ставится. Их нельзя переносить на свободные перечисления."},{"t":"p","s":"В двойных союзах знак ставится перед второй частью: «как теорию, так и практику»; «не только читал, но и конспектировал». Важно определить, какие именно члены соединены: соседние и могут относиться к разным рядам."},{"t":"p","s":"Однородные определения описывают признаки с общей точки зрения: «красные, жёлтые, оранжевые листья». Неоднородные характеризуют предмет с разных сторон и образуют ступенчатое сочетание: «новый деревянный стол». Контекст может сделать признаки однородными, поэтому пунктуация зависит от смысла, а не только от порядка слов."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Я купил тетради и ручки и быстро вернулся домой».","Первое и соединяет дополнения, второе — сказуемые «купил» и «вернулся».","Это не повторяющийся союз одного ряда, запятых нет."]}]},{"h":"Алгоритм задания 16","items":[{"t":"st","items":["Рассматривайте каждое предложение отдельно.","Найдите основы, затем все ряды однородных членов.","Нарисуйте их группировку.","Посчитайте именно требуемые знаки: если условие требует одну запятую, предложение с двумя не подходит, даже если обе необходимы."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Считать любые два и повторяющимися","Путать однородные сказуемые с частями сложного предложения","Ставить запятую между любыми прилагательными","Угадывать число правильных строк"]}]}]},{"id":"RU047","title":"Сложносочинённое предложение и общий элемент","mod":"M06","tasks":[16,19,20,21,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"В сложносочинённом предложении части имеют грамматические основы и соединены сочинительным союзом: «Солнце скрылось, и воздух похолодел». Запятая обычно разделяет части; наличие и само по себе не отменяет знак."},{"t":"p","s":"Перед одиночным и, или, либо запятая может отсутствовать, если части имеют общий второстепенный член, общее придаточное или другой предусмотренный правилом общий элемент. «К вечеру ветер стих и небо прояснилось»: обстоятельство относится к обеим основам. Оно должно действительно быть общим по смыслу. Начальное обстоятельство, относящееся только к одной части, не снимает запятую."},{"t":"p","s":"«Когда стемнело, фонари зажглись и улица опустела» — придаточная часть общая для двух сочинённых частей. Но союзы а, но и повторяющиеся союзы имеют другие условия: правило о снятии запятой перед одиночным и нельзя переносить на них автоматически."},{"t":"p","s":"Запятая также обычно не нужна между объединёнными общей интонацией вопросительными частями: «Когда начнётся урок и кто его проведёт?» Аналогичные условия существуют для некоторых побудительных, восклицательных и односоставных конструкций. Для спорного примера необходимо анализировать целое высказывание, а не только знак в конце."}]},{"h":"Разбор","items":[{"t":"ex","items":["«На площади зажглись фонари и заиграла музыка» — обе ситуации отнесены к площади, возможна конструкция без запятой.","«На площади зажглись фонари, и мы направились к дому» — второе действие не локализовано тем же обстоятельством автоматически; основания отменять знак нет."]}]},{"h":"Алгоритм","items":[{"t":"st","items":["Найдите две основы.","Установите союз.","Проверьте, не выражено ли общее обстоятельство, придаточное или общая вопросительная интонация.","Объясните, относится ли общий компонент к обеим частям.","Если доказать общность нельзя, не снимайте знак по наличию начального слова."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Не ставить запятую перед и в любом сложном предложении","Считать общий субъект двух сказуемых двумя подлежащими","Приписывать общий элемент второй части, которой он по смыслу не подходит"]}]}]},{"id":"RU048","title":"Обособленные определения и причастные обороты","mod":"M06","tasks":[17,21,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Распространённое согласованное определение, выраженное причастным оборотом, обычно обособляется после определяемого существительного: «Дом, построенный у реки, хорошо виден». Перед существительным при обычном определительном значении — без запятых: «Построенный у реки дом хорошо виден»."},{"t":"p","s":"Определение при личном местоимении обособляется независимо от позиции: «Уставший, он сел», «Он, уставший после дороги, сел». Определение перед существительным может обособляться при дополнительном причинном или уступительном значении: «Утомлённый дорогой, путник сразу уснул» — уснул потому, что утомился. В нейтральном уточнении признака без дополнительного значения запятая не нужна."},{"t":"p","s":"Определение, оторванное от существительного другими членами, часто обособляется: «На скамейке сидел мальчик, промокший под дождём». Нераспространённые определения после существительного могут обособляться группой: «Листья, жёлтые и красные, покрывали дорожку». Конкретные условия зависят от структуры, распространённости и смысла."},{"t":"p","s":"Иногда определение входит в необходимую смысловую часть сказуемого и не обособляется: «Он вернулся уставший» при значении состояния при возвращении. Это не отменяет общего правила об оборотах, а показывает, что не всякое прилагательное рядом с именем — вставное пояснение."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Дорога, ведущая через лес, была узкой».","Оборот начинается с «ведущая» и включает «через лес».","Две запятые выделяют весь оборот, а не отделяют причастие от зависимых слов.","«Ведущая через лес дорога была узкой» — обычная позиция перед существительным, запятых нет."]}]},{"h":"Алгоритм","items":[{"t":"st","items":["Найдите определение, его зависимые слова и определяемое слово.","Установите границы оборота.","Проверьте местоимение, позицию и дополнительное значение.","Проверьте закрывающую запятую: при обороте внутри предложения требуется парное выделение."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Включать существительное внутрь оборота","Ставить только открывающую запятую","Обособлять любой оборот до существительного","Принимать причастие за личный глагол и новую основу"]}]}]},{"id":"RU049","title":"Деепричастия и обособленные обстоятельства","mod":"M06","tasks":[17,21,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Деепричастный оборот обычно обособляется независимо от места: «Закончив работу, мы ушли»; «Мы, закончив работу, ушли»; «Мы ушли, закончив работу». Одиночное деепричастие тоже обычно отделяется: «Улыбнувшись, он ответил»."},{"t":"p","s":"Не обособляются образования, утратившие значение самостоятельного добавочного действия и выступающие обстоятельствами образа действия: «Он отвечал не задумываясь» в значении «легко, сразу»; «читать лёжа»; устойчивое «работать спустя рукава». У многих случаев возможна контекстная переинтерпретация. Поэтому нельзя объявлять любое слово на -а/-я деепричастием, требующим запятой."},{"t":"p","s":"Однородные деепричастные обороты при одиночном и внутри общего выделения не разделяются: «Проверив ответ и переписав решение, ученик сдал работу». Если обороты относятся к разным сказуемым или сочинение устроено иначе, схема меняется."},{"t":"p","s":"Оборот с несмотря на обычно обособляется: «Несмотря на дождь, экскурсия состоялась». Обороты с благодаря, согласно, ввиду, при наличии и подобными предлогами могут обособляться по условиям распространённости, позиции и смыслового подчёркивания. Их нельзя автоматически выделять только потому, что они стоят в начале предложения."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Мальчик шёл, насвистывая мелодию».","Есть самостоятельное добавочное действие с зависимым словом — оборот выделяется.","«Мальчик шёл не спеша» — сочетание характеризует способ движения и в обычном значении не обособляется.","Для авторской пунктуации возможны иные смысловые задачи, но тренажёр должен использовать однозначный контекст."]}]},{"h":"Алгоритм","items":[{"t":"st","items":["Проверьте, обозначает ли оборот добавочное действие.","Найдите границы и исполнителя.","Установите связь с союзом и соседними оборотами.","Отдельно проверьте устойчивость и наречное значение."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Выделять «молча» и «не спеша» всегда","Пропускать закрывающий знак","Смешивать пунктуационную правильность с грамматической допустимостью исполнителя","Ставить запятую между однородными оборотами с одиночным и"]}]}]},{"id":"RU050","title":"Приложения, уточнения, пояснения и присоединения","mod":"M06","tasks":[17,21,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Приложение — определение, выраженное существительным или сочетанием с существительным: «Иван, мой сосед, помог мне». Оно переименовывает предмет, а не просто сообщает его признак прилагательным. Распространённые приложения после имени часто обособляются. Приложение с причинным значением может обособляться и в иной позиции. Дефисное название «врач-терапевт» и обособленное приложение — разные конструкции."},{"t":"p","s":"Уточнение сужает значение предшествующего компонента: «Завтра, в шесть часов, начнётся встреча»; «Там, за поворотом, стоял дом». Вопрос задаётся от более общего к более конкретному. Но «завтра утром» может быть единым обстоятельством без уточняющей интонации и не требует автоматических запятых."},{"t":"p","s":"Пояснение передаёт то же содержание иначе, часто с то есть, а именно: «Мы изучали морфологию, то есть учение о частях речи и их формах». Присоединение добавляет отдельное замечание: «Все пришли вовремя, даже самые занятые». Пояснение, уточнение и присоединение отличаются смысловым отношением."},{"t":"p","s":"Обороты с кроме, помимо, за исключением и т. п. могут обозначать исключение или включение. При явном дополнительном выделении обычно обособляются: «Все, кроме дежурного, вышли». У «кроме» в значении добавления и некоторых тесно связанных сочетаний возможны другие решения; для заданий с единственным ответом контекст должен устранять вариантность."}]},{"h":"Разбор","items":[{"t":"ex","items":["«В Самаре, на набережной, открылась выставка».","Место последовательно сужается: город → конкретное место, поэтому возможно уточнение.","«На самарской набережной открылась выставка» — одно обстоятельство; отдельного уточняющего компонента нет."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Обособлять любые два обстоятельства рядом","Считать приложение дополнением","Не различать тире между подлежащим и сказуемым и парные тире приложения","Оставлять присоединение без закрывающего знака, когда предложение продолжается"]}]}]},{"id":"RU051","title":"Вводные слова, обращения, междометия и вставки","mod":"M06","tasks":[18,21,27],"blocks":[{"h":"Теория","items":[{"t":"tb","head":null,"rows":[["Вводные конструкции выражают отношение к сообщению, источник, порядок мыслей или способ оформления, но не являются членами предложения. Основные значения: уверенность/предположение","конечно, вероятно"],["чувство","к счастью"],["источник","по словам автора"],["порядок","во-первых, следовательно"],["способ выражения","иначе говоря"],["контакт с адресатом","видите ли"]]},{"t":"p","s":"Одно слово может иметь разные функции: «Он, верно, придёт» — предположение; «Он решил верно» — обстоятельство. «Кажется, дождь закончился» — вводное; «Мне кажется странным его решение» — член сказуемой конструкции. «Однако» в начале части в значении но — союз: «Однако дождь не прекратился». Внутри предложения возможно вводное: «Дождь, однако, не прекратился»."},{"t":"p","s":"Не являются вводными сами по себе: будто, как будто, словно, ведь, даже, именно, всё-таки, поэтому, почти, примерно, вдруг, едва ли. «Наверняка» обычно обстоятельственное наречие, не вводное слово. Пауза при произнесении не создаёт основания для обособления."},{"t":"p","s":"Обращение называет адресата речи: «Друзья, начнём». Оно не подлежащее: «Друзья пришли» — уже сообщение о них. Распространённое обращение выделяется целиком: «Дорогие друзья, начнём». Личные местоимения ты/вы чаще подлежащие, но при особом употреблении могут входить в обращение; контекст решает."},{"t":"p","s":"Междометия обычно отделяются: «Ах, как красиво!» Частица о перед обращением не отделяется от него: «О море, как ты спокойно!» Вставная конструкция добавляет побочное замечание и часто выделяется скобками или парными тире; вводность и вставность не тождественны."}]},{"h":"Разбор","items":[{"t":"ex","items":["«К счастью, поезд пришёл вовремя».","«К счастью» выражает чувство, «вовремя» — обстоятельство, не вводное.","«Он пришёл, наверное, вовремя» требует выделения «наверное», но не превращает соседнее наречие во вводное."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Обособлять «якобы» и «будто» как вводные","Отделять обращение вместе со сказуемым","Узнавать вводное только по возможности удаления","Путать «наконец» в значении порядка мыслей с «наконец» в значении результата ожидания"]}]}]},{"id":"RU052","title":"Сложноподчинённое предложение и несколько придаточных","mod":"M06","tasks":[19,20,21,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"В сложноподчинённом предложении одна часть зависит от другой и присоединяется союзом или союзным словом. Придаточное обычно отделяется запятой, а внутри главной части выделяется с двух сторон: «Дом, который стоял у реки, опустел»."},{"t":"tb","head":null,"rows":[["Основные группы придаточных: определительные","какой?"],["изъяснительные","падежный вопрос к слову речи, мысли, чувства"],["обстоятельственные","времени, места, причины, цели, условия, уступки, следствия, сравнения, меры и степени, образа действия. Союз сам по себе не всегда однозначно определяет тип: «когда» в разных конструкциях может соотноситься со временем и условием"]]},{"t":"p","s":"Однородные придаточные относятся к одному слову или ко всей главной части, отвечают на один вопрос: «Я знаю, что он приехал и что всё готово». Между ними при одиночном и запятой нет. Союз во втором придаточном может быть опущен: «Я знаю, что он приехал и всё готово» — решение зависит от установленной структуры."},{"t":"p","s":"При последовательном подчинении одно придаточное зависит от другого: «Я понял, что он вернётся, когда закончит работу». При неоднородном параллельном придаточные относятся к разным словам или отвечают на разные вопросы: «Когда наступил вечер, мы пришли к дому, который стоял у реки»."},{"t":"p","s":"Составные союзы потому что, для того чтобы, несмотря на то что могут расчленяться по смыслу, отрицанию, усилительным словам и другим условиям: «Он пришёл не потому, что его попросили». Нельзя всегда ставить запятую перед последним словом составного союза."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Я помню, где лежала книга и кто её принёс».","Два однородных изъяснительных придаточных зависят от «помню».","Между ними одиночный и, поэтому дополнительной запятой нет.","Вопросы «где?» и «кто?» внутри придаточных не отменяют их общей изъяснительной функции по отношению к главному слову."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Ставить знак перед каждым что","Пропускать закрывающую запятую после придаточного","Считать все придаточные одного вида однородными без общего главного компонента","Отделять союзное слово от своей части"]}]}]},{"id":"RU053","title":"Стык союзов и разные виды связи: задание 20","mod":"M06","tasks":[20,21,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Стык союзов возникает при вложении одного придаточного в другую часть: что если; и когда; но хотя. Запятая зависит от строения, а не от запрета или разрешения двух союзов подряд."},{"t":"p","s":"Если внутреннее придаточное можно изъять или переставить без перестройки оставшейся конструкции и после него нет обязательной второй части союза, на стыке обычно ставится запятая: «Я знал, что, если потороплюсь, успею». После удаления «если потороплюсь» остаётся «Я знал, что успею»."},{"t":"p","s":"Если далее есть соотносительное то, так или иной структурный компонент, делающий изъятие невозможным без перестройки, запятая на стыке не ставится: «Я знал, что если потороплюсь, то успею». После удаления внутреннего придаточного остаётся неудобное «что то успею»; поэтому конструкция рассматривается иначе. При этом перед то закрывающая запятая нужна."},{"t":"p","s":"На границе сочинения и подчинения действует тот же структурный анализ: «Солнце село, и, когда мы вышли, стало темно». Но в начале предложения после присоединительного «И» возможна тесная связь без запятой: «И когда мы вышли, стало темно». Нельзя переносить правило внутрипредложного стыка на начало высказывания автоматически."}]},{"h":"Алгоритм","items":[{"t":"st","items":["Найдите все основы.","Установите, какой союз открывает каждую часть.","Отметьте вложенное придаточное и его правую границу.","Проверьте наличие то/так/но как второй части соответствующей конструкции.","Выполните мысленное удаление, сохранив остальные слова.","После расстановки прочитайте полную схему ещё раз."]}]},{"h":"Разбор","items":[{"t":"ex","items":["«Я решил, что, когда закончу уроки, пойду гулять».","Три основы: я решил; закончу; пойду.","Внутренняя часть «когда закончу уроки» выделяется парой знаков; внешнее придаточное начинается с что.","«Что» не входит в внутренний оборот, поэтому после него возможна запятая."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Правило «две запятые рядом с союзом запрещены»","Удалять вместе с придаточным слово то и считать проверку успешной","Не различать конец одного придаточного и границу сочинённых частей"]}]}]},{"id":"RU054","title":"Бессоюзное сложное предложение: двоеточие и тире","mod":"M06","tasks":[21,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Части бессоюзного сложного предложения связаны смыслом и интонацией без сочинительного или подчинительного союза. При перечислении одновременных или последовательных событий обычно ставится запятая: «Солнце светило, птицы пели». Точка с запятой разделяет более самостоятельные или распространённые части, особенно при внутренних знаках."},{"t":"p","s":"Двоеточие в основной школьной модели ставят, когда вторая часть объясняет первую, раскрывает содержание восприятия/мысли или называет причину. Проверочные подстановки: а именно; что; потому что. «Я понял: спор закончен». «Мы остались дома: начался ливень». Подстановка помогает назвать смысл, но не является механическим доказательством во всех контекстах."},{"t":"p","s":"Тире передаёт результат или вывод, резкую смену событий, противопоставление, условие или время в первой части, сравнение в соответствующих конструкциях. «Прозвенел звонок — урок начался»; «Будет время — позвони»; «Я спешил — он медлил». Проверочные связи: поэтому, так что; если; когда; а/но."},{"t":"p","s":"В современной письменной речи в пояснительных конструкциях возможно тире вместо традиционного двоеточия, если это допускается нормой и обусловлено интонацией. В задании 21 требуется объяснить уже поставленный знак, а не переделать авторскую пунктуацию под одну упрощённую схему."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Мы промокли: начался дождь» — вторая часть обозначает причину.","«Начался дождь — мы промокли» — вторая часть представляет следствие.","Фактическая ситуация близка, но направление объяснения различается.","«Он подошёл к окну: во дворе стояла машина» может подразумевать «и увидел, что».","Нужно учитывать глагол восприятия, выраженный или восстанавливаемый, и контекст; одной общей темы недостаточно."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Ставить двоеточие перед любым объяснением внутри простого предложения без определения конструкции","Путать причину со следствием","Считать слова «поэтому» и «значит» всегда подчинительными союзами","Объединять все тире одним основанием"]}]}]},{"id":"RU055","title":"Тире в простом предложении и обобщающие слова","mod":"M06","tasks":[21,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Между подлежащим и именным сказуемым при нулевой связке тире обычно ставят, если оба выражены существительными в именительном: «Самара — город на Волге». Оно также характерно для инфинитивных конструкций: «Учиться — развиваться», для числительных и некоторых сочетаний с ними. Перед связующими это, вот, значит в соответствующей модели ставится тире: «Проверка — это часть работы»."},{"t":"p","s":"При личном местоимении-подлежащем, отрицании не перед существительным-сказуемым, сравнительном союзе и тесной интонационной связи тире часто отсутствует: «Он учитель», «Бедность не порок». Но выразительное противопоставление и интонационное выделение могут вернуть знак. У инфинитивной конструкции не не отменяет тире автоматически: «Учиться — не лениться»."},{"t":"p","s":"В неполном предложении тире обозначает пропущенный член, часто сказуемое: «Я выбрал чай, а сестра — кофе». Между «сестра» и «кофе» нельзя применять правило о двух существительных в именительном: «кофе» по функции дополнение, а пропущено «выбрала»."},{"t":"p","s":"Обобщающее слово объединяет ряд однородных членов. До перечисления обычно двоеточие: «Мы взяли всё: карты, фонарь, блокнот». После перечисления — тире: «Карты, фонарь, блокнот — всё лежало в рюкзаке». Если перечисление помещено внутри продолжающегося предложения: «Всё: карты, фонарь, блокнот — лежало в рюкзаке». При реальной двусмысленности лучше перестроить собственную фразу."},{"t":"p","s":"Тире также может обозначать присоединение, приложение, вставку, пространственный или временной диапазон. Дефис внутри слова и пунктуационное тире — разные знаки с разными функциями."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Моя цель — поступить в университет».","Существительное-подлежащее и инфинитивная именная часть, нулевая связка.","«Я поступлю летом, а брат — через год» — тире на месте пропущенного сказуемого.","В задании 21 эти случаи не объединяют только по внешнему знаку."]}]}]},{"id":"RU056","title":"КАК и сравнительные конструкции","mod":"M06","tasks":[17,21,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Сравнительный оборот с как, словно, будто, точно обычно обособляется, если выражает самостоятельное сравнение: «Вода блестела, как зеркало». Но наличие как не гарантирует запятую: слово может входить в сказуемое, устойчивое сочетание, значение роли или количества."},{"t":"p","s":"В значении «в качестве» оборот часто не обособляется: «Его пригласили как специалиста». Если приложение содержит дополнительное значение причины, оно может обособляться: «Как опытный специалист, он сразу заметил ошибку» — потому что был опытным. Одинаковая форма требует разных решений по смыслу."},{"t":"p","s":"Оборот не выделяется, если тесно входит в сказуемое: «Озеро как зеркало». Устойчивые сочетания вроде «льёт как из ведра», «работает как часы» в обычном значении не требуют запятой. Отрицание и ограничительные частицы перед оборотом могут влиять на обособление: «совсем как взрослый», «не как раньше» — анализируют полный контекст."},{"t":"p","s":"«Не более чем час», «не меньше чем десять страниц» без сравнения двух объектов выражают предел количества и обычно не разделяются запятой. «Он сделал больше, чем я ожидал» содержит придаточную часть, поэтому перед чем ставится запятая."}]},{"h":"Разбор","items":[{"t":"ex","items":["«Он работает как переводчик» — в качестве переводчика, без запятой.","«Он, как и сестра, изучает языки» — сопоставление с как и, оборот выделяется.","«Он говорил, как говорил его учитель» — придаточная часть с собственной основой; это другой тип конструкции."]}]},{"h":"Алгоритм","items":[{"t":"st","items":["Определите, что соединяет как: оборот, приложение, именную часть сказуемого, устойчивое выражение или придаточное.","Проверьте значение роли, причины, сравнения.","Затем учитывайте частицы и отрицание.","Для собственного сочинения спорную фразу можно сделать однозначнее."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Ставить знак перед каждым как","Не видеть основу придаточного","Путать «в качестве» и причинное значение","Применять правило количества к полноценному сравнению"]}]}]},{"id":"RU057","title":"Прямая речь, цитаты и диалог","mod":"M06","tasks":[21,27],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Прямая речь сохраняет форму высказывания говорящего; слова автора указывают, кто и как говорит. Если слова автора стоят перед прямой речью, обычно используется двоеточие: Учитель сказал: «Начинаем работу». Конечная точка ставится после закрывающих кавычек; вопросительный и восклицательный знаки относятся к прямой речи и располагаются перед кавычкой."},{"t":"p","s":"Если слова автора следуют после повествовательной прямой речи: «Начинаем работу», — сказал учитель. После вопроса: «Вы готовы?» — спросил учитель. Вопросительный знак сохраняется, дополнительная запятая после кавычек не ставится. Слова автора обычно начинаются со строчной, если продолжают одну конструкцию."},{"t":"p","s":"При разрыве прямой речи слова автора выделяются с двух сторон, но правый знак зависит от того, продолжается ли то же предложение или начинается новое: «Я проверю ответ, — сказал ученик, — и сдам работу». Если после слов автора начинается новое предложение прямой речи, используется другая модель с точкой и тире. Сначала восстановите прямую речь без авторской вставки, затем оформляйте разрыв."},{"t":"p","s":"В диалоге каждая реплика может начинаться с абзацного тире без кавычек. Оформление реплики со словами автора подчиняется правилам прямой речи. Тире в диалоге не объясняется ни неполнотой, ни бессоюзным сложным предложением автоматически."},{"t":"p","s":"Цитата внутри собственного предложения должна грамматически сочетаться с ним: «Автор называет поступок «тихой помощью»». Нельзя писать «автор говорит, что «я…»», если при этом смешиваются лица и формы прямой и косвенной речи. Допустим короткий точный фрагмент; большая цитата не заменяет собственного анализа."}]},{"h":"Разбор","items":[{"t":"ex","items":["Неверно: «Автор пишет, что «я хорошо помню этот день»».","Лучше: «Автор пишет: «Я хорошо помню этот день»» при точном цитировании либо «Автор отмечает, что хорошо помнит этот день» при косвенной передаче.","Второй вариант не должен оформляться как дословная цитата."]}]},{"h":"Типичные ошибки","items":[{"t":"wr","items":["Придумывать цитату по памяти","Оставлять исходное лицо при косвенной речи","Ставить лишнюю точку после вопросительного знака","Менять слова внутри цитаты без обозначения изменения"]}]}]},{"id":"RU058","title":"Одинаковое пунктуационное правило: задание 21","mod":"M06","tasks":[21],"blocks":[{"h":"Теория","items":[{"t":"p","s":"Задание проверяет основание знака. Две одинаковые запятые могут разделять однородные члены и части сложного предложения. Два тире могут обозначать пропуск сказуемого и связь подлежащего со сказуемым. Совпадение знака не означает совпадения правила."},{"t":"p","s":"Для запятой основные различаемые группы: однородные члены; обособленное определение; деепричастие; приложение или уточнение; вводное слово; обращение; граница частей сложносочинённого, сложноподчинённого или бессоюзного предложения. Точность названия правила важна: слишком широкое «обособление» может скрыть разные конструкции."},{"t":"p","s":"Для двоеточия: обобщающее слово перед перечислением; пояснительное/причинное отношение в бессоюзном сложном; слова автора перед прямой речью. Для тире: подлежащее и сказуемое; неполнота; обобщающее слово после ряда; бессоюзная связь; приложение/вставка; оформление чужой речи."}]},{"h":"Алгоритм","items":[{"t":"st","items":["В каждом предложении найдите именно анализируемый знак и его позицию.","Составьте грамматическую схему.","Запишите короткую метку основания.","Сгруппируйте предложения с одинаковой конструкцией.","Если в одном предложении несколько одинаковых знаков, разберите каждый: не игнор
