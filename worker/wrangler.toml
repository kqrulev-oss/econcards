# Сервер Задачника. Разворачивается кнопкой Deploy to Cloudflare (см. README.md)
# или вручную: npx wrangler deploy (GEMINI_KEY — необязательный запасной ИИ: npx wrangler secret put GEMINI_KEY)
# Хранилище DB и привязка Workers AI создаются автоматически при первом развёртывании.
name = "zadachnik"
main = "worker.js"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "DB"

# ИИ: Workers AI, бесплатный тариф, без ключа
[ai]
binding = "AI"

[vars]
DAILY_LIMIT = "60"

# Бот: напоминания и отчёты (worker/notify.js), раз в 5 минут
[triggers]
crons = ["*/5 * * * *"]
