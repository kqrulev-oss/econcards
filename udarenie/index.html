document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n\u003cdiv style=\"min-height:100vh;display:flex;justify-content:center;background:#E8EDF3;\"\u003e\n  \u003cdiv style=\"width:100%;max-width:430px;min-height:100vh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(11,61,145,.12);\"\u003e\n\n    \u003cheader style=\"background:linear-gradient(135deg,#0B3D91 0%,#093174 100%);box-shadow:0 2px 12px rgba(11,61,145,.25);position:sticky;top:0;z-index:99;\"\u003e\n      \u003cdiv style=\"padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;\"\u003e\n        \u003cdiv style=\"display:flex;align-items:baseline;gap:8px;\"\u003e\n          \u003cspan style=\"font-size:16px;font-weight:700;color:#fff;letter-spacing:.3px;\"\u003eУДАРЕНИЕ\u003c/span\u003e\n          \u003cspan style=\"font-size:12px;color:#BAE6FD;\"\u003eзадание 4 ЕГЭ\u003c/span\u003e\n        \u003c/div\u003e\n        \u003cspan style=\"font-size:12px;font-weight:500;color:#BAE6FD;\"\u003e{{ baseLabel }}\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/header\u003e\n\n    \u003cmain style=\"flex:1;padding:20px 16px 32px;\"\u003e\n\n      \u003csc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\"\u003e\n        \u003cdiv\u003e\n          \u003cdiv style=\"display:inline-block;background:#BAE6FD;color:#0369A1;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:5px 12px;border-radius:20px;\"\u003eОрфоэпический минимум\u003c/div\u003e\n          \u003ch1 style=\"font-size:26px;line-height:1.15;font-weight:700;color:#0B3D91;margin:12px 0 8px;\"\u003eТренировка\u003c/h1\u003e\n          \u003cp style=\"font-size:15px;line-height:1.55;color:#475569;margin:0 0 20px;text-wrap:pretty;\"\u003eВ базе {{ wordCount }} слов. Сегодня отвечено: {{ todayCount }}.\u003c/p\u003e\n\n          \u003cdiv style=\"display:grid;gap:12px;\"\u003e\n            \u003cbutton sc-camel-on-click=\"{{ pickEge }}\" style=\"text-align:left;cursor:pointer;border-radius:20px;padding:18px;transition:all .25s ease;box-shadow:0 2px 15px rgba(0,0,0,.06);background:{{ egeBg }};border:{{ egeBorder }};\"\u003e\n              \u003cdiv style=\"font-size:17px;font-weight:600;color:#0B3D91;margin-bottom:4px;\"\u003eФормат ЕГЭ\u003c/div\u003e\n              \u003cdiv style=\"font-size:14px;line-height:1.5;color:#475569;\"\u003eПять пронумерованных слов. Верных от двух до четырёх — в строку записываются их номера.\u003c/div\u003e\n            \u003c/button\u003e\n            \u003cbutton sc-camel-on-click=\"{{ pickMark }}\" style=\"text-align:left;cursor:pointer;border-radius:20px;padding:18px;transition:all .25s ease;box-shadow:0 2px 15px rgba(0,0,0,.06);background:{{ markBg }};border:{{ markBorder }};\"\u003e\n              \u003cdiv style=\"font-size:17px;font-weight:600;color:#0B3D91;margin-bottom:4px;\"\u003eПоставить ударение\u003c/div\u003e\n              \u003cdiv style=\"font-size:14px;line-height:1.5;color:#475569;\"\u003eСлово даётся без ударения. Нужно записать его, выделив ударную гласную заглавной буквой.\u003c/div\u003e\n            \u003c/button\u003e\n          \u003c/div\u003e\n\n          \u003cdiv style=\"margin-top:20px;background:#fff;border:1px solid #BAE6FD;border-radius:20px;padding:20px 18px;box-shadow:0 2px 15px rgba(0,0,0,.06);\"\u003e\n            \u003cdiv style=\"font-size:15px;font-weight:600;color:#0B3D91;margin-bottom:12px;\"\u003eДлина сессии\u003c/div\u003e\n            \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:10px;\"\u003e\n              \u003csc-for list=\"{{ lengthOptions }}\" as=\"opt\" hint-placeholder-count=\"3\"\u003e\n                \u003cbutton sc-camel-on-click=\"{{ opt.pick }}\" style=\"font-size:15px;font-weight:500;cursor:pointer;padding:10px 18px;min-height:44px;border-radius:9999px;transition:all .25s ease;background:{{ opt.bg }};color:{{ opt.color }};border:{{ opt.border }};\"\u003e{{ opt.label }}\u003c/button\u003e\n              \u003c/sc-for\u003e\n            \u003c/div\u003e\n            \u003clabel style=\"display:flex;align-items:flex-start;gap:12px;margin-top:18px;cursor:pointer;\"\u003e\n              \u003cinput type=\"checkbox\" checked=\"{{ timed }}\" sc-camel-on-change=\"{{ toggleTimed }}\" style=\"width:20px;height:20px;margin-top:2px;accent-color:#FF6A00;cursor:pointer;\"\u003e\n              \u003cspan style=\"font-size:15px;line-height:1.5;color:#1f2937;\"\u003eРежим экзамена: 40 секунд на слово, разбор ошибок только в конце\u003c/span\u003e\n            \u003c/label\u003e\n          \u003c/div\u003e\n\n          \u003cdiv style=\"display:grid;gap:12px;margin-top:20px;\"\u003e\n            \u003cbutton sc-camel-on-click=\"{{ start }}\" style=\"font-size:17px;font-weight:500;color:#fff;background:#FF6A00;border:0;border-radius:9999px;padding:15px 24px;min-height:52px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.22);transition:all .3s ease;\" style-hover=\"background:#E55F00;transform:translateY(-2px)\"\u003eНачать\u003c/button\u003e\n            \u003csc-if value=\"{{ hasMistakes }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n              \u003cbutton sc-camel-on-click=\"{{ startMistakes }}\" style=\"font-size:16px;font-weight:500;color:#0B3D91;background:#fff;border:1px solid #BAE6FD;border-radius:9999px;padding:14px 22px;min-height:48px;cursor:pointer;transition:all .3s ease;\" style-hover=\"background:#F0F9FF\"\u003eРабота над ошибками — {{ mistakeCount }}\u003c/button\u003e\n            \u003c/sc-if\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/sc-if\u003e\n\n      \u003csc-if value=\"{{ isQuiz }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n        \u003cdiv\u003e\n          \u003cdiv style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;\"\u003e\n            \u003cspan style=\"font-size:14px;font-weight:500;color:#64748B;\"\u003eЗадание {{ qNumber }} из {{ qTotal }}\u003c/span\u003e\n            \u003cspan style=\"font-size:14px;font-weight:600;color:{{ timerColor }};\"\u003e{{ timerLabel }}\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv style=\"height:6px;border-radius:9999px;background:#E0F2FE;overflow:hidden;margin-bottom:20px;\"\u003e\n            \u003cdiv style=\"height:100%;background:#FF6A00;border-radius:9999px;transition:width .3s ease;width:{{ progressWidth }};\"\u003e\u003c/div\u003e\n          \u003c/div\u003e\n\n          \u003cp style=\"font-size:15px;line-height:1.55;color:#475569;margin:0 0 16px;text-wrap:pretty;\"\u003e{{ prompt }}\u003c/p\u003e\n\n          \u003cdiv style=\"background:#F8FAFB;border:1px solid #E0F2FE;border-radius:20px;padding:18px;margin-bottom:18px;\"\u003e\n            \u003cdiv style=\"display:grid;gap:12px;\"\u003e\n              \u003csc-for list=\"{{ words }}\" as=\"w\" hint-placeholder-count=\"5\"\u003e\n                \u003cdiv style=\"display:flex;align-items:flex-start;gap:12px;\"\u003e\n                  \u003cspan style=\"flex:none;width:26px;height:26px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:{{ w.numBg }};color:{{ w.numColor }};\"\u003e{{ w.num }}\u003c/span\u003e\n                  \u003cdiv style=\"flex:1;min-width:0;\"\u003e\n                    \u003cdiv style=\"font-size:20px;font-weight:500;line-height:1.3;color:{{ w.color }};\"\u003e{{ w.label }}\u003c/div\u003e\n                    \u003cdiv style=\"font-size:13px;line-height:1.5;color:{{ w.noteColor }};\"\u003e{{ w.note }}\u003c/div\u003e\n                  \u003c/div\u003e\n                \u003c/div\u003e\n              \u003c/sc-for\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n\n          \u003clabel style=\"display:block;font-size:14px;font-weight:500;color:#0B3D91;margin-bottom:8px;\"\u003eОтвет\u003c/label\u003e\n          \u003cinput value=\"{{ input }}\" sc-camel-on-input=\"{{ onInput }}\" sc-camel-on-key-down=\"{{ onKey }}\" placeholder=\"{{ placeholder }}\" sc-camel-auto-complete=\"off\" sc-camel-auto-capitalize=\"off\" sc-camel-spell-check=\"{{ false }}\" style=\"width:100%;box-sizing:border-box;font-size:20px;font-weight:500;color:#1f2937;background:#fff;border-radius:14px;padding:14px 16px;min-height:56px;outline:none;transition:border .25s ease;border:{{ inputBorder }};\"\u003e\n          \u003cp style=\"font-size:13px;line-height:1.5;color:#64748B;margin:8px 0 0;\"\u003e{{ inputHint }}\u003c/p\u003e\n\n          \u003csc-if value=\"{{ notAnswered }}\" hint-placeholder-val=\"{{ true }}\"\u003e\n            \u003cdiv style=\"display:grid;gap:10px;margin-top:16px;\"\u003e\n              \u003cbutton sc-camel-on-click=\"{{ submit }}\" style=\"font-size:16px;font-weight:500;color:#fff;background:#FF6A00;border:0;border-radius:9999px;padding:14px 24px;min-height:50px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.22);transition:all .3s ease;\" style-hover=\"background:#E55F00;transform:translateY(-2px)\"\u003eОтветить\u003c/button\u003e\n              \u003cbutton sc-camel-on-click=\"{{ skip }}\" style=\"font-size:15px;font-weight:500;color:#64748B;background:transparent;border:0;padding:10px;min-height:44px;cursor:pointer;\"\u003eНе знаю, пропустить\u003c/button\u003e\n            \u003c/div\u003e\n          \u003c/sc-if\u003e\n\n          \u003csc-if value=\"{{ showFeedback }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n            \u003cdiv style=\"margin-top:18px;background:#fff;border:1px solid #BAE6FD;border-radius:20px;padding:18px;box-shadow:0 2px 15px rgba(0,0,0,.06);\"\u003e\n              \u003cdiv style=\"font-size:16px;font-weight:600;margin-bottom:6px;color:{{ verdictColor }};\"\u003e{{ verdict }}\u003c/div\u003e\n              \u003cp style=\"font-size:15px;line-height:1.55;color:#475569;margin:0 0 10px;\"\u003eВерный ответ — \u003cstrong style=\"color:#0B3D91;\"\u003e{{ correctWord }}\u003c/strong\u003e\u003c/p\u003e\n              \u003cdiv style=\"display:grid;gap:14px;\"\u003e\n                \u003csc-for list=\"{{ explain }}\" сходного слова (начАть — начАв, поднЯть — поднЯв).',\n  vPast: 'Глаголы прошедшего времени женского рода: ударение уходит на окончание — бралА, ждалА. Исключения: клАла, крАлась, слАла.',\n  vInf: 'Инфинитив запоминается целиком, и его ударение сохраняется в личных формах: облегчИть — облегчИт. Чаще всего ошибаются в закУпорить, освЕдомиться, чЕрпать.',\n  vPres: 'Формы настоящего и будущего времени: ударение обычно на окончании — звонИт, включИт, вручИт, углубИт. Исключения: опОшлят, озлОбит.',\n  pEnn: 'Причастия с суффиксом -ённ- держат ударение на Ё: включЁнный, заселЁнный, ободрЁнный.',\n  pT: 'Причастия с суффиксами -т-, -нут- уводят ударение на приставку: зАнятый, нАчатый, сОгнутый. В краткой форме женского рода — на окончании: снятА.',\n  pVsh: 'Действительные причастия на -вший сохраняют ударение глагола: начАть — начАвший, нажИть — нажИвший.',\n  pSch: 'Причастия на -щий держат ударение там же, где глагол: кормИть — кормЯщий, кровоточИть — кровоточАщий.'\n};\n\nfunction ruleFor(word, cat) {\n  const l = String(word || '').toLowerCase();\n  if (cat === 'v') {\n    if (/(ла|лась)$/.test(l)) return RULES.vPast;\n    if (/(ть|ться)$/.test(l)) return RULES.vInf;\n    return RULES.vPres;\n  }\n  if (cat === 'p') {\n    if (/ённ/.test(l)) return RULES.pEnn;\n    if (/(вший|вшийся)$/.test(l)) return RULES.pVsh;\n    if (/щий$/.test(l)) return RULES.pSch;\n    return RULES.pT;\n  }\n  return RULES[cat] || RULES.n;\n}\n\nconst DATA = [\n  ['n', 'аэропОрты алкогОль алфавИт анАтом апострОф арАхис аристокрАтия асимметрИя бАнты бОроду боЯзнь бухгАлтер бухгАлтеров бухгАлтерия бюрокрАтия вЕрба вероисповЕдание ветеринАрия вОзрасты водопровОд ворОта газопровОд гастронОмия гЕнезис гербЫ граждАнство гУсеница дефИс дЕспот диалОг диоптрИя диспансЕр добЫча договОр договорЁнность докумЕнт досУг дремОта духовнИк ерЕсь еретИк жалюзИ жерлО завсегдАтай зАговор закУпорка знАмение знАчимость Иксы Иконопись инженЕры инстИнкт инсУльт исповЕдание каталОг каучУк квартАл киломЕтр кинематогр text) {\n  return text.split(/[\\n,;]+/).map(function (s) { return s.trim(); })\n    .filter(function (s) { return s && vowelIdx(s).length \u003e 1; })\n    .map(function (s) { return { w: s, cat: guessCat(s) }; });\n}\nfunction today() { return new Date().toISOString().slice(0, 10); }\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    let stats = { total: 0, correct: 0, per: {}, day: today(), dayCount: 0 };\n    let base = { words: null, updated: null, url: '', auto: true };\n    try {\n      const s = localStorage.getItem('udar-stats-v3');\n      if (s) stats = Object.assign(stats, JSON.parse(s));\n      const b = localStorage.getItem('udar-base-v3');\n      if (b) base = Object.assign(base, JSON.parse(b));\n    } catch (e) {}\n    if (stats.day !== today()) { stats.day = today(); stats.dayCount = 0; }\n    this.state = {\n      screen: 'home', tab: 'home',\n      mode: props.defaultMode === 'Поставить ударение' ? 'mark' : 'ege',\n      len: props.sessionLength || 10,\n      timed: !!props.examMode,\n      questions: [], idx: 0, input: '', result: null, missed: [], correctCount: 0, sessionMistakes: [], timeLeft: 40,\n      cardIdx: 0, cardFlipped: false, cardOrder: [],\n      stats: stats, base: base,\n      customText: '', sourceUrl: base.url || '', syncStatus: '', syncOk: true\n    };\n  }\n\n  componentDidMount() {\n    this.setState({ cardOrder: shuffle(this.words().map(function (w) { return w.w; })) });\n    if (this.state.base.auto && this.state.sourceUrl && this.state.base.updated !== today()) this.fetchBase(true);\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n\n  words() { const b = this.state.base.words; return b && b.length ? b : BASE; }\n  saveStats(s) { try { localStorage.setItem('udar-stats-v3', JSON.stringify(s)); } catch (e) {} }\n  saveBase(b) { try { localStorage.setItem('udar-base-v3', JSON.stringify(b)); } catch (e) {} }\n\n  fetchBase(silent) {\n    const self = this;\n    const url = this.state.sourceUrl;\n    if (!url) { this.setState({ syncStatus: 'Укажите адрес списка.', syncOk: false }); return; }\n    this.setState({ syncStatus: 'Обновление…', syncOk: true });\n    fetch(url).then(function (r) { return r.text(); }).then(function (t) {\n      const list = parseList(t);\n      if (!list.length) throw new Error('empty');\n      const base = { words: list, updated: today(), url: url, auto: self.state.base.auto };\n      self.saveBase(base);\n      self.setState({ base: base, syncStatus: 'Обновлено ' + today() + ' — ' + list.length + ' слов', syncOk: true });\n    }).catch(function () {\n      self.setState({ syncStatus: silent ? 'Обновить не удалось — работаем с сохранённой базой.' : 'Адрес недоступен. Проверьте ссылку или вставьте список вручную.', syncOk: false });\n    });\n  }\n\n  startTimer() {\n    const self = this;\n    clearInterval(this.timer);\n    if (!this.state.timed) return;\n    this.timer = setInterval(function () {\n      if (self.state.result || self.state.screen !== 'quiz') return;\n      if (self.state.timeLeft \u003c= 1) self.check(true);\n      else self.setState({ timeLeft: self.state.timeLeft - 1 });\n    }, 1000);\n  }\n\n  begin(pool) {\n    const src = pool && pool.length ? pool : this.words();\n    const mode = this.state.mode;\n    const all = this.words();\n    const used = {};\n    const targets = shuffle(src, Math.min(this.state.len, src.length));\n    targets.forEach(function (t) { used[lemma(t.w)] = 1; });\n    const qs = targets.map(function (item) {\n      if (mode === 'mark') return { word: item.w, cat: item.cat, shown: [stem(item.w)], mode: 'mark' };\n      const fresh = shuffle(all.filter(function (x) { return x.w !== item.w && !used[lemma(x.w)]; }), 4);\n      const fill = fresh.length === 4 ? fresh : fresh.concat(shuffle(all.filter(function (x) { return x.w !== item.w && fresh.indexOf(x) \u003c 0; }), 4 - fresh.length));\n      const five = shuffle([item].concat(fill));\n      five.forEach(function (x) { used[lemma(x.w)] = 1; });\n      const nCorrect = 2 + Math.floor(Math.random() * 3);\n      const flags = shuffle([true, true, true, true, true].map(function (_, i) { return i \u003c nCorrect; }));\n      const items = five.map(function (it, i) {\n        if (flags[i]) return { word: it.w, shown: it.w, correct: true, cat: it.cat };\n        return { word: it.w, shown: wrongVariant(it.w), correct: false, cat: it.cat };\n      });\n      const answer = items.map(function (it, i) { return it.correct ? String(i + 1) : ''; }).join('');\n      return { mode: 'ege', items: items, answer: answer };\n    });\n    this.setState({ screen: 'quiz', tab: 'home', questions: qs, idx: 0, input: '', result: null, missed: [], correctCount: 0, sessionMistakes: [], timeLeft: 40 });\n    this.startTimer();\n  }\n\n  check(timeout) {\n    const st = this.state;\n    if (st.result) return;\n    const q = st.questions[st.idx];\n    if (!q) return;\n    const raw = st.input.trim();\n    const per = Object.assign({}, st.stats.per);\n    const bump = function (word, good) {\n      const rec = Object.assign({ r: 0, w: 0 }, per[word]);\n      if (good) rec.r += 1; else rec.w += 1;\n      per[word] = rec;\n    };\n    let ok = false;\n    let missed = [];\n\n    if (q.mode === 'mark') {\n      const typed = raw.replace(/\\s+/g, '');\n      ok = !timeout && !!typed && fold(typed) === fold(q.word);\n      bump(q.word, ok);\n      if (!ok) missed = [{ word: q.word, rule: ruleFor(q.word, q.cat), was: timeout ? 'Время вышло' : (raw ? 'Ваш ответ: ' + raw : 'Ответ не записан') }];\n    } else {\n      const picked = timeout ? [] : digits(raw);\n      ok = picked.join('') === q.answer;\n      q.items.forEach(function (it, i) {\n        const chose = picked.indexOf(String(i + 1)) \u003e= 0;\n        bump(it.word, chose === it.correct);\n        if (chose !== it.correct) {\n          missed.push({\n            word: it.word,\n            rule: ruleFor(it.word, it.cat),\n            was: it.correct\n
