function startEssay(mode, i){
  let topic;
  if (i === -1){
    topic = (prompt('Сформулируй проблему (вопрос, над которым размышляет автор):') || '').trim();
    if (!topic) return;
  } else topic = mode === 'ege' ? EGE[i].p : FINAL[i];
  const d = { id: 'd' + Date.now(), mode, topic, text: '', upd: Date.now(), ai: null };
  S.drafts.unshift(d); S.cur = d.id; save();
  go('write');
}

/* ==================== РЕДАКТОР ==================== */
let deadline = null, tInt = null;
function renderWrite(){
  const d = cur();
  const ta = document.getElementById('ta');
  if (!d){
    document.getElementById('wTopic').textContent = 'Выбери тему на вкладке «Темы» — или пройди школу и собери первое сочинение в конструкторе.';
    document.getElementById('wMode').textContent = '';
    ta.value = ''; ta.disabled = true; updWords(); return;
  }
  ta.disabled = false;
  document.getElementById('wTopic').textContent = d.topic;
  document.getElementById('wMode').textContent = d.mode === 'ege' ? 'ЕГЭ · К1–К12' : 'итоговое';
  if (ta.value !== d.text) ta.value = d.text;
  updWords();
}
function onType(){
  const d = cur(); if (!d) return;
  d.text = document.getElementById('ta').value;
  d.upd = Date.now(); save(); updWords();
}
function updWords(){
  const d = cur();
  const n = d ? words(d.text) : 0;
  const el = document.getElementById('wWords');
  el.textContent = plu(n, ['слово','слова','слов']);
  const min = d && d.mode === 'final' ? 250 : 150;
  el.className = 'chip ' + (n === 0 ? '' : n < min ? 'bad' : 'good');
}
function toggleTimer(){
  const el = document.getElementById('wTimer');
  if (deadline){ clearInterval(tInt); deadline = null; el.innerHTML = ic('clock', 13) + ' таймер'; el.className = 'chip'; return; }
  deadline = Date.now() + 90*60*1000;
  el.className = 'chip on';
  tInt = setInterval(() => {
    const left = deadline - Date.now();
    if (left <= 0){ clearInterval(tInt); deadline = null; el.innerHTML = ic('clock', 13) + ' время вышло'; el.className = 'chip bad'; return; }
    const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
    el.innerHTML = ic('clock', 13) + ' ' + m + ':' + String(s).padStart(2,'0');
  }, 500);
  el.innerHTML = ic('clock', 13) + ' 90:00';
}
function openFrame(){
  const d = cur();
  const fin = d && d.mode === 'final';
  let h = '<div class="grab"></div><div class="big disp">Каркас</div>';
  if (!fin){
    h += '<p style="margin-bottom:10px">1. ' + mk('pr','Проблема') + ' — вопрос автора.</p>'+

      '<p style="margin-bottom:10px">3. ' + mk('ex','Пример 2') + ' + ' + mk('po','пояснение') + ' + ' + mk('sv','связь с анализом') + '.</p>'+
      '<p style="margin-bottom:10px">4. ' + mk('pz','Позиция автора') + ' — его ответ.</p>'+
      '<p style="margin-bottom:10px">5. ' + mk('mn','Моё мнение') + ' + обоснование.</p>'+
      '<p style="margin-bottom:14px">6. ' + mk('vy','Вывод') + ' — замкни круг.</p>'+
      '<div class="callout c-warn">От 150 слов (меньше — 0). Оптимум 250–300. После каждого примера — «что это показывает?»</div>';
  } else {
    h += '<p style="margin-bottom:10px">1. Тезис — прямой ответ на вопрос темы.</p>'+
      '<p style="margin-bottom:10px">2. Аргумент из литературы: произведение → эпизод → микровывод.</p>'+
      '<p style="margin-bottom:10px">3. Второй аргумент (по желанию).</p>'+
      '<p style="margin-bottom:14px">4. Вывод — вернись к вопросу.</p>'+
      '<div class="callout c-warn">Минимум 250 слов, рекомендуется от 350. Пересказ без вывода — не аргумент.</div>';
  }
  h += '<div style="height:10px"></div><button class="btn ghost" onclick="closeSheet()">Понятно</button>';

}

/* ==================== ПРОВЕРКА ==================== */
function openCheck(){
  const d = cur(); if (!d) return;
  const n = words(d.text);
  const min = d.mode === 'final' ? 250 : 150;
  const crits = d.mode === 'final' ? CRIT_FINAL : CRIT_EGE;
  let h = '<div class="grab"></div><div class="big disp">Проверка</div>'+
    '<div class="score">' + plu(n, ['слово','слова','слов']) + ' · ' + (n < min ? '<span style="color:var(--no-ink)">меньше минимума ' + min + '</span>' : '<span style="color:var(--ok-ink)">объём в норме</span>') + '</div>'+
    '<div class="h2" style="margin-top:4px">Чек-лист ' + (d.mode === 'final' ? 'итогового' : 'К1–К12') + '</div>';
  crits.forEach(c => {
    h += '<label class="crit"><input type="checkbox" onchange="calcScore()" data-p="' + c[1] + '">'+
      '<span class="ct">' + esc(c[0]) + '</span>' + (c[1] ? '<span class="cp">' + c[1] + '</span>' : '') + '</label>';
  });
  h += '<div class="score" id="scoreBox">' + (d.mode === 'final' ? 'Отметь, что выполнено' : 'Самооценка: 0 из 22') + '</div>';
  h += '<button class="btn grad" onclick="aiCheck()" id="aiBtn">' + ic('spark', 15) + ' ' + (S.aiKey ? 'Проверить с ИИ' : 'ИИ-проверка (нужен ключ — «Ещё»)') + '</button>';
  h += '<div id="aiOut">' + (d.ai ? '<div class="aibox">' + esc(d.ai) + '</div>' : '') + '</div>';
  sheet(h);
  window._checkMode = d.mode;
}
function calcScore(){
  const boxes = [...document.querySelectorAll('.crit input')];
  const box = document.getElementById('scoreBox');
  if (window._checkMode === 'final'){
    const done = boxes.filter(b => b.checked).length;
    box.textContent = done >= 5 ? 'Похоже на зачёт ✓' : 'Выполнено ' + done + ' из ' + boxes.length;
  } else {
    const sum = boxes.reduce((a, b) => a + (b.checked ? +b.dataset.p : 0), 0);
    box.textContent = 'Самооценка: ' + sum + ' из 22';
  }
}

/* ==================== ИИ ==================== */
const MODELS = ['gemini-2.0-flash', 'gemini-2.0-flash-lite', 'gemini-1.5-flash'];
async function aiCheck(){
  const d = cur(); if (!d) return;
  if (!S.aiKey){ closeSheet(); go('more'); return; }
  if (words(d.text) < 30){ document.getElementById('aiOut').innerHTML = '<div class="aibox">Напиши хотя бы несколько абзацев — тогда проверка будет осмысленной.</div>'; return; }
  const btn = document.getElementById('aiBtn');
  btn.innerHTML = 'Проверяю…';
  const sys = d.mode === 'final'
    ? 'Ты эксперт, проверяющий итоговое сочинение (допуск к ЕГЭ). Оцени по критериям: 1) соответствие теме, 2) аргументация с опорой на литературу, 3) композиция и логика, 4) качество речи, 5) грамотность. По каждому — зачёт/незачёт с пояснением в одну-две строки, затем общий вердикт и три главных совета. Пиши по-русски, кратко и по делу.'
    : 'Ты эксперт ЕГЭ по русскому языку. Работай в два прохода, строго по тексту ученика, ничего не выдумывая. ПРОХОД 1 — структура: найди и кратко процитируй (3–6 слов) каждый элемент: формулировка проблемы; пример 1; пояснение к нему; пример 2; пояснение к нему; связь между примерами и её анализ; позиция автора; собственное мнение с обоснованием; вывод. Если элемента нет — пиши «НЕТ». ПРОХОД 2 — баллы К1–К12 (макс 22): по каждому критерию балл и одна строка почему; для К7–К10 перечисли конкретные найденные ошибки в формате «цитата → исправление» (не оценивай “на глаз”: нет найденных ошибок — ставь максимум и пиши «не найдено»). Затем ориентировочная сумма (подпиши, что реальный балл ставит эксперт) и три главных совета. Если объём меньше 150 слов — сразу предупреди про 0. По-русски, без воды.';
  const userText = 'Тема/проблема: ' + d.topic + '\n\nСочинение ученика:\n' + d.text.slice(0, 12000);
  /* Ключ Claude (sk-ant-…) — проверяет Claude напрямую из браузера */
  if (S.aiKey.startsWith('sk-ant-')){
    for (const m of ['claude-sonnet-5', 'claude-haiku-4-5-20251001']){
      try{
        const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': S.aiKey,
            'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
          body: JSON.stringify({ model: m, max_tokens: 3072, system: sys,
            messages: [{ role: 'user', content: userText }] }) });
        if (!r.ok) continue;
        const data = await r.json();
        const text = (data.content || []).map(c => c.text || '').join('').trim();
        if (!text) continue;
        d.ai = text; d.upd = Date.now(); save();
        btn.innerHTML = ic('spark', 15) + ' Проверить с ИИ';
        document.getElementById('aiOut').innerHTML = '<div class="aibox">' + esc(text) + '</div>';
        return;
      }catch(e){}
    }
    btn.innerHTML = ic('spark', 15) + ' Проверить с ИИ';
    document.getElementById('aiOut').innerHTML = '<div class="aibox">Не получилось связаться с Claude. Проверь ключ (sk-ant-…) и интернет.</div>';
    return;
  }
  const tries = [...new Set([S.aiModel || MODELS[0], ...MODELS])];
  for (const m of tries){
    try{
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + m + ':generateContent?key=' + encodeURIComponent(S.aiKey), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: sys }] },
          contents: [{ role: 'user', parts: [{ text: userText }] }],
          generationConfig: { temperature: 0.3, maxOutputTokens: 3072 },
        }),
      });
      if (!r.ok) continue;
      const data = await r.json();
      const text = (data.candidates?.[0]?.content?.parts || []).map(p => p.text).join('').trim();
      if (!text) continue;
      d.ai = text; d.upd = Date.now(); S.aiModel = m; save();
      btn.innerHTML = ic('spark', 15) + ' Проверить с ИИ';
      document.getElementById('aiOut').innerHTML = '<div class="aibox">' + esc(text) + '</div>';
      return;
    }catch(e){}
  }
  btn.innerHTML = ic('spark', 15) + ' Проверить с ИИ';
  document.getElementById('aiOut').innerHTML = '<div class="aibox">Не получилось связаться с ИИ. Проверь ключ во вкладке «Ещё» и интернет.</div>';
}

/* ==================== МОИ ==================== */
function renderMine(){
  let h = '<div class="big disp">Мои сочинения</div>';
  if (!S.drafts.length){
    h += '<div class="empty">Пока пусто.<br>Пройди пару шагов школы — и напиши первое.</div>';
  } else {
    S.drafts.forEach(d => {
      const dt = new Date(d.upd);
      const date = dt.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
      h += '<div class="tile" style="padding-right:10px">'+
        '<button style="flex:1;min-width:0;display:flex;gap:12px;align-items:center" onclick="openDraft(\'' + d.id + '\')">'+
        '<span class="ico">' + ic(d.mode === 'final' ? 'cap' : 'file', 21) + '</span>'+
        '<span class="tx"><span class="tt">' + esc(d.topic) + '</span>'+
        '<span class="ts">' + plu(words(d.text), ['слово','слова','слов']) + ' · ' + date + (d.ai ? ' · есть разбор ИИ' : '') + '</span></span>'+
        '</button><button class="del" onclick="delDraft(\'' + d.id + '\')">✕</button></div>';
    });
  }
  document.getElementById('mineList').innerHTML = h;
}
function openDraft(id){ S.cur = id; save(); go('write'); }
function delDraft(id){
  if (!confirm('Удалить это сочинение навсегда?')) return;
  S.drafts = S.drafts.filter(d => d.id !== id);
  if (S.cur === id) S.cur = null;
  save(); renderMine();
}

/* ==================== ЕЩЁ ==================== */
function renderMore(){
  let h = '<div class="big disp">Ещё</div>'+
    '<div class="h2">ИИ-проверка</div>'+
    '<div class="note" style="margin-top:0">Бесплатно: ключ Google AI Studio (aistudio.google.com/apikey) — тот же, что в EconCards. Хочешь умнее — вставь ключ Claude с console.anthropic.com (начинается с sk-ant-, платный): сочинение будет проверять сам Claude. Любой ключ хранится только на этом устройстве.</div>'+
    '<input class="field" id="keyIn" type="password" placeholder="Ключ Gemini…" value="' + esc(S.aiKey) + '">'+
    '<div style="height:9px"></div>'+
    '<button class="btn" onclick="saveKey()">Сохранить ключ</button>'+
    '<div class="h2">Прогресс школы</div>'+
    '<div class="note" style="margin-top:0">Пройдено ' + doneCount() + ' из ' + SCHOOL.length + ' шагов. Сбросить прогресс можно кнопкой ниже (сочинения не тронет).</div>'+
    '<button class="btn ghost" onclick="if(confirm(\'Сбросить прогресс школы?\')){S.school={};save();toast(\'Прогресс сброшен\');renderMore();}">Сбросить школу</button>'+
    '<div class="h2">Установка</div>'+
    '<div class="note" style="margin-top:0">В Safari: Поделиться → «На экран „Домой“» — отдельное приложение со своей иконкой. Работает без интернета (кроме ИИ).</div>'+
    '<div class="h2">Семья приложений</div>'+
    '<button class="tile" onclick="location.href=\'../\'"><span class="ico">' + ic('chart', 21) + '</span>'+
    '<span class="tx"><span class="tt">EconCards</span><span class="ts">карточки: олимпиадная экономика и ЕГЭ-тренажёр</span></span><span class="chev">›</span></button>'+'<button class="tile" onclick="location.href=\'../timer/\'"><span class="ico">' + ic('clock', 21) + '</span>'+'<span class="tx"><span class="tt">Фокус</span><span class="ts">таймер учёбы по предметам и статистика</span></span><span class="chev">›</span></button>';
  document.getElementById('moreList').innerHTML = h;
}
function saveKey(){
  S.aiKey = document.getElementById('keyIn').value.trim();
  S.aiModel = ''; save();
  toast(S.aiKey ? 'Ключ сохранён ✓' : 'Ключ удалён');
}

/* ==================== старт ==================== */
renderPath();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
