<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F5F1">
<title>Сочинение</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   СОЧИНЕНИЕ — дизайн-система «Чернила»
   Бумажный фон, издательская типографика с засечками,
   единая цветовая система частей сочинения:
   проблема · пример · пояснение · связь · позиция · мнение · вывод
   ============================================================ */
:root{
  --bg:#F6F5F1; --card:#FFFFFF; --ink:#16192B; --muted:#7C8095; --line:#E8E6DE;
  --soft:#F0EEE8; --soft2:#E4E1D8;
  --ok:#16A57B; --ok-soft:#E3F6EE; --ok-ink:#0E8A65;
  --no:#F04452; --no-soft:#FEE9EB; --no-ink:#D42D3C;
  --g1:#5B67F5; --g2:#9B5DE5;
  --grad:linear-gradient(135deg,#5B67F5 0%,#8A5CE5 55%,#B04FD9 100%);
  /* цвета частей сочинения */
  --pr:#4A56E2;  --pr-bg:#ECEEFE;   /* проблема */
  --ex:#0F9D95;  --ex-bg:#E2F5F4;   /* пример */
  --po:#DC8A06;  --po-bg:#FCF2DC;   /* пояснение */
  --sv:#DB4E95;  --sv-bg:#FBE7F2;   /* связь */
  --pz:#279A5F;  --pz-bg:#E4F5EB;   /* позиция автора */
  --mn:#8A5CE5;  --mn-bg:#F1EBFD;   /* моё мнение */
  --vy:#5B7A99;  --vy-bg:#E9F0F6;   /* вывод */
  --veil:rgba(22,25,43,.5);
  --safe-b:env(safe-area-inset-bottom,0px);
  --fserif:'Literata',ui-serif,"New York",Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);
  font-family:'Inter',-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:16.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ico .ic{vertical-align:0}
.disp{font-family:var(--fserif);letter-spacing:-.01em}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
main{flex:1;min-height:0;position:relative}
.scene{position:absolute;inset:0;display:none;overflow-y:auto;padding:16px 16px 28px}
.scene.on{display:block}
#s-write.scene.on{display:flex;flex-direction:column;overflow:hidden;padding:0}

/* ---------- общие элементы ---------- */
.big{font-size:26px;font-weight:800;margin:6px 2px 12px}
.note{font-size:13.5px;color:var(--muted);line-height:1.45;margin:-6px 2px 16px}
.h2{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 4px 10px}
.tile{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:var(--card);
  border:1px solid var(--line);border-radius:18px;margin-bottom:10px;
  box-shadow:0 1px 3px rgba(22,25,43,.05);transition:transform .1s}
.tile:active{transform:scale(.985)}
.tile .ico{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:var(--soft)}
.tile .tx{flex:1;min-width:0}
.tile .tt{display:block;font-size:15.5px;font-weight:750;line-height:1.3}
.tile .ts{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}
.chev{flex:none;color:#CFCCC2;font-size:19px;font-weight:900}
.btn{display:block;width:100%;padding:15px;border-radius:17px;background:var(--ink);color:#fff;
  font-weight:800;text-align:center;transition:transform .1s;box-shadow:0 6px 18px -8px rgba(22,25,43,.5)}
.btn:active{transform:scale(.98)}
.btn.grad{background:var(--grad);box-shadow:0 8px 22px -8px rgba(114,84,235,.6)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.green{background:var(--ok);box-shadow:0 8px 22px -8px rgba(22,165,123,.55)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---------- таб-бар ---------- */
.tabs{flex:none;display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:10}
.tab{flex:1;padding:9px 0 7px;text-align:center;color:var(--muted)}
.tab .ti{display:flex;justify-content:center;margin-bottom:3px;opacity:.55;transition:.15s}
.tab .tl{font-size:10px;font-weight:800;letter-spacing:.02em}
.tab.on{color:var(--g1)}
.tab.on .ti{opacity:1;transform:translateY(-1px)}

/* ---------- ПУТЬ: hero ---------- */
.hero{position:relative;overflow:hidden;background:#171A2E;color:#fff;border-radius:24px;
  padding:22px 20px 20px;margin-bottom:20px;box-shadow:0 18px 40px -18px rgba(23,26,46,.55)}
.hero::before{content:'';position:absolute;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(102,92,255,.55),transparent 65%);top:-160px;right:-120px}
.hero::after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(219,78,149,.35),transparent 65%);bottom:-140px;left:-90px}
.hero *{position:relative;z-index:1}
.hero .kicker{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9FA6D9}
.hero h1{font-family:var(--fserif);font-size:30px;line-height:1.12;font-weight:700;margin:8px 0 6px}
.hero p{font-size:13.5px;color:#B9BEDF;line-height:1.45;max-width:88%}
.hero .pb{height:9px;border-radius:5px;background:rgba(255,255,255,.14);margin-top:16px;overflow:hidden}
.hero .pb i{display:block;height:100%;border-radius:5px;background:var(--grad);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hero .pl{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#B9BEDF;margin-top:8px}

/* ---------- ПУТЬ: узлы ---------- */
.path{position:relative;padding:4px 0 8px}
.path::before{content:'';position:absolute;left:29px;top:20px;bottom:26px;width:3px;
  border-radius:2px;background:var(--soft2)}
.pnode{position:relative;display:flex;gap:14px;align-items:center;width:100%;padding:9px 0}
.pc{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  font-weight:900;font-size:19px;background:var(--soft);color:#B7B4A8;
  border:3px solid var(--bg);z-index:1;transition:.2s}
.pnode.done .pc{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px rgba(114,84,235,.7)}
.pnode.cur .pc{background:#fff;color:var(--g1);border:3px solid var(--g1);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(91,103,245,.35)}70%{box-shadow:0 0 0 14px rgba(91,103,245,0)}100%{box-shadow:0 0 0 0 rgba(91,103,245,0)}}
.pt{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:12px 14px;box-shadow:0 1px 3px rgba(22,25,43,.05)}
.pnode.cur .pt{border-color:#C9CDFB;box-shadow:0 8px 22px -12px rgba(91,103,245,.5)}
.pnode.lock .pt{opacity:.55}
.pt .tt{display:block;font-size:15px;font-weight:750;line-height:1.3}
.pt .ts{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.pt .badge{display:inline-block;margin-top:7px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px}
.badge.b-done{background:var(--ok-soft);color:var(--ok-ink)}
.badge.b-cur{background:#ECEEFE;color:var(--g1)}
.badge.b-lock{background:var(--soft);color:var(--muted)}

/* ---------- урок (оверлей) ---------- */
#lesson{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;
  animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.ltop{flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.lx{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;font-size:16px;font-weight:900;color:var(--muted)}
.lstep{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lbody{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 120px}
.lbody h1{font-family:var(--fserif);font-size:27px;line-height:1.15;font-weight:700;margin:6px 0 16px}
.lbody p{margin-bottom:12px;font-size:16px;line-height:1.58}
.lbody p b{font-weight:750}
.callout{border-radius:16px;padding:13px 15px;margin:4px 0 14px;font-size:15px;line-height:1.5}
.callout.c-idea{background:#ECEEFE;color:#2E3690}
.callout.c-warn{background:#FCF2DC;color:#7A5A10}
.callout.c-ok{background:var(--ok-soft);color:var(--ok-ink)}
/* метки частей сочинения */
.mk{padding:1px 6px;border-radius:7px;font-weight:650}
.mk-pr{background:var(--pr-bg);color:var(--pr)} .mk-ex{background:var(--ex-bg);color:var(--ex)}
.mk-po{background:var(--po-bg);color:var(--po)} .mk-sv{background:var(--sv-bg);color:var(--sv)}
.mk-pz{background:var(--pz-bg);color:var(--pz)} .mk-mn{background:var(--mn-bg);color:var(--mn)}
.mk-vy{background:var(--vy-bg);color:var(--vy)}

/* ---------- тренировка ---------- */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;
  margin-bottom:14px;box-shadow:0 2px 8px rgba(22,25,43,.05)}
.qn{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--g1);margin-bottom:8px}
.qq{font-size:15.5px;font-weight:700;line-height:1.45;margin-bottom:12px}
.qo{display:block;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--bg);font-size:14.5px;line-height:1.4;margin-bottom:8px;transition:.15s}
.qo:active{transform:scale(.99)}
.qo.correct{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink);font-weight:700}
.qo.wrong{border-color:var(--no);background:var(--no-soft);color:var(--no-ink);animation:shake .3s}
.qo.faded{opacity:.45;pointer-events:none}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.qexp{font-size:14px;line-height:1.5;border-radius:13px;padding:11px 13px;margin-top:4px;
  background:var(--ok-soft);color:var(--ok-ink);display:none}
.qexp.show{display:block;animation:rise .25s}
.qdone{color:var(--ok-ink);font-weight:800;font-size:13px}
/* мини-письмо */
.mw textarea{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);
  padding:12px;font-family:inherit;font-size:15px;line-height:1.5;color:var(--ink);outline:none;resize:vertical}
.mw textarea:focus{border-color:#B9BFF9}
.sample{display:none;margin-top:10px;border-left:3px solid var(--g1);background:#ECEEFE;color:#2E3690;
  border-radius:0 13px 13px 0;padding:11px 13px;font-size:14.5px;line-height:1.5}
.sample.show{display:block;animation:rise .25s}
.lfoot{padding:16px 18px calc(16px + var(--safe-b));background:linear-gradient(transparent,var(--bg) 30%)}

/* ---------- эталон ---------- */
.legend{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 16px}
.lg{font-size:12px;font-weight:800;padding:6px 11px;border-radius:99px;border:1.5px solid transparent}
.lg.dim{opacity:.35}
.etalon{font-family:var(--fserif);font-size:17px;line-height:1.72}
.etalon .mk{border-radius:5px;padding:0 3px;transition:.2s}
.etalon.f .mk{background:transparent;color:inherit}
.etalon.f .mk.hot{background:var(--hotbg);color:var(--hotc)}

/* ---------- конструктор ---------- */
.blk{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.blk .bh{display:flex;align-items:center;gap:10px;margin-bottom:3px}
.blk .bnum{flex:none;width:25px;height:25px;border-radius:8px;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:900}
.blk .bt{font-size:15.5px;font-weight:800}
.blk .bhint{font-size:12.5px;color:var(--muted);line-height:1.35;margin:0 0 10px 35px}
.blk textarea{width:100%;min-height:82px;border:1.5px solid var(--line);border-radius:13px;background:var(--bg);
  padding:11px;font-family:inherit;font-size:15px;line-height:1.5;color:var(--ink);outline:none;resize:none;overflow:hidden}
.blk textarea:focus{border-color:#B9BFF9}
.blk textarea::placeholder{color:#B9B6AC}
.cliche{display:flex;flex-direction:column;gap:6px;padding:9px 0 2px}
.cl{width:100%;text-align:left;font-size:13px;font-weight:700;color:var(--g1);background:#ECEEFE;
  padding:9px 12px;border-radius:12px;white-space:normal;line-height:1.35}
.cl:active{transform:scale(.98)}

/* ---------- редактор ---------- */
.wtop{flex:none;padding:12px 16px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.wtopic{font-size:14px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wmeta{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:99px;background:var(--soft);color:var(--muted)}
.chip.on{background:#ECEEFE;color:var(--g1)}
.chip.bad{background:var(--no-soft);color:var(--no-ink)}
.chip.good{background:var(--ok-soft);color:var(--ok-ink)}
#ta{flex:1;min-height:0;width:100%;padding:16px;border:0;outline:0;resize:none;background:var(--bg);color:var(--ink);
  font-family:var(--fserif);font-size:17.5px;line-height:1.62}
.wfoot{flex:none;display:flex;gap:9px;padding:10px 16px calc(12px + var(--safe-b));background:var(--card);border-top:1px solid var(--line)}
.wfoot .btn{flex:1;padding:13px}

/* ---------- шторка ---------- */
#modal:empty{display:none}
.sheet{position:fixed;inset:0;background:var(--veil);display:flex;align-items:flex-end;z-index:60}
.sheet-in{width:100%;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;
  padding:8px 16px calc(22px + var(--safe-b));animation:rise .25s}
.grab{width:44px;height:5px;border-radius:3px;background:var(--soft2);margin:8px auto 14px}
.crit{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--card);border:1px solid var(--line);
  border-radius:15px;margin-bottom:8px}
.crit input{width:21px;height:21px;accent-color:var(--g1);flex:none}
.crit .ct{flex:1;font-size:14px;font-weight:600;line-height:1.35}
.crit .cp{flex:none;font-size:13px;font-weight:900;color:var(--muted)}
.score{font-size:16.5px;font-weight:800;text-align:center;padding:13px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);margin:6px 0 12px}
.aibox{white-space:pre-wrap;font-size:14.5px;line-height:1.55;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:14px;margin-top:10px}
input.field{width:100%;padding:13px 14px;border-radius:15px;border:1.5px solid var(--line);background:var(--card);
  font-family:inherit;font-size:16px;color:var(--ink);outline:none}
input.field:focus{border-color:#B9BFF9}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:15px}
.del{flex:none;width:34px;height:34px;border-radius:11px;background:var(--soft);display:grid;place-items:center;color:var(--muted);font-weight:900}
/* тост и конфетти */
#toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:11px 18px;border-radius:99px;
  opacity:0;pointer-events:none;transition:.25s;z-index:80;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
.cf{position:fixed;top:-20px;font-size:22px;z-index:90;pointer-events:none;transition:transform 1.6s cubic-bezier(.2,.6,.3,1),opacity 1.6s}
</style>
</head>
<body>
<div id="app">
  <main>
    <section class="scene on" id="s-path"><div id="pathList"></div></section>
    <section class="scene" id="s-topics"><div id="topicsList"></div></section>
    <section class="scene" id="s-write">
      <div class="wtop">
        <div class="wtopic" id="wTopic"></div>
        <div class="wmeta">
          <span class="chip" id="wWords">0 слов</span>
          <button class="chip" id="wTimer" onclick="toggleTimer()"><svg class="ic" style="width:13px;height:13px" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> таймер</button>
          <span class="chip" id="wMode"></span>
        </div>
      </div>
      <textarea id="ta" placeholder="Пиши здесь. Черновик сохраняется сам…" oninput="onType()"></textarea>
      <div class="wfoot">
        <button class="btn ghost" onclick="openFrame()">Каркас</button>
        <button class="btn grad" onclick="openCheck()">Проверить</button>
      </div>
    </section>
    <section class="scene" id="s-mine"><div id="mineList"></div></section>
    <section class="scene" id="s-more"><div id="moreList"></div></section>
  </main>
  <nav class="tabs">
    <button class="tab on" id="t-path" onclick="go('path')"><span class="ti"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12.5V17c0 1.66 2.69 3 6 3s6-1.34 6-3v-4.5"/></svg></span><span class="tl">Школа</span></button>
    <button class="tab" id="t-topics" onclick="go('topics')"><span class="ti"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span><span class="tl">Темы</span></button>
    <button class="tab" id="t-write" onclick="go('write')"><span class="ti"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span><span class="tl">Письмо</span></button>
    <button class="tab" id="t-mine" onclick="go('mine')"><span class="ti"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span><span class="tl">Мои</span></button>
    <button class="tab" id="t-more" onclick="go('more')"><span class="ti"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></span><span class="tl">Ещё</span></button>
  </nav>
  <div id="lesson"></div>
  <div id="modal"></div>
  <div id="toast"></div>
</div>

<script>
/* ==================== ШКОЛА: уроки с нуля ==================== */
/* mk(): подсветка части сочинения её фирменным цветом */
const PARTS = {
  pr:['Проблема','var(--pr)','var(--pr-bg)'], ex:['Пример','var(--ex)','var(--ex-bg)'],
  po:['Пояснение','var(--po)','var(--po-bg)'], sv:['Связь','var(--sv)','var(--sv-bg)'],
  pz:['Позиция автора','var(--pz)','var(--pz-bg)'], mn:['Моё мнение','var(--mn)','var(--mn-bg)'],
  vy:['Вывод','var(--vy)','var(--vy-bg)'],
};

const REF = [{"t": "Полный банк клише для сочинения ЕГЭ", "icon": "msg", "min": 5, "html": "<p>Клише — это каркас, а не готовое сочинение. Эксперт видит шаблон мгновенно, но снижает балл не за сам шаблон, а за пустоту внутри него. Правило простое: <b>клише + конкретика из текста</b> = рабочая фраза. Берите заготовку, но всегда достраивайте её словами именно вашего исходного текста.</p><div class=\"h2\">Клише для вступления и формулировки проблемы</div><p>— В предложенном для анализа тексте (ФИО автора) поднимает проблему…<br>— Что такое (милосердие, мужество, память)? Над этим вопросом размышляет автор.<br>— Текст (ФИО) заставил меня задуматься над сложной проблемой…<br>— Автор предлагает читателю задуматься: (вопрос по тексту)?<br>— В центре внимания автора — проблема…<br>— (ФИО) ставит перед читателем важный вопрос: …<br>— Почему (люди совершают предательство / важно беречь природу)? Именно эту проблему рассматривает автор.<br>— Проблема, поднятая автором, особенно актуальна сегодня, потому что…<br>— Как следует относиться к (памяти о войне, родному языку)? Таким вопросом задаётся (ФИО).</p><p><b>Напутствие:</b> формулируйте проблему вопросом — так труднее ошибиться и легче связать с позицией автора. Не начинайте с глобальных банальностей («Испокон веков люди задумывались…») — сразу к тексту.</p><div class=\"h2\">Переход к комментарию</div><p>— Раскрывая проблему, автор обращается к…<br>— Чтобы привлечь внимание читателя к этому вопросу, (ФИО) рассказывает о…<br>— Размышляя над проблемой, автор описывает…<br>— Проследим, как автор раскрывает поставленный вопрос.</p><div class=\"h2\">Ввод первого примера</div><p>— В начале текста автор обращает внимание на… (предложения №…)<br>— Автор не случайно описывает эпизод, в котором…<br>— Писатель знакомит нас с героем, который…<br>— Обратимся к фрагменту, где рассказчик…<br>— Особого внимания заслуживает сцена…<br>— Автор подчёркивает: «(короткая цитата)».<br>— В предложениях №… показано, как…</p><div class=\"h2\">Ввод второго примера</div><p>— Далее автор обращает внимание читателя на…<br>— Продолжая размышление, (ФИО) приводит…<br>— Не менее важен для понимания проблемы эпизод, в котором…<br>— Также автор описывает…<br>— Затем писатель показывает, что…<br>— Кроме того, автор упоминает о…<br>— Развивая мысль, (ФИО) рассказывает о…</p><p><b>Напутствие:</b> пример — это не пересказ. Одно-два предложения о том, ЧТО в тексте, и обязательно ссылка на номера предложений или короткая цитата. Пересказ длиннее трёх предложений — сигнал эксперту, что вы льёте воду.</p><div class=\"h2\">Пояснение к примерам</div><p>— Этот пример показывает, что…<br>— Так автор даёт понять читателю: …<br>— Данный эпизод свидетельствует о том, что…<br>— Автор убеждает нас в том, что…<br>— Этот фрагмент помогает понять…<br>— Поступок героя говорит о…<br>— Становится очевидно, что…</p><p><b>Напутствие:</b> пояснение отвечает на вопрос «зачем автор это рассказал?». Если ваше пояснение можно приставить к любому тексту — оно пустое. Проверяйте: в пояснении должны быть слова из вашей формулировки проблемы.</p><div class=\"h2\">Связь между примерами</div><p><b>Противопоставление:</b><br>— Противопоставляя эти примеры, автор показывает…<br>— Эти эпизоды контрастны: если в первом…, то во втором…<br>— Сравнение противоположных поступков героев позволяет увидеть…</p><p><b>Дополнение:</b><br>— Второй пример дополняет первый, и вместе они дают понять…<br>— Оба примера, дополняя друг друга, доказывают…<br>— Эти эпизоды раскрывают разные стороны одной проблемы: …</p><p><b>Причина — следствие:</b><br>— Первый эпизод объясняет причину того, о чём говорится во втором: …<br>— Именно поэтому (следствие из второго примера)…<br>— Второй пример показывает, к чему привело описанное в первом: …</p><p><b>Сравнение:</b><br>— Сопоставляя эти ситуации, автор подводит читателя к мысли…<br>— Сходство этих эпизодов в том, что…<br>— И в первом, и во втором случае герои…, что говорит о…</p><p><b>Напутствие:</b> назвать тип связи мало — её нужно <b>проанализировать</b>: объяснить, что даёт читателю именно такое соединение примеров. Одна фраза «примеры дополняют друг друга» без расшифровки не засчитывается.</p><div class=\"h2\">Позиция автора</div><p>— Позиция автора выражена ясно: он считает, что…<br>— Автор подводит читателя к выводу: …<br>— (ФИО) убеждён: …<br>— Авторская позиция такова: …<br>— Писатель открыто выражает своё отношение к проблеме: …<br>— Хотя позиция автора не заявлена прямо, мы понимаем: …</p><p><b>Напутствие:</b> позиция автора — это ответ на вопрос-проблему из вступления. Проверьте их стыковку: вопрос «почему…?» — ответ «потому что…».</p><div class=\"h2\">Своё отношение</div><p>— Я согласен с автором: действительно, …<br>— Трудно не согласиться с (ФИО), ведь…<br>— Мне близка позиция автора, потому что…<br>— Разделяя точку зрения автора, добавлю: …<br>— Автор прав: …<br>— Моя позиция совпадает с авторской: я убеждён, что…</p><div class=\"h2\">Обоснование: литература и жизнь</div><p>— Подтверждение этой мысли можно найти в русской литературе. Так, в романе Л. Н. Толстого «Война и мир»…<br>— Вспомним героя повести А. С. Пушкина «Капитанская дочка» Петра Гринёва, который…<br>— Эта мысль подтверждается и жизненным опытом: …<br>— История знает немало примеров, когда…<br>— О том же свидетельствуют события, очевидцами которых мы становимся: …</p><p><b>Напутствие:</b> обоснование не обязано быть литературным — подойдёт история, наука, личный опыт. Литературный аргумент с фактической ошибкой хуже честного жизненного примера. Не уверены в имени героя или сюжете — не пишите.</p><div class=\"h2\">Вывод</div><p>— Таким образом, автор убеждает нас в том, что…<br>— В заключение хочется сказать: …<br>— Подводя итог, отмечу: …<br>— Итак, прочитанный текст помог мне утвердиться в мысли…<br>— Текст (ФИО) заставляет каждого из нас задуматься о…</p><p><b>Напутствие:</b> вывод — это кольцо: он возвращается к проблеме из вступления, но другими словами. Не вводите в финале новых мыслей и не копируйте формулировку позиции автора дословно. Два-три предложения — достаточно.</p>"}, {"t": "Банк литературных аргументов: 20 произведений для сочинения ЕГЭ", "icon": "book", "min": 6, "html": "<p>Литературный пример в К4 не обязателен, но это самый надёжный способ обосновать позицию. Правило: не пересказывайте сюжет, а называйте <b>конкретного героя и конкретный поступок</b> и сразу делайте вывод, связанный с тезисом. Ниже — 20 проверенных произведений.</p><div class=\"h2\">Война, подвиг, нравственный выбор</div><p><b>Л. Толстой, «Война и мир»</b>. Роман-эпопея о судьбах людей в эпоху войн с Наполеоном. Проблемы: истинный и ложный героизм, война, смысл жизни, семья. Ссылайтесь: скромный капитан <b>Тушин</b> держит батарею без приказа; <b>Наташа Ростова</b> отдаёт подводы раненым, жертвуя имуществом семьи; князь Андрей под небом Аустерлица понимает ничтожность славы.</p><p><b>М. Шолохов, «Судьба человека»</b>. Рассказ о шофёре Андрее Соколове, прошедшем плен и потерявшем семью. Проблемы: стойкость, война, милосердие, сила духа. Эпизод: в плену Соколов отказывается пить за победу немецкого оружия и не закусывает после стакана — <b>Мюллер</b> отпускает его, признав достоинство солдата; после войны герой усыновляет сироту <b>Ванюшу</b>.</p><p><b>Б. Васильев, «А зори здесь тихие…»</b>. Пять девушек-зенитчиц и старшина Васков вступают в бой с немецкими диверсантами. Проблемы: война и женщина, подвиг, цена победы. Эпизод: гибель <b>Жени Комельковой</b>, уводящей врагов от раненой Риты Осяниной, — пример самопожертвования.</p><p><b>В. Быков, «Сотников»</b>. Два партизана попадают в плен; один принимает смерть, другой предаёт. Проблемы: выбор, предательство, совесть, цена жизни. Ссылайтесь: больной <b>Сотников</b> идёт на казнь, не выдав никого, а <b>Рыбак</b> ради спасения становится полицаем и не может жить с этим.</p><p><b>В. Быков, «Обелиск»</b>. Повесть об учителе Алесе Морозе. Проблемы: учитель, подвиг, долг, память. Эпизод: <b>Мороз</b> добровольно приходит к оккупантам, чтобы разделить участь арестованных учеников, и гибнет — учительство как служение до конца.</p><div class=\"h2\">Милосердие, сострадание, праведничество</div><p><b>А. Пушкин, «Капитанская дочка»</b>. История Петра Гринёва в годы пугачёвского бунта. Проблемы: честь, милосердие, долг, любовь. Эпизоды: подаренный вожатому <b>заячий тулуп</b> возвращается спасённой жизнью; Гринёв отказывается присягнуть Пугачёву — «береги честь смолоду».</p><p><b>Ф. Достоевский, «Преступление и наказание»</b>. Роман о студенте, проверившем на себе теорию о «праве сильного». Проблемы: совесть, ложная идея, сострадание, раскаяние. Ссылайтесь: <b>Соня Мармеладова</b> жертвует собой ради семьи и ведёт Раскольникова к покаянию; крах теории доказывает: преступление разрушает прежде всего самого человека.</p><p><b>А. Солженицын, «Матрёнин двор»</b>. Рассказ о праведнице из русской деревни. Проблемы: бескорыстие, доброта, праведничество, равнодушие окружающих. Эпизод: <b>Матрёна</b> всем помогает даром и гибнет на переезде, помогая перевозить собственную горницу, отданную воспитаннице.</p><p><b>А. Платонов, «Юшка»</b>. Рассказ о кротком помощнике кузнеца, которого все обижают. Проблемы: доброта, жестокость толпы, скрытое добро. Эпизод: после смерти <b>Юшки</b> выясняется, что он годами содержал сироту; выучившись на врача, она бесплатно лечит жителей города.</p><p><b>К. Паустовский, «Телеграмма»</b>. Рассказ о дочери, забывшей старую мать. Проблемы: отношение к родителям, запоздалое раскаяние, равнодушие. Эпизод: <b>Настя</b> занята делами в Ленинграде и приезжает в село уже после похорон <b>Катерины Петровны</b> — «за добро плати добром».</p><p><b>В. Распутин, «Уроки французского»</b>. Автобиографичный рассказ о голодном послевоенном детстве. Проблемы: учитель, доброта, милосердие вопреки правилам. Эпизод: <b>Лидия Михайловна</b> играет с учеником на деньги, чтобы он мог купить еду; уволенная, присылает посылку с макаронами и яблоками.</p><div class=\"h2\">Смысл жизни, мечта, деградация</div><p><b>М. Горький, «Старуха Изергиль»</b>. Романтические легенды о двух типах отношения к людям. Проблемы: подвиг ради людей, эгоизм, свобода. Ссылайтесь: <b>Данко</b> вырывает сердце, чтобы осветить людям путь; <b>Ларра</b> за гордыню обречён на вечное одиночество.</p><p><b>А. Чехов, «Ионыч»</b>. История духовной деградации земского врача. Проблемы: деградация личности, пошлость среды, утрата идеалов. Эпизод: энергичный <b>Старцев</b> за несколько лет превращается в обрюзгшего стяжателя, пересчитывающего купюры по вечерам.</p><p><b>А. Чехов, «Крыжовник»</b>. Рассказ о чиновнике, подчинившем жизнь мещанской мечте. Проблемы: ложная цель, футлярность, равнодушие к чужой беде. Эпизод: <b>Николай Иваныч</b> всю жизнь копит на усадьбу и счастлив кислым крыжовником; авторская мысль о «человеке с молоточком», напоминающем счастливым о несчастных.</p><p><b>И. Гончаров, «Обломов»</b>. Роман о добром, но апатичном барине. Проблемы: лень и бездеятельность, мечта и её подмена, дружба. Ссылайтесь: <b>Обломов</b> губит талант и любовь к <b>Ольге Ильинской</b> в бездействии; деятельный <b>Штольц</b> — контраст, но не спасение для друга.</p><p><b>Дж. Лондон, «Мартин Иден»</b>. Роман о матросе, ставшем писателем силой самообразования. Проблемы: мечта и труд, самовоспитание, цена успеха, разочарование. Эпизод: <b>Мартин</b> работает над собой по 19 часов в сутки; добившись славы, видит, что общество ценит не его, а его имя.</p><p><b>И. Тургенев, «Отцы и дети»</b>. Роман о конфликте поколений и крахе нигилизма. Проблемы: отцы и дети, любовь, испытание идеи. Эпизод: отрицавший чувства <b>Базаров</b> влюбляется в <b>Одинцову</b> — жизнь оказывается сложнее теории.</p><div class=\"h2\">Природа, память, культура</div><p><b>В. Астафьев, «Царь-рыба»</b>. Повествование о человеке и сибирской природе. Проблемы: природа, браконьерство, совесть. Эпизод: рыбак <b>Игнатьич</b> оказывается в воде на одних крючках с огромным осетром и, каясь в грехах, просит у жизни прощения — природа судит человека.</p><p><b>В. Распутин, «Прощание с Матёрой»</b>. Повесть о деревне, затопляемой ради ГЭС. Проблемы: память, малая родина, цена прогресса, связь поколений. Эпизод: старуха <b>Дарья</b> белит избу перед затоплением и защищает кладбище предков от «санитарной бригады».</p><p><b>Р. Брэдбери, «451° по Фаренгейту»</b>. Антиутопия об обществе, где книги сжигают. Проблемы: книга и культура, массовое общество, прозрение. Эпизод: пожарный <b>Гай Монтэг</b> после встречи с <b>Клариссой</b> начинает читать и уходит к людям, заучивающим книги наизусть.</p><div class=\"h2\">Как вводить аргумент</div><p>— Формула: тезис — «вспомним героя...» — поступок в 1-2 предложениях — микровывод, повторяющий тезис другими словами.</p><p>— Одно произведение закрывает 3-4 проблемы: «Капитанскую дочку» и «Войну и мир» держите как универсальный резерв.</p><p>— Не уверены в имени второстепенного героя или детали — опустите её: фактическая ошибка снимает балл по К12.</p>"}, {"t": "Каталог проблем по блокам", "icon": "layers", "min": 6, "html": "<p>Проблема в сочинении ЕГЭ формулируется вопросом, а позиция автора — прямым ответом на этот же вопрос. Ниже — банк готовых пар «проблема + позиция» по двенадцати частотным блокам. Позицию всегда сверяйте с конкретным текстом: формулировки ниже — типовые, их нужно уточнять под авторскую мысль.</p><div class=\"h2\">Война и человек</div><p>— <b>Как война влияет на человека?</b> Позиция: война ломает привычную жизнь, но проявляет истинную сущность человека — трусость одних и стойкость других.<br>— <b>Что помогает человеку выстоять на войне?</b> Позиция: выстоять помогают чувство долга, товарищество и память о доме.<br>— <b>Допустимо ли сохранять человечность на войне?</b> Позиция: даже на войне человек обязан оставаться человеком — милосердие к пленному и слабому не слабость, а нравственная победа.</p><div class=\"h2\">Историческая память</div><p>— <b>Почему важно хранить память о прошлом?</b> Позиция: народ, забывший своё прошлое, лишается будущего, поэтому память — нравственный долг живых.<br>— <b>В чём наш долг перед павшими?</b> Позиция: долг живых — помнить погибших и передавать эту память детям.<br>— <b>Как связаны память и совесть?</b> Позиция: память — основа совести: беспамятный человек способен на предательство.</p><div class=\"h2\">Природа и человек</div><p>— <b>Как деятельность человека влияет на природу?</b> Позиция: потребительское отношение к природе разрушает и её, и самого человека.<br>— <b>Что даёт человеку общение с природой?</b> Позиция: природа исцеляет душу, учит видеть красоту и чувствовать себя частью мира.<br>— <b>В чём проявляется ответственность человека перед природой?</b> Позиция: человек — не хозяин, а часть природы, поэтому обязан беречь всё живое.</p><div class=\"h2\">Милосердие и равнодушие</div><p>— <b>Почему опасно равнодушие?</b> Позиция: равнодушие — душевная смерть; оно развязывает руки злу.<br>— <b>Что побуждает человека помогать другим?</b> Позиция: истинное милосердие бескорыстно и не ждёт благодарности.<br>— <b>Может ли доброта изменить человека?</b> Позиция: доброта, проявленная к человеку, пробуждает в нём ответное добро и веру в людей.</p><div class=\"h2\">Учитель и наставничество</div><p>— <b>Какова роль учителя в жизни человека?</b> Позиция: настоящий учитель формирует не только знания, но и личность, и его влияние ощущается всю жизнь.<br>— <b>Каким должен быть настоящий учитель?</b> Позиция: настоящего учителя отличают любовь к детям, справедливость и личный нравственный пример.<br>— <b>За что мы благодарны своим наставникам?</b> Позиция: благодарность наставнику — это память о его уроках и жизнь по его нравственным заветам.</p><div class=\"h2\">Семья, отцы и дети</div><p>— <b>В чём причины конфликта поколений?</b> Позиция: конфликт рождается из неумения слушать друг друга, а преодолевается любовью и уважением.<br>— <b>Какова роль детства и семьи в становлении личности?</b> Позиция: именно в семье закладываются нравственные основы, определяющие всю дальнейшую жизнь.<br>— <b>В чём проявляется родительская любовь и наш долг перед родителями?</b> Позиция: родительская любовь жертвенна, и долг детей — отвечать на неё вниманием, пока не стало поздно.</p><div class=\"h2\">Дружба и любовь</div><p>— <b>Что такое настоящая дружба?</b> Позиция: настоящая дружба проверяется бедой и требует самоотдачи, а не выгоды.<br>— <b>Какова сила любви?</b> Позиция: подлинная любовь преображает человека и способна спасти его в самые тяжёлые минуты.<br>— <b>Почему предательство разрушает отношения?</b> Позиция: предательство убивает доверие, без которого невозможны ни дружба, ни любовь.</p><div class=\"h2\">Честь, совесть, выбор</div><p>— <b>Что значит жить по совести?</b> Позиция: жить по совести — поступать честно даже тогда, когда никто не видит и не осудит.<br>— <b>Как человек проявляет себя в ситуации нравственного выбора?</b> Позиция: именно трудный выбор обнажает подлинную сущность человека.<br>— <b>Можно ли оправдать бесчестный поступок обстоятельствами?</b> Позиция: обстоятельства не оправдывают подлость — честь либо есть, либо её нет.</p><div class=\"h2\">Мечта и цель</div><p>— <b>Какую роль играет мечта в жизни человека?</b> Позиция: мечта придаёт жизни смысл и заставляет двигаться вперёд.<br>— <b>Что помогает человеку достичь цели?</b> Позиция: цели достигает тот, кто соединяет мечту с трудом и упорством.<br>— <b>Все ли средства хороши для достижения цели?</b> Позиция: цель, достигнутая бесчестным путём, обесценивается.</p><div class=\"h2\">Искусство и книга</div><p>— <b>Какова роль искусства в жизни человека?</b> Позиция: настоящее искусство пробуждает чувства, утешает и делает человека лучше.<br>— <b>Что даёт человеку чтение?</b> Позиция: книга воспитывает душу, расширяет опыт и учит понимать людей.<br>— <b>Почему настоящее искусство бессмертно?</b> Позиция: подлинное искусство говорит о вечном и потому нужно каждому поколению.</p><div class=\"h2\">Язык и культура</div><p>— <b>Почему нужно беречь родной язык?</b> Позиция: язык — душа народа, и небрежность к нему ведёт к оскудению культуры.<br>— <b>Как речь характеризует человека?</b> Позиция: речь — зеркало внутреннего мира: по слову судят о культуре и нравственности говорящего.<br>— <b>Чем опасно засорение языка?</b> Позиция: грубость и штампы в речи обедняют мышление и разрушают общение.</p><div class=\"h2\">Наука и технологии</div><p>— <b>Несёт ли учёный ответственность за свои открытия?</b> Позиция: учёный отвечает за то, как его открытие послужит людям — добру или разрушению.<br>— <b>Как технологии меняют жизнь человека?</b> Позиция: техника облегчает жизнь, но не должна подменять живое общение и духовные ценности.<br>— <b>Может ли прогресс заменить нравственность?</b> Позиция: без нравственности прогресс опасен, поэтому развитие техники должно сопровождаться развитием души.</p><div class=\"h2\">Как быстро опознать блок по тексту</div><p>— Смотрите на <b>тип текста</b>: художественный фрагмент о бое, госпитале, тыле — «война»; публицистика с «мы должны», «наш долг» — чаще «память», «язык», «природа».<br>— Ищите <b>лексические маркеры</b>: памятник, поколение, забвение — «историческая память»; урок, класс, благодарность — «учитель»; мать, отец, письмо домой — «семья».<br>— Определите <b>главное событие</b>: кто-то помог или прошёл мимо — «милосердие и равнодушие»; герой решает, как поступить, — «выбор, совесть».<br>— Проверьте <b>финал текста</b>: авторская мысль обычно сгущена в последних абзацах — итоговое обобщение почти всегда прямо называет блок.<br>— Задайте вопрос «о чём автор заставил меня задуматься?» и сверьте ответ с каталогом: совпадение ключевых слов укажет блок, а готовая пара «вопрос + позиция» станет каркасом сочинения.</p>"}, {"t": "Комментарий (К2) на 3 балла", "icon": "target", "min": 5, "html": "<p>Комментарий — критерий <b>К2</b>, самый «дорогой» содержательный критерий сочинения (3 балла — столько же дают только за орфографию К7 и пунктуацию К8): <b>3 балла</b> ставятся за два примера-иллюстрации из исходного текста, <b>пояснение к каждому</b> и <b>проанализированную смысловую связь</b> между ними. Потеряли любой из элементов — потеряли балл. Разберём каждый элемент до уровня «могу воспроизвести на экзамене».</p><div class=\"h2\">Что считается примером-иллюстрацией</div><p>Пример — это <b>конкретный фрагмент исходного текста</b>, работающий на заявленную проблему: поступок или слова героя, значимая деталь, авторское рассуждение, короткая цитата, описание, контрастная сцена. Пример всегда можно «показать пальцем»: где именно в тексте это место.</p><p>— НЕ пример: общие слова («автор приводит много ярких примеров», «в тексте есть интересные эпизоды»);<br>— НЕ пример: факты не из исходного текста (биография автора, другая книга, случай из жизни);<br>— НЕ пример: сплошной пересказ половины текста без отбора;<br>— НЕ пример: позиция автора, выданная за иллюстрацию («автор считает, что доброта важна»).</p><div class=\"h2\">Пояснение: формулы с образцами</div><p>Пояснение отвечает на вопрос: <b>зачем автор это показал</b> и что это значит для проблемы. Рабочие формулы:</p><p>— «Этот поступок показывает, что...» — Этот поступок показывает, что герой ценит человека выше собственной выгоды.<br>— «Так автор подводит читателя к мысли о том, что...» — Так автор подводит читателя к мысли о том, что равнодушие разрушительнее открытой вражды.<br>— «Деталь не случайна: она подчёркивает...» — Деталь не случайна: она подчёркивает, как война вытеснила из жизни героя всё личное.<br>— «За словами героя стоит...» — За словами героя стоит не обида, а страх оказаться ненужным.<br>— «Писатель акцентирует внимание на..., чтобы...» — Писатель акцентирует внимание на молчании матери, чтобы показать глубину её горя.<br>— «Этот эпизод раскрывает...» — Этот эпизод раскрывает истинную цену «маленького» повседневного мужества.<br>— «Автор не случайно даёт слово самому герою: в его реплике звучит...» — ...звучит запоздалое раскаяние.<br>— «Значит, по мысли автора, ...» — Значит, по мысли автора, память — это форма благодарности.</p><div class=\"h2\">Плохо / хорошо: пересказ против анализа</div><p>Пара 1. Плохо: «Гринёв подарил Пугачёву заячий тулуп, а потом Пугачёв помог ему». Это пересказ: перечислены события, но не сказано, зачем они автору. Хорошо: «Пушкин показывает, как бескорыстный жест Гринёва — подаренный вожатому тулуп — возвращается к нему спасённой жизнью: <b>добро создаёт связь</b> даже между врагами». Здесь событие превращено в мысль.</p><p>Пара 2. Плохо: «Наташа Ростова отдала подводы раненым, хотя на них хотели вывезти вещи». Хорошо: «Толстой сталкивает вещи и людей: Наташа, требуя отдать подводы раненым, интуитивно выбирает живое, и в этом выборе автор видит <b>нравственную норму</b>, а не подвиг». Разница — в слове «зачем»: анализ объясняет авторский замысел.</p><p>Пара 3. Плохо: «Сначала рассказчик описывает своё детство, потом вспоминает учительницу, потом говорит, что благодарен ей». Это пересказ композиции. Хорошо: «Рассказчик возвращается к образу учительницы из взрослой жизни — и сама дистанция во времени становится аргументом: <b>настоящее влияние человека проверяется годами</b>». Анализ извлекает смысл даже из построения текста.</p><div class=\"h2\">Связь между примерами: назвать мало — нужно проанализировать</div><p>Анализ связи = назвать её тип + объяснить, <b>что она добавляет к пониманию проблемы</b>.</p><p>— Противопоставление: «Автор противопоставляет два поступка не для контраста ради контраста: на фоне трусости одного героя выбор второго перестаёт казаться естественным — мы видим, что это волевое усилие».<br>— Причина — следствие: «Второй пример вырастает из первого: именно детская обида, показанная вначале, объясняет, почему взрослый герой не умеет доверять людям».<br>— Дополнение: «Второй пример дополняет первый: сначала автор показывает проблему в судьбе одного человека, затем — что она касается каждого; частный случай становится общим правилом».<br>— Сравнение: «Сопоставляя два похожих поступка, автор выделяет главное различие — мотив: внешне одинаковые действия оказываются нравственно противоположными».<br>— Обобщение (вывод): «От конкретной истории автор переходит к размышлению — и второй пример показывает, какой урок сам рассказчик извлёк из случившегося».<br>— Вопрос — ответ: «Первый эпизод ставит вопрос, второй даёт на него ответ поступком героя: автор доказывает мысль не рассуждением, а сюжетом».</p><div class=\"h2\">Частые ловушки</div><p>— <b>Голые примеры</b>: два фрагмента пересказаны, пояснений нет — минус баллы, даже если примеры удачные.<br>— <b>Связь одним словом</b>: «Примеры противопоставлены» — это указание, а не анализ; без объяснения смысла связи третий балл не ставится.<br>— <b>Оба примера об одном и том же</b>: две сцены, иллюстрирующие одну и ту же мысль одинаково, эксперт может засчитать как один пример. Ищите разные грани проблемы.<br>— <b>Цитата на полстраницы</b>: переписанный кусок текста — не иллюстрация, а заполнение объёма; цитируйте 1–2 строки и сразу поясняйте.<br>— Пример не по той проблеме: фрагмент есть, но он работает на другую проблему текста — балл теряется.</p><div class=\"h2\">Чек-алгоритм самопроверки: 5 вопросов</div><p>— В комментарии <b>два</b> примера, и оба взяты из исходного текста (могу указать конкретные предложения)?<br>— После каждого примера есть пояснение, отвечающее на вопрос «зачем автор это показал»?<br>— Примеры раскрывают <b>разные грани</b> заявленной проблемы, а не повторяют друг друга?<br>— Связь между примерами названа И объяснена по существу (что она даёт для понимания проблемы)?<br>— В комментарии нет чужих аргументов, длинных цитат и пересказа «просто по порядку»?</p><p>Пять «да» — комментарий претендует на 3 балла. Любое «нет» — точка доработки, найденная до эксперта, а не после.</p>"}, {"t": "Типичные ошибки: полный каталог (22 ошибки, К1–К12)", "icon": "shield", "min": 5, "html": "<p>Каждая ошибка ниже стоит реальных баллов. Формат один: как выглядит ошибка, пример, исправление. Проверяйте черновик по этому каталогу перед переписыванием набело.</p><div class=\"h2\">К1. Проблема (ошибки 1–3)</div><p>— <b>Тема вместо проблемы.</b> Ошибка: «Автор пишет о войне». Тема — это «о чём», проблема — это вопрос. Исправление: «Что помогает человеку сохранить достоинство на войне?»</p><p>— <b>Проблема не из текста.</b> Взяли «дежурную» проблему (природа, милосердие), которой в тексте нет, — по К1 ставят 0, и автоматически обнуляются К2–К4. Исправление: сформулируйте вопрос, на который отвечает именно этот текст, и проверьте, есть ли в нём ответ автора.</p><p>— <b>«Проблема о…».</b> Ошибка: «поднимается проблема о смелости». Слово «проблема» так не управляется. Исправление: «проблема смелости» (род. падеж) или вопросом: «Что такое смелость?»</p><div class=\"h2\">К2. Комментарий (ошибки 4–6)</div><p>— <b>Пересказ вместо комментария.</b> Ошибка: «Сначала герой пошёл туда, потом сказал то-то…». Исправление: короткая отсылка к эпизоду + пояснение: «Этим поступком автор показывает, что…»</p><p>— <b>Пример без пояснения.</b> Процитировали — и бросили. Исправление: после каждого примера отвечайте на вопрос «зачем автор это говорит, что это доказывает?» — минимум одно-два предложения анализа.</p><p>— <b>Нет связи между примерами или связь формальная.</b> Ошибка: «Также автор пишет…». Исправление: назовите тип связи и раскройте её: «Второй эпизод противопоставлен первому: если сначала герой молчит из страха, то теперь…»</p><div class=\"h2\">К3. Позиция автора (ошибки 7–8)</div><p>— <b>Позиция = пересказ финала.</b> Ошибка: «В конце герой уезжает». Исправление: позиция — это ответ автора на вопрос проблемы: «Автор убеждён: равнодушие близких ранит сильнее чужой жестокости».</p><p>— <b>Позиция не стыкуется с проблемой.</b> Проблема про совесть, а позиция про любовь к природе — по К3 ноль. Исправление: проверка «вопрос — ответ»: прочитайте проблему-вопрос и позицию подряд; если это не диалог, переписывайте одно из двух.</p><div class=\"h2\">К4. Собственное отношение (ошибки 9–10)</div><p>— <b>Мнение без обоснования.</b> Ошибка: «Я полностью согласен с автором». Точка. Исправление: согласие + свой аргумент: пример из литературы, истории, жизненного опыта с микровыводом.</p><p>— <b>Обоснование из исходного текста.</b> Пересказали ещё один эпизод того же текста и выдали за свой аргумент — не засчитают. Исправление: берите материал извне. Например, к проблеме нравственного выбора подходит Пётр Гринёв из «Капитанской дочки» А. С. Пушкина, отказавшийся присягнуть Пугачёву.</p><div class=\"h2\">К5. Логика и композиция (ошибки 11–13)</div><p>— <b>Нет абзацного членения.</b> Сплошное полотно или, наоборот, каждый абзац из одного предложения. Исправление: стандартная сетка — проблема, комментарий (можно двумя абзацами), позиция, своё мнение, вывод.</p><p>— <b>Логические скачки.</b> Ошибка: после комментария о милосердии вдруг абзац об экологии. Исправление: каждый новый абзац начинайте связкой с предыдущим («Именно поэтому…», «Автор не ограничивается этим примером…»).</p><p>— <b>Вывод противоречит основной части.</b> Всё сочинение доказывали, что ложь разрушает доверие, а в выводе: «Иногда обманывать можно». Исправление: вывод — сжатое повторение главной мысли, ничего нового и тем более обратного.</p><div class=\"h2\">К6 и К10. Речь (ошибки 14–17)</div><p>— <b>Канцелярит.</b> Ошибка: «Автор осуществляет поднятие вопроса о наличии равнодушия». Исправление: «Автор спрашивает, почему люди равнодушны».</p><p>— <b>Повторы.</b> Ошибка: «Автор пишет… Автор считает… Автор показывает…» в соседних предложениях. Исправление: писатель, публицист, фамилия, «он»; часть фраз перестройте без подлежащего «автор».</p><p>— <b>Навязчивое «данный».</b> Ошибка: «В данном тексте поднята данная проблема». Исправление: «этот», «такой» или просто уберите: «В тексте поднята проблема…»</p><p>— <b>Смешение стилей.</b> Ошибка: «Автор круто показал, что герой лох». Исправление: нейтральный книжный стиль: «Автор убедительно показывает слабость героя».</p><div class=\"h2\">К9. Грамматика (ошибки 18–20)</div><p>— <b>Висячий деепричастный оборот.</b> Ошибка: «Читая текст, возникает чувство тревоги» (чувство не читает). Исправление: «Читая текст, я испытываю тревогу» — действие оборота и подлежащее принадлежат одному лицу.</p><p>— <b>«Те, кто был…, был».</b> Ошибка: «Те, кто прошёл войну, знает цену миру». Исправление: «те… знают» (мн. ч.), при этом «кто прошёл» — ед. ч. Проверяйте обе части конструкции.</p><p>— <b>Нарушение управления.</b> Ошибка: «уверенность в победу», «оплатить за проезд», «указать о недостатках». Исправление: «уверенность в победе», «оплатить проезд», «указать на недостатки».</p><div class=\"h2\">К11. Этика (ошибка 21)</div><p>— <b>Грубость об авторе или героях.</b> Ошибка: «Автор несёт чушь», «герой — тупой эгоист». Даже при несогласии — 0 по К11. Исправление: «Трудно согласиться с автором в том, что…», «Поступок героя кажется мне эгоистичным».</p><div class=\"h2\">К12. Факты (ошибка 22)</div><p>— <b>Перевраны автор, герой, сюжет.</b> Ошибка: «Раскольников из романа Толстого» (на самом деле — герой «Преступления и наказания» Ф. М. Достоевского). Любая такая неточность минусует К12. Исправление: правило одно — не уверены в фамилии автора, названии, имени героя или детали сюжета, не используйте пример вовсе: обоснование из жизненного опыта безопаснее выдуманной цитаты.</p><p>Итог: перед сдачей пройдитесь по каталогу как по чек-листу — от К1 к К12. Больше всего баллов теряют не на орфографии, а на подмене проблемы, пересказе и голом «я согласен».</p>"}, {"t": "Речь и грамотность в сочинении", "icon": "pen", "min": 5, "html": "<p>Содержание сочинения оценивают К1–К4, но больше трети баллов приносит форма: <b>К6</b> (точность и выразительность речи), <b>К7</b> (орфография), <b>К8</b> (пунктуация), <b>К9</b> (грамматические нормы), <b>К10</b> (речевые нормы). Эти баллы теряют не от незнания правил, а от переусложнённых фраз. Главный принцип: <b>чем проще предложение, тем меньше в нём ошибок</b>. Эксперт не добавит балл за «красивую» длинную фразу, но снимет за ошибку в ней.</p><div class=\"h2\">Пишите просто и точно</div><p>Рабочая норма для сочинения — предложения по <b>10–15 слов</b>. Одно предложение — одна мысль. Если фраза растянулась на три строки, разбейте её на две. Не пытайтесь звучать «по-научному»: вместо «данная проблематика находит своё отражение» пишите «эту проблему автор раскрывает». Простота — не бедность речи: К6 снижают за однообразие и повторы, а не за короткие фразы. Чередуйте синонимы: автор — писатель — публицист; говорит — утверждает — подчёркивает — убеждает; текст — фрагмент.</p><div class=\"h2\">Канцеляризмы и замены</div><p>Канцелярит делает текст мёртвым и провоцирует ошибки. Заменяйте:</p><p>— «данный текст» → «этот текст», «текст N»;<br>— «является актуальной» → «важна», «звучит остро»;<br>— «имеет место быть» → «есть», «происходит» (само выражение — ошибка);<br>— «в связи с вышесказанным» → «поэтому», «итак»;<br>— «оказывает влияние на» → «влияет на»;<br>— «находит своё отражение» → «отражается», «показан»;<br>— «хотелось бы отметить» → «отмечу» или просто начните с сути;<br>— «на сегодняшний день» → «сегодня», «сейчас».</p><div class=\"h2\">Частые речевые ошибки (К10)</div><p>Плеоназмы — лишние слова-дубли. В сочинениях чаще всего встречаются:</p><p>— «главная суть», «истинная правда», «взаимно друг с другом»;<br>— «своя автобиография», «впервые познакомился», «в конечном итоге»;<br>— «памятный сувенир», «месяц май», «период времени»;<br>— «полностью посвятить всего себя», «неожиданный сюрприз».</p><p>Степени сравнения не удваиваются: <b>«более лучше»</b>, «самый лучший» (в роли простого превосходства), «более выше» — грубые ошибки. Правильно: «лучше», «более хороший», «наилучший».</p><p>Ловушки сочетаемости: «играть роль», но «иметь значение» (не наоборот!); «одержать победу», «потерпеть поражение»; «поднять проблему» или «поставить проблему» (не «осветить вопрос проблемы»); «уделять внимание», но «придавать значение». Не путайте паронимы: «представить» (показать) — «предоставить» (дать), «одеть» (кого-то) — «надеть» (что-то), «невежа» (грубиян) — «невежда» (незнайка).</p><div class=\"h2\">Грамматические ловушки (К9)</div><p><b>Деепричастный оборот</b> требует, чтобы действие выполнял тот же субъект, что и в основной части. «Читая текст, возникает мысль» — ошибка: мысль не читает. Правильно: «Читая текст, я думаю о...» или «Когда читаешь текст, возникает мысль».</p><p><b>Однородные с разным управлением</b>: «автор любит и гордится своей страной» — ошибка, потому что «любит (что?) страну», а «гордится (чем?) страной». Правильно: «любит свою страну и гордится ею». Проверяйте: каждый глагол должен грамматически стыковаться с зависимым словом.</p><p><b>«Те, кто» и «все, кто»</b>: «кто» требует сказуемого в единственном числе («все, кто пришёл», «те, кто читал» — вариант «те, кто читали» на ЕГЭ засчитывают как ошибку), а «те» — во множественном («те... поняли»). Правильно: «Те, кто прочитал текст, поняли мысль автора».</p><p>Ещё две ловушки: «согласно» требует дательного падежа («согласно тексту», не «согласно текста»); косвенная речь без «я»: не «Автор говорит, что я убеждён», а «Автор говорит, что он убеждён».</p><div class=\"h2\">Пунктуационные зоны риска (К8)</div><p>— <b>Вводные слова</b>: «конечно», «безусловно», «по мнению автора», «во-первых» выделяются запятыми с обеих сторон. Но «однако» в начале предложения — союз, без запятой после него.<br>— <b>Причастный оборот</b>: после определяемого слова — обособляется («герой, совершивший поступок»), перед ним — нет («совершивший поступок герой»).<br>— <b>Сложные предложения</b>: запятая на стыке союзов («что, если», «и, когда»), запятая в начале придаточного с «который» («мысль, которая...», «дом, в котором...»), граница частей с «и» (если разные основы — запятая нужна).</p><p>Приём <b>«перестрой, если не уверен»</b>: сомневаетесь в знаке — не гадайте, а перепишите фразу так, чтобы сомнительное место исчезло. Не уверены в обособлении причастного оборота — замените его придаточным с «который» или разбейте на два предложения. Не знаете, как пишется слово, — подберите синоним. Это легально и спасает баллы.</p><div class=\"h2\">Финальная вычитка за 10 минут</div><p>— Минуты 1–2: прочитайте текст целиком, проверьте логику переходов между абзацами.<br>— Минуты 3–4: только орфография. Читайте медленно, слово за словом; сомнительные слова заменяйте синонимами.<br>— Минуты 5–6: только пунктуация. Найдите каждое «который», «что», «когда», каждое вводное слово и причастный оборот — проверьте запятые.<br>— Минута 7: деепричастия и однородные ряды — проверьте субъект действия и управление.<br>— Минута 8: повторы. Слово встречается в соседних предложениях — замените одно на синоним или местоимение.<br>— Минуты 9–10: фамилия автора (сверьте с исходным текстом!), кавычки в названиях, отсутствие сокращений типа «т.к.» и «др.».</p><p>Правило раздельных проходов работает потому, что мозг не умеет искать все типы ошибок одновременно. Один проход — один тип ошибок. Именно так вычитывают текст профессиональные корректоры.</p>"}, {"t": "Итоговое сочинение: полный гид", "icon": "cap", "min": 5, "html": "<div class=\"h2\">Что это и зачем</div><p>Итоговое сочинение пишут в декабре 11-го класса. Это <b>допуск к ЕГЭ</b>: без «зачёта» до экзаменов не допустят. Оценка — только «зачёт/незачёт», на баллы ЕГЭ не влияет (некоторые вузы могут учитывать сочинение дополнительно). Время — <b>3 часа 55 минут</b>. В день экзамена вы получаете <b>6 тем</b> — по две из каждого раздела закрытого банка тем: духовно-нравственные ориентиры в жизни человека; семья, общество, Отечество в жизни человека; природа и культура в жизни человека. Формулировки заранее неизвестны, но типы тем повторяются, поэтому готовиться можно и нужно.</p><div class=\"h2\">Требования и критерии</div><p>Два входных требования, без которых работу вообще не проверяют по критериям:</p><p>— <b>Объём</b>: минимум <b>250 слов</b> (считается всё, включая служебные слова). Рекомендуемый объём — <b>от 350 слов</b>. Меньше 250 — автоматический «незачёт».</p><p>— <b>Самостоятельность</b>: списывание и воспроизведение чужого текста без ссылки — «незачёт». Пересказывать шаблонные заготовки дословно тоже опасно.</p><p>Далее <b>5 критериев</b>. Критерий 1 «Соответствие теме» и критерий 2 «Аргументация. Привлечение литературного материала» — <b>обязательные</b>: «незачёт» хотя бы по одному из них — «незачёт» за всю работу. Кроме них нужен «зачёт» ещё минимум по одному из трёх: композиция и логика рассуждения; качество письменной речи; грамотность (на «незачёт» по грамотности нужно более 5 ошибок на 100 слов — это редкость).</p><div class=\"h2\">Структура сочинения</div><p>— <b>Вступление + тезис</b> (60–80 слов): подводка к теме и ваш прямой ответ на вопрос темы. Тезис — одно чёткое предложение.</p><p>— <b>Аргумент 1</b> (100–130 слов): произведение → конкретный эпизод/герой → микровывод, связывающий пример с тезисом.</p><p>— <b>Аргумент 2</b> (по желанию, но надёжнее с ним): другое произведение по той же схеме.</p><p>— <b>Вывод</b> (50–70 слов): возвращение к тезису другими словами, обобщение.</p><p>Формально достаточно <b>одного</b> литературного аргумента, но два страхуют: если один пример сочтут неубедительным, второй спасёт критерий 2.</p><div class=\"h2\">Как выбрать тему</div><p>— Переформулируйте каждую тему в <b>вопрос</b> (если она не вопрос). Тема «Согласны ли вы с тем, что доброта — признак силы?» уже готова; тему-цитату переведите в вопрос сами.</p><p>— Берите тему, к которой сразу вспоминаются <b>два произведения</b>. Красота формулировки не важна — важен ваш литературный запас.</p><p>— Избегайте тем с непонятным ключевым словом: если не можете за минуту дать определение понятия из темы — не берите её.</p><p>— Выделите в теме <b>все</b> ключевые слова: «Может ли забота о ближнем изменить человека?» — отвечать надо и про заботу, и про изменение человека, иначе «незачёт» по критерию 1.</p><div class=\"h2\">Как строить аргумент</div><p>Схема: <b>произведение → эпизод → микровывод</b>.</p><p>— Назовите автора и произведение полностью: «В романе А.С. Пушкина \"Капитанская дочка\"...».</p><p>— Возьмите <b>один конкретный эпизод или линию героя</b>, а не пересказ всего сюжета. Пересказ без анализа — типовая ошибка.</p><p>— Покажите, как герой поступает и к чему это приводит.</p><p>— Микровывод: одно-два предложения, где вы прямо связываете пример с тезисом («Этот пример показывает, что...»). Без микровывода аргумент превращается в пересказ.</p><div class=\"h2\">Универсальный список произведений</div><p>— <b>А.С. Пушкин, «Капитанская дочка»</b>: честь и долг (Гринёв), милосердие (Пугачёв милует Гринёва), любовь и верность (Маша), предательство (Швабрин). Закрывает огромное число тем.</p><p>— <b>Л.Н. Толстой, «Война и мир»</b>: поиск смысла жизни (Пьер, князь Андрей), семья (Ростовы), патриотизм, ошибки и их исправление (Наташа и Анатоль).</p><p>— <b>Ф.М. Достоевский, «Преступление и наказание»</b>: совесть, вина и раскаяние (Раскольников), самопожертвование (Соня), ложные идеи.</p><p>— <b>И.С. Тургенев, «Отцы и дети»</b>: конфликт поколений, нигилизм и его проверка жизнью (Базаров), любовь, отношение к природе и искусству.</p><p>— <b>М.А. Шолохов, «Судьба человека»</b>: война, стойкость, доброта после утрат (Андрей Соколов усыновляет Ванюшу).</p><p>— <b>А.И. Солженицын, «Матрёнин двор»</b>: бескорыстие, праведничество, равнодушие окружающих к доброму человеку.</p><p>— <b>В.Г. Распутин, «Уроки французского»</b>: доброта и помощь учителя (Лидия Михайловна), нравственный выбор, благодарность.</p><p>— <b>К.Г. Паустовский, «Телеграмма»</b>: отношение к родителям, запоздалое раскаяние (Настя и её мать Катерина Петровна).</p><p>Совет: не учите 20 книг — знайте <b>6–8 глубоко</b>, с именами героев и конкретными эпизодами.</p><div class=\"h2\">Типичные причины «незачёта»</div><p>— <b>Уход от темы</b>: ответ на «похожую», а не заданную тему. Лечится: после каждого абзаца сверяйтесь с вопросом темы.</p><p>— <b>Нет литературного аргумента</b> или пример не связан с тезисом; фактические ошибки (перепутанные имена, автор, сюжет) обесценивают аргумент. Не уверены в какой-то детали — не пишите о ней.</p><p>— <b>Меньше 250 слов</b>. Считайте слова черновика заранее; тренируйтесь писать 350+.</p><p>— <b>Пересказ вместо анализа</b>: нет микровыводов. Правило: после каждого примера — предложение «это доказывает, что...».</p><p>— <b>Списывание</b> заготовок из интернета. Шаблон структуры использовать можно, готовый текст — нельзя.</p><p>— <b>Логические разрывы</b>: тезис об одном, вывод о другом. Перечитайте: вступление и заключение должны говорить об одном и том же.</p><p>Оставьте 20–30 минут на переписывание и проверку: посчитать слова, сверить тезис с темой, проверить имена героев и грамотность.</p>"}, {"t": "Стратегия экзамена: тайминг, текст, черновик, бланк", "icon": "clock", "min": 5, "html": "<p>На ЕГЭ по русскому языку у вас 3 часа 30 минут на всю работу. Тестовая часть у подготовленного выпускника занимает 60–80 минут. Разумный план: тест — до 80 минут, сочинение (включая перенос в бланк) — около 90 минут, перенос ответов тестовой части и финальная вычитка — 20–25 минут, резерв — 10–15 минут. Главная ошибка — «зависнуть» на тесте: если задание не решается за две минуты, ставьте предположительный ответ, помечайте номер и идите дальше. Сочинение даёт до 22 первичных баллов (критерии К1–К12) — больше, чем любое отдельное тестовое задание, — оно не должно писаться впопыхах.</p><div class=\"h2\">Как распределить 90 минут на сочинение</div><p>— <b>10–12 минут</b> — два чтения текста и пометки.<br>— <b>8–10 минут</b> — формулировка проблемы, позиции автора, план комментария.<br>— <b>40–45 минут</b> — черновик по структуре.<br>— <b>20–25 минут</b> — перенос в бланк.<br>— <b>Остаток</b> — вычитка бланка.</p><p>Следите за часами в аудитории: если на черновик ушло больше 50 минут, сокращайте оставшиеся части, но перенос в бланк не ускоряйте — спешка при переписывании порождает ошибки по критериям грамотности.</p><div class=\"h2\">Работа с исходным текстом</div><p>Читайте текст <b>дважды</b>. Первое чтение — быстрое, целиком, без карандаша: понять, о чём текст и что автор чувствует. Второе чтение — медленное, с пометками прямо в КИМ (это разрешено): подчёркивайте оценочные слова автора, вопросы, повторы, места, где меняется интонация.</p><p>Проблему ищите по <b>сильным позициям</b> текста:</p><p>— <b>финал</b> — почти всегда содержит вывод или главную мысль автора;<br>— <b>первые абзацы</b> — задают тему и часто сам вопрос;<br>— <b>повторы</b> — слово или образ, к которому автор возвращается, указывает на предмет его размышлений;<br>— <b>прямые оценки и вопросы автора</b> — готовые подсказки к позиции.</p><p>Проверка: сформулируйте проблему как вопрос и убедитесь, что позиция автора — это прямой ответ на него, подтверждаемый минимум двумя фрагментами текста. Если ответа в тексте нет — вы придумали проблему, а не нашли её.</p><div class=\"h2\">Если текст непонятен</div><p>Берите <b>самую очевидную проблему</b>, а не самую оригинальную. Эксперт проверяет по тем же формулировкам, что видите вы: «главная» проблема надёжно опирается на текст, а «тонкая» может не подтвердиться комментарием — и тогда обнуляются сразу несколько критериев. Оригинальность на ЕГЭ не оценивается, точность — оценивается. Если текст художественный и смысл ускользает, идите от героя: что он делает, как автор к нему относится, что меняется к финалу. Отношение автора к герою почти всегда выводит на проблему.</p><div class=\"h2\">Черновик: по структуре, а не потоком</div><p>Не пишите сплошным текстом «как пойдёт». Сначала — короткий план: проблема-вопрос, два примера из текста с указанием фрагментов, связь между ними, позиция автора, ваше отношение с обоснованием. Затем заполняйте блоки по очереди. Так вы не потеряете обязательные элементы, за каждый из которых начисляются баллы. В черновике допустимы сокращения и стрелки — он ваш рабочий инструмент, его никто не проверяет. Если время горит, пишите в черновике полностью только сложные места (проблему, связку, позицию), а пересказ примеров — тезисно.</p><div class=\"h2\">Перенос в бланк и вычитка</div><p>Переписывайте <b>разборчиво</b>: нечитаемое слово эксперт трактует не в вашу пользу. Вычитку делайте тремя проходами: первый — орфография (проверяйте каждое «не/ни», «н/нн», окончания); второй — пунктуация (найдите каждую запятую и объясните её себе); третий — повторы слов и связность. Читайте вычитываемый текст медленно, «чужими глазами», лучше — с конца по предложениям: так мозг не достраивает знакомый текст. Исправления в бланке допустимы — аккуратно зачеркните и надпишите.</p><div class=\"h2\">Если случился ступор</div><p>— Дышите: 4 секунды вдох, 6 секунд выдох, 5–6 циклов — это физиологически снижает панику.<br>— Вернитесь к механической работе: перечитайте финал текста и выпишите одну фразу автора. Действие запускает мышление лучше, чем ожидание вдохновения.<br>— Не можете начать сочинение — начните с середины: опишите первый пример-иллюстрацию, вступление допишете потом.<br>— Помните: сочинение оценивается по критериям, а не по гениальности. Простой, правильный по структуре текст стабильно набирает высокие баллы.</p><div class=\"h2\">Чего НЕ делать</div><p>— <b>Не выпендривайтесь редкими словами.</b> Каждое слово, в значении или написании которого вы не уверены на сто процентов, — потенциальная речевая или орфографическая ошибка. Пишите просто и точно.<br>— <b>Не спорьте с автором грубо.</b> Несогласие разрешено, но только корректное: «позволю себе не согласиться», с аргументом. Формулировки вроде «автор не прав» без обоснования бьют по критерию этичности и логике.<br>— <b>Не приводите сомнительные факты.</b> Выдуманная цитата, перепутанный автор, искажённый сюжет — это фактическая ошибка и минус балл. Не уверены, кто написал произведение и как звали героя, — не используйте этот пример: обоснование собственной позиции можно построить на жизненном наблюдении или общеизвестной истории.<br>— <b>Не пересказывайте текст вместо комментария</b> и не выходите за рамки объёма. Требуемый минимум — 150 слов; писать меньше нельзя, а работа объёмом менее 70 слов вообще не проверяется. Комфортная зона — примерно 150–300 слов; растягивать текст до 400+ незачем: чем длиннее сочинение, тем выше риск ошибок по критериям грамотности.<br>— <b>Не оставляйте сочинение в черновике.</b> Черновик не проверяется. За 40 минут до конца экзамена начинайте перенос в бланк, что бы ни было недописано.</p>"}];

const DEF = { drafts: [], cur: null, aiKey: '', aiModel: '', school: {} };
let S = load();
function load(){ try{ const r = localStorage.getItem('essayapp'); if (r) return Object.assign({}, DEF, JSON.parse(r)); }catch(e){} return Object.assign({}, DEF); }
function save(){ try{ localStorage.setItem('essayapp', JSON.stringify(S)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function plu(n, f){ const a = Math.abs(n)%100, b = a%10; return n+' '+((a>10&&a<20)?f[2]:(b===1?f[0]:(b>=2&&b<=4?f[1]:f[2]))); }
function cur(){ return S.drafts.find(d => d.id === S.cur) || null; }
function words(t){ return (t||'').trim() ? t.trim().split(/\s+/).filter(w => /[А-Яа-яЁёA-Za-z0-9]/.test(w)).length : 0; }
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1800); }
function confetti(){
  const em = ['🎉','✨','💜','📝','⭐'];
  for (let i = 0; i < 26; i++){
    const d = document.createElement('div');
    d.className = 'cf'; d.textContent = em[i % em.length];
    d.style.left = (5 + Math.random()*90) + 'vw';
    document.body.appendChild(d);
    requestAnimationFrame(() => {
      d.style.transform = 'translateY(' + (60 + Math.random()*35) + 'vh) rotate(' + (Math.random()*540-270) + 'deg)';
      d.style.opacity = '0';
    });
    setTimeout(() => d.remove(), 1700);
  }
}

function doneCount(){ return SCHOOL.filter(l => S.school[l.id]).length; }
function renderPath(){
  const done = doneCount(), total = SCHOOL.length;
  const curIdx = SCHOOL.findIndex(l => !S.school[l.id]);

    '<div class="kicker">Школа сочинения</div>'+

    '<div class="pl"><span>' + plu(done, ['шаг пройден','шага пройдено','шагов пройдено']) + '</span><span>' + done + ' / ' + total + '</span></div>'+

      : '<span class="badge b-lock">Откроется после шага ' + i + '</span>';
    h += '<button class="pnode ' + state + '" onclick="openLesson(' + i + ')">'+
      '<span class="pc">' + (isDone ? '✓' : (i + 1)) + '</span>'+
      '<span class="pt"><span class="tt">' + ic(l.icon, 15) + ' ' + esc(l.t) + '</span>'+
      '<span class="ts">' + esc(l.sub) + '</span>' + badge + '</span></button>';
  });
  h += '</div>';
  h += '<div class="h2">Инструменты</div>'+
    '<button class="tile" onclick="openEtalon()"><span class="ico" style="background:var(--pr-bg);color:var(--pr)">' + ic('book', 21) + '</span>'+
    '<span class="tx"><span class="tt">Эталон с разметкой</span><span class="ts">готовое сочинение — каждая часть своим цветом</span></span><span class="chev">›</span></button>'+
    '<button class="tile" onclick="openBuilder()"><span class="ico" style="background:var(--sv-bg);color:var(--sv)">' + ic('grid', 21) + '</span>'+
    '<span class="tx"><span class="tt">Конструктор сочинения</span><span class="ts">собери по блокам с клише-подсказками</span></span><span class="chev">›</span></button>';
  h += '<div class="h2">Справочник</div>';
  REF.forEach((c, i) => {
    h += '<button class="tile" onclick="openRef(' + i + ')"><span class="ico" style="background:var(--soft)">' + ic(c.icon, 21) + '</span>'+
      '<span class="tx"><span class="tt">' + esc(c.t) + '</span></span><span class="chev">›</span></button>';
  });
  document.getElementById('pathList').innerHTML = h;
}

/* ==================== УРОК ==================== */
let L = null; /* { idx, need, got:Set } */
function openLesson(i){
  const prevDone = i === 0 || !!S.school[SCHOOL[i-1].id];
  if (!prevDone){ toast('Сначала пройди шаг ' + i); return; }
  const l = SCHOOL[i];
  L = { idx: i, need: l.drills.length, got: new Set() };
  let h = '<div class="ltop"><button class="lx" onclick="closeLesson()">✕</button>'+
    '<span class="lstep">Шаг ' + (i + 1) + ' из ' + SCHOOL.length + '</span></div>'+
    '<div class="lbody"><h1>' + ic(l.icon, 23) + ' ' + esc(l.t) + '</h1>' + l.theory;
  h += '<div class="h2">Тренировка</div>';
  l.drills.forEach((d, qi) => {
    h += '<div class="qcard" id="q' + qi + '"><div class="qn">Вопрос ' + (qi + 1) + ' из ' + l.drills.length + '</div>'+
      '<div class="qq">' + esc(d.q) + '</div>';
    d.o.forEach((o, oi) => {
      h += '<button class="qo" id="q' + qi + 'o' + oi + '" onclick="answer(' + qi + ',' + oi + ')">' + esc(o) + '</button>';
    });
    h += '<div class="qexp" id="q' + qi + 'e">' + esc(d.e) + '</div></div>';
  });
  if (l.write){
    h += '<div class="h2">Мини-письмо</div><div class="qcard mw">'+
      '<div class="qq">' + esc(l.write.task) + '</div>'+
      '<textarea placeholder="Напиши свой вариант…"></textarea>'+
      '<div style="height:9px"></div>'+
      '<button class="btn ghost" onclick="this.nextElementSibling.classList.add(\'show\');this.style.display=\'none\'">Сравнить с образцом</button>'+
      '<div class="sample"><b>Образец:</b> ' + esc(l.write.sample) + '</div></div>';
  }
  h += '</div><div class="lfoot"><button class="btn grad" id="lessonDone" disabled onclick="finishLesson()">Ответь на все вопросы ↑</button></div>';
  const el = document.getElementById('lesson');
  el.innerHTML = h; el.style.display = 'flex';
  el.querySelector('.lbody').scrollTop = 0;
  if (S.school[l.id]) unlockFinish(true);
}
function answer(qi, oi){
  const d = SCHOOL[L.idx].drills[qi];
  const btn = document.getElementById('q' + qi + 'o' + oi);
  if (oi === d.a){
    document.querySelectorAll('#q' + qi + ' .qo').forEach(b => b.classList.add('faded'));
    btn.classList.remove('faded'); btn.classList.add('correct');
    document.getElementById('q' + qi + 'e').classList.add('show');
    L.got.add(qi);
    if (L.got.size >= L.need) unlockFinish(false);
  } else {
    btn.classList.add('wrong');
    setTimeout(() => btn.classList.remove('wrong'), 450);
  }
}
function unlockFinish(already){
  const b = document.getElementById('lessonDone');
  b.disabled = false;
  b.textContent = already ? 'Шаг уже пройден — закрыть' : 'Шаг пройден! Дальше →';
}
function finishLesson(){
  const l = SCHOOL[L.idx];
  const first = !S.school[l.id];
  S.school[l.id] = 1; save();
  closeLesson();
  renderPath();
  if (first){
    confetti();
    if (doneCount() === SCHOOL.length) toast('Школа пройдена! Теперь — полное сочинение');
    else toast('Шаг ' + (L.idx + 1) + ' пройден ✓');
  }
}
function closeLesson(){ const el = document.getElementById('lesson'); el.style.display = 'none'; el.innerHTML = ''; }

/* ==================== ЭТАЛОН ==================== */
let focusPart = null;
function openEtalon(){
  let h = '<div class="ltop"><button class="lx" onclick="closeLesson()">✕</button><span class="lstep">Эталон · ~210 слов</span></div>'+
    '<div class="lbody"><h1>' + ic('book', 23) + ' Сочинение с разметкой</h1>'+
    '<p style="color:var(--muted);font-size:14px">Учебный пример по тексту о сельском учителе. Нажми на часть в легенде — она подсветится в тексте.</p>'+
    '<div class="legend" id="lgd">';
  Object.entries(PARTS).forEach(([k, v]) => {
    h += '<button class="lg" id="lg-' + k + '" style="background:' + v[2] + ';color:' + v[1] + '" onclick="focusOn(\'' + k + '\')">' + v[0] + '</button>';
  });
  h += '</div><div class="etalon" id="eta">' + ETALON_HTML + '</div>'+
    '<div style="height:16px"></div><div class="callout c-idea">Обрати внимание: пересказа почти нет — после каждого примера сразу мысль «что это показывает». Именно так выглядит анализ.</div>'+
    '</div><div class="lfoot"><button class="btn ghost" onclick="closeLesson()">Понятно</button></div>';
  const el = document.getElementById('lesson');
  el.innerHTML = h; el.style.display = 'flex';
  focusPart = null;
}
function focusOn(k){
  const eta = document.getElementById('eta');
  if (focusPart === k){ /* сброс */
    focusPart = null;
    eta.classList.remove('f');
    eta.querySelectorAll('.mk').forEach(m => m.classList.remove('hot'));
    document.querySelectorAll('.lg').forEach(b => b.classList.remove('dim'));
    return;
  }
  focusPart = k;
  eta.classList.add('f');
  eta.style.setProperty('--hotbg', PARTS[k][2]);
  eta.style.setProperty('--hotc', PARTS[k][1]);
  eta.querySelectorAll('.mk').forEach(m => m.classList.toggle('hot', m.classList.contains('mk-' + k)));
  document.querySelectorAll('.lg').forEach(b => b.classList.toggle('dim', b.id !== 'lg-' + k));
}

/* ==================== КОНСТРУКТОР ==================== */
function openBuilder(){
  let h = '<div class="ltop"><button class="lx" onclick="closeLesson()">✕</button><span class="lstep">Конструктор</span></div>'+
    '<div class="lbody"><h1>' + ic('grid', 23) + ' Собери сочинение</h1>'+
    '<p style="color:var(--muted);font-size:14px">Заполняй блоки по порядку. Нажми на клише — оно вставится в блок. Внизу всё соберётся в цельный текст.</p>';
  BLOCKS.forEach((b, i) => {
    const v = PARTS[b.k];
    h += '<div class="blk"><div class="bh"><span class="bnum" style="background:' + v[1] + '">' + (i + 1) + '</span>'+
      '<span class="bt">' + esc(b.t) + '</span></div>'+
      '<div class="bhint">' + esc(b.hint) + '</div>'+
      '<textarea id="bl' + i + '" placeholder="' + esc(b.ph) + '" oninput="autoGrow(this)"></textarea><div class="cliche">';
    b.cl.forEach((c, ci) => {
      h += '<button class="cl" onclick="addCliche(' + i + ',' + ci + ')">' + esc(c) + '</button>';
    });
    h += '</div></div>';
  });
  h += '</div><div class="lfoot"><button class="btn grad" onclick="assemble()">Собрать сочинение →</button></div>';
  const el = document.getElementById('lesson');
  el.innerHTML = h; el.style.display = 'flex';
}
function autoGrow(ta){ ta.style.height = 'auto'; ta.style.height = Math.max(82, ta.scrollHeight) + 'px'; }
function addCliche(bi, ci){
  const ta = document.getElementById('bl' + bi);
  const c = BLOCKS[bi].cl[ci];
  ta.value = ta.value ? (ta.value.replace(/\s+$/, '') + ' ' + c) : c;
  autoGrow(ta); ta.focus();
}
function assemble(){
  const parts = BLOCKS.map((b, i) => document.getElementById('bl' + i).value.trim()).filter(Boolean);
  if (!parts.length){ toast('Заполни хотя бы один блок'); return; }
  const d = { id: 'd' + Date.now(), mode: 'ege', topic: 'Сочинение из конструктора', text: parts.join('\n\n'), upd: Date.now(), ai: null };
  S.drafts.unshift(d); S.cur = d.id; save();
  closeLesson(); go('write');
  toast('Собрано! Доработай текст здесь');
}
